<script id="data" type="application/json">{"chapter": "第六章", "title": "外幣非投資型人身保險：資格條件及注意事項", "clauses": [{"no": "一", "title": "適用範圍", "official": ["人身保險業辦理以外幣收付之非投資型人身保險業務（以下簡稱本業務），應依本注意事項辦理。"], "plain": "這份規則管的是「保險公司」辦理「外幣收付、非投資型」人身保險這門業務。條文裡的「本業務」就是指這門業務。", "tip": "整份規則的主詞多半是人身保險業（公司），只有第八點把要求落到業務員的招攬行為。"}, {"no": "二", "title": "公司要符合的資格條件", "official": ["人身保險業申請辦理本業務，應符合下列資格條件：", "（一）最近一年內未有遭主管機關重大裁罰及處分者，或受處分情事已獲具體改善經主管機關認可者。", "（二）國外投資部分已採用計算風險值（Value at Risk） 評估風險，並每週至少控管乙次。", "（三）董事會中設有風險控管委員會或於公司內部設置風險控管部門及風控長或職務相當之人，並實際負責公司整體風險控管。", "（四）最近一年公平待客原則評核結果為人身保險業前百分之八十。但經人身保險業提出合理說明並經主管機關核准者，不在此限。", "前項第一款所稱重大裁罰及處分，指金融監督管理委員會處理違反金融法令重大裁罰措施之對外公布說明辦法第二條所定各款之情事。", "第一項第二款所稱之風險值，係指按週為基礎、樣本期間至少三年，或按日為基礎、樣本期間至少一年，樣本之資料至少每週更新一次，以至少百分之九十九的信賴水準計算十個交易日之風險值，且須每月進行回溯測試。"], "plain": "公司想做這門業務要過四關：沒被重罰、用風險值管國外投資、有風控組織、公平待客評核排在業界前八成。風險值（VaR）的算法條文寫得很死：資料基礎、更新頻率、信賴水準、天數、回溯測試都有固定數字。", "mnemonic": "四關「罰、險、控、客」＝裁罰、風險值、風控組織、公平待客。VaR 數字「99／10／週更／月測」＝99% 信賴水準、10 個交易日、資料每週更新、每月回溯測試。", "tip": "「重大裁罰」的內容條文本身沒列金額，是指向另一份辦法的第二條。"}, {"no": "三", "title": "收付幣別與收付方式", "official": ["訂立以外幣收付之非投資型人身保險契約時，保險人與要保人得約定保險費、保險給付、費用及其他款項收付之外幣幣別。但不得約定新臺幣與外幣或各幣別間之相互變換。", "前項保險費、保險給付、費用及其他款項之收付，保險人應與要保人事先約定收付以外匯存款戶存撥之。但保險人與要保人約定，於其他外幣保險契約所定生存保險金應給付日當日，以該生存保險金，抵繳相同幣別外幣保險契約之保險費，且該生存保險金之受益人，與所抵繳保險契約之要保人為同一人者，不在此限。"], "plain": "可以約定用哪個外幣收付，但不能約定新臺幣和外幣、或外幣和外幣之間互相變換。款項要事先約定走外匯存款戶。唯一的例外是生存保險金直接抵繳另一張保單的保費，而且要同時符合三個條件。", "mnemonic": "抵繳例外三要件「同日、同幣、同一人」＝生存保險金應給付日當日、相同幣別、受益人與被抵繳保單的要保人為同一人。", "tip": "「不得變換」是第一項的規定，沒有例外；例外只出現在第二項的「外匯存款戶存撥」。"}, {"no": "四", "title": "可經營的險種與健康險給付範圍", "official": ["人身保險業經營本業務，險種以人壽保險、年金保險及健康保險為限，並須經中央銀行許可。", "前項健康保險之給付項目，以豁免保險費或一次性給付之癌症疾病、重大疾病或特定疾病為限。", "前項所稱一次性給付，係指保險事故發生並於保險人給付保險金後，保險契約即行終止之給付型態。"], "plain": "險種只有三種：人壽、年金、健康，而且要經中央銀行許可。健康險又更窄：只能是豁免保費，或一次性給付的癌症、重大疾病、特定疾病。一次性給付的意思是賠付後契約就結束。", "mnemonic": "險種「壽、年、健」；許可找中央銀行。", "tip": "條文用「以……為限」，所以條文列舉之外的險種（例如傷害保險）不在這門業務範圍內。這是依條文文字的推論。"}, {"no": "五", "title": "資產不得兌換新臺幣", "official": ["以外幣收付之非投資型人身保險契約，其對應之一般帳簿資產不得兌換為新臺幣，且其資金運用仍應依保險法第一百四十六條之四規定辦理。"], "plain": "外幣保單對應的資產不能換成新臺幣，資金運用還是要照保險法第146條之4。", "mnemonic": "不換台幣、照146-4。", "tip": "關鍵字是「不得」。這是最容易因漏字而讀反的一條。"}, {"no": "六", "title": "不得契約轉換", "official": ["以外幣收付之非投資型人身保險契約與新臺幣收付之人身保險契約間，不得辦理契約轉換。"], "plain": "外幣非投資型保單和新臺幣收付的人身保險保單之間，不能互相轉換契約。", "mnemonic": "三個「不」一起記：不變換（三）、不兌換（五）、不轉換（六）。", "tip": "條文只寫外幣非投資型與「新臺幣收付之人身保險契約」之間不得轉換，沒有談到其他組合，不要自行延伸。"}, {"no": "七", "title": "商品送審與條款載明事項", "official": ["人身保險業辦理第一張以外幣收付之非投資型人身保險商品，應檢附符合第二點資格條件之說明文件，依保險商品銷售前程序作業準則等規定向主管機關申請核准。", "人身保險業送審該等保險商品時，除應依保險商品銷售前程序作業準則等規定檢附相關送審文件外，應併檢附該等保險商品各項交易之會計處理方式說明、外幣資產負債配置具體計畫及執行方法，及外幣資產區隔之方式。並應於要保書及保單條款載明保險費收取方式、匯款費用之負擔及匯率風險揭露等相關事宜。", "人身保險業送審以人民幣收付之非投資型人身保險商品，依前項檢附之外幣資產負債配置具體計畫及執行方式應至少包含下列項目：", "（一）資產負債配置執行之目標、策略及方法、資產配置主要考量、投資準則及資產配置規劃等。", "（二）應載明不含既有資產之預期新錢投資組合報酬率數值，且提供該數值所隱含之預期資產配置比例及各類資產預期報酬率，並據以說明該數值假設之合理性及其與商品預定利率之關聯性。", "（三）相關風險控管措施及機制，包括可投資人民幣資產之風險、人民幣資產負債配合風險及人民幣資金回流機制之風險評估及控管措施。", "（四）簽證精算人員應出具該等計畫執行具體可行之專業評估意見，後續並由公司風險管理部門持續追蹤該等計畫實際執行情形，如發現有與原計畫顯著差異情形，應由風控長或職務相當之人立即向董事長及總經理提出書面說明及改善計畫。", "人身保險業銷售以人民幣收付之非投資型人身保險商品，其自有資本與風險資本之比率應符合保險法第一百四十三條之四之規定。"], "plain": "第一張商品要向主管機關申請核准。送審除了一般文件，還要多附三件：會計處理說明、外幣資產負債配置計畫、外幣資產區隔方式。另外，要保書和保單條款要寫明三件事：保費怎麼收、匯款費用誰負擔、匯率風險。人民幣商品另有四項配置計畫要求，以及自有資本與風險資本比率要符合保險法第143條之4。", "mnemonic": "送審多附三件「帳、配、隔」＝會計處理、配置計畫、資產區隔。條款載明三事「收、付、險」＝保費收取方式、匯款費用負擔、匯率風險。核准找主管機關。", "tip": "第七點的「載明」（要保書＋保單條款，三項）和第八點的「揭露」（要保書＋商品簡介明顯處，四項）很像，請看「對照表」分頁。"}, {"no": "八", "title": "業務員資格、招攬揭露與每年揭露", "official": ["人身保險業辦理本業務，除應落實招攬人員管理、商品資訊揭露及商品適合度政策外，並應遵循下列事項：", "（一）銷售該等保險商品之業務員應通過中華民國人壽保險商業同業公會所舉辦之特別測驗，並完成資格登錄；登錄後，各人身保險業每年應為其舉辦至少一小時之匯率風險及外匯相關法規在職教育訓練課程，當年度未參加或未通過訓練者，應暫停授權其次一年度招攬該等保險商品。各人身保險業如開放保險代理人或業務往來保險經紀人從事本業務之招攬者，亦應自行參照前開原則研訂相關規範，並要求保險代理人或業務往來保險經紀人落實執行。", "（二）銷售該等保險商品時，應於招攬時揭露及說明下列事項，並由要保人及業務員於要保書及匯率風險說明書共同具簽確認：", "1.應於要保書及商品簡介明顯處揭露保險費收取方式、匯款費用之負擔及商品所涉匯率風險及商品幣別所屬國家之政治、經濟變動風險等。", "2.應提供匯率風險說明書，且應採該保險商品收付幣別最近十年內之最高、平均及最低等三種匯率情境，以視覺化方式就死亡保險給付、簽訂保險契約時收取之保險費，分別於三種匯率情境下折合新臺幣計算之金額，以及其匯兌損益之差額舉例說明。", "（三）應至少每年一次向要保人揭露該等保險商品當年度解約金、死亡保險金額及生存保險金額等給付項目折合新臺幣計算後之參考價值。其提供方式由保險人與要保人約定之。", "（四）應瞭解要保人之需求與承受匯率風險能力，銷售該等保險商品前並應建立商品適合度政策。", "前項第二款第二目之匯率風險說明書，由中華民國人壽保險商業同業公會擬訂範本報主管機關備查。"], "plain": "這一點和業務員最直接相關。業務員要先過公會特別測驗並登錄；之後每年至少上一小時匯率風險及外匯法規訓練，沒上或沒通過，公司下一年度就要暫停授權該業務員招攬這類商品。招攬時要說明並揭露費用、匯率風險、政經風險，提供「最近十年最高、平均、最低」三種情境的匯率風險說明書，並由要保人和業務員共同簽確認。每年至少一次要把解約金、死亡保險金額、生存保險金額折成新臺幣的參考價值告訴客戶。銷售前還要瞭解客戶需求與承受匯率風險的能力，公司要有商品適合度政策。", "mnemonic": "三種情境「高、均、低」，期間「十年」。每年至少「一小時」訓練、至少「一次」揭露。", "tip": "對業務員來說，漏上年度訓練的後果是「次一年度被暫停招攬外幣非投資型商品」，不只是補修而已。"}, {"no": "九", "title": "另需遵循的專業準則與規範", "official": ["人身保險業經營本業務，除應依中央銀行及主管機關相關規定辦理外，並應遵循中華民國精算學會所訂外幣保險商品精算實務處理準則及中華民國人壽保險商業同業公會所訂客戶適合度規範。"], "plain": "除了央行和主管機關的規定，還要照精算學會的精算實務處理準則，以及壽險公會的客戶適合度規範。", "mnemonic": "精算學會管「精算準則」；壽險公會管「客戶適合度」。", "tip": "這兩份文件的內容不在本條文裡，本頁沒有收錄。"}, {"no": "十", "title": "內部控制與稽核", "official": ["人身保險業辦理本業務，除應落實風險管理與內部控制及稽核制度外，並應遵循下列事項：", "（一）應將本注意事項之內容，納入內部控制及內部稽核項目，並依據保險業內部控制及稽核制度實施辦法第五條規定訂定本業務相關內部控制作業之處理程序。", "（二）應依前揭辦法第七條及第二十四條規定，由從事該等保險商品招攬、核保、理賠、精算、保全、法務及投資之業務單位每半年辦理專案自行查核。", "（三）應依前揭辦法第七條及第十八條規定，由內部稽核單位每年辦理該等保險商品招攬、核保、理賠、精算、保全、法務及投資作業之專案查核，上開稽核報告並應提報最近一次董事會通過。", "（四）內部稽核單位每年辦理查核作業之原則如下：", "1.查核各業務單位對外幣收付之非投資型保險商品開發、銷售、資訊揭露、風險告知、資金運用及外匯管理等相關法令及自律規範之遵循情形，以及該等保險商品銷售作業處理程序（含招攬人員資格及教育訓練、商品適合度政策）落實情形。", "2.查核內部控制措施時，應包括內部牽制及勾稽功能。", "3.評估各項內部控制處理程序之妥適性，並提出修正建議，以確保制度能持續有效執行。", "4.評估各業務單位每半年自行查核辦理績效。"], "plain": "公司要把這份規則放進內控與稽核。業務單位每半年自行查核一次；內部稽核單位每年專案查核一次，報告還要提報最近一次董事會通過。", "mnemonic": "「單位半年、稽核一年、報告上董事會」。", "tip": "這兩個頻率在民國115年2月5日修正過。若手上的舊講義或題目寫「每季」，以現行條文為準。"}, {"no": "十一", "title": "統計報表申報", "official": ["人身保險業應依主管機關規定之格式、內容及期限，將本業務相關統計報表向主管機關或財團法人保險事業發展中心申報，以供主管機關監理之用。"], "plain": "依主管機關規定的格式、內容、期限，把統計報表報給主管機關或保險事業發展中心。", "mnemonic": "報表「報主管機關或保發中心」。", "tip": ""}], "tables": [{"title": "三個「不得」", "head": ["條文", "不得做什麼", "備註"], "rows": [["第三點第一項", "不得約定新臺幣與外幣、或各幣別間相互變換", "可約定外幣幣別；此項沒有例外"], ["第五點", "對應的一般帳簿資產不得兌換為新臺幣", "資金運用仍依保險法第146條之4"], ["第六點", "外幣非投資型契約與新臺幣收付之人身保險契約間不得契約轉換", "只寫這個組合，不要自行延伸"]]}, {"title": "第七點「載明」vs 第八點「揭露」", "head": ["比較", "第七點（送審）", "第八點第二款第一目（招攬）"], "rows": [["動詞", "載明", "揭露"], ["地點", "要保書及保單條款", "要保書及商品簡介明顯處"], ["保險費收取方式", "有", "有"], ["匯款費用之負擔", "有", "有"], ["匯率風險", "有（匯率風險揭露）", "有"], ["商品幣別所屬國家之政治、經濟變動風險", "沒有", "有"], ["項目數", "3 項", "4 項"]]}, {"title": "數字與期限", "head": ["項目", "規定", "出處"], "rows": [["公平待客原則評核", "最近一年為人身保險業前 80%（可提合理說明，經主管機關核准）", "第二點第一項第四款"], ["沒被重罰期間", "最近一年內", "第二點第一項第一款"], ["風險值控管頻率", "每週至少控管乙次", "第二點第一項第二款"], ["風險值資料基礎", "按週：樣本至少 3 年；按日：樣本至少 1 年", "第二點第三項"], ["風險值更新／信賴水準／天數／回測", "資料至少每週更新；99%；10 個交易日；每月回溯測試", "第二點第三項"], ["業務員在職訓練", "每年至少 1 小時（匯率風險及外匯相關法規）", "第八點第一款"], ["匯率風險說明書情境", "收付幣別最近 10 年內最高、平均、最低，共 3 種", "第八點第二款第二目"], ["折合新臺幣參考價值揭露", "至少每年 1 次", "第八點第三款"], ["業務單位專案自行查核", "每半年", "第十點第二款"], ["內部稽核單位專案查核", "每年；報告提報最近一次董事會通過", "第十點第三款"], ["保險法條號", "146 條之 4（資金運用）；143 條之 4（人民幣商品自有資本與風險資本比率）", "第五點；第七點"]]}, {"title": "誰管什麼", "head": ["單位", "在本注意事項中的角色", "出處"], "rows": [["中央銀行", "許可經營本業務的險種", "第四點"], ["主管機關（金管會）", "核准第一張商品送審；備查匯率風險說明書範本；規定統計報表格式、內容、期限", "第七點；第八點；第十一點"], ["中華民國人壽保險商業同業公會", "舉辦業務員特別測驗；擬訂匯率風險說明書範本；訂客戶適合度規範", "第八點；第九點"], ["中華民國精算學會", "訂外幣保險商品精算實務處理準則", "第九點"], ["財團法人保險事業發展中心", "可受理統計報表申報（與主管機關擇一）", "第十一點"]]}], "cards": [{"id": 0, "ref": "一", "front": "「本業務」指的是什麼？", "back": "人身保險業辦理以外幣收付之非投資型人身保險業務。"}, {"id": 1, "ref": "二", "front": "公司申請辦理本業務的四項資格條件？", "back": "一、最近一年內未有遭重大裁罰及處分（或已具體改善經認可）。二、國外投資採風險值評估，每週至少控管乙次。三、設有風險控管委員會或風控部門及風控長，並實際負責整體風險控管。四、最近一年公平待客原則評核結果為業界前 80%（有例外）。"}, {"id": 2, "ref": "二", "front": "風險值（VaR）的條文定義，數字有哪些？", "back": "按週為基礎、樣本至少 3 年，或按日為基礎、樣本至少 1 年；資料至少每週更新；至少 99% 信賴水準；計算 10 個交易日的風險值；每月回溯測試。"}, {"id": 3, "ref": "二", "front": "公平待客評核不夠前 80% 一定不能辦嗎？", "back": "不是。條文有但書：經公司提出合理說明並經主管機關核准者，不在此限。"}, {"id": 4, "ref": "二", "front": "「重大裁罰及處分」在條文裡怎麼定義？", "back": "指金管會處理違反金融法令重大裁罰措施之對外公布說明辦法第二條所定各款之情事（條文本身不列金額）。"}, {"id": 5, "ref": "三", "front": "契約可以約定什麼、不可以約定什麼（幣別）？", "back": "可以約定保費、給付、費用及其他款項收付的外幣幣別；不得約定新臺幣與外幣或各幣別間之相互變換。"}, {"id": 6, "ref": "三", "front": "款項收付原則上要事先約定走什麼帳戶？", "back": "外匯存款戶存撥。"}, {"id": 7, "ref": "三", "front": "生存保險金抵繳保費的例外，要同時符合哪三點？", "back": "生存保險金應給付日當日抵繳；抵繳的是相同幣別外幣保險契約的保費；生存保險金受益人與被抵繳契約的要保人為同一人。"}, {"id": 8, "ref": "四", "front": "本業務的險種限於哪些？誰許可？", "back": "人壽保險、年金保險、健康保險；須經中央銀行許可。"}, {"id": 9, "ref": "四", "front": "健康保險的給付項目限於什麼？", "back": "豁免保險費，或一次性給付之癌症疾病、重大疾病或特定疾病。"}, {"id": 10, "ref": "四", "front": "「一次性給付」的定義？", "back": "保險事故發生並於保險人給付保險金後，保險契約即行終止之給付型態。"}, {"id": 11, "ref": "五", "front": "外幣保單對應的一般帳簿資產可以兌換新臺幣嗎？", "back": "不得兌換為新臺幣；資金運用仍應依保險法第146條之4辦理。"}, {"id": 12, "ref": "六", "front": "外幣非投資型保單可以和新臺幣收付的人身保險保單轉換契約嗎？", "back": "不得辦理契約轉換。"}, {"id": 13, "ref": "七", "front": "第一張外幣非投資型商品向誰申請？要附什麼？", "back": "向主管機關申請核准；檢附符合第二點資格條件的說明文件，並依保險商品銷售前程序作業準則等規定送審。"}, {"id": 14, "ref": "七", "front": "送審時除一般文件外，要併附哪三件？", "back": "各項交易之會計處理方式說明；外幣資產負債配置具體計畫及執行方法；外幣資產區隔之方式。"}, {"id": 15, "ref": "七", "front": "要保書及保單條款要載明哪三件事？", "back": "保險費收取方式、匯款費用之負擔、匯率風險揭露。"}, {"id": 16, "ref": "七", "front": "人民幣商品的自有資本與風險資本比率要符合哪一條？", "back": "保險法第143條之4。"}, {"id": 17, "ref": "八", "front": "業務員銷售外幣非投資型商品的資格與每年訓練要求？", "back": "通過壽險公會舉辦的特別測驗並完成資格登錄；登錄後公司每年要辦至少 1 小時匯率風險及外匯相關法規在職教育訓練。"}, {"id": 18, "ref": "八", "front": "業務員當年度沒參加或沒通過在職訓練，會怎樣？", "back": "公司應暫停授權其次一年度招攬該等保險商品。"}, {"id": 19, "ref": "八", "front": "招攬時要揭露的項目，揭露在哪裡？", "back": "在要保書及商品簡介明顯處，揭露保險費收取方式、匯款費用之負擔、商品所涉匯率風險、商品幣別所屬國家之政治與經濟變動風險。"}, {"id": 20, "ref": "八", "front": "匯率風險說明書要用哪三種情境？怎麼呈現？", "back": "收付幣別最近十年內的最高、平均、最低三種匯率；以視覺化方式，就死亡保險給付與簽約時收取的保費，分別折合新臺幣的金額，以及匯兌損益差額舉例說明。"}, {"id": 21, "ref": "八", "front": "招攬時由誰在哪些文件上共同簽確認？", "back": "要保人及業務員，在要保書及匯率風險說明書上共同具簽確認。"}, {"id": 22, "ref": "八", "front": "匯率風險說明書範本由誰擬訂、誰備查？", "back": "壽險公會擬訂範本，報主管機關備查。"}, {"id": 23, "ref": "八", "front": "每年至少一次要向要保人揭露什麼？方式誰決定？", "back": "當年度解約金、死亡保險金額、生存保險金額等給付項目折合新臺幣的參考價值；提供方式由保險人與要保人約定。"}, {"id": 24, "ref": "八", "front": "銷售前要先做哪兩件事？", "back": "瞭解要保人的需求與承受匯率風險能力；並建立商品適合度政策。"}, {"id": 25, "ref": "九", "front": "還要遵循哪兩份專業規範？", "back": "精算學會的外幣保險商品精算實務處理準則；壽險公會的客戶適合度規範。"}, {"id": 26, "ref": "十", "front": "自行查核與內部稽核的頻率？", "back": "業務單位每半年辦理專案自行查核；內部稽核單位每年辦理專案查核，報告提報最近一次董事會通過。"}, {"id": 27, "ref": "十一", "front": "統計報表向誰申報？", "back": "主管機關或財團法人保險事業發展中心。"}], "scenarios": [{"ref": "三", "q": "客戶問：「能不能在契約裡寫，將來我可以約定把收付幣別從美元換成澳幣？」業務員的正確回應是？", "opts": ["可以，只要雙方在契約裡約定即可", "不行，條文不得約定各幣別間相互變換", "可以，但要先向壽險公會報備", "可以，但只限年金保險"], "ans": 1, "why": "第三點第一項：可約定收付的外幣幣別，但不得約定新臺幣與外幣或各幣別間之相互變換。這一項沒有例外。"}, {"ref": "六", "q": "客戶持有美元非投資型保單，想「轉換」成新臺幣收付的人身保險保單，以後不用管匯率。依第六點，應如何回答？", "opts": ["可以，向保險公司申請即可", "不得辦理契約轉換", "可以，但需經中央銀行許可", "可以，但每年限一次"], "ans": 1, "why": "第六點：外幣非投資型人身保險契約與新臺幣收付之人身保險契約間，不得辦理契約轉換。"}, {"ref": "五", "q": "客戶問：「我繳美元，保險公司會不會把對應的資產換成新臺幣去運用？」依條文，下列何者正確？", "opts": ["會，條文允許自由兌換", "不會，對應的一般帳簿資產不得兌換為新臺幣", "會，但須先通知要保人", "由要保人決定"], "ans": 1, "why": "第五點：對應的一般帳簿資產不得兌換為新臺幣，且資金運用仍依保險法第146條之4辦理。"}, {"ref": "四", "q": "客戶想買外幣的「住院醫療實支實付」健康保險。依第四點對健康保險給付項目的限制，最接近正確的說明是？", "opts": ["可以，健康保險全部都在範圍內", "不在範圍內，健康險給付項目限豁免保費或一次性給付之癌症、重大疾病或特定疾病", "可以，只要不是癌症", "可以，但須提高保費"], "ans": 1, "why": "第四點第二項：健康保險給付項目以豁免保險費或一次性給付之癌症疾病、重大疾病或特定疾病為限。實支實付醫療不在列舉項目內（此為依條文文字的判斷）。"}, {"ref": "三", "q": "客戶有一張美元保單，約定其生存保險金應給付日當日，直接抵繳另一張澳幣保單的保費，且兩張保單是同一人。能適用第三點第二項的例外嗎？", "opts": ["能，因為要保人是同一人", "不能，抵繳的必須是相同幣別的外幣保險契約", "能，只要事先通知保險公司", "不能，因為生存保險金不能抵繳"], "ans": 1, "why": "例外要同時符合：應給付日當日、相同幣別、受益人與被抵繳契約要保人為同一人。美元抵澳幣，幣別不同，不符合。"}, {"ref": "八", "q": "一位業務員當年度沒有參加匯率風險及外匯相關法規的在職教育訓練。依第八點第一款，結果是什麼？", "opts": ["下次補修即可，不影響招攬", "公司應暫停授權其次一年度招攬該等保險商品", "被撤銷業務員登錄", "公司應罰款"], "ans": 1, "why": "第八點第一款：當年度未參加或未通過訓練者，應暫停授權其次一年度招攬該等保險商品。撤銷登錄與罰款不是條文寫的後果。"}, {"ref": "八", "q": "準備匯率風險說明書時，業務員要用哪組情境說明才符合條文？", "opts": ["最近三年的最高與最低匯率", "最近十年內的最高、平均、最低三種匯率", "去年同期匯率與今年匯率", "客戶自行指定的三種匯率"], "ans": 1, "why": "第八點第二款第二目：採收付幣別最近十年內之最高、平均及最低等三種匯率情境，並以視覺化方式舉例說明。"}, {"ref": "八", "q": "客戶問：「這種保單，保險公司每年一定要給我什麼資訊？」依第八點第三款，最符合的是？", "opts": ["當年度投資績效", "當年度解約金、死亡保險金額、生存保險金額折合新臺幣的參考價值", "每季的匯率走勢報告", "每月對帳單"], "ans": 1, "why": "至少每年一次揭露解約金、死亡保險金額及生存保險金額等給付項目折合新臺幣計算後的參考價值；提供方式由保險人與要保人約定。本業務是非投資型，沒有「投資績效」。"}, {"ref": "二", "q": "某公司最近一年公平待客原則評核結果在業界前 85%，其他條件都符合。依第二點，下列何者正確？", "opts": ["符合，因為門檻是前 90%", "原則上不符合，但可提出合理說明並經主管機關核准", "一定不符合，沒有例外", "只要公司規模夠大就符合"], "ans": 1, "why": "第二點第一項第四款：要前 80%，但經公司提出合理說明並經主管機關核准者，不在此限。"}, {"ref": "十", "q": "依現行第十點，業務單位與內部稽核單位對本業務的專案查核頻率分別為？", "opts": ["業務單位每季、稽核每半年", "業務單位每半年、稽核每年", "業務單位每年、稽核每季", "兩者都是每季"], "ans": 1, "why": "現行條文：業務單位每半年專案自行查核；內部稽核單位每年專案查核，報告提報最近一次董事會通過。民國115年2月5日修正前的頻率較高（自行查核為每季）。"}], "laws": [{"name": "人身保險業辦理以外幣收付之非投資型人身保險業務應具備資格條件及注意事項", "published": "民國96年8月29日", "amended": "民國115年2月5日", "docno": "金管保壽字第11504902511號令", "url": "https://law.fsc.gov.tw/LawContent.aspx?id=FL043962", "retrieved": "2026-10-30", "source": "金融監督管理委員會主管法規共用系統"}], "chNo": "06", "summary": "賣外幣保單的核心規則：公司資格、收付方式、要保書要寫什麼、招攬時怎麼揭露、匯率風險說明書、業務員每年訓練。向客戶說明外幣保單時最常用到。", "scope": "收錄第一至十一點全文。", "nav": {"prev": {"file": "ch05.html", "label": "第5章 保險業辦理國外投資管理辦法"}, "next": {"file": "ch07.html", "label": "第7章 投資型保險投資管理辦法"}}}</script>
<script>const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>{t=String(t||'');const ss=t.split(/(?<=。)/).map(x=>x.trim()).filter(Boolean);if(t.length<=90||ss.length<2&&t.indexOf('；')<0)return '<p>'+esc(t)+'</p>';
  const li=s=>{s=s.replace(/。$/,'');const m=s.match(/^([^：；]{1,40})：(.+)$/);if(m&&m[2].split('；').length>=3)return '<li><b>'+esc(m[1])+'</b><ul>'+m[2].split('；').map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></li>';
    const parts=s.split('；');if(parts.length>=3)return '<li>'+parts.map(x=>esc(x)).join('<br>')+'</li>';return '<li>'+esc(s)+'</li>'};
  return '<ul class="pl">'+ss.map(li).join('')+'</ul>'};
const factsT=f=>f?'<div class="tw"><table class="ft"><thead><tr>'+f.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+f.rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'';
const lab=x=>/^[一二三四五六七八九十]+(之[一二三四五六七八九十]+)?$/.test(x)?'第'+x+'點':/^[0-9]+(-[0-9]+)?$/.test(x)?'第'+x+'條':x;
const mem={};
const store={get(k){try{const v=localStorage.getItem(k);return v===null?mem[k]:v}catch(e){return mem[k]}},set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const BOXKEY='twlife_boxes_v2';
let boxes={};try{boxes=JSON.parse(store.get(BOXKEY)||'{}')}catch(e){boxes={}}
const saveBoxes=()=>store.set(BOXKEY,JSON.stringify(boxes));
function Flash(root,getCards){
  let queue=[],cur=null,flipped=false;
  function build(){const cs=getCards();queue=shuffle(cs.filter(c=>(boxes[c.key]||0)<1)).sort((a,b)=>(boxes[a.key]||0)-(boxes[b.key]||0));flipped=false}
  function render(){
    const cs=getCards(),n=cs.length,done=cs.filter(c=>(boxes[c.key]||0)>=1).length;
    let h='<div class="stat">已熟練 '+done+' / '+n+' 張（答對 1 次視為熟練，進度存在這個瀏覽器）</div><div class="bar"><i style="width:'+(n?done/n*100:0)+'%"></i></div>';
    if(!n){root.innerHTML=h+'<div class="card"><p>沒有可用的閃卡。</p></div>';return}
    if(!queue.length){root.innerHTML=h+'<div class="card"><h3>全部熟練了</h3><p>可以去做情境題，或重設後再來一輪。</p></div><div class="row"><button class="btn" data-a="reset">重設進度</button></div>';return}
    cur=queue[0];
    h+='<div class="card fc" tabindex="0" role="button" data-a="flip"><small>'+(cur.tag?esc(cur.tag)+'｜':'')+esc(lab(cur.ref))+'｜剩 '+queue.length+' 張</small><div class="q">'+esc(cur.front)+'</div>'+(flipped?'<div class="a"><span class="lab fact">答案</span>'+esc(cur.back)+'</div>':'<small>點一下翻面</small>')+'</div>';
    if(flipped)h+='<div class="row"><button class="btn bad" data-a="no">還不熟</button><button class="btn ok" data-a="yes">會了</button></div>';
    h+='<div class="row"><button class="btn" data-a="reset">重設進度</button></div>';
    root.innerHTML=h;
  }
  root.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
    if(a==='flip'){flipped=!flipped;render()}
    else if(a==='reset'){if(confirm('確定要清除這些閃卡的進度？')){getCards().forEach(c=>delete boxes[c.key]);saveBoxes();build();render()}}
    else if(cur&&(a==='yes'||a==='no')){const ok=a==='yes';boxes[cur.key]=ok?Math.min(1,(boxes[cur.key]||0)+1):0;saveBoxes();queue.shift();if(!ok||boxes[cur.key]<1)queue.splice(queue.length?Math.max(1,Math.min(queue.length,ok?6:3)):0,0,cur);flipped=false;render()}});
  root.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.fc')){e.preventDefault();flipped=!flipped;render()}});
  return {refresh(){build();render()}};
}
function Quiz(root,getItems,perRound){
  let items=[],score=0,answered=0,done=false;
  function draw(){
    const perms=items.map(s=>shuffle(s.opts.map((_,k)=>k)));
    root.innerHTML='<div class="stat" id="sc"></div>'+items.map((s,i)=>'<div class="card" data-i="'+i+'"><b>'+(i+1)+'. </b><span class="lab my">'+(s.tag?esc(s.tag)+' ':'')+esc(lab(s.ref))+'</span>'+esc(s.q)+perms[i].map((k,pos)=>'<button class="opt" data-o="'+k+'">'+String.fromCharCode(65+pos)+'. '+esc(s.opts[k])+'</button>').join('')+'<div class="why"></div></div>').join('')+'<div id="qend"></div>';
    score=0;answered=0;upd();
  }
  function upd(){const el=$('#sc',root);if(el)el.textContent='已作答 '+answered+' / '+items.length+'，答對 '+score+' 題';
    if(perRound&&answered===items.length&&items.length){$('#qend',root).innerHTML='<div class="card"><h3>這一組：'+score+' / '+items.length+'</h3></div><div class="row"><button class="btn pri" data-a="again">再來一組</button></div>'}}
  function again(){const all=getItems();items=perRound?shuffle(all).slice(0,perRound):all;draw()}
  root.addEventListener('click',e=>{
    const ag=e.target.closest('[data-a="again"]');if(ag){again();window.scrollTo(0,root.offsetTop-60);return}
    const b=e.target.closest('.opt');if(!b)return;const box=b.closest('.card');if(box.dataset.done)return;
    const s=items[+box.dataset.i],j=+b.dataset.o;box.dataset.done=1;answered++;if(j===s.ans)score++;
    let right='';$$('.opt',box).forEach((x,pos)=>{const k=+x.dataset.o;if(k===s.ans){x.classList.add('right');right=String.fromCharCode(65+pos)}else if(k===j)x.classList.add('wrong')});
    const w=$('.why',box);w.style.display='block';w.innerHTML=(j===s.ans?'答對了。':'答錯了，正解是 '+right+'。')+esc(s.why);upd()});
  return {refresh:again};
}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const LAWS=D.laws;
$('#h1').textContent=D.chapter+'｜'+D.title;
$('#intro').textContent=D.summary||'';
document.title=D.chapter+' '+D.title;
$('#foot').innerHTML='官方來源：'+LAWS.map(L=>esc(L.name)+'（'+esc(L.amended)+(L.kind==='press'?'發布':'修正')+'）<a href="'+esc(L.url)+'" target="_blank" rel="noopener">'+esc(L.url)+'</a>').join('<br>')+(D.scope?'<br>'+esc(D.scope):'')+'<br>條文原文取自官方網頁；「白話」「口訣」「情境題」為編寫者整理，不是法條。法規可能再修正，請以官方最新公告為準；本內容不是法律或投資意見。';
const TABS=[['read','條文速讀'],['table','對照表'],['cards','閃卡'],['quiz','情境題']];
const nav=$('#nav');
TABS.forEach(([id,name])=>{const b=document.createElement('button');b.textContent=name;b.setAttribute('role','tab');b.dataset.id=id;b.onclick=()=>show(id);nav.appendChild(b)});
let curTab='read';
function show(id,anchor){curTab=id;TABS.forEach(([t])=>$('#s-'+t).classList.toggle('on',t===id));$$('button',nav).forEach(b=>b.setAttribute('aria-selected',b.dataset.id===id));
  history.replaceState(null,'','#'+id+(anchor?'/'+anchor:''));
  if(anchor){const el=document.getElementById(anchor);if(el){const d=el.querySelector('details');el.scrollIntoView({block:'start'});el.classList.add('hl')}}else window.scrollTo(0,0)}
$('#s-read').innerHTML=(D.alerts||[]).map(a=>'<div class="banner"><b>'+esc(a.t)+'</b>'+esc(a.d)+'</div>').join('')+D.clauses.map(c=>{
  const off=c.official.map(p=>'<p>'+esc(p)+'</p>').join('');
  return '<div class="card" id="c'+esc(c.no)+'"><h3><span class="no">'+esc(lab(c.no))+'</span>'+esc(c.title)+'</h3>'
   +'<div class="pw"><span class="lab my">白話</span>'+fmt(c.plain)+'</div>'+factsT(c.facts)
   +(c.mnemonic?'<div class="mn"><span class="lab my">口訣</span>'+esc(c.mnemonic)+'</div>':'')
   +(c.tip?'<p><span class="lab hint">提醒</span>'+esc(c.tip)+'</p>':'')
   +(c.official.length?'<details><summary>展開官方條文原文</summary><div class="off"><span class="lab fact">原文</span>'+off+'</div></details>':'')+'</div>'}).join('');
$('#s-table').innerHTML=D.tables.map((t,i)=>'<h3 id="t'+i+'">'+esc(t.title)+'</h3><div class="tw"><table><thead><tr>'+t.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+t.rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>').join('');
const cardsAll=D.cards.map(c=>({key:'ch'+D.chNo+':'+c.id,ref:c.ref,front:c.front,back:c.back}));
const fl=Flash($('#s-cards'),()=>cardsAll);fl.refresh();
const qz=Quiz($('#s-quiz'),()=>D.scenarios,0);qz.refresh();
// 上下章
const N=D.nav||{};
function setLink(el,o,dir){if(o){el.href=o.file;el.textContent=dir==='p'?'← '+o.label:o.label+' →'}else{el.style.visibility='hidden'}}
setLink($('#prev'),N.prev,'p');setLink($('#next'),N.next,'n');
// 左右滑動：換分頁，到頭就換章
function step(d){const i=TABS.findIndex(t=>t[0]===curTab)+d;
  if(i<0){if(N.prev)location.href=N.prev.file+'#read';return}
  if(i>=TABS.length){if(N.next)location.href=N.next.file+'#read';return}
  show(TABS[i][0])}
let sx=0,sy=0,skip=false;
document.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;const el=e.target&&e.target.nodeType===1?e.target:(e.target&&e.target.parentElement);skip=!!(el&&el.closest('.tw,nav,input,.off'))},{passive:true});
document.addEventListener('touchend',e=>{if(skip)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>70&&Math.abs(dy)<45){step(dx<0?1:-1)}},{passive:true});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1)});
// 深層連結
function route(){const h=(location.hash||'#read').slice(1).split('/');show(TABS.some(t=>t[0]===h[0])?h[0]:'read',h[1]?decodeURIComponent(h[1]):null)}
window.addEventListener('hashchange',route);route();
</script></body></html>
