<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>第八章 投資型保險專設帳簿保管機構及投資標的應注意事項</title><style>:root{--bg:#f7f6f2;--card:#fff;--ink:#222;--sub:#666;--line:#e3e0d8;--brand:#1f5f8b;--brand2:#e8f1f7;--ok:#2e7d32;--okbg:#e8f5e9;--bad:#b3261e;--badbg:#fdecea;--warn:#8a5a00;--warnbg:#fff4de}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
a{color:var(--brand)}
header{background:var(--brand);color:#fff;padding:12px 16px 14px}
header a{color:#fff;text-decoration:none;font-size:14px;opacity:.9}
header h1{margin:4px 0 0;font-size:20px;line-height:1.4}
header p{margin:6px 0 0;font-size:14px;opacity:.95}
.wrap{max-width:900px;margin:0 auto;padding:0 12px 60px}
.banner{background:var(--warnbg);color:var(--warn);border:1px solid #f0d9a8;border-radius:8px;padding:10px 12px;margin:12px 0;font-size:14px}

nav{position:sticky;top:0;background:var(--bg);z-index:5;display:flex;gap:6px;padding:10px 0;overflow-x:auto;border-bottom:1px solid var(--line)}

section{display:none;padding-top:14px}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 12px}
.card h3{margin:0 0 6px;font-size:17px}
.no{display:inline-block;background:var(--brand);color:#fff;border-radius:6px;padding:0 8px;margin-right:8px;font-size:14px}
.lab{display:inline-block;font-size:12px;border-radius:4px;padding:0 6px;margin-right:6px;vertical-align:1px}
.lab.fact{background:#e3f2e5;color:#1b5e20}.lab.my{background:#e8eaf6;color:#283593}.lab.hint{background:var(--warnbg);color:var(--warn)}
.mn{background:var(--brand2);border-radius:8px;padding:8px 10px;margin:8px 0}
details{margin:8px 0}details summary{cursor:pointer;color:var(--brand);font-size:15px}
.off{border-left:3px solid var(--brand);padding:2px 0 2px 10px;margin:8px 0;font-size:15px;color:#333}.off p{margin:4px 0}
table{border-collapse:collapse;width:100%;font-size:15px;background:#fff}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}th{background:var(--brand2)}
.tw{overflow-x:auto;margin-bottom:16px}
.fc{min-height:210px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.fc .q{font-size:19px;font-weight:600}.fc .a{font-size:16px;text-align:left;margin-top:8px}.fc small{color:var(--sub)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.btn{border:1px solid var(--brand);background:#fff;color:var(--brand);border-radius:8px;padding:9px 16px;font-size:16px;cursor:pointer}
.btn.pri{background:var(--brand);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0}.bar>i{display:block;height:100%;background:var(--ok)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;margin:6px 0;font-size:16px;cursor:pointer}
.opt.right{background:var(--okbg);border-color:var(--ok)}.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.why{display:none;background:var(--brand2);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:15px}
.stat{color:var(--sub);font-size:14px}
footer{color:var(--sub);font-size:13px;margin-top:24px}
.pager{display:flex;justify-content:space-between;gap:8px;margin-top:18px}.pager a{flex:1;text-align:center;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px;text-decoration:none;font-size:14px}
.hl{animation:hl 1.6s ease-out}@keyframes hl{0%{box-shadow:0 0 0 4px #ffd54f}100%{box-shadow:0 0 0 0 transparent}}
mark{background:#fff0a8;padding:0 1px}
.search{display:flex;gap:8px;margin:14px 0 6px}.search input{flex:1;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.res{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0;display:block;text-decoration:none;color:var(--ink)}
.res small{color:var(--sub)}.res b{color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.ch{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-decoration:none;color:var(--ink);display:block}
.ch:hover{border-color:var(--brand)}.ch h3{margin:0 0 4px;font-size:16px;color:var(--brand)}.ch p{margin:4px 0;font-size:14px}
.chip{display:inline-block;background:var(--brand2);color:#134;border-radius:999px;padding:0 9px;margin:2px 3px 2px 0;font-size:12.5px}
.filter{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.filter button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer}.filter button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
h2{font-size:18px;margin:24px 0 8px}

.pw{margin:6px 0}.pw p{margin:4px 0}.pl{margin:6px 0 6px 0;padding-left:20px}.pl li{margin:5px 0;line-height:1.7}.pl ul{margin:4px 0;padding-left:18px;list-style:disc}.pl ul li{margin:2px 0}.pl>li>b{color:#283593}
table.ft{font-size:14px;table-layout:fixed}table.ft td:first-child,table.ft th:first-child{font-weight:600;width:34%;word-break:break-all}table.ft td,table.ft th{word-break:break-word;padding:6px 7px}table.ft th{width:auto}
</style></head>

等", "official": ["保險人應依本辦法第六條第二項及第三項規定，將投資型保險專設帳簿資產交由符合附表一所列信用評等機構評等達一定等級以上之國內或國外保管機構予以保管。"], "plain": "專設帳簿資產要交給符合附表一所列信評機構評等達一定等級以上的國內或國外保管機構。", "mnemonic": "保管機構找「附表一」。", "tip": "具體評等等級放在官方附表一（附件），見頁尾連結。"}, {"no": "三", "title": "連結標的的信用評等", "official": ["投資型保險商品所連結投資標的為本辦法第十條第一項第七款至第十一款，或第十一條第一項第三款、第五款及第二項第一款、第二款、第三款及第五款所定公債、國庫券、金融債券、公司債、結構型商品、國外不動產抵押債權證券及浮動利率中期債券者，除連結境外結構型商品之信用評等等級應依第四點規定辦理外，應分別符合下列信用評等等級：", "（一）公債、國庫券之發行國家主權評等，應符合附表二所列信用評等機構評等達一定等級以上。", "（二）金融債券、公司債及浮動利率中期債券：", "1.國內機構發行者：債務發行評等應符合附表三所列信用評等機構評等達一定等級以上。", "2.國外機構發行者：債務發行評等應符合附表一所列信用評等機構評等達一定等級以上，且該債券之發行機構或保證機構應於中華民國境內設有境外結構型商品管理規則第六條所定之分公司或子公司。", "（三）國內結構型商品：商品發行評等應符合附表三所列信用評等機構評等達一定等級以上。但無法取得商品發行評等之國內結構型商品者，應以國內發行機構或保證機構之長期債務信用評等等級替代之。", "（四）美國聯邦國民抵押貸款協會、聯邦住宅抵押貸款公司及美國政府國民抵押貸款協會所發行或保證之不動產抵押債權證券：該證券之發行評等應符合附表四所列信用評等機構評等達一定等級以上，且不得為再次證券化商品及合成型證券化商品。"], "plain": "連結的標的要達一定評等：公債與國庫券看發行國家主權評等（附表二）；金融債、公司債、浮動利率中期債券：國內機構發行用附表三，國外機構發行用附表一並要求發行或保證機構在境內設有分公司或子公司；國內結構型商品看商品發行評等（附表三，沒有商品評等則以發行或保證機構的長期債務評等替代）；房利美等的抵押債權證券用附表四，且不得為再證券化或合成型證券化商品。", "mnemonic": "「主權二、國內三、國外一、結構三、MBS 四」＝附表編號。", "tip": "附表一至四的具體等級在官方附件，見頁尾連結。"}, {"no": "四", "title": "境外結構型商品", "official": ["四、投資型保險商品連結之各種境外結構型商品，應符合境外結構型商品管理規則及相關規定。但不得連結境外結構型商品管理規則第四條第一項所定於外國證券交易所掛牌交易之境外結構型商品。"], "plain": "連結境外結構型商品，要符合境外結構型商品管理規則；但不得連結在外國證券交易所掛牌交易的境外結構型商品。", "mnemonic": "", "tip": ""}, {"no": "五", "title": "不得涉有的情事", "official": ["投資型保險商品所連結投資標的或專設帳簿資產之運用，不得涉有下列情事：", "（一）連結或運用於證券投資信託事業以私募方式發行之證券投資信託基金受益憑證，或其他國內外私募之有價證券。", "（二）連結或運用於國外指數型基金者，其追蹤指數逾越主管機關公告保險業投資國外指數型基金之追蹤指數範圍，但於國內、外證券交易市場交易之指數股票型基金，不在此限。", "（三）連結或運用於保險法第一百四十六條之七第三項規定保險人之利害關係人所發行之金融債券、公司債或結構型商品。"], "plain": "不得連結或運用：私募基金受益憑證或其他國內外私募有價證券；追蹤指數逾越主管機關公告範圍的國外指數型基金（ETF 除外）；保險人利害關係人發行的金融債券、公司債或結構型商品。", "mnemonic": "「私募、指數超範圍、利害關係人」。", "tip": ""}, {"no": "六", "title": "國內結構型商品的規定", "official": ["投資型保險商品連結之各種國內結構型商品，應符合下列規定：", "（一）計價幣別以新臺幣、人民幣及境外結構型商品管理規則第十八條第二款所定計價幣別為限。", "（二）發行條件除應記載發行機構、保證機構之長期債務信用評等外，並應揭露該等結構型商品之風險及相關重要資訊，其揭露事項依銀行辦理衍生性金融商品業務應注意事項或財團法人中華民國證券櫃檯買賣中心證券商營業處所經營衍生性金融商品交易業務規則相關規定辦理。", "（三）不得連結下列標的：", "1.新臺幣匯率指標。", "2.新臺幣利率指標，但以新臺幣計價之結構型商品不在此限。", "3.本國企業於國外發行之有價證券。", "4.國內證券投資信託事業於國外發行之受益憑證。", "5.國內外機構編製之臺股指數及其相關金融商品。但如該指數係由臺灣證券交易所或證券櫃檯買賣中心公布之各類指數及該指數係由臺灣證券交易所或證券櫃檯買賣中心與國外機構合作編製非以臺股為主要成分股之指數，不在此限。", "6.未經本會核准或申報生效得募集及銷售之境外基金。", "7.國內外私募之有價證券。", "8.股權、利率、匯率、基金、商品、上述相關指數及指數型基金以外之衍生性金融商品。但指數股票型基金，以本會核定之證券市場掛牌交易之以投資股票、債券為主且不具槓桿或放空效果者為限。", "（四）涉及大陸地區之商品或契約以連結下列標的及中央銀行已開放之範圍為限：", "1.以外幣或人民幣計價或交割之無本金交割商品（1）涉及人民幣匯率：無本金交割之外幣對人民幣遠期外匯（NDF）、無本金交割之外幣對人民幣匯率選擇權（NDO） 或無本金交割之外幣對人民幣換匯換利（NDCCS） 。", "（2）涉及人民幣利率：無本金交割之外幣對人民幣利率交換（NDIRS） 。", "2.以外幣或人民幣計價或交割商品（1）涉及人民幣匯率：遠期外匯、換匯、換匯換利或匯率選擇權，但上開商品均不得涉及新臺幣匯率。", "（2）涉及人民幣利率：遠期利率協議、利率交換、利率交換選擇權或利率選擇權。", "3.涉及人民幣計價或交割之與大陸地區相關公開上市之股價指數：", "股價遠期契約、股價交換或股價選擇權。", "4.其他經中央銀行開放外匯指定銀行辦理之連結標的。", "5.連結第一目至第三目標的之衍生性金融商品或契約以結合外幣或人民幣定期存款之結構型商品為限。", "（五）除另有規定外，結構型商品得於中央銀行已開放之範圍內同時連結二種之資產類別。", "（六）結構型商品之到期保本率至少為原計價貨幣本金（或其等值）之百分之一百，且不得含有目標贖回式設計及發行機構得提前贖回之選擇權。"], "plain": "國內結構型商品：計價幣別限新臺幣、人民幣等規定幣別；發行條件要記載發行與保證機構長期債務評等並揭露風險；不得連結新臺幣匯率指標、新臺幣利率指標（新臺幣計價者除外）、本國企業國外發行有價證券、國內投信國外發行受益憑證、臺股指數及相關商品（有例外）、未經核准的境外基金、私募有價證券、列舉外的衍生性金融商品；涉及大陸地區限列舉標的；到期保本率至少 100%，且不得含目標贖回式設計與發行機構得提前贖回的選擇權。", "mnemonic": "保本「百分之百」；不得含「目標贖回、提前贖回」。", "tip": "第（三）款的「不得連結」共八項，請看「對照表」分頁。"}, {"no": "七", "title": "連結國外債券的規定", "official": ["投資型保險商品連結第三點所列國外債券者，應符合下列規定：", "（一）計價幣別以人民幣及境外結構型商品管理規則第十八條第二款所定計價幣別為限。", "（二）該債券應於國內證券市場上櫃買賣，且不得為僅限銷售予專業投資人者。", "（三）投資大陸地區或港澳地區有價證券之範圍及限制，準用證券商受託買賣外國有價證券管理規則第五條之相關規定。", "（四）不得投資本國企業赴國外發行之債券。", "（五）不得投資具損失吸收能力（Total Loss Absorbing Capacity ）債券。"], "plain": "連結國外債券：計價幣別限規定幣別；債券要在國內證券市場上櫃買賣，且不得僅限專業投資人；大陸、港澳有價證券準用外國有價證券管理規則第5條；不得投資本國企業赴國外發行的債券；不得投資具損失吸收能力（TLAC）債券。", "mnemonic": "「國內上櫃、非專投、非本國企業、非 TLAC」。", "tip": ""}, {"no": "八", "title": "指數股票型基金（ETF）", "official": ["投資型保險商品連結本辦法第十四條第一項但書所稱於國內、外證券交易市場交易之指數股票型基金，除第二項另有規定外，以投資股票、債券為主且不具槓桿或放空效果者為限。", "保險人依本辦法第五條第一項第二款委託經主管機關核准經營或兼營全權委託投資業務之事業代為運用與管理專設帳簿之資產，符合下列規定者，得連結具槓桿或放空效果之指數股票型基金：", "（一）為避險目的者，得連結具放空效果之指數股票型基金，且以反向不超過一倍為限。保險人應要求全權委託投資業務事業於交易分析敘明與相對應標的具高度相關性，且持有避險效果部位之淨資產價值不得超過持有相對應標的與加計槓桿效果後之淨資產價值總和。", "（二）為風險管理目的者，於全權委託投資帳戶追蹤指數時，得為貼近指數報酬連結具槓桿效果之指數股票型基金，且以正向不超過二倍為限。保險人應要求全權委託投資業務事業於交易分析敘明全權委託投資帳戶存在績效劣於追蹤指數之事實，及運用具槓桿效果之指數股票型基金之預期效益，且與相對應標的具高度相關性。", "前項所稱具高度相關性，指以過去三個月以上之全部交易歷史資料為樣本計算，具槓桿或放空效果之指數股票型基金與相對應標的價格變動率或報酬率相關係數達百分之七十以上。保險人應確認全權委託投資業務事業已建立從事具槓桿或放空效果之指數股票型基金交易後，持續評估避險或風險管理有效性之機制。", "第一項所稱國外證券交易市場交易之指數股票型基金，應於證券商受託買賣外國有價證券管理規則第五條第一項所定之外國證券交易所交易。"], "plain": "一般 ETF 以投資股票、債券為主且不具槓桿或放空效果者為限。透過全權委託投資業務事業運用專設帳簿資產時，符合條件可連結槓桿或放空 ETF：避險目的可連結放空 ETF，反向不超過一倍；風險管理目的、追蹤指數時可連結槓桿 ETF，正向不超過二倍。「高度相關」指以過去三個月以上全部交易歷史資料計算，相關係數達 70% 以上。", "mnemonic": "「避險反一倍、風管正二倍、相關七成、三個月」。", "tip": ""}, {"no": "八之一", "title": "有約定到期日的債券型基金", "official": ["投資型保險商品連結之投資標的為本辦法第十四條第一項證券投資信託基金受益憑證中屬債券型基金且有約定到期日者，該基金所投資公債、國庫券之發行國家主權評等，或公債、國庫券以外債券之債務發行評等，應符合附表五所列信用評等機構評等達一定等級以上，且投資於附表五所列該一定評級之投資總金額不得超過該基金淨資產價值之百分之四十。", "前項之規定，於有約定到期日債券型基金存續期間所增加之投資，亦適用之。"], "plain": "有約定到期日的債券型基金：所投資債券要達附表五評等，且投資於附表五所列該一定評級的總金額不得超過基金淨資產價值 40%；存續期間增加的投資也適用。", "mnemonic": "「附表五、四成」。", "tip": ""}, {"no": "八之二", "title": "高風險基金的投資比例", "official": ["投資型保險商品連結之投資標的為本辦法第十四條第一項證券投資信託基金受益憑證、境外基金或國外證券交易市場交易之指數股票型基金者，應依下列規定辦理：", "（一）保險人依本辦法第五條第一項第二款委託經主管機關核准經營或兼營全權委託投資業務之事業代為運用與管理專設帳簿之資產者，投資於下列基金之金額，合計投資比例上限不超過百分之二十，且其中連結第一目之基金之投資比例上限不超過百分之十：", "1.非投資等級債券總金額（或成分權重）達基金淨資產價值（或標的指數成分權重）百分之六十以上之基金。", "2.新興市場國家債券總金額（或成分權重）達基金淨資產價值（或標的指數成分權重）百分之六十以上之基金。", "（二）前款以外之投資型保險商品連結之投資標的，不得涉及前款各目基金。"], "plain": "透過全權委託投資事業運用時：非投資等級債券達基金淨資產價值 60% 以上的基金，與新興市場國家債券達 60% 以上的基金，合計不超過 20%，其中非投資等級債券基金不超過 10%。其他投資型保險商品連結的標的，不得涉及這兩類基金。", "mnemonic": "「六成債券：合計二成、非投資等級一成」。", "tip": ""}, {"no": "九", "title": "事後評估與通知要保人", "official": ["保險人應事後定期評估第三點所列投資型保險商品連結投資標的之信用風險，並應依下列規定辦理：", "（一）國內結構型商品之發行評等、發行機構或保證機構長期債務信用評等，如有遭信用評等機構調降評等達附表五所列等級（含）以下之情事者，保險人應於事實發生之日起三日內通知要保人。", "（二）金融債券、公司債及浮動利率中期債券之債務發行評等，如有遭信用評等機構調降評等達附表五所列等級（含）以下之情事者，保險人應於事實發生之日起三日內通知要保人。"], "plain": "保險人要事後定期評估連結標的信用風險：國內結構型商品、金融債券、公司債、浮動利率中期債券若遭調降評等達附表五所列等級（含）以下，保險人要在事實發生日起 3 日內通知要保人。", "mnemonic": "「調降到附表五以下：三日內通知」。", "tip": ""}, {"no": "十", "title": "匯率避險的貨幣衍生商品交易範圍", "official": ["十、保險人依本辦法第五條第一項第二款委託經主管機關核准經營或兼營全權委託投資業務之事業代為運用與管理專設帳簿之資產者，其為匯率避險目的，從事與專設帳簿資產有關之貨幣相關衍生性金融商品交易，其交易範圍應符合下列規定：", "（一）經本會依期貨交易法第五條公告期貨商得受託從事交易與貨幣相關之期貨契約、選擇權契約及期貨選擇權契約。", "（二）與專設帳簿資產有關之貨幣間之遠期外匯交易、換匯交易、換匯換利交易及其他匯率避險交易。", "前項匯率避險目的之交易，指符合下列條件之交易：", "（一）被避險項目已存在並使專設帳簿資產暴露於損失之匯率風險中，且可明確辨認。", "（二）避險衍生性金融商品可降低被避險項目之匯率風險，並被指定作為該項目之避險。", "（三）執行避險交易時，若避險衍生性金融商品連結標的與被避險項目不同者，應於正式書面文件中指定避險衍生性金融商品連結標的與被避險項目，且證明避險衍生性金融商品之連結標的或其商品組合與被避險項目間存在高度相關性。", "前項高度相關性，指以過去三個月以上之全部交易歷史資料為樣本計算，避險衍生性金融商品之連結標的或其商品組合與被避險項目價格變動率或報酬率相關係數達百分之七十以上。", "保險人應確認全權委託投資業務事業已建立從事貨幣相關衍生性金融商品交易後，持續評估避險有效性之機制。"], "plain": "只適用保險人委託全權委託投資業者運用專設帳簿資產的情形。交易範圍：期貨商可受託的貨幣相關期貨、選擇權、期貨選擇權契約；與專設帳簿資產有關的貨幣間遠期外匯、換匯、換匯換利及其他匯率避險交易。「匯率避險目的」要同時符合：被避險項目已存在且可明確辨認；避險商品能降低其匯率風險並被指定為該項目的避險；連結標的與被避險項目不同時，要書面指定並證明高度相關（過去三個月以上全部交易資料，相關係數達 70% 以上）。保險人還要確認業者建立持續評估避險有效性的機制。", "mnemonic": "「已存在、可降低、高度相關七成」", "tip": "這是「避險」不是「投機」：被避險項目必須先存在。"}, {"no": "十一", "title": "匯率避險衍生商品的金額上限", "official": ["第十點衍生性金融商品交易之契約總（名目）價值，合計不得超過被避險項目之總帳面價值。但因市場波動因素導致投資金額有逾上開額度情形，且受託機構於事實發生之日起三個營業日內採取適當處置後，已符合投資額度規定者，不在此限。"], "plain": "為匯率避險的衍生性金融商品，契約總名目價值合計不得超過被避險項目的總帳面價值；若因市場波動超限，受託機構在事實發生日起 3 個營業日內處置後符合規定，則不在此限。", "mnemonic": "「名目價值不超過帳面價值；三個營業日」。", "tip": ""}, {"no": "十二", "title": "匯率避險衍生商品的交易對手", "official": ["十二、第十點衍生性金融商品交易除臺灣期貨交易所股份有限公司交易之期貨交易契約，及該公司經本會核准與國外交易所簽署合作協議，於該國外交易所上市之期貨交易契約外，其交易對手應符合下列規定：", "（一）最近一期自有資本與風險性資產之比率、自有資本適足比率、調整後淨資本額占期貨交易人未沖銷部位所需之客戶保證金總額比例，符合法定標準之本國金融機構。", "（二）最近一年長期債務信用評等等級經Moody’s Investors Service、Standard & Poor’s Corp.或Fitch Ratings Ltd.評定達BBB+級或相當等級以上之外國金融機構。"], "plain": "除臺灣期貨交易所的期貨契約（及經核准與國外交易所合作、於國外交易所上市的期貨契約）外，交易對手要是：資本比率符合法定標準的本國金融機構；或最近一年長期債務信評經 Moody's、S&P 或 Fitch 評定達 BBB+ 或相當等級以上的外國金融機構。", "mnemonic": "「本國符合法定標準；外國 BBB+」", "tip": ""}, {"no": "十三", "title": "信用風險評估與破產應變", "official": ["保險人應確實建立投資標的與該標的發行、保證或經理機構之信用風險評估機制及分散準則，並應依本辦法第九條第二項規定訂定投資標的發行或經理機構破產之緊急應變及追償作業程序。"], "plain": "保險人要建立投資標的及其發行、保證、經理機構的信用風險評估機制與分散準則，並訂定發行或經理機構破產時的緊急應變及追償作業程序。", "mnemonic": "「發行、保證、經理」三種機構。", "tip": ""}], "tables": [{"title": "評等要求對應哪一張附表（第二、三、八之一、九點）", "head": ["標的", "適用附表"], "rows": [["保管機構（第二點）", "附表一"], ["公債、國庫券：發行國家主權評等（第三點第一款）", "附表二"], ["國內機構發行的金融債券、公司債、浮動利率中期債券（第三點第二款第1目）", "附表三"], ["國外機構發行的金融債券、公司債、浮動利率中期債券（第三點第二款第2目）", "附表一；且發行或保證機構須在境內設有分公司或子公司"], ["國內結構型商品（第三點第三款）", "附表三"], ["房利美、房地美、吉利美的不動產抵押債權證券（第三點第四款）", "附表四"], ["有約定到期日的債券型基金；調降評等通知（第八點之一、第九點）", "附表五"]]}, {"title": "槓桿與放空 ETF（第八點）", "head": ["目的", "可連結", "上限"], "rows": [["避險", "具放空效果的 ETF", "反向不超過一倍"], ["風險管理（全權委託帳戶追蹤指數時）", "具槓桿效果的 ETF", "正向不超過二倍"], ["高度相關性定義", "過去三個月以上全部交易歷史資料，價格變動率或報酬率相關係數", "達 70% 以上"]]}, {"title": "數字與期限", "head": ["項目", "規定", "點次"], "rows": [["債券型基金（有到期日）投資於附表五該評級", "不超過基金淨資產價值 40%", "八之一"], ["高風險基金合計比例（全權委託）", "不超過 20%，其中非投資等級債券基金不超過 10%", "八之二"], ["調降評等通知要保人", "事實發生日起 3 日內", "九"], ["匯率避險衍生商品超限處置", "事實發生日起 3 個營業日內", "十一"], ["結構型商品到期保本率", "至少 100%", "六"]]}, {"title": "國內結構型商品「不得連結」（第六點第三款，八項）", "head": ["款", "不得連結"], "rows": [["1", "新臺幣匯率指標"], ["2", "新臺幣利率指標（新臺幣計價之結構型商品除外）"], ["3", "本國企業於國外發行之有價證券"], ["4", "國內證券投資信託事業於國外發行之受益憑證"], ["5", "國內外機構編製之臺股指數及其相關金融商品（有例外）"], ["6", "未經核准或申報生效得募集及銷售之境外基金"], ["7", "國內外私募之有價證券"], ["8", "股權、利率、匯率、基金、商品、相關指數及指數型基金以外之衍生性金融商品（ETF 有條件）"]]}], "scenarios": [{"ref": "九", "q": "某投資型保險連結的金融債券，被信評機構調降評等達附表五所列等級以下。依第九點，保險人應？", "opts": ["事實發生日起 3 日內通知要保人", "事實發生日起 30 日內通知要保人", "年底彙總通知", "不需要通知"], "ans": 0, "why": "第九點：應於事實發生之日起三日內通知要保人。"}, {"ref": "六", "q": "某國內結構型商品的到期保本率只有 90%，且含發行機構得提前贖回的選擇權。依第六點，可以連結嗎？", "opts": ["可以", "不可以，保本率至少 100%，且不得含目標贖回與提前贖回選擇權", "只要揭露風險就可以", "只要保證機構評等夠就可以"], "ans": 1, "why": "第六點第六款：到期保本率至少為原計價貨幣本金百分之一百，且不得含有目標贖回式設計及發行機構得提前贖回之選擇權。"}, {"ref": "五", "q": "投資型保險想連結一檔證券投資信託事業以私募方式發行的基金受益憑證。依第五點？", "opts": ["可以", "不可以，不得連結私募基金受益憑證或其他國內外私募有價證券", "須向壽險公會報備", "可以，但比例不超過 5%"], "ans": 1, "why": "第五點第（一）款：不得連結或運用於證券投資信託事業以私募方式發行的基金受益憑證，或其他國內外私募的有價證券。"}, {"ref": "八", "q": "保險人透過全權委託投資事業運用專設帳簿，為避險目的想連結放空 ETF。依第八點，上限是？", "opts": ["反向不超過一倍", "反向不超過二倍", "正向不超過二倍", "沒有上限"], "ans": 0, "why": "第八點第二項第一款：為避險目的者，得連結具放空效果的 ETF，且以反向不超過一倍為限。正向不超過二倍是風險管理目的的槓桿 ETF。"}, {"ref": "八", "q": "「槓桿 ETF 與相對應標的具高度相關性」，依第八點的定義，是指？", "opts": ["過去一年全部資料，相關係數達 50%", "過去三個月以上全部交易歷史資料，相關係數達 70% 以上", "過去三個月以上的部分資料，相關係數達 80%", "過去一週，相關係數達 70%"], "ans": 1, "why": "第八點第三項：以過去三個月以上之全部交易歷史資料為樣本計算，相關係數達百分之七十以上。"}, {"ref": "八之一", "q": "某有約定到期日的債券型基金，投資於附表五所列某一評級的債券。依第八點之一，該評級的投資總金額上限？", "opts": ["基金淨資產價值 10%", "基金淨資產價值 20%", "基金淨資產價值 40%", "基金淨資產價值 60%"], "ans": 2, "why": "第八點之一：投資於附表五所列該一定評級之投資總金額不得超過該基金淨資產價值之百分之四十。"}, {"ref": "八之二", "q": "全權委託的專設帳簿，投資於非投資等級債券達淨資產 60% 以上的基金與新興市場債券達 60% 以上的基金。依第八點之二，上限是？", "opts": ["合計 10%，其中非投資等級 5%", "合計 20%，其中非投資等級 10%", "合計 40%，其中非投資等級 20%", "沒有限制"], "ans": 1, "why": "第八點之二第（一）款：合計不超過百分之二十，且其中非投資等級債券基金不超過百分之十。"}, {"ref": "十一", "q": "匯率避險用的衍生性金融商品，其契約總名目價值依第十一點，上限是？", "opts": ["被避險項目帳面價值的 50%", "不超過被避險項目的總帳面價值", "專設帳簿資產的 10%", "沒有上限"], "ans": 1, "why": "第十一點：契約總（名目）價值合計不得超過被避險項目之總帳面價值；因市場波動超限者，受託機構三個營業日內處置後符合規定可不在此限。"}, {"ref": "三", "q": "國內結構型商品沒有商品發行評等時，依第三點，評等怎麼認定？", "opts": ["視為不合格", "以國內發行機構或保證機構的長期債務信用評等替代", "由壽險公會認定", "以保管機構評等替代"], "ans": 1, "why": "第三點第（三）款但書：無法取得商品發行評等者，以國內發行機構或保證機構之長期債務信用評等等級替代。"}, {"ref": "十", "q": "依注意事項第十點，認定「匯率避險目的」的貨幣衍生商品交易，下列何者「不符合」？", "opts": ["被避險項目已存在且可明確辨認", "避險商品可降低被避險項目的匯率風險", "連結標的與被避險項目間相關係數達 70% 以上", "先買進衍生商品，之後再找可避險的標的"], "ans": 3, "why": "第十點第2項第1款：被避險項目必須已存在並使專設帳簿資產暴露於匯率風險；不能先交易再找標的。"}], "cards": [{"id": 0, "ref": "二", "front": "保管機構的評等看哪一張附表？", "back": "附表一。"}, {"id": 1, "ref": "三", "front": "公債、國庫券看什麼評等？看哪張附表？", "back": "發行國家的主權評等；附表二。"}, {"id": 2, "ref": "三", "front": "國內結構型商品沒有商品發行評等時怎麼辦？", "back": "以國內發行機構或保證機構的長期債務信用評等替代。"}, {"id": 3, "ref": "三", "front": "國外機構發行的金融債券、公司債，除評等外還有什麼要求？", "back": "發行機構或保證機構要在中華民國境內設有境外結構型商品管理規則第6條所定的分公司或子公司。"}, {"id": 4, "ref": "五", "front": "投資型保險商品連結的標的，不得涉有哪三類情事？", "back": "私募基金受益憑證或其他國內外私募有價證券；追蹤指數逾越主管機關公告範圍的國外指數型基金（ETF 除外）；保險人利害關係人發行的金融債券、公司債、結構型商品。"}, {"id": 5, "ref": "六", "front": "國內結構型商品的到期保本率？", "back": "至少為原計價貨幣本金的 100%，且不得含目標贖回式設計與發行機構得提前贖回的選擇權。"}, {"id": 6, "ref": "六", "front": "國內結構型商品的計價幣別？", "back": "以新臺幣、人民幣及境外結構型商品管理規則第18條第2款所定計價幣別為限。 <script>const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>{t=String(t||'');const ss=t.split(/(?<=。)/).map(x=>x.trim()).filter(Boolean);if(t.length<=90||ss.length<2&&t.indexOf('；')<0)return '<p>'+esc(t)+'</p>';
  const li=s=>{s=s.replace(/。$/,'');const m=s.match(/^([^：；]{1,40})：(.+)$/);if(m&&m[2].split('；').length>=3)return '<li><b>'+esc(m[1])+'</b><ul>'+m[2].split('；').map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></li>';
    const parts=s.split('；');if(parts.length>=3)return '<li>'+parts.map(x=>esc(x)).join('<br>')+'</li>';return '<li>'+esc(s)+'</li>'};
  return '<ul class="pl">'+ss.map(li).join('')+'</ul>'};
const factsT=f=>f?'<div class="tw"><table class="ft"><thead><tr>'+f.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+f.rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'';
const lab=x=>/^[一二三四五六七八九十]+(之[一二三四五六七八九十]+)?$/.test(x)?'第'+x+'點':/^[0-9]+(-[0-9]+)?$/.test(x)?'第'+x+'條':x;
const mem={};
const store={get(k){try{const v=localStorage.getItem(k);return v===null?mem[k]:v}catch(e){return mem[k]}},set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const BOXKEY='twlife_boxes_v2';
let boxes={};try{boxes=JSON.parse(store.get(BOXKEY)||'{}')}catch(e){boxes={}}
const saveBoxes=()=>store.set(BOXKEY,JSON.stringify(boxes));
function Flash(root,getCards){
  let queue=[],cur=null,flipped=false;
  function build(){const cs=getCards();queue=shuffle(cs.filter(c=>(boxes[c.key]||0)<1)).sort((a,b)=>(boxes[a.key]||0)-(boxes[b.key]||0));flipped=false}
  function render(){
    const cs=getCards(),n=cs.length,done=cs.filter(c=>(boxes[c.key]||0)>=1).length;
    let h='<div class="stat">已熟練 '+done+' / '+n+' 張（答對 1 次視為熟練，進度存在這個瀏覽器）</div><div class="bar"><i style="width:'+(n?done/n*100:0)+'%"></i></div>';
    if(!n){root.innerHTML=h+'<div class="card"><p>沒有可用的閃卡。</p></div>';return}
    if(!queue.length){root.innerHTML=h+'<div class="card"><h3>全部熟練了</h3><p>可以去做情境題，或重設後再來一輪。</p></div><div class="row"><button class="btn" data-a="reset">重設進度</button></div>';return}
    cur=queue[0];
    h+='<div class="card fc" tabindex="0" role="button" data-a="flip"><small>'+(cur.tag?esc(cur.tag)+'｜':'')+esc(lab(cur.ref))+'｜剩 '+queue.length+' 張</small><div class="q">'+esc(cur.front)+'</div>'+(flipped?'<div class="a"><span class="lab fact">答案</span>'+esc(cur.back)+'</div>':'<small>點一下翻面</small>')+'</div>';
    if(flipped)h+='<div class="row"><button class="btn bad" data-a="no">還不熟</button><button class="btn ok" data-a="yes">會了</button></div>';
    h+='<div class="row"><button class="btn" data-a="reset">重設進度</button></div>';
    root.innerHTML=h;
  }
  root.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
    if(a==='flip'){flipped=!flipped;render()}
    else if(a==='reset'){if(confirm('確定要清除這些閃卡的進度？')){getCards().forEach(c=>delete boxes[c.key]);saveBoxes();build();render()}}
    else if(cur&&(a==='yes'||a==='no')){const ok=a==='yes';boxes[cur.key]=ok?Math.min(1,(boxes[cur.key]||0)+1):0;saveBoxes();queue.shift();if(!ok||boxes[cur.key]<1)queue.splice(queue.length?Math.max(1,Math.min(queue.length,ok?6:3)):0,0,cur);flipped=false;render()}});
  root.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.fc')){e.preventDefault();flipped=!flipped;render()}});
  return {refresh(){build();render()}};
}
function Quiz(root,getItems,perRound){
  let items=[],score=0,answered=0,done=false;
  function draw(){
    const perms=items.map(s=>shuffle(s.opts.map((_,k)=>k)));
    root.innerHTML='<div class="stat" id="sc"></div>'+items.map((s,i)=>'<div class="card" data-i="'+i+'"><b>'+(i+1)+'. </b><span class="lab my">'+(s.tag?esc(s.tag)+' ':'')+esc(lab(s.ref))+'</span>'+esc(s.q)+perms[i].map((k,pos)=>'<button class="opt" data-o="'+k+'">'+String.fromCharCode(65+pos)+'. '+esc(s.opts[k])+'</button>').join('')+'<div class="why"></div></div>').join('')+'<div id="qend"></div>';
    score=0;answered=0;upd();
  }
  function upd(){const el=$('#sc',root);if(el)el.textContent='已作答 '+answered+' / '+items.length+'，答對 '+score+' 題';
    if(perRound&&answered===items.length&&items.length){$('#qend',root).innerHTML='<div class="card"><h3>這一組：'+score+' / '+items.length+'</h3></div><div class="row"><button class="btn pri" data-a="again">再來一組</button></div>'}}
  function again(){const all=getItems();items=perRound?shuffle(all).slice(0,perRound):all;draw()}
  root.addEventListener('click',e=>{
    const ag=e.target.closest('[data-a="again"]');if(ag){again();window.scrollTo(0,root.offsetTop-60);return}
    const b=e.target.closest('.opt');if(!b)return;const box=b.closest('.card');if(box.dataset.done)return;
    const s=items[+box.dataset.i],j=+b.dataset.o;box.dataset.done=1;answered++;if(j===s.ans)score++;
    let right='';$$('.opt',box).forEach((x,pos)=>{const k=+x.dataset.o;if(k===s.ans){x.classList.add('right');right=String.fromCharCode(65+pos)}else if(k===j)x.classList.add('wrong')});
    const w=$('.why',box);w.style.display='block';w.innerHTML=(j===s.ans?'答對了。':'答錯了，正解是 '+right+'。')+esc(s.why);upd()});
  return {refresh:again};
}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const LAWS=D.laws;
$('#h1').textContent=D.chapter+'｜'+D.title;
$('#intro').textContent=D.summary||'';
document.title=D.chapter+' '+D.title;
$('#foot').innerHTML='官方來源：'+LAWS.map(L=>esc(L.name)+'（'+esc(L.amended)+(L.kind==='press'?'發布':'修正')+'）<a href="'+esc(L.url)+'" target="_blank" rel="noopener">'+esc(L.url)+'</a>').join('<br>')+(D.scope?'<br>'+esc(D.scope):'')+'<br>條文原文取自官方網頁；「白話」「口訣」「情境題」為編寫者整理，不是法條。法規可能再修正，請以官方最新公告為準；本內容不是法律或投資意見。';
const TABS=[['read','條文速讀'],['table','對照表'],['cards','閃卡'],['quiz','情境題']];
const nav=$('#nav');
TABS.forEach(([id,name])=>{const b=document.createElement('button');b.textContent=name;b.setAttribute('role','tab');b.dataset.id=id;b.onclick=()=>show(id);nav.appendChild(b)});
let curTab='read';
function show(id,anchor){curTab=id;TABS.forEach(([t])=>$('#s-'+t).classList.toggle('on',t===id));$$('button',nav).forEach(b=>b.setAttribute('aria-selected',b.dataset.id===id));
  history.replaceState(null,'','#'+id+(anchor?'/'+anchor:''));
  if(anchor){const el=document.getElementById(anchor);if(el){const d=el.querySelector('details');el.scrollIntoView({block:'start'});el.classList.add('hl')}}else window.scrollTo(0,0)}
$('#s-read').innerHTML=(D.alerts||[]).map(a=>'<div class="banner"><b>'+esc(a.t)+'</b>'+esc(a.d)+'</div>').join('')+D.clauses.map(c=>{
  const off=c.official.map(p=>'<p>'+esc(p)+'</p>').join('');
  return '<div class="card" id="c'+esc(c.no)+'"><h3><span class="no">'+esc(lab(c.no))+'</span>'+esc(c.title)+'</h3>'
   +'<div class="pw"><span class="lab my">白話</span>'+fmt(c.plain)+'</div>'+factsT(c.facts)
   +(c.mnemonic?'<div class="mn"><span class="lab my">口訣</span>'+esc(c.mnemonic)+'</div>':'')
   +(c.tip?'<p><span class="lab hint">提醒</span>'+esc(c.tip)+'</p>':'')
   +(c.official.length?'<details><summary>展開官方條文原文</summary><div class="off"><span class="lab fact">原文</span>'+off+'</div></details>':'')+'</div>'}).join('');
$('#s-table').innerHTML=D.tables.map((t,i)=>'<h3 id="t'+i+'">'+esc(t.title)+'</h3><div class="tw"><table><thead><tr>'+t.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+t.rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>').join('');
const cardsAll=D.cards.map(c=>({key:'ch'+D.chNo+':'+c.id,ref:c.ref,front:c.front,back:c.back}));
const fl=Flash($('#s-cards'),()=>cardsAll);fl.refresh();
const qz=Quiz($('#s-quiz'),()=>D.scenarios,0);qz.refresh();
// 上下章
const N=D.nav||{};
function setLink(el,o,dir){if(o){el.href=o.file;el.textContent=dir==='p'?'← '+o.label:o.label+' →'}else{el.style.visibility='hidden'}}
setLink($('#prev'),N.prev,'p');setLink($('#next'),N.next,'n');
// 左右滑動：換分頁，到頭就換章
function step(d){const i=TABS.findIndex(t=>t[0]===curTab)+d;
  if(i<0){if(N.prev)location.href=N.prev.file+'#read';return}
  if(i>=TABS.length){if(N.next)location.href=N.next.file+'#read';return}
  show(TABS[i][0])}
let sx=0,sy=0,skip=false;
document.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;const el=e.target&&e.target.nodeType===1?e.target:(e.target&&e.target.parentElement);skip=!!(el&&el.closest('.tw,nav,input,.off'))},{passive:true});
document.addEventListener('touchend',e=>{if(skip)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>70&&Math.abs(dy)<45){step(dx<0?1:-1)}},{passive:true});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1)});
// 深層連結
function route(){const h=(location.hash||'#read').slice(1).split('/');show(TABS.some(t=>t[0]===h[0])?h[0]:'read',h[1]?decodeURIComponent(h[1]):null)}
window.addEventListener('hashchange',route);route();
</script></body></html>
