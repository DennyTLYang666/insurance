<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>第三章 管理外匯條例</title><style>:root{--bg:#f7f6f2;--card:#fff;--ink:#222;--sub:#666;--line:#e3e0d8;--brand:#1f5f8b;--brand2:#e8f1f7;--ok:#2e7d32;--okbg:#e8f5e9;--bad:#b3261e;--badbg:#fdecea;--warn:#8a5a00;--warnbg:#fff4de}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
a{color:var(--brand)}
header{background:var(--brand);color:#fff;padding:12px 16px 14px}
header a{color:#fff;text-decoration:none;font-size:14px;opacity:.9}
header h1{margin:4px 0 0;font-size:20px;line-height:1.4}
header p{margin:6px 0 0;font-size:14px;opacity:.95}
.wrap{max-width:900px;margin:0 auto;padding:0 12px 60px}
.banner{background:var(--warnbg);color:var(--warn);border:1px solid #f0d9a8;border-radius:8px;padding:10px 12px;margin:12px 0;font-size:14px}
.banner b{margin-right:4px}
nav{position:sticky;top:0;background:var(--bg);z-index:5;display:flex;gap:6px;padding:10px 0;overflow-x:auto;border-bottom:1px solid var(--line)}
nav button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:15px;cursor:pointer;color:var(--ink)}
nav button[aria-selected="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
section{display:none;padding-top:14px}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 12px}
.card h3{margin:0 0 6px;font-size:17px}
.no{display:inline-block;background:var(--brand);color:#fff;border-radius:6px;padding:0 8px;margin-right:8px;font-size:14px}
.lab{display:inline-block;font-size:12px;border-radius:4px;padding:0 6px;margin-right:6px;vertical-align:1px}
.lab.fact{background:#e3f2e5;color:#1b5e20}.lab.my{background:#e8eaf6;color:#283593}.lab.hint{background:var(--warnbg);color:var(--warn)}
.mn{background:var(--brand2);border-radius:8px;padding:8px 10px;margin:8px 0}
details{margin:8px 0}details summary{cursor:pointer;color:var(--brand);font-size:15px}
.off{border-left:3px solid var(--brand);padding:2px 0 2px 10px;margin:8px 0;font-size:15px;color:#333}.off p{margin:4px 0}
table{border-collapse:collapse;width:100%;font-size:15px;background:#fff}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}th{background:var(--brand2)}
.tw{overflow-x:auto;margin-bottom:16px}
.fc{min-height:210px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.fc .q{font-size:19px;font-weight:600}.fc .a{font-size:16px;text-align:left;margin-top:8px}.fc small{color:var(--sub)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.btn{border:1px solid var(--brand);background:#fff;color:var(--brand);border-radius:8px;padding:9px 16px;font-size:16px;cursor:pointer}
.btn.pri{background:var(--brand);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0}.bar>i{display:block;height:100%;background:var(--ok)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;margin:6px 0;font-size:16px;cursor:pointer}
.opt.right{background:var(--okbg);border-color:var(--ok)}.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.why{display:none;background:var(--brand2);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:15px}
.stat{color:var(--sub);font-size:14px}
footer{color:var(--sub);font-size:13px;margin-top:24px}
.pager{display:flex;justify-content:space-between;gap:8px;margin-top:18px}.pager a{flex:1;text-align:center;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px;text-decoration:none;font-size:14px}
.hl{animation:hl 1.6s ease-out}@keyframes hl{0%{box-shadow:0 0 0 4px #ffd54f}100%{box-shadow:0 0 0 0 transparent}}
mark{background:#fff0a8;padding:0 1px}
.search{display:flex;gap:8px;margin:14px 0 6px}.search input{flex:1;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.res{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0;display:block;text-decoration:none;color:var(--ink)}
.res small{color:var(--sub)}.res b{color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.ch{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-decoration:none;color:var(--ink);display:block}
.ch:hover{border-color:var(--brand)}.ch h3{margin:0 0 4px;font-size:16px;color:var(--brand)}.ch p{margin:4px 0;font-size:14px}
.chip{display:inline-block;background:var(--brand2);color:#134;border-radius:999px;padding:0 9px;margin:2px 3px 2px 0;font-size:12.5px}
.filter{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.filter button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer}.filter button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
h2{font-size:18px;margin:24px 0 8px}
</style></head>

<script id="data" type="application/json">{"chapter": "第三章", "title": "管理外匯條例", "laws": [{"name": "管理外匯條例", "amended": "民國98年4月29日", "url": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380026", "source": "全國法規資料庫", "retrieved": "2026-10-30"}, {"name": "管理外匯條例沿革（行政院公告：財政部權責改由金管會）", "amended": "民國101年6月25日公告", "docno": "院臺規字第1010134960號", "url": "https://law.moj.gov.tw/LawClass/LawHistory.aspx?pcode=G0380026", "source": "全國法規資料庫", "retrieved": "2026-10-31", "kind": "order"}], "alerts": [{"t": "機關名稱的注意", "d": "條文字面仍寫「財政部」（第3、4、9、11、13、15、16、18條）。依行政院民國101年6月25日院臺規字第1010134960號公告，這些權責自101年7月1日起改由金管會管轄（93年7月1日起曾先由行政院金管會管轄），考題答案以金管會為準。"}, {"t": "罰則先分清楚", "d": "罰鍰（第19-2、20、23條）、沒入（第24條）、沒收與刑責（第22條）是三種不同處分，題目常拿來互相混淆。"}], "clauses": [{"no": "1", "title": "立法目的", "official": ["為平衡國際收支，穩定金融，實施外匯管理，特制定本條例。"], "plain": "三個目的：平衡國際收支、穩定金融、實施外匯管理。", "mnemonic": "目的「平、穩、管」。", "tip": "條文沒有「維持對內及對外幣值之穩定」這一項。"}, {"no": "2", "title": "外匯的定義", "official": ["本條例所稱外匯，指外國貨幣、票據及有價證券。", "前項外國有價證券之種類，由掌理外匯業務機關核定之。"], "plain": "外匯＝外國貨幣、票據、有價證券。外國有價證券的種類，由掌理外匯業務機關（央行）核定。", "mnemonic": "外匯三樣「幣、票、證」。", "tip": "目前條文的定義不含黃金、白銀。"}, {"no": "3", "title": "兩個機關", "official": ["管理外匯之行政主管機關為財政部，掌理外匯業務機關為中央銀行。"], "plain": "管理外匯分兩個角色：行政主管機關，以及掌理外匯業務機關（中央銀行）。", "mnemonic": "行政管「政」，央行管「業務」。", "tip": "條文字面寫「財政部」，現行管轄機關是金管會（行政院101年6月25日院臺規字第1010134960號公告）；掌理外匯業務機關是中央銀行。"}, {"no": "4", "title": "行政主管機關辦理事項", "official": ["管理外匯之行政主管機關辦理左列事項：", "一、政府及公營事業外幣債權、債務之監督與管理；其與外國政府或國際組織有條約或協定者，從其條約或協定之規定。", "二、國庫對外債務之保證、管理及其清償之稽催。", "三、軍政機關進口外匯、匯出款項與借款之審核及發證。", "四、與中央銀行或國際貿易主管機關有關外匯事項之聯繫及配合。", "五、依本條例規定，應處罰鍰之裁決及執行。", "六、其他有關外匯行政事項。"], "plain": "行政主管機關辦六件事：政府及公營事業的外幣債權債務、國庫對外債務保證、軍政機關進口外匯及匯出款項審核發證、聯繫配合央行與國貿主管機關、罰鍰裁決與執行、其他外匯行政事項。", "mnemonic": "關鍵字「政府、國庫、軍政、聯繫、罰鍰」。", "tip": "凡是「罰鍰的裁決與執行」，都是行政主管機關，不是央行。"}, {"no": "5", "title": "掌理外匯業務機關（央行）辦理事項", "official": ["掌理外匯業務機關辦理左列事項：", "一、外匯調度及收支計畫之擬訂。", "二、指定銀行辦理外匯業務，並督導之。", "三、調節外匯供需，以維持有秩序之外匯市場。", "四、民間對外匯出、匯入款項之審核。", "五、民營事業國外借款經指定銀行之保證、管理及清償稽、催之監督。", "六、外國貨幣、票據及有價證券之買賣。", "七、外匯收支之核算、統計、分析及報告。", "八、其他有關外匯業務事項。"], "plain": "央行辦八件事：外匯調度與收支計畫、指定並督導銀行、調節外匯供需、審核民間匯出匯入款項、監督民營事業國外借款、買賣外國貨幣票據有價證券、外匯收支的核算統計分析、其他業務。", "mnemonic": "關鍵字「外國、外匯」：只要題目出現外匯調度、市場、指定銀行、買賣，就是央行。", "tip": "和第4條對照：第4條是「政」，第5條是「業務」。"}, {"no": "6-1", "title": "新臺幣五十萬元以上的申報", "official": ["新臺幣五十萬元以上之等值外匯收支或交易，應依規定申報；其申報辦法由中央銀行定之。", "依前項規定申報之事項，有事實足認有不實之虞者，中央銀行得向申報義務人查詢，受查詢者有據實說明之義務。"], "plain": "新臺幣五十萬元以上等值的外匯收支或交易要申報，辦法由央行定。申報事項有不實之虞時，央行可以查詢，受查詢者有據實說明的義務。", "mnemonic": "申報門檻「五十萬」。", "tip": "這一條是第四章「外匯收支或交易申報辦法」的法源，罰則在第20條。"}, {"no": "7", "title": "應結售或存入的外匯", "official": ["左列各款外匯，應結售中央銀行或其指定銀行，或存入指定銀行，並得透過該行在外匯市場出售；其辦法由財政部會同中央銀行定之：", "一、出口或再出口貨品或基於其他交易行為取得之外匯。", "二、航運業、保險業及其他各業人民基於勞務取得之外匯。", "三、國外匯入款。", "四、在中華民國境內有住、居所之本國人，經政府核准在國外投資之收入。", "五、本國企業經政府核准國外投資、融資或技術合作取得之本息、淨利及技術報酬金。", "六、其他應存入或結售之外匯。", "華僑或外國人投資之事業，具有高級科技，可提升工業水準並促進經濟發展，經專案核准者，得逕以其所得之前項各款外匯抵付第十三條第一款、第二款及第五款至第八款規定所需支付之外匯。惟定期結算之餘額，仍應依前項規定辦理；其辦法由中央銀行定之。"], "plain": "六類外匯要結售給央行或指定銀行，或存入指定銀行：出口貨款、勞務所得（包含保險業）、國外匯入款、核准國外投資收入、企業核准國外投資融資技術合作所得、其他。", "mnemonic": "「進」＝結售或存入（第7條）；「出」＝得提用或結購（第13條）。", "tip": "保險業基於勞務取得的外匯在第二款裡。違反第7條的罰則在第20條第2項。"}, {"no": "9", "title": "出境攜帶外幣限額", "official": ["出境之本國人及外國人，每人攜帶外幣總值之限額，由財政部以命令定之。"], "plain": "出境每人可攜帶外幣的限額，由行政主管機關以命令訂定。", "mnemonic": "", "tip": "條文字面寫財政部，見第3條提醒。"}, {"no": "11", "title": "攜帶外幣出入國境要報明海關", "official": ["旅客或隨交通工具服務之人員，攜帶外幣出入國境者，應報明海關登記；其有關辦法，由財政部會同中央銀行定之。"], "plain": "攜帶外幣出入國境要「報明海關」登記。", "mnemonic": "報明「海關」。", "tip": "不報明登記的後果在第24條第3項：沒入。"}, {"no": "13", "title": "得提用或結購的外匯（九款）", "official": ["左列各款所需支付之外匯，得自第七條規定之存入外匯自行提用或透過指定銀行在外匯市場購入或向中央銀行或其指定銀行結購；其辦法由財政部會同中央銀行定之：", "一、核准進口貨品價款及費用。", "二、航運業、保險業與其他各業人民，基於交易行為或勞務所需支付之費用及款項。", "三、前往國外留學、考察、旅行、就醫、探親、應聘及接洽業務費用。", "四、服務於中華民國境內中國機關及企業之本國人或外國人，贍養其在國外家屬費用。", "五、外國人及華僑在中國投資之本息及淨利。", "六、經政府核准國外借款之本息及保證費用。", "七、外國人及華僑與本國企業技術合作之報酬金。", "八、經政府核准向國外投資或貸款。", "九、其他必要費用及款項。"], "plain": "九類支出需要的外匯，可以從存入外匯自行提用，或在外匯市場購入，或向央行或指定銀行結購：進口貨款、保險業等基於交易或勞務所需費用、留學旅行就醫等、贍養國外家屬、外國人及華僑在中國投資本息淨利、核准國外借款本息、技術合作報酬金、核准國外投資或貸款、其他必要。", "mnemonic": "「付」＝第13條，九款。", "tip": "第13條只是列舉「得」的用途，和第7條「應」結售不同。"}, {"no": "15", "title": "免結匯報運進口", "official": ["左列國外輸入貨品，應向財政部申請核明免結匯報運進口：", "一、國外援助物資。", "二、政府以國外貸款購入之貨品。", "三、學校及教育、研究、訓練機關接受國外捐贈，供教學或研究用途之貨品。", "四、慈善機關、團體接受國外捐贈供救濟用途之貨品。", "五、出入國境之旅客及在交通工具服務之人員，隨身攜帶行李或自用貨品。"], "plain": "五類輸入貨品，向（行政主管機關）申請核明免結匯報運進口：國外援助物資、政府國外貸款購入貨品、學校教育研究訓練機關受贈的教學研究用貨品、慈善機關受贈救濟用貨品、旅客與交通工具服務人員的隨身行李或自用貨品。", "mnemonic": "「免結匯」找行政主管機關（條文字面：財政部）。", "tip": ""}, {"no": "16", "title": "餽贈品、商業樣品、非賣品", "official": ["國外輸入餽贈品、商業樣品及非賣品，其價值不超過一定限額者，得由海關核准進口；其限額由財政部會同國際貿易主管機關以命令定之。"], "plain": "價值不超過一定限額的餽贈品、商業樣品、非賣品，可由海關核准進口。", "mnemonic": "核准進口找「海關」。", "tip": ""}, {"no": "17", "title": "原因消滅，存入或售還", "official": ["經自行提用、購入及核准結匯之外匯，如其原因消滅或變更，致全部或一部之外匯無須支付者，應依照中央銀行規定期限，存入或售還中央銀行或其指定銀行。"], "plain": "已提用、購入或核准結匯的外匯，如果原因消滅或變更而不用付了，要依央行規定期限，存入或售還央行或指定銀行。", "mnemonic": "「存入或售還」，對象是央行或其指定銀行。", "tip": ""}, {"no": "18", "title": "央行按期彙報", "official": ["中央銀行應將外匯之買賣、結存、結欠及對外保證責任額，按期彙報財政部。"], "plain": "央行要把外匯買賣、結存、結欠、對外保證責任額，按期彙報行政主管機關。", "mnemonic": "", "tip": "條文字面寫財政部，見第3條提醒。"}, {"no": "19-1", "title": "行政院的外匯緊急處置", "official": ["有左列情事之一者，行政院得決定並公告於一定期間內，採取關閉外匯市場、停止或限制全部或部分外匯之支付、命令將全部或部分外匯結售或存入指定銀行、或為其他必要之處置：", "一、國內或國外經濟失調，有危及本國經濟穩定之虞。", "二、本國國際收支發生嚴重逆差。", "前項情事之處置項目及對象，應由行政院訂定外匯管制辦法。", "行政院應於前項決定後十日內，送請立法院追認，如立法院不同意時，該決定應即失效。", "第一項所稱一定期間，如遇立法院休會時，以二十日為限。"], "plain": "兩種情事（國內或國外經濟失調危及經濟穩定；國際收支嚴重逆差）時，行政院可決定並公告一定期間內採取：關閉外匯市場、停止或限制外匯支付、命令結售或存入指定銀行、其他必要處置。決定後十日內要送立法院追認，不同意就失效。立法院休會時，一定期間以二十日為限。", "mnemonic": "四種措施「關、停、命、其他」；時間「十日追認、休會二十日」。", "tip": "第一款的「失調」是國內或國外都算；新臺幣匯率大幅波動並不在列舉情事內。"}, {"no": "19-2", "title": "違反緊急處置的罰則", "official": ["故意違反行政院依第十九條之一所為之措施者，處新臺幣三百萬元以下罰鍰。", "前項規定於立法院對第十九條之一之施行不同意追認時免罰。"], "plain": "故意違反第19-1條措施，處新臺幣300萬元以下罰鍰；立法院不同意追認時免罰。", "mnemonic": "「三百萬以下」。", "tip": ""}, {"no": "19-3", "title": "配合國際合作的處置", "official": ["為配合聯合國決議或國際合作有必要時，行政院金融監督管理委員會（以下簡稱金管會）會同中央銀行報請行政院核定後，得對危害國際安全之國家、地區或恐怖組織相關之個人、法人、團體、機關、機構於銀行業之帳戶、匯款、通貨或其他支付工具，為禁止提款、轉帳、付款、交付、轉讓或其他必要處置。", "依前項核定必要處置措施時，金管會應立即公告，並於公告後十日內送請立法院追認，如立法院不同意時，該處置措施應即失效。", "採取處置措施之原因消失時，應即解除之。"], "plain": "為配合聯合國決議或國際合作，金管會會同央行報請行政院核定後，可對與危害國際安全的國家、地區或恐怖組織相關者，在銀行業的帳戶、匯款、通貨、支付工具，禁止提款、轉帳、付款、交付、轉讓或其他必要處置。處置後十日內送立法院追認；原因消失就要解除。", "mnemonic": "對象「國家、地區、恐怖組織」；範圍「帳戶、匯款、通貨、其他支付工具」。", "tip": "條文寫的是「恐怖組織」，沒有寫「洗錢組織」。"}, {"no": "20", "title": "申報不實與不結售的罰則", "official": ["違反第六條之一規定，故意不為申報或申報不實者，處新臺幣三萬元以上六十萬元以下罰鍰；其受查詢而未於限期內提出說明或為虛偽說明者亦同。", "違反第七條規定，不將其外匯結售或存入中央銀行或其指定銀行者，依其不結售或不存入外匯，處以按行為時匯率折算金額二倍以下之罰鍰，並由中央銀行追繳其外匯。"], "plain": "第一項：違反第6-1條，故意不申報或申報不實，處3萬元以上60萬元以下罰鍰；被查詢時沒在期限內說明或做虛偽說明，也一樣。第二項：違反第7條不結售或不存入，處按行為時匯率折算金額二倍以下罰鍰，並由央行追繳外匯。", "mnemonic": "「三到六十萬」「兩倍以下並追繳」。", "tip": "申報辦法第16條的處罰，就是依本條第1項。"}, {"no": "22", "title": "非法買賣外匯為常業", "official": ["以非法買賣外匯為常業者，處三年以下有期徒刑、拘役或科或併科與營業總額等值以下之罰金；其外匯及價金沒收之。", "法人之代表人、法人或自然人之代理人、受僱人或其他從業人員，因執行業務，有前項規定之情事者，除處罰其行為人外，對該法人或自然人亦科以該項之罰金。"], "plain": "以非法買賣外匯為常業，處三年以下有期徒刑、拘役，或科或併科與營業總額等值以下的罰金，外匯及價金沒收。業務執行人犯此，行為人要罰，法人或本人也併科罰金（雙罰）。", "mnemonic": "「三年以下」。", "tip": "這是刑事責任，用「沒收」；第24條的是行政處分，用「沒入」。"}, {"no": "23", "title": "不以外匯歸還的罰鍰", "official": ["依本條例規定應追繳之外匯，其不以外匯歸還者，科以相當於應追繳外匯金額以下之罰鍰。"], "plain": "應追繳的外匯如果不以外匯歸還，科以相當於應追繳外匯金額以下的罰鍰。", "mnemonic": "", "tip": ""}, {"no": "24", "title": "沒入的四種情形", "official": ["買賣外匯違反第八條之規定者，其外匯及價金沒入之。", "攜帶外幣出境超過依第九條規定所定之限額者，其超過部分沒入之。", "攜帶外幣出入國境，不依第十一條規定報明登記者，沒入之；申報不實者，其超過申報部分沒入之。"], "plain": "四種都是「沒入」：違規買賣外匯（外匯與價金）、出境攜帶超過限額（超過部分）、出入國境不報明登記（全部）、申報不實（超過申報部分）。", "mnemonic": "第24條＝沒入，不是罰鍰也不是徒刑。", "tip": "題目一看到第24條，先想「沒入」。"}, {"no": "26-1", "title": "停止適用與追認", "official": ["本條例於國際貿易發生長期順差、外匯存底鉅額累積或國際經濟發生重大變化時，行政院得決定停止第七條、第十三條及第十七條全部或部分條文之適用。", "行政院恢復前項全部或部分條文之適用後十日內，應送請立法院追認，如立法院不同意時，該恢復適用之決定，應即失效。"], "plain": "國際貿易長期順差、外匯存底鉅額累積或國際經濟重大變化時，行政院可以決定停止適用第7、13、17條。恢復適用後十日內要送立法院追認，立法院不同意就失效。", "mnemonic": "停止的是「7、13、17」三條；追認要「十日內」。", "tip": "決定停止的是行政院，恢復後要送立法院追認，不是央行或總統。"}], "tables": [{"title": "第4條 vs 第5條：兩個機關各辦什麼", "head": ["", "行政主管機關（第4條）", "掌理外匯業務機關＝中央銀行（第5條）"], "rows": [["關鍵字", "政府、國庫、軍政、聯繫、罰鍰", "外國、外匯、市場、指定銀行"], ["外匯債務", "政府及公營事業外幣債權債務；國庫對外債務保證與稽催", "民營事業國外借款的保證、管理、清償稽催之監督"], ["審核", "軍政機關進口外匯、匯出款項與借款", "民間對外匯出、匯入款項"], ["市場與業務", "—", "外匯調度與收支計畫、指定並督導銀行、調節供需、買賣外國貨幣票據有價證券、統計分析報告"], ["罰鍰", "罰鍰的裁決與執行", "—"]]}, {"title": "罰則對照", "head": ["條文", "行為", "處罰"], "rows": [["第19-2條", "故意違反行政院依19-1所為措施", "新臺幣300萬元以下罰鍰；立法院不同意追認時免罰"], ["第20條第1項", "故意不申報、申報不實；受查詢未於限期說明或虛偽說明", "新臺幣3萬元以上60萬元以下罰鍰"], ["第20條第2項", "違反第7條，不結售或不存入外匯", "按行為時匯率折算金額二倍以下罰鍰，並由央行追繳外匯"], ["第22條", "以非法買賣外匯為常業", "三年以下有期徒刑、拘役，或科或併科與營業總額等值以下罰金；外匯及價金沒收；法人併科"], ["第23條", "應追繳外匯不以外匯歸還", "相當於應追繳外匯金額以下罰鍰"]]}, {"title": "第24條：沒入", "head": ["行為", "沒入範圍"], "rows": [["買賣外匯違反第8條", "外匯及價金"], ["攜帶外幣出境超過第9條限額", "超過部分"], ["攜帶外幣出入國境，不依第11條報明登記", "外幣全部"], ["攜帶外幣出入國境，申報不實", "超過申報部分"]]}, {"title": "數字與期限", "head": ["項目", "規定", "條文"], "rows": [["申報門檻", "新臺幣五十萬元以上之等值外匯收支或交易", "第6-1條"], ["違反緊急處置罰鍰", "新臺幣三百萬元以下", "第19-2條"], ["申報不實罰鍰", "三萬元以上六十萬元以下", "第20條第1項"], ["不結售罰鍰", "按行為時匯率折算金額二倍以下", "第20條第2項"], ["非法買賣外匯為常業", "三年以下有期徒刑", "第22條"], ["緊急處置送立法院追認", "行政院決定後十日內", "第19-1條"], ["立法院休會時一定期間", "以二十日為限", "第19-1條"], ["金管會處置公告後送追認", "十日內", "第19-3條"], ["恢復第7、13、17條後送追認", "十日內", "第26-1條"]]}], "scenarios": [{"ref": "24", "q": "旅客入境攜帶外幣，沒有向海關報明登記，被查獲。依第24條，處分是？", "opts": ["處新臺幣三百萬元以下罰鍰", "沒入", "處三年以下有期徒刑", "處新臺幣三萬元以上六十萬元以下罰鍰"], "ans": 1, "why": "第24條第3項：攜帶外幣出入國境，不依第11條規定報明登記者，沒入之；申報不實者，其超過申報部分沒入之。"}, {"ref": "20", "q": "某人為達避稅目的，對新臺幣五十萬元以上的外匯收支故意申報不實。依第20條第1項，罰則是？", "opts": ["處新臺幣一萬元以上二十萬元以下罰鍰", "處新臺幣三萬元以上六十萬元以下罰鍰", "處新臺幣五萬元以上八十萬元以下罰鍰", "沒入其外匯"], "ans": 1, "why": "第20條第1項：違反第6-1條，故意不為申報或申報不實者，處新臺幣三萬元以上六十萬元以下罰鍰；受查詢時未於限期說明或虛偽說明亦同。"}, {"ref": "22", "q": "某人長期私下替人買賣外匯營利，構成「以非法買賣外匯為常業」。依第22條，下列何者正確？", "opts": ["處三年以下有期徒刑、拘役或科或併科與營業總額等值以下之罰金，外匯及價金沒收", "僅處罰鍰", "僅沒入外匯", "處一年以下有期徒刑"], "ans": 0, "why": "第22條：處三年以下有期徒刑、拘役或科或併科與營業總額等值以下之罰金；其外匯及價金沒收之。"}, {"ref": "2", "q": "依第2條，「外匯」的定義是？", "opts": ["外國貨幣、票據及有價證券", "外國貨幣、票據、有價證券及黃金", "外國貨幣及黃金", "外國貨幣及存款"], "ans": 0, "why": "第2條第1項：本條例所稱外匯，指外國貨幣、票據及有價證券。"}, {"ref": "5", "q": "「調節外匯供需，以維持有秩序之外匯市場」，依第5條屬於誰的職掌？", "opts": ["行政主管機關", "掌理外匯業務機關（中央銀行）", "國際貿易主管機關", "海關"], "ans": 1, "why": "第5條第3款：掌理外匯業務機關辦理調節外匯供需，以維持有秩序之外匯市場。"}, {"ref": "19-1", "q": "行政院依第19-1條決定關閉外匯市場。依條文，決定後要怎麼做？", "opts": ["十日內送立法院追認，不同意則失效", "三十日內送總統府備查", "由央行自行公告即可", "不需要任何追認"], "ans": 0, "why": "第19-1條第3項：行政院應於決定後十日內，送請立法院追認，如立法院不同意時，該決定應即失效。"}, {"ref": "19-2", "q": "某人故意違反行政院依第19-1條採取的外匯措施，但後來立法院不同意追認該措施。依第19-2條，這個人？", "opts": ["仍處三百萬元以下罰鍰", "免罰", "處一百萬元以下罰鍰", "處三年以下有期徒刑"], "ans": 1, "why": "第19-2條第2項：前項規定於立法院對第19-1條之施行不同意追認時免罰。"}, {"ref": "26-1", "q": "國際貿易長期順差、外匯存底鉅額累積時，誰可以決定停止第7、13、17條的適用？恢復適用後怎麼辦？", "opts": ["中央銀行；恢復後公告即可", "行政院；恢復後十日內送立法院追認", "立法院；恢復後送總統公告", "總統；恢復後送行政院核定"], "ans": 1, "why": "第26-1條：行政院得決定停止第7、13、17條的適用；恢復後十日內送請立法院追認，不同意該恢復適用的決定即失效。"}, {"ref": "20", "q": "某人違反第7條規定，不將其出口貨款外匯結售或存入央行或其指定銀行。依第20條第2項，處分是？", "opts": ["沒入全部外匯", "按行為時匯率折算金額二倍以下罰鍰，並由央行追繳外匯", "三年以下有期徒刑", "新臺幣三萬元以上六十萬元以下罰鍰"], "ans": 1, "why": "第20條第2項：違反第7條不結售或不存入者，依其不結售或不存入外匯，處按行為時匯率折算金額二倍以下罰鍰，並由中央銀行追繳其外匯。"}, {"ref": "11", "q": "旅客攜帶外幣出入國境，依第11條應向誰報明登記？", "opts": ["金管會", "中央銀行", "海關", "銀行"], "ans": 2, "why": "第11條：旅客或隨交通工具服務之人員，攜帶外幣出入國境者，應報明海關登記。"}], "cards": [{"id": 0, "ref": "1", "front": "管理外匯條例的立法目的？", "back": "平衡國際收支、穩定金融、實施外匯管理。"}, {"id": 1, "ref": "2", "front": "條文所稱「外匯」指什麼？誰核定外國有價證券的種類？", "back": "外國貨幣、票據及有價證券；由掌理外匯業務機關（央行）核定。"}, {"id": 2, "ref": "3", "front": "第3條「管理外匯之行政主管機關」，條文字面與現行管轄機關？", "back": "條文字面是財政部；依行政院101年6月25日公告，自101年7月1日起由金管會管轄。掌理外匯業務機關為中央銀行。"}, {"id": 3, "ref": "4", "front": "第4條行政主管機關辦理的六件事關鍵字？", "back": "政府（公營事業外幣債權債務）、國庫（對外債務保證與稽催）、軍政機關（進口外匯與匯出款項審核發證）、聯繫配合、罰鍰裁決與執行、其他行政事項。"}, {"id": 4, "ref": "5", "front": "第5條央行辦理的事項有哪些？", "back": "外匯調度及收支計畫、指定並督導銀行、調節外匯供需、審核民間匯出匯入、監督民營事業國外借款、買賣外國貨幣票據有價證券、收支核算統計分析報告、其他業務。"}, {"id": 5, "ref": "5", "front": "「指定銀行辦理外匯業務並督導之」是誰的職掌？", "back": "掌理外匯業務機關（中央銀行），第5條第2款。"}, {"id": 6, "ref": "6-1", "front": "外匯收支或交易達多少要申報？辦法誰訂？", "back": "新臺幣五十萬元以上之等值；申報辦法由中央銀行定。"}, {"id": 7, "ref": "7", "front": "第7條六類應結售中央銀行或指定銀行（或存入）的外匯？", "back": "出口或再出口貨品或其他交易所得；航運業、保險業及其他各業人民基於勞務所得；國外匯入款；核准國外投資的收入；企業核准國外投資融資技術合作的本息淨利及報酬金；其他。"}, {"id": 8, "ref": "9", "front": "出境攜帶外幣限額，由誰以命令定？", "back": "條文字面：財政部（見第3條提醒）。"}, {"id": 9, "ref": "11", "front": "攜帶外幣出入國境要向誰報明登記？", "back": "海關。"}, {"id": 10, "ref": "13", "front": "第13條「得」提用或結購外匯的支付用途共幾款？", "back": "九款（進口貨款、保險業等基於交易或勞務所需費用、留學旅行就醫等、贍養國外家屬、外國人及華僑在中國投資本息淨利、核准國外借款本息、技術合作報酬金、核准國外投資或貸款、其他）。"}, {"id": 11, "ref": "15", "front": "學校接受國外捐贈、供教學研究用的貨品，要向誰申請免結匯報運進口？", "back": "向（行政主管機關）申請核明，條文字面是財政部。"}, {"id": 12, "ref": "16", "front": "價值不超過一定限額的餽贈品、商業樣品、非賣品，由誰核准進口？", "back": "海關。"}, {"id": 13, "ref": "17", "front": "外匯原因消滅或變更而無須支付，怎麼辦？", "back": "依央行規定期限，存入或售還央行或其指定銀行。"}, {"id": 14, "ref": "18", "front": "央行要按期把外匯買賣、結存、結欠及對外保證責任額彙報給誰？", "back": "行政主管機關（條文字面：財政部）。"}, {"id": 15, "ref": "19-1", "front": "第19-1條行政院可採取的處置？", "back": "關閉外匯市場、停止或限制全部或部分外匯之支付、命令全部或部分外匯結售或存入指定銀行、其他必要之處置。"}, {"id": 16, "ref": "19-1", "front": "19-1條決定後多久要送立法院追認？立法院休會時一定期間上限？", "back": "決定後十日內送請立法院追認，不同意則失效；休會時一定期間以二十日為限。"}, {"id": 17, "ref": "19-2", "front": "故意違反19-1措施的罰則？何時免罰？", "back": "新臺幣三百萬元以下罰鍰；立法院不同意追認時免罰。"}, {"id": 18, "ref": "19-3", "front": "第19-3條處置的對象與措施？", "back": "對危害國際安全之國家、地區或恐怖組織相關的個人、法人、團體、機關、機構，於銀行業之帳戶、匯款、通貨或其他支付工具，禁止提款、轉帳、付款、交付、轉讓或其他必要處置。"}, {"id": 19, "ref": "20", "front": "故意不申報或申報不實，罰則？", "back": "新臺幣三萬元以上六十萬元以下罰鍰；受查詢未於限期說明或虛偽說明亦同。"}, {"id": 20, "ref": "20", "front": "違反第7條不結售或不存入外匯，罰則？", "back": "按行為時匯率折算金額二倍以下罰鍰，並由央行追繳外匯。"}, {"id": 21, "ref": "22", "front": "以非法買賣外匯為常業，罰則？", "back": "三年以下有期徒刑、拘役，或科或併科與營業總額等值以下罰金；外匯及價金沒收；法人、本人併科罰金。"}, {"id": 22, "ref": "23", "front": "應追繳外匯而不以外匯歸還，罰則？", "back": "科以相當於應追繳外匯金額以下之罰鍰。"}, {"id": 23, "ref": "24", "front": "第24條的處分是什麼？分哪四種情形？", "back": "沒入。違規買賣外匯（外匯及價金）；出境攜帶超過限額（超過部分）；出入國境不報明登記（全部）；申報不實（超過申報部分）。"}, {"id": 24, "ref": "26-1", "front": "第26-1條可以停止適用哪三條？誰決定？恢復後怎麼辦？", "back": "行政院決定停止第7、13、17條；恢復適用後十日內送立法院追認，不同意即失效。"}], "chNo": "03", "summary": "外匯管理的母法。誰管外匯、外匯要不要結售、新臺幣五十萬元申報、緊急處置，以及罰鍰、沒入與刑責的分別。", "scope": "收錄第1至5、6-1、7、9、11、13、15至18、19-1至19-3、20、22至24、26-1條。", "nav": {"prev": {"file": "ch02.html", "label": "第2章 保險業辦理外匯業務管理辦法"}, "next": {"file": "ch04.html", "label": "第4章 外匯收支或交易申報辦法"}}}</script>
<script>const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lab=x=>/^[一二三四五六七八九十]+(之[一二三四五六七八九十]+)?$/.test(x)?'第'+x+'點':/^[0-9]+(-[0-9]+)?$/.test(x)?'第'+x+'條':x;
const mem={};
const store={get(k){try{const v=localStorage.getItem(k);return v===null?mem[k]:v}catch(e){return mem[k]}},set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const BOXKEY='twlife_boxes_v2';
let boxes={};try{boxes=JSON.parse(store.get(BOXKEY)||'{}')}catch(e){boxes={}}
const saveBoxes=()=>store.set(BOXKEY,JSON.stringify(boxes));
function Flash(root,getCards){
  let queue=[],cur=null,flipped=false;
  function build(){const cs=getCards();queue=shuffle(cs.filter(c=>(boxes[c.key]||0)<3)).sort((a,b)=>(boxes[a.key]||0)-(boxes[b.key]||0));flipped=false}
  function render(){
    const cs=getCards(),n=cs.length,done=cs.filter(c=>(boxes[c.key]||0)>=3).length;
    let h='<div class="stat">已熟練 '+done+' / '+n+' 張（答對 3 次視為熟練，進度存在這個瀏覽器）</div><div class="bar"><i style="width:'+(n?done/n*100:0)+'%"></i></div>';
    if(!n){root.innerHTML=h+'<div class="card"><p>沒有可用的閃卡。</p></div>';return}
    if(!queue.length){root.innerHTML=h+'<div class="card"><h3>全部熟練了</h3><p>可以去做情境題，或重設後再來一輪。</p></div><div class="row"><button class="btn" data-a="reset">重設進度</button></div>';return}
    cur=queue[0];
    h+='<div class="card fc" tabindex="0" role="button" data-a="flip"><small>'+(cur.tag?esc(cur.tag)+'｜':'')+esc(lab(cur.ref))+'｜剩 '+queue.length+' 張</small><div class="q">'+esc(cur.front)+'</div>'+(flipped?'<div class="a"><span class="lab fact">答案</span>'+esc(cur.back)+'</div>':'<small>點一下翻面</small>')+'</div>';
    if(flipped)h+='<div class="row"><button class="btn bad" data-a="no">還不熟</button><button class="btn ok" data-a="yes">會了</button></div>';
    h+='<div class="row"><button class="btn" data-a="reset">重設進度</button></div>';
    root.innerHTML=h;
  }
  root.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
    if(a==='flip'){flipped=!flipped;render()}
    else if(a==='reset'){if(confirm('確定要清除這些閃卡的進度？')){getCards().forEach(c=>delete boxes[c.key]);saveBoxes();build();render()}}
    else if(cur&&(a==='yes'||a==='no')){const ok=a==='yes';boxes[cur.key]=ok?Math.min(3,(boxes[cur.key]||0)+1):0;saveBoxes();queue.shift();if(!ok||boxes[cur.key]<3)queue.splice(queue.length?Math.max(1,Math.min(queue.length,ok?6:3)):0,0,cur);flipped=false;render()}});
  root.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.fc')){e.preventDefault();flipped=!flipped;render()}});
  return {refresh(){build();render()}};
}
function Quiz(root,getItems,perRound){
  let items=[],score=0,answered=0,done=false;
  function draw(){
    const perms=items.map(s=>shuffle(s.opts.map((_,k)=>k)));
    root.innerHTML='<div class="stat" id="sc"></div>'+items.map((s,i)=>'<div class="card" data-i="'+i+'"><b>'+(i+1)+'. </b><span class="lab my">'+(s.tag?esc(s.tag)+' ':'')+esc(lab(s.ref))+'</span>'+esc(s.q)+perms[i].map((k,pos)=>'<button class="opt" data-o="'+k+'">'+String.fromCharCode(65+pos)+'. '+esc(s.opts[k])+'</button>').join('')+'<div class="why"></div></div>').join('')+'<div id="qend"></div>';
    score=0;answered=0;upd();
  }
  function upd(){const el=$('#sc',root);if(el)el.textContent='已作答 '+answered+' / '+items.length+'，答對 '+score+' 題';
    if(perRound&&answered===items.length&&items.length){$('#qend',root).innerHTML='<div class="card"><h3>這一組：'+score+' / '+items.length+'</h3></div><div class="row"><button class="btn pri" data-a="again">再來一組</button></div>'}}
  function again(){const all=getItems();items=perRound?shuffle(all).slice(0,perRound):all;draw()}
  root.addEventListener('click',e=>{
    const ag=e.target.closest('[data-a="again"]');if(ag){again();window.scrollTo(0,root.offsetTop-60);return}
    const b=e.target.closest('.opt');if(!b)return;const box=b.closest('.card');if(box.dataset.done)return;
    const s=items[+box.dataset.i],j=+b.dataset.o;box.dataset.done=1;answered++;if(j===s.ans)score++;
    let right='';$$('.opt',box).forEach((x,pos)=>{const k=+x.dataset.o;if(k===s.ans){x.classList.add('right');right=String.fromCharCode(65+pos)}else if(k===j)x.classList.add('wrong')});
    const w=$('.why',box);w.style.display='block';w.innerHTML=(j===s.ans?'答對了。':'答錯了，正解是 '+right+'。')+esc(s.why);upd()});
  return {refresh:again};
}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const LAWS=D.laws;
$('#h1').textContent=D.chapter+'｜'+D.title;
$('#intro').textContent=D.summary||'';
document.title=D.chapter+' '+D.title;
$('#foot').innerHTML='官方來源：'+LAWS.map(L=>esc(L.name)+'（'+esc(L.amended)+(L.kind==='press'?'發布':'修正')+'）<a href="'+esc(L.url)+'" target="_blank" rel="noopener">'+esc(L.url)+'</a>').join('<br>')+(D.scope?'<br>'+esc(D.scope):'')+'<br>條文原文取自官方網頁；「白話」「口訣」「情境題」為編寫者整理，不是法條。法規可能再修正，請以官方最新公告為準；本內容不是法律或投資意見。';
const TABS=[['read','條文速讀'],['table','對照表'],['cards','閃卡'],['quiz','情境題']];
const nav=$('#nav');
TABS.forEach(([id,name])=>{const b=document.createElement('button');b.textContent=name;b.setAttribute('role','tab');b.dataset.id=id;b.onclick=()=>show(id);nav.appendChild(b)});
let curTab='read';
function show(id,anchor){curTab=id;TABS.forEach(([t])=>$('#s-'+t).classList.toggle('on',t===id));$$('button',nav).forEach(b=>b.setAttribute('aria-selected',b.dataset.id===id));
  history.replaceState(null,'','#'+id+(anchor?'/'+anchor:''));
  if(anchor){const el=document.getElementById(anchor);if(el){const d=el.querySelector('details');el.scrollIntoView({block:'start'});el.classList.add('hl')}}else window.scrollTo(0,0)}
$('#s-read').innerHTML=(D.alerts||[]).map(a=>'<div class="banner"><b>'+esc(a.t)+'</b>'+esc(a.d)+'</div>').join('')+D.clauses.map(c=>{
  const off=c.official.map(p=>'<p>'+esc(p)+'</p>').join('');
  return '<div class="card" id="c'+esc(c.no)+'"><h3><span class="no">'+esc(lab(c.no))+'</span>'+esc(c.title)+'</h3>'
   +'<p><span class="lab my">白話</span>'+esc(c.plain)+'</p>'
   +(c.mnemonic?'<div class="mn"><span class="lab my">口訣</span>'+esc(c.mnemonic)+'</div>':'')
   +(c.tip?'<p><span class="lab hint">提醒</span>'+esc(c.tip)+'</p>':'')
   +(c.official.length?'<details><summary>展開官方條文原文</summary><div class="off"><span class="lab fact">原文</span>'+off+'</div></details>':'')+'</div>'}).join('');
$('#s-table').innerHTML=D.tables.map((t,i)=>'<h3 id="t'+i+'">'+esc(t.title)+'</h3><div class="tw"><table><thead><tr>'+t.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+t.rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>').join('');
const cardsAll=D.cards.map(c=>({key:'ch'+D.chNo+':'+c.id,ref:c.ref,front:c.front,back:c.back}));
const fl=Flash($('#s-cards'),()=>cardsAll);fl.refresh();
const qz=Quiz($('#s-quiz'),()=>D.scenarios,0);qz.refresh();
// 上下章
const N=D.nav||{};
function setLink(el,o,dir){if(o){el.href=o.file;el.textContent=dir==='p'?'← '+o.label:o.label+' →'}else{el.style.visibility='hidden'}}
setLink($('#prev'),N.prev,'p');setLink($('#next'),N.next,'n');
// 左右滑動：換分頁，到頭就換章
function step(d){const i=TABS.findIndex(t=>t[0]===curTab)+d;
  if(i<0){if(N.prev)location.href=N.prev.file+'#read';return}
  if(i>=TABS.length){if(N.next)location.href=N.next.file+'#read';return}
  show(TABS[i][0])}
let sx=0,sy=0,skip=false;
document.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;const el=e.target&&e.target.nodeType===1?e.target:(e.target&&e.target.parentElement);skip=!!(el&&el.closest('.tw,nav,input,.off'))},{passive:true});
document.addEventListener('touchend',e=>{if(skip)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>70&&Math.abs(dy)<45){step(dx<0?1:-1)}},{passive:true});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1)});
// 深層連結
function route(){const h=(location.hash||'#read').slice(1).split('/');show(TABS.some(t=>t[0]===h[0])?h[0]:'read',h[1]?decodeURIComponent(h[1]):null)}
window.addEventListener('hashchange',route);route();
</script></body></html>
