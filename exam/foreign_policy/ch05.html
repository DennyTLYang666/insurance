<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>外幣非投資型保險備考｜第六章 資格條件及注意事項</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#222;--sub:#666;--line:#e3e0d8;--brand:#1f5f8b;--brand2:#e8f1f7;--ok:#2e7d32;--okbg:#e8f5e9;--bad:#b3261e;--badbg:#fdecea;--warn:#8a5a00;--warnbg:#fff4de}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
header{background:var(--brand);color:#fff;padding:18px 16px 14px}
header h1{margin:0;font-size:20px;line-height:1.4}
header p{margin:6px 0 0;font-size:13px;opacity:.9}
.wrap{max-width:860px;margin:0 auto;padding:0 12px 60px}
.banner{background:var(--warnbg);color:var(--warn);border:1px solid #f0d9a8;border-radius:8px;padding:10px 12px;margin:12px 0;font-size:14px}
nav{position:sticky;top:0;background:var(--bg);z-index:5;display:flex;gap:6px;padding:10px 0;overflow-x:auto;border-bottom:1px solid var(--line)}
nav button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:15px;cursor:pointer;color:var(--ink)}
nav button[aria-selected="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
section{display:none;padding-top:14px}
section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 12px}
.card h3{margin:0 0 6px;font-size:17px}
.no{display:inline-block;background:var(--brand);color:#fff;border-radius:6px;padding:0 8px;margin-right:8px;font-size:14px}
.lab{display:inline-block;font-size:12px;border-radius:4px;padding:0 6px;margin-right:6px;vertical-align:1px}
.lab.fact{background:#e3f2e5;color:#1b5e20}
.lab.my{background:#e8eaf6;color:#283593}
.lab.hint{background:var(--warnbg);color:var(--warn)}
.mn{background:var(--brand2);border-radius:8px;padding:8px 10px;margin:8px 0}
details{margin:8px 0}
details summary{cursor:pointer;color:var(--brand);font-size:15px}
.off{border-left:3px solid var(--brand);padding:2px 0 2px 10px;margin:8px 0;font-size:15px;color:#333}
.off p{margin:4px 0}
table{border-collapse:collapse;width:100%;font-size:15px;background:#fff}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--brand2)}
.tw{overflow-x:auto;margin-bottom:16px}
.fc{min-height:210px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.fc .q{font-size:19px;font-weight:600}
.fc .a{font-size:16px;text-align:left;margin-top:8px}
.fc small{color:var(--sub)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.btn{border:1px solid var(--brand);background:#fff;color:var(--brand);border-radius:8px;padding:9px 16px;font-size:16px;cursor:pointer}
.btn.pri{background:var(--brand);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:var(--ok)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;margin:6px 0;font-size:16px;cursor:pointer}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.why{display:none;background:var(--brand2);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:15px}
.stat{color:var(--sub);font-size:14px}
footer{color:var(--sub);font-size:13px;margin-top:24px}
</style>
</head>

<div class="wrap">

<section id="s-read"></section>
<section id="s-table"></section>

<section id="s-watch"></section>
<footer id="foot"></footer>
</div>
<script id="data" type="application/json">{"chapter": "第五章", "title": "保險業辦理國外投資管理辦法", "laws": [{"name": "保險業辦理國外投資管理辦法", "amended": "民國115年9月4日", "docno": "金管保財字第11504931381號令", "url": "https://law.fsc.gov.tw/LawContent.aspx?id=FL006772", "source": "金融監督管理委員會主管法規共用系統", "retrieved": "2026-10-30"}], "alerts": [{"t": "這章 2026/9/4 剛修正過（必看）", "d": "官方現行條文的修正日是民國115年9月4日。和你的筆記相比，風險資本比率改用「法定標準的 1.25 倍、1.5 倍」表示（筆記是 250%、300%），第15條準備金比率是 40% 提高為 42%（筆記是 35%→37%），第6條也新增外國中央政府債的評等條件。考題若還是舊數字，請依你的教材判斷，我無法確認題庫是否已更新。"}, {"t": "本頁收錄方式", "d": "本章只有第4、9、14條放上官方原文（已逐字比對）。其餘條文只整理數字，這些數字取自官方現行條文，但沒有逐字收錄，請對照頁尾連結。"}, {"t": "5% 與 10% 怎麼分", "d": "同一標的常同時有「資金 5%」與「發行人業主權益 10%」兩個基準，請先分清楚題目問的是哪一個基準，再看對照表。"}], "clauses": [{"no": "2", "title": "名詞定義與評等計算", "official": [], "plain": "外國銀行＝全世界銀行資本或資產排名前五百名以內，或在中華民國境內設有分行的外國銀行。國內信用評等機構＝中華信評、澳商惠譽國際信評台灣分公司。「重大裁罰及處分」指金管會重大裁罰措施公布說明辦法第2條所定情事（和第六章相同的定義）。若債券沒有發行評等，原則上以發行或保證機構的評等替代，但次順位債券不得替代（見第6、7條）。", "mnemonic": "", "tip": ""}, {"no": "3", "title": "得辦理的國外投資項目（八款）", "official": [], "plain": "八款：外匯存款、國外有價證券、外幣放款、衍生性金融商品、國外不動產、設立或投資國外保險公司（代理人、經紀人、國外籌資事業、其他核准的保險相關事業）、經行政院核定的經建計畫重大投資案、其他經主管機關核准的資金運用項目。外幣放款：除外幣保單質借外，得辦理擔任外幣聯貸參加行的擔保放款（主辦行須 BBB+ 以上），且外幣放款加計保險法第146-3條第1至3款放款總餘額，不得超過資金 35%。每一公司的股票與公司債（含以其為質的放款）合併，不得超過資金 5% 與該公司業主權益 10%。", "mnemonic": "八款「外、證、貸、衍、不、保、重、他」。", "tip": "第七款（經建計畫重大投資案）須經主管機關核准（第14條）。這條和保險法第146-4條的項目不完全相同，題目會問「依哪一條」。"}, {"no": "4", "title": "外匯存款", "official": ["保險業資金運用於外匯存款，存放之銀行除中華民國境內之銀行外，並得存放於外國銀行。", "前項存款，存放於同一銀行之金額，不得超過該保險業資金百分之三。", "第一項保險業存放之外匯存款，屬保險業務需要，非為投資目的者，改依本法第一百四十六條第三項規定辦理。"], "plain": "外匯存款可以存境內銀行，也可存外國銀行；同一銀行不得超過保險業資金的 3%。", "mnemonic": "同一銀行「資金 3%」。", "tip": "是「資金」的 3%，不是業主權益。"}, {"no": "5", "title": "可投資的國外有價證券（十四類）", "official": [], "plain": "十四類：外國中央政府公債、國庫券及所屬機構債；外國地方政府債及所屬機構債；外國銀行金融債、可轉讓定期存單、浮動利率中期債券；外國銀行在臺分行（含國際金融業務分行）及大陸地區銀行在臺分行發行的外幣可轉讓定期存單；本國銀行外幣金融債及外幣可轉讓定期存單；本國企業外幣公司債；外幣商業本票；外國證券集中交易市場或店頭市場交易的股權或債權憑證；國外表彰基金之有價證券；資產證券化商品；國際性組織債；國內證券市場上市或上櫃的外幣計價股權、債權憑證或伊斯蘭固定收益證券；外國上市企業發行未於外國集中或店頭市場交易的私募公司債；其他經主管機關核准的有價證券。", "mnemonic": "", "tip": ""}, {"no": "6", "title": "債券的投資條件與限額（外國政府、銀行、商業本票）", "official": [], "plain": "外國中央政府公債、國庫券：發行人評等須 BBB- 以上。外國中央政府所屬機構債：債券評等 AA- 以上，每一機構不超過資金 5%。外國地方政府債：評等 A- 以上、主權評等 AA- 以上，每一地方政府不超過核定國外投資額度 5%。外國銀行債：原則 BBB+ 以上；符合條件者可投資 BBB-、BB+；BBB 另有條件；次順位債不得以發行或保證銀行的評等替代。次順位銀行債限額：BB+ 級不超過核定國外投資額度 2%；BBB 至 BB+ 級不超過核定額度 7.5% 或業主權益 30% 孰高（保管比重未達 30% 為 6%、30% 以上未達 50% 為 7%，皆與業主權益 30% 孰高）；每一銀行的債券與可轉讓定期存單加計股票，不超過資金 5% 及發行銀行業主權益 10%；BBB、BBB-、BB+ 次順位債每一銀行不超過保險業業主權益 10%。外幣商業本票：BBB+ 以上，每一公司（含同公司其他證券）不超過資金 5% 及發行公司業主權益 10%。", "mnemonic": "", "tip": "第6條的第1項（外國中央政府公債、國庫券須 BBB- 以上）和「115年9月4日修正施行前已持有不符規定者得繼續持有、不得再增加」的但書，是新近修正的內容，題庫可能還沒更新。"}, {"no": "7", "title": "外國市場交易的股權或債權憑證", "official": [], "plain": "四種：股票、首次公開募集（IPO）股票、公司債、非本國企業發行的存託憑證、可轉換公司債及附認股權公司債。公司債等的評等條件與第6條銀行債相同概念（BBB+ 以上為原則）。限額：BB+ 級債券總額不超過核定國外投資額度 2%；BBB- 至 BB+ 與 BBB 的合計不超過核定額度 7.5% 或業主權益 30% 孰高；每一公司的 BBB、BBB-、BB+ 債券不超過保險業業主權益 10%；股票、IPO 股票、非本國企業存託憑證、可轉換公司債及附認股權公司債的總額，不超過核定國外投資總額 40%。", "mnemonic": "「股票類四十」＝股票、IPO、存託憑證等總額不超過核定國外投資總額 40%。", "tip": "四十％是「核定國外投資總額」的 40%，不是資金的 40%。"}, {"no": "8", "title": "國外表彰基金", "official": [], "plain": "八類：證券投資基金、指數型基金、ETF、不動產投資信託基金、對沖基金、私募基金、基礎建設基金、商品基金。國外表彰基金總額不超過核定國外投資總額 40%；其中第1至4、7、8類的每一基金，不超過保險業資金 5% 及該基金已發行總額 10%。對沖基金與私募基金：投資總額加計私募公司債合計不超過資金 2%（核定國外投資額度超過資金 40% 者為 3%）；單一基金不超過該基金已發行總額 10%；單一基金投資總額達資金萬分之五以上者，須提報董事會通過（未達新臺幣一億元以一億元計）。對沖基金經理公司：主權評等 A+ 以上、屬 IOSCO MMoU 簽署國家或地區主管機關註冊、管理對沖基金歷史滿 2 年、管理資產不少於美金 2 億元。私募基金管理機構：A+、IOSCO MMoU、歷史滿 5 年、管理資產不少於美金 5 億元（有但書）。", "mnemonic": "對沖「二年二億」、私募「五年五億」。", "tip": "對沖基金不是「避險基金」以外的東西：條文寫「對沖基金」，題目寫「避險基金」時是同一類。"}, {"no": "9", "title": "資產證券化商品", "official": ["第五條第十款所稱資產證券化商品之種類如下：", "一、資產基礎證券。", "二、商業不動產抵押貸款債券。", "三、住宅不動產抵押貸款債券。", "四、抵押債務債券。", "保險業投資於前項之資產證券化商品，其信用評等須經國外信用評等機構評定為 A- 級或相當等級以上，且其投資總額不得超過保險業經核定之國外投資額度百分之二十，對每一資產證券化商品之投資金額，不得超過保險業資金百分之一。", "保險業投資於第一項第三款之住宅不動產抵押貸款債券，其資產池之債權平均信用評等分數須達六百八十分以上。", "保險業投資於美國聯邦國民抵押貸款協會、聯邦住宅抵押貸款公司及美國政府國民抵押貸款協會等機構發行或保證之住宅不動產抵押貸款債券，不受第二項及前項規定限制。但其投資總額不得超過保險業經核定之國外投資額度百分之五十，每一機構之債券投資金額，不得超過保險業經核定之國外投資額度百分之二十五。", "保險業投資於下列抵押債務債券，其投資金額及條件應符合第十七條之規定：", "一、資產池個別資產之信用評等等級經國外信用評等機構評定未達 BBB-級或相當等級之抵押債務債券。", "二、資產池採槓桿融資架構，或資產池之個別資產含次級房貸或槓桿貸款之抵押債務債券。"], "plain": "資產證券化商品四類。一般規定：評等 A- 以上，總額不超過核定國外投資額度 20%，每一商品不超過資金 1%。住宅不動產抵押貸款債券：資產池債權平均信用評等分數須達 680 分。房利美、房地美、吉利美發行或保證的住宅不動產抵押貸款債券，不受上述限制，但總額不超過核定額度 50%、每一機構不超過核定額度 25%。低評等或槓桿、次級房貸的抵押債務債券，金額與條件要符合第17條。", "mnemonic": "四類「資產、商業、住宅、抵押債務」；數字「A-、20%、1%、680 分」。", "tip": "20% 是「核定國外投資額度」，1% 是「資金」，兩個基準不同。"}, {"no": "10", "title": "國際性組織債與其他有價證券", "official": [], "plain": "國際性組織發行的債券：評等 A- 以上，對每一國際性組織的投資總額不超過資金 5%。國內上市櫃的外幣計價股權、債權憑證或伊斯蘭固定收益證券：投資總額加計應計入國外投資額度的合計數，不超過核定國外投資額度 145%；可贖回債券的期間，自發行日起不得低於 5 年，自次級市場取得者自交割日起不得低於 3 年（有例外）。私募公司債（第5條第13款）：須為主順位，評等 BBB+ 以上。", "mnemonic": "「國際性組織：A-、資金 5%」。", "tip": ""}, {"no": "11", "title": "國外及大陸地區不動產投資", "official": [], "plain": "只能投資「投資時已合法利用並產生利用效益」者；除自用不動產外，認定標準是出租率達 60%，並符合當地經濟環境的投資報酬率。投資總額：不超過資金 1% 及業主權益 10%；最近一期自有資本與風險資本比率達法定標準 1.25 倍以上者，不超過資金 2.5% 及業主權益 40%；達法定標準 1.5 倍以上者，不超過資金 3% 及業主權益 40%。", "mnemonic": "「六成出租率；一％／十％；二點五％；三％」。", "tip": "筆記以百分比寫 250%、300%；現行條文是「法定標準的 1.25 倍、1.5 倍」。兩者的換算來自筆記（法定標準 200% 的 1.25 倍與 1.5 倍），本頁未另行查證。"}, {"no": "11-1", "title": "不動產投資的方式", "official": [], "plain": "四種方式：以自己名義取得；經由特定目的不動產投資事業取得；經由特定目的不動產投資事業並以貸款提供資金；經由信託方式取得。特定目的不動產投資事業，指保險業百分之百持有、專以投資國外或大陸地區不動產為目的的事業。取得或處分時要有當地合格國際性鑑價機構的鑑價報告；物業管理機構以國際性物業管理機構為限。", "mnemonic": "四種「自己名義、事業、事業加貸款、信託」。", "tip": "取得後要揭露地點、公平價值、權屬面積使用情形：筆記題庫寫「公司網站揭露」，現行條文的揭露方式本頁沒有核對，請以官方條文為準。"}, {"no": "11-2", "title": "特定目的不動產投資事業的貸款與核准", "official": [], "plain": "以貸款提供資金：董事會三分之二以上董事出席、出席董事四分之三以上同意。對同一事業貸款總餘額不超過業主權益 10%，並與其他放款一起併計：利害關係人放款不超過業主權益 1.5 倍；同一關係人放款不超過業主權益 40%；同一關係企業放款不超過業主權益 40%。該事業各項收入（預留必要營運資金外）要在每年結算並經會計師簽證後 6 個月內匯回母公司。投資特定目的不動產投資事業，每一標的物事前逐筆向主管機關申請核准；年度終了後 3 個月內報請備查；投資架構變動等情事於事實發生後 7 日內陳報。", "mnemonic": "「貸款：2/3 出席、3/4 同意、餘額 10%」；「匯回母公司：6 個月」；「備查：3 個月」；「陳報：7 日」。", "tip": "看到「逐筆」就是向主管機關申請核准。"}, {"no": "12", "title": "大陸地區人民幣資金運用", "official": [], "plain": "保險業已訂定經董事會通過的大陸地區投資交易處理程序與風險監控措施，並由董事會每年訂定外匯風險管理限額、由風險管理委員會或部門定期控管者，得從事人民幣計價的資金運用；大陸地區政府、公司有價證券限於：政府公債及國庫券（含銀行間債券市場）、集中市場股票及 IPO 股票、集中市場或銀行間債券市場的公司債及金融債券、掛牌上市的證券投資基金及 ETF、避險用的衍生性金融商品。限額：政府公債及國庫券不超過核定國外投資額度 5%；次順位公司債與金融債不超過 1%；同一公司的證券不超過核定額度 1% 及發行公司業主權益 10%；每一基金不超過核定額度 1% 及基金已發行總額 10%；前述第1至4款有價證券及 ETF 合計不超過 10%。", "mnemonic": "", "tip": "本條第2款（投資時比率未達法定標準者的限制）是新近的內容，筆記題庫的條件文字不同，請以官方條文為準。"}, {"no": "13", "title": "投資國外保險相關事業的資格", "official": [], "plain": "保險業業主權益超過保險法第139條所定最低資本或基金最低額，經主管機關核准，得投資第3條第1項第6款的國外保險相關事業。與被投資公司具控制與從屬關係者，連同其他依規定投資保險相關事業的投資總額，四者併計不得超過業主權益 40%（有核准的例外）。第13-3條另規定：被投資事業發生法定情事，應於事實發生後 7 日內陳報；每年 4 月底前彙整前一年度所投資所有國外保險相關事業的業務報告提報主管機關。", "mnemonic": "「事業：4 月底；陳報：7 日」。", "tip": ""}, {"no": "14", "title": "重大投資案須核准", "official": ["保險業辦理第三條第一項第七款之國外投資，須經主管機關核准後始得辦理。"], "plain": "第3條第1項第7款（經行政院核定的經建計畫重大投資案）的國外投資，須經主管機關核准。", "mnemonic": "「重大投資案找主管機關核准」。", "tip": ""}, {"no": "15", "title": "國外投資額度與提高", "official": [], "plain": "已訂定國外投資相關交易處理程序及風險監控措施並經董事會通過者，得在資金 10% 額度內辦理國外投資。程序要有書面分析報告、交付執行的紀錄、檢討報告；相關資料至少保存 5 年。申請提高額度：25%、30%、35%（逐級加條件）；超過 35% 與超過 40% 另有條件（取得 35% 核准逾一年、風險限額由董事會每年訂定並定期控管、自有資本與風險資本比率達法定標準 1.25 倍以上或評等 AA- 以上、當年度未取得其他提高核准；超過 40% 者要最近一年度與最近三年度平均都達法定標準 1.25 倍以上，或評等 AA+ 以上，並設有內部風險模型）。提高的比例以資金 5% 為限（主管機關核定）。人身保險業商品結構綜合評分值符合標準者，可二擇一：加計資金 1% 的國外投資額度，或把第15-2條公式中非投資型人身保險業務各種準備金的 40% 提高為 42%。風險值的定義和第六章相同（99% 信賴水準、10 個交易日、每月回溯測試）。", "mnemonic": "「十、二十五、三十、三十五、四十」；程序資料保存「五年」。", "tip": "筆記寫準備金「35%→37%」，現行官方條文是「40%→42%」。25%、30%、35% 各級的細項條件，本頁未逐字核對官方現行條文，取自筆記與舊版資料。"}, {"no": "15-1", "title": "彈性調整公式", "official": [], "plain": "符合下列條件，報經主管機關核准後，可在不逾越保險法第146-4條第2項最高額度內，依彈性調整公式計算國外投資額度：經核准經營外幣收付的非投資型人身保險業務；符合第15條第1至3項；該業務依保險法提列的各種準備金，全部運用於與該業務收付外幣同一幣別的本辦法資金運用項目。若準備金未全部運用於同幣別項目，要訂調整計畫，事實發生日起 1 個月內完成改正，董事會通過後報備查。", "mnemonic": "三條件「經營外幣業務、符合15條1至3項、準備金同幣別」。", "tip": "這條和第六章「外幣非投資型人身保險」直接相關。"}, {"no": "16", "title": "資產保管", "official": [], "plain": "國外資產可委由保管機構保管或自行保管，保管機構為集保公司，或最近一年評等 A- 以上的本國金融機構及外國金融機構在臺分支機構；經核准者可委由符合標準的國外金融機構保管（成立滿 3 年以上並在境內設分公司等；A- 以上；全球前五百大銀行或保管資產達 5,000 億美元）。經核定國外投資額度達資金 35% 或國外投資金額達美金 10 億元以上者，國外投資有價證券應集中由保管機構保管，且集保公司以外的保管機構不得超過 5 家（透過金融機構辦理特定金錢信託投資國外有價證券及表彰基金者除外）。", "mnemonic": "「三年、A-、500 大」；「35% 或 10 億美元：集保以外不超過 5 家」。", "tip": ""}, {"no": "17", "title": "高風險標的合計限額", "official": [], "plain": "下列合計不得超過資金 5%：BBB+ 至 BB+ 的可轉換公司債與附認股權公司債；第5條第13款私募公司債；對沖基金、私募基金、基礎建設基金、商品基金；資產池個別資產評等未達 BBB- 的抵押債務債券；資產池採槓桿融資或含次級房貸、槓桿貸款的抵押債務債券。保險業有某些情事者不得投資這類商品，例如最近一期自有資本與風險資本比率未達法定標準 1.25 倍（有評等 AA 級以上的例外）。", "mnemonic": "五類「可轉債、私募債、四種基金、低評 CDO、槓桿 CDO」。", "tip": "第8條的基金限額（資金 2%）與本條的 5% 是兩個不同的限額，題目常混在一起。"}], "tables": [{"title": "數字速查：誰的 5%、誰的 10%", "head": ["項目", "限額（基準）", "條文"], "rows": [["同一銀行的外匯存款", "資金 3%", "第4條"], ["每一外國中央政府所屬機構債券", "資金 5%", "第6條第1項"], ["每一外國地方政府債券", "核定國外投資額度 5%", "第6條第2項"], ["每一銀行債券、可轉讓定期存單（含同銀行股票）", "資金 5%，且發行銀行業主權益 10%", "第6條第4項"], ["BBB、BBB-、BB+ 次順位銀行債（每一銀行）", "保險業業主權益 10%", "第6條第4項"], ["外幣商業本票（每一公司，含同公司其他證券）", "資金 5%，且發行公司業主權益 10%", "第6條第7項"], ["BBB、BBB-、BB+ 債券（每一公司）", "保險業業主權益 10%", "第7條第3項"], ["股票、IPO 股票、非本國企業存託憑證、可轉債及附認股權公司債（總額）", "核定國外投資總額 40%", "第7條第3項"], ["每一公司股票及公司債（含質押放款）", "資金 5%，且公司業主權益 10%", "第3條第5項"], ["國外表彰基金總額", "核定國外投資總額 40%", "第8條第2項"], ["每一國外基金（證券投資基金、指數型、ETF、REITs、基礎建設、商品）", "資金 5%，且基金已發行總額 10%", "第8條第2項"], ["國際性組織債券（每一組織）", "資金 5%（評等 A- 以上）", "第10條第1項"], ["資產證券化商品", "總額：核定國外投資額度 20%；每一商品：資金 1%", "第9條第2項"], ["房利美、房地美、吉利美的住宅不動產抵押貸款債券", "總額：核定額度 50%；每一機構：核定額度 25%", "第9條第4項"], ["高風險標的合計", "資金 5%", "第17條"], ["同一特定目的不動產投資事業貸款總餘額", "業主權益 10%", "第11-2條"]]}, {"title": "對沖基金 vs 私募基金", "head": ["", "對沖基金", "私募基金"], "rows": [["管理者主權評等", "A+ 以上", "A+ 以上"], ["註冊地", "IOSCO MMoU 簽署國家或地區主管機關", "IOSCO MMoU 簽署國家或地區主管機關"], ["管理歷史", "滿 2 年", "滿 5 年"], ["管理資產", "不少於美金 2 億元", "不少於美金 5 億元（有但書）"], ["總額（連同私募公司債）", "資金 2%（核定額度超過資金 40% 者 3%）", "同左"], ["單一基金", "不超過基金已發行總額 10%；達資金萬分之五須董事會通過", "同左"]]}, {"title": "國外投資額度階梯（第15條）", "head": ["額度", "主要條件（摘要）"], "rows": [["資金 10%", "已訂交易處理程序與風險監控措施，並經董事會通過"], ["提高至 25%", "符合上列；內控無重大缺失或已改正；評估有利經營；完整投資手冊（細項取自筆記，未逐字核對現行條文）"], ["提高至 30%", "符合 25%；最近一年無重大裁罰或已改正"], ["提高至 35%", "符合 30%；風險值（每週控管）、模型與董事會報告、近二年無罰鍰、風險管理組織"], ["超過 35%", " 險公會備查"], "ans": 1, "why": "第8條第3項第4款：單一基金投資總額超過保險業資金萬分之五以上者，應提報董事會通過；未達新臺幣一億元者以一億元計。"}, {"ref": "8", "q": "依第8條，保險業投資「國外表彰基金之有價證券」的總額，上限是？", "opts": ["資金 5%", "核定國外投資總額 40%", "業主權益 10%", "核定國外投資額度 20%"], "ans": 1, "why": "第8條第2項：國外表彰基金之有價證券總額，不得超過其依保險法第146-4條核定國外投資總額的 40%。"}, {"ref": "11", "q": "保險業投資國外商辦大樓（非自用），依第11條，「已合法利用並產生利用效益」的認定標準是？", "opts": ["出租率達 40%", "出租率達 60%，並符合當地經濟環境投資報酬率", "只要取得所有權", "出租率達 80%"], "ans": 1, "why": "第11條第3項：除自用不動產外，係指出租率達百分之六十，並符合當地經濟環境之投資報酬率。（80% 是第11-4條另一個情形）"}, {"ref": "11-2", "q": "保險業以貸款方式提供特定目的不動產投資事業資金，依第11-2條，董事會通過門檻是？", "opts": ["過半數董事出席、出席董事過半數同意", "三分之二以上董事出席、出席董事四分之三以上同意", "全體董事一致同意", "三分之二董事同意即可"], "ans": 1, "why": "第11-2條：應經董事會三分之二以上董事出席及出席董事四分之三以上同意。"}, {"ref": "11-2", "q": "特定目的不動產投資事業取得的各項收入，除預留必要營運資金外，依第11-2條應在多久內匯回母公司？", "opts": ["每年結算並經會計師簽證後 3 個月內", "每年結算並經會計師簽證後 6 個月內", "每季結算後 1 個月內", "每年結算後 12 個月內"], "ans": 1, "why": "第11-2條：除預留必要之營運資金外，應於每年結算並經會計師簽證後六個月內匯回母公司。"}, {"ref": "10", "q": "保險業投資國際性組織發行的債券，依第10條，評等與限額是？", "opts": ["評等 BBB 以上；資金 10%", "評等 A- 以上；每一國際性組織不超過資金 5%", "評等 AA 以上；資金 3%", "沒有評等要求；資金 5%"], "ans": 1, "why": "第10條第1項：債券發行評等須 A- 級或相當等級以上，且對每一國際性組織所發行債券的投資總額不得超過保險業資金 5%。"}, {"ref": "16", "q": "某保險公司經核定的國外投資額度已達資金 35%。依第16條，其國外投資有價證券的保管有什麼規定？", "opts": ["可全部自行保管", "應集中由保管機構保管，且集保公司以外的保管機構不得超過 5 家", "只能由集保公司保管", "保管機構不得超過 2 家"], "ans": 1, "why": "第16條：核定國外投資額度達資金 35% 或國外投資金額達美金 10 億元以上者，國外投資有價證券應集中由保管機構保管，集保公司以外的保管機構不得超過五家（有特定金錢信託的例外）。"}, {"ref": "15", "q": "保險業已訂定國外投資交易處理程序與風險監控措施並經董事會通過。依第15條，基本的國外投資額度與相關資料保存期間是？", "opts": ["資金 10%；至少保存 5 年", "資金 25%；至少保存 3 年", "資金 10%；至少保存 1 年", "資金 35%；至少保存 5 年"], "ans": 0, "why": "第15條：得在資金 10% 額度內辦理國外投資；交易處理程序所涉書面分析報告、紀錄、檢討報告等資料，至少保存 5 年。"}], "watch": [{"t": "法規換算", "d": "法定標準 1.25 倍＝250%、1.5 倍＝300%，是依筆記推算（假設法定標準 200%），本頁未另行查證。"}, {"t": "第15條各級額度的細項條件", "d": "25%、30%、35% 各級的細項條件，本頁未逐字核對官方現行條文。"}, {"t": "第11-1條的揭露方式", "d": "筆記題庫寫「公司網站揭露」，現行條文的揭露方式本頁未核對。"}, {"t": "本頁未收錄的條文", "d": "第6條的地方政府所屬機構細則、第7條、第13-1至13-4條、第15-2條的公式與書件、第18、19條等，本頁沒有逐條收錄。"}, {"t": "公開發佈前的風險", "d": "本頁定位為內部教學。要對外公開，涉及保險廣告與招攬規範與罰則，須先查證並依公司規定審核；此部分尚未查證。"}], "cards": [{"id": 0, "ref": "3", "front": "第3條共幾款國外投資項目？", "back": "八款：外匯存款、國外有價證券、外幣放款、衍生性金融商品、國外不動產、國外保險相關事業等、經建計畫重大投資案、其他核准項目。"}, {"id": 1, "ref": "3", "front": "外幣放款加計保險法146-3第1至3款放款總餘額，上限？", "back": "不得超過保險業資金 35%。"}, {"id": 2, "ref": "4", "front": "同一銀行外匯存款上限？", "back": "保險業資金 3%。"}, {"id": 3, "ref": "5", "front": "第5條國外有價證券共幾類？", "back": "十四類。"}, {"id": 4, "ref": "6", "front": "外國中央政府公債、國庫券，發行人評等條件？", "back": "BBB- 級或相當等級以上。"}, {"id": 5, "ref": "6", "front": "每一外國中央政府所屬機構債券的投資上限？", "back": "資金 5%（債券評等 AA- 以上）。"}, {"id": 6, "ref": "6", "front": "BBB、BBB-、BB+ 次順位銀行債，每一銀行上限？", "back": "保險業業主權益 10%。"}, {"id": 7, "ref": "7", "front": "股票、IPO、存託憑證等總額上限？", "back": "核定國外投資總額 40%。"}, {"id": 8, "ref": "7", "front": "每一公司 BBB、BBB-、BB+ 債券上限？", "back": "保險業業主權益 10%。"}, {"id": 9, "ref": "8", "front": "國外表彰基金總額上限？", "back": "核定國外投資總額 40%。"}, {"id": 10, "ref": "8", "front": "每一國外基金（證券投資、指數型、ETF、REITs、基礎建設、商品）上限？", "back": "資金 5%，且基金已發行總額 10%。"}, {"id": 11, "ref": "8", "front": "對沖基金與私募基金投資總額（含私募公司債）上限？", "back": "資金 2%；核定國外投資額度超過資金 40% 者為 3%。"}, {"id": 12, "ref": "8", "front": "單一對沖或私募基金投資總額達多少須董事會通過？", "back": "達資金萬分之五以上；未達新臺幣一億元者以一億元計。"}, {"id": 13, "ref": "8", "front": "對沖基金經理公司的條件？", "back": "主權評等 A+ 以上、IOSCO MMoU 簽署國家或地區註冊、歷史滿 2 年、管理資產不少於美金 2 億元。"}, {"id": 14, "ref": "8", "front": "私募基金管理機構的條件？", "back": "主權評等 A+ 以上、IOSCO MMoU、歷史滿 5 年、管理資產不少於美金 5 億元（有但書）。"}, {"id": 15, "ref": "9", "front": "資產證券化商品的四類？", "back": "資產基礎證券、商業不動產抵押貸款債券、住宅不動產抵押貸款債券、抵押債務債券。"}, {"id": 16, "ref": "9", "front": "資產證券化商品的評等與限額？", "back": "評等 A- 以上；總額不超過核定國外投資額度 20%；每一商品不超過資金 1%。"}, {"id": 17, "ref": "9", "front": "住宅不動產抵押貸款債券的資產池條件？", "back": "債權平均信用評等分數須達 680 分以上。"}, {"id": 18, "ref": "9", "front": "房利美、房地美、吉利美的住宅不動產抵押貸款債券，限額？", "back": "不受 A-、20%、1% 與 680 分限制；總額不超過核定額度 50%，每一機構不超過核定額度 25%。"}, {"id": 19, "ref": "10", "front": "國際性組織債券的評等與限額？", "back": "評等 A- 以上；每一國際性組織不超過資金 5%。"}, {"id": 20, "ref": "11", "front": "不動產「已合法利用並產生利用效益」的認定？", "back": "除自用不動產外，出租率達 60%，並符合當地經濟環境投資報酬率。"}, {"id": 21, "ref": "11", "front": "不動產投資總額的基本上限？", "back": "資金 1% 及業主權益 10%。"}, {"id": 22, "ref": "11-2", "front": "不動產貸款的董事會門檻？", "back": "董事會三分之二以上董事出席、出席董事四分之三以上同意。"}, {"id": 23, "ref": "11-2", "front": "對同一特定目的不動產投資事業的貸款總餘額上限？", "back": "保險業業主權益 10%。"}, {"id": 24, "ref": "11-2", "front": "特定目的不動產投資事業的收入多久匯回母公司？", "back": "每年結算並經會計師簽證後 6 個月內。"}, {"id": 25, "ref": "11-2", "front": "投資特定目的不動產投資事業，核准方式？", "back": "每一標的物事前逐筆檢送書件向主管機關申請核准。"}, {"id": 26, "ref": "12", "front": "大陸地區政府公債及國庫券的投資上限？", "back": "核定國外投資額度 5%。"}, {"id": 27, "ref": "13", "front": "投資國外保險相關事業的業務報告，何時前提報？", "back": "每年 4 月底前，彙整前一年度所投資所有國外保險相關事業的業務報告。"}, {"id": 28, "ref": "14", "front": "第3條第1項第7款（經建計畫重大投資案）的國外投資，須經誰核准？", "back": "主管機關核准後始得辦理。"}, {"id": 29, "ref": "15", "front": "無需提高額度時，有交易處理程序與風險監控措施並經董事會通過者，額度？", "back": "資金 10%。"}, {"id": 30, "ref": "15", "front": "國外投資交易處理程序的書面分析報告等資料，保存多久？", "back": "至少 5 年。"}, {"id": 31, "ref": "15-1", "front": "彈性調整公式的三個條件？", "back": "經核准經營外幣收付非投資型人身保險業務；符合第15條第1至3項；該業務各種準備金全部運用於同幣別資金運用項目。"}, {"id": 32, "ref": "16", "front": "國外投資達什麼情形，集保公司以外的保管機構不得超過幾家？", "back": "核定國外投資額度達資金 35% 或國外投資金額達美金 10 億元以上；不得超過 5 家。"}, {"id": 33, "ref": "17", "front": "第17條高風險標的合計上限？", "back": "資金 5%。"}]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LAWS = D.laws || [D.law];
const lab = x => /^[一二三四五六七八九十]+(之[一二三四五六七八九十]+)?$/.test(x) ? '第'+x+'點' : /^[0-9]+(-[0-9]+)?$/.test(x) ? '第'+x+'條' : x;
$('#h1').textContent = D.chapter + '｜' + D.title;
$('#meta').textContent = '依據：' + LAWS.map(L=>'《'+L.name+'》'+L.amended+(L.kind==='press'?'發布':'修正')+(L.docno?'（'+L.docno+'）':'')).join('；');
$('#banner').innerHTML = '<b>使用提醒</b>：條文原文取自官方網頁，逐字比對相符；「白話」「口訣」「情境題」為編寫者自行撰寫，不是法條。內部教學用，法規以官方最新公告為準，並非法律或投資意見。';
$('#foot').innerHTML = '官方來源：' + LAWS.map(L=>esc(L.name)+' <a href="'+esc(L.url)+'" target="_blank" rel="noopener">'+esc(L.url)+'</a>（'+esc(L.source)+'，擷取日 '+esc(L.retrieved)+'）').join('<br>') + '<br>法規可能再修正，使用前請重新確認。';

// 簡易儲存（瀏覽器儲存可能失敗，失敗就只留在記憶體）
const mem = {};
const store = {get(k){try{const v=localStorage.getItem(k);return v===null?mem[k]:v}catch(e){return mem[k]}},set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}};

const TABS=[['read','條文速讀'],['table','對照表'],['cards','閃卡'],['quiz','情境題'],['watch','待查證／風險']];
const nav=$('#nav');
TABS.forEach(([id,name],i)=>{const b=document.createElement('button');b.textContent=name;b.setAttribute('role','tab');b.dataset.id=id;b.onclick=()=>show(id);nav.appendChild(b)});
function show(id){TABS.forEach(([t])=>{$('#s-'+t).classList.toggle('on',t===id)});nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b.dataset.id===id));window.scrollTo(0,0)}

// 條文速讀
$('#s-read').innerHTML = (D.alerts||[]).map(a=>'<div class="banner"><b>'+esc(a.t)+'</b>：'+esc(a.d)+'</div>').join('') + D.clauses.map(c=>{
  const off = c.official.map(p=>'<p>'+esc(p)+'</p>').join('');
  return '<div class="card" id="c'+esc(c.no)+'"><h3><span class="no">'+esc(lab(c.no))+'</span>'+esc(c.title)+'</h3>'
   +'<p><span class="lab my">白話</span>'+esc(c.plain)+'</p>'
   +(c.mnemonic?'<div class="mn"><span class="lab my">口訣</span>'+esc(c.mnemonic)+'</div>':'')
   +(c.tip?'<p><span class="lab hint">提醒</span>'+esc(c.tip)+'</p>':'')
   +(c.official.length?'<details><summary>展開官方條文原文</summary><div class="off"><span class="lab fact">原文</span>'+off+'</div></details>':'<p class="stat">本頁未逐字收錄這一條的原文，數字取自官方現行條文，請對照頁尾的官方連結。</p>')+'</div>';
}).join('');

// 對照表
$('#s-table').innerHTML = D.tables.map(t=>'<h3>'+esc(t.title)+'</h3><div class="tw"><table><thead><tr>'+t.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+t.rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>').join('');

// 閃卡（簡化版間隔重複：答對升一格，答錯回到第 0 格；0~2 格優先出現，3 格視為熟練）
const KEY='twlife_ch06_boxes_v1';
let boxes={}; try{boxes=JSON.parse(store.get(KEY)||'{}')}catch(e){boxes={}}
let queue=[],cur=null,flipped=false;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function buildQueue(){queue=shuffle(D.cards.filter(c=>(boxes[c.id]||0)<3).map(c=>c.id)).sort((a,b)=>(boxes[a]||0)-(boxes[b]||0))}
function save(){store.set(KEY,JSON.stringify(boxes))}
function renderCards(){
  const done=D.cards.filter(c=>(boxes[c.id]||0)>=3).length, n=D.cards.length;
  let h='<div class="stat">已熟練 '+done+' / '+n+' 張（答對 3 次視為熟練；進度存在這個瀏覽器）</div><div class="bar"><i style="width:'+(done/n*100)+'%"></i></div>';
  if(!queue.length){h+='<div class="card"><h3>全部熟練了</h3><p>可以回到「情境題」練習活用，或重設後再來一輪。</p></div><div class="row"><button class="btn" id="reset">重設進度</button></div>';$('#s-cards').innerHTML=h;$('#reset').onclick=()=>{boxes={};save();buildQueue();renderCards()};return}
  cur=D.cards.find(c=>c.id===queue[0]);
  h+='<div class="card fc" id="fc" tabindex="0" role="button" aria-label="翻面"><small>'+esc(lab(cur.ref))+'｜剩 '+queue.length+' 張</small><div class="q">'+esc(cur.front)+'</div>'+(flipped?'<div class="a"><span class="lab fact">答案</span>'+esc(cur.back)+'</div>':'<small>點一下翻面</small>')+'</div>';
  h+=flipped?'<div class="row"><button class="btn bad" id="no">還不熟</button><button class="btn ok" id="yes">會了</button></div>':'';
  h+='<div class="row"><button class="btn" id="reset">重設進度</button></div>';
  $('#s-cards').innerHTML=h;
  const fc=$('#fc'); fc.onclick=()=>{flipped=!flipped;renderCards()}; fc.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fc.click()}};
  if(flipped){$('#yes').onclick=()=>grade(true);$('#no').onclick=()=>grade(false)}
  $('#reset').onclick=()=>{if(confirm('確定要清除閃卡進度？')){boxes={};save();flipped=false;buildQueue();renderCards()}};
}
function grade(ok){const id=cur.id;boxes[id]=ok?Math.min(3,(boxes[id]||0)+1):0;save();queue.shift();if(!ok||boxes[id]<3){queue.splice(Math.min(queue.length,ok?6:3),0,id)}flipped=false;renderCards()}

// 情境題（每次載入都會隨機打亂選項順序，避免記答案位置）
let score=0,answered=0;
function renderQuiz(){
  const perms=D.scenarios.map(s=>shuffle(s.opts.map((_,k)=>k)));
  $('#s-quiz').innerHTML='<div class="stat" id="sc">已作答 0 / '+D.scenarios.length+'，答對 0 題</div>'+D.scenarios.map((s,i)=>'<div class="card" id="q'+i+'"><b>'+(i+1)+'. </b><span class="lab my">'+esc(lab(s.ref))+'</span>'+esc(s.q)+perms[i].map((k,pos)=>'<button class="opt" data-q="'+i+'" data-o="'+k+'">'+String.fromCharCode(65+pos)+'. '+esc(s.opts[k])+'</button>').join('')+'<div class="why" id="w'+i+'"></div></div>').join('');
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.q,j=+b.dataset.o,s=D.scenarios[i],box=$('#q'+i);
    if(box.dataset.done)return;box.dataset.done=1;answered++;if(j===s.ans)score++;
    let right='';
    box.querySelectorAll('.opt').forEach((x,pos)=>{const k=+x.dataset.o;if(k===s.ans){x.classList.add('right');right=String.fromCharCode(65+pos)}else if(k===j)x.classList.add('wrong')});
    const w=$('#w'+i);w.style.display='block';w.innerHTML=(j===s.ans?'答對了。':'答錯了，正解是 '+right+'。')+esc(s.why);
    $('#sc').textContent='已作答 '+answered+' / '+D.scenarios.length+'，答對 '+score+' 題';
  });
}
