<script id="data" type="application/json">{"chapter": "第五章", "title": "保險業辦理國外投資管理辦法", "laws": [{"name": "保險業辦理國外投資管理辦法", "amended": "民國115年9月4日", "docno": "金管保財字第11504931381號令", "url": "https://law.fsc.gov.tw/LawContent.aspx?id=FL006772", "source": "金融監督管理委員會主管法規共用系統", "retrieved": "2026-10-30"}, {"name": "保險業資本適足性管理辦法（第5條：資本等級）", "amended": "民國114年12月24日", "url": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0390051", "source": "全國法規資料庫", "retrieved": "2026-10-31"}], "alerts": [{"t": "這章 2026/9/4 剛修正過（必看）", "d": "官方現行條文的修正日是民國115年9月4日。風險資本比率改用「法定標準的 1.25 倍、1.5 倍」表示（題庫是 250%、300%，是舊制 200% 的換算；新制法定標準是 100%），第15條準備金比率是 40% 提高為 42%（題庫是 35%→37%），第6條第1項新增外國中央政府公債須 BBB- 以上的條件。考題若還是舊數字，依題庫作答，但要知道現行條文的寫法。"}, {"t": "本頁收錄方式", "d": "第2至12、14至17條與第11-1條、第15-1條放上官方原文（已逐字比對）。第11-2條、第13條只整理數字，其餘條文（第11-3、11-4、13-1至13-4、15-2、16-1、18、19條）未收錄，請看頁尾連結。"}, {"t": "5% 與 10% 怎麼分", "d": "同一標的常同時有「資金 5%」與「發行人業主權益 10%」兩個基準，請先分清楚題目問的是哪一個基準，再看對照表。"}], "clauses": [{"no": "2", "title": "名詞定義與評等計算", "official": ["本辦法用詞定義如下：", "一、外國政府：指外國之中央政府或地方政府。", "二、外國銀行：指全世界銀行資本或資產排名居前五百名以內或在中華民國境內設有分行之外國銀行。", "三、國外信用評等機構：指Moody's Investors Service、Standard & Poor's Corp.、Fitch Ratings Ltd.，及其他經主管機關認可之信用評等機構。", "四、國內信用評等機構：指中華信用評等股份有限公司、澳洲商惠譽國際信用評等股份有限公司台灣分公司。", "五、國外或大陸地區不動產：指外國或大陸地區之土地及其定著物或取得作為收益或開發該土地及興建其上定著物之相關權利。", "六、控制與從屬關係：指公司法第三百六十九條之二、第三百六十九條之三及關係企業合併營業報告書關係企業合併財務報表及關係報告書編製準則第六條規範之控制與從屬關係。", "七、重大裁罰及處分：指金融監督管理委員會處理違反金融法令重大裁罰措施之對外公布說明辦法第二條所定各款之情事。", "本辦法所稱經國外信用評等機構評定為一定等級投資項目之投資總額，其計算方式如下：", "一、該一定等級投資項目高於本辦法所定得投資之最低信用評等等級者，其投資總額應以投資時及投資後維持該一定等級，及投資後遭調升或調降評等至該一定等級者之投資項目總額合併計算。", "二、該一定等級投資項目為本辦法所定得投資之最低信用評等等級者，除依前款辦理外，其投資總額並應包括投資後遭調降評等至該一定等級以下者之投資項目總額，但遭降評至非本法規定所得投資信用評等等級之投資項目，仍須依保險相關法令辦理。", "第六條第一項第二款第一目、第四項第一款第一目至第三目、第七項、第七條第二項第一款至第三款、第三項第三款、第十條第一項及第十七條第一項第一款所稱債券發行評等之投資條件，如無債券發行評等，應以國外信用評等機構對該發行或保證機構之信用評等等級替代之。"], "plain": "外國銀行＝全世界銀行資本或資產排名前五百名以內，或在中華民國境內設有分行的外國銀行。國內信用評等機構＝中華信評、澳商惠譽國際信評台灣分公司。「重大裁罰及處分」指金管會重大裁罰措施公布說明辦法第2條所定情事（和第六章相同的定義）。若債券沒有發行評等，原則上以發行或保證機構的評等替代，但次順位債券不得替代（見第6、7條）。", "mnemonic": "", "tip": ""}, {"no": "3", "title": "得辦理的國外投資項目（八款）", "official": ["保險業辦理國外投資之項目，以下列為限：", "一、外匯存款。", "二、國外有價證券。", "三、外幣放款。", "四、衍生性金融商品。", "五、國外不動產。", "六、設立或投資國外保險公司、保險代理人公司、保險經紀人公司、以發行具資本性質之債券及其資金運用為目的之特定目的國外籌資事業（以下簡稱國外籌資事業）或其他經主管機關核准之保險相關事業。", "七、經行政院核定為配合政府經濟發展政策之經建計畫重大投資案。", "八、其他經主管機關核准之資金運用項目。", "保險業已依保險業同業公會報經主管機關備查之自律規範，訂定經董事會通過之徵信核貸處理程序及風險管理規範，並經中央銀行許可者，除依本辦法及中央銀行相關法令規定得辦理以各該保險業所簽發外幣收付之人身保險單為質之外幣放款外，以下列擔保放款，並擔任外幣聯合貸款案之參加行為限，其主辦行之國外信用評等須為BBB+級或相當等級以上：", "一、本辦法所列外國中央政府、外國銀行或信用評等達A-級或相當等級以上之國內外金融機構，或經巴塞爾銀行監督管理委員會評估得適用百分之五十以下風險權數之國際組織或多邊開發銀行提供保證之放款。", "二、以不動產為擔保之放款。", "三、以航空器或船舶為擔保之放款。", "四、以合於第五條之有價證券為質之放款。", "保險業辦理第一項第三款之放款，加計保險法第一百四十六條之三第一項第一款至第三款之放款總餘額，不得超過該保險業資金百分之三十五。", "保險業投資於第一項第三款之放款，其交易條件與限額準用本法第一百四十六條之三第三項及第一百四十六條之七第一項規定。", "保險業依第五條對每一公司股票及公司債之投資與依第二項第四款以該公司發行之股票及公司債為質之放款，合併計算不得超過其資金百分之五與該發行股票及公司債之公司業主權益百分之十。", "保險業對外幣放款資產品質之評估、逾期放款、催收款之清理、呆帳之轉銷，應依保險業資產評估及逾期放款催收款呆帳處理辦法及相關規定辦理。", "保險業辦理第一項第四款之衍生性金融商品交易，應依保險業從事衍生性金融商品交易管理辦法之規定辦理。", "保險業辦理國外投資，應遵循同業公會訂定之相關自律規範。"], "plain": "八款：外匯存款、國外有價證券、外幣放款、衍生性金融商品、國外不動產、設立或投資國外保險公司（代理人、經紀人、國外籌資事業、其他核准的保險相關事業）、經行政院核定的經建計畫重大投資案、其他經主管機關核准的資金運用項目。外幣放款：除外幣保單質借外，得辦理擔任外幣聯貸參加行的擔保放款（主辦行須 BBB+ 以上），且外幣放款加計保險法第146-3條第1至3款放款總餘額，不得超過資金 35%。每一公司的股票與公司債（含以其為質的放款）合併，不得超過資金 5% 與該公司業主權益 10%。", "mnemonic": "八款「外、證、貸、衍、不、保、重、他」。", "tip": "第七款（經建計畫重大投資案）須經主管機關核准（第14條）。這條和保險法第146-4條的項目不完全相同，題目會問「依哪一條」。"}, {"no": "4", "title": "外匯存款", "official": ["保險業資金運用於外匯存款，存放之銀行除中華民國境內之銀行外，並得存放於外國銀行。", "前項存款，存放於同一銀行之金額，不得超過該保險業資金百分之三。", "第一項保險業存放之外匯存款，屬保險業務需要，非為投資目的者，改依本法第一百四十六條第三項規定辦理。"], "plain": "外匯存款可以存境內銀行，也可存外國銀行；同一銀行不得超過保險業資金的 3%。", "mnemonic": "同一銀行「資金 3%」。", "tip": "是「資金」的 3%，不是業主權益。"}, {"no": "5", "title": "可投資的國外有價證券（十四類）", "official": ["保險業資金得投資國外有價證券之種類如下：", "一、外國中央政府發行之公債、國庫券及該政府所屬機構發行之債券。", "二、外國地方政府發行或保證之債券及該政府所屬機構發行或保證之債券。", "三、外國銀行發行或保證之金融債券、可轉讓定期存單、浮動利率中期債券。", "四、外國銀行在臺分行（含國際金融業務分行）及大陸地區銀行在臺分行發行之外幣可轉讓定期存單。", "五、本國銀行發行以外幣計價之金融債券及外幣可轉讓定期存單。", "六、本國企業發行以外幣計價之公司債。", "七、以外幣計價之商業本票。", "八、外國證券集中交易市場或店頭市場交易之股權或債權憑證。", "九、國外表彰基金之有價證券。", "十、資產證券化商品。", "十一、國際性組織所發行之債券。", "十二、國內證券市場上市或上櫃買賣之外幣計價股權、債權憑證或伊斯蘭固定收益證券。", "十三、外國上市企業發行未於外國證券集中交易市場或店頭市場交易之私募公司債。", "十四、其他經主管機關核准之有價證券。"], "plain": "十四類：外國中央政府公債、國庫券及所屬機構債；外國地方政府債及所屬機構債；外國銀行金融債、可轉讓定期存單、浮動利率中期債券；外國銀行在臺分行（含國際金融業務分行）及大陸地區銀行在臺分行發行的外幣可轉讓定期存單；本國銀行外幣金融債及外幣可轉讓定期存單；本國企業外幣公司債；外幣商業本票；外國證券集中交易市場或店頭市場交易的股權或債權憑證；國外表彰基金之有價證券；資產證券化商品；國際性組織債；國內證券市場上市或上櫃的外幣計價股權、債權憑證或伊斯蘭固定收益證券；外國上市企業發行未於外國集中或店頭市場交易的私募公司債；其他經主管機關核准的有價證券。", "mnemonic": "", "tip": ""}, {"no": "6", "title": "債券的投資條件與限額（外國政府、銀行、商業本票）", "official": ["保險業辦理前條第一款外國中央政府發行之公債、國庫券及該政府所屬機構發行之債券投資，應符合下列投資條件及限額規定：", "一、外國中央政府發行之公債、國庫券，其發行人信用評等須經國外信用評等機構評定為BBB-級或相當等級以上。但保險業於本辦法中華民國一百十五年九月四日修正施行前已持有不符規定者，得繼續持有，且不得再增加投資該等券種。", "二、外國中央政府所屬機構發行之債券：", "（一）該外國中央政府所屬機構須經國外信用評等機構認定中央政府支援程度在中級或相當等級以上，且該債券發行評等等級須經國外信用評等機構評定為AA-級或相當等級以上。", "（二）保險業對每一外國中央政府所屬機構所發行債券之投資總額，不得超過該保險業資金之百分之五。", "保險業辦理前條第二款外國地方政府發行或保證之債券投資，應符合下列投資條件及限額規定：", "一、債券發行評等須經國外信用評等機構評定為A-級或相當等級以上，地方政府所屬國家之主權評等等級並須經國外信用評等機構評定為AA-級或相當等級以上。", "二、投資於每一外國地方政府發行或保證之債券之總額，不得超過該保險業經核定國外投資額度百分之五。", "保險業辦理前條第二款外國地方政府所屬機構發行或保證之債券投資，應符合下列投資條件及限額規定：", "一、該外國地方政府所屬機構係由地方政府為執行公共事務而出資設立或依法特許設立，且地方政府得直接或間接控制其人事、財務或業務經營之機構，並由該機構執行公共事務營運所得資金或經指撥特定財源之收入作為償債財源。", "二、該債券之發行、交易及資訊揭露均符合發行機構所屬國家之證券主管機關或其他依該國家證券相關法律成立且受證券主管機關監管之權責單位所定相關規定。", "三、債券發行評等須經國外信用評等機構評定為A-級或相當等級以上，地方政府所屬機構所屬國家之主權評等等級並須經國外信用評等機構評定為AA-級或相當等級以上。", "四、保險業投資於每一外國地方政府轄下全部外國地方政府所屬機構發行或保證之債券之總額，加計投資於同一外國地方政府發行或保證之債券之總額，不得超過該保險業經核定國外投資額度百分之五。", "保險業辦理前條第三款外國銀行發行或保證之金融債券、可轉讓定期存單、浮動利率中期債券投資，應符合下列投資條件及限額規定：", "一、投資條件如下：", "（一）債券發行評等等級須經國外信用評等機構評定為BBB+級或相當等級以上。但符合第二目或第三目規定者，不在此限。", "（二）保險業符合下列條件者，得投資債券發行評等等級經國外信用評等機構評定為BBB-級、BB+級或相當等級之債券：", "1.最近一年無資金運用違反本法受重大裁罰及處分，或違反情事已改正並經主管機關認可。", "2.董事會下設風險管理委員會，並於公司內部設風險管理部門及置風控長一人，實際負責公司整體風險控管。", "3.由董事會每年訂定風險限額，並由風險管理委員會或風險管理部門定期控管。", "4.符合下列條件之一：", "（1）最近一期自有資本與風險資本之比率達本法第一百四十三條之四第二項第一款所定資本適足之法定標準（以下簡稱法定標準）一點二五倍以上，或其他有具體事證可證明資本健全並經主管機關同意者。", "（2）經國內外信用評等機構評定最近一年信用評等等級為AA級或相當等級以上。", "（三）保險業最近一期自有資本與風險資本之比率達法定標準以上且符合第二目之1及2所定條件者，得投資債券發行評等等級經國外信用評等機構評定為BBB級或相當等級之債券。", "（四）債券屬次順位者，前三目所定債券發行評等等級，不得以國外信用評等機構對該債券發行或保證銀行評定之信用評等等級替代之。", "二、投資限額如下：", "（一）投資於債券發行評等等級經國外信用評等機構評定為BB+級或相當等級之次順位債券之總額，不得超過該保險業經核定國外投資額度百分之二。", "（二）投資於債券發行評等等級經國外信用評等機構評定為BBB級至BB+級或相當等級之次順位債券之總額，不得超過該保險業經核定國外投資額度百分之七點五或業主權益百分之三十孰高者。但保險業依第十六條第一項但書規定報經主管機關核准者，其委由臺灣集中保管結算所股份有限公司（以下簡稱集保公司）或最近一年經國內外信用評等機構評定信用評等等級為A-級或相當等級以上之本國金融機構及外國金融機構在臺分支機構辦理前條國外有價證券保管之金額，合計占前條國外有價證券投資金額之比重未達一定標準者，應依下列規定辦理：", "1.比重未達百分之三十者，投資總額不得超過該保險業經核定國外投資額度百分之六或業主權益百分之三十孰高者。", "2.比重達百分之三十以上未達百分之五十者，投資總額不得超過該保險業經核定國外投資額度百分之七或業主權益百分之三十孰高者。", "（三）投資於每一銀行發行或保證之債券、可轉讓定期存單，合計投資於同一銀行所發行第七條第一項股票之總額，不得超過該保險業資金百分之五及發行銀行業主權益百分之十。", "（四）投資於每一銀行發行或保證之債券發行評等等級經國外信用評等機構評定為BBB級或BBB-級或BB+級或相當等級之次順位債券之總額，不得超過該保險業業主權益百分之十。", "（五）保險業符合主管機關所定條件者，得報經主管機關核准，投資於債券發行評等經國外信用評等機構評定為BBB級、BBB-級或相當等級之次順位金融債券，投資額度以該保險業經核定國外投資額度百分之三或業主權益百分之十八孰高者為限，不計入第二目投資額度。", "保險業辦理前條第四款外國銀行在臺分行（含國際金融業務分行）及大陸地區銀行在臺分行發行之外幣可轉讓定期存單、第五款本國銀行發行之外幣可轉讓定期存單投資，其投資總額應計入第四條第二項規定限額。", "保險業辦理前條第五款本國銀行發行以外幣計價之金融債券、第六款本國企業發行以外幣計價之公司債投資，應符合下列投資條件及限額規定：", "一、投資條件準用本法第一百四十六條之一第一項第二款、第四款及第二項規定。", "二、投資金額應計入本法第一百四十六條之一第一項第二款、第四款及第二項規定限額。", "保險業辦理前條第七款以外幣計價之商業本票投資，其債券發行評等等級須經國外信用評等機構評定為BBB+級或相當等級以上，且應符合下列投資限額規定：", "一、保險業投資於每一公司發行或保證以外幣計價之商業本票金額，合計投資於同一公司所發行或保證之符合第五條第十三款或第七條第一項各款有價證券之總額，不得超過該保險業資金百分之五及發行公司業主權益百分之十。但符合第二款規定者，不在此限。", "二、保險業投資之每一公司發行或保證之公司債及商業本票，如經第三人提供保證，且符合下列情形者，其投資於該公司所發行或保證以外幣計價之商業本票金額，合計投資於該第三人所發行或保證以外幣計價之商業本票金額，以及投資於該公司及該第三人所發行或保證之符合第五條第十三款或第七條第一項各款有價證券之總額，不得超過該保險業資金百分之五及該第三人業主權益百分之十：", "（一）該第三人與該公司已依一般公認會計準則編製合併報表者。", "（二）該第三人之業主權益金額大於該公司之業主權益金額。"], "plain": "外國中央政府公債、國庫券：發行人評等須 BBB- 以上。外國中央政府所屬機構債：債券評等 AA- 以上，每一機構不超過資金 5%。外國地方政府債：評等 A- 以上、主權評等 AA- 以上，每一地方政府不超過核定國外投資額度 5%。外國銀行債：原則 BBB+ 以上；符合條件者可投資 BBB-、BB+；BBB 另有條件；次順位債不得以發行或保證銀行的評等替代。次順位銀行債限額：BB+ 級不超過核定國外投資額度 2%；BBB 至 BB+ 級不超過核定額度 7.5% 或業主權益 30% 孰高（保管比重未達 30% 為 6%、30% 以上未達 50% 為 7%，皆與業主權益 30% 孰高）；每一銀行的債券與可轉讓定期存單加計股票，不超過資金 5% 及發行銀行業主權益 10%；BBB、BBB-、BB+ 次順位債每一銀行不超過保險業業主權益 10%。外幣商業本票：BBB+ 以上，每一公司（含同公司其他證券）不超過資金 5% 及發行公司業主權益 10%。", "mnemonic": "", "tip": "第6條的第1項（外國中央政府公債、國庫券須 BBB- 以上）和「115年9月4日修正施行前已持有不符規定者得繼續持有、不得再增加」的但書，是新近修正的內容，題庫可能還沒更新。"}, {"no": "7", "title": "外國市場交易的股權或債權憑證", "official": ["第五條第八款所稱外國證券集中交易市場或店頭市場交易之股權或債權憑證種類如下：", "一、股票。", "二、首次公開募集之股票。", "三、公司債。", "四、非本國企業發行之存託憑證、可轉換公司債及附認股權公司債。", "保險業辦理前項公司債、非本國企業發行之可轉換公司債及附認股權公司債投資，應符合下列投資條件規定：", "一、債券發行評等等級須經國外信用評等機構評定為BBB+級或相當等級以上。但符合第二款或第三款規定者，不在此限。", "二、保險業符合前條第四項第一款第二目之1至4所定條件者，得投資債券發行評等等級經國外信用評等機構評定為BBB-級、BB+級或相當等級之債券，但無債券發行評等，依第二條第三項以發行或保證機構之信用評等等級替代，其發行或保證機構之信用評等等級為BB+級或相當等級者，應經保險業同業公會依其所定標準審定及公告並報主管機關備查。", "三、保險業最近一期自有資本與風險資本之比率達法定標準以上且符合前條第四項第一款第二目之1及2所定條件者，得投資債券發行評等等級經國外信用評等機構評定為BBB級或相當等級之債券。", "四、債券屬次順位者，前三款所定債券發行評等等級，不得以國外信用評等機構對該債券發行或保證公司評定之信用評等等級替代之。", "保險業辦理前二項投資，應符合下列投資限額規定：", "一、投資於前項第二款債券發行評等等級經國外信用評等機構評定為BB+級或相當等級債券之總額，不得超過該保險業經核定國外投資額度百分之二。", "二、投資於前項第二款及第三款債券之總額，不得超過該保險業經核定國外投資額度百分之七點五或業主權益百分之三十孰高者。但保險業依第十六條第一項但書規定報經主管機關核准者，其委由集保公司或最近一年經國內外信用評等機構評定信用評等等級為A-級或相當等級以上之本國金融機構及外國金融機構在臺分支機構辦理第五條國外有價證券保管之金額，合計占第五條國外有價證券投資金額之比重未達一定標準者，應依下列規定辦理：", "（一）比重未達百分之三十者，投資總額不得超過該保險業經核定國外投資額度百分之六或業主權益百分之三十孰高者。", "（二）比重達百分之三十以上未達百分之五十者，投資總額不得超過該保險業經核定國外投資額度百分之七或業主權益百分之三十孰高者。", "三、投資於債券發行評等等級經國外信用評等機構評定為BBB+級至BB+級或相當等級之可轉換公司債及附認股權公司債之投資金額及條件，應符合第十七條之規定。", "四、保險業投資於每一公司之有價證券總額，適用前條第七項規定。", "五、投資於經國外信用評等機構評定為BBB級或BBB-級或BB+級或相當等級之每一公司發行或保證之債券之總額，不得超過該保險業業主權益百分之十。", "六、保險業投資於第一項第一款、第二款、第四款之有價證券總額，不得超過其依本法第一百四十六條之四核定國外投資總額之百分之四十。", "七、保險業符合主管機關所定條件者，得報經主管機關核准，投資於債券發行評等經國外信用評等機構評定為BBB級、BBB-級或相當等級之公司債，投資額度以該保險業經核定國外投資額度百分之三或業主權益百分之十八孰高者為限，不計入第二款投資額度。"], "plain": "四種：股票、首次公開募集（IPO）股票、公司債、非本國企業發行的存託憑證、可轉換公司債及附認股權公司債。公司債等的評等條件與第6條銀行債相同概念（BBB+ 以上為原則）。限額：BB+ 級債券總額不超過核定國外投資額度 2%；BBB- 至 BB+ 與 BBB 的合計不超過核定額度 7.5% 或業主權益 30% 孰高；每一公司的 BBB、BBB-、BB+ 債券不超過保險業業主權益 10%；股票、IPO 股票、非本國企業存託憑證、可轉換公司債及附認股權公司債的總額，不超過核定國外投資總額 40%。", "mnemonic": "「股票類四十」＝股票、IPO、存託憑證等總額不超過核定國外投資總額 40%。", "tip": "四十％是「核定國外投資總額」的 40%，不是資金的 40%。"}, {"no": "8", "title": "國外表彰基金", "official": ["第五條第九款所稱國外表彰基金之有價證券種類如下：", "一、證券投資基金。", "二、指數型基金。", "三、指數股票型基金（ETF）。", "四、不動產投資信託基金。", "五、對沖基金。", "六、私募基金。", "七、基礎建設基金。", "八、商品基金。", "保險業投資於國外表彰基金之有價證券總額，不得超過其依本法第一百四十六條之四核定國外投資總額之百分之四十。其投資於前項第一款至第四款、第七款及第八款之每一國外基金之總額，不得超過該保險業資金百分之五及該基金已發行總額百分之十。", "保險業投資於第一項第五款及第六款對沖基金及私募基金之投資限額及條件如下：", "一、投資總額加計第五條第十三款有價證券之合計數不得超過該保險業資金之百分之二。但保險業已依第十五條第四項第五款規定申請並經主管機關核定其國外投資額度超過其資金之百分之四十者，上開合計數不得超過其資金之百分之三。", "二、保險業符合主管機關所定條件，得向主管機關申請不計入前款及第十七條第一項規定之投資額度，該額度以該保險業資金百分之三為限。", "三、單一基金投資總額不得超過該基金已發行總額百分之十。", "四、單一基金投資總額超過該保險業資金萬分之五以上者，應提報該保險業董事會通過後始得投資。但計算前述單一投資總額未達新臺幣一億元者，得以新臺幣一億元計。", "五、對沖基金之基金經理公司須以在主權評等等級經國外信用評等機構評定為A+級或相當等級以上，且屬國際證券管理機構組織（IOSCO）多邊瞭解備忘錄（MMoU）之簽署國家或地區主管機關註冊者為限，且管理對沖基金歷史須滿二年以上，管理對沖基金之資產不得少於美金二億元或等值外幣。", "六、私募基金之基金管理機構須以在主權評等等級經國外信用評等機構評定為A+級或相當等級以上，且屬國際證券管理機構組織（IOSCO）多邊瞭解備忘錄（MMoU）之簽署國家或地區主管機關合法註冊者為限，且管理私募基金歷史須滿五年以上，管理私募基金之資產不得少於美金五億元或等值外幣。但下列情形不在此限：", "（一）基金管理機構係經主管機關核准直接或間接於境外合法註冊，得從事基金管理業務之金融控股公司之投資事業。", "（二）基金管理機構係於我國境內合法設立，且符合保險業經董事會通過之境內基金管理機構篩選標準，並符合下列條件之一者：", "1.其所管理我國境內之全部或部分創業投資事業、私募股權基金已取得中央主管機關之推薦函或資格函，或經主管機關核准之國內證券投資信託事業運用自有資金轉投資子公司擔任私募股權基金之普通合夥人。", "2.其所管理之私募股權基金已依國家發展委員會促進私募股權基金投資產業輔導管理要點申請取得資格函，且投資範圍係配合政府政策。", "保險業投資於以第一項各款基金為投資標的之組合型基金，其投資條件及限額應依各類基金之規定辦理。第一項第二款所稱之指數型基金，其追蹤之指數由主管機關公告之。", "第一項第六款所稱之私募基金，係指投資私募股權、私募債權及不動產之私募基金。", "保險業投資於第一項第五款至第八款之投資金額及條件，應符合第十七條之規定。"], "plain": "八類：證券投資基金、指數型基金、ETF、不動產投資信託基金、對沖基金、私募基金、基礎建設基金、商品基金。國外表彰基金總額不超過核定國外投資總額 40%；其中第1至4、7、8類的每一基金，不超過保險業資金 5% 及該基金已發行總額 10%。對沖基金與私募基金：投資總額加計私募公司債合計不超過資金 2%（核定國外投資額度超過資金 40% 者為 3%）；單一基金不超過該基金已發行總額 10%；單一基金投資總額達資金萬分之五以上者，須提報董事會通過（未達新臺幣一億元以一億元計）。對沖基金經理公司：主權評等 A+ 以上、屬 IOSCO MMoU 簽署國家或地區主管機關註冊、管理對沖基金歷史滿 2 年、管理資產不少於美金 2 億元。私募基金管理機構：A+、IOSCO MMoU、歷史滿 5 年、管理資產不少於美金 5 億元（有但書）。", "mnemonic": "對沖「二年二億」、私募「五年五億」。", "tip": "對沖基金不是「避險基金」以外的東西：條文寫「對沖基金」，題目寫「避險基金」時是同一類。"}, {"no": "9", "title": "資產證券化商品", "official": ["第五條第十款所稱資產證券化商品之種類如下：", "一、資產基礎證券。", "二、商業不動產抵押貸款債券。", "三、住宅不動產抵押貸款債券。", "四、抵押債務債券。", "保險業投資於前項之資產證券化商品，其信用評等須經國外信用評等機構評定為A-級或相當等級以上，且其投資總額不得超過保險業經核定之國外投資額度百分之二十，對每一資產證券化商品之投資金額，不得超過保險業資金百分之一。", "保險業投資於第一項第三款之住宅不動產抵押貸款債券，其資產池之債權平均信用評等分數須達六百八十分以上。", "保險業投資於美國聯邦國民抵押貸款協會、聯邦住宅抵押貸款公司及美國政府國民抵押貸款協會等機構發行或保證之住宅不動產抵押貸款債券，不受第二項及前項規定限制。但其投資總額不得超過保險業經核定之國外投資額度百分之五十，每一機構之債券投資金額，不得超過保險業經核定之國外投資額度百分之二十五。", "保險業投資於下列抵押債務債券，其投資金額及條件應符合第十七條之規定：", "一、資產池個別資產之信用評等等級經國外信用評等機構評定未達BBB-級或相當等級之抵押債務債券。", "二、資產池採槓桿融資架構，或資產池之個別資產含次級房貸或槓桿貸款之抵押債務債券。"], "plain": "資產證券化商品四類。一般規定：評等 A- 以上，總額不超過核定國外投資額度 20%，每一商品不超過資金 1%。住宅不動產抵押貸款債券：資產池債權平均信用評等分數須達 680 分。房利美、房地美、吉利美發行或保證的住宅不動產抵押貸款債券，不受上述限制，但總額不超過核定額度 50%、每一機構不超過核定額度 25%。低評等或槓桿、次級房貸的抵押債務債券，金額與條件要符合第17條。", "mnemonic": "四類「資產、商業、住宅、抵押債務」；數字「A-、20%、1%、680 分」。", "tip": "20% 是「核定國外投資額度」，1% 是「資金」，兩個基準不同。"}, {"no": "10", "title": "國際性組織債與其他有價證券", "official": ["保險業投資於第五條第十一款之國際性組織發行之債券，其債券發行評等等級，須經國外信用評等機構評定為A-級或相當等級以上，且其對每一國際性組織所發行債券之投資總額，不得超過該保險業資金百分之五。", "保險業投資於第五條第十二款之國內證券市場上市或上櫃買賣之外幣計價股權、債權憑證或伊斯蘭固定收益證券，應符合下列投資條件及限額規定：", "一、投資條件如下：", "（一）應按所投資股權、債權憑證或伊斯蘭固定收益證券，分別符合第一項、第六條第一項、第二項、第四項、第六項、第七項、第七條第二項、第十七條第二項規定之投資條件。", "（二）發行條件包括發行人於一定期限屆至後得贖回該債券者，自發行日起至該一定期限屆至日止之期間，不得低於五年；自次級市場取得者，自交割日起至該一定期限屆至日止之期間，不得低於三年。但保險業於本辦法修正施行前，已有投資該債券者，不在此限。", "（三）前目得贖回債券，其贖回價格係由下列二者孰高決定者，不適用前目規定：", "1.債券面額加計應收利息。", "2.贖回當時至到期日尚未配發之利息與本金折現後之總值。", "二、投資限額如下：", "（一）投資總額加計應計入國外投資額度之合計數，不得超過保險業經核定國外投資額度之百分之一百四十五。但保險業於本辦法修正施行時，上開合計數已超過該限額者，投資總額不得再新增投資部位。", "（二）投資金額應按所投資股權、債權憑證或伊斯蘭固定收益證券，分別計入第一項、第六條第一項、第二項、第四項、第六項、第七項、第七條第三項、第十七條第一項規定限額。", "三、有關伊斯蘭固定收益證券之投資總額，得以發起人業主權益作為計算基礎，其他限額規定及發行機構組織型態，應以發起人作為規範對象。", "保險業投資於第五條第十三款之私募公司債，須為主順位，其債券發行評等等級，須經國外信用評等機構評定為BBB+級或相當等級以上。"], "plain": "國際性組織發行的債券：評等 A- 以上，對每一國際性組織的投資總額不超過資金 5%。國內上市櫃的外幣計價股權、債權憑證或伊斯蘭固定收益證券：投資總額加計應計入國外投資額度的合計數，不超過核定國外投資額度 145%；可贖回債券的期間，自發行日起不得低於 5 年，自次級市場取得者自交割日起不得低於 3 年（有例外）。私募公司債（第5條第13款）：須為主順位，評等 BBB+ 以上。", "mnemonic": "「國際性組織：A-、資金 5%」。", "tip": ""}, {"no": "11", "title": "國外及大陸地區不動產投資", "official": ["保險業對國外及大陸地區不動產之投資，以投資時已合法利用並產生利用效益者為限，並應符合下列規定：", "一、最近一期自有資本與風險資本之比率達法定標準。", "二、最近二年資金運用無受主管機關依本法重大裁罰及處分，及最近二年執行各項資金運用作業內部控制程序無重大違規，或違反情事及缺失事項已改正並經主管機關認可。", "三、董事會設置風險管理委員會，或公司內部設置風險管理部門及風控長，實際負責公司整體風險控管。", "前項投資總額不得超過保險業資金百分之一及業主權益百分之十。但保險業最近一期自有資本與風險資本之比率達法定標準一點二五倍以上者，其投資總額不得超過保險業資金百分之二點五及業主權益百分之四十；最近一期自有資本與風險資本之比率達法定標準一點五倍以上者，其投資總額不得超過保險業資金百分之三及業主權益百分之四十。", "第一項所稱投資時已合法利用並產生利用效益之認定標準，除自用不動產外，係指出租率達百分之六十，並符合當地經濟環境之投資報酬率。"], "plain": "只能投資「投資時已合法利用並產生利用效益」者；除自用不動產外，認定標準是出租率達 60%，並符合當地經濟環境的投資報酬率。投資總額：不超過資金 1% 及業主權益 10%；最近一期自有資本與風險資本比率達法定標準 1.25 倍以上者，不超過資金 2.5% 及業主權益 40%；達法定標準 1.5 倍以上者，不超過資金 3% 及業主權益 40%。", "mnemonic": "「六成出租率；一％／十％；二點五％；三％」。", "tip": "「法定標準」指保險業資本適足性管理辦法第5條的資本適足等級：現行（2026 起新制）為資本適足率 100%，舊制是 200%。所以題庫的 250%、300% 是舊制算法（200% 的 1.25 倍、1.5 倍），現行條文寫「法定標準 1.25 倍、1.5 倍」，換成新制就是 125%、150%。"}, {"no": "11-1", "title": "不動產投資的方式", "official": ["保險業得以下列方式從事國外及大陸地區不動產之投資：", "一、以自己名義取得國外及大陸地區不動產。", "二、經由投資特定目的不動產投資事業取得國外及大陸地區不動產。", "三、經由投資特定目的不動產投資事業，並以貸款方式提供該事業所需資金取得國外及大陸地區不動產。", "四、經由信託方式取得國外及大陸地區不動產。", "前項所稱特定目的不動產投資事業，係指保險業報經主管機關備查或核准由保險業百分之百持有並專以投資國外或大陸地區不動產為目的之事業；所稱經由信託方式取得國外及大陸地區不動產，係指保險業報經主管機關備查或核准由保險業或其特定目的不動產投資事業與受託機構簽訂信託契約，由受託機構依信託契約內容為取得、管理、使用、收益及處分者。", "保險業及特定目的不動產投資事業取得或處分其投資之國外及大陸地區不動產，應經當地合格之國際性鑑價機構出具鑑價報告，且委託管理之對象以國際性物業管理機構者為限，如係以投資特定目的不動產投資事業方式辦理者，並應由當地合格律師事務所就其適法性出具法律意見書；取得後應於公司網站揭露下列事項：", "一、國外及大陸地區不動產所在地。", "二、市場公平價值之相關證明資料。", "三、權屬狀況、面積及使用情形。", "前項鑑價機構及物業管理機構應符合下列規定：", "一、鑑價機構以在主權評等等級經國外信用評等機構評定為A+級或相當等級以上國家或地區之主管機關或我國合法設立登記，並已於預定投資之國外不動產或特定目的不動產投資事業設立登記之所在地及我國設有營業據點者為限。", "二、物業管理機構應符合下列條件之一，但所投資之不動產已存在既有物業管理機構且合約未到期，或所投資不動產須經同一標的其他所有權人共同決定物業管理機構者，不在此限：", "（一）已有公開資料可以證明該物業管理機構於保險業預定投資不動產所在地設立達三年以上且具商業大樓物業管理面積達三萬五千平方公尺以上之經驗及管理資產價值達新臺幣一百億元或等值外幣。", "（二）有公開具體事證證明該物業管理機構最近一年營業收入為當地前五大之物業管理機構。", "保險業依第一項規定投資國外及大陸地區不動產，應於內部控制制度中增列投資國外及大陸地區不動產之處理程序，報經董事會決議通過，修正時亦同。其處理程序，至少應包括下列內容：", "一、投資方針、策略及權責單位。", "二、評估、交易、管理及作業處理程序。", "三、風險監控管理措施。", "前項第三款所列之風險監控管理措施，其風險控管範圍應包括就國外及大陸地區不動產所在國家，參考國外信用評等機構之國家風險評等資訊制定分級控管機制，並依各級別及個別國家訂定風險限額之管理規範。", "保險業從事國外不動產投資，應指派具有相關從業經驗或專業訓練人員負責，並提出投資評估報告，逐案提報董事會通過後依授權辦理。", "財產保險業及人身保險業應分別依財產保險業辦理資訊公開管理辦法第十一條及人身保險業辦理資訊公開管理辦法第十一條規定，於資訊公開網頁之說明文件應記載事項項下公開揭露下列資訊：", "一、經會計師覆核之從事國外及大陸地區不動產投資之投資地區、金額及損益情形，並每年更新一次。", "二、第十一條之二第七項各款資料。", "三、第十一條之三第三項各款資料。", "保險業依第一項各款規定從事國外及大陸地區不動產投資者，應於其年度財務報告內附註揭露下列事項：", "一、依第一項第一款取得國外及大陸地區不動產者，其所持有不動產所有權是否受到限制。", "二、依第一項第二款及第三款取得國外及大陸地區不動產者，所投資特定目的不動產投資事業是否有違反第十一條之二第三項第二款規定之情事，以及該事業所持有不動產所有權是否受到被提供為他人債務擔保以外之其他限制。", "三、依第一項第四款取得國外及大陸地區不動產者，其信託財產所有權是否受到限制。"], "plain": "四種方式：以自己名義取得；經由特定目的不動產投資事業取得；經由特定目的不動產投資事業並以貸款提供資金；經由信託方式取得。特定目的不動產投資事業，指保險業百分之百持有、專以投資國外或大陸地區不動產為目的的事業。取得或處分時要有當地合格國際性鑑價機構的鑑價報告；物業管理機構以國際性物業管理機構為限。 鑑價機構限主權評等 A+ 以上國家或地區主管機關核可，或我國合法設立且在當地與我國有營業據點者；物業管理機構要在當地設立滿三年以上等條件之一。", "mnemonic": "四種「自己名義、事業、事業加貸款、信託」。", "tip": "取得後要在公司網站揭露三項：所在地、市場公平價值相關證明資料、權屬狀況面積及使用情形（條文原文，與題庫一致）。"}, {"no": "11-2", "title": "特定目的不動產投資事業的貸款與核准", "official": [], "plain": "以貸款提供資金：董事會三分之二以上董事出席、出席董事四分之三以上同意。對同一事業貸款總餘額不超過業主權益 10%，並與其他放款一起併計：利害關係人放款不超過業主權益 1.5 倍；同一關係人放款不超過業主權益 40%；同一關係企業放款不超過業主權益 40%。該事業各項收入（預留必要營運資金外）要在每年結算並經會計師簽證後 6 個月內匯回母公司。投資特定目的不動產投資事業，每一標的物事前逐筆向主管機關申請核准；年度終了後 3 個月內報請備查；投資架構變動等情事於事實發生後 7 日內陳報。", "mnemonic": "「貸款：2/3 出席、3/4 同意、餘額 10%」；「匯回母公司：6 個月」；「備查：3 個月」；「陳報：7 日」。", "tip": "看到「逐筆」就是向主管機關申請核准。本頁未收錄第11-2條原文，上列數字已與現行官方條文核對。"}, {"no": "12", "title": "大陸地區人民幣資金運用", "official": ["保險業已訂定經董事會通過之從事大陸地區投資相關交易處理程序及風險監控管理措施，並由董事會每年訂定外匯風險管理限額及由風險管理委員會或風險管理部門定期控管者，得依本辦法從事以人民幣計價之各項資金運用，但其於從事大陸地區政府、公司相關有價證券之運用，以下列項目為限：", "一、大陸地區政府公債及國庫券，包括於銀行間債券市場交易之標的。", "二、大陸地區集中市場交易股票及集中市場上市前首次公開募集股票。", "三、大陸地區集中市場或銀行間債券市場交易之公司債及金融債券。", "四、大陸地區掛牌上市之證券投資基金及指數股票型基金（ETF）。", "五、於依本項第一款至前款所為實際投資額度內，得基於避險目的，從事衍生性金融商品交易。", "保險業依前項規定從事大陸地區政府、公司相關有價證券之投資，應符合下列規定：", "一、無第十七條第二項第一款及第三款所列之情事。", "二、投資時最近一期自有資本與風險資本之比率未達法定標準者，以從事前項第一款、第五款投資為限。但經主管機關核准投資前項第三款及第四款規定者，不在此限。", "三、保險業依前款規定從事之投資總額，不得超過該保險業經核定國外投資額度百分之五。", "保險業資金投資第一項第三款所列公司債及金融債券，其債券發行評等等級須經國外信用評等機構評定為BBB+級或相當等級以上，但無債券發行評等者，其發行公司或保證公司之信用評等等級應符合下列規定：", "一、投資於公司債或金融債券且非屬次順位者，其發行公司或保證公司之信用評等等級須經國外信用評等機構評定為A-級或相當等級以上。", "二、投資於次順位公司債及次順位金融債券者，其發行公司或保證公司之信用評等等級須經國外信用評等機構評定為A+級或相當等級以上。", "第一項各款所列保險業資金得從事運用之項目，主管機關得於必要時予以限制。", "第一項所列投資項目，其交易金額應分別併入本辦法各項商品限額計算，並應符合下列規定：", "一、投資於大陸地區政府公債及國庫券之投資總額，不得超過該保險業經核定國外投資額度百分之五。", "二、投資於第一項第三款之公司債及金融債券且屬次順位者之投資總額，不得超過該保險業經核定國外投資額度百分之一。", "三、投資於同一公司所發行符合第一項第二款及第三款之有價證券投資總額，不得超過該保險業經核定國外投資額度百分之一及發行公司業主權益百分之十。", "四、投資於大陸地區掛牌上市證券投資基金及指數股票型基金之每一基金投資總額，不得超過該保險業經核定國外投資額度百分之一及該基金已發行總額百分之十。", "五、投資於第一項第一款至第四款之有價證券及指數股票型基金之投資總額，合計不得超過該保險業經核定國外投資額度百分之十。", "保險業從事第一項各款資金運用，應確實遵循相關法令規定及各項資金運用內部作業規範。財產保險業及人身保險業並應分別依財產保險業辦理資訊公開管理辦法第十一條及人身保險業辦理資訊公開管理辦法第十一條規定，於資訊公開網頁之說明文件應記載事項項下公開揭露從事第一項各款資金運用之投資總額及損益情形，並每季更新一次。"], "plain": "保險業已訂定經董事會通過的大陸地區投資交易處理程序與風險監控措施，並由董事會每年訂定外匯風險管理限額、由風險管理委員會或部門定期控管者，得從事人民幣計價的資金運用；大陸地區政府、公司有價證券限於：政府公債及國庫券（含銀行間債券市場）、集中市場股票及 IPO 股票、集中市場或銀行間債券市場的公司債及金融債券、掛牌上市的證券投資基金及 ETF、避險用的衍生性金融商品。限額：政府公債及國庫券不超過核定國外投資額度 5%；次順位公司債與金融債不超過 1%；同一公司的證券不超過核定額度 1% 及發行公司業主權益 10%；每一基金不超過核定額度 1% 及基金已發行總額 10%；前述第1至4款有價證券及 ETF 合計不超過 10%。", "mnemonic": "", "tip": "第2項第2款：投資時資本適足比率未達法定標準者，只能做第1項第1款（政府公債、國庫券）與第5款（避險衍生性商品）；經核准才可做第3、4款（公司債、金融債券、基金與 ETF）。"}, {"no": "13", "title": "投資國外保險相關事業的資格", "official": [], "plain": "保險業業主權益超過保險法第139條所定最低資本或基金最低額，經主管機關核准，得投資第3條第1項第6款的國外保險相關事業。與被投資公司具控制與從屬關係者，連同其他依規定投資保險相關事業的投資總額，四者併計不得超過業主權益 40%（有核准的例外）。第13-3條另規定：被投資事業發生法定情事，應於事實發生後 7 日內陳報；每年 4 月底前彙整前一年度所投資所有國外保險相關事業的業務報告提報主管機關。", "mnemonic": "「事業：4 月底；陳報：7 日」。", "tip": "投資後的陳報與年度業務報告規定在第13-3條；本頁未收錄原文，數字已與現行官方條文核對。"}, {"no": "14", "title": "重大投資案須核准", "official": ["保險業辦理第三條第一項第七款之國外投資，須經主管機關核准後始得辦理。"], "plain": "第3條第1項第7款（經行政院核定的經建計畫重大投資案）的國外投資，須經主管機關核准。", "mnemonic": "「重大投資案找主管機關核准」。", "tip": ""}, {"no": "15", "title": "國外投資額度與提高", "official": ["保險業已訂定國外投資相關交易處理程序及風險監控管理措施，並經董事會通過者，得在該保險業資金百分之十額度內辦理國外投資。", "保險業訂定前項國外投資相關交易處理程序應包括書面分析報告之製作、交付執行之紀錄與檢討報告之提交等，其相關資料應至少保存五年。", "第一項所稱國外投資風險監控管理措施，應包括有效執行之風險管理政策、風險管理架構及風險管理制度，其中風險管理制度應涵蓋國外投資相關風險類別之識別、衡量、監控及限額控管之執行及變更程序。", "保險業申請提高國外投資額度，應檢附申請表（如附表二）依下列規定辦理：", "一、符合下列規定者，其國外投資總額得提高至其資金百分之二十五：", "（一）符合第一項至第三項之規定。", "（二）最近一年執行各種資金運用作業內部控制處理程序無重大缺失，或缺失事項已改正並經主管機關認可。", "（三）經所屬簽證精算人員或外部投資機構評估辦理國外投資有利其經營。", "（四）檢具含風險管理制度相關說明之完整投資手冊。", "二、符合下列規定者，其國外投資總額得提高至其資金百分之三十：", "（一）符合前款規定。", "（二）最近一年資金運用無受主管機關重大裁罰及處分，或違反情事已改正並經主管機關認可。", "三、符合下列規定者，其國外投資總額得提高至其資金百分之三十五：", "（一）符合前款規定。", "（二）國外投資分類為透過損益按公允價值衡量之金融資產及透過其他綜合損益按公允價值衡量之金融資產之部位已採用計算風險值評估風險，並每週至少控管乙次。", "（三）國外投資分類為按攤銷後成本衡量之金融資產之部位，已建置適當模型分析、辨識或量化其相關風險，並至少每半年向董事會報告風險評估情形。", "（四）最近二年資金運用無受主管機關罰鍰處分情事，或違反情事已改正並經主管機關認可。", "（五）董事會下設風險管理委員會且於公司內部設風險管理部門及置風控長一人，並實際負責公司整體風險控管，其風險控管範圍至少應包括國外投資所衍生相關風險之評估及控管與所衍生風險對於保險業清償能力之影響。", "四、申請提高國外投資總額超過其資金百分之三十五者，應符合下列規定：", "（一）符合前款規定。", "（二）取得國外投資總額提高至資金百分之三十五之核准已逾一年。", "（三）由董事會每年訂定風險限額，並由風險管理委員會或風險控管部門定期控管。", "（四）最近一期自有資本與風險資本之比率達法定標準一點二五倍以上或經國內外信用評等機構評定最近一年信用評等等級為AA-級或相當等級以上。", "（五）當年度未取得其他提高國外投資總額核准。", "五、申請提高國外投資總額超過其資金百分之四十者，應符合下列規定：", "（一）符合前款規定。", "（二）最近一年度自有資本與風險資本之比率達法定標準一點二五倍以上，且最近三年度平均比率達法定標準一點二五倍以上，或經國內外信用評等機構評定最近一年信用評等等級為AA+級或相當等級以上。", "（三）設有內部風險模型以量化公司整體風險。", "（四）當年度未取得其他提高國外投資總額核准。", "前項第三款第二目所稱計算風險值，指按週為基礎、樣本期間至少三年，或按日為基礎、樣本期間至少一年，樣本之資料至少每週更新一次，以至少百分之九十九之信賴水準，計算十個交易日之風險值，且須每月進行回溯測試。", "主管機關得視保險業經營情況，核定第四項第四款或第五款之提高比例。", "前項核定之提高比例以該保險業資金百分之五為限。但主管機關得視保險業整體經營情況，逐年予以適度調整。", "人身保險業最近一年之商品結構綜合評分值符合主管機關所定標準者，得就下列措施擇一適用：", "一、於本法第一百四十六條之四第二項所定最高額度內，依第一項或第四項核定額度加計資金百分之一之國外投資額度。", "二、第十五條之二第二項所定計算公式中，所列保險業非投資型人身保險業務各種準備金之百分之四十，得提高為百分之四十二。"], "plain": "已訂定國外投資交易處理程序與風險監控措施並經董事會通過者，可在資金 10% 額度內辦理。程序要有書面分析報告、交付執行紀錄、檢討報告，資料至少保存 5 年。申請提高額度是逐級加條件：25%（內控無重大缺失、精算人員或外部投資機構評估有利、完整投資手冊）→ 30%（再加：最近一年無重大裁罰）→ 35%（再加：公允價值部位用風險值並每週至少控管一次；攤銷後成本部位建模型並每半年向董事會報告；近二年無罰鍰；董事會下設風險管理委員會、設風險管理部門與風控長）。超過 35%：取得 35% 核准逾一年、董事會每年訂風險限額、資本比率達法定標準 1.25 倍以上或評等 AA- 以上、當年度未取得其他提高核准。超過 40%：最近一年度與近三年度平均都達 1.25 倍以上，或評等 AA+ 以上；設有內部風險模型；當年度未取得其他提高核准。主管機關核定的提高比例以資金 5% 為限。人身保險業商品結構綜合評分值符合標準者二擇一：加計資金 1% 的國外投資額度，或把第 15-2 條公式中準備金的 40% 提高為 42%。風險值：按週為基礎樣本至少 3 年（或按日、至少 1 年）、99% 信賴水準、10 個交易日、每月回溯測試。", "mnemonic": "「十、二十五、三十、三十五、四十」；程序資料保存「五年」；風險值「99%、10 日、每月回測」。", "tip": "準備金比率現行是 40%→42%（第15條末項第2款）。題庫若寫 35%→37%，是舊版數字。"}, {"no": "15-1", "title": "彈性調整公式", "official": ["保險業符合下列規定者，得於報經主管機關核准後，於不逾越本法第一百四十六條之四第二項所定最高額度內，依彈性調整公式計算國外投資額度：", "一、經主管機關核准經營以外幣收付之非投資型人身保險業務（以下簡稱該業務）。", "二、符合前條第一項至第三項規定。", "三、經營該業務依本法相關規定提列之各種準備金全部運用於與該業務收付外幣同一幣別之本辦法所定資金運用項目。", "前項所稱彈性調整公式為國外投資額度＝依前條第四項核定之國外投資總額ｘ（1＋外幣收付之非投資型人身保險業務各種準備金／非投資型人身保險業務各種準備金）。", "保險業擬依第一項規定計算國外投資額度者，應於事前檢具下列書件向主管機關申請核准：", "一、符合前條第一項至第三項規定之說明及證明文件。", "二、最近一年執行各種資金運用作業內部控制處理程序無重大缺失，或缺失事項已改正並經主管機關認可之說明及證明文件。", "三、所屬簽證精算人員或外部投資機構對於整體資產負債配置對稱性之具體評估意見。", "四、含內部風險管理制度及相關作業規範說明之完整投資手冊。", "五、該業務之經營現況說明。", "六、經營該業務依本法相關規定提列之各種準備金全部運用於與該業務收付外幣同一幣別之本辦法所定資金運用項目之說明及證明文件。", "七、最近一年董事會逐次追蹤檢討國外投資配置、績效、策略、風險承受程度及整體風險管理政策與制度之說明證明文件。", "八、各種準備金之提列情形及適足性說明。", "九、最近一期經會計師查核簽證或核閱之財務報告。", "十、其他依主管機關要求提報之文件。", "保險業經主管機關核准依第一項規定計算國外投資額度者，其經營該業務依本法相關規定提列之各種準備金有未全部運用於與該業務收付外幣同一幣別之本辦法所定資金運用項目情事者，應訂定事實發生日起一個月內完成改正之調整計畫，經董事會通過後，報送主管機關備查。", "保險業未依前項規定辦理、未依調整計畫完成調整或於本會核准依第一項規定計算國外投資額度後發生前項應報送調整計畫情事累計超過二次者，主管機關得廢止第一項國外投資額度之核准。"], "plain": "符合下列條件，報經主管機關核准後，可在不逾越保險法第146-4條第2項最高額度內，依彈性調整公式計算國外投資額度：經核准經營外幣收付的非投資型人身保險業務；符合第15條第1至3項；該業務依保險法提列的各種準備金，全部運用於與該業務收付外幣同一幣別的本辦法資金運用項目。若準備金未全部運用於同幣別項目，要訂調整計畫，事實發生日起 1 個月內完成改正，董事會通過後報備查。", "mnemonic": "三條件「經營外幣業務、符合15條1至3項、準備金同幣別」。", "tip": "這條和第六章「外幣非投資型人身保險」直接相關。"}, {"no": "16", "title": "資產保管", "official": ["保險業投資之國外資產得委由保管機構保管或自行保管，除依有價證券集中保管帳簿劃撥作業辦法辦理外，其保管機構應為集保公司，或最近一年經國內外信用評等機構評定信用評等等級為A-級或相當等級以上之本國金融機構及外國金融機構在臺分支機構。但報經主管機關核准者，不在此限，並得委由符合下列標準之國外金融機構保管：", "一、成立滿三年以上，在我國境內設有分公司或經核准辦理保管業務之子公司。", "二、最近一年經國內外信用評等機構評定信用評等等級為A-級或相當等級以上。", "三、最近一年資產或淨值排名居全世界前五百名以內之銀行或所保管之資產達五千億美元以上之機構。", "保險業最近一期自有資本與風險資本之比率未達法定標準者，應將國外資產委由集保公司或最近一期自有資本與風險性資產之比率符合法定標準之本國金融機構及外國金融機構在臺分支機構保管。", "保險業投資國內證券市場上市或上櫃買賣之外幣計價股權、債權憑證或伊斯蘭固定收益證券，應依有價證券集中保管帳簿劃撥作業辦法進行保管。", "保險業經核定國外投資額度達資金百分之三十五或國外投資金額達美金十億元以上者，除經由金融機構辦理特定金錢信託投資國外之有價證券及國外表彰基金之有價證券外，其國外投資有價證券應集中由保管機構負責保管，且集保公司以外之保管機構不得超過五家。", "保險業委由國外保管機構保管國外資產者，其全權委託之受託機構應與保管機構分屬不同之金融機構，國外保管契約之簽訂、修正及保管帳戶授權人員之異動，均須經董事會通過，且保險業應確認保管契約須載明下列事項：", "一、主管機關認為必要時，得派員或令保險業委託會計師或其他專業人員查核保險業委由保管機構保管之國外資產，並向主管機關提出報告或表示意見，保險業委任之保管機構對於相關查核事項不得拒絕。", "二、保險業國外保管帳戶資產不得以任何形式為他人債務之擔保。", "三、未經保險業同意者，不得將保險業國外保管帳戶資產移轉予第三人。", "四、保管機構應就保險業簽證會計師函證帳戶詢證項目（包括餘額是否相符、是否設定擔保等）逐項確認後，直接函復會計師事務所。", "五、保管契約應明確訂定合約最終受益人、資產所有權歸屬及主次帳戶之受益人僅限該保險業。", "六、其他經主管機關指定之事項。"], "plain": "國外資產可委由保管機構保管或自行保管，保管機構為集保公司，或最近一年評等 A- 以上的本國金融機構及外國金融機構在臺分支機構；經核准者可委由符合標準的國外金融機構保管（成立滿 3 年以上並在境內設分公司等；A- 以上；全球前五百大銀行或保管資產達 5,000 億美元）。經核定國外投資額度達資金 35% 或國外投資金額達美金 10 億元以上者，國外投資有價證券應集中由保管機構保管，且集保公司以外的保管機構不得超過 5 家（透過金融機構辦理特定金錢信託投資國外有價證券及表彰基金者除外）。", "mnemonic": "「三年、A-、500 大」；「35% 或 10 億美元：集保以外不超過 5 家」。", "tip": ""}, {"no": "17", "title": "高風險標的合計限額", "official": ["保險業投資於下列各款之投資總額，合計不得超過該保險業資金百分之五：", "一、債券發行評等等級經國外信用評等機構評定為BBB+級至BB+級或相當等級之可轉換公司債及附認股權公司債。", "二、第五條第十三款之私募公司債。", "三、對沖基金、私募基金、基礎建設基金及商品基金。", "四、資產池個別資產之信用評等等級經國外信用評等機構評定未達BBB-級或相當等級之抵押債務債券。但屬於本辦法施行前已依主管機關相關規定投資且資產池未達BBB-級或相當等級之個別資產佔資產池全部資產之比例低於百分之五者，不在此限。", "五、資產池採槓桿融資架構，或資產池之個別資產含次級房貸或槓桿貸款之抵押債務債券。", "保險業有下列情事之一者，不得投資前項商品：", "一、最近一年有資金運用違反本法受重大裁罰及處分。但違反情事已改正並經主管機關認可者不在此限。", "二、最近一期自有資本與風險資本之比率未達法定標準一點二五倍。但有下列情形之一者，不在此限：", "（一）最近一期自有資本與風險資本之比率達法定標準以上未達法定標準一點二五倍，且經國內外信用評等機構評定最近一年信用評等等級達AA級或相當等級以上。", "（二）其他有具體事證可證明資本健全並經主管機關同意者。", "三、董事會未設置風險管理委員會，或公司內部未設置風險管理部門及風控長，實際負責公司整體風險控管。", "保險業辦理第一項第三款之投資，除與交易對手簽訂承諾投資之交易契約時，應符合前項第二款規定外，就中華民國一百十一年一月二十八日修正施行後所簽訂契約者，於後續依約參與注資時，保險業倘有最近連續兩期未能符合前項第二款規定者，不得參與注資。"], "plain": "下列合計不得超過資金 5%：BBB+ 至 BB+ 的可轉換公司債與附認股權公司債；第5條第13款私募公司債；對沖基金、私募基金、基礎建設基金、商品基金；資產池個別資產評等未達 BBB- 的抵押債務債券；資產池採槓桿融資或含次級房貸、槓桿貸款的抵押債務債券。保險業有某些情事者不得投資這類商品，例如最近一期自有資本與風險資本比率未達法定標準 1.25 倍（有評等 AA 級以上的例外）。", "mnemonic": "五類「可轉債、私募債、四種基金、低評 CDO、槓桿 CDO」。", "tip": "第8條的基金限額（資金 2%）與本條的 5% 是兩個不同的限額，題目常混在一起。"}], "tables": [{"title": "數字速查：誰的 5%、誰的 10%", "head": ["項目", "限額（基準）", "條文"], "rows": [["同一銀行的外匯存款", "資金 3%", "第4條"], ["每一外國中央政府所屬機構債券", "資金 5%", "第6條第1項"], ["每一外國地方政府債券", "核定國外投資額度 5%", "第6條第2項"], ["每一銀行債券、可轉讓定期存單（含同銀行股票）", "資金 5%，且發行銀行業主權益 10%", "第6條第4項"], ["BBB、BBB-、BB+ 次順位銀行債（每一銀行）", "保險業業主權益 10%", "第6條第4項"], ["外幣商業本票（每一公司，含同公司其他證券）", "資金 5%，且發行公司業主權益 10%", "第6條第7項"], ["BBB、BBB-、BB+ 債券（每一公司）", "保險業業主權益 10%", "第7條第3項"], ["股票、IPO 股票、非本國企業存託憑證、可轉債及附認股權公司債（總額）", "核定國外投資總額 40%", "第7條第3項"], ["每一公司股票及公司債（含質押放款）", "資金 5%，且公司業主權益 10%", "第3條第5項"], ["國外表彰基金總額", "核定國外投資總額 40%", "第8條第2項"], ["每一國外基金（證券投資基金、指數型、ETF、REITs、基礎建設、商品）", "資金 5%，且基金已發行總額 10%", "第8條第2項"], ["國際性組織債券（每一組織）", "資金 5%（評等 A- 以上）", "第10條第1項"], ["資產證券化商品", "總額：核定國外投資額度 20%；每一商品：資金 1%", "第9條第2項"], ["房利美、房地美、吉利美的住宅不動產抵押貸款債券", "總額：核定額度 50%；每一機構：核定額度 25%", "第9條第4項"], ["高風險標的合計", " 度提高到 25%，要符合哪些條件？", "back": "符合基本規定（有交易處理程序與風險監控措施並經董事會通過）；最近一年內控無重大缺失或已改正；精算人員或外部投資機構評估有利經營；檢具含風險管理制度說明的完整投資手冊。"}, {"id": 35, "ref": "15", "front": "從 25% 提高到 30%，多一個什麼條件？", "back": "最近一年資金運用無受主管機關重大裁罰及處分，或違反情事已改正並經認可。"}, {"id": 36, "ref": "15", "front": "提高到 35%，條件包括哪些？", "back": "符合 30% 條件；公允價值部位用風險值並每週至少控管一次；攤銷後成本部位建模型並每半年向董事會報告；近二年無罰鍰；董事會下設風險管理委員會並設風險管理部門與風控長。"}, {"id": 37, "ref": "15", "front": "申請超過 35%，條件有哪些？", "back": "取得 35% 核准已逾一年；董事會每年訂風險限額並定期控管；資本比率達法定標準 1.25 倍以上或評等 AA- 以上；當年度未取得其他提高核准。"}, {"id": 38, "ref": "15", "front": "風險值（VaR）的計算規定？", "back": "按週為基礎樣本至少 3 年（或按日、至少 1 年）；資料至少每週更新；99% 信賴水準；10 個交易日；每月回溯測試。"}, {"id": 39, "ref": "11", "front": "「法定標準」現行是多少？題庫的 250%、300% 怎麼來？", "back": "現行資本適足率法定標準為 100%（2026 起新制，舊制 200%）；條文寫 1.25 倍、1.5 倍。題庫的 250%、300% 是舊制 200% 的 1.25 倍、1.5 倍。"}], "chNo": "05", "summary": "保險公司投資國外的規矩：能投資什麼、各類標的的評等與比例上限、國外投資額度怎麼提高、資產怎麼保管。", "scope": "收錄第2至12、14至17條與第11-1、15-1條原文；第11-2、13條只整理數字。", "nav": {"prev": {"file": "ch04.html", "label": "第4章 外匯收支或交易申報辦法"}, "next": {"file": "ch06.html", "label": "第6章 外幣非投資型人身保險：資格條件及注意事項"}}}</script>
<script>const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lab=x=>/^[一二三四五六七八九十]+(之[一二三四五六七八九十]+)?$/.test(x)?'第'+x+'點':/^[0-9]+(-[0-9]+)?$/.test(x)?'第'+x+'條':x;
const mem={};
const store={get(k){try{const v=localStorage.getItem(k);return v===null?mem[k]:v}catch(e){return mem[k]}},set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const BOXKEY='twlife_boxes_v2';
let boxes={};try{boxes=JSON.parse(store.get(BOXKEY)||'{}')}catch(e){boxes={}}
const saveBoxes=()=>store.set(BOXKEY,JSON.stringify(boxes));
function Flash(root,getCards){
  let queue=[],cur=null,flipped=false;
  function build(){const cs=getCards();queue=shuffle(cs.filter(c=>(boxes[c.key]||0)<3)).sort((a,b)=>(boxes[a.key]||0)-(boxes[b.key]||0));flipped=false}
  function render(){
    const cs=getCards(),n=cs.length,done=cs.filter(c=>(boxes[c.key]||0)>=3).length;
    let h='<div class="stat">已熟練 '+done+' / '+n+' 張（答對 3 次視為熟練，進度存在這個瀏覽器）</div><div class="bar"><i style="width:'+(n?done/n*100:0)+'%"></i></div>';
    if(!n){root.innerHTML=h+'<div class="card"><p>沒有可用的閃卡。</p></div>';return}
    if(!queue.length){root.innerHTML=h+'<div class="card"><h3>全部熟練了</h3><p>可以去做情境題，或重設後再來一輪。</p></div><div class="row"><button class="btn" data-a="reset">重設進度</button></div>';return}
    cur=queue[0];
    h+='<div class="card fc" tabindex="0" role="button" data-a="flip"><small>'+(cur.tag?esc(cur.tag)+'｜':'')+esc(lab(cur.ref))+'｜剩 '+queue.length+' 張</small><div class="q">'+esc(cur.front)+'</div>'+(flipped?'<div class="a"><span class="lab fact">答案</span>'+esc(cur.back)+'</div>':'<small>點一下翻面</small>')+'</div>';
    if(flipped)h+='<div class="row"><button class="btn bad" data-a="no">還不熟</button><button class="btn ok" data-a="yes">會了</button></div>';
    h+='<div class="row"><button class="btn" data-a="reset">重設進度</button></div>';
    root.innerHTML=h;
  }
  root.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
    if(a==='flip'){flipped=!flipped;render()}
    else if(a==='reset'){if(confirm('確定要清除這些閃卡的進度？')){getCards().forEach(c=>delete boxes[c.key]);saveBoxes();build();render()}}
    else if(cur&&(a==='yes'||a==='no')){const ok=a==='yes';boxes[cur.key]=ok?Math.min(3,(boxes[cur.key]||0)+1):0;saveBoxes();queue.shift();if(!ok||boxes[cur.key]<3)queue.splice(queue.length?Math.max(1,Math.min(queue.length,ok?6:3)):0,0,cur);flipped=false;render()}});
  root.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.fc')){e.preventDefault();flipped=!flipped;render()}});
  return {refresh(){build();render()}};
}
function Quiz(root,getItems,perRound){
  let items=[],score=0,answered=0,done=false;
  function draw(){
    const perms=items.map(s=>shuffle(s.opts.map((_,k)=>k)));
    root.innerHTML='<div class="stat" id="sc"></div>'+items.map((s,i)=>'<div class="card" data-i="'+i+'"><b>'+(i+1)+'. </b><span class="lab my">'+(s.tag?esc(s.tag)+' ':'')+esc(lab(s.ref))+'</span>'+esc(s.q)+perms[i].map((k,pos)=>'<button class="opt" data-o="'+k+'">'+String.fromCharCode(65+pos)+'. '+esc(s.opts[k])+'</button>').join('')+'<div class="why"></div></div>').join('')+'<div id="qend"></div>';
    score=0;answered=0;upd();
  }
  function upd(){const el=$('#sc',root);if(el)el.textContent='已作答 '+answered+' / '+items.length+'，答對 '+score+' 題';
    if(perRound&&answered===items.length&&items.length){$('#qend',root).innerHTML='<div class="card"><h3>這一組：'+score+' / '+items.length+'</h3></div><div class="row"><button class="btn pri" data-a="again">再來一組</button></div>'}}
  function again(){const all=getItems();items=perRound?shuffle(all).slice(0,perRound):all;draw()}
  root.addEventListener('click',e=>{
    const ag=e.target.closest('[data-a="again"]');if(ag){again();window.scrollTo(0,root.offsetTop-60);return}
    const b=e.target.closest('.opt');if(!b)return;const box=b.closest('.card');if(box.dataset.done)return;
    const s=items[+box.dataset.i],j=+b.dataset.o;box.dataset.done=1;answered++;if(j===s.ans)score++;
    let right='';$$('.opt',box).forEach((x,pos)=>{const k=+x.dataset.o;if(k===s.ans){x.classList.add('right');right=String.fromCharCode(65+pos)}else if(k===j)x.classList.add('wrong')});
    const w=$('.why',box);w.style.display='block';w.innerHTML=(j===s.ans?'答對了。':'答錯了，正解是 '+right+'。')+esc(s.why);upd()});
  return {refresh:again};
}
</script>

$('#s-table').innerHTML=D.tables.map((t,i)=>'<h3 id="t'+i+'">'+esc(t.title)+'</h3><div class="tw"><table><thead><tr>'+t.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+t.rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>').join('');

const fl=Flash($('#s-cards'),()=>cardsAll);fl.refresh();

// 上下章
const N=D.nav||{};
function setLink(el,o,dir){if(o){el.href=o.file;el.textContent=dir==='p'?'← '+o.label:o.label+' →'}else{el.style.visibility='hidden'}}
setLink($('#prev'),N.prev,'p');setLink($('#next'),N.next,'n');

  if(i>=TABS.length){if(N.next)location.href=N.next.file+'#read';return}
  show(TABS[i][0])}
let sx=0,sy=0,skip=false;
document.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;const el=e.target&&e.target.nodeType===1?e.target:(e.target&&e.target.parentElement);skip=!!(el&&el.closest('.tw,nav,input,.off'))},{passive:true});
document.addEventListener('touchend',e=>{if(skip)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>70&&Math.abs(dy)<45){step(dx<0?1:-1)}},{passive:true});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1)});
// 深層連結
function route(){const h=(location.hash||'#read').slice(1).split('/');show(TABS.some(t=>t[0]===h[0])?h[0]:'read',h[1]?decodeURIComponent(h[1]):null)}
window.addEventListener('hashchange',route);route();
</script></body></html>
