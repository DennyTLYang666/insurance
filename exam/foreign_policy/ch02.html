<title>第二章 保險業辦理外匯業務管理辦法</title><style>:root{--bg:#f7f6f2;--card:#fff;--ink:#222;--sub:#666;--line:#e3e0d8;--brand:#1f5f8b;--brand2:#e8f1f7;--ok:#2e7d32;--okbg:#e8f5e9;--bad:#b3261e;--badbg:#fdecea;--warn:#8a5a00;--warnbg:#fff4de}

section{display:none;padding-top:14px}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 12px}
.card h3{margin:0 0 6px;font-size:17px}
.no{display:inline-block;background:var(--brand);color:#fff;border-radius:6px;padding:0 8px;margin-right:8px;font-size:14px}
.lab{display:inline-block;font-size:12px;border-radius:4px;padding:0 6px;margin-right:6px;vertical-align:1px}
.lab.fact{background:#e3f2e5;color:#1b5e20}.lab.my{background:#e8eaf6;color:#283593}.lab.hint{background:var(--warnbg);color:var(--warn)}
.mn{background:var(--brand2);border-radius:8px;padding:8px 10px;margin:8px 0}
details{margin:8px 0}details summary{cursor:pointer;color:var(--brand);font-size:15px}

.tw{overflow-x:auto;margin-bottom:16px}

.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.btn{border:1px solid var(--brand);background:#fff;color:var(--brand);border-radius:8px;padding:9px 16px;font-size:16px;cursor:pointer}
.btn.pri{background:var(--brand);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0}.bar>i{display:block;height:100%;background:var(--ok)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;margin:6px 0;font-size:16px;cursor:pointer}
.opt.right{background:var(--okbg);border-color:var(--ok)}.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.why{display:none;background:var(--brand2);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:15px}
.stat{color:var(--sub);font-size:14px}
footer{color:var(--sub);font-size:13px;margin-top:24px}
.pager{display:flex;justify-content:space-between;gap:8px;margin-top:18px}.pager a{flex:1;text-align:center;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px;text-decoration:none;font-size:14px}

mark{background:#fff0a8;padding:0 1px}

.res small{color:var(--sub)}.res b{color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.ch{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-decoration:none;color:var(--ink);display:block}
.ch:hover{border-color:var(--brand)}.ch h3{margin:0 0 4px;font-size:16px;color:var(--brand)}.ch p{margin:4px 0;font-size:14px}
.chip{display:inline-block;background:var(--brand2);color:#134;border-radius:999px;padding:0 9px;margin:2px 3px 2px 0;font-size:12.5px}
.filter{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.filter button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer}.filter button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
h2{font-size:18px;margin:24px 0 8px}
</style></head>

<script id="data" type="application/json">{"chapter": "第二章", "title": "保險業辦理外匯業務管理辦法", "laws": [{"name": "保險業辦理外匯業務管理辦法", "amended": "民國105年12月30日", "url": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0450013", "source": "全國法規資料庫（中央銀行主管）", "retrieved": "2026-10-30"}], "alerts": [{"t": "本章最容易答反的地方", "d": "第7條「不完備」、第13條「不得以新臺幣為之」、第15條「不得涉及」，轉成文字檔時常常漏掉「不」字，意思會整個相反。請以本頁展開的官方原文為準。"}], "clauses": [{"no": "1", "title": "訂定依據", "official": ["本辦法依中央銀行法第三十五條第二項規定訂定之。"], "plain": "這份辦法的法源是中央銀行法第35條第2項，不是管理外匯條例。", "mnemonic": "法源「央行法35-2」。", "tip": "由中央銀行訂定，所以後面的許可、退回、駁回、廢止都是央行在做。"}, {"no": "2", "title": "適用對象", "official": ["本辦法有關保險業之規定，於保險法所稱之保險業及外國保險業均適用之。"], "plain": "保險法所稱的保險業和外國保險業都適用。", "mnemonic": "", "tip": "條文只寫「保險業」與「外國保險業」。專業再保險業在保險法第147-1條另有規範，屬於保險業的一種，所以再保險業也適用；題目寫「再保險業」時不必懷疑。"}, {"no": "3", "title": "保險業得辦理的外匯業務（八款）", "official": ["保險業得辦理外匯業務如下：", "一、以外幣收付之人身保險業務。", "二、以外幣收付之財產保險業務。但以金融監督管理委員會（以下簡稱金管會）所訂之業務範圍為限。", "三、以外幣收付之再保險業務。", "四、以外幣收付之投資型年金保險，於年金累積期間屆滿時轉換為一般帳簿之即期年金保險，約定以新臺幣給付年金者。", "五、以第一款所指保險之保險單為質之外幣放款。", "六、財富管理業務涉及外匯業務之經營者。", "七、辦理擔任外幣聯合貸款案參加行之外幣放款業務。", "八、其他經中央銀行（以下簡稱本行）許可辦理之外匯業務。"], "plain": "共八款：外幣人身保險、外幣財產保險（限金管會所訂範圍）、外幣再保險、投資型年金轉即期年金並以新臺幣給付、外幣保單質借放款、財富管理涉及外匯、擔任外幣聯貸參加行放款、央行另許可的其他業務。", "mnemonic": "八款口訣「人、財、再、年、質、富、貸、許」。", "tip": "第五款的保單必須是「第一款所指」的外幣人身保險保單；是「財富管理」不是「財產管理」。"}, {"no": "4", "title": "須先向央行申請許可", "official": ["保險業有關外匯業務之經營，應向本行申請許可後，始得辦理。", "保險業得申請辦理前條各款全部或一部之業務項目，並由本行依其業務需要，於該條各款範圍內分別許可之；本行並得就同條第八款許可之業務，另訂或於許可函中載明其他應遵循事項。", "未經本行許可之外匯業務不得辦理之。"], "plain": "外匯業務要先向央行申請許可。可以申請全部或一部分款項，由央行依業務需要分別許可。沒經許可的外匯業務不能辦。", "mnemonic": "「許可找央行」。", "tip": "是央行依「業務需要」許可，不是依財務狀況或自有資本比率。"}, {"no": "5", "title": "由誰備文申請", "official": ["保險業申請辦理外匯業務，除本辦法另有規定者外，應由總機構備文，檢附第六條規定書件向本行申請許可。", "外國保險業申請辦理外匯業務，應由在我國境內設立之分支機構備文，檢附第六條規定書件向本行申請許可。"], "plain": "本國保險業由總機構備文申請；外國保險業由在我國境內設立的分支機構備文申請。", "mnemonic": "總機構／境內分支機構。", "tip": ""}, {"no": "6", "title": "申請要附的書件（七項）", "official": ["保險業申請辦理第三條外匯業務時，應檢附下列書件：", "一、金管會核發之營業執照影本。", "二、董事會決議辦理各該業務議事錄或外國保險公司總公司（或區域總部）授權書。", "三、金管會核准辦理各該業務之證明文件。", "四、經法規遵循、稽核及會計部門單位主管簽署符合主管機關相關法令規範或會計準則之聲明書。", "五、營業計畫書（內容應包括業務簡介、作業流程、款項收付等項目）。", "六、重要事項告知書（含風險告知）。", "七、其他本行規定之文件。", "保險業申請辦理第三條第三款及第七款業務時，免檢附前項第三款及第六款規定文件。"], "plain": "申請書件七項：營業執照影本、董事會議事錄（或外國總公司授權書）、金管會核准證明、法遵稽核會計主管簽署聲明書、營業計畫書、重要事項告知書、其他。辦理第3條第3款（保單質借）和第7款（聯貸參加行）業務時，可以免附第3項（金管會核准證明）和第6項（重要事項告知書）。", "mnemonic": "書件七項「照、決、核、聲、計、告、他」。免附的是「核」和「告」。", "tip": "聲明書是由法規遵循、稽核、會計部門單位主管簽署；營業計畫書內容含業務簡介、作業流程、款項收付。"}, {"no": "7", "title": "退回：書件不完備", "official": ["保險業申請辦理外匯業務時，所送各項書件不完備或應記載事項不充分，經通知限期補正，屆期未補正者，本行得退回其申請案件。"], "plain": "書件不完備或記載事項不充分，經通知限期補正而逾期沒補，央行得退回。", "mnemonic": "退回＝書件問題＋逾期未補正。", "tip": ""}, {"no": "8", "title": "駁回：資格或健全經營有疑慮", "official": ["保險業申請許可辦理外匯業務，經審查有下列情形之一者，本行得駁回其申請：", "一、申請資格不符第五條規定。", "二、最近一年有違反本辦法或其他外匯相關規定且情節重大，或經本行限期改正，屆期仍未改善者。", "三、其他事實足認為有礙業務健全經營或未能符合金融政策要求之虞者。"], "plain": "三種情形央行得駁回：申請資格不符第5條；最近一年違反本辦法或其他外匯規定且情節重大（或限期改正逾期未改善）；其他足認有礙業務健全經營或不符金融政策要求。", "mnemonic": "駁回＝資格不符第5條＋最近一年重大違規＋有礙健全經營。", "tip": "「最近一年違反保險法」或「罰鍰累計達某金額」都不是條文列舉的駁回事由。"}, {"no": "9", "title": "廢止或撤銷許可（五種情形）", "official": ["保險業經辦各項外匯業務，有下列情事之一者，本行得按其情節輕重，廢止或撤銷許可外匯業務之一部或全部：", "一、發給許可函後六個月內未開辦者。但有正當理由申請延期，經本行核准，得延長三個月，並以一次為限。", "二、違反第四條第三項規定，或違反本辦法其他規定且情節重大，或經本行限期改正，屆期仍未改正。", "三、經本行許可辦理各項外匯業務後，發覺原申請事項有虛偽情事，且情節重大者。", "四、有停業、解散或破產之情事者。", "五、其他事實足認為有礙業務健全經營或未能符合金融政策要求之虞者。"], "plain": "已經許可後出問題，央行可依情節輕重廢止或撤銷一部或全部。五種：許可後六個月內沒開辦（有正當理由可延三個月，只能一次）、違反第4條第3項或其他規定且情節重大、申請事項虛偽且情節重大、停業解散破產、其他有礙健全經營。", "mnemonic": "「六個月、延三個月、僅一次」。", "tip": "第二款裡的「經本行限期改正」，主體是央行，不是金管會。"}, {"no": "10", "title": "辨識顧客身分", "official": ["保險業辦理各項外匯業務，應先確實辨識顧客身分或基本登記資料及憑辦文件是否符合規定。"], "plain": "辦理外匯業務前，要先確實辨識顧客身分或基本登記資料，以及憑辦文件是否符合規定。", "mnemonic": "關鍵字「辨識身分、基本登記資料、憑辦文件」。", "tip": "條文沒有寫「瞭解客戶需求」，這是和其他規定混淆的地方。"}, {"no": "11", "title": "報表與結匯", "official": ["本行得要求保險業報送外匯業務相關報表，其格式由本行另定之。保險業並應確保報表之完整與真實。", "保險業辦理外匯業務應確實依收付款項向銀行業辦理結匯，並將結匯明細資料留存以供查核。"], "plain": "央行可要求報送報表，格式央行定，保險業要確保完整真實。保險業辦理外匯業務，要依收付款項向「銀行業」辦理結匯，並留存結匯明細供查核。", "mnemonic": "結匯找「銀行業」，不是央行、金管會。", "tip": ""}, {"no": "12", "title": "央行得派員查閱", "official": ["本行於必要時得派員查閱保險業辦理外匯業務有關帳冊文件，或要求其於期限內據實提出財務報告或其他相關資料。"], "plain": "央行必要時可以派員查閱帳冊文件，或要求限期提出財務報告或其他資料。", "mnemonic": "查閱找「本行」。", "tip": ""}, {"no": "13", "title": "新臺幣收付限制與結匯", "official": ["除本辦法或本行另有規定外，以外幣收付之保險，其相關款項之收付均不得以新臺幣為之；其結匯事宜應由要保人或受益人依外匯收支或交易申報辦法（以下簡稱申報辦法）之規定，逕向銀行業辦理。", "投資型年金保險累積期間屆滿時轉換為一般帳簿之即期年金保險，得約定以新臺幣給付年金，並由保險業依申報辦法等有關規定辦理結匯。", "以外幣收付之財產保險，得依下列規定進行新臺幣收付：", "一、憑要保人提供之保險標的涉及出、進口貨物或提供跨境服務之相關證明文件，及與要保人約定收受等值之新臺幣保險費。", "二、憑受益人提供之新臺幣證明文件為新臺幣保險給付，如涉及結匯事宜，則由財產保險業依申報辦法等有關規定逕向銀行業辦理結匯。", "前項要保人或受益人應為申報辦法第三條定義之公司、行號、團體、個人。", "保險業辦理第三條第二款及第三款業務，其收付幣別得依保險契約約定之外幣收付，如涉及外幣間兌換並應由保險業逕向銀行業辦理。"], "plain": "外幣收付的保險，款項原則上不得以新臺幣收付，結匯由要保人或受益人自己依申報辦法逕向銀行業辦理。例外：投資型年金轉為即期年金後可約定以新臺幣給付年金，由保險業辦理結匯；外幣財產保險在一定證明文件下可以新臺幣收付。", "mnemonic": "「保戶自己結匯、保險業例外代辦」。", "tip": "這一條最容易看錯：「均不得以新臺幣為之」。要保人、受益人、保險業三方各自能不能結匯，請看對照表。"}, {"no": "14", "title": "放款與聯貸的資金來源", "official": ["保險業辦理第三條第五款及第七款業務之資金來源，應以保險業用於國外投資之自有外幣資金為限。", "保險業經許可辦理第三條第七款業務者，應遵循下列規定：", "一、放款對象以國內顧客為限。", "二、應確認主辦行確依本行「銀行業辦理外匯業務作業規範」第六點有關憑辦文件、兌換限制及外債登記等規定辦理。"], "plain": "保單質借（第5款）和外幣聯貸參加行（第7款）的放款，資金只能用保險業用於國外投資的「自有外幣資金」。辦聯貸的另外要：放款對象限國內顧客，並確認主辦行有依央行規範辦理。", "mnemonic": "「自有、外幣、國外投資」。", "tip": "不能用新臺幣資金兌換外幣來放款。"}, {"no": "15", "title": "投資型保險連結衍生性商品的限制", "official": ["保險業銷售之投資型保險商品，如連結衍生性商品並涉及外匯者，其投資標的內容不得涉及下列範圍：", "一、本國貨幣市場之新臺幣利率指標及匯率指標。", "二、相關主管機關限制者。"], "plain": "投資型保險如果連結衍生性商品並涉及外匯，投資標的「不得涉及」兩類：本國貨幣市場的新臺幣利率指標與匯率指標；相關主管機關限制的範圍。", "mnemonic": "「不得」兩樣：台幣利匯率指標、主管機關限制。", "tip": "重點在「不得涉及」。把這句讀成「得涉及」，答案會剛好相反。"}], "tables": [{"title": "第3條八款業務速查", "head": ["款", "業務", "要點"], "rows": [["一", "以外幣收付之人身保險業務", ""], ["二", "以外幣收付之財產保險業務", "以金管會所訂業務範圍為限"], ["三", "以外幣收付之再保險業務", ""], ["四", "投資型年金保險於年金累積期間屆滿時轉換為一般帳簿之即期年金保險", "約定以新臺幣給付年金者"], ["五", "以第一款所指保險之保險單為質之外幣放款", "保單須是外幣人身保險保單（第一款）"], ["六", "財富管理業務涉及外匯業務之經營者", ""], ["七", "辦理擔任外幣聯合貸款案參加行之外幣放款業務", ""], ["八", "其他經中央銀行許可辦理之外匯業務", ""]]}, {"title": "退回、駁回、廢止撤銷：三個動詞怎麼分", "head": ["動詞", "時點", "主要情形", "條文"], "rows": [["退回", "申請階段", "書件不完備或記載不充分，限期補正，逾期未補", "第7條"], ["駁回", "審查階段", "資格不符第5條；最近一年重大違規或逾期未改；有礙健全經營", "第8條"], ["廢止或撤銷", "許可之後", "許可後六個月內未開辦；重大違規；原申請虛偽；停業解散破產；有礙健全經營", "第9條"]]}, {"title": "外幣保險款項的結匯，誰負責？", "head": ["情形", "新臺幣收付", "結匯由誰辦理", "條文"], "rows": [["以外幣收付之保險（一般）", "原則不得", "要保人或受益人，依申報辦法逕向銀行業", "第13條第1項"], ["投資型年金轉為一般帳簿即期年金", "得約定以新臺幣給付年金", "保險業，依申報辦法等規定", "第13條第2項"], ["外幣財產保險", "在證明文件條件下得進行", "受益人新臺幣給付涉及結匯時，由財產保險業逕向銀行業", "第13條第3項"], ["保險業辦理外匯業務（總則）", "—", "保險業依收付款項向銀行業辦理結匯並留存明細", "第11條第2項"]]}, {"title": "誰管什麼", "head": ["單位", "角色"], "rows": [["中央銀行", "許可外匯業務；退回、駁回、廢止撤銷；要求報表；派員查閱帳冊"], ["金管會", "核發營業執照；核准辦理各該業務（申請書件所列）"], ["銀行業", "辦理結匯"], ["保險業", "備文申請、保存結匯明細、確保報表真實"]]}, {"title": "數字與期限", "head": ["項目", "規定", "條文"], "rows": [["許可後開辦期限", "六個月內；有正當理由得延長三個月，限一次", "第9條第1款"], ["申請書件", "七項（辦第3條第3、7款免附兩項）", "第6條"], ["得辦理的外匯業務", "八款", "第3條"], ["駁回事由", "三種", "第8條"], ["廢止撤銷事由", "五種", "第9條"]]}], "scenarios": [{"ref": "13", "q": "客戶以美元購買外幣人身保險，想請保險公司收新臺幣、再由公司自行結匯。依第13條第1項，正確的說法是？", "opts": ["可以，保險公司可直接收新臺幣", "原則上款項不得以新臺幣收付，結匯由要保人或受益人依申報辦法逕向銀行業辦理", "由金管會代為結匯", "由央行直接收取新臺幣"], "ans": 1, "why": "第13條第1項：除本辦法或本行另有規定外，以外幣收付之保險，其相關款項之收付均不得以新臺幣為之；結匯由要保人或受益人逕向銀行業辦理。"}, {"ref": "14", "q": "保險公司想辦理外幣保單質借放款，打算把新臺幣資金兌換成外幣來支應。依第14條，是否可以？", "opts": ["可以，只要匯率合適", "不可以，資金來源限用於國外投資的自有外幣資金", "可以，但要先經金管會同意", "可以，但只限一年期"], "ans": 1, "why": "第14條第1項：第3條第5款及第7款業務的資金來源，應以保險業用於國外投資之自有外幣資金為限。"}, {"ref": "9", "q": "某保險公司取得外匯業務許可函後，八個月都還沒有開辦，也沒有申請延期。依第9條，央行可以怎麼處理？", "opts": ["只能口頭警告", "得按情節輕重廢止或撤銷該許可", "必須罰款", "應退回申請案"], "ans": 1, "why": "第9條第1款：發給許可函後六個月內未開辦者，央行得廢止或撤銷許可；有正當理由經核准可延三個月，限一次。「退回」是申請階段的書件問題。"}, {"ref": "7", "q": "保險公司送件時，營業計畫書內容不充分，央行通知限期補正，公司逾期沒補。依第7條，央行得怎麼做？", "opts": ["廢止許可", "駁回申請", "退回申請案件", "直接核准"], "ans": 2, "why": "第7條：書件不完備或應記載事項不充分，經通知限期補正，屆期未補正，本行得退回其申請案件。"}, {"ref": "8", "q": "下列哪一項是第8條列舉、央行得「駁回」申請的情形？", "opts": ["最近一年罰鍰累計達二百萬元", "申請資格不符第5條規定", "要保書欄位漏填", "負責人換人"], "ans": 1, "why": "第8條三款：申請資格不符第5條；最近一年有違反本辦法或其他外匯相關規定且情節重大（或限期改正逾期未改善）；其他足認有礙業務健全經營或不符金融政策要求之虞。罰鍰累計金額不是條文列舉的事由。"}, {"ref": "6", "q": "保險公司申請辦理「擔任外幣聯合貸款案參加行之外幣放款」（第3條第7款）。依第6條第2項，下列哪兩項書件可以免附？", "opts": ["營業執照影本和董事會議事錄", "金管會核准證明文件和重要事項告知書", "營業計畫書和聲明書", "聲明書和重要事項告知書"], "ans": 1, "why": "第6條第2項：辦理第3條第3款及第7款業務時，免檢附前項第3款（金管會核准證明）及第6款（重要事項告知書）。"}, {"ref": "5", "q": "一家外國保險業要向央行申請辦理外匯業務，應由誰備文？", "opts": ["外國總公司", "在我國境內設立之分支機構", "金管會", "壽險公會"], "ans": 1, "why": "第5條第2項：外國保險業申請辦理外匯業務，應由在我國境內設立之分支機構備文，檢附第6條規定書件向本行申請許可。"}, {"ref": "15", "q": "某投資型保險商品連結衍生性商品並涉及外匯。依第15條，下列哪一項「不得」成為其投資標的內容？", "opts": ["外國貨幣市場的利率指標", "本國貨幣市場之新臺幣利率指標及匯率指標", "外國股價指數", "外幣債券"], "ans": 1, "why": "第15條：投資標的內容不得涉及本國貨幣市場之新臺幣利率指標及匯率指標，以及相關主管機關限制者。"}, {"ref": "10", "q": "依第10條，保險業辦理各項外匯業務前，條文要求先確實辨識什麼？", "opts": ["客戶的投資偏好與財富來源", "顧客身分或基本登記資料，以及憑辦文件是否符合規定", "客戶的信用評等", "客戶的資產負債表"], "ans": 1, "why": "第10條的文字是「辨識顧客身分或基本登記資料及憑辦文件是否符合規定」，沒有寫瞭解客戶需求或財富來源。"}, {"ref": "13", "q": "外幣投資型年金保險在累積期間屆滿後轉為一般帳簿的即期年金保險，若約定以新臺幣給付年金，結匯由誰辦理？", "opts": ["要保人", "受益人", "保險業", "銀行業自行決定"], "ans": 2, "why": "第13條第2項：此情形得約定以新臺幣給付年金，並由保險業依申報辦法等有關規定辦理結匯。（同條第1項一般外幣保險則由要保人或受益人逕向銀行業辦理。）"}], "cards": [{"id": 0, "ref": "1", "front": "本辦法的法源是什麼？", "back": "中央銀行法第35條第2項。"}, {"id": 1, "ref": "3", "front": "第3條保險業得辦理的外匯業務有幾款？分別是什麼？", "back": "八款：外幣人身保險、外幣財產保險（金管會範圍）、外幣再保險、投資型年金轉即期年金以新臺幣給付、外幣保單質借放款、財富管理涉及外匯、擔任外幣聯貸參加行放款、央行許可的其他業務。"}, {"id": 2, "ref": "3", "front": "外幣保單質借放款的保單，限於哪一種保單？", "back": "第一款所指的保險單，也就是以外幣收付之人身保險保單。"}, {"id": 3, "ref": "4", "front": "保險業辦理外匯業務要向誰申請許可？依什麼許可？", "back": "向中央銀行申請許可，央行依其業務需要，在第3條各款範圍內分別許可。"}, {"id": 4, "ref": "4", "front": "未經許可的外匯業務可以辦嗎？", "back": "不得辦理。"}, {"id": 5, "ref": "5", "front": "本國保險業與外國保險業申請，各由誰備文？", "back": "本國保險業由總機構備文；外國保險業由在我國境內設立之分支機構備文。"}, {"id": 6, "ref": "6", "front": "申請外匯業務要檢附的七項書件？", "back": "營業執照影本；董事會議事錄或外國總公司授權書；金管會核准證明文件；法遵、稽核、會計主管簽署的聲明書；營業計畫書；重要事項告知書（含風險告知）；其他本行規定文件。"}, {"id": 7, "ref": "6", "front": "辦第3條第3款和第7款業務時，可以免附哪兩項？", "back": "免附第3項（金管會核准證明文件）和第6項（重要事項告知書）。"}, {"id": 8, "ref": "7", "front": "什麼情形下央行得「退回」申請案？", "back": "書件不完備或應記載事項不充分，經通知限期補正，屆期未補正。"}, {"id": 9, "ref": "8", "front": "央行得「駁回」申請的三種情形？", "back": "申請資格不符第5條；最近一年違反本辦法或其他外匯規定且情節重大（或限期改正逾期仍未改善）；其他足認有礙健全經營或不符金融政策要求。"}, {"id": 10, "ref": "9", "front": "央行得廢止或撤銷許可的五種情形？", "back": "許可函後六個月內未開辦；違反第4條第3項或其他規定且情節重大；許可後發覺原申請事項虛偽且情節重大；停業、解散或破產；其他有礙健全經營。"}, {"id": 11, "ref": "9", "front": "發給許可函後多久內要開辦？可以延期嗎？", "back": "六個月內；有正當理由申請延期並經核准，可延三個月，且只能一次。"}, {"id": 12, "ref": "10", "front": "辦理外匯業務前，要先確實辨識什麼？", "back": "顧客身分或基本登記資料，以及憑辦文件是否符合規定。"}, {"id": 13, "ref": "11", "front": "保險業辦理外匯業務，要向誰辦理結匯？要保存什麼？", "back": "向銀行業辦理結匯，並將結匯明細資料留存以供查核。"}, {"id": 14, "ref": "12", "front": "誰可以派員查閱保險業外匯業務的帳冊文件？", "back": "本行（中央銀行）。"}, {"id": 15, "ref": "13", "front": "外幣收付的保險，相關款項可以用新臺幣收付嗎？誰負責結匯？", "back": "原則上不得以新臺幣收付；結匯由要保人或受益人依申報辦法逕向銀行業辦理。"}, {"id": 16, "ref": "13", "front": "投資型年金轉為一般帳簿即期年金後，可以怎麼給付？誰辦結匯？", "back": "可約定以新臺幣給付年金，由保險業依申報辦法等規定辦理結匯。"}, {"id": 17, "ref": "14", "front": "保單質借和聯貸參加行放款的資金來源限制？", "back": "限於保險業用於國外投資的自有外幣資金。"}, {"id": 18, "ref": "14", "front": "辦外幣聯貸參加行業務，放款對象限於哪些人？", "back": "限國內顧客。"}, {"id": 19, "ref": "15", "front": "投資型保險連結衍生性商品並涉及外匯，投資標的不得涉及什麼？", "back": "本國貨幣市場的新臺幣利率指標及匯率指標；相關主管機關限制者。"}], "chNo": "02", "summary": "保險公司辦外幣業務要先經央行許可。可辦哪些業務、怎麼申請、什麼情形會被退回、駁回或廢止，外幣保險款項怎麼結匯。", "scope": "收錄第1至15條。", "nav": {"prev": {"file": "ch01.html", "label": "第1章 壽險基本概念與保險法重點"}, "next": {"file": "ch03.html", "label": "第3章 管理外匯條例"}}}</script>
<script>const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lab=x=>/^[一二三四五六七八九十]+(之[一二三四五六七八九十]+)?$/.test(x)?'第'+x+'點':/^[0-9]+(-[0-9]+)?$/.test(x)?'第'+x+'條':x;
const mem={};
const store={get(k){try{const v=localStorage.getItem(k);return v===null?mem[k]:v}catch(e){return mem[k]}},set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const BOXKEY='twlife_boxes_v2';
let boxes={};try{boxes=JSON.parse(store.get(BOXKEY)||'{}')}catch(e){boxes={}}
const saveBoxes=()=>store.set(BOXKEY,JSON.stringify(boxes));
function Flash(root,getCards){
  let queue=[],cur=null,flipped=false;
  function build(){const cs=getCards();queue=shuffle(cs.filter(c=>(boxes[c.key]||0)<3)).sort((a,b)=>(boxes[a.key]||0)-(boxes[b.key]||0));flipped=false}
  function render(){
    const cs=getCards(),n=cs.length,done=cs.filter(c=>(boxes[c.key]||0)>=3).length;
    let h='<div class="stat">已熟練 '+done+' / '+n+' 張（答對 3 次視為熟練，進度存在這個瀏覽器）</div><div class="bar"><i style="width:'+(n?done/n*100:0)+'%"></i></div>';
    if(!n){root.innerHTML=h+'<div class="card"><p>沒有可用的閃卡。</p></div>';return}
    if(!queue.length){root.innerHTML=h+'<div class="card"><h3>全部熟練了</h3><p>可以去做情境題，或重設後再來一輪。</p></div><div class="row"><button class="btn" data-a="reset">重設進度</button></div>';return}
    cur=queue[0];
    h+='<div class="card fc" tabindex="0" role="button" data-a="flip"><small>'+(cur.tag?esc(cur.tag)+'｜':'')+esc(lab(cur.ref))+'｜剩 '+queue.length+' 張</small><div class="q">'+esc(cur.front)+'</div>'+(flipped?'<div class="a"><span class="lab fact">答案</span>'+esc(cur.back)+'</div>':'<small>點一下翻面</small>')+'</div>';
    if(flipped)h+='<div class="row"><button class="btn bad" data-a="no">還不熟</button><button class="btn ok" data-a="yes">會了</button></div>';
    h+='<div class="row"><button class="btn" data-a="reset">重設進度</button></div>';
    root.innerHTML=h;
  }
  root.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
    if(a==='flip'){flipped=!flipped;render()}
    else if(a==='reset'){if(confirm('確定要清除這些閃卡的進度？')){getCards().forEach(c=>delete boxes[c.key]);saveBoxes();build();render()}}
    else if(cur&&(a==='yes'||a==='no')){const ok=a==='yes';boxes[cur.key]=ok?Math.min(3,(boxes[cur.key]||0)+1):0;saveBoxes();queue.shift();if(!ok||boxes[cur.key]<3)queue.splice(queue.length?Math.max(1,Math.min(queue.length,ok?6:3)):0,0,cur);flipped=false;render()}});
  root.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.fc')){e.preventDefault();flipped=!flipped;render()}});
  return {refresh(){build();render()}};
}
function Quiz(root,getItems,perRound){
  let items=[],score=0,answered=0,done=false;
  function draw(){
    const perms=items.map(s=>shuffle(s.opts.map((_,k)=>k)));
    root.innerHTML='<div class="stat" id="sc"></div>'+items.map((s,i)=>'<div class="card" data-i="'+i+'"><b>'+(i+1)+'. </b><span class="lab my">'+(s.tag?esc(s.tag)+' ':'')+esc(lab(s.ref))+'</span>'+esc(s.q)+perms[i].map((k,pos)=>'<button class="opt" data-o="'+k+'">'+String.fromCharCode(65+pos)+'. '+esc(s.opts[k])+'</button>').join('')+'<div class="why"></div></div>').join('')+'<div id="qend"></div>';
    score=0;answered=0;upd();
  }
  function upd(){const el=$('#sc',root);if(el)el.textContent='已作答 '+answered+' / '+items.length+'，答對 '+score+' 題';
    if(perRound&&answered===items.length&&items.length){$('#qend',root).innerHTML='<div class="card"><h3>這一組：'+score+' / '+items.length+'</h3></div><div class="row"><button class="btn pri" data-a="again">再來一組</button></div>'}}
  function again(){const all=getItems();items=perRound?shuffle(all).slice(0,perRound):all;draw()}
  root.addEventListener('click',e=>{
    const ag=e.target.closest('[data-a="again"]');if(ag){again();window.scrollTo(0,root.offsetTop-60);return}
    const b=e.target.closest('.opt');if(!b)return;const box=b.closest('.card');if(box.dataset.done)return;
    const s=items[+box.dataset.i],j=+b.dataset.o;box.dataset.done=1;answered++;if(j===s.ans)score++;
    let right='';$$('.opt',box).forEach((x,pos)=>{const k=+x.dataset.o;if(k===s.ans){x.classList.add('right');right=String.fromCharCode(65+pos)}else if(k===j)x.classList.add('wrong')});
    const w=$('.why',box);w.style.display='block';w.innerHTML=(j===s.ans?'答對了。':'答錯了，正解是 '+right+'。')+esc(s.why);upd()});
  return {refresh:again};
}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const LAWS=D.laws;
$('#h1').textContent=D.chapter+'｜'+D.title;
$('#intro').textContent=D.summary||'';
document.title=D.chapter+' '+D.title;
$('#foot').innerHTML='官方來源：'+LAWS.map(L=>esc(L.name)+'（'+esc(L.amended)+(L.kind==='press'?'發布':'修正')+'）<a href="'+esc(L.url)+'" target="_blank" rel="noopener">'+esc(L.url)+'</a>').join('<br>')+(D.scope?'<br>'+esc(D.scope):'')+'<br>條文原文取自官方網頁；「白話」「口訣」「情境題」為編寫者整理，不是法條。法規可能再修正，請以官方最新公告為準；本內容不是法律或投資意見。';
const TABS=[['read','條文速讀'],['table','對照表'],['cards','閃卡'],['quiz','情境題']];
const nav=$('#nav');
TABS.forEach(([id,name])=>{const b=document.createElement('button');b.textContent=name;b.setAttribute('role','tab');b.dataset.id=id;b.onclick=()=>show(id);nav.appendChild(b)});
let curTab='read';
function show(id,anchor){curTab=id;TABS.forEach(([t])=>$('#s-'+t).classList.toggle('on',t===id));$$('button',nav).forEach(b=>b.setAttribute('aria-selected',b.dataset.id===id));
  history.replaceState(null,'','#'+id+(anchor?'/'+anchor:''));
  if(anchor){const el=document.getElementById(anchor);if(el){const d=el.querySelector('details');el.scrollIntoView({block:'start'});el.classList.add('hl')}}else window.scrollTo(0,0)}
$('#s-read').innerHTML=(D.alerts||[]).map(a=>'<div class="banner"><b>'+esc(a.t)+'</b>'+esc(a.d)+'</div>').join('')+D.clauses.map(c=>{
  const off=c.official.map(p=>'<p>'+esc(p)+'</p>').join('');
  return '<div class="card" id="c'+esc(c.no)+'"><h3><span class="no">'+esc(lab(c.no))+'</span>'+esc(c.title)+'</h3>'
   +'<p><span class="lab my">白話</span>'+esc(c.plain)+'</p>'
   +(c.mnemonic?'<div class="mn"><span class="lab my">口訣</span>'+esc(c.mnemonic)+'</div>':'')
   +(c.tip?'<p><span class="lab hint">提醒</span>'+esc(c.tip)+'</p>':'')
   +(c.official.length?'<details><summary>展開官方條文原文</summary><div class="off"><span class="lab fact">原文</span>'+off+'</div></details>':'')+'</div>'}).join('');
$('#s-table').innerHTML=D.tables.map((t,i)=>'<h3 id="t'+i+'">'+esc(t.title)+'</h3><div class="tw"><table><thead><tr>'+t.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+t.rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>').join('');
const cardsAll=D.cards.map(c=>({key:'ch'+D.chNo+':'+c.id,ref:c.ref,front:c.front,back:c.back}));
const fl=Flash($('#s-cards'),()=>cardsAll);fl.refresh();
const qz=Quiz($('#s-quiz'),()=>D.scenarios,0);qz.refresh();
// 上下章
const N=D.nav||{};
function setLink(el,o,dir){if(o){el.href=o.file;el.textContent=dir==='p'?'← '+o.label:o.label+' →'}else{el.style.visibility='hidden'}}
setLink($('#prev'),N.prev,'p');setLink($('#next'),N.next,'n');
// 左右滑動：換分頁，到頭就換章
function step(d){const i=TABS.findIndex(t=>t[0]===curTab)+d;
  if(i<0){if(N.prev)location.href=N.prev.file+'#read';return}
  if(i>=TABS.length){if(N.next)location.href=N.next.file+'#read';return}
  show(TABS[i][0])}
let sx=0,sy=0,skip=false;
document.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;const el=e.target&&e.target.nodeType===1?e.target:(e.target&&e.target.parentElement);skip=!!(el&&el.closest('.tw,nav,input,.off'))},{passive:true});
document.addEventListener('touchend',e=>{if(skip)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>70&&Math.abs(dy)<45){step(dx<0?1:-1)}},{passive:true});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1)});
// 深層連結
function route(){const h=(location.hash||'#read').slice(1).split('/');show(TABS.some(t=>t[0]===h[0])?h[0]:'read',h[1]?decodeURIComponent(h[1]):null)}
window.addEventListener('hashchange',route);route();
</script></body></html>
