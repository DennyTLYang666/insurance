<script id="data" type="application/json">{"chapter": "第十一章", "title": "保險業各類監控措施（僅收錄資產管理自律規範）", "laws": [{"name": "保險業資產管理自律規範", "amended": "民國113年2月29日", "url": "https://law.lia-roc.org.tw/Law/Content?lsid=FL040005", "source": "中華民國人壽保險商業同業公會 保險相關法規查詢系統", "retrieved": "2026-10-30"}, {"name": "保險業辦理資金運用，應遵循之相關事項（金管會令）", "amended": "民國98年8月27日", "docno": "金管保財字第09800101002號", "url": "https://law.fsc.gov.tw/LawContent.aspx?id=GL000067", "source": "金融監督管理委員會主管法規共用系統", "retrieved": "2026-10-31", "kind": "order"}, {"name": "中央銀行外匯局函：壽險業者辦理國外投資匯出資金業務", "amended": "民國94年5月18日（保險局94年5月26日轉知）", "docno": "台央外伍字第0940020843號", "url": "https://law.fsc.gov.tw/LawContent.aspx?id=FE061000", "source": "金融監督管理委員會主管法規共用系統", "retrieved": "2026-10-31", "kind": "letter"}], "alerts": [{"t": "本章收錄三份文件", "d": "壽險公會「保險業資產管理自律規範」（民國113年2月29日修正，第3、4、6、7、9、14、16、19條原文已逐字比對，第7-1條原文亦已逐字比對）；金管會令「保險業辦理資金運用，應遵循之相關事項」（民國98年，金管保財字第09800101002號）；中央銀行外匯局函「壽險業者辦理國外投資匯出資金業務」（民國94年，台央外伍字第0940020843號）。後兩份原文均逐字比對。"}, {"t": "央行函的「5 千萬美元」是 94 年的數字", "d": "這份函寫「每年 5 千萬美元累積結匯金額」。第4章查到央行已於 2024 年 11 月 1 日起把公司、行號每年累積結匯金額調高為 1 億美元。考試若出現 5 千萬，依題庫作答；實務辦理以央行現行規定為準。"}, {"t": "與題庫不同的地方", "d": "現行自律規範第7條的考量事項多了「責任投資原則」；第7-1條已有更詳細的利益衝突規定。"}], "clauses": [{"no": "3", "title": "管理資產要考量負債與風險", "official": ["保險業管理資產時，應考量負債及風險，並分析資產與負債之關係，確保有足夠之清償能力。", "前項分析資產與負債之關係，應考慮下列事項：", "一、分析持有資產之到期日、流動性及與負債之適當性。", "二、建立適當現金流量預測模型，以測試公司是否能承受市場情境與投資條件之變化，並檢視當其清償能力受到負面影響時，能否作適當調整。"], "plain": "管理資產要考量「負債及風險」，並分析資產與負債的關係，確保有足夠的清償能力。分析時要考慮兩件事：持有資產的到期日、流動性與負債的適當性；建立現金流量預測模型，測試能否承受市場情境與投資條件變化。", "mnemonic": "分析資產負債看「到期日、流動性」，加「現金流量預測」。", "tip": "是「負債及風險」，不是「成本與收益」。"}, {"no": "4", "title": "辨識、衡量、報告、監控五類風險", "official": ["保險業應對各項資產所產生之各種風險加以辨識、衡量、報告及監控。", "前項所稱各種風險至少應包括市場風險、信用風險、流動性風險、作業風險及法律風險。"], "plain": "對各項資產產生的風險要「辨識、衡量、報告、監控」。風險至少包括市場、信用、流動性、作業、法律五類。", "mnemonic": "動作「識、量、報、控」；五類「市、信、流、作、法」。", "tip": "動詞是「報告」，不是「裁量」。"}, {"no": "6", "title": "投資管理流程", "official": ["保險業訂立之投資管理流程，其內容應包括：", "一、制定整體性投資政策。", "二、設置並授權相關單位執行投資政策。", "三、分析、衡量及控制投資結果與風險，其內容應包括：", "（一）建立風險管理機制。", "（二）建立完善之內部控制及稽核制度。", "（三）建立投資有價證券分析、決定、執行及檢討之四大流程。", "（四）建立適當之投資績效評估流程。", "（五）建立相關人員適當且即時之投資溝通機制。", "（六）建立投資政策與流程合理性之內部檢視機制。", "四、建立內部股權投資人員利益衝突防範機制，其內容應至少包括意圖獲取利益，以職務上所知悉消息，為自己或他人從事國內股權商品交易之禁止。"], "plain": "投資管理流程四大塊：制定整體性投資政策；設置並授權單位執行；分析、衡量、控制投資結果與風險（含六項：風險管理機制、內控稽核、四大流程、績效評估、投資溝通、內部檢視）；建立內部股權投資人員利益衝突防範機制。", "mnemonic": "四塊「政策、授權、控管、防衝突」。", "tip": "「投資執行報告」不在第6條的流程清單裡，它在第16條。"}, {"no": "7", "title": "投資政策與每年檢討", "official": ["訂立前條投資政策時需考量資產與負債關係、風險承受程度、長期風險報酬要求、流動性與清償能力及責任投資原則後訂之，並報經董事會通過，其內容至少應包括下列事項：", "一、資產配置之決策依據。", "二、建立投資項目（含衍生性金融商品）之規範或限制（含續後之管理），如市場種類限制、最低信評或品質要求、分散投資或相關數量之限制、外匯限制與投資標的企業是否落實執行防制洗錢及打擊資恐及善盡環境保護、企業誠信與社會責任。", "三、操作衍生性金融商品與購買結構型商品時，應特別詳細揭露。", "四、投資決策授權層級。", "前項投資政策至少每年應重新依照資產與負債關係、風險承受程度、長期風險報酬要求、流動性與清償能力狀況檢討一次，並報經董事會通過。"], "plain": "訂投資政策要考量：資產與負債關係、風險承受程度、長期風險報酬要求、流動性與清償能力，以及責任投資原則，並報董事會通過。政策至少每年檢討一次，並報董事會通過。", "mnemonic": "考量「資、風、報、流、責」；檢討「每年」。", "tip": "題庫只列前四項考量，現行條文多了「責任投資原則」；「資產報酬要求」不在列舉裡，是「長期風險報酬要求」。"}, {"no": "7-1", "title": "國內股權商品投資人員的利益衝突防範", "official": ["保險業應要求國內股權商品投資相關人員應盡忠實誠信原則，除法令或本自律規範另有規定外，不得有下列行為：", "一、以職務上所知悉之消息，洩漏予他人或從事國內股權商品買賣之交易活動。", "二、運用保險業資金買賣國內股權商品時，為自己或他人之利益買入或賣出，或無正當理由，與所屬保險業為相對委託之交易。", "三、於公開場所或傳播媒體，對個別國內股權商品之買賣進行推介，或對個別國內股權商品未來之價位作研判預測。", "四、其他影響保險業之權益或經營者。", "國內股權商品投資相關人員係指下列兩類人員：", "一、職務上有權代表公司進行國內股權商品投資交易人員，包括蒐集資料及分析、作成決策、有權簽核相關文件、實際進行交易之人員。", "二、因執行業務於所屬保險業交易前知悉國內股權商品投資交易相關內容之非實際從事投資交易人員，包括但不限於經理人、風險管理人員、法令遵循人員、法務人員、董事及監察人。", "保險業應建立前項第一款人員之任用資格條件，並於聘用該類人員前，就受聘人員過去是否因涉有利益衝突情事而受金融業主管機關處分進行調查，並納入聘用條件之一。", "保險業應就第二項第二款所稱交易前知悉人員之判斷標準訂定內部規範，其標準符合於交易前同時知悉交易標的、交易期間及價格區間等三項非公開交易資訊時，即屬知悉範疇。", "為避免國內股權商品投資相關人員之個人投資行為與所屬保險業產生利益衝突之情形，保險業應要求前述人員於買賣其知悉交易相關內容之國內股權商品前應取得其所屬保險業之核准，但因繼承、強制執行、公用徵收、法院判決、現金增資發行新股、無償配發新股、受讓庫藏股、行使員工認股權憑證、參加員工福利儲蓄信託、員工持股信託或以現金以外之財產退還股款等原因取得及取得後賣出國內股權商品，以及因減資發生國內股權商品異動者，不在此限。", "保險業應要求國內股權商品投資相關人員至少每月依附件範本格式向所屬保險業申報其本人、配偶、未成年子女及被本人利用名義交易者之國內股權商品交易情形，但非實際從事投資交易人員，得就其知悉交易相關內容之國內股權商品辦理申報前述相關當事人之交易情形。當月無國內股權商品交易者，則無須申報。", "保險業應要求國內股權商品投資相關人員交付本人、配偶及未成年子女之同意書，授權公司或本人親自向臺灣證券交易所股份有限公司、財團法人中華民國證券櫃檯買賣中心或臺灣集中保管結算所查詢上述買賣國內股權商品之情形，以辦理前項交易查核機制。", "前二項若因配偶間感情不睦，或縱已離異而由他方單獨行使親權，或由第三人擔任監護人等情形，致無法取得者，保險業就該等個案應於內控制度中研擬因應方案，包括相關人員應提供之證明文件及定期稽核機制，並確實控管。", "保險業應訂定國內股權商品投資相關人員從事國內股權商品交易應受禁止之情形、申報及違規處理方式，並檢核是否有利益衝突之情事，且內部稽核單位應至少每年查核相關人員遵循情形及揭露於內部稽核報告。保險業應就上開利益衝突情事之檢核訂定內部判斷標準。", "本自律規範所稱之國內股權商品係指保險法第一百四十六條之一第一項第三款所規定之股票及其衍生之具有股權性質有價證券及衍生性金融商品。", "前項所稱之具有股權性質有價證券之範圍，依證券交易法及其施行細則規定認定。"], "plain": "保險業要求國內股權商品投資相關人員盡忠實誠信義務，不得有洩漏消息、為自己或他人利益買賣、公開推介個別股票等行為。重點頻率：投資相關人員至少每月申報本人、配偶、未成年子女及被利用名義者的國內股權商品交易（當月無交易免申報）；內部稽核單位至少每年查核相關人員遵循情形，並揭露於內部稽核報告。", "mnemonic": "「申報每月、稽核每年」。", "tip": "重點頻率：至少每月申報、內部稽核至少每年查核。「當月無交易免申報」。"}, {"no": "9", "title": "授權高階主管、董事會負最終責任", "official": ["保險業應依其規模、業務性質及組織特性，由董事會授權高階主管人員負責投資政策之規劃、管理及執行。", "董事會應負投資管理流程與投資政策之最終責任。"], "plain": "董事會授權高階主管人員負責投資政策的「規劃、管理及執行」；董事會對投資管理流程與投資政策負最終責任。", "mnemonic": "授權三動作「規劃、管理、執行」。", "tip": ""}, {"no": "14", "title": "高階主管每年檢視", "official": ["高階主管人員每年至少一次根據業務與市場情況，檢視其內部作業程序之適當性。"], "plain": "高階主管人員每年至少一次，依業務與市場情況檢視內部作業程序是否適當。", "mnemonic": "「每年至少一次」。", "tip": ""}, {"no": "16", "title": "投資執行報告", "official": ["高階主管人員應將投資執行報告，定期提報董事會或其授權單位。", "前項投資執行報告之內容至少應包含下列事項：", "一、投資期間重大資產變動。", "二、各類資產項目之持有部位。", "三、未來短期之投資活動。"], "plain": "高階主管人員要把投資執行報告定期提報董事會或其授權單位，內容至少包括：投資期間重大資產變動、各類資產項目持有部位、未來短期投資活動。", "mnemonic": "三項「變動、部位、未來」。", "tip": "提報對象是董事會或其授權單位，不是壽險公會、金管會或外匯局。"}, {"no": "19", "title": "實施日期", "official": ["本自律規範自中華民國九十六年一月一日起開始實施。", "中華民國一百零四年五月十八日經壽險公會理監事聯席會及一百零四年五月二十九日經產險公會理事會決議通過之第七條修正條文，自一百零五年一月一日實施。", "中華民國一百十年十二月十六日經壽險公會理監事聯席會及一百十年十二月三十日經產險公會理事會決議通過之第七條之二修正條文，自一百十一年七月一日實施。"], "plain": "本自律規範自民國96年1月1日起實施；之後第7條、第7-2條的修正另有實施日。", "mnemonic": "實施「96年1月1日」。", "tip": ""}, {"no": "令（一）", "title": "入帳、超限判斷與逾限改正", "official": ["一、保險業辦理資金運用相關事宜，應遵循下列事項辦理：", "（一）保險業辦理各項資金運用時應以購買成本入帳，並於計算投資部位時，依商品特性予以適當評價，而判斷超限與否應以最近一筆交易之成交價格為評估基準；另非因公司增加投資之因素所致資金運用項目有逾保險法及相關法令所定限額之情況，公司稽核部門應予以追蹤控管，如公司於6 個月內仍無法改正前述逾限部位之調整情事，則稽核部門應立即陳報主管機關並提出書面說明及具體改善計畫。"], "plain": "資金運用以購買成本入帳，計算部位時依商品特性適當評價；判斷有沒有超過限額，以最近一筆交易的成交價格為基準。不是因為公司加碼而超限（例如價格上漲、比例被動變大），由稽核部門追蹤控管；6 個月內還改不了，稽核部門要立刻報主管機關，並附書面說明與具體改善計畫。", "mnemonic": "「成本入帳、最近成交價判斷、六個月改不了報主管機關」", "tip": "6 個月是「公司仍無法改正」的期限，報告的人是稽核部門，不是投資部門。"}, {"no": "令（二）", "title": "國外投資總額的衡量日與算法", "official": ["一、保險業辦理資金運用相關事宜，應遵循下列事項辦理：", "（二）保險業於實際匯出外幣或以外幣購買國外投資標的之時點，均屬國外投資總額之衡量日，應評估有無逾限之虞；另關於國外投資總額之計算，則以最近一期會計師簽證或核閱之決（結）算之國外投資總額，加減至衡量日止所有新增減之實際國外投資金額，且新增減投資部分應以實際入帳時之匯率計算。"], "plain": "實際匯出外幣、或用外幣買國外投資標的的那個時點，就是衡量日，要先評估會不會超限。國外投資總額 = 最近一期會計師簽證或核閱的決（結）算國外投資總額，加減到衡量日為止的新增減實際投資金額；新增減部分以「實際入帳時的匯率」換算。", "mnemonic": "「匯出或買進就是衡量日；新增減用入帳匯率」", "tip": "換算匯率是「實際入帳時」，不是簽約日、也不是報表日。"}, {"no": "令（三）", "title": "國外投資總額的計算範圍", "official": ["一、保險業辦理資金運用相關事宜，應遵循下列事項辦理：", "（三）國外投資總額之計算範圍，除法令所載國外投資項目外，仍應計入國外有價證券因跨月交割所產生之應收及應付款、衍生性金融資產與負債淨額，以及因投資國外有價證券所衍生之應收利息等與國外投資相關之項目。"], "plain": "除了法令列的國外投資項目，還要把這些算進去：國外有價證券跨月交割產生的應收及應付款、衍生性金融資產與負債淨額、投資國外有價證券衍生的應收利息等與國外投資相關的項目。", "mnemonic": "", "tip": ""}, {"no": "令（四）", "title": "外幣非投資型保單併入國外投資限額", "official": ["一、保險業辦理資金運用相關事宜，應遵循下列事項辦理：", "（四）外幣收付之非投資型人身保險契約所收取之保費及從事之資金運用，除相關法令有明確規範排除外，應併入國外投資限額計算。"], "plain": "外幣收付的非投資型人身保險契約收的保費，以及用這些保費做的資金運用，除非相關法令明確排除，一律併入國外投資限額計算。向客戶解釋「為什麼公司外幣保單賣很多會受限」時，就是這條。", "mnemonic": "「外幣非投資型：保費和運用都併入國外投資限額」", "tip": "第5章第15-1條的「彈性調整公式」與第15-2條的「不計入國外投資額度」，就是這條的例外與配套。"}, {"no": "央行函（一）", "title": "壽險業匯出資金的三種方式", "official": ["主旨：即日起，貴行受理壽險業者辦理國外投資匯出資金業務，請依說明各點辦理，請查照。", "說明：一、壽險業者辦理國外投資，可在行政院金融監督管理委員會核定投資比率範圍內，以下列方式匯出資金：", "(一)利用其每年5千萬美元累積結匯金額。", "(二)經由金融機構辦理之特定金錢信託投資國外。", "(三)由業者向本行專案申請核准匯出所需資金，自行投資國外。"], "plain": "壽險業要辦國外投資匯出資金，可在金管會核定的投資比率範圍內，用三種方式：（1）利用「每年 5 千萬美元累積結匯金額」；（2）經金融機構辦理特定金錢信託投資國外；（3）由業者向央行專案申請核准匯出資金、自行投資國外。", "mnemonic": "「額度、信託、專案」三擇一", "tip": "「5 千萬美元」是民國 94 年這份函的寫法。第4章已查到央行 2024 年把公司、行號每年累積結匯金額調高為 1 億美元（推論：現行額度以央行最新規定為準）。題庫若寫 5 千萬，依題庫作答，但實務上要用現行額度。"}, {"no": "央行函（二、三）", "title": "仍依主管機關規定、舊函停止適用", "official": ["主旨：即日起，貴行受理壽險業者辦理國外投資匯出資金業務，請依說明各點辦理，請查照。", "二、壽險業者投資國外相關事宜，仍應依據相關主管機關之規定辦理。", "三、本局90年6月29日(90)台央外伍字第040025133號函，自即日起停止適用。"], "plain": "壽險業投資國外的其他事項，仍依相關主管機關的規定辦理。央行外匯局 90 年 6 月 29 日（90）台央外伍字第 040025133 號函，自這份函生效日起停止適用。", "mnemonic": "", "tip": ""}], "tables": [{"title": "風險與動作", "head": ["項目", "內容"], "rows": [["對風險要做的四件事", "辨識、衡量、報告、監控"], ["風險至少五類", "市場風險、信用風險、流動性風險、作業風險、法律風險"]]}, {"title": "頻率與時點速查", "head": ["項目", "頻率", "條文"], "rows": [["投資政策重新檢討並報董事會通過", "至少每年", "第7條"], ["高階主管檢視內部作業程序", "每年至少一次", "第14條"], ["投資執行報告提報董事會或其授權單位", "定期", "第16條"], ["股權投資相關人員申報個人交易", "至少每月（當月無交易免申報）", "第7-1條"], ["內部稽核查核人員遵循情形", "至少每年", "第7-1條"], ["自律規範實施日", "民國96年1月1日", "第19條"]]}, {"title": "投資管理流程的四個部分（第6條）", "head": ["部分", "內容"], "rows": [["一", "制定整體性投資政策"], ["二", "設置並授權相關單位執行投資政策"], ["三", "分析、衡量及控制投資結果與風險（風險管理機制、內控稽核、四大流程、績效評估、投資溝通、內部檢視）"], ["四", "建立內部股權投資人員利益衝突防範機制"]]}, {"title": "三份文件速查", "head": ["文件", "管什麼", "記憶點"], "rows": [["保險業資產管理自律規範（壽險公會）", "管理資產、風險、投資政策與流程", "每年檢討、報董事會、四大流程"], ["金管會令 98 年", "國外投資總額怎麼算、超限怎麼處理", "成本入帳、最近成交價、6 個月、外幣保單併入限額"], ["央行外匯局函 94 年", "壽險業國外投資怎麼匯出資金", "額度、信託、專案三擇一"]]}], "scenarios": [{"ref": "4", "q": "依資產管理自律規範第4條，保險業對各項資產產生的風險，要做哪四件事？", "opts": ["辨識、衡量、報告、監控", "辨識、衡量、裁量、監控", "評估、衡量、報告、處分", "辨識、報告、監控、處分"], "ans": 0, "why": "第4條：加以辨識、衡量、報告及監控。"}, {"ref": "4", "q": "下列哪一種風險「不在」資產管理自律規範第4條至少應包括的風險清單內？", "opts": ["市場風險", "信用風險", "通貨膨脹風險", "法律風險"], "ans": 2, "why": "第4條第2項：至少包括市場、信用、流動性、作業、法律五類風險，沒有列通貨膨脹風險。"}, {"ref": "7", "q": "保險業的整體性投資政策，依第7條至少多久要重新檢討一次並報經董事會通過？", "opts": ["每月", "每季", "每半年", "每年"], "ans": 3, "why": "第7條第2項：投資政策至少每年應重新檢討一次，並報經董事會通過。"}, {"ref": "16", "q": "高階主管人員的投資執行報告，依第16條應定期提報給誰？", "opts": ["壽險公會", "金管會", "董事會或其授權單位", "外匯局"], "ans": 2, "why": "第16條：應將投資執行報告，定期提報董事會或其授權單位。"}, {"ref": "14", "q": "依第14條，高階主管人員檢視內部作業程序的適當性，頻率是？", "opts": ["每年至少一次", "每季至少一次", "每月至少一次", "三年至少一次"], "ans": 0, "why": "第14條：每年至少一次，根據業務與市場情況檢視。"}, {"ref": "3", "q": "依第3條，保險業管理資產時，應考量？", "opts": ["資產與負債", "負債及風險", "成本與收益", "風險及報酬"], "ans": 1, "why": "第3條第1項：保險業管理資產時，應考量負債及風險，並分析資產與負債之關係。"}, {"ref": "19", "q": "保險業資產管理自律規範原始版本自何時開始實施？", "opts": ["民國95年1月1日", "民國96年1月1日", "民國96年7月5日", "民國95年7月5日"], "ans": 1, "why": "第19條：自中華民國九十六年一月一日起開始實施。"}, {"ref": "令（二）", "q": "依金管會令，計算國外投資總額時，新增減投資部分應以何時的匯率換算？", "opts": ["簽約日匯率", "實際入帳時之匯率", "會計年度結束日匯率", "每月月底匯率"], "ans": 1, "why": "金管保財字第09800101002號令（二）：新增減投資部分應以實際入帳時之匯率計算。"}, {"ref": "令（四）", "q": "外幣收付之非投資型人身保險契約所收取的保費及從事的資金運用，依金管會令，在國外投資限額上如何處理？", "opts": ["完全不計入國外投資限額", "除法令明確排除外，併入國外投資限額計算", "只計入保費、不計入資金運用", "由公司自行決定是否計入"], "ans": 1, "why": "令（四）：除相關法令有明確規範排除外，應併入國外投資限額計算。"}, {"ref": "央行函（一）", "q": "依央行外匯局函，壽險業辦理國外投資匯出資金，下列何者「不是」函列的方式？", "opts": ["利用其每年累積結匯金額", "經由金融機構辦理特定金錢信託投資國外", "由業者向央行專案申請核准匯出資金", "直接向金管會申請核發外匯額度"], "ans": 3, "why": "函列三種：利用每年累積結匯金額、特定金錢信託投資國外、向央行專案申請核准。核發額度的對象不是金管會。"}], "cards": [{"id": 0, "ref": "3", "front": "管理資產時要考量什麼？", "back": "負債及風險，並分析資產與負債之關係，確保有足夠之清償能力。"}, {"id": 1, "ref": "3", "front": "分析資產與負債之關係要考慮哪兩件事？", "back": "分析持有資產之到期日、流動性及與負債之適當性；建立適當現金流量預測模型。"}, {"id": 2, "ref": "4", "front": "各種風險要做哪四件事？", "back": "辨識、衡量、報告、監控。"}, {"id": 3, "ref": "4", "front": "風險至少包括哪五類？", "back": "市場風險、信用風險、流動性風險、作業風險、法律風險。"}, {"id": 4, "ref": "6", "front": "投資管理流程的四個部分？", "back": "制定整體性投資政策；設置並授權相關單位執行；分析、衡量及控制投資結果與風險；建立內部股權投資人員利益衝突防範機制。"}, {"id": 5, "ref": "6", "front": "「分析、衡量及控制投資結果與風險」包含哪六項？", "back": "風險管理機制；內部控制及稽核制度；投資有價證券分析、決定、執行及檢討四大流程；投資績效評估流程；相關人員適當且即時的投資溝通機制；投資政策與流程合理性的內部檢視機制。"}, {"id": 6, "ref": "7", "front": "訂定投資政策要考量哪些事項？", "back": "資產與負債關係、風險承受程度、長期風險報酬要求、流動性與清償能力及責任投資原則；並報經董事會通過。"}, {"id": 7, "ref": "7", "front": "投資政策多久重新檢討一次？", "back": "至少每年一次，並報經董事會通過。"}, {"id": 8, "ref": "7-1", "front": "股權投資相關人員多久申報個人交易？", "back": "至少每月（當月無交易則免申報）。"}, {"id": 9, "ref": "7-1", "front": "內部稽核單位多久查核股權投資人員遵循情形？", "back": "至少每年，並揭露於內部稽核報告。"}, {"id": 10, "ref": "9", "front": "誰負責投資政策的規劃、管理及執行？誰負最終責任？", "back": "董事會授權的高階主管人員負責規劃、管理及執行；董事會負投資管理流程與投資政策之最終責任。"}, {"id": 11, "ref": "14", "front": "高階主管檢視內部作業程序適當性的頻率？", "back": "每年至少一次。"}, {"id": 12, "ref": "16", "front": "投資執行報告提報給誰？內容至少有哪些？", "back": "提報董事會或其授權單位；內容至少含投資期間重大資產變動、各類資產項目持有部位、未來短期投資活動。"}, {"id": 13, "ref": "19", "front": "資產管理自律規範何時開始實施？", "back": "民國96年1月1日。"}, {"id": 14, "ref": "令（一）", "front": "判斷資金運用有沒有超限，用哪個價格？", "back": "以最近一筆交易的成交價格為評估基準；資金運用以購買成本入帳。"}, {"id": 15, "ref": "令（一）", "front": "非因公司增加投資造成逾限，6 個月內仍無法改正，稽核部門要怎麼做？", "back": "立即陳報主管機關，並提出書面說明及具體改善計畫。"}, {"id": 16, "ref": "令（二）", "front": "國外投資總額的「衡量日」是哪一天？", "back": "實際匯出外幣、或以外幣購買國外投資標的的時點。"}, {"id": 17, "ref": "令（二）", "front": "國外投資總額怎麼計算？新增減部分用什麼匯率？", "back": "最近一期會計師簽證或核閱的決（結）算國外投資總額，加減至衡量日止所有新增減實際投資金額；新增減部分以實際入帳時的匯率計算。"}, {"id": 18, "ref": "令（三）", "front": "國外投資總額的計算範圍，除了法令列的項目，還要計入什麼？", "back": "國外有價證券跨月交割的應收及應付款、衍生性金融資產與負債淨額、投資國外有價證券衍生的應收利息等與國外投資相關的項目。"}, {"id": 19, "ref": "令（四）", "front": "外幣收付非投資型人身保險的保費與資金運用，國外投資限額怎麼算？", "back": "除相關法令明確排除外，併入國外投資限額計算。"}, {"id": 20, "ref": "央行函（一）", "front": "壽險業辦理國外投資匯出資金，央行函列了哪三種方式？", "back": "（1）利用每年 5 千萬美元累積結匯金額；（2）經金融機構辦理特定金錢信託投資國外；（3）向央行專案申請核准匯出資金、自行投資國外。"}], "chNo": "11", "summary": "保險公司資產管理與國外投資的內部規範：投資政策、風險辨識、授權與報告、股權投資人員的利益衝突防範，以及國外投資總額怎麼算、資金怎麼匯出。", "scope": "收錄資產管理自律規範第3、4、6、7、7-1、9、14、16、19條原文，以及金管會令（98年）與央行外匯局函（94年）全文。", "nav": {"prev": {"file": "ch10.html", "label": "第10章 新型態人身保險商品認定標準"}, "next": null}}</script>
<script>const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>{t=String(t||'');const ss=t.split(/(?<=。)/).map(x=>x.trim()).filter(Boolean);if(t.length<=90||ss.length<2&&t.indexOf('；')<0)return '<p>'+esc(t)+'</p>';
  const li=s=>{s=s.replace(/。$/,'');const m=s.match(/^([^：；]{1,40})：(.+)$/);if(m&&m[2].split('；').length>=3)return '<li><b>'+esc(m[1])+'</b><ul>'+m[2].split('；').map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></li>';
    const parts=s.split('；');if(parts.length>=3)return '<li>'+parts.map(x=>esc(x)).join('<br>')+'</li>';return '<li>'+esc(s)+'</li>'};
  return '<ul class="pl">'+ss.map(li).join('')+'</ul>'};
const factsT=f=>f?'<div class="tw"><table class="ft"><thead><tr>'+f.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+f.rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'';
const lab=x=>/^[一二三四五六七八九十]+(之[一二三四五六七八九十]+)?$/.test(x)?'第'+x+'點':/^[0-9]+(-[0-9]+)?$/.test(x)?'第'+x+'條':x;
const mem={};
const store={get(k){try{const v=localStorage.getItem(k);return v===null?mem[k]:v}catch(e){return mem[k]}},set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const BOXKEY='twlife_boxes_v2';
let boxes={};try{boxes=JSON.parse(store.get(BOXKEY)||'{}')}catch(e){boxes={}}
const saveBoxes=()=>store.set(BOXKEY,JSON.stringify(boxes));
function Flash(root,getCards){
  let queue=[],cur=null,flipped=false;
  function build(){const cs=getCards();queue=shuffle(cs.filter(c=>(boxes[c.key]||0)<1)).sort((a,b)=>(boxes[a.key]||0)-(boxes[b.key]||0));flipped=false}
  function render(){
    const cs=getCards(),n=cs.length,done=cs.filter(c=>(boxes[c.key]||0)>=1).length;
    let h='<div class="stat">已熟練 '+done+' / '+n+' 張（答對 1 次視為熟練，進度存在這個瀏覽器）</div><div class="bar"><i style="width:'+(n?done/n*100:0)+'%"></i></div>';
    if(!n){root.innerHTML=h+'<div class="card"><p>沒有可用的閃卡。</p></div>';return}
    if(!queue.length){root.innerHTML=h+'<div class="card"><h3>全部熟練了</h3><p>可以去做情境題，或重設後再來一輪。</p></div><div class="row"><button class="btn" data-a="reset">重設進度</button></div>';return}
    cur=queue[0];
    h+='<div class="card fc" tabindex="0" role="button" data-a="flip"><small>'+(cur.tag?esc(cur.tag)+'｜':'')+esc(lab(cur.ref))+'｜剩 '+queue.length+' 張</small><div class="q">'+esc(cur.front)+'</div>'+(flipped?'<div class="a"><span class="lab fact">答案</span>'+esc(cur.back)+'</div>':'<small>點一下翻面</small>')+'</div>';
    if(flipped)h+='<div class="row"><button class="btn bad" data-a="no">還不熟</button><button class="btn ok" data-a="yes">會了</button></div>';
    h+='<div class="row"><button class="btn" data-a="reset">重設進度</button></div>';
    root.innerHTML=h;
  }
  root.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
    if(a==='flip'){flipped=!flipped;render()}
    else if(a==='reset'){if(confirm('確定要清除這些閃卡的進度？')){getCards().forEach(c=>delete boxes[c.key]);saveBoxes();build();render()}}
    else if(cur&&(a==='yes'||a==='no')){const ok=a==='yes';boxes[cur.key]=ok?Math.min(1,(boxes[cur.key]||0)+1):0;saveBoxes();queue.shift();if(!ok||boxes[cur.key]<1)queue.splice(queue.length?Math.max(1,Math.min(queue.length,ok?6:3)):0,0,cur);flipped=false;render()}});
  root.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.fc')){e.preventDefault();flipped=!flipped;render()}});
  return {refresh(){build();render()}};
}
function Quiz(root,getItems,perRound){
  let items=[],score=0,answered=0,done=false;
  function draw(){
    const perms=items.map(s=>shuffle(s.opts.map((_,k)=>k)));
    root.innerHTML='<div class="stat" id="sc"></div>'+items.map((s,i)=>'<div class="card" data-i="'+i+'"><b>'+(i+1)+'. </b><span class="lab my">'+(s.tag?esc(s.tag)+' ':'')+esc(lab(s.ref))+'</span>'+esc(s.q)+perms[i].map((k,pos)=>'<button class="opt" data-o="'+k+'">'+String.fromCharCode(65+pos)+'. '+esc(s.opts[k])+'</button>').join('')+'<div class="why"></div></div>').join('')+'<div id="qend"></div>';
    score=0;answered=0;upd();
  }
  function upd(){const el=$('#sc',root);if(el)el.textContent='已作答 '+answered+' / '+items.length+'，答對 '+score+' 題';
    if(perRound&&answered===items.length&&items.length){$('#qend',root).innerHTML='<div class="card"><h3>這一組：'+score+' / '+items.length+'</h3></div><div class="row"><button class="btn pri" data-a="again">再來一組</button></div>'}}
  function again(){const all=getItems();items=perRound?shuffle(all).slice(0,perRound):all;draw()}
  root.addEventListener('click',e=>{
    const ag=e.target.closest('[data-a="again"]');if(ag){again();window.scrollTo(0,root.offsetTop-60);return}
    const b=e.target.closest('.opt');if(!b)return;const box=b.closest('.card');if(box.dataset.done)return;
    const s=items[+box.dataset.i],j=+b.dataset.o;box.dataset.done=1;answered++;if(j===s.ans)score++;
    let right='';$$('.opt',box).forEach((x,pos)=>{const k=+x.dataset.o;if(k===s.ans){x.classList.add('right');right=String.fromCharCode(65+pos)}else if(k===j)x.classList.add('wrong')});
    const w=$('.why',box);w.style.display='block';w.innerHTML=(j===s.ans?'答對了。':'答錯了，正解是 '+right+'。')+esc(s.why);upd()});
  return {refresh:again};
}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const LAWS=D.laws;
$('#h1').textContent=D.chapter+'｜'+D.title;
$('#intro').textContent=D.summary||'';
document.title=D.chapter+' '+D.title;
$('#foot').innerHTML='官方來源：'+LAWS.map(L=>esc(L.name)+'（'+esc(L.amended)+(L.kind==='press'?'發布':'修正')+'）<a href="'+esc(L.url)+'" target="_blank" rel="noopener">'+esc(L.url)+'</a>').join('<br>')+(D.scope?'<br>'+esc(D.scope):'')+'<br>條文原文取自官方網頁；「白話」「口訣」「情境題」為編寫者整理，不是法條。法規可能再修正，請以官方最新公告為準；本內容不是法律或投資意見。';
const TABS=[['read','條文速讀'],['table','對照表'],['cards','閃卡'],['quiz','情境題']];
const nav=$('#nav');
TABS.forEach(([id,name])=>{const b=document.createElement('button');b.textContent=name;b.setAttribute('role','tab');b.dataset.id=id;b.onclick=()=>show(id);nav.appendChild(b)});
let curTab='read';
function show(id,anchor){curTab=id;TABS.forEach(([t])=>$('#s-'+t).classList.toggle('on',t===id));$$('button',nav).forEach(b=>b.setAttribute('aria-selected',b.dataset.id===id));
  history.replaceState(null,'','#'+id+(anchor?'/'+anchor:''));
  if(anchor){const el=document.getElementById(anchor);if(el){const d=el.querySelector('details');el.scrollIntoView({block:'start'});el.classList.add('hl')}}else window.scrollTo(0,0)}
$('#s-read').innerHTML=(D.alerts||[]).map(a=>'<div class="banner"><b>'+esc(a.t)+'</b>'+esc(a.d)+'</div>').join('')+D.clauses.map(c=>{
  const off=c.official.map(p=>'<p>'+esc(p)+'</p>').join('');
  return '<div class="card" id="c'+esc(c.no)+'"><h3><span class="no">'+esc(lab(c.no))+'</span>'+esc(c.title)+'</h3>'
   +'<div class="pw"><span class="lab my">白話</span>'+fmt(c.plain)+'</div>'+factsT(c.facts)
   +(c.mnemonic?'<div class="mn"><span class="lab my">口訣</span>'+esc(c.mnemonic)+'</div>':'')
   +(c.tip?'<p><span class="lab hint">提醒</span>'+esc(c.tip)+'</p>':'')
   +(c.official.length?'<details><summary>展開官方條文原文</summary><div class="off"><span class="lab fact">原文</span>'+off+'</div></details>':'')+'</div>'}).join('');
$('#s-table').innerHTML=D.tables.map((t,i)=>'<h3 id="t'+i+'">'+esc(t.title)+'</h3><div class="tw"><table><thead><tr>'+t.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+t.rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>').join('');
const cardsAll=D.cards.map(c=>({key:'ch'+D.chNo+':'+c.id,ref:c.ref,front:c.front,back:c.back}));
const fl=Flash($('#s-cards'),()=>cardsAll);fl.refresh();
const qz=Quiz($('#s-quiz'),()=>D.scenarios,0);qz.refresh();
// 上下章
const N=D.nav||{};
function setLink(el,o,dir){if(o){el.href=o.file;el.textContent=dir==='p'?'← '+o.label:o.label+' →'}else{el.style.visibility='hidden'}}
setLink($('#prev'),N.prev,'p');setLink($('#next'),N.next,'n');
// 左右滑動：換分頁，到頭就換章
function step(d){const i=TABS.findIndex(t=>t[0]===curTab)+d;
  if(i<0){if(N.prev)location.href=N.prev.file+'#read';return}
  if(i>=TABS.length){if(N.next)location.href=N.next.file+'#read';return}
  show(TABS[i][0])}
let sx=0,sy=0,skip=false;
document.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;const el=e.target&&e.target.nodeType===1?e.target:(e.target&&e.target.parentElement);skip=!!(el&&el.closest('.tw,nav,input,.off'))},{passive:true});
document.addEventListener('touchend',e=>{if(skip)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>70&&Math.abs(dy)<45){step(dx<0?1:-1)}},{passive:true});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1)});
// 深層連結
function route(){const h=(location.hash||'#read').slice(1).split('/');show(TABS.some(t=>t[0]===h[0])?h[0]:'read',h[1]?decodeURIComponent(h[1]):null)}
window.addEventListener('hashchange',route);route();
</script></body></html>
