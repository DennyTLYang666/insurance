<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<title>外幣非投資型保險備考｜第六章 資格條件及注意事項</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--ink:#222;--sub:#666;--line:#e3e0d8;--brand:#1f5f8b;--brand2:#e8f1f7;--ok:#2e7d32;--okbg:#e8f5e9;--bad:#b3261e;--badbg:#fdecea;--warn:#8a5a00;--warnbg:#fff4de}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
header{background:var(--brand);color:#fff;padding:18px 16px 14px}
header h1{margin:0;font-size:20px;line-height:1.4}
header p{margin:6px 0 0;font-size:13px;opacity:.9}
.wrap{max-width:860px;margin:0 auto;padding:0 12px 60px}
.banner{background:var(--warnbg);color:var(--warn);border:1px solid #f0d9a8;border-radius:8px;padding:10px 12px;margin:12px 0;font-size:14px}
nav{position:sticky;top:0;background:var(--bg);z-index:5;display:flex;gap:6px;padding:10px 0;overflow-x:auto;border-bottom:1px solid var(--line)}
nav button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:15px;cursor:pointer;color:var(--ink)}
nav button[aria-selected="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
section{display:none;padding-top:14px}
section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 12px}
.card h3{margin:0 0 6px;font-size:17px}
.no{display:inline-block;background:var(--brand);color:#fff;border-radius:6px;padding:0 8px;margin-right:8px;font-size:14px}
.lab{display:inline-block;font-size:12px;border-radius:4px;padding:0 6px;margin-right:6px;vertical-align:1px}
.lab.fact{background:#e3f2e5;color:#1b5e20}
.lab.my{background:#e8eaf6;color:#283593}
.lab.hint{background:var(--warnbg);color:var(--warn)}
.mn{background:var(--brand2);border-radius:8px;padding:8px 10px;margin:8px 0}
details{margin:8px 0}
details summary{cursor:pointer;color:var(--brand);font-size:15px}
.off{border-left:3px solid var(--brand);padding:2px 0 2px 10px;margin:8px 0;font-size:15px;color:#333}
.off p{margin:4px 0}
table{border-collapse:collapse;width:100%;font-size:15px;background:#fff}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--brand2)}
.tw{overflow-x:auto;margin-bottom:16px}
.fc{min-height:210px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.fc .q{font-size:19px;font-weight:600}
.fc .a{font-size:16px;text-align:left;margin-top:8px}
.fc small{color:var(--sub)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.btn{border:1px solid var(--brand);background:#fff;color:var(--brand);border-radius:8px;padding:9px 16px;font-size:16px;cursor:pointer}
.btn.pri{background:var(--brand);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:var(--ok)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;margin:6px 0;font-size:16px;cursor:pointer}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.why{display:none;background:var(--brand2);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:15px}
.stat{color:var(--sub);font-size:14px}
footer{color:var(--sub);font-size:13px;margin-top:24px}
</style>
</head>

<script id="data" type="application/json">{"chapter": "第七章", "title": "投資型保險投資管理辦法", "laws": [{"name": "投資型保險投資管理辦法", "amended": "民國115年4月29日", "docno": "金管保壽字第11504910981號令", "url": "https://law.fsc.gov.tw/LawContent.aspx?id=FL006834", "source": "金融監督管理委員會主管法規共用系統", "retrieved": "2026-10-30"}], "alerts": [{"t": "版本與收錄範圍", "d": "官方現行版修正日為民國115年4月29日。本頁收錄第2、3、4、5、6、8、9、10、11、12、13、15、16、17、18、19、23、24、25、26、27條，原文已逐字比對。未收錄：第1、7、10-1、14、20、21、22、28、29條（以及第一章第10-1條的細節）。"}, {"t": "最容易混淆的三處", "d": "（1）股票只在第11條（全權決定運用），不在第10條。（2）第12條的八個「不得」。（3）第5、6條的「十五個工作日」申報與第16條的「至少五年」保存，不要和其他章節的期限互換。"}, {"t": "和筆記的差異", "d": "本頁與你的筆記相比，沒有發現數字衝突；但筆記是「節錄」，頁面收錄的是整部辦法的大多數條文，請以官方原文為準。"}], "clauses": [{"no": "2", "title": "契約要記載保護條文", "official": ["訂立投資型保險契約時，保險人就要保人或受益人投資權益之保護，應依本法及其他有關法令規定記載相關條文。"], "plain": "訂約時，為保護要保人或受益人的投資權益，要依保險法及其他法令記載相關條文。", "mnemonic": "", "tip": ""}, {"no": "3", "title": "重要事項告知書", "official": ["保險人銷售投資型保險商品時，應充分揭露相關資訊；於訂約時，應以重要事項告知書向要保人說明下列事項，並經其簽章：", "一、各項費用。", "二、投資標的及其可能風險。", "三、相關警語。", "四、其他經主管機關規定之事項。", "前項資訊揭露及銷售應遵循事項，由主管機關另定之。"], "plain": "訂約時要以重要事項告知書向要保人說明並經簽章：各項費用、投資標的及其可能風險、相關警語、其他規定事項。", "mnemonic": "四項「費、標、警、他」。", "tip": ""}, {"no": "4", "title": "專設帳簿", "official": ["保險人經營投資型保險之業務應專設帳簿，記載其投資資產之價值。", "前項專設帳簿應符合下列原則：", "一、專設帳簿之資產，應與保險人之其他資產分開設置，並單獨管理之。", "二、除本辦法另有規定外，保險人應依中華民國人壽保險商業同業公會（以下簡稱同業公會）報經主管機關備查之人壽保險業會計制度範本，定期對專設帳簿之資產加以評價，並依保險契約所約定之方式計算及通知要保人其於專設帳簿內受益之資產價值。", "三、專設帳簿資產之運用，應與要保人同意或指定之投資方式及投資標的相符。"], "plain": "投資型保險要專設帳簿記載投資資產價值。三原則：與其他資產分開設置並單獨管理；依公會會計制度範本定期評價，並依契約約定方式計算、通知要保人；資產運用要與要保人同意或指定的投資方式及標的相符。", "mnemonic": "三原則「分開、評價、相符」。", "tip": ""}, {"no": "5", "title": "運用與管理專設帳簿資產", "official": ["保險人運用與管理專設帳簿資產，以下列方式之一行之：", "一、保險人指派具有金融、證券或其他投資業務經驗之專業人員運用與管理專設帳簿之資產。但涉及由保險人全權決定運用於證券交易法第六條之有價證券者，應另依證券投資信託及顧問法申請兼營全權委託投資業務。", "二、非由保險人全權決定運用標的之投資型保險，保險人得委託經主管機關核准經營或兼營全權委託投資業務之事業代為運用與管理專設帳簿之資產者，該管理事業之選任，應依保險人內部所訂之委外代為資金管理處理程序及相關法令之規定辦理。保險人應向主管機關申報其所選任之管理事業，管理事業有變更者，應於變更後十五個工作日內向主管機關申報。", "保險人依前項規定運用專設帳簿之資產進行投資及交易，應作成書面紀錄，按月提出檢討報告，並應依法建檔保存。", "保險人依第一項規定運用與管理專設帳簿資產時，不得有下列情事：", "一、提供專設帳簿之資產做為擔保之用。", "二、將專設帳簿之資產借予他人。但主管機關另有規定者，不在此限。", "三、從事法令禁止投資之項目。"], "plain": "兩種方式：保險人自己指派專業人員運用；非全權決定的商品可委託經核准的全權委託投資事業。委託的管理事業要向主管機關申報，變更後 15 個工作日內申報。投資及交易要有書面紀錄，每月提出檢討報告。不得做三件事：提供資產擔保、借予他人、從事法令禁止的投資。", "mnemonic": "申報變更「十五個工作日」；檢討報告「按月」；不得「擔保、出借、禁投」。", "tip": ""}, {"no": "6", "title": "保管機構", "official": ["保險人應為要保人或受益人之利益管理專設帳簿之資產。", "保險人應將專設帳簿之資產交由保管機構保管，並應向主管機關申報其所選任之保管機構，保管機構有變更者，應於變更後十五個工作日內向主管機關申報。", "保險人與要保人締結第二章所定保險契約時，應提供委任保管契約內容，並依該保管契約內容將第一項專設帳簿之資產交由保管機構保管。保險人應向主管機關申報其所選任之保管機構，保管機構有變更者，應於變更後十五個工作日內向主管機關申報。", "前二項所稱保管機構，指經主管機關認可之信用評等機構評等達一定等級以上之金融機構。", "保險人依前條第一項第二款委託經主管機關核准兼營全權委託投資業務之信託業代為運用與管理專設帳簿之資產，並由該信託業自行保管資產者，準用第二項及第四項規定。"], "plain": "專設帳簿資產要交給保管機構，並向主管機關申報；保管機構變更後 15 個工作日內申報。保管機構是指經主管機關認可的信評機構評等達一定等級以上的金融機構。", "mnemonic": "「保管：申報、十五個工作日」。", "tip": ""}, {"no": "8", "title": "專設帳簿與一般帳簿間不得互相移轉", "official": ["置於專設帳簿之資產與保險人之一般帳簿資產間，不得互相出售、交換或移轉。但有下列情事之一者，不在此限：", "一、將一般帳簿資產轉入非由保險人全權決定運用標的之投資型保險專設帳簿做為其設立之用，或用於支應該轉入專設帳簿保單之正常運作。", "二、為保險成本或第三條訂定之各項費用必要之轉出。", "三、為維護要保人或受益人之利益並經主管機關核准。", "前項但書各款情形，除事先經主管機關核准者，得以符合第十條第一項規定之標的資產為移轉外，應以現金移轉為之。"], "plain": "專設帳簿資產和一般帳簿資產原則上不得互相出售、交換或移轉。三種例外：一般帳簿資產轉入做為設立或支應正常運作；為保險成本或第3條費用必要的轉出；為維護要保人或受益人利益並經主管機關核准。例外時原則上以現金移轉。", "mnemonic": "例外三種「設立、費用、利益」。", "tip": ""}, {"no": "9", "title": "善良管理人義務與破產追償", "official": ["保險人之董事、監察人、經理人及負責運用與管理專設帳簿資產之人，應盡善良管理人之注意，忠實執行專設帳簿投資管理業務，不得以職務上所知悉之消息，為專設帳簿保戶以外之人或自己從事投資相關之交易活動，或洩漏消息予他人。", "投資型保險契約所提供連結之投資標的發行或經理機構破產時，保險人應基於要保人、受益人之利益向該機構積極追償。"], "plain": "董事、監察人、經理人及運用管理專設帳簿資產的人，要盡善良管理人之注意，不得利用職務上消息為自己或保戶以外的人交易或洩漏消息。連結標的的發行或經理機構破產時，保險人要為要保人、受益人利益積極追償。", "mnemonic": "「發行或經理機構破產：保險人追償」。", "tip": "題目若把「保管」也放進破產追償，請回到條文：只有「發行或經理」機構。"}, {"no": "10", "title": "投資型保險可連結的標的（十二款）", "official": ["投資型保險契約所提供連結之投資標的及專設帳簿資產之運用，除要保人以保險契約約定委任保險人全權決定運用標的者外，以下列為限：", "一、銀行存款。", "二、證券投資信託基金受益憑證。", "三、境外基金。", "四、共同信託基金受益證券。", "五、依不動產證券化條例所發行之不動產投資信託受益證券或不動產資產信託受益證券。", "六、依金融資產證券化條例所發行之受益證券或資產基礎證券。", "七、各國中央政府發行之公債、國庫券。", "八、金融債券。", "九、公開發行之有擔保公司債，或經評等為相當等級以上之公司所發行之公司債，或外國證券集中交易市場、店頭市場交易之公司債。", "十、結構型商品。", "十一、美國聯邦國民抵押貸款協會、聯邦住宅抵押貸款公司及美國政府國民抵押貸款協會所發行或保證之不動產抵押債權證券。", "十二、其他經主管機關核准之投資標的。", "前項專設帳簿資產屬保險人之自有部位與保險人之其他投資合計，不得超過本法第一百四十六條至第一百四十六條之二、第一百四十六條之四、第一百四十六條之五及第一百四十六條之七所定限額。", "保險人依第五條第一項第二款委託經主管機關核准經營或兼營全權委託投資業務之事業代為運用與管理專設帳簿之資產者，其投資型保險契約所提供連結之投資標的及專設帳簿資產之運用，除第一項所列標的外，得為匯率避險目的，並依主管機關規定之範圍、條件及相關事項，從事與專設帳簿資產有關之貨幣相關衍生性金融商品交易。"], "plain": "非全權決定運用的投資型保險，連結標的以十二款為限：銀行存款、證券投資信託基金、境外基金、共同信託基金、不動產投資或資產信託受益證券、金融資產證券化商品、各國中央政府公債國庫券、金融債券、公司債、結構型商品、房利美等不動產抵押債權證券、其他核准標的。「公開發行的公司股票」不在這十二款裡。", "mnemonic": "十二款「存、基、境、共、不、資、公、金、司、結、抵、他」。", "tip": "「股票」只出現在第11條（全權決定運用）的範圍，不在第10條。"}, {"no": "11", "title": "保險人全權決定運用標的的範圍（十二款）", "official": ["保險人接受要保人以保險契約委任全權決定運用標的者，其運用範圍以下列為限：", "一、銀行存款。", "二、公債、國庫券。", "三、金融債券、可轉讓定期存單、銀行承兌匯票、金融機構保證商業本票。", "四、公開發行之公司股票。", "五、公開發行之有擔保公司債，或經評等為相當等級以上之公司所發行之公司債。", "六、證券投資信託基金受益憑證及共同信託基金受益證券。", "七、台灣存託憑證。", "八、依金融資產證券化條例發行之受益證券或資產基礎證券。", "九、依不動產證券化條例發行之不動產資產信託受益證券及不動產投資信託受益證券。", "十、外國有價證券。", "十一、證券相關商品。", "十二、其他經主管機關核准之標的。", "前項第十款所稱外國有價證券，以下列各款為限：", "一、外國中央政府發行之公債、國庫券。", "二、外國銀行發行之金融債券、可轉讓定期存單、浮動利率中期債券。", "三、外國證券集中交易市場、店頭市場交易之股票、公司債。", "四、境外基金。", "五、美國聯邦國民抵押貸款協會、聯邦住宅抵押貸款公司及美國政府國民抵押貸款協會所發行或保證之不動產抵押債權證券。"], "plain": "要保人以契約委任保險人全權決定運用標的時，範圍以十二款為限，其中包含公開發行公司股票、台灣存託憑證、外國有價證券、證券相關商品。外國有價證券限五類：外國中央政府公債國庫券、外國銀行金融債與可轉讓定期存單與浮動利率中期債券、外國集中市場或店頭市場的股票與公司債、境外基金、房利美等不動產抵押債權證券。", "mnemonic": "", "tip": "第10條（一般）與第11條（全權決定運用）範圍不同；「股票」只在第11條。"}, {"no": "12", "title": "全權決定運用時不得做的八件事", "official": ["保險人為前條之運用時，除主管機關另有規定外，不得有下列情事：", "一、辦理放款。", "二、與其他投資型保險專設帳簿投資資產或與保險人之一般帳簿資產為交易行為。但經由證券集中市場或證券商營業處所委託買賣成交，且非故意發生相對交易之結果者，不在此限。", "三、投資於保險人發行之股票或公司債。", "四、投資與保險人有利害關係之公司所發行之股票、公司債或金融債券。", "五、投資與保險人有利害關係之證券承銷商所承銷之有價證券。", "六、投資私募有價證券。", "七、從事證券信用交易。", "八、出借或借入有價證券。"], "plain": "全權決定運用時不得：辦理放款；與其他專設帳簿或一般帳簿資產交易（集中市場成交且非故意相對交易者除外）；投資保險人自己發行的股票或公司債；投資與保險人有利害關係公司的股票、公司債或金融債；投資有利害關係證券承銷商承銷的有價證券；投資私募有價證券；證券信用交易；出借或借入有價證券。", "mnemonic": "八不「放款、對作、自家、關係人、承銷、私募、信用、出借」。", "tip": ""}, {"no": "13", "title": "評等要求", "official": ["投資型保險之投資標的為第十條第一項第七款至第十一款所定標的者，應經主管機關認可之信用評等機構評等達一定等級以上。", "投資型保險之投資標的為第十一條第一項第三款、第五款及同條第二項第一款、第二款、第三款及第五款所定公債、債券或不動產抵押債權證券者，準用前項規定。"], "plain": "第10條第7款至第11款（公債、金融債、公司債、結構型商品、房利美等抵押債權證券）的標的，要經主管機關認可的信用評等機構評等達一定等級以上；第11條部分債券類標的準用。", "mnemonic": "評等範圍「第10條第7至11款」。", "tip": ""}, {"no": "15", "title": "評價", "official": ["專設帳簿資產應依投資型保險契約約定評價日之市價評價，並依相關法令編列資產明細。但保險人之自有部位及依保險契約約定由保險人部分承擔投資損益風險者，不在此限。"], "plain": "專設帳簿資產依契約約定評價日的市價評價，並編列資產明細；保險人自有部位及保險人部分承擔投資損益風險者除外。", "mnemonic": "評價「契約約定評價日、市價」。", "tip": ""}, {"no": "16", "title": "表決權的行使", "official": ["保險人行使投資型保險專設帳簿持有股票之投票表決權者，應依下列規定辦理：", "一、除法令另有規定外，應由保險人指派該事業人員為之。", "二、保險人行使表決權，應基於投資型保險保戶之最大利益，且不得直接或間接參與該股票發行公司經營或有不當之安排情事。", "三、保險人於出席投資型保險專設帳簿所持有股票之發行公司股東會前，應將行使表決權之評估分析作業，作成說明。", "四、保險人應將投資型保險專設帳簿所持有股票發行公司之股東會通知書及出席證登記管理，並應就出席股東會行使表決權，表決權行使之評估分析作業、決策程序及執行結果作成書面紀錄，循序編號建檔，至少保存五年。", "保險人出席投資型保險專設帳簿所持有證券投資信託基金受益憑證之受益人會議，應基於投資型保險保戶之最大利益行使表決權，並準用前項第三款及第四款之規定。"], "plain": "行使專設帳簿持股的表決權：由保險人指派該事業人員為之；基於保戶最大利益，不得參與發行公司經營或不當安排；出席前先將評估分析作成說明；相關紀錄循序編號建檔，至少保存 5 年。出席基金受益人會議也基於保戶最大利益，並準用第三、四款。", "mnemonic": "紀錄「循序編號、五年」。", "tip": ""}, {"no": "17", "title": "解散清算", "official": ["保險人解散清算時，專設帳簿之資產在清償因了結專設帳簿而生之費用及債務後，賸餘之財產，應按專設帳簿資產內保險人及要保人所有受益權價值之比例分派予保險人及要保人或受益人。"], "plain": "保險人解散清算時，專設帳簿資產先清償了結專設帳簿的費用與債務，剩餘財產依保險人及要保人所有受益權價值比例分派給保險人及要保人或受益人。", "mnemonic": "", "tip": ""}, {"no": "18", "title": "外幣收付的投資型保險", "official": ["訂立投資型保險契約時，保險人與要保人得約定保險費、保險給付、費用及其他款項收付之幣別，且不得於新臺幣與外幣間約定相互變換收付之幣別。但以外幣收付之投資型年金保險，於年金累積期間屆滿時將連結投資標的全部處分出售，並轉換為一般帳簿之即期年金保險者，得約定以新臺幣給付年金。", "保險人經營以外幣收付之投資型保險業務及依前項但書之規定辦理以新臺幣給付年金者，須分別經中央銀行之許可。", "以外幣收付之投資型保險契約，其專設帳簿資產，以投資外幣計價之投資標的為限；保險人並應與要保人事先約定收付方式，且以外匯存款戶存撥之。但有下列情形之一者，不在此限：", "一、依第一項但書規定辦理以新臺幣給付年金。", "二、保險人與要保人約定，於其他外幣保險契約所定生存保險金應給付日當日，以該生存保險金，抵繳相同幣別外幣保險契約之保險費，且該生存保險金之受益人，與所抵繳保險契約之要保人為同一人。", "以新臺幣收付之投資型保險契約，其結匯事宜應依中央銀行訂定之外匯收支或交易申報辦法等有關規定辦理。"], "plain": "外幣收付的投資型保險：不得在新臺幣與外幣間約定互換收付幣別；例外是外幣投資型年金在累積期間屆滿、全部處分連結標的並轉為一般帳簿即期年金時，可約定以新臺幣給付年金。經營外幣投資型業務及這種新臺幣給付年金，要分別經央行許可。專設帳簿資產限投資外幣計價標的；款項收付走外匯存款戶（有兩個例外）。新臺幣收付的投資型保險，結匯依申報辦法。", "mnemonic": "央行許可「外幣業務」「新臺幣給付年金」各一次；專設帳簿「外幣計價標的為限」。", "tip": "這一條和第六章（外幣非投資型）第3點的「外匯存款戶」「抵繳」規定相近，但適用的是外幣「投資型」保險。"}, {"no": "19", "title": "全權決定運用的資格（五項）", "official": ["保險人銷售由其全權決定運用標的之投資型保險，應符合下列資格條件：", "一、最近一年之自有資本與風險資本之比率符合本法第一百四十三條之四第一項之適足比率。", "二、最近一年內未有遭主管機關重大裁罰及處分者，或受處分情事已獲具體改善經主管機關認可者。", "三、國外投資部分已採用計算風險值評估風險，並每週至少控管乙次。", "四、董事會中設有風險控管委員會或於公司內部設置風險控管部門及風控長或職務相當之人，並實際負責公司整體風險控管。", "五、最近一年公平待客原則評核結果為人身保險業前百分之八十。但提出合理說明並經主管機關核准者，不在此限。", "前項第二款所稱重大裁罰及處分，指金融監督管理委員會處理違反金融法令重大裁罰措施之對外公布說明辦法第二條所定各款之情事。", "第一項第三款所稱之風險值，係指按週為基礎、樣本期間至少三年，或按日為基礎、樣本期間至少一年，樣本之資料至少每週更新一次，以至少百分之九十九的信賴水準，計算十個交易日之風險值，且須每月進行回溯測試。", "保險人依證券投資信託及顧問法申請兼營全權委託投資業務前，應先經主管機關認可其符合第一項所定資格。"], "plain": "全權決定運用的五項資格：自有資本與風險資本比率符合適足比率；最近一年無重大裁罰（或已改善）；國外投資採風險值並每週控管；有風險控管組織；公平待客評核前 80%。條件與第六章第二點相近（多了第一項的適足比率，沒有第六章的某些措辭）。", "mnemonic": "五項「資、罰、險、控、客」。", "tip": ""}, {"no": "23", "title": "全委契約轉換", "official": ["全委投資型保險契約之要保人得向保險人申請轉換為不同投資方針之全委投資型保險契約，且除因險種、保險期間或保險金額改變所致危險增加之情形外，保險人不得拒絕。", "保險人受理契約轉換之申請，應訂定契約轉換及紛爭調處辦法並公告之；", "如有收取契約轉換費用者，保險人於受理轉換申請時，應事先告知要保人。"], "plain": "全委投資型保險的要保人可申請轉換為不同投資方針的全委契約；除因險種、期間或保險金額改變致危險增加外，保險人不得拒絕。保險人要訂定契約轉換及紛爭調處辦法並公告；收轉換費用要事先告知。", "mnemonic": "「轉換：不得拒絕（除危險增加）」。", "tip": ""}, {"no": "24", "title": "法令變更的通知", "official": ["全委投資型保險契約於簽訂後，因法令變更致其投資或交易範圍有增減時，保險人應以不低於六十日之期間內通知要保人。", "要保人於前項期間內表示異議而向保險人申請終止保險契約者，保險人不得向要保人收取任何解約費用。"], "plain": "簽約後因法令變更致投資或交易範圍增減，保險人要以不低於 60 日的期間通知要保人；要保人在期間內異議並申請終止契約，保險人不得收取任何解約費用。", "mnemonic": "「六十日、免解約費」。", "tip": ""}, {"no": "25", "title": "會計制度", "official": ["全委投資型保險專設帳簿之會計制度應依一般公認會計原則、同業公會釐訂之規範及有關法令之規定辦理。"], "plain": "全委專設帳簿的會計制度，依一般公認會計原則、公會釐訂的規範及有關法令辦理。", "mnemonic": "", "tip": ""}, {"no": "26", "title": "每營業日計算保單帳戶價值", "official": ["除保險契約另有約定外，保險人應於每一營業日就各全委投資型保險專設帳簿分別計算其每一要保人之保單帳戶價值。"], "plain": "除契約另有約定，保險人每一營業日要分別計算每一要保人的保單帳戶價值。", "mnemonic": "「每一營業日」。", "tip": ""}, {"no": "27", "title": "帳簿與年度決算報告", "official": ["保險人應就各全委投資型保險專設帳簿分別造具帳簿，載明該全委投資型保險專設帳簿之處理狀況，並定期編製運用狀況報告書。", "保險人應於會計年度終了後四個月內，就各全委投資型保險專設帳簿分別編具全委投資型保險專設帳簿資產年度決算報告，經會計師查核簽證後函報主管機關備查，並公告之。"], "plain": "每一全委專設帳簿要分別造具帳簿並定期編製運用狀況報告書；會計年度終了後 4 個月內編具年度決算報告，經會計師查核簽證後函報主管機關備查並公告。", "mnemonic": "「四個月、會計師簽證、備查並公告」。", "tip": ""}], "tables": [{"title": "第10條 vs 第11條：誰可以買股票？", "head": ["", "第10條（一般投資型保險）", "第11條（保險人全權決定運用）"], "rows": [["適用情形", "除全權決定運用外的連結標的與專設帳簿資產", "要保人以契約委任保險人全權決定運用標的"], ["公開發行公司股票", "沒有", "有（第4款）"], ["台灣存託憑證", "沒有", "有（第7款）"], ["外國有價證券", "境外基金、各國中央政府公債國庫券、外國集中市場公司債等分項列於各款", "限五類，第10款另列"], ["證券相關商品", "沒有", "有（第11款）"], ["結構型商品", "有（第10款）", "沒有列舉"]]}, {"title": "第12條：全權決定運用時不得做的八件事", "head": ["款", "不得"], "rows": [["一", "辦理放款"], ["二", "與其他專設帳簿或一般帳簿資產交易（集中市場成交且非故意相對交易者除外）"], ["三", "投資於保險人發行的股票或公司債"], ["四", "投資與保險人有利害關係公司的股票、公司債或金融債券"], ["五", "投資與保險人有利害關係的證券承銷商所承銷的有價證券"], ["六", "投資私募有價證券"], ["七", "證券信用交易"], ["八", "出借或借入有價證券"]]}, {"title": "數字與期限", "head": ["項目", "規定", "條文"], "rows": [["變更管理事業或保管機構", "變更後 15 個工作日內向主管機關申報", "第5、6條"], ["投資及交易檢討報告", "按月提出", "第5條"], ["表決權行使紀錄", "循序編號建檔，至少保存 5 年", "第16條"], ["法令變更通知要保人", "不低於 60 日", "第24條"], ["計算保單帳戶價值", "每一營業日", "第26條"], ["年度決算報告", "會計年度終了後 4 個月內", "第27條"], ["全委資格：公平待客評核", "前 80%", "第19條"], ["全委資格：風險值", "99%、10 個交易日、每月回溯測試", "第19條"]]}, {"title": "專設帳簿與一般帳簿移轉的三種例外（第8條）", "head": ["款", "情形"], "rows": [["一", "一般帳簿資產轉入專設帳簿，做為設立之用，或支應正常運作"], ["二", "為保險成本或第3條訂定的各項費用必要之轉出"], ["三", "為維護要保人或受益人利益並經主管機關核准"]]}], "scenarios": [{"ref": "8", "q": "某保險公司想把專設帳簿的資產出售給一般帳簿，沒有符合任何例外。依第8條，是否可以？", "opts": ["可以，雙方帳簿都是公司的", "原則上不得互相出售、交換或移轉", "可以，但要向央行申請", "可以，只要用現金"], "ans": 1, "why": "第8條：置於專設帳簿的資產與一般帳簿資產間，不得互相出售、交換或移轉，三種但書情形除外。"}, {"ref": "6", "q": "保險公司變更了專設帳簿資產的保管機構。依第6條，應如何處理？", "opts": ["變更後 15 個工作日內向主管機關申報", "變更前 30 日向壽險公會備查", "不需要申報", "變更後 3 個月內向央行申報"], "ans": 0, "why": "第6條第2項：保管機構有變更者，應於變更後十五個工作日內向主管機關申報。"}, {"ref": "23", "q": "某全委投資型保險的要保人申請轉換為不同投資方針的全委契約，沒有險種、期間、保險金額改變致危險增加的情形。依第23條，保險人？", "opts": ["可以任意拒絕", "不得拒絕", "須經主管機關核准才能接受", "須先終止原契約"], "ans": 1, "why": "第23條第1項：除因險種、保險期間或保險金額改變所致危險增加之情形外，保險人不得拒絕。"}, {"ref": "24", "q": "全委投資型保險契約簽訂後，因法令變更使投資範圍增減，保險人通知要保人的期間，以及要保人異議終止契約時的解約費用，依第24條是？", "opts": ["不低於 60 日；不得收取任何解約費用", "不超過 30 日；可收取一般解約費用", "不低於 90 日；減半收取", "不超過 60 日；可收取手續費"], "ans": 0, "why": "第24條：以不低於六十日之期間內通知要保人；要保人在期間內表示異議並申請終止契約者，保險人不得向要保人收取任何解約費用。"}, {"ref": "27", "q": "保險公司應於何時內編具全委投資型專設帳簿的資產年度決算報告？", "opts": ["會計年度終了後 1 個月內", "會計年度終了後 4 個月內", "會計年度終了後 6 個月內", "會計年度終了前"], "ans": 1, "why": "第27條第2項：應於會計年度終了後四個月內編具，並經會計師查核簽證後函報主管機關備查，並公告之。"}, {"ref": "12", "q": "保險人全權決定運用專設帳簿資產時，下列哪一項是第12條「不得」做的？", "opts": ["投資公開發行公司股票", "投資私募有價證券", "投資台灣存託憑證", "投資證券投資信託基金"], "ans": 1, "why": "第12條第6款：不得投資私募有價證券。公開發行公司股票、台灣存託憑證、證券投資信託基金都在第11條範圍內。"}, {"ref": "16", "q": "保險人行使專設帳簿持有股票的表決權，相關的決策與執行紀錄應保存多久？", "opts": ["至少 1 年", "至少 3 年", "至少 5 年", "至少 10 年"], "ans": 2, "why": "第16條第1項第4款：循序編號建檔，至少保存五年。"}, {"ref": "10", "q": "下列哪一項「不在」第10條所列的投資型保險連結標的內？", "opts": ["證券投資信託基金受益憑證", "結構型商品", "公開發行之公司股票", "金融債券"], "ans": 2, "why": "第10條第1項十二款沒有列公開發行公司股票；股票只在第11條（全權決定運用）範圍內。"}, {"ref": "18", "q": "外幣收付的投資型保險，其專設帳簿資產可以怎麼投資？", "opts": ["任何幣別都可以", "以投資外幣計價的投資標的為限", "只能投資新臺幣標的", "只能投資銀行存款"], "ans": 1, "why": "第18條第3項：以外幣收付之投資型保險契約，其專設帳簿資產，以投資外幣計價之投資標的為限。"}, {"ref": "9", "q": "投資型保險連結的投資標的，其發行或經理機構破產了。依第9條，保險人應？", "opts": ["不必處理", "基於要保人、受益人之利益向該機構積極追償", "由要保人自行追償", "向主管機關申請補貼"], "ans": 1, "why": "第9條第2項：保險人應基於要保人、受益人之利益向該機構積極追償。"}], "watch": [{"t": "本頁未收錄的條文", "d": "第1、7、10-1、14、20、21、22、28、29條沒有收錄。其中第14條說明各種投資標的（基金、結構型商品等）的定義與核准要件，若考題問到請以官方條文為準。"}, {"t": "相關的另一份文件", "d": "投資型保險資訊揭露應遵循事項（第3條第2項所指的另定規範）本頁沒有收錄。"}, {"t": "公開發佈前的風險", "d": "本頁定位為內部教學。要對外公開，涉及保險廣告與招攬規範與罰則，須先查證並依公司規定審核；此部分尚未查證。"}], "cards": [{"id": 0, "ref": "3", "front": "重要事項告知書要說明哪些事項？", "back": "各項費用；投資標的及其可能風險；相關警語；其他經主管機關規定的事項，並經要保人簽章。"}, {"id": 1, "ref": "4", "front": "專設帳簿的三原則？", "back": "資產與保險人其他資產分開設置並單獨管理；依公會會計制度範本定期評價並依契約通知要保人；資產運用與要保人同意或指定的方式及標的相符。"}, {"id": 2, "ref": "5", "front": "委託的管理事業有變更，多久要申報？", "back": "變更後 15 個工作日內向主管機關申報。"}, {"id": 3, "ref": "5", "front": "專設帳簿資產不得做哪三件事？", "back": "提供做為擔保之用；借予他人（主管機關另有規定除外）；從事法令禁止投資的項目。"}, {"id": 4, "ref": "5", "front": "投資及交易的書面紀錄與檢討報告頻率？", "back": "作成書面紀錄，按月提出檢討報告，並依法建檔保存。"}, {"id": 5, "ref": "6", "front": "保管機構變更要怎麼辦？", "back": "變更後 15 個工作日內向主管機關申報。"}, {"id": 6, "ref": "8", "front": "專設帳簿與一般帳簿資產原則上可以互相移轉嗎？例外？", "back": "不得互相出售、交換或移轉；例外三種：設立或正常運作、保險成本及費用必要轉出、維護要保人或受益人利益並經核准。"}, {"id": 7, "ref": "9", "front": "連結標的的發行或經理機構破產時，保險人要做什麼？", "back": "基於要保人、受益人之利益向該機構積極追償。"}, {"id": 8, "ref": "10", "front": "第10條連結標的共幾款？", "back": "十二款（含其他經主管機關核准的投資標的）。"}, {"id": 9, "ref": "10", "front": "「公開發行公司股票」在第10條嗎？", "back": "不在；股票只在第11條（全權決定運用）的範圍。"}, {"id": 10, "ref": "11", "front": "第11條全權決定運用的範圍共幾款？外國有價證券有幾類？", "back": "十二款；外國有價證券限五類。"}, {"id": 11, "ref": "12", "front": "第12條全權決定運用時不得做幾件事？", "back": "八件。"}, {"id": 12, "ref": "13", "front": "哪些標的要求信用評等達一定等級？", "back": "第10條第1項第7款至第11款（公債、金融債券、公司債、結構型商品、房利美等抵押債權證券）；第11條部分債券類準用。"}, {"id": 13, "ref": "16", "front": "表決權行使的相關紀錄要保存多久？", "back": "至少 5 年，循序編號建檔。"}, {"id": 14, "ref": "17", "front": "保險人解散清算，專設帳簿剩餘財產如何分派？", "back": "按專設帳簿資產內保險人及要保人所有受益權價值的比例，分派給保險人及要保人或受益人。"}, {"id": 15, "ref": "18", "front": "外幣收付的投資型保險，可以約定新臺幣與外幣互換收付幣別嗎？例外？", "back": "不得；例外是外幣投資型年金於累積期間屆滿、全部處分連結標的並轉為一般帳簿即期年金時，可約定以新臺幣給付年金。"}, {"id": 16, "ref": "18", "front": "經營外幣投資型保險業務，須經誰許可？", "back": "中央銀行（以新臺幣給付年金的情形也要另外許可）。"}, {"id": 17, "ref": "18", "front": "外幣收付的投資型保險，專設帳簿資產可投資什麼？", "back": "以投資外幣計價的投資標的為限。"}, {"id": 18, "ref": "19", "front": "全權決定運用的五項資格？", "back": "自有資本與風險資本比率符合適足比率；最近一年無重大裁罰；國外投資採風險值並每週控管；有風險控管組織；公平待客評核前 80%。"}, {"id": 19, "ref": "23", "front": "全委契約轉換，保險人可以拒絕嗎？", "back": "不得拒絕，除非因險種、期間或保險金額改變致危險增加。"}, {"id": 20, "ref": "24", "front": "簽約後因法令變更致投資範圍增減，通知期間？", "back": "不低於 60 日；要保人異議並申請終止時，不得收取任何解約費用。"}, {"id": 21, "ref": "26", "front": "保單帳戶價值多久計算一次？", "back": "除契約另有約定，每一營業日。"}, {"id": 22, "ref": "27", "front": "全委專設帳簿的年度決算報告，何時內編具、怎麼處理？", "back": "會計年度終了後 4 個月內，經會計師查核簽證後函報主管機關備查並公告。"}]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LAWS = D.laws || [D.law];
const lab = x => /^[一二三四五六七八九十]+(之[一二三四五六七八九十]+)?$/.test(x) ? '第'+x+'點' : /^[0-9]+(-[0-9]+)?$/.test(x) ? '第'+x+'條' : x;
$('#h1').textContent = D.chapter + '｜' + D.title;
$('#meta').textContent = '依據：' + LAWS.map(L=>'《'+L.name+'》'+L.amended+(L.kind==='press'?'發布':'修正')+(L.docno?'（'+L.docno+'）':'')).join('；');
$('#banner').innerHTML = '<b>使用提醒</b>：條文原文取自官方網頁，逐字比對相符；「白話」「口訣」「情境題」為編寫者自行撰寫，不是法條。內部教學用，法規以官方最新公告為準，並非法律或投資意見。';
$('#foot').innerHTML = '官方來源：' + LAWS.map(L=>esc(L.name)+' <a href="'+esc(L.url)+'" target="_blank" rel="noopener">'+esc(L.url)+'</a>（'+esc(L.source)+'，擷取日 '+esc(L.retrieved)+'）').join('<br>') + '<br>法規可能再修正，使用前請重新確認。';

// 簡易儲存（瀏覽器儲存可能失敗，失敗就只留在記憶體）
const mem = {};
const store = {get(k){try{const v=localStorage.getItem(k);return v===null?mem[k]:v}catch(e){return mem[k]}},set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}};

const TABS=[['read','條文速讀'],['table','對照表'],['cards','閃卡'],['quiz','情境題'],['watch','待查證／風險']];
const nav=$('#nav');
TABS.forEach(([id,name],i)=>{const b=document.createElement('button');b.textContent=name;b.setAttribute('role','tab');b.dataset.id=id;b.onclick=()=>show(id);nav.appendChild(b)});
function show(id){TABS.forEach(([t])=>{$('#s-'+t).classList.toggle('on',t===id)});nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b.dataset.id===id));window.scrollTo(0,0)}

// 條文速讀
$('#s-read').innerHTML = (D.alerts||[]).map(a=>'<div class="banner"><b>'+esc(a.t)+'</b>：'+esc(a.d)+'</div>').join('') + D.clauses.map(c=>{
  const off = c.official.map(p=>'<p>'+esc(p)+'</p>').join('');
  return '<div class="card" id="c'+esc(c.no)+'"><h3><span class="no">'+esc(lab(c.no))+'</span>'+esc(c.title)+'</h3>'
   +'<p><span class="lab my">白話</span>'+esc(c.plain)+'</p>'
   +(c.mnemonic?'<div class="mn"><span class="lab my">口訣</span>'+esc(c.mnemonic)+'</div>':'')
   +(c.tip?'<p><span class="lab hint">提醒</span>'+esc(c.tip)+'</p>':'')
   +(c.official.length?'<details><summary>展開官方條文原文</summary><div class="off"><span class="lab fact">原文</span>'+off+'</div></details>':'<p class="stat">本頁未逐字收錄這一條的原文，數字取自官方現行條文，請對照頁尾的官方連結。</p>')+'</div>';
}).join('');

// 對照表
$('#s-table').innerHTML = D.tables.map(t=>'<h3>'+esc(t.title)+'</h3><div class="tw"><table><thead><tr>'+t.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+t.rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>').join('');

// 閃卡（簡化版間隔重複：答對升一格，答錯回到第 0 格；0~2 格優先出現，3 格視為熟練）
const KEY='twlife_ch06_boxes_v1';
let boxes={}; try{boxes=JSON.parse(store.get(KEY)||'{}')}catch(e){boxes={}}
let queue=[],cur=null,flipped=false;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function buildQueue(){queue=shuffle(D.cards.filter(c=>(boxes[c.id]||0)<3).map(c=>c.id)).sort((a,b)=>(boxes[a]||0)-(boxes[b]||0))}
function save(){store.set(KEY,JSON.stringify(boxes))}
function renderCards(){
  const done=D.cards.filter(c=>(boxes[c.id]||0)>=3).length, n=D.cards.length;
  let h='<div class="stat">已熟練 '+done+' / '+n+' 張（答對 3 次視為熟練；進度存在這個瀏覽器）</div><div class="bar"><i style="width:'+(done/n*100)+'%"></i></div>';
  if(!queue.length){h+='<div class="card"><h3>全部熟練了</h3><p>可以回到「情境題」練習活用，或重設後再來一輪。</p></div><div class="row"><button class="btn" id="reset">重設進度</button></div>';$('#s-cards').innerHTML=h;$('#reset').onclick=()=>{boxes={};save();buildQueue();renderCards()};return}
  cur=D.cards.find(c=>c.id===queue[0]);
  h+='<div class="card fc" id="fc" tabindex="0" role="button" aria-label="翻面"><small>'+esc(lab(cur.ref))+'｜剩 '+queue.length+' 張</small><div class="q">'+esc(cur.front)+'</div>'+(flipped?'<div class="a"><span class="lab fact">答案</span>'+esc(cur.back)+'</div>':'<small>點一下翻面</small>')+'</div>';
  h+=flipped?'<div class="row"><button class="btn bad" id="no">還不熟</button><button class="btn ok" id="yes">會了</button></div>':'';
  h+='<div class="row"><button class="btn" id="reset">重設進度</button></div>';
  $('#s-cards').innerHTML=h;
  const fc=$('#fc'); fc.onclick=()=>{flipped=!flipped;renderCards()}; fc.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fc.click()}};
  if(flipped){$('#yes').onclick=()=>grade(true);$('#no').onclick=()=>grade(false)}
  $('#reset').onclick=()=>{if(confirm('確定要清除閃卡進度？')){boxes={};save();flipped=false;buildQueue();renderCards()}};
}
function grade(ok){const id=cur.id;boxes[id]=ok?Math.min(3,(boxes[id]||0)+1):0;save();queue.shift();if(!ok||boxes[id]<3){queue.splice(Math.min(queue.length,ok?6:3),0,id)}flipped=false;renderCards()}

// 情境題（每次載入都會隨機打亂選項順序，避免記答案位置）
let score=0,answered=0;
function renderQuiz(){
  const perms=D.scenarios.map(s=>shuffle(s.opts.map((_,k)=>k)));
  $('#s-quiz').innerHTML='<div class="stat" id="sc">已作答 0 / '+D.scenarios.length+'，答對 0 題</div>'+D.scenarios.map((s,i)=>'<div class="card" id="q'+i+'"><b>'+(i+1)+'. </b><span class="lab my">'+esc(lab(s.ref))+'</span>'+esc(s.q)+perms[i].map((k,pos)=>'<button class="opt" data-q="'+i+'" data-o="'+k+'">'+String.fromCharCode(65+pos)+'. '+esc(s.opts[k])+'</button>').join('')+'<div class="why" id="w'+i+'"></div></div>').join('');
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.q,j=+b.dataset.o,s=D.scenarios[i],box=$('#q'+i);
    if(box.dataset.done)return;box.dataset.done=1;answered++;if(j===s.ans)score++;
    let right='';
    box.querySelectorAll('.opt').forEach((x,pos)=>{const k=+x.dataset.o;if(k===s.ans){x.classList.add('right');right=String.fromCharCode(65+pos)}else if(k===j)x.classList.add('wrong')});
    const w=$('#w'+i);w.style.display='block';w.innerHTML=(j===s.ans?'答對了。':'答錯了，正解是 '+right+'。')+esc(s.why);
    $('#sc').textContent='已作答 '+answered+' / '+D.scenarios.length+'，答對 '+score+' 題';
  });
}

// 待查證
$('#s-watch').innerHTML='<div class="banner">以下是目前<b>尚未查證</b>或可能造成誤用的地方，請不要當成結論使用。</div>'+D.watch.map(w=>'<div class="card"><h3>'+esc(w.t)+'</h3><p>'+esc(w.d)+'</p></div>').join('');

buildQueue();renderCards();renderQuiz();show('read');
</script>
