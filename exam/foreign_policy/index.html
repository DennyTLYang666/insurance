": "保險三大原則（概念整理） 大數法則：個人何時死亡不可知，但全體人口每年各年齡的死亡人數、比率大致穩定，所以保險公司可以預估。公平的危險分攤：依性別、年齡別、死亡率收保費，風險高的人保費較高。收支相等原則：全體保戶繳入的保費總額，與公司給付給全體受益人的保險金總額，相等計算。 「大數、公平、收支相等」 三個原則的名稱常被互換：「依年齡性別死亡率收費」是公平的危險分攤，「保費總額＝保險金總額」是收支相等。", "anchor": "read/c保險原則"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "clause", "title": "第13條 保險法｜保險怎麼分類", "text": "保險法｜保險怎麼分類 保險分為財產保險與人身保險兩大類。財產保險有火災、海上、陸空、責任、保證保險及經核准的其他保險；人身保險有人壽、健康、傷害、年金四種。責任保險是財產保險，不是人身保險。 「財產：火海陸責保；人身：壽健傷年」 題目常問「人身保險包括哪些」，選項會混入責任保險。 保險分為財產保險及人身保險。 財產保險，包括火災保險、海上保險、陸空保險、責任保險、保證保險及經主管機關核准之其他保險。 人身保險，包括人壽保險、健康保險、傷害保險及年金保險。", "anchor": "read/c13"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "clause", "title": "壽險種類 壽險、萬能、養老、投資型（概念整理）", "text": "壽險、萬能、養老、投資型（概念整理） 依保險事故，壽險分生存保險、死亡保險、生死合險三種（主管機關的商品審查注意事項也用這三種名稱）。萬能保險：保費扣除附加費用後，依宣告利率計算保單價值。養老保險：定期保險＋生存保險，口訣「定存」。投資型保險：結合保險與投資，基本性質仍是保險，受保險法規規範。依期間，保險分定期保險與終身保險。 「養老＝定期＋生存（定存）」 「生死合險」是死亡或屆滿仍生存都給付；單純死亡保險只給身故。", "anchor": "read/c壽險種類"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "clause", "title": "年金分類 年金保險怎麼分（概念整理）", "text": "年金保險怎麼分（概念整理） 年金保險人在被保險人生存期間或特定期間內，依契約一次或分期給付一定金額（保險法第135-1條）。分類方式：依給付始期分即期、遞延；依給付方式分終身年金、定期生存年金、附保證期間年金、附保證金額年金；依受領人數分個人、多數受領人、團體；多數受領人又分連生共存、最後生存者、連生遺族年金。  不要把「定期生存年金」放進「多數受領人年金」的分類裡，兩者是不同的分類軸。", "anchor": "read/c年金分類"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "clause", "title": "第135-1條 保險法｜年金保險的定義", "text": "保險法｜年金保險的定義 年金保險是：保險人在被保險人生存期間或特定期間內，依照契約一次或分期給付一定金額。   年金保險人於被保險人生存期間或特定期間內，依照契約負一次或分期給付一定金額之責。", "anchor": "read/c135-1"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "clause", "title": "第119條 保險法｜解約金", "text": "保險法｜解約金 要保人終止契約、而且保險費已付足一年以上，保險人要在接到通知後一個月內給付解約金；金額不得少於要保人應得保單價值準備金的四分之三。解約金的條件與金額，要寫在保險契約裡。 「付足一年、一個月內、不少於四分之三」 是「不得少於」四分之三，不是「得少於」。 要保人終止保險契約，而保險費已付足一年以上者，保險人應於接到通知後一個月內償付解約金；其金額不得少於要保人應得保單價值準備金之四分之三。 償付解約金之條件及金額，應載明於保險契約。", "anchor": "read/c119"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "clause", "title": "第123條 保險法｜破產時的保護", "text": "保險法｜破產時的保護 保險人破產時，受益人對保險人的債權，按保單價值準備金依訂約時的保險費率比例計算。要保人破產時，契約訂有受益人的，仍為受益人的利益而存在。投資型保險契約的投資資產，只有該投資型保險的受益人可以主張，別人不能請求扣押或行使其他權利。   保險人破產時，受益人對於保險人得請求之保險金額之債權，以其保單價值準備金按訂約時之保險費率比例計算之。要保人破產時，保險契約訂有受益人者，仍為受益人之利益而存在。 投資型保險契約之投資資產，非各該投資型保險之受益人不得主張，亦不得請求扣押或行使其他權利。", "anchor": "read/c123"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "clause", "title": "第124條 保險法｜優先受償", "text": "保險法｜優先受償 人壽保險的要保人、被保險人、受益人，對被保險人的保單價值準備金，有優先受償的權利。   人壽保險之要保人、被保險人、受益人，對於被保險人之保單價值準備金，有優先受償之權。", "anchor": "read/c124"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "clause", "title": "第138條 保險法｜兼營與外匯業務", "text": "保險法｜兼營與外匯業務 財產保險業只能做財產保險、人身保險業只能做人身保險，同一家保險業不得兼營；但財產保險業經核准，可以經營傷害保險及健康保險。保險業不得兼營保險法以外的業務，但經核准辦理其他與保險有關業務者除外；這類業務涉及外匯業務，要經中央銀行許可。 「財產不兼人身；外匯要央行許可」 這是為什麼保險公司辦外幣保單，要先取得央行許可（第2章）。 財產保險業經營財產保險，人身保險業經營人身保險，同一保險業不得兼營財產保險及人身保險業務。但財產保險業經主管機關核准經營傷害保險及健康保險者，不在此限。 財產保險業依前項但書規定經營傷害保險及健康保險業務應具備之條件、業務範圍、申請核准應檢附之文件及其他應遵行事項之辦法，由主管機關定之。 保險業不得兼營本法規定以外之業務。但經主管機關核准辦理其他與保險有關業務者，不在此限。 保險業辦理前項與保險有關業務，涉及外匯業務之經營者，須經中央銀行之許可。 保險合作社不得經營非社員之業務。", "anchor": "read/c138"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "clause", "title": "第145條 保險法｜準備金的提存", "text": "保險法｜準備金的提存 保險業營業年度屆滿時，要分保險種類計算應提存的各種準備金，記載於特設的帳簿；提存比率、計算方式等，由主管機關訂辦法（保險業各種準備金提存辦法）。   保險業於營業年度屆滿時，應分別保險種類，計算其應提存之各種準備金，記載於特設之帳簿。 前項所稱各種準備金之提存比率、計算方式及其他應遵行事項之辦法，由主管機關定之。", "anchor": "read/c145"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "clause", "title": "第146-3條 保險法｜放款限制", "text": "保險法｜放款限制 保險業放款只限四種：有銀行或信用保證機構保證的、以動產或不動產為擔保的、以合格有價證券為質的、人壽保險業以自己簽發的保單為質的（保單質借）。前三種：每一單位放款不得超過資金 5%，放款總額不得超過資金 35%。 「單一 5%、總額 35%」 保單質借（第四款）不在這個 5%、35% 限制裡。 保險業辦理放款，以下列各款為限： 一、銀行或主管機關認可之信用保證機構提供保證之放款。 二、以動產或不動產為擔保之放款。 三、以合於第一百四十六條之一之有價證券為質之放款。 四、人壽保險業以各該保險業所簽發之人壽保險單為質之放款。 前項第一款至第三款放款，每一單位放款金額不得超過該保險業資金百分之五；其放款總額，不得超過該保險業資金百分之三十五。 保險業依第一項第一款、第二款及第三款對其負責人、職員或主要股東，或對與其負責人或辦理授信之職員有利害關係者，所為之擔保放款，應有十足擔保，其條件不得優於其他同類放款對象，如放款達主管機關規定金額以上者，並應經三分之二以上董事之出席及出席董事四分之三以上同意；其利害關係人之範圍、限額、放款總餘額及其他應遵行事項之辦法，由主管機關定之。 保險業依第一百四十六條之一第一項第三款及第四款對每一公司有價證券之投資與依第一項第三款以該公司發行之有價證券為質之放款，合併計算不得超過其資金百分之十及該發行有價證券之公司業主權益百分之十。", "anchor": "read/c146-3"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "clause", "title": "第146-4條 保險法｜國外投資範圍與上限", "text": "保險法｜國外投資範圍與上限 國外投資只限四種：外匯存款、國外有價證券、國外保險相關事業、其他經核准的國外投資。總額由主管機關視各公司經營情況核定，最高不得超過資金 45%。但四種金額不計入國外投資限額：經核准銷售外幣收付非投資型人身保險商品並核准不計入的金額、投資國內上市櫃外幣計價股權或債券憑證的金額、經核准設立或投資國外保險相關事業並核准不計入的金額、其他經核准的項目。 「最高 45%（資金）；四種可不計入」 45% 是「資金」的 45%，不是業主權益。外幣保單的準備金運用額度另見第5章第15-1、15-2條。 保險業資金辦理國外投資，以下列各款為限： 一、外匯存款。 二、國外有價證券。 三、設立或投資國外保險公司、保險代理人公司、保險經紀人公司或其他經主管機關核准之保險相關事業。 四、其他經主管機關核准之國外投資。 保險業資金依前項規定辦理國外投資總額，由主管機關視各保險業之經營情況核定之，最高不得超過各該保險業資金百分之四十五。但下列金額不計入其國外投資限額： 一、保險業經主管機關核准銷售以外幣收付之非投資型人身保險商品，並經核准不計入國外投資之金額。 二、保險業依本法規定投資於國內證券市場上市或上櫃買賣之外幣計價股權或債券憑證之投資金額。 三、保險業經主管機關核准設立或投資國外保險相關事業，並經核准不計入國外投資之金額。 四、其他經主管機關核准之投資項目及金額。 保險業資金辦理國外投資之投資規範、投資額度、審核及其他應遵行事項之辦法，由主管機關定之。主管機關並得視保險業之財務狀況、風險管理及法令遵循之情形就前項第二款之投資金額予以限制。", "anchor": "read/c146-4"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "clause", "title": "第146-6條 保險法｜投資保險相關事業", "text": "保險法｜投資保險相關事業 業主權益超過第139條所定最低資本或基金最低額者，經核准可投資保險相關事業發行的股票，投資總額最高不得超過業主權益；若與被投資公司有控制與從屬關係，總額最高不得超過業主權益 40%。   保險業業主權益，超過第一百三十九條規定最低資本或基金最低額者，得經主管機關核准，投資保險相關事業所發行之股票，不受第一百四十六條之一第一項第三款及第三項規定之限制；其投資總額，最高不得超過該保險業業主權益。 保險業依前項規定投資而與被投資公司具有控制與從屬關係者，其投資總額，最高不得超過該保險業業主權益百分之四十。 保險業依第一項規定投資保險相關事業，其控制與從屬關係之範圍、投資申報方式及其他應遵行事項之辦法，由主管機關定之。", "anchor": "read/c146-6"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "clause", "title": "第143-4條 保險法｜資本適足與資本等級", "text": "保險法｜資本適足與資本等級 保險業的自有資本與風險資本比率、淨值比率不得低於一定比率；依此分四個資本等級：資本適足、不足、顯著不足、嚴重不足。資本嚴重不足＝比率低於一定比率的 25%，或淨值低於零。「一定比率」的數字由主管機關辦法訂定（保險業資本適足性管理辦法第5條：現行資本適足率 100%，舊制是 200%）。 「適足、不足、顯著不足、嚴重不足」 第5章的「法定標準」就是這裡的資本適足標準。 保險業自有資本與風險資本之比率及淨值比率，不得低於一定比率。 保險業依自有資本與風險資本之比率及淨值比率，劃分為下列資本等級： 一、資本適足。 二、資本不足。 三、資本顯著不足。 四、資本嚴重不足。 前項第四款所稱資本嚴重不足，指自有資本與風險資本之比率低於第一項所定一定比率之百分之二十五或保險業淨值低於零。 第一項所定一定比率、淨值比率之計算、自有資本與風險資本之範圍、計算方法、管理、第二項資本等級之劃分及其他應遵行事項之辦法，由主管機關定之。", "anchor": "read/c143-4"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "clause", "title": "比率規範一、二 死亡給付比率規範｜目的與適用範圍", "text": "死亡給付比率規範｜目的與適用範圍 目的：維持人壽保險商品的基本保障比重。適用：規範生效日後簽訂的人壽保險契約，以及生效日後申請把契約轉換為人壽保險的。不適用：小額終老保險；分紅保險及利率變動型人壽保險選擇增額繳清保險的部分；傳統型人壽保險申請減額繳清或展期定期保險時。   一、為維持人壽保險商品之基本保險保障比重，藉以提高國人保險保障，特訂定本規範。 二、本規範之適用範圍如下： （一）本規範生效日後所簽訂之人壽保險契約。 （二）本規範生效日後申請將保險契約轉換為人壽保險契約者。 有下列情形之一者，不適用前項規定： （一）小額終老保險。 （二）分紅保險及利率變動型人壽保險選擇增額繳清保險部分。 （三）傳統型人壽保險申請減額繳清保險或展期定期保險時。", "anchor": "read/c比率規範一、二"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "clause", "title": "比率規範三 死亡給付比率規範｜名詞定義", "text": "死亡給付比率規範｜名詞定義 死亡給付＝身故保險金或喪葬費用保險金；非投資型壽險比率＝死亡給付 ÷ 保單價值準備金，投資型壽險比率＝死亡給付 ÷ 保單帳戶價值；到達年齡＝原始投保年齡＋當時保單年度數－1。 「到達年齡＝投保年齡＋保單年度－1」 到達年齡是「減一」，不是加一。 三、本規範用詞定義如下： （一）死亡給付：指人壽保險契約約定之身故保險金或喪葬費用保險金金額。 （二）保單價值準備金： 1.非投資型萬能人壽保險：指累積價值準備金，加計當時之淨保險費金額。淨保險費金額係指保險人已將要保人繳交保險費扣除附加費用，但尚未按宣告利率計息之金額。 2.其它非投資型人壽保險：指人身保險業以計算保險契約簽單保險費之利率及危險發生率為基礎，並依主管機關規定方式計算之準備金。 （三）保單帳戶價值：指投資型人壽保險契約所有連結投資標的之價值總和，加計當時之預定投資保費金額。預定投資保費金額係指保險人已將要保人所繳保險費扣除前置費用，但尚未實際配置於投資標的之金額。 （四）比率： 1.非投資型人壽保險：指死亡給付除以保單價值準備金之值。 2.投資型人壽保險：指死亡給付除以保單帳戶價值之值。 （五）到達年齡：指依被保險人之原始投保年齡，加上當時保單年度數，再減去一後所計得之年齡。", "anchor": "read/c比率規範三"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "clause", "title": "比率規範四 死亡給付比率規範｜各年齡最低比率", "text": "死亡給付比率規範｜各年齡最低比率 依被保險人到達年齡：30 歲以下不得低於 190%；31–40 歲 160%；41–50 歲 140%；51–60 歲 120%；61–70 歲 110%；71–90 歲 102%；91 歲以上 100%。含人壽保險的綜合型商品，前十年各年度解約金不大於以年繳計算的累積實繳總保費，或銷售對象為財富管理客戶的商品，不適用。 「190、160、140、120、110、102、100」 現行規範適用「全部人壽保險」，不再只限投資型。題庫提醒考題可能出舊制數字，新舊都要熟，見對照表。 四、人壽保險之比率應符合下列規定。但含人壽保險之綜合型保險商品前十年各年度之解約金不大於以年繳計算之累積實繳總保費或銷售對象為人身保險業財富管理客戶之保險商品者，不在此限： （一）被保險人之到達年齡在三十歲以下；其比率不得低於百分之一百九十。 （二）被保險人之到達年齡在三十一歲以上、四十歲以下；其比率不得低於一百六十。 （三）被保險人之到達年齡在四十一歲以上、五十歲以下；其比率不得低於百分之一百四十。 （四）被保險人之到達年齡在五十一歲以上、六十歲以下；其比率不得低於百分之一百二十。 （五）被保險人之到達年齡在六十一歲以上、七十歲以下；其比率不得低於百分之一百一十。 （六）被保險人之到達年齡在七十一歲以上、九十歲以下；其比率不得低於百分之一百零二。 （七）被保險人之到達年齡在九十一歲以上；其比率不得低於百分之一百。", "anchor": "read/c比率規範四"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "clause", "title": "比率規範五、六 死亡給付比率規範｜何時符合、契約與招攬", "text": "死亡給付比率規範｜何時符合、契約與招攬 非投資型人壽保險（不含萬能）要在保險期間「全期」符合；萬能及投資型人壽保險在投保、每次繳費、申請基本保額變更時符合並重新計算。定期定額繳費在列印繳費通知單時重算；彈性繳費在每次繳費時重算。不符合最低比率時的保費繳交限制與處理方式，要寫在契約條款，並在招攬時向要保人解說。   五、前點比率，非投資型人壽保險（不含萬能人壽保險）應於保險期間內全期符合；非投資型萬能人壽保險及投資型人壽保險應於要保人投保、每次繳交保險費及申請基本保額變更時符合，並重新計算各契約應符合之最低比率，並依下列繳費別判定： （一）定期定額繳費保件：於保險人列印保險費繳費通知單時重新計算，其含當次繳費後之比率，不得低於當時各該契約應符合之最低比率。 （二）彈性繳費保件：於要保人每次繳交保險費時重新計算，其含當次繳費後之比率，不得低於當時各該契約應符合之最低比率。 六、保險人應將人壽保險契約不符合最低比率時之保險費繳交限制及處理方式約定於契約條款，並應於招攬時向要保人妥為解說。", "anchor": "read/c比率規範五、六"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "clause", "title": "舊比率規範四 舊規範（99 年）｜投資型人壽保險的最低比率", "text": "舊規範（99 年）｜投資型人壽保險的最低比率 舊規範只管投資型人壽保險：滿 15 足歲且到達年齡 40 歲以下不得低於 130%；41–70 歲 115%；71 歲以上 101%。 「130、115、101」 這是金管會 99 年的舊規範，現行規範是上面的 108 年令（115 年 10 月 8 日修正）。 四、投資型人壽保險死亡給付對保單帳戶價值之比率，應於要保人投保及每次繳交保險費時符合下列規定： （一）被保險人滿十五足歲且到達年齡在四十歲以下者，其比率不得低於百分之一百三十。 （二）被保險人之到達年齡在四十一歲以上、七十歲以下者，其比率不得低於百分之一百十五。 （三）被保險人之到達年齡在七十一歲以上者，其比率不得低於百分之一百零一。", "anchor": "read/c舊比率規範四"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "table", "title": "死亡給付對保單價值準備金（帳戶價值）最低比率：現行 vs 舊制", "text": "死亡給付對保單價值準備金（帳戶價值）最低比率：現行 vs 舊制 到達年齡 現行（全部人壽保險） 舊規範（99年，僅投資型） 30 歲以下 190% 15–40 歲：130% 31–40 歲 160% 130% 41–50 歲 140% 41–70 歲：115% 51–60 歲 120% 115% 61–70 歲 110% 115% 71–90 歲 102% 71 歲以上：101% 91 歲以上 100% 101%", "anchor": "table/t0"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "table", "title": "保險法的數字速查", "text": "保險法的數字速查 項目 規定 條文 解約金 保費付足一年以上；一個月內給付；不少於保單價值準備金 3/4 第119條 放款 每一單位不超過資金 5%；總額不超過資金 35% 第146-3條 國外投資總額 最高不超過資金 45% 第146-4條 投資保險相關事業 總額不超過業主權益；有控制從屬關係者不超過業主權益 40% 第146-6條 資本嚴重不足 比率低於一定比率的 25%，或淨值低於零 第143-4條", "anchor": "table/t1"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "table", "title": "壽險經驗生命表（官方令整理）", "text": "壽險經驗生命表（官方令整理） 生命表 用在哪裡／何時 出處 臺灣壽險業經驗生命表（第一回） 64年2月5日起簽發的新契約費率與準備金 110年8月24日令 第二回 74年1月1日起簽發的新契約費率與準備金 110年8月24日令 第三回 78年9月1日起；計提準備金用到 92年12月31日；92年1月1日起新保單的費率生命表得自行決定 110年8月24日令 第四回 93年1月1日至101年6月30日計提責任準備金 110年8月24日令 第六回 110年7月1日起適用 110年3月29日令 第七回 115年1月1日生效 114年7月29日令", "anchor": "table/t2"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "table", "title": "跨章期限與頻率速查（皆已對照官方原文）", "text": "跨章期限與頻率速查（皆已對照官方原文） 項目 規定 章 信評調降通知要保人 事實發生日起 3 日內 第8章 保管機構（管理事業）變更申報 變更後 15 個工作日內 第7章 法令變更通知要保人 不低於 60 日 第7章 全委專設帳簿決算報告 會計年度終了後 4 個月內 第7章 業務單位專案自行查核 每半年（2026/2/5 起；舊為每季） 第6章 內部稽核單位專案查核 每年 第6章 特定目的不動產投資事業收入匯回 每年結算並經會計師簽證後 6 個月內 第5章 風險值回溯測試 每月 第5、6、7章 書面紀錄、資料保存 至少 5 年 第5、7章 匯率風險說明書情境更新 每年，最遲 3 月 1 日前 第9章 投資政策與內部作業程序檢視 每年 第11章", "anchor": "table/t3"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "card", "title": "保險法將保險分為哪兩大類？", "text": "保險法將保險分為哪兩大類？ 財產保險及人身保險。", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "card", "title": "保險法第13條，人身保險包括哪四種？", "text": "保險法第13條，人身保險包括哪四種？ 人壽保險、健康保險、傷害保險及年金保險。", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "card", "title": "保險法第13條，財產保險包括哪些？", "text": "保險法第13條，財產保險包括哪些？ 火災保險、海上保險、陸空保險、責任保險、保證保險及經主管機關核准的其他保險。", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "card", "title": "「依購買者性別、年齡別、死亡率來繳付保費」是什麼原則？", "text": "「依購買者性別、年齡別、死亡率來繳付保費」是什麼原則？ 公平的危險分攤原則。", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "card", "title": "「全體保戶繳入的保費總額＝公司付給全體受益人的保險金總額」是什麼原則？", "text": "「全體保戶繳入的保費總額＝公司付給全體受益人的保險金總額」是什麼原則？ 收支相等原則。", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "card", "title": "年金保險的定義？", "text": "年金保險的定義？ 保險人於被保險人生存期間或特定期間內，依契約一次或分期給付一定金額。", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "card", "title": "要保人終止契約，解約金怎麼給？", "text": "要保人終止契約，解約金怎麼給？ 保費付足一年以上；保險人接到通知後一個月內償付；金額不得少於要保人應得保單價值準備金的四分之三。", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "card", "title": "保險人破產時，受益人的債權怎麼計算？", "text": "保險人破產時，受益人的債權怎麼計算？ 以其保單價值準備金，按訂約時的保險費率比例計算。", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "card", "title": "誰對保單價值準備金有優先受償之權？", "text": "誰對保單價值準備金有優先受償之權？ 人壽保險的要保人、被保險人、受益人。", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "card", "title": "保險業辦理與保險有關的業務，涉及外匯業務，要經誰許可？", "text": "保險業辦理與保險有關的業務，涉及外匯業務，要經誰許可？ 中央銀行。", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "card", "title": "各種準備金的提存比率、計算方式，由誰訂辦法？", "text": "各種準備金的提存比率、計算方式，由誰訂辦法？ 主管機關（保險業各種準備金提存辦法）。", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "card", "title": "保險業放款只限哪四種？", "text": "保險業放款只限哪四種？ 銀行或信用保證機構保證的放款；動產或不動產擔保放款；合格有價證券為質的放款；人壽保險業以自己簽發的保單為質的放款。", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "card", "title": "放款的每單位與總額上限？", "text": "放款的每單位與總額上限？ 前三種：每一單位放款不超過資金 5%；放款總額不超過資金 35%。", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "card", "title": "保險法第146-4條的國外投資只限哪四種？", "text": "保險法第146-4條的國外投資只限哪四種？ 外匯存款、國外有價證券、設立或投資國外保險相關事業、其他經核准的國外投資。", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "card", "title": "國外投資總額最高上限？", "text": "國外投資總額最高上限？ 不得超過各該保險業資金 45%。", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "card", "title": "哪些金額不計入國外投資限額？", "text": "哪些金額不計入國外投資限額？ 核准銷售外幣收付非投資型人身保險商品並核准不計入的金額；投資國內上市櫃外幣計價股權或債券憑證的金額；核准設立或投資國外保險相關事業並核准不計入的金額；其他經核准的項目。", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "card", "title": "投資保險相關事業，與被投資公司有控制從屬關係時，總額上限？", "text": "投資保險相關事業，與被投資公司有控制從屬關係時，總額上限？ 不得超過保險業業主權益 40%。（一般情形最高不超過業主權益）", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "card", "title": "什麼是「資本嚴重不足」？", "text": "什麼是「資本嚴重不足」？ 自有資本與風險資本比率低於一定比率的 25%，或保險業淨值低於零。", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "card", "title": "被保險人到達年齡 30 歲以下，死亡給付對保單價值準備金（帳戶價值）的最低比率？", "text": "被保險人到達年齡 30 歲以下，死亡給付對保單價值準備金（帳戶價值）的最低比率？ 不得低於 190%。", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "card", "title": "到達年齡 31–40、41–50、51–60 歲的最低比率？", "text": "到達年齡 31–40、41–50、51–60 歲的最低比率？ 160%、140%、120%。", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "card", "title": "到達年齡 61–70、71–90、91 歲以上的最低比率？", "text": "到達年齡 61–70、71–90、91 歲以上的最低比率？ 110%、102%、100%。", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "card", "title": "「到達年齡」怎麼算？", "text": "「到達年齡」怎麼算？ 原始投保年齡，加上當時保單年度數，再減去一。", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "card", "title": "死亡給付比率規範「不適用」哪三種情形？", "text": "死亡給付比率規範「不適用」哪三種情形？ 小額終老保險；分紅保險及利率變動型人壽保險選擇增額繳清保險部分；傳統型人壽保險申請減額繳清保險或展期定期保險時。", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "card", "title": "舊規範（99年）投資型人壽保險的最低比率？", "text": "舊規範（99年）投資型人壽保險的最低比率？ 到達年齡 40 歲以下 130%；41–70 歲 115%；71 歲以上 101%。", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "card", "title": "哪種人壽保險要在「保險期間內全期」符合最低比率？", "text": "哪種人壽保險要在「保險期間內全期」符合最低比率？ 非投資型人壽保險（不含萬能人壽保險）；萬能與投資型是在投保、每次繳費、申請基本保額變更時符合。", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "card", "title": "萬能保險怎麼計算保單價值？", "text": "萬能保險怎麼計算保單價值？ 保險費扣除附加費用後，依該保險費所適用的宣告利率計算。", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "card", "title": "養老保險是哪兩種保險的結合？", "text": "養老保險是哪兩種保險的結合？ 定期保險與生存保險（口訣：定存）。", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "scen", "title": "依保險法第13條，人身保險包括下列哪些？A 人壽 B 責任 C 傷害 D 年金 E 健康", "text": "依保險法第13條，人身保險包括下列哪些？A 人壽 B 責任 C 傷害 D 年金 E 健康 ABDE BCDE ABCD ACDE 第13條第3項：人壽、健康、傷害、年金。責任保險屬財產保險。", "anchor": "quiz"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "scen", "title": "要保人終止契約，保險費已付足一年以上，依保險法第119條，解約金金額？", "text": "要保人終止契約，保險費已付足一年以上，依保險法第119條，解約金金額？ 不得少於保單價值準備金的四分之三 得少於保單價值準備金的四分之三 不得少於已繳保費 由保險公司自行決定 第119條：保險人於接到通知後一個月內償付解約金，其金額不得少於要保人應得保單價值準備金之四分之三。", "anchor": "quiz"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "scen", "title": "依保險法第146-4條，保險業國外投資總額由主管機關核定，最高不得超過？", "text": "依保險法第146-4條，保險業國外投資總額由主管機關核定，最高不得超過？ 資金 35% 資金 40% 資金 45% 業主權益 45% 第146-4條第2項：最高不得超過各該保險業資金百分之四十五。", "anchor": "quiz"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "scen", "title": "被保險人投保時 35 歲、現在是第 3 保單年度，到達年齡是 37 歲。依現行死亡給付比率規範，最低比率是？", "text": "被保險人投保時 35 歲、現在是第 3 保單年度，到達年齡是 37 歲。依現行死亡給付比率規範，最低比率是？ 190% 160% 140% 120% 到達年齡＝35＋3－1＝37，落在 31–40 歲，不得低於 160%。", "anchor": "quiz"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "scen", "title": "下列哪一種保險，不適用死亡給付對保單價值準備金的最低比率規範？", "text": "下列哪一種保險，不適用死亡給付對保單價值準備金的最低比率規範？ 定期壽險 終身壽險 小額終老保險 投資型人壽保險 規範第二點：小額終老保險不適用。", "anchor": "quiz"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "scen", "title": "依保險法第146-3條，保險業以動產或不動產為擔保的放款，每一單位放款金額與放款總額的上限？", "text": "依保險法第146-3條，保險業以動產或不動產為擔保的放款，每一單位放款金額與放款總額的上限？ 資金 5%、35% 資金 10%、35% 資金 5%、45% 業主權益 5%、35% 第146-3條第2項：每一單位不超過資金 5%，放款總額不超過資金 35%。", "anchor": "quiz"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "scen", "title": "保險業辦理與保險有關的業務，涉及外匯業務，須經誰許可？", "text": "保險業辦理與保險有關的業務，涉及外匯業務，須經誰許可？ 金管會 中央銀行 財政部 壽險公會 保險法第138條第4項：涉及外匯業務之經營者，須經中央銀行之許可。", "anchor": "quiz"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "scen", "title": "依保險法第143-4條，「資本嚴重不足」是指？", "text": "依保險法第143-4條，「資本嚴重不足」是指？ 淨值低於資本 自有資本與風險資本比率低於一定比率的 25%，或淨值低於零 資本適足率低於 100% 比率低於 200% 第143-4條第3項。", "anchor": "quiz"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "scen", "title": "下列哪一種人壽保險，要在「保險期間內全期」符合最低比率？", "text": "下列哪一種人壽保險，要在「保險期間內全期」符合最低比率？ 非投資型萬能人壽保險 投資型人壽保險 非投資型人壽保險（不含萬能） 以上皆是 規範第五點：非投資型（不含萬能）全期符合；萬能與投資型在投保、每次繳費、申請基本保額變更時符合。", "anchor": "quiz"}, {"file": "ch01.html", "chTitle": "第1章 壽險基本概念與保險法重點", "type": "scen", "title": "「依購買者性別、年齡別、死亡率來繳付保險費」，是哪一個原則？", "text": "「依購買者性別、年齡別、死亡率來繳付保險費」，是哪一個原則？ 大數法則 收支相等原則 公平的危險分攤原則 最小損害原則 公平的危險分攤；收支相等是保費總額＝保險金總額。", "anchor": "quiz"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "clause", "title": "第1條 訂定依據", "text": "訂定依據 這份辦法的法源是中央銀行法第35條第2項，不是管理外匯條例。 法源「央行法35-2」。 由中央銀行訂定，所以後面的許可、退回、駁回、廢止都是央行在做。 本辦法依中央銀行法第三十五條第二項規定訂定之。", "anchor": "read/c1"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "clause", "title": "第2條 適用對象", "text": "適用對象 保險法所稱的保險業和外國保險業都適用。  條文只寫「保險業」與「外國保險業」。專業再保險業在保險法第147-1條另有規範，屬於保險業的一種，所以再保險業也適用；題目寫「再保險業」時不必懷疑。 本辦法有關保險業之規定，於保險法所稱之保險業及外國保險業均適用之。", "anchor": "read/c2"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "clause", "title": "第3條 保險業得辦理的外匯業務（八款）", "text": "保險業得辦理的外匯業務（八款） 共八款：外幣人身保險、外幣財產保險（限金管會所訂範圍）、外幣再保險、投資型年金轉即期年金並以新臺幣給付、外幣保單質借放款、財富管理涉及外匯、擔任外幣聯貸參加行放款、央行另許可的其他業務。 八款口訣「人、財、再、年、質、富、貸、許」。 第五款的保單必須是「第一款所指」的外幣人身保險保單；是「財富管理」不是「財產管理」。 保險業得辦理外匯業務如下： 一、以外幣收付之人身保險業務。 二、以外幣收付之財產保險業務。但以金融監督管理委員會（以下簡稱金管會）所訂之業務範圍為限。 三、以外幣收付之再保險業務。 四、以外幣收付之投資型年金保險，於年金累積期間屆滿時轉換為一般帳簿之即期年金保險，約定以新臺幣給付年金者。 五、以第一款所指保險之保險單為質之外幣放款。 六、財富管理業務涉及外匯業務之經營者。 七、辦理擔任外幣聯合貸款案參加行之外幣放款業務。 八、其他經中央銀行（以下簡稱本行）許可辦理之外匯業務。", "anchor": "read/c3"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "clause", "title": "第4條 須先向央行申請許可", "text": "須先向央行申請許可 外匯業務要先向央行申請許可。可以申請全部或一部分款項，由央行依業務需要分別許可。沒經許可的外匯業務不能辦。 「許可找央行」。 是央行依「業務需要」許可，不是依財務狀況或自有資本比率。 保險業有關外匯業務之經營，應向本行申請許可後，始得辦理。 保險業得申請辦理前條各款全部或一部之業務項目，並由本行依其業務需要，於該條各款範圍內分別許可之；本行並得就同條第八款許可之業務，另訂或於許可函中載明其他應遵循事項。 未經本行許可之外匯業務不得辦理之。", "anchor": "read/c4"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "clause", "title": "第5條 由誰備文申請", "text": "由誰備文申請 本國保險業由總機構備文申請；外國保險業由在我國境內設立的分支機構備文申請。 總機構／境內分支機構。  保險業申請辦理外匯業務，除本辦法另有規定者外，應由總機構備文，檢附第六條規定書件向本行申請許可。 外國保險業申請辦理外匯業務，應由在我國境內設立之分支機構備文，檢附第六條規定書件向本行申請許可。", "anchor": "read/c5"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "clause", "title": "第6條 申請要附的書件（七項）", "text": "申請要附的書件（七項） 申請書件七項：營業執照影本、董事會議事錄（或外國總公司授權書）、金管會核准證明、法遵稽核會計主管簽署聲明書、營業計畫書、重要事項告知書、其他。辦理第3條第3款（保單質借）和第7款（聯貸參加行）業務時，可以免附第3項（金管會核准證明）和第6項（重要事項告知書）。 書件七項「照、決、核、聲、計、告、他」。免附的是「核」和「告」。 聲明書是由法規遵循、稽核、會計部門單位主管簽署；營業計畫書內容含業務簡介、作業流程、款項收付。 保險業申請辦理第三條外匯業務時，應檢附下列書件： 一、金管會核發之營業執照影本。 二、董事會決議辦理各該業務議事錄或外國保險公司總公司（或區域總部）授權書。 三、金管會核准辦理各該業務之證明文件。 四、經法規遵循、稽核及會計部門單位主管簽署符合主管機關相關法令規範或會計準則之聲明書。 五、營業計畫書（內容應包括業務簡介、作業流程、款項收付等項目）。 六、重要事項告知書（含風險告知）。 七、其他本行規定之文件。 保險業申請辦理第三條第三款及第七款業務時，免檢附前項第三款及第六款規定文件。", "anchor": "read/c6"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "clause", "title": "第7條 退回：書件不完備", "text": "退回：書件不完備 書件不完備或記載事項不充分，經通知限期補正而逾期沒補，央行得退回。 退回＝書件問題＋逾期未補正。  保險業申請辦理外匯業務時，所送各項書件不完備或應記載事項不充分，經通知限期補正，屆期未補正者，本行得退回其申請案件。", "anchor": "read/c7"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "clause", "title": "第8條 駁回：資格或健全經營有疑慮", "text": "駁回：資格或健全經營有疑慮 三種情形央行得駁回：申請資格不符第5條；最近一年違反本辦法或其他外匯規定且情節重大（或限期改正逾期未改善）；其他足認有礙業務健全經營或不符金融政策要求。 駁回＝資格不符第5條＋最近一年重大違規＋有礙健全經營。 「最近一年違反保險法」或「罰鍰累計達某金額」都不是條文列舉的駁回事由。 保險業申請許可辦理外匯業務，經審查有下列情形之一者，本行得駁回其申請： 一、申請資格不符第五條規定。 二、最近一年有違反本辦法或其他外匯相關規定且情節重大，或經本行限期改正，屆期仍未改善者。 三、其他事實足認為有礙業務健全經營或未能符合金融政策要求之虞者。", "anchor": "read/c8"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "clause", "title": "第9條 廢止或撤銷許可（五種情形）", "text": "廢止或撤銷許可（五種情形） 已經許可後出問題，央行可依情節輕重廢止或撤銷一部或全部。五種：許可後六個月內沒開辦（有正當理由可延三個月，只能一次）、違反第4條第3項或其他規定且情節重大、申請事項虛偽且情節重大、停業解散破產、其他有礙健全經營。 「六個月、延三個月、僅一次」。 第二款裡的「經本行限期改正」，主體是央行，不是金管會。 保險業經辦各項外匯業務，有下列情事之一者，本行得按其情節輕重，廢止或撤銷許可外匯業務之一部或全部： 一、發給許可函後六個月內未開辦者。但有正當理由申請延期，經本行核准，得延長三個月，並以一次為限。 二、違反第四條第三項規定，或違反本辦法其他規定且情節重大，或經本行限期改正，屆期仍未改正。 三、經本行許可辦理各項外匯業務後，發覺原申請事項有虛偽情事，且情節重大者。 四、有停業、解散或破產之情事者。 五、其他事實足認為有礙業務健全經營或未能符合金融政策要求之虞者。", "anchor": "read/c9"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "clause", "title": "第10條 辨識顧客身分", "text": "辨識顧客身分 辦理外匯業務前，要先確實辨識顧客身分或基本登記資料，以及憑辦文件是否符合規定。 關鍵字「辨識身分、基本登記資料、憑辦文件」。 條文沒有寫「瞭解客戶需求」，這是和其他規定混淆的地方。 保險業辦理各項外匯業務，應先確實辨識顧客身分或基本登記資料及憑辦文件是否符合規定。", "anchor": "read/c10"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "clause", "title": "第11條 報表與結匯", "text": "報表與結匯 央行可要求報送報表，格式央行定，保險業要確保完整真實。保險業辦理外匯業務，要依收付款項向「銀行業」辦理結匯，並留存結匯明細供查核。 結匯找「銀行業」，不是央行、金管會。  本行得要求保險業報送外匯業務相關報表，其格式由本行另定之。保險業並應確保報表之完整與真實。 保險業辦理外匯業務應確實依收付款項向銀行業辦理結匯，並將結匯明細資料留存以供查核。", "anchor": "read/c11"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "clause", "title": "第12條 央行得派員查閱", "text": "央行得派員查閱 央行必要時可以派員查閱帳冊文件，或要求限期提出財務報告或其他資料。 查閱找「本行」。  本行於必要時得派員查閱保險業辦理外匯業務有關帳冊文件，或要求其於期限內據實提出財務報告或其他相關資料。", "anchor": "read/c12"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "clause", "title": "第13條 新臺幣收付限制與結匯", "text": "新臺幣收付限制與結匯 外幣收付的保險，款項原則上不得以新臺幣收付，結匯由要保人或受益人自己依申報辦法逕向銀行業辦理。例外：投資型年金轉為即期年金後可約定以新臺幣給付年金，由保險業辦理結匯；外幣財產保險在一定證明文件下可以新臺幣收付。 「保戶自己結匯、保險業例外代辦」。 這一條最容易看錯：「均不得以新臺幣為之」。要保人、受益人、保險業三方各自能不能結匯，請看對照表。 除本辦法或本行另有規定外，以外幣收付之保險，其相關款項之收付均不得以新臺幣為之；其結匯事宜應由要保人或受益人依外匯收支或交易申報辦法（以下簡稱申報辦法）之規定，逕向銀行業辦理。 投資型年金保險累積期間屆滿時轉換為一般帳簿之即期年金保險，得約定以新臺幣給付年金，並由保險業依申報辦法等有關規定辦理結匯。 以外幣收付之財產保險，得依下列規定進行新臺幣收付： 一、憑要保人提供之保險標的涉及出、進口貨物或提供跨境服務之相關證明文件，及與要保人約定收受等值之新臺幣保險費。 二、憑受益人提供之新臺幣證明文件為新臺幣保險給付，如涉及結匯事宜，則由財產保險業依申報辦法等有關規定逕向銀行業辦理結匯。 前項要保人或受益人應為申報辦法第三條定義之公司、行號、團體、個人。 保險業辦理第三條第二款及第三款業務，其收付幣別得依保險契約約定之外幣收付，如涉及外幣間兌換並應由保險業逕向銀行業辦理。", "anchor": "read/c13"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "clause", "title": "第14條 放款與聯貸的資金來源", "text": "放款與聯貸的資金來源 保單質借（第5款）和外幣聯貸參加行（第7款）的放款，資金只能用保險業用於國外投資的「自有外幣資金」。辦聯貸的另外要：放款對象限國內顧客，並確認主辦行有依央行規範辦理。 「自有、外幣、國外投資」。 不能用新臺幣資金兌換外幣來放款。 保險業辦理第三條第五款及第七款業務之資金來源，應以保險業用於國外投資之自有外幣資金為限。 保險業經許可辦理第三條第七款業務者，應遵循下列規定： 一、放款對象以國內顧客為限。 二、應確認主辦行確依本行「銀行業辦理外匯業務作業規範」第六點有關憑辦文件、兌換限制及外債登記等規定辦理。", "anchor": "read/c14"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "clause", "title": "第15條 投資型保險連結衍生性商品的限制", "text": "投資型保險連結衍生性商品的限制 投資型保險如果連結衍生性商品並涉及外匯，投資標的「不得涉及」兩類：本國貨幣市場的新臺幣利率指標與匯率指標；相關主管機關限制的範圍。 「不得」兩樣：台幣利匯率指標、主管機關限制。 重點在「不得涉及」。把這句讀成「得涉及」，答案會剛好相反。 保險業銷售之投資型保險商品，如連結衍生性商品並涉及外匯者，其投資標的內容不得涉及下列範圍： 一、本國貨幣市場之新臺幣利率指標及匯率指標。 二、相關主管機關限制者。", "anchor": "read/c15"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "table", "title": "第3條八款業務速查", "text": "第3條八款業務速查 款 業務 要點 一 以外幣收付之人身保險業務  二 以外幣收付之財產保險業務 以金管會所訂業務範圍為限 三 以外幣收付之再保險業務  四 投資型年金保險於年金累積期間屆滿時轉換為一般帳簿之即期年金保險 約定以新臺幣給付年金者 五 以第一款所指保險之保險單為質之外幣放款 保單須是外幣人身保險保單（第一款） 六 財富管理業務涉及外匯業務之經營者  七 辦理擔任外幣聯合貸款案參加行之外幣放款業務  八 其他經中央銀行許可辦理之外匯業務 ", "anchor": "table/t0"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "table", "title": "退回、駁回、廢止撤銷：三個動詞怎麼分", "text": "退回、駁回、廢止撤銷：三個動詞怎麼分 動詞 時點 主要情形 條文 退回 申請階段 書件不完備或記載不充分，限期補正，逾期未補 第7條 駁回 審查階段 資格不符第5條；最近一年重大違規或逾期未改；有礙健全經營 第8條 廢止或撤銷 許可之後 許可後六個月內未開辦；重大違規；原申請虛偽；停業解散破產；有礙健全經營 第9條", "anchor": "table/t1"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "table", "title": "外幣保險款項的結匯，誰負責？", "text": "外幣保險款項的結匯，誰負責？ 情形 新臺幣收付 結匯由誰辦理 條文 以外幣收付之保險（一般） 原則不得 要保人或受益人，依申報辦法逕向銀行業 第13條第1項 投資型年金轉為一般帳簿即期年金 得約定以新臺幣給付年金 保險業，依申報辦法等規定 第13條第2項 外幣財產保險 在證明文件條件下得進行 受益人新臺幣給付涉及結匯時，由財產保險業逕向銀行業 第13條第3項 保險業辦理外匯業務（總則） — 保險業依收付款項向銀行業辦理結匯並留存明細 第11條第2項", "anchor": "table/t2"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "table", "title": "誰管什麼", "text": "誰管什麼 單位 角色 中央銀行 許可外匯業務；退回、駁回、廢止撤銷；要求報表；派員查閱帳冊 金管會 核發營業執照；核准辦理各該業務（申請書件所列） 銀行業 辦理結匯 保險業 備文申請、保存結匯明細、確保報表真實", "anchor": "table/t3"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "table", "title": "數字與期限", "text": "數字與期限 項目 規定 條文 許可後開辦期限 六個月內；有正當理由得延長三個月，限一次 第9條第1款 申請書件 七項（辦第3條第3、7款免附兩項） 第6條 得辦理的外匯業務 八款 第3條 駁回事由 三種 第8條 廢止撤銷事由 五種 第9條", "anchor": "table/t4"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "card", "title": "本辦法的法源是什麼？", "text": "本辦法的法源是什麼？ 中央銀行法第35條第2項。", "anchor": "cards"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "card", "title": "第3條保險業得辦理的外匯業務有幾款？分別是什麼？", "text": "第3條保險業得辦理的外匯業務有幾款？分別是什麼？ 八款：外幣人身保險、外幣財產保險（金管會範圍）、外幣再保險、投資型年金轉即期年金以新臺幣給付、外幣保單質借放款、財富管理涉及外匯、擔任外幣聯貸參加行放款、央行許可的其他業務。", "anchor": "cards"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "card", "title": "外幣保單質借放款的保單，限於哪一種保單？", "text": "外幣保單質借放款的保單，限於哪一種保單？ 第一款所指的保險單，也就是以外幣收付之人身保險保單。", "anchor": "cards"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "card", "title": "保險業辦理外匯業務要向誰申請許可？依什麼許可？", "text": "保險業辦理外匯業務要向誰申請許可？依什麼許可？ 向中央銀行申請許可，央行依其業務需要，在第3條各款範圍內分別許可。", "anchor": "cards"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "card", "title": "未經許可的外匯業務可以辦嗎？", "text": "未經許可的外匯業務可以辦嗎？ 不得辦理。", "anchor": "cards"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "card", "title": "本國保險業與外國保險業申請，各由誰備文？", "text": "本國保險業與外國保險業申請，各由誰備文？ 本國保險業由總機構備文；外國保險業由在我國境內設立之分支機構備文。", "anchor": "cards"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "card", "title": "申請外匯業務要檢附的七項書件？", "text": "申請外匯業務要檢附的七項書件？ 營業執照影本；董事會議事錄或外國總公司授權書；金管會核准證明文件；法遵、稽核、會計主管簽署的聲明書；營業計畫書；重要事項告知書（含風險告知）；其他本行規定文件。", "anchor": "cards"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "card", "title": "辦第3條第3款和第7款業務時，可以免附哪兩項？", "text": "辦第3條第3款和第7款業務時，可以免附哪兩項？ 免附第3項（金管會核准證明文件）和第6項（重要事項告知書）。", "anchor": "cards"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "card", "title": "什麼情形下央行得「退回」申請案？", "text": "什麼情形下央行得「退回」申請案？ 書件不完備或應記載事項不充分，經通知限期補正，屆期未補正。", "anchor": "cards"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "card", "title": "央行得「駁回」申請的三種情形？", "text": "央行得「駁回」申請的三種情形？ 申請資格不符第5條；最近一年違反本辦法或其他外匯規定且情節重大（或限期改正逾期仍未改善）；其他足認有礙健全經營或不符金融政策要求。", "anchor": "cards"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "card", "title": "央行得廢止或撤銷許可的五種情形？", "text": "央行得廢止或撤銷許可的五種情形？ 許可函後六個月內未開辦；違反第4條第3項或其他規定且情節重大；許可後發覺原申請事項虛偽且情節重大；停業、解散或破產；其他有礙健全經營。", "anchor": "cards"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "card", "title": "發給許可函後多久內要開辦？可以延期嗎？", "text": "發給許可函後多久內要開辦？可以延期嗎？ 六個月內；有正當理由申請延期並經核准，可延三個月，且只能一次。", "anchor": "cards"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "card", "title": "辦理外匯業務前，要先確實辨識什麼？", "text": "辦理外匯業務前，要先確實辨識什麼？ 顧客身分或基本登記資料，以及憑辦文件是否符合規定。", "anchor": "cards"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "card", "title": "保險業辦理外匯業務，要向誰辦理結匯？要保存什麼？", "text": "保險業辦理外匯業務，要向誰辦理結匯？要保存什麼？ 向銀行業辦理結匯，並將結匯明細資料留存以供查核。", "anchor": "cards"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "card", "title": "誰可以派員查閱保險業外匯業務的帳冊文件？", "text": "誰可以派員查閱保險業外匯業務的帳冊文件？ 本行（中央銀行）。", "anchor": "cards"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "card", "title": "外幣收付的保險，相關款項可以用新臺幣收付嗎？誰負責結匯？", "text": "外幣收付的保險，相關款項可以用新臺幣收付嗎？誰負責結匯？ 原則上不得以新臺幣收付；結匯由要保人或受益人依申報辦法逕向銀行業辦理。", "anchor": "cards"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "card", "title": "投資型年金轉為一般帳簿即期年金後，可以怎麼給付？誰辦結匯？", "text": "投資型年金轉為一般帳簿即期年金後，可以怎麼給付？誰辦結匯？ 可約定以新臺幣給付年金，由保險業依申報辦法等規定辦理結匯。", "anchor": "cards"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "card", "title": "保單質借和聯貸參加行放款的資金來源限制？", "text": "保單質借和聯貸參加行放款的資金來源限制？ 限於保險業用於國外投資的自有外幣資金。", "anchor": "cards"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "card", "title": "辦外幣聯貸參加行業務，放款對象限於哪些人？", "text": "辦外幣聯貸參加行業務，放款對象限於哪些人？ 限國內顧客。", "anchor": "cards"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "card", "title": "投資型保險連結衍生性商品並涉及外匯，投資標的不得涉及什麼？", "text": "投資型保險連結衍生性商品並涉及外匯，投資標的不得涉及什麼？ 本國貨幣市場的新臺幣利率指標及匯率指標；相關主管機關限制者。", "anchor": "cards"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "scen", "title": "客戶以美元購買外幣人身保險，想請保險公司收新臺幣、再由公司自行結匯。依第13條第1項，正確的說法是？", "text": "客戶以美元購買外幣人身保險，想請保險公司收新臺幣、再由公司自行結匯。依第13條第1項，正確的說法是？ 可以，保險公司可直接收新臺幣 原則上款項不得以新臺幣收付，結匯由要保人或受益人依申報辦法逕向銀行業辦理 由金管會代為結匯 由央行直接收取新臺幣 第13條第1項：除本辦法或本行另有規定外，以外幣收付之保險，其相關款項之收付均不得以新臺幣為之；結匯由要保人或受益人逕向銀行業辦理。", "anchor": "quiz"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "scen", "title": "保險公司想辦理外幣保單質借放款，打算把新臺幣資金兌換成外幣來支應。依第14條，是否可以？", "text": "保險公司想辦理外幣保單質借放款，打算把新臺幣資金兌換成外幣來支應。依第14條，是否可以？ 可以，只要匯率合適 不可以，資金來源限用於國外投資的自有外幣資金 可以，但要先經金管會同意 可以，但只限一年期 第14條第1項：第3條第5款及第7款業務的資金來源，應以保險業用於國外投資之自有外幣資金為限。", "anchor": "quiz"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "scen", "title": "某保險公司取得外匯業務許可函後，八個月都還沒有開辦，也沒有申請延期。依第9條，央行可以怎麼處理？", "text": "某保險公司取得外匯業務許可函後，八個月都還沒有開辦，也沒有申請延期。依第9條，央行可以怎麼處理？ 只能口頭警告 得按情節輕重廢止或撤銷該許可 必須罰款 應退回申請案 第9條第1款：發給許可函後六個月內未開辦者，央行得廢止或撤銷許可；有正當理由經核准可延三個月，限一次。「退回」是申請階段的書件問題。", "anchor": "quiz"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "scen", "title": "保險公司送件時，營業計畫書內容不充分，央行通知限期補正，公司逾期沒補。依第7條，央行得怎麼做？", "text": "保險公司送件時，營業計畫書內容不充分，央行通知限期補正，公司逾期沒補。依第7條，央行得怎麼做？ 廢止許可 駁回申請 退回申請案件 直接核准 第7條：書件不完備或應記載事項不充分，經通知限期補正，屆期未補正，本行得退回其申請案件。", "anchor": "quiz"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "scen", "title": "下列哪一項是第8條列舉、央行得「駁回」申請的情形？", "text": "下列哪一項是第8條列舉、央行得「駁回」申請的情形？ 最近一年罰鍰累計達二百萬元 申請資格不符第5條規定 要保書欄位漏填 負責人換人 第8條三款：申請資格不符第5條；最近一年有違反本辦法或其他外匯相關規定且情節重大（或限期改正逾期未改善）；其他足認有礙業務健全經營或不符金融政策要求之虞。罰鍰累計金額不是條文列舉的事由。", "anchor": "quiz"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "scen", "title": "保險公司申請辦理「擔任外幣聯合貸款案參加行之外幣放款」（第3條第7款）。依第6條第2項，下列哪兩項書件可以免附？", "text": "保險公司申請辦理「擔任外幣聯合貸款案參加行之外幣放款」（第3條第7款）。依第6條第2項，下列哪兩項書件可以免附？ 營業執照影本和董事會議事錄 金管會核准證明文件和重要事項告知書 營業計畫書和聲明書 聲明書和重要事項告知書 第6條第2項：辦理第3條第3款及第7款業務時，免檢附前項第3款（金管會核准證明）及第6款（重要事項告知書）。", "anchor": "quiz"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "scen", "title": "一家外國保險業要向央行申請辦理外匯業務，應由誰備文？", "text": "一家外國保險業要向央行申請辦理外匯業務，應由誰備文？ 外國總公司 在我國境內設立之分支機構 金管會 壽險公會 第5條第2項：外國保險業申請辦理外匯業務，應由在我國境內設立之分支機構備文，檢附第6條規定書件向本行申請許可。", "anchor": "quiz"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "scen", "title": "某投資型保險商品連結衍生性商品並涉及外匯。依第15條，下列哪一項「不得」成為其投資標的內容？", "text": "某投資型保險商品連結衍生性商品並涉及外匯。依第15條，下列哪一項「不得」成為其投資標的內容？ 外國貨幣市場的利率指標 本國貨幣市場之新臺幣利率指標及匯率指標 外國股價指數 外幣債券 第15條：投資標的內容不得涉及本國貨幣市場之新臺幣利率指標及匯率指標，以及相關主管機關限制者。", "anchor": "quiz"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "scen", "title": "依第10條，保險業辦理各項外匯業務前，條文要求先確實辨識什麼？", "text": "依第10條，保險業辦理各項外匯業務前，條文要求先確實辨識什麼？ 客戶的投資偏好與財富來源 顧客身分或基本登記資料，以及憑辦文件是否符合規定 客戶的信用評等 客戶的資產負債表 第10條的文字是「辨識顧客身分或基本登記資料及憑辦文件是否符合規定」，沒有寫瞭解客戶需求或財富來源。", "anchor": "quiz"}, {"file": "ch02.html", "chTitle": "第2章 保險業辦理外匯業務管理辦法", "type": "scen", "title": "外幣投資型年金保險在累積期間屆滿後轉為一般帳簿的即期年金保險，若約定以新臺幣給付年金，結匯由誰辦理？", "text": "外幣投資型年金保險在累積期間屆滿後轉為一般帳簿的即期年金保險，若約定以新臺幣給付年金，結匯由誰辦理？ 要保人 受益人 保險業 銀行業自行決定 第13條第2項：此情形得約定以新臺幣給付年金，並由保險業依申報辦法等有關規定辦理結匯。（同條第1項一般外幣保險則由要保人或受益人逕向銀行業辦理。）", "anchor": "quiz"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "clause", "title": "第1條 立法目的", "text": "立法目的 三個目的：平衡國際收支、穩定金融、實施外匯管理。 目的「平、穩、管」。 條文沒有「維持對內及對外幣值之穩定」這一項。 為平衡國際收支，穩定金融，實施外匯管理，特制定本條例。", "anchor": "read/c1"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "clause", "title": "第2條 外匯的定義", "text": "外匯的定義 外匯＝外國貨幣、票據、有價證券。外國有價證券的種類，由掌理外匯業務機關（央行）核定。 外匯三樣「幣、票、證」。 目前條文的定義不含黃金、白銀。 本條例所稱外匯，指外國貨幣、票據及有價證券。 前項外國有價證券之種類，由掌理外匯業務機關核定之。", "anchor": "read/c2"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "clause", "title": "第3條 兩個機關", "text": "兩個機關 管理外匯分兩個角色：行政主管機關，以及掌理外匯業務機關（中央銀行）。 行政管「政」，央行管「業務」。 條文字面寫「財政部」，現行管轄機關是金管會（行政院101年6月25日院臺規字第1010134960號公告）；掌理外匯業務機關是中央銀行。 管理外匯之行政主管機關為財政部，掌理外匯業務機關為中央銀行。", "anchor": "read/c3"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "clause", "title": "第4條 行政主管機關辦理事項", "text": "行政主管機關辦理事項 行政主管機關辦六件事：政府及公營事業的外幣債權債務、國庫對外債務保證、軍政機關進口外匯及匯出款項審核發證、聯繫配合央行與國貿主管機關、罰鍰裁決與執行、其他外匯行政事項。 關鍵字「政府、國庫、軍政、聯繫、罰鍰」。 凡是「罰鍰的裁決與執行」，都是行政主管機關，不是央行。 管理外匯之行政主管機關辦理左列事項： 一、政府及公營事業外幣債權、債務之監督與管理；其與外國政府或國際組織有條約或協定者，從其條約或協定之規定。 二、國庫對外債務之保證、管理及其清償之稽催。 三、軍政機關進口外匯、匯出款項與借款之審核及發證。 四、與中央銀行或國際貿易主管機關有關外匯事項之聯繫及配合。 五、依本條例規定，應處罰鍰之裁決及執行。 六、其他有關外匯行政事項。", "anchor": "read/c4"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "clause", "title": "第5條 掌理外匯業務機關（央行）辦理事項", "text": "掌理外匯業務機關（央行）辦理事項 央行辦八件事：外匯調度與收支計畫、指定並督導銀行、調節外匯供需、審核民間匯出匯入款項、監督民營事業國外借款、買賣外國貨幣票據有價證券、外匯收支的核算統計分析、其他業務。 關鍵字「外國、外匯」：只要題目出現外匯調度、市場、指定銀行、買賣，就是央行。 和第4條對照：第4條是「政」，第5條是「業務」。 掌理外匯業務機關辦理左列事項： 一、外匯調度及收支計畫之擬訂。 二、指定銀行辦理外匯業務，並督導之。 三、調節外匯供需，以維持有秩序之外匯市場。 四、民間對外匯出、匯入款項之審核。 五、民營事業國外借款經指定銀行之保證、管理及清償稽、催之監督。 六、外國貨幣、票據及有價證券之買賣。 七、外匯收支之核算、統計、分析及報告。 八、其他有關外匯業務事項。", "anchor": "read/c5"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "clause", "title": "第6-1條 新臺幣五十萬元以上的申報", "text": "新臺幣五十萬元以上的申報 新臺幣五十萬元以上等值的外匯收支或交易要申報，辦法由央行定。申報事項有不實之虞時，央行可以查詢，受查詢者有據實說明的義務。 申報門檻「五十萬」。 這一條是第四章「外匯收支或交易申報辦法」的法源，罰則在第20條。 新臺幣五十萬元以上之等值外匯收支或交易，應依規定申報；其申報辦法由中央銀行定之。 依前項規定申報之事項，有事實足認有不實之虞者，中央銀行得向申報義務人查詢，受查詢者有據實說明之義務。", "anchor": "read/c6-1"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "clause", "title": "第7條 應結售或存入的外匯", "text": "應結售或存入的外匯 六類外匯要結售給央行或指定銀行，或存入指定銀行：出口貨款、勞務所得（包含保險業）、國外匯入款、核准國外投資收入、企業核准國外投資融資技術合作所得、其他。 「進」＝結售或存入（第7條）；「出」＝得提用或結購（第13條）。 保險業基於勞務取得的外匯在第二款裡。違反第7條的罰則在第20條第2項。 左列各款外匯，應結售中央銀行或其指定銀行，或存入指定銀行，並得透過該行在外匯市場出售；其辦法由財政部會同中央銀行定之： 一、出口或再出口貨品或基於其他交易行為取得之外匯。 二、航運業、保險業及其他各業人民基於勞務取得之外匯。 三、國外匯入款。 四、在中華民國境內有住、居所之本國人，經政府核准在國外投資之收入。 五、本國企業經政府核准國外投資、融資或技術合作取得之本息、淨利及技術報酬金。 六、其他應存入或結售之外匯。 華僑或外國人投資之事業，具有高級科技，可提升工業水準並促進經濟發展，經專案核准者，得逕以其所得之前項各款外匯抵付第十三條第一款、第二款及第五款至第八款規定所需支付之外匯。惟定期結算之餘額，仍應依前項規定辦理；其辦法由中央銀行定之。", "anchor": "read/c7"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "clause", "title": "第9條 出境攜帶外幣限額", "text": "出境攜帶外幣限額 出境每人可攜帶外幣的限額，由行政主管機關以命令訂定。  條文字面寫財政部，見第3條提醒。 出境之本國人及外國人，每人攜帶外幣總值之限額，由財政部以命令定之。", "anchor": "read/c9"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "clause", "title": "第11條 攜帶外幣出入國境要報明海關", "text": "攜帶外幣出入國境要報明海關 攜帶外幣出入國境要「報明海關」登記。 報明「海關」。 不報明登記的後果在第24條第3項：沒入。 旅客或隨交通工具服務之人員，攜帶外幣出入國境者，應報明海關登記；其有關辦法，由財政部會同中央銀行定之。", "anchor": "read/c11"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "clause", "title": "第13條 得提用或結購的外匯（九款）", "text": "得提用或結購的外匯（九款） 九類支出需要的外匯，可以從存入外匯自行提用，或在外匯市場購入，或向央行或指定銀行結購：進口貨款、保險業等基於交易或勞務所需費用、留學旅行就醫等、贍養國外家屬、外國人及華僑在中國投資本息淨利、核准國外借款本息、技術合作報酬金、核准國外投資或貸款、其他必要。 「付」＝第13條，九款。 第13條只是列舉「得」的用途，和第7條「應」結售不同。 左列各款所需支付之外匯，得自第七條規定之存入外匯自行提用或透過指定銀行在外匯市場購入或向中央銀行或其指定銀行結購；其辦法由財政部會同中央銀行定之： 一、核准進口貨品價款及費用。 二、航運業、保險業與其他各業人民，基於交易行為或勞務所需支付之費用及款項。 三、前往國外留學、考察、旅行、就醫、探親、應聘及接洽業務費用。 四、服務於中華民國境內中國機關及企業之本國人或外國人，贍養其在國外家屬費用。 五、外國人及華僑在中國投資之本息及淨利。 六、經政府核准國外借款之本息及保證費用。 七、外國人及華僑與本國企業技術合作之報酬金。 八、經政府核准向國外投資或貸款。 九、其他必要費用及款項。", "anchor": "read/c13"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "clause", "title": "第15條 免結匯報運進口", "text": "免結匯報運進口 五類輸入貨品，向（行政主管機關）申請核明免結匯報運進口：國外援助物資、政府國外貸款購入貨品、學校教育研究訓練機關受贈的教學研究用貨品、慈善機關受贈救濟用貨品、旅客與交通工具服務人員的隨身行李或自用貨品。 「免結匯」找行政主管機關（條文字面：財政部）。  左列國外輸入貨品，應向財政部申請核明免結匯報運進口： 一、國外援助物資。 二、政府以國外貸款購入之貨品。 三、學校及教育、研究、訓練機關接受國外捐贈，供教學或研究用途之貨品。 四、慈善機關、團體接受國外捐贈供救濟用途之貨品。 五、出入國境之旅客及在交通工具服務之人員，隨身攜帶行李或自用貨品。", "anchor": "read/c15"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "clause", "title": "第16條 餽贈品、商業樣品、非賣品", "text": "餽贈品、商業樣品、非賣品 價值不超過一定限額的餽贈品、商業樣品、非賣品，可由海關核准進口。 核准進口找「海關」。  國外輸入餽贈品、商業樣品及非賣品，其價值不超過一定限額者，得由海關核准進口；其限額由財政部會同國際貿易主管機關以命令定之。", "anchor": "read/c16"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "clause", "title": "第17條 原因消滅，存入或售還", "text": "原因消滅，存入或售還 已提用、購入或核准結匯的外匯，如果原因消滅或變更而不用付了，要依央行規定期限，存入或售還央行或指定銀行。 「存入或售還」，對象是央行或其指定銀行。  經自行提用、購入及核准結匯之外匯，如其原因消滅或變更，致全部或一部之外匯無須支付者，應依照中央銀行規定期限，存入或售還中央銀行或其指定銀行。", "anchor": "read/c17"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "clause", "title": "第18條 央行按期彙報", "text": "央行按期彙報 央行要把外匯買賣、結存、結欠、對外保證責任額，按期彙報行政主管機關。  條文字面寫財政部，見第3條提醒。 中央銀行應將外匯之買賣、結存、結欠及對外保證責任額，按期彙報財政部。", "anchor": "read/c18"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "clause", "title": "第19-1條 行政院的外匯緊急處置", "text": "行政院的外匯緊急處置 兩種情事（國內或國外經濟失調危及經濟穩定；國際收支嚴重逆差）時，行政院可決定並公告一定期間內採取：關閉外匯市場、停止或限制外匯支付、命令結售或存入指定銀行、其他必要處置。決定後十日內要送立法院追認，不同意就失效。立法院休會時，一定期間以二十日為限。 四種措施「關、停、命、其他」；時間「十日追認、休會二十日」。 第一款的「失調」是國內或國外都算；新臺幣匯率大幅波動並不在列舉情事內。 有左列情事之一者，行政院得決定並公告於一定期間內，採取關閉外匯市場、停止或限制全部或部分外匯之支付、命令將全部或部分外匯結售或存入指定銀行、或為其他必要之處置： 一、國內或國外經濟失調，有危及本國經濟穩定之虞。 二、本國國際收支發生嚴重逆差。 前項情事之處置項目及對象，應由行政院訂定外匯管制辦法。 行政院應於前項決定後十日內，送請立法院追認，如立法院不同意時，該決定應即失效。 第一項所稱一定期間，如遇立法院休會時，以二十日為限。", "anchor": "read/c19-1"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "clause", "title": "第19-2條 違反緊急處置的罰則", "text": "違反緊急處置的罰則 故意違反第19-1條措施，處新臺幣300萬元以下罰鍰；立法院不同意追認時免罰。 「三百萬以下」。  故意違反行政院依第十九條之一所為之措施者，處新臺幣三百萬元以下罰鍰。 前項規定於立法院對第十九條之一之施行不同意追認時免罰。", "anchor": "read/c19-2"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "clause", "title": "第19-3條 配合國際合作的處置", "text": "配合國際合作的處置 為配合聯合國決議或國際合作，金管會會同央行報請行政院核定後，可對與危害國際安全的國家、地區或恐怖組織相關者，在銀行業的帳戶、匯款、通貨、支付工具，禁止提款、轉帳、付款、交付、轉讓或其他必要處置。處置後十日內送立法院追認；原因消失就要解除。 對象「國家、地區、恐怖組織」；範圍「帳戶、匯款、通貨、其他支付工具」。 條文寫的是「恐怖組織」，沒有寫「洗錢組織」。 為配合聯合國決議或國際合作有必要時，行政院金融監督管理委員會（以下簡稱金管會）會同中央銀行報請行政院核定後，得對危害國際安全之國家、地區或恐怖組織相關之個人、法人、團體、機關、機構於銀行業之帳戶、匯款、通貨或其他支付工具，為禁止提款、轉帳、付款、交付、轉讓或其他必要處置。 依前項核定必要處置措施時，金管會應立即公告，並於公告後十日內送請立法院追認，如立法院不同意時，該處置措施應即失效。 採取處置措施之原因消失時，應即解除之。", "anchor": "read/c19-3"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "clause", "title": "第20條 申報不實與不結售的罰則", "text": "申報不實與不結售的罰則 第一項：違反第6-1條，故意不申報或申報不實，處3萬元以上60萬元以下罰鍰；被查詢時沒在期限內說明或做虛偽說明，也一樣。第二項：違反第7條不結售或不存入，處按行為時匯率折算金額二倍以下罰鍰，並由央行追繳外匯。 「三到六十萬」「兩倍以下並追繳」。 申報辦法第16條的處罰，就是依本條第1項。 違反第六條之一規定，故意不為申報或申報不實者，處新臺幣三萬元以上六十萬元以下罰鍰；其受查詢而未於限期內提出說明或為虛偽說明者亦同。 違反第七條規定，不將其外匯結售或存入中央銀行或其指定銀行者，依其不結售或不存入外匯，處以按行為時匯率折算金額二倍以下之罰鍰，並由中央銀行追繳其外匯。", "anchor": "read/c20"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "clause", "title": "第22條 非法買賣外匯為常業", "text": "非法買賣外匯為常業 以非法買賣外匯為常業，處三年以下有期徒刑、拘役，或科或併科與營業總額等值以下的罰金，外匯及價金沒收。業務執行人犯此，行為人要罰，法人或本人也併科罰金（雙罰）。 「三年以下」。 這是刑事責任，用「沒收」；第24條的是行政處分，用「沒入」。 以非法買賣外匯為常業者，處三年以下有期徒刑、拘役或科或併科與營業總額等值以下之罰金；其外匯及價金沒收之。 法人之代表人、法人或自然人之代理人、受僱人或其他從業人員，因執行業務，有前項規定之情事者，除處罰其行為人外，對該法人或自然人亦科以該項之罰金。", "anchor": "read/c22"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "clause", "title": "第23條 不以外匯歸還的罰鍰", "text": "不以外匯歸還的罰鍰 應追繳的外匯如果不以外匯歸還，科以相當於應追繳外匯金額以下的罰鍰。   依本條例規定應追繳之外匯，其不以外匯歸還者，科以相當於應追繳外匯金額以下之罰鍰。", "anchor": "read/c23"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "clause", "title": "第24條 沒入的四種情形", "text": "沒入的四種情形 四種都是「沒入」：違規買賣外匯（外匯與價金）、出境攜帶超過限額（超過部分）、出入國境不報明登記（全部）、申報不實（超過申報部分）。 第24條＝沒入，不是罰鍰也不是徒刑。 題目一看到第24條，先想「沒入」。 買賣外匯違反第八條之規定者，其外匯及價金沒入之。 攜帶外幣出境超過依第九條規定所定之限額者，其超過部分沒入之。 攜帶外幣出入國境，不依第十一條規定報明登記者，沒入之；申報不實者，其超過申報部分沒入之。", "anchor": "read/c24"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "clause", "title": "第26-1條 停止適用與追認", "text": "停止適用與追認 國際貿易長期順差、外匯存底鉅額累積或國際經濟重大變化時，行政院可以決定停止適用第7、13、17條。恢復適用後十日內要送立法院追認，立法院不同意就失效。 停止的是「7、13、17」三條；追認要「十日內」。 決定停止的是行政院，恢復後要送立法院追認，不是央行或總統。 本條例於國際貿易發生長期順差、外匯存底鉅額累積或國際經濟發生重大變化時，行政院得決定停止第七條、第十三條及第十七條全部或部分條文之適用。 行政院恢復前項全部或部分條文之適用後十日內，應送請立法院追認，如立法院不同意時，該恢復適用之決定，應即失效。", "anchor": "read/c26-1"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "table", "title": "第4條 vs 第5條：兩個機關各辦什麼", "text": "第4條 vs 第5條：兩個機關各辦什麼  行政主管機關（第4條） 掌理外匯業務機關＝中央銀行（第5條） 關鍵字 政府、國庫、軍政、聯繫、罰鍰 外國、外匯、市場、指定銀行 外匯債務 政府及公營事業外幣債權債務；國庫對外債務保證與稽催 民營事業國外借款的保證、管理、清償稽催之監督 審核 軍政機關進口外匯、匯出款項與借款 民間對外匯出、匯入款項 市場與業務 — 外匯調度與收支計畫、指定並督導銀行、調節供需、買賣外國貨幣票據有價證券、統計分析報告 罰鍰 罰鍰的裁決與執行 —", "anchor": "table/t0"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "table", "title": "罰則對照", "text": "罰則對照 條文 行為 處罰 第19-2條 故意違反行政院依19-1所為措施 新臺幣300萬元以下罰鍰；立法院不同意追認時免罰 第20條第1項 故意不申報、申報不實；受查詢未於限期說明或虛偽說明 新臺幣3萬元以上60萬元以下罰鍰 第20條第2項 違反第7條，不結售或不存入外匯 按行為時匯率折算金額二倍以下罰鍰，並由央行追繳外匯 第22條 以非法買賣外匯為常業 三年以下有期徒刑、拘役，或科或併科與營業總額等值以下罰金；外匯及價金沒收；法人併科 第23條 應追繳外匯不以外匯歸還 相當於應追繳外匯金額以下罰鍰", "anchor": "table/t1"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "table", "title": "第24條：沒入", "text": "第24條：沒入 行為 沒入範圍 買賣外匯違反第8條 外匯及價金 攜帶外幣出境超過第9條限額 超過部分 攜帶外幣出入國境，不依第11條報明登記 外幣全部 攜帶外幣出入國境，申報不實 超過申報部分", "anchor": "table/t2"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "table", "title": "數字與期限", "text": "數字與期限 項目 規定 條文 申報門檻 新臺幣五十萬元以上之等值外匯收支或交易 第6-1條 違反緊急處置罰鍰 新臺幣三百萬元以下 第19-2條 申報不實罰鍰 三萬元以上六十萬元以下 第20條第1項 不結售罰鍰 按行為時匯率折算金額二倍以下 第20條第2項 非法買賣外匯為常業 三年以下有期徒刑 第22條 緊急處置送立法院追認 行政院決定後十日內 第19-1條 立法院休會時一定期間 以二十日為限 第19-1條 金管會處置公告後送追認 十日內 第19-3條 恢復第7、13、17條後送追認 十日內 第26-1條", "anchor": "table/t3"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "card", "title": "管理外匯條例的立法目的？", "text": "管理外匯條例的立法目的？ 平衡國際收支、穩定金融、實施外匯管理。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "card", "title": "條文所稱「外匯」指什麼？誰核定外國有價證券的種類？", "text": "條文所稱「外匯」指什麼？誰核定外國有價證券的種類？ 外國貨幣、票據及有價證券；由掌理外匯業務機關（央行）核定。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "card", "title": "第3條「管理外匯之行政主管機關」，條文字面與現行管轄機關？", "text": "第3條「管理外匯之行政主管機關」，條文字面與現行管轄機關？ 條文字面是財政部；依行政院101年6月25日公告，自101年7月1日起由金管會管轄。掌理外匯業務機關為中央銀行。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "card", "title": "第4條行政主管機關辦理的六件事關鍵字？", "text": "第4條行政主管機關辦理的六件事關鍵字？ 政府（公營事業外幣債權債務）、國庫（對外債務保證與稽催）、軍政機關（進口外匯與匯出款項審核發證）、聯繫配合、罰鍰裁決與執行、其他行政事項。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "card", "title": "第5條央行辦理的事項有哪些？", "text": "第5條央行辦理的事項有哪些？ 外匯調度及收支計畫、指定並督導銀行、調節外匯供需、審核民間匯出匯入、監督民營事業國外借款、買賣外國貨幣票據有價證券、收支核算統計分析報告、其他業務。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "card", "title": "「指定銀行辦理外匯業務並督導之」是誰的職掌？", "text": "「指定銀行辦理外匯業務並督導之」是誰的職掌？ 掌理外匯業務機關（中央銀行），第5條第2款。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "card", "title": "外匯收支或交易達多少要申報？辦法誰訂？", "text": "外匯收支或交易達多少要申報？辦法誰訂？ 新臺幣五十萬元以上之等值；申報辦法由中央銀行定。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "card", "title": "第7條六類應結售中央銀行或指定銀行（或存入）的外匯？", "text": "第7條六類應結售中央銀行或指定銀行（或存入）的外匯？ 出口或再出口貨品或其他交易所得；航運業、保險業及其他各業人民基於勞務所得；國外匯入款；核准國外投資的收入；企業核准國外投資融資技術合作的本息淨利及報酬金；其他。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "card", "title": "出境攜帶外幣限額，由誰以命令定？", "text": "出境攜帶外幣限額，由誰以命令定？ 條文字面：財政部（見第3條提醒）。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "card", "title": "攜帶外幣出入國境要向誰報明登記？", "text": "攜帶外幣出入國境要向誰報明登記？ 海關。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "card", "title": "第13條「得」提用或結購外匯的支付用途共幾款？", "text": "第13條「得」提用或結購外匯的支付用途共幾款？ 九款（進口貨款、保險業等基於交易或勞務所需費用、留學旅行就醫等、贍養國外家屬、外國人及華僑在中國投資本息淨利、核准國外借款本息、技術合作報酬金、核准國外投資或貸款、其他）。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "card", "title": "學校接受國外捐贈、供教學研究用的貨品，要向誰申請免結匯報運進口？", "text": "學校接受國外捐贈、供教學研究用的貨品，要向誰申請免結匯報運進口？ 向（行政主管機關）申請核明，條文字面是財政部。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "card", "title": "價值不超過一定限額的餽贈品、商業樣品、非賣品，由誰核准進口？", "text": "價值不超過一定限額的餽贈品、商業樣品、非賣品，由誰核准進口？ 海關。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "card", "title": "外匯原因消滅或變更而無須支付，怎麼辦？", "text": "外匯原因消滅或變更而無須支付，怎麼辦？ 依央行規定期限，存入或售還央行或其指定銀行。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "card", "title": "央行要按期把外匯買賣、結存、結欠及對外保證責任額彙報給誰？", "text": "央行要按期把外匯買賣、結存、結欠及對外保證責任額彙報給誰？ 行政主管機關（條文字面：財政部）。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "card", "title": "第19-1條行政院可採取的處置？", "text": "第19-1條行政院可採取的處置？ 關閉外匯市場、停止或限制全部或部分外匯之支付、命令全部或部分外匯結售或存入指定銀行、其他必要之處置。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "card", "title": "19-1條決定後多久要送立法院追認？立法院休會時一定期間上限？", "text": "19-1條決定後多久要送立法院追認？立法院休會時一定期間上限？ 決定後十日內送請立法院追認，不同意則失效；休會時一定期間以二十日為限。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "card", "title": "故意違反19-1措施的罰則？何時免罰？", "text": "故意違反19-1措施的罰則？何時免罰？ 新臺幣三百萬元以下罰鍰；立法院不同意追認時免罰。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "card", "title": "第19-3條處置的對象與措施？", "text": "第19-3條處置的對象與措施？ 對危害國際安全之國家、地區或恐怖組織相關的個人、法人、團體、機關、機構，於銀行業之帳戶、匯款、通貨或其他支付工具，禁止提款、轉帳、付款、交付、轉讓或其他必要處置。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "card", "title": "故意不申報或申報不實，罰則？", "text": "故意不申報或申報不實，罰則？ 新臺幣三萬元以上六十萬元以下罰鍰；受查詢未於限期說明或虛偽說明亦同。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "card", "title": "違反第7條不結售或不存入外匯，罰則？", "text": "違反第7條不結售或不存入外匯，罰則？ 按行為時匯率折算金額二倍以下罰鍰，並由央行追繳外匯。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "card", "title": "以非法買賣外匯為常業，罰則？", "text": "以非法買賣外匯為常業，罰則？ 三年以下有期徒刑、拘役，或科或併科與營業總額等值以下罰金；外匯及價金沒收；法人、本人併科罰金。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "card", "title": "應追繳外匯而不以外匯歸還，罰則？", "text": "應追繳外匯而不以外匯歸還，罰則？ 科以相當於應追繳外匯金額以下之罰鍰。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "card", "title": "第24條的處分是什麼？分哪四種情形？", "text": "第24條的處分是什麼？分哪四種情形？ 沒入。違規買賣外匯（外匯及價金）；出境攜帶超過限額（超過部分）；出入國境不報明登記（全部）；申報不實（超過申報部分）。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "card", "title": "第26-1條可以停止適用哪三條？誰決定？恢復後怎麼辦？", "text": "第26-1條可以停止適用哪三條？誰決定？恢復後怎麼辦？ 行政院決定停止第7、13、17條；恢復適用後十日內送立法院追認，不同意即失效。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "scen", "title": "旅客入境攜帶外幣，沒有向海關報明登記，被查獲。依第24條，處分是？", "text": "旅客入境攜帶外幣，沒有向海關報明登記，被查獲。依第24條，處分是？ 處新臺幣三百萬元以下罰鍰 沒入 處三年以下有期徒刑 處新臺幣三萬元以上六十萬元以下罰鍰 第24條第3項：攜帶外幣出入國境，不依第11條規定報明登記者，沒入之；申報不實者，其超過申報部分沒入之。", "anchor": "quiz"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "scen", "title": "某人為達避稅目的，對新臺幣五十萬元以上的外匯收支故意申報不實。依第20條第1項，罰則是？", "text": "某人為達避稅目的，對新臺幣五十萬元以上的外匯收支故意申報不實。依第20條第1項，罰則是？ 處新臺幣一萬元以上二十萬元以下罰鍰 處新臺幣三萬元以上六十萬元以下罰鍰 處新臺幣五萬元以上八十萬元以下罰鍰 沒入其外匯 第20條第1項：違反第6-1條，故意不為申報或申報不實者，處新臺幣三萬元以上六十萬元以下罰鍰；受查詢時未於限期說明或虛偽說明亦同。", "anchor": "quiz"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "scen", "title": "某人長期私下替人買賣外匯營利，構成「以非法買賣外匯為常業」。依第22條，下列何者正確？", "text": "某人長期私下替人買賣外匯營利，構成「以非法買賣外匯為常業」。依第22條，下列何者正確？ 處三年以下有期徒刑、拘役或科或併科與營業總額等值以下之罰金，外匯及價金沒收 僅處罰鍰 僅沒入外匯 處一年以下有期徒刑 第22條：處三年以下有期徒刑、拘役或科或併科與營業總額等值以下之罰金；其外匯及價金沒收之。", "anchor": "quiz"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "scen", "title": "依第2條，「外匯」的定義是？", "text": "依第2條，「外匯」的定義是？ 外國貨幣、票據及有價證券 外國貨幣、票據、有價證券及黃金 外國貨幣及黃金 外國貨幣及存款 第2條第1項：本條例所稱外匯，指外國貨幣、票據及有價證券。", "anchor": "quiz"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "scen", "title": "「調節外匯供需，以維持有秩序之外匯市場」，依第5條屬於誰的職掌？", "text": "「調節外匯供需，以維持有秩序之外匯市場」，依第5條屬於誰的職掌？ 行政主管機關 掌理外匯業務機關（中央銀行） 國際貿易主管機關 海關 第5條第3款：掌理外匯業務機關辦理調節外匯供需，以維持有秩序之外匯市場。", "anchor": "quiz"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "scen", "title": "行政院依第19-1條決定關閉外匯市場。依條文，決定後要怎麼做？", "text": "行政院依第19-1條決定關閉外匯市場。依條文，決定後要怎麼做？ 十日內送立法院追認，不同意則失效 三十日內送總統府備查 由央行自行公告即可 不需要任何追認 第19-1條第3項：行政院應於決定後十日內，送請立法院追認，如立法院不同意時，該決定應即失效。", "anchor": "quiz"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "scen", "title": "某人故意違反行政院依第19-1條採取的外匯措施，但後來立法院不同意追認該措施。依第19-2條，這個人？", "text": "某人故意違反行政院依第19-1條採取的外匯措施，但後來立法院不同意追認該措施。依第19-2條，這個人？ 仍處三百萬元以下罰鍰 免罰 處一百萬元以下罰鍰 處三年以下有期徒刑 第19-2條第2項：前項規定於立法院對第19-1條之施行不同意追認時免罰。", "anchor": "quiz"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "scen", "title": "國際貿易長期順差、外匯存底鉅額累積時，誰可以決定停止第7、13、17條的適用？恢復適用後怎麼辦？", "text": "國際貿易長期順差、外匯存底鉅額累積時，誰可以決定停止第7、13、17條的適用？恢復適用後怎麼辦？ 中央銀行；恢復後公告即可 行政院；恢復後十日內送立法院追認 立法院；恢復後送總統公告 總統；恢復後送行政院核定 第26-1條：行政院得決定停止第7、13、17條的適用；恢復後十日內送請立法院追認，不同意該恢復適用的決定即失效。", "anchor": "quiz"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "scen", "title": "某人違反第7條規定，不將其出口貨款外匯結售或存入央行或其指定銀行。依第20條第2項，處分是？", "text": "某人違反第7條規定，不將其出口貨款外匯結售或存入央行或其指定銀行。依第20條第2項，處分是？ 沒入全部外匯 按行為時匯率折算金額二倍以下罰鍰，並由央行追繳外匯 三年以下有期徒刑 新臺幣三萬元以上六十萬元以下罰鍰 第20條第2項：違反第7條不結售或不存入者，依其不結售或不存入外匯，處按行為時匯率折算金額二倍以下罰鍰，並由中央銀行追繳其外匯。", "anchor": "quiz"}, {"file": "ch03.html", "chTitle": "第3章 管理外匯條例", "type": "scen", "title": "旅客攜帶外幣出入國境，依第11條應向誰報明登記？", "text": "旅客攜帶外幣出入國境，依第11條應向誰報明登記？ 金管會 中央銀行 海關 銀行 第11條：旅客或隨交通工具服務之人員，攜帶外幣出入國境者，應報明海關登記。", "anchor": "quiz"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "clause", "title": "第1條 訂定依據", "text": "訂定依據 法源是管理外匯條例第6-1條第1項。 法源「六條之一」。  本辦法依管理外匯條例（以下簡稱本條例）第六條之一第一項規定訂定之。", "anchor": "read/c1"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "clause", "title": "第2條 誰要申報、怎麼申報", "text": "誰要申報、怎麼申報 新臺幣五十萬元以上等值外匯收支或交易的資金所有者或需求者，是申報義務人。辦理新臺幣結匯申報時，要依合約等證明文件「誠實填妥」申報書，經由「銀行業」向「中央銀行」申報。 申報路線「申報義務人→銀行業→央行」。 題目問「向誰申報」，答案是經由銀行業向中央銀行，不是向金管會，也不是向銀行以外的機構。 中華民國境內新臺幣五十萬元以上等值外匯收支或交易之資金所有者或需求者（以下簡稱申報義務人），應依本辦法申報。 下列各款所定之人，均視同申報義務人： 一、法定代理人依第六條第二項規定代辦結匯申報者。 二、公司或個人依第九條第一項規定，以自己名義為他人辦理結匯申報者。 三、非居住民法人之中華民國境內代表人或代理人依第十條第二項規定代辦結匯申報者。 四、非居住民之中華民國境內代理人依第十條第三項規定代辦結匯申報者。 五、非前項所定之申報義務人，且不符合得代辦結匯申報之規定而為結匯申報者。 申報義務人辦理新臺幣結匯申報時，應依據外匯收支或交易有關合約等證明文件，誠實填妥「外匯收支或交易申報書」（以下簡稱申報書）（申報書樣式如附件），經由銀行業向中央銀行（以下簡稱本行）申報。 外匯收支或交易結匯申報所涉須計入或得不計入申報義務人或委託人當年累積結匯金額之範圍，應依本辦法、銀行業輔導客戶申報外匯收支或交易應注意事項、外匯證券商輔導客戶申報外匯收支或交易應注意事項、本行或其他主管機關同意或核准函載明事項，以及本行其他規定辦理。", "anchor": "read/c2"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "clause", "title": "第3條 名詞定義", "text": "名詞定義 「銀行業」包含六類：銀行、全國農業金庫、信用合作社、農會信用部、漁會信用部、中華郵政。外匯證券商、電子支付機構是另外的定義，不屬於銀行業。個人指年滿十八歲且領有身分證或有效期限一年以上居留證的自然人。 銀行業六類「銀、庫、信、農、漁、郵」。 保險業、證券商都不在「銀行業」定義裡。 本辦法所用名詞定義如下： 一、銀行業：指經本行許可辦理外匯業務之銀行、全國農業金庫股份有限公司、信用合作社、農會信用部、漁會信用部及中華郵政股份有限公司。 二、外匯證券商：指證券業辦理外匯業務管理辦法所稱之外匯證券商。 三、電子支付機構：指經金融監督管理委員會許可經營電子支付機構管理條例第四條第一項業務且涉及辦理外匯業務之電子支付機構。 四、公司：指依中華民國法令在中華民國組織登記成立之公司，其與所有分公司應以該公司統一編號及名義辦理申報；或外國公司在中華民國境內依法辦理設立登記之分公司，其與全部境內分公司視為同一申報義務人，並以配發統一編號之首家分公司名義辦理申報。 五、有限合夥：指依中華民國法令在中華民國組織登記之有限合夥，其與所有分支機構應以該有限合夥統一編號及名義辦理申報；或外國有限合夥在中華民國境內依法辦理設立登記之分支機構，其與全部境內分支機構視為同一申報義務人，並以配發統一編號之首家分支機構名義辦理申報。 六、行號：指依中華民國商業登記法登記之獨資或合夥經營之營利事業。 七、團體：指依中華民國法令經主管機關核准設立之團體。 八、辦事處：指外國公司在中華民國境內依法辦理設置之在臺代表人辦事處。 九、事務所：指外國財團法人經中華民國政府認許並在中華民國境內依法辦理設置登記之事務所。 十、個人：指年滿十八歲領有中華民國國民身分證、臺灣地區相關居留證或外僑居留證證載有效期限一年以上之自然人。 十一、非居住民： （一）非居住民自然人：指未領有臺灣地區相關居留證或外僑居留證，或領有相關居留證但證載有效期限未滿一年之非中華民國國民，或持有中華民國護照但未領有中華民國國民身分證之無本國戶籍者。 （二）非居住民法人：指境外非中華民國法人。", "anchor": "read/c3"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "clause", "title": "第4條 逕行辦理新臺幣結匯", "text": "逕行辦理新臺幣結匯 填好申報書就可以「逕行辦理」的五類：出口或對非居住民提供服務收入、進口或償付非居住民服務支出、每年累積未超過上限的結購結售、辦事處或事務所的無營運收入辦公費用、非居住民每筆未超過十萬美元。出進口貨品與服務、以及第5條第4款的金額，不計入當年累積結匯金額。 逕行辦理五類：「出、進、累積、辦事處、非居住民」。 條文印出來的上限是五千萬、五百萬美元；央行2024年調整為一億、一千萬美元，見上方提醒。 下列外匯收支或交易，申報義務人得於填妥申報書後，逕行辦理新臺幣結匯申報。但屬於第五條規定之外匯收支或交易，應經銀行業確認申報書記載事項與該筆外匯收支或交易有關合約、核准函或其他證明文件相符後，始得辦理： 一、公司、行號、團體及個人出口貨品或對非居住民提供服務收入之匯款。 二、公司、行號、團體及個人進口貨品或償付非居住民提供服務支出之匯款。 三、公司、行號每年累積結購或結售金額未超過等值五千萬美元之匯款；團體、個人每年累積結購或結售金額未超過等值五百萬美元之匯款。但本行得視經濟金融情況及維持外匯市場秩序之需要，指定特定匯款性質之外匯收支或交易每年累積結購或結售金額超過一定金額者，應依第六條第一項規定辦理。 四、辦事處或事務所結售在臺無營運收入辦公費用之匯款。 五、非居住民每筆結購或結售金額未超過等值十萬美元之匯款。但境外非中華民國金融機構不得以匯入款項辦理結售。 前項第一款、第二款及第五條第四款之結購或結售金額，不計入申報義務人當年累積結匯金額。 申報義務人為第一項第一款及第二款出、進口貨品之外匯收支或交易以跟單方式辦理新臺幣結匯者，以銀行業掣發之出、進口結匯證實書，視同申報書。", "anchor": "read/c4"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "clause", "title": "第5條 須檢附證明文件並經銀行業確認", "text": "須檢附證明文件並經銀行業確認 七類要檢附證明文件、由銀行業確認後才能辦：公司、行號每筆達一百萬美元以上；團體、個人每筆達五十萬美元以上；經核准的直接投資、證券投資、期貨交易；境內交易但標的涉及境外貨品或服務；第一上市（櫃）等外國公司原始外籍股東匯出售股價款；民營事業中長期外債動支及還本付息；其他規定。 每筆「公司百萬、個人五十萬」。 這一條是「銀行業確認」，不是央行核准。央行核准在第6條。 下列外匯收支或交易，申報義務人應檢附與該筆外匯收支或交易有關合約、核准函或其他證明文件，並經銀行業確認與申報書記載事項相符後，始得辦理新臺幣結匯申報： 一、公司、行號每筆結匯金額達等值一百萬美元以上之匯款。 二、團體、個人每筆結匯金額達等值五十萬美元以上之匯款。 三、經有關主管機關核准直接投資、證券投資及期貨交易之匯款。 四、於中華民國境內之交易，其交易標的涉及中華民國境外之貨品或服務之匯款。 五、中華民國境內第一上市（櫃）公司及登錄興櫃之外國公司之原始外籍股東匯出售股價款之匯款。 六、民營事業中長期外債動支匯入資金及還本付息之匯款。 七、依本行其他規定應檢附證明文件供銀行業確認之匯款。", "anchor": "read/c5"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "clause", "title": "第6條 須向央行申請核准", "text": "須向央行申請核准 四類要經由銀行業向央行申請核准：每年累積超過上限的必要性匯款；未滿十八歲每筆達新臺幣五十萬元以上；非居住民四種款項（工程款、擔保金與仲裁費、不動產、遺產保險金撫卹金）每筆超過十萬美元；其他必要性匯款。未滿十八歲的，除已結婚者外，由法定代理人代辦並共同簽章。 第6條＝央行核准；非居住民四款「工、保、產、遺」（工程、擔保、不動產、遺產保險金撫卹金）。 第6條和第4條的上限是同一組數字：第4條是「未超過」可逕行，第6條是「超過」要核准。 下列外匯收支或交易，申報義務人應於檢附所填申報書及相關證明文件，經由銀行業向本行申請核准後，始得辦理新臺幣結匯申報： 一、公司、行號每年累積結購或結售金額超過等值五千萬美元之必要性匯款；團體、個人每年累積結購或結售金額超過等值五百萬美元之必要性匯款。 二、未滿十八歲領有中華民國國民身分證、臺灣地區相關居留證或外僑居留證證載有效期限一年以上之自然人，每筆結匯金額達等值新臺幣五十萬元以上之匯款。 三、下列非居住民每筆結匯金額超過等值十萬美元之匯款： （一）於中華民國境內承包工程之工程款。 （二）於中華民國境內因法律案件應提存之擔保金及仲裁費。 （三）經有關主管機關許可或依法取得自用之中華民國境內不動產等之相關款項。 （四）於中華民國境內依法取得之遺產、保險金及撫卹金。 四、其他必要性之匯款。 辦理前項第二款所定匯款之結匯申報者，除已結婚者外，應由其法定代理人代為辦理，並共同於申報書之「申報義務人及其負責人簽章」處簽章。", "anchor": "read/c6"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "clause", "title": "第7條 金額可由央行調整", "text": "金額可由央行調整 第4條第1項第3款本文與第6條第1項第1款的金額（每年累積的上限），央行可以視情況調整。 調整的是「每年累積」金額，不是每筆金額，也不是非居住民的十萬美元。 2024年央行已調整，見上方提醒。 第四條第一項第三款本文及前條第一項第一款規定之金額，本行得視經濟金融情況及維持外匯市場秩序之需要調整之。", "anchor": "read/c7"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "clause", "title": "第8條 櫃檯辦理與保存", "text": "櫃檯辦理與保存 櫃檯辦理時，銀行業要查驗身分文件、輔導填報並簽章；申報書及文件要妥善保存備查，至少保存五年。 保存「五年」。  申報義務人至銀行業櫃檯辦理新臺幣結匯申報者，銀行業應查驗身分文件或基本登記資料，輔導申報義務人填報申報書，辦理申報事宜，並應在申報書之「銀行業或外匯證券商負責輔導申報義務人員簽章」欄簽章。 銀行業對申報義務人至銀行業櫃檯辦理新臺幣結匯申報所填報之申報書及提供之文件，應妥善保存備供稽核及查詢，其保存期限至少為五年。", "anchor": "read/c8"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "clause", "title": "第11條 網際網路申報", "text": "網際網路申報 公司、行號、團體和個人都可以利用網際網路向央行申報，但要先向銀行業申請並辦理約定事項。銀行業對電子申報紀錄及書面、傳真、影像掃描文件，也要保存至少五年。 網路申報前先「約定」；保存同樣「五年」。  下列申報義務人辦理新臺幣結匯申報，得利用網際網路，經由本行核准透過電子或通訊設備辦理外匯業務之銀行業，以電子文件向本行申報： 一、公司、行號或團體。 二、個人。 申報義務人利用網際網路辦理新臺幣結匯申報事宜前，應向銀行業申請並辦理相關約定事項。 銀行業應依下列規定受理網際網路申報事項： 一、於網路提供申報書樣式及填寫之輔導說明。 二、就申報義務人填具之申報書確認電子簽章相符後，依據該申報書內容，製作本行規定格式之買、賣匯水單資料報送本行，並以該資料視同申報義務人向本行申報。 三、對申報義務人以電子訊息所為之外匯收支或交易申報紀錄及提供之書面、傳真或影像掃描文件，應妥善保存備供稽核、查詢及列印，其保存期限至少為五年。", "anchor": "read/c11"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "clause", "title": "第13條 申報後的更正", "text": "申報後的更正 申報後原則上不得要求更改。例外兩種可經銀行業向央行申請更正：非故意申報不實，經舉證並檢具律師、會計師或銀行業出具無故意申報不實意見書；故意申報不實，已依管理外匯條例第20條第1項處罰。 例外兩種「無故意（三種人出意見書）」「已受罰」。 意見書出具者是律師、會計師或銀行業，不是法院，也不是保險業。 申報義務人於辦理新臺幣結匯申報後，不得要求更改申報書內容。但有下列情形之一者，可經由銀行業向本行申請更正： 一、申報義務人非故意申報不實，經舉證並檢具律師、會計師或銀行業出具無故意申報不實意見書。 二、因故意申報不實，已依本條例第二十條第一項規定處罰。 依第四條第三項規定作成之結匯證實書如與憑以掣發之證明文件不符時，其更正準用第十四條第二項規定。", "anchor": "read/c13"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "clause", "title": "第15條 央行得查詢", "text": "央行得查詢 申報事項有不實之虞時，央行可以向申報義務人及相關的人查詢，受查詢者有據實說明的義務。 查詢找「本行」。  依本辦法規定申報之事項，有事實足認有申報不實之虞者，本行得向申報義務人及相關之人查詢，受查詢者有據實說明之義務。", "anchor": "read/c15"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "clause", "title": "第16條 故意不申報、不實的處罰", "text": "故意不申報、不實的處罰 故意不申報、申報不實，或被查詢時未於限期內說明或虛偽說明，依管理外匯條例第20條第1項處罰（新臺幣三萬元以上六十萬元以下罰鍰）。 四種行為：不申報、申報不實、未於限期說明、虛偽說明。  申報義務人故意不為申報、申報不實，或受查詢而未於限期內提出說明或為虛偽說明者，依本條例第二十條第一項規定處罰。", "anchor": "read/c16"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "table", "title": "結匯金額速查（依2024年央行調整後的上限）", "text": "結匯金額速查（依2024年央行調整後的上限） 項目 公司、行號 團體、個人 每年累積：未超過可逕行辦理（第4條第1項第3款） 1 億美元（條文原文 5,000 萬） 1,000 萬美元（條文原文 500 萬） 每年累積：超過者的必要性匯款，須經銀行業向央行申請核准（第6條第1項第1款） 超過 1 億美元 超過 1,000 萬美元 每筆：達此金額須檢附證明文件，經銀行業確認（第5條） 100 萬美元以上 50 萬美元以上", "anchor": "table/t0"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "table", "title": "其他身分的門檻", "text": "其他身分的門檻 身分 情形 辦理方式 條文 非居住民 每筆結購或結售未超過等值 10 萬美元 逕行辦理（境外非中華民國金融機構不得以匯入款項辦理結售） 第4條第1項第5款 非居住民 工程款、擔保金與仲裁費、不動產款項、遺產保險金及撫卹金，每筆超過 10 萬美元 向央行申請核准 第6條第1項第3款 未滿十八歲（領有身分證或有效居留證） 每筆達新臺幣 50 萬元以上 向央行申請核准；除已結婚者外由法定代理人代辦並共同簽章 第6條第1項第2款、第2項 辦事處、事務所 結售在臺無營運收入辦公費用 逕行辦理 第4條第1項第4款", "anchor": "table/t1"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "table", "title": "三種辦理方式", "text": "三種辦理方式 方式 做法 典型情形 條文 逕行辦理 填妥申報書即可 出進口貨品與服務；每年累積未超過上限；非居住民每筆未超過十萬美元 第4條 銀行業確認 檢附證明文件，經銀行業確認與申報書相符 公司每筆達一百萬美元、個人每筆達五十萬美元、核准的投資匯款等 第5條 央行核准 經銀行業向央行申請核准 每年累積超過上限、未滿十八歲每筆達新臺幣五十萬元、非居住民四款超過十萬美元 第6條", "anchor": "table/t2"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "table", "title": "更正申報書（第13條）", "text": "更正申報書（第13條） 情形 要求 誰出具意見書 原則 不得要求更改申報書內容 — 例外一：非故意申報不實 經舉證並檢具無故意申報不實意見書 律師、會計師或銀行業 例外二：故意申報不實 已依管理外匯條例第20條第1項處罰 —", "anchor": "table/t3"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "table", "title": "外幣保單的結匯（跨章節整理）", "text": "外幣保單的結匯（跨章節整理） 情形 誰辦結匯 依據 外幣保單的保險費（需以新臺幣結購外幣） 要保人（推論：保險費由要保人繳付） 保險業辦理外匯業務管理辦法第13條第1項 外幣保單的保險給付、滿期給付（外匯存款結售為新臺幣） 受益人（推論：給付由受益人領取） 同上 兩者辦理方式 依本辦法，逕向銀行業辦理 同上", "anchor": "table/t4"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "table", "title": "數字與期限", "text": "數字與期限 項目 規定 條文 申報義務人門檻 新臺幣五十萬元以上等值外匯收支或交易 第2條 申報書及文件保存 至少五年 第8條第2項；第11條第3項第3款 個人年齡 年滿十八歲 第3條第10款 未滿十八歲須核准 每筆達新臺幣五十萬元 第6條第1項第2款 非居住民 每筆十萬美元 第4條第1項第5款；第6條第1項第3款", "anchor": "table/t5"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "card", "title": "本辦法依哪一條訂定？", "text": "本辦法依哪一條訂定？ 管理外匯條例第6-1條第1項。", "anchor": "cards"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "card", "title": "誰是申報義務人？門檻多少？", "text": "誰是申報義務人？門檻多少？ 新臺幣五十萬元以上等值外匯收支或交易的資金所有者或需求者。", "anchor": "cards"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "card", "title": "辦理新臺幣結匯申報，要經由誰向誰申報？", "text": "辦理新臺幣結匯申報，要經由誰向誰申報？ 經由銀行業向中央銀行申報。", "anchor": "cards"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "card", "title": "申報書的填寫原則？", "text": "申報書的填寫原則？ 依外匯收支或交易有關合約等證明文件，誠實填妥申報書。", "anchor": "cards"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "card", "title": "「銀行業」包含哪六類？", "text": "「銀行業」包含哪六類？ 銀行、全國農業金庫、信用合作社、農會信用部、漁會信用部、中華郵政。", "anchor": "cards"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "card", "title": "「個人」的年齡與證件要件？", "text": "「個人」的年齡與證件要件？ 年滿十八歲，領有中華民國國民身分證、臺灣地區相關居留證或外僑居留證證載有效期限一年以上之自然人。", "anchor": "cards"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "card", "title": "第4條：填妥申報書就可逕行辦理的五類？", "text": "第4條：填妥申報書就可逕行辦理的五類？ 出口貨品或對非居住民提供服務收入；進口貨品或償付非居住民服務支出；每年累積結購結售未超過上限；辦事處或事務所無營運收入辦公費用；非居住民每筆未超過十萬美元。", "anchor": "cards"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "card", "title": "每年累積結匯上限（2024年調整後）？", "text": "每年累積結匯上限（2024年調整後）？ 公司、行號 1 億美元；團體、個人 1,000 萬美元（條文原文印的是 5,000 萬與 500 萬）。", "anchor": "cards"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "card", "title": "哪些金額不計入當年累積結匯金額？", "text": "哪些金額不計入當年累積結匯金額？ 第4條第1項第1款、第2款（出進口貨品與服務）及第5條第4款（境內交易但標的涉及境外貨品或服務）。", "anchor": "cards"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "card", "title": "非居住民每筆未超過多少美元可以逕行辦理？有什麼但書？", "text": "非居住民每筆未超過多少美元可以逕行辦理？有什麼但書？ 十萬美元；但境外非中華民國金融機構不得以匯入款項辦理結售。", "anchor": "cards"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "card", "title": "第5條要檢附證明文件、經銀行業確認的每筆金額門檻？", "text": "第5條要檢附證明文件、經銀行業確認的每筆金額門檻？ 公司、行號每筆達一百萬美元以上；團體、個人每筆達五十萬美元以上。", "anchor": "cards"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "card", "title": "第5條還包含哪些類型的匯款？", "text": "第5條還包含哪些類型的匯款？ 核准的直接投資、證券投資及期貨交易；境內交易但標的涉及境外貨品或服務；第一上市（櫃）等外國公司原始外籍股東匯出售股價款；民營事業中長期外債動支及還本付息；其他規定。", "anchor": "cards"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "card", "title": "第6條哪四類要向央行申請核准？", "text": "第6條哪四類要向央行申請核准？ 每年累積超過上限的必要性匯款；未滿十八歲每筆達新臺幣五十萬元；非居住民四款每筆超過十萬美元；其他必要性匯款。", "anchor": "cards"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "card", "title": "非居住民每筆超過十萬美元要核准的四款？", "text": "非居住民每筆超過十萬美元要核准的四款？ 承包工程款；擔保金及仲裁費；自用不動產等相關款項；遺產、保險金及撫卹金。", "anchor": "cards"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "card", "title": "未滿十八歲者的結匯由誰辦理？", "text": "未滿十八歲者的結匯由誰辦理？ 除已結婚者外，由法定代理人代辦，並共同在申報書簽章。", "anchor": "cards"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "card", "title": "第7條的金額調整權在誰？調整哪些金額？", "text": "第7條的金額調整權在誰？調整哪些金額？ 央行；第4條第1項第3款本文與第6條第1項第1款（每年累積的金額）。", "anchor": "cards"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "card", "title": "銀行業對櫃檯申報書及文件的保存期限？", "text": "銀行業對櫃檯申報書及文件的保存期限？ 至少五年。", "anchor": "cards"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "card", "title": "網際網路申報的對象？有什麼前置作業？", "text": "網際網路申報的對象？有什麼前置作業？ 公司、行號、團體及個人；先向銀行業申請並辦理相關約定事項。電子申報紀錄及文件保存至少五年。", "anchor": "cards"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "card", "title": "申報後可以更改申報書嗎？例外？", "text": "申報後可以更改申報書嗎？例外？ 原則不得；例外：非故意申報不實（舉證並檢具律師、會計師或銀行業出具無故意申報不實意見書）、故意申報不實但已依管理外匯條例第20條第1項處罰。", "anchor": "cards"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "card", "title": "誰可以查詢申報不實之虞的事項？", "text": "誰可以查詢申報不實之虞的事項？ 中央銀行（本行）；受查詢者有據實說明的義務。", "anchor": "cards"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "card", "title": "故意不申報、申報不實，依什麼處罰？", "text": "故意不申報、申報不實，依什麼處罰？ 依管理外匯條例第20條第1項處罰（三萬元以上六十萬元以下罰鍰）。", "anchor": "cards"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "scen", "title": "某公司單筆結匯 150 萬美元，當年累積金額遠低於上限，也沒有其他特殊情形。依第5條，應如何辦理？", "text": "某公司單筆結匯 150 萬美元，當年累積金額遠低於上限，也沒有其他特殊情形。依第5條，應如何辦理？ 填妥申報書即可逕行辦理 檢附證明文件，經銀行業確認與申報書相符後辦理 必須向央行申請核准 不能辦理 第5條第1款：公司、行號每筆結匯金額達等值一百萬美元以上，要檢附證明文件並經銀行業確認。央行核准則是第6條的情形。", "anchor": "quiz"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "scen", "title": "某個人單筆結匯 60 萬美元（非貨品進出口，也非核准投資）。依第5條，下列何者正確？", "text": "某個人單筆結匯 60 萬美元（非貨品進出口，也非核准投資）。依第5條，下列何者正確？ 免證明文件，逕行辦理 檢附證明文件，經銀行業確認後辦理 向金管會申請核准 向央行申請核准 第5條第2款：團體、個人每筆結匯金額達等值五十萬美元以上，要檢附證明文件並經銀行業確認。", "anchor": "quiz"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "scen", "title": "某個人今年的必要性匯款累積結匯金額已遠超過每年累積上限（約 2,000 萬美元，無論新舊制都超過）。依第6條，應如何辦理？", "text": "某個人今年的必要性匯款累積結匯金額已遠超過每年累積上限（約 2,000 萬美元，無論新舊制都超過）。依第6條，應如何辦理？ 填妥申報書逕行辦理 經由銀行業向央行申請核准後辦理 向金管會申請核准 不得辦理 第6條第1款：每年累積超過上限的必要性匯款，要檢附申報書及證明文件，經由銀行業向本行（央行）申請核准。", "anchor": "quiz"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "scen", "title": "某公司今年以新臺幣結購外幣（非貨品進出口），累計 3,000 萬美元，無論新舊制都未超過上限。依第4條，應如何辦理？", "text": "某公司今年以新臺幣結購外幣（非貨品進出口），累計 3,000 萬美元，無論新舊制都未超過上限。依第4條，應如何辦理？ 填妥申報書，逕行辦理 一律向央行申請核准 一律經銀行業確認證明文件 不得辦理 第4條第1項第3款：公司、行號每年累積結購或結售金額未超過上限，填妥申報書即可逕行辦理。", "anchor": "quiz"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "scen", "title": "一位非居住民自然人單筆結售 8 萬美元。依第4條第1項第5款，下列何者正確？", "text": "一位非居住民自然人單筆結售 8 萬美元。依第4條第1項第5款，下列何者正確？ 須向央行申請核准 未超過十萬美元，得填妥申報書逕行辦理 須有法定代理人簽章 一律不得結售 第4條第1項第5款：非居住民每筆結購或結售金額未超過等值十萬美元，可逕行辦理；但境外非中華民國金融機構不得以匯入款項辦理結售。", "anchor": "quiz"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "scen", "title": "一位非居住民因依法繼承境內遺產，單筆要結匯 15 萬美元。依第6條，應如何辦理？", "text": "一位非居住民因依法繼承境內遺產，單筆要結匯 15 萬美元。依第6條，應如何辦理？ 逕行辦理 檢附證明文件經銀行業確認即可 經由銀行業向央行申請核准 不得辦理 第6條第1項第3款第4目：非居住民於境內依法取得之遺產、保險金及撫卹金，每筆超過等值十萬美元者，要向央行申請核准。", "anchor": "quiz"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "scen", "title": "一位 17 歲、領有身分證、且未結婚的人，單筆結匯新臺幣 60 萬元。依第6條，下列何者正確？", "text": "一位 17 歲、領有身分證、且未結婚的人，單筆結匯新臺幣 60 萬元。依第6條，下列何者正確？ 逕行辦理即可 須向央行申請核准，並由法定代理人代辦、共同簽章 只要銀行業確認即可 須由金管會核准 第6條第1項第2款及第2項：未滿十八歲者每筆達新臺幣五十萬元以上，須向央行申請核准；除已結婚者外，由法定代理人代辦並共同簽章。", "anchor": "quiz"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "scen", "title": "銀行業對櫃檯辦理新臺幣結匯申報所填報的申報書及提供文件，保存期限至少多久？", "text": "銀行業對櫃檯辦理新臺幣結匯申報所填報的申報書及提供文件，保存期限至少多久？ 一年 三年 五年 七年 第8條第2項：保存期限至少為五年。網際網路申報的電子紀錄與文件，第11條第3項第3款也是至少五年。", "anchor": "quiz"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "scen", "title": "申報人辦完結匯申報後，發現申報內容有誤，確定是非故意的。依第13條，下列何者正確？", "text": "申報人辦完結匯申報後，發現申報內容有誤，確定是非故意的。依第13條，下列何者正確？ 不能更改，也沒有任何例外 可經銀行業向央行申請更正，但要舉證並檢具律師、會計師或銀行業出具的無故意申報不實意見書 可直接要求銀行業更改 由金管會核准更正 第13條：申報後原則上不得要求更改；例外之一是非故意申報不實，經舉證並檢具律師、會計師或銀行業出具無故意申報不實意見書。", "anchor": "quiz"}, {"file": "ch04.html", "chTitle": "第4章 外匯收支或交易申報辦法", "type": "scen", "title": "依第3條對「銀行業」的定義，下列何者「不屬於」銀行業？", "text": "依第3條對「銀行業」的定義，下列何者「不屬於」銀行業？ 信用合作社 農會信用部 中華郵政股份有限公司 外匯證券商 第3條第1款：銀行業＝銀行、全國農業金庫、信用合作社、農會信用部、漁會信用部、中華郵政。外匯證券商是第2款另外定義的。", "anchor": "quiz"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "clause", "title": "第2條 名詞定義與評等計算", "text": "名詞定義與評等計算 外國銀行＝全世界銀行資本或資產排名前五百名以內，或在中華民國境內設有分行的外國銀行。國內信用評等機構＝中華信評、澳商惠譽國際信評台灣分公司。「重大裁罰及處分」指金管會重大裁罰措施公布說明辦法第2條所定情事（和第六章相同的定義）。若債券沒有發行評等，原則上以發行或保證機構的評等替代，但次順位債券不得替代（見第6、7條）。   本辦法用詞定義如下： 一、外國政府：指外國之中央政府或地方政府。 二、外國銀行：指全世界銀行資本或資產排名居前五百名以內或在中華民國境內設有分行之外國銀行。 三、國外信用評等機構：指Moody's Investors Service、Standard & Poor's Corp.、Fitch Ratings Ltd.，及其他經主管機關認可之信用評等機構。 四、國內信用評等機構：指中華信用評等股份有限公司、澳洲商惠譽國際信用評等股份有限公司台灣分公司。 五、國外或大陸地區不動產：指外國或大陸地區之土地及其定著物或取得作為收益或開發該土地及興建其上定著物之相關權利。 六、控制與從屬關係：指公司法第三百六十九條之二、第三百六十九條之三及關係企業合併營業報告書關係企業合併財務報表及關係報告書編製準則第六條規範之控制與從屬關係。 七、重大裁罰及處分：指金融監督管理委員會處理違反金融法令重大裁罰措施之對外公布說明辦法第二條所定各款之情事。 本辦法所稱經國外信用評等機構評定為一定等級投資項目之投資總額，其計算方式如下： 一、該一定等級投資項目高於本辦法所定得投資之最低信用評等等級者，其投資總額應以投資時及投資後維持該一定等級，及投資後遭調升或調降評等至該一定等級者之投資項目總額合併計算。 二、該一定等級投資項目為本辦法所定得投資之最低信用評等等級者，除依前款辦理外，其投資總額並應包括投資後遭調降評等至該一定等級以下者之投資項目總額，但遭降評至非本法規定所得投資信用評等等級之投資項目，仍須依保險相關法令辦理。 第六條第一項第二款第一目、第四項第一款第一目至第三目、第七項、第七條第二項第一款至第三款、第三項第三款、第十條第一項及第十七條第一項第一款所稱債券發行評等之投資條件，如無債券發行評等，應以國外信用評等機構對該發行或保證機構之信用評等等級替代之。", "anchor": "read/c2"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "clause", "title": "第3條 得辦理的國外投資項目（八款）", "text": "得辦理的國外投資項目（八款） 八款：外匯存款、國外有價證券、外幣放款、衍生性金融商品、國外不動產、設立或投資國外保險公司（代理人、經紀人、國外籌資事業、其他核准的保險相關事業）、經行政院核定的經建計畫重大投資案、其他經主管機關核准的資金運用項目。外幣放款：除外幣保單質借外，得辦理擔任外幣聯貸參加行的擔保放款（主辦行須 BBB+ 以上），且外幣放款加計保險法第146-3條第1至3款放款總餘額，不得超過資金 35%。每一公司的股票與公司債（含以其為質的放款）合併，不得超過資金 5% 與該公司業主權益 10%。 八款「外、證、貸、衍、不、保、重、他」。 第七款（經建計畫重大投資案）須經主管機關核准（第14條）。這條和保險法第146-4條的項目不完全相同，題目會問「依哪一條」。 保險業辦理國外投資之項目，以下列為限： 一、外匯存款。 二、國外有價證券。 三、外幣放款。 四、衍生性金融商品。 五、國外不動產。 六、設立或投資國外保險公司、保險代理人公司、保險經紀人公司、以發行具資本性質之債券及其資金運用為目的之特定目的國外籌資事業（以下簡稱國外籌資事業）或其他經主管機關核准之保險相關事業。 七、經行政院核定為配合政府經濟發展政策之經建計畫重大投資案。 八、其他經主管機關核准之資金運用項目。 保險業已依保險業同業公會報經主管機關備查之自律規範，訂定經董事會通過之徵信核貸處理程序及風險管理規範，並經中央銀行許可者，除依本辦法及中央銀行相關法令規定得辦理以各該保險業所簽發外幣收付之人身保險單為質之外幣放款外，以下列擔保放款，並擔任外幣聯合貸款案之參加行為限，其主辦行之國外信用評等須為BBB+級或相當等級以上： 一、本辦法所列外國中央政府、外國銀行或信用評等達A-級或相當等級以上之國內外金融機構，或經巴塞爾銀行監督管理委員會評估得適用百分之五十以下風險權數之國際組織或多邊開發銀行提供保證之放款。 二、以不動產為擔保之放款。 三、以航空器或船舶為擔保之放款。 四、以合於第五條之有價證券為質之放款。 保險業辦理第一項第三款之放款，加計保險法第一百四十六條之三第一項第一款至第三款之放款總餘額，不得超過該保險業資金百分之三十五。 保險業投資於第一項第三款之放款，其交易條件與限額準用本法第一百四十六條之三第三項及第一百四十六條之七第一項規定。 保險業依第五條對每一公司股票及公司債之投資與依第二項第四款以該公司發行之股票及公司債為質之放款，合併計算不得超過其資金百分之五與該發行股票及公司債之公司業主權益百分之十。 保險業對外幣放款資產品質之評估、逾期放款、催收款之清理、呆帳之轉銷，應依保險業資產評估及逾期放款催收款呆帳處理辦法及相關規定辦理。 保險業辦理第一項第四款之衍生性金融商品交易，應依保險業從事衍生性金融商品交易管理辦法之規定辦理。 保險業辦理國外投資，應遵循同業公會訂定之相關自律規範。", "anchor": "read/c3"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "clause", "title": "第4條 外匯存款", "text": "外匯存款 外匯存款可以存境內銀行，也可存外國銀行；同一銀行不得超過保險業資金的 3%。 同一銀行「資金 3%」。 是「資金」的 3%，不是業主權益。 保險業資金運用於外匯存款，存放之銀行除中華民國境內之銀行外，並得存放於外國銀行。 前項存款，存放於同一銀行之金額，不得超過該保險業資金百分之三。 第一項保險業存放之外匯存款，屬保險業務需要，非為投資目的者，改依本法第一百四十六條第三項規定辦理。", "anchor": "read/c4"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "clause", "title": "第5條 可投資的國外有價證券（十四類）", "text": "可投資的國外有價證券（十四類） 十四類：外國中央政府公債、國庫券及所屬機構債；外國地方政府債及所屬機構債；外國銀行金融債、可轉讓定期存單、浮動利率中期債券；外國銀行在臺分行（含國際金融業務分行）及大陸地區銀行在臺分行發行的外幣可轉讓定期存單；本國銀行外幣金融債及外幣可轉讓定期存單；本國企業外幣公司債；外幣商業本票；外國證券集中交易市場或店頭市場交易的股權或債權憑證；國外表彰基金之有價證券；資產證券化商品；國際性組織債；國內證券市場上市或上櫃的外幣計價股權、債權憑證或伊斯蘭固定收益證券；外國上市企業發行未於外國集中或店頭市場交易的私募公司債；其他經主管機關核准的有價證券。   保險業資金得投資國外有價證券之種類如下： 一、外國中央政府發行之公債、國庫券及該政府所屬機構發行之債券。 二、外國地方政府發行或保證之債券及該政府所屬機構發行或保證之債券。 三、外國銀行發行或保證之金融債券、可轉讓定期存單、浮動利率中期債券。 四、外國銀行在臺分行（含國際金融業務分行）及大陸地區銀行在臺分行發行之外幣可轉讓定期存單。 五、本國銀行發行以外幣計價之金融債券及外幣可轉讓定期存單。 六、本國企業發行以外幣計價之公司債。 七、以外幣計價之商業本票。 八、外國證券集中交易市場或店頭市場交易之股權或債權憑證。 九、國外表彰基金之有價證券。 十、資產證券化商品。 十一、國際性組織所發行之債券。 十二、國內證券市場上市或上櫃買賣之外幣計價股權、債權憑證或伊斯蘭固定收益證券。 十三、外國上市企業發行未於外國證券集中交易市場或店頭市場交易之私募公司債。 十四、其他經主管機關核准之有價證券。", "anchor": "read/c5"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "clause", "title": "第6條 債券的投資條件與限額（外國政府、銀行、商業本票）", "text": "債券的投資條件與限額（外國政府、銀行、商業本票） 外國中央政府公債、國庫券：發行人評等須 BBB- 以上。外國中央政府所屬機構債：債券評等 AA- 以上，每一機構不超過資金 5%。外國地方政府債：評等 A- 以上、主權評等 AA- 以上，每一地方政府不超過核定國外投資額度 5%。外國銀行債：原則 BBB+ 以上；符合條件者可投資 BBB-、BB+；BBB 另有條件；次順位債不得以發行或保證銀行的評等替代。次順位銀行債限額：BB+ 級不超過核定國外投資額度 2%；BBB 至 BB+ 級不超過核定額度 7.5% 或業主權益 30% 孰高（保管比重未達 30% 為 6%、30% 以上未達 50% 為 7%，皆與業主權益 30% 孰高）；每一銀行的債券與可轉讓定期存單加計股票，不超過資金 5% 及發行銀行業主權益 10%；BBB、BBB-、BB+ 次順位債每一銀行不超過保險業業主權益 10%。外幣商業本票：BBB+ 以上，每一公司（含同公司其他證券）不超過資金 5% 及發行公司業主權益 10%。  第6條的第1項（外國中央政府公債、國庫券須 BBB- 以上）和「115年9月4日修正施行前已持有不符規定者得繼續持有、不得再增加」的但書，是新近修正的內容，題庫可能還沒更新。 保險業辦理前條第一款外國中央政府發行之公債、國庫券及該政府所屬機構發行之債券投資，應符合下列投資條件及限額規定： 一、外國中央政府發行之公債、國庫券，其發行人信用評等須經國外信用評等機構評定為BBB-級或相當等級以上。但保險業於本辦法中華民國一百十五年九月四日修正施行前已持有不符規定者，得繼續持有，且不得再增加投資該等券種。 二、外國中央政府所屬機構發行之債券： （一）該外國中央政府所屬機構須經國外信用評等機構認定中央政府支援程度在中級或相當等級以上，且該債券發行評等等級須經國外信用評等機構評定為AA-級或相當等級以上。 （二）保險業對每一外國中央政府所屬機構所發行債券之投資總額，不得超過該保險業資金之百分之五。 保險業辦理前條第二款外國地方政府發行或保證之債券投資，應符合下列投資條件及限額規定： 一、債券發行評等須經國外信用評等機構評定為A-級或相當等級以上，地方政府所屬國家之主權評等等級並須經國外信用評等機構評定為AA-級或相當等級以上。 二、投資於每一外國地方政府發行或保證之債券之總額，不得超過該保險業經核定國外投資額度百分之五。 保險業辦理前條第二款外國地方政府所屬機構發行或保證之債券投資，應符合下列投資條件及限額規定： 一、該外國地方政府所屬機構係由地方政府為執行公共事務而出資設立或依法特許設立，且地方政府得直接或間接控制其人事、財務或業務經營之機構，並由該機構執行公共事務營運所得資金或經指撥特定財源之收入作為償債財源。 二、該債券之發行、交易及資訊揭露均符合發行機構所屬國家之證券主管機關或其他依該國家證券相關法律成立且受證券主管機關監管之權責單位所定相關規定。 三、債券發行評等須經國外信用評等機構評定為A-級或相當等級以上，地方政府所屬機構所屬國家之主權評等等級並須經國外信用評等機構評定為AA-級或相當等級以上。 四、保險業投資於每一外國地方政府轄下全部外國地方政府所屬機構發行或保證之債券之總額，加計投資於同一外國地方政府發行或保證之債券之總額，不得超過該保險業經核定國外投資額度百分之五。 保險業辦理前條第三款外國銀行發行或保證之金融債券、可轉讓定期存單、浮動利率中期債券投資，應符合下列投資條件及限額規定： 一、投資條件如下： （一）債券發行評等等級須經國外信用評等機構評定為BBB+級或相當等級以上。但符合第二目或第三目規定者，不在此限。 （二）保險業符合下列條件者，得投資債券發行評等等級經國外信用評等機構評定為BBB-級、BB+級或相當等級之債券： 1.最近一年無資金運用違反本法受重大裁罰及處分，或違反情事已改正並經主管機關認可。 2.董事會下設風險管理委員會，並於公司內部設風險管理部門及置風控長一人，實際負責公司整體風險控管。 3.由董事會每年訂定風險限額，並由風險管理委員會或風險管理部門定期控管。 4.符合下列條件之一： （1）最近一期自有資本與風險資本之比率達本法第一百四十三條之四第二項第一款所定資本適足之法定標準（以下簡稱法定標準）一點二五倍以上，或其他有具體事證可證明資本健全並經主管機關同意者。 （2）經國內外信用評等機構評定最近一年信用評等等級為AA級或相當等級以上。 （三）保險業最近一期自有資本與風險資本之比率達法定標準以上且符合第二目之1及2所定條件者，得投資債券發行評等等級經國外信用評等機構評定為BBB級或相當等級之債券。 （四）債券屬次順位者，前三目所定債券發行評等等級，不得以國外信用評等機構對該債券發行或保證銀行評定之信用評等等級替代之。 二、投資限額如下： （一）投資於債券發行評等等級經國外信用評等機構評定為BB+級或相當等級之次順位債券之總額，不得超過該保險業經核定國外投資額度百分之二。 （二）投資於債券發行評等等級經國外信用評等機構評定為BBB級至BB+級或相當等級之次順位債券之總額，不得超過該保險業經核定國外投資額度百分之七點五或業主權益百分之三十孰高者。但保險業依第十六條第一項但書規定報經主管機關核准者，其委由臺灣集中保管結算所股份有限公司（以下簡稱集保公司）或最近一年經國內外信用評等機構評定信用評等等級為A-級或相當等級以上之本國金融機構及外國金融機構在臺分支機構辦理前條國外有價證券保管之金額，合計占前條國外有價證券投資金額之比重未達一定標準者，應依下列規定辦理： 1.比重未達百分之三十者，投資總額不得超過該保險業經核定國外投資額度百分之六或業主權益百分之三十孰高者。 2.比重達百分之三十以上未達百分之五十者，投資總額不得超過該保險業經核定國外投資額度百分之七或業主權益百分之三十孰高者。 （三）投資於每一銀行發行或保證之債券、可轉讓定期存單，合計投資於同一銀行所發行第七條第一項股票之總額，不得超過該保險業資金百分之五及發行銀行業主權益百分之十。 （四）投資於每一銀行發行或保證之債券發行評等等級經國外信用評等機構評定為BBB級或BBB-級或BB+級或相當等級之次順位債券之總額，不得超過該保險業業主權益百分之十。 （五）保險業符合主管機關所定條件者，得報經主管機關核准，投資於債券發行評等經國外信用評等機構評定為BBB級、BBB-級或相當等級之次順位金融債券，投資額度以該保險業經核定國外投資額度百分之三或業主權益百分之十八孰高者為限，不計入第二目投資額度。 保險業辦理前條第四款外國銀行在臺分行（含國際金融業務分行）及大陸地區銀行在臺分行發行之外幣可轉讓定期存單、第五款本國銀行發行之外幣可轉讓定期存單投資，其投資總額應計入第四條第二項規定限額。 保險業辦理前條第五款本國銀行發行以外幣計價之金融債券、第六款本國企業發行以外幣計價之公司債投資，應符合下列投資條件及限額規定： 一、投資條件準用本法第一百四十六條之一第一項第二款、第四款及第二項規定。 二、投資金額應計入本法第一百四十六條之一第一項第二款、第四款及第二項規定限額。 保險業辦理前條第七款以外幣計價之商業本票投資，其債券發行評等等級須經國外信用評等機構評定為BBB+級或相當等級以上，且應符合下列投資限額規定： 一、保險業投資於每一公司發行或保證以外幣計價之商業本票金額，合計投資於同一公司所發行或保證之符合第五條第十三款或第七條第一項各款有價證券之總額，不得超過該保險業資金百分之五及發行公司業主權益百分之十。但符合第二款規定者，不在此限。 二、保險業投資之每一公司發行或保證之公司債及商業本票，如經第三人提供保證，且符合下列情形者，其投資於該公司所發行或保證以外幣計價之商業本票金額，合計投資於該第三人所發行或保證以外幣計價之商業本票金額，以及投資於該公司及該第三人所發行或保證之符合第五條第十三款或第七條第一項各款有價證券之總額，不得超過該保險業資金百分之五及該第三人業主權益百分之十： （一）該第三人與該公司已依一般公認會計準則編製合併報表者。 （二）該第三人之業主權益金額大於該公司之業主權益金額。", "anchor": "read/c6"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "clause", "title": "第7條 外國市場交易的股權或債權憑證", "text": "外國市場交易的股權或債權憑證 四種：股票、首次公開募集（IPO）股票、公司債、非本國企業發行的存託憑證、可轉換公司債及附認股權公司債。公司債等的評等條件與第6條銀行債相同概念（BBB+ 以上為原則）。限額：BB+ 級債券總額不超過核定國外投資額度 2%；BBB- 至 BB+ 與 BBB 的合計不超過核定額度 7.5% 或業主權益 30% 孰高；每一公司的 BBB、BBB-、BB+ 債券不超過保險業業主權益 10%；股票、IPO 股票、非本國企業存託憑證、可轉換公司債及附認股權公司債的總額，不超過核定國外投資總額 40%。 「股票類四十」＝股票、IPO、存託憑證等總額不超過核定國外投資總額 40%。 四十％是「核定國外投資總額」的 40%，不是資金的 40%。 第五條第八款所稱外國證券集中交易市場或店頭市場交易之股權或債權憑證種類如下： 一、股票。 二、首次公開募集之股票。 三、公司債。 四、非本國企業發行之存託憑證、可轉換公司債及附認股權公司債。 保險業辦理前項公司債、非本國企業發行之可轉換公司債及附認股權公司債投資，應符合下列投資條件規定： 一、債券發行評等等級須經國外信用評等機構評定為BBB+級或相當等級以上。但符合第二款或第三款規定者，不在此限。 二、保險業符合前條第四項第一款第二目之1至4所定條件者，得投資債券發行評等等級經國外信用評等機構評定為BBB-級、BB+級或相當等級之債券，但無債券發行評等，依第二條第三項以發行或保證機構之信用評等等級替代，其發行或保證機構之信用評等等級為BB+級或相當等級者，應經保險業同業公會依其所定標準審定及公告並報主管機關備查。 三、保險業最近一期自有資本與風險資本之比率達法定標準以上且符合前條第四項第一款第二目之1及2所定條件者，得投資債券發行評等等級經國外信用評等機構評定為BBB級或相當等級之債券。 四、債券屬次順位者，前三款所定債券發行評等等級，不得以國外信用評等機構對該債券發行或保證公司評定之信用評等等級替代之。 保險業辦理前二項投資，應符合下列投資限額規定： 一、投資於前項第二款債券發行評等等級經國外信用評等機構評定為BB+級或相當等級債券之總額，不得超過該保險業經核定國外投資額度百分之二。 二、投資於前項第二款及第三款債券之總額，不得超過該保險業經核定國外投資額度百分之七點五或業主權益百分之三十孰高者。但保險業依第十六條第一項但書規定報經主管機關核准者，其委由集保公司或最近一年經國內外信用評等機構評定信用評等等級為A-級或相當等級以上之本國金融機構及外國金融機構在臺分支機構辦理第五條國外有價證券保管之金額，合計占第五條國外有價證券投資金額之比重未達一定標準者，應依下列規定辦理： （一）比重未達百分之三十者，投資總額不得超過該保險業經核定國外投資額度百分之六或業主權益百分之三十孰高者。 （二）比重達百分之三十以上未達百分之五十者，投資總額不得超過該保險業經核定國外投資額度百分之七或業主權益百分之三十孰高者。 三、投資於債券發行評等等級經國外信用評等機構評定為BBB+級至BB+級或相當等級之可轉換公司債及附認股權公司債之投資金額及條件，應符合第十七條之規定。 四、保險業投資於每一公司之有價證券總額，適用前條第七項規定。 五、投資於經國外信用評等機構評定為BBB級或BBB-級或BB+級或相當等級之每一公司發行或保證之債券之總額，不得超過該保險業業主權益百分之十。 六、保險業投資於第一項第一款、第二款、第四款之有價證券總額，不得超過其依本法第一百四十六條之四核定國外投資總額之百分之四十。 七、保險業符合主管機關所定條件者，得報經主管機關核准，投資於債券發行評等經國外信用評等機構評定為BBB級、BBB-級或相當等級之公司債，投資額度以該保險業經核定國外投資額度百分之三或業主權益百分之十八孰高者為限，不計入第二款投資額度。", "anchor": "read/c7"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "clause", "title": "第8條 國外表彰基金", "text": "國外表彰基金 八類：證券投資基金、指數型基金、ETF、不動產投資信託基金、對沖基金、私募基金、基礎建設基金、商品基金。國外表彰基金總額不超過核定國外投資總額 40%；其中第1至4、7、8類的每一基金，不超過保險業資金 5% 及該基金已發行總額 10%。對沖基金與私募基金：投資總額加計私募公司債合計不超過資金 2%（核定國外投資額度超過資金 40% 者為 3%）；單一基金不超過該基金已發行總額 10%；單一基金投資總額達資金萬分之五以上者，須提報董事會通過（未達新臺幣一億元以一億元計）。對沖基金經理公司：主權評等 A+ 以上、屬 IOSCO MMoU 簽署國家或地區主管機關註冊、管理對沖基金歷史滿 2 年、管理資產不少於美金 2 億元。私募基金管理機構：A+、IOSCO MMoU、歷史滿 5 年、管理資產不少於美金 5 億元（有但書）。 對沖「二年二億」、私募「五年五億」。 對沖基金不是「避險基金」以外的東西：條文寫「對沖基金」，題目寫「避險基金」時是同一類。 第五條第九款所稱國外表彰基金之有價證券種類如下： 一、證券投資基金。 二、指數型基金。 三、指數股票型基金（ETF）。 四、不動產投資信託基金。 五、對沖基金。 六、私募基金。 七、基礎建設基金。 八、商品基金。 保險業投資於國外表彰基金之有價證券總額，不得超過其依本法第一百四十六條之四核定國外投資總額之百分之四十。其投資於前項第一款至第四款、第七款及第八款之每一國外基金之總額，不得超過該保險業資金百分之五及該基金已發行總額百分之十。 保險業投資於第一項第五款及第六款對沖基金及私募基金之投資限額及條件如下： 一、投資總額加計第五條第十三款有價證券之合計數不得超過該保險業資金之百分之二。但保險業已依第十五條第四項第五款規定申請並經主管機關核定其國外投資額度超過其資金之百分之四十者，上開合計數不得超過其資金之百分之三。 二、保險業符合主管機關所定條件，得向主管機關申請不計入前款及第十七條第一項規定之投資額度，該額度以該保險業資金百分之三為限。 三、單一基金投資總額不得超過該基金已發行總額百分之十。 四、單一基金投資總額超過該保險業資金萬分之五以上者，應提報該保險業董事會通過後始得投資。但計算前述單一投資總額未達新臺幣一億元者，得以新臺幣一億元計。 五、對沖基金之基金經理公司須以在主權評等等級經國外信用評等機構評定為A+級或相當等級以上，且屬國際證券管理機構組織（IOSCO）多邊瞭解備忘錄（MMoU）之簽署國家或地區主管機關註冊者為限，且管理對沖基金歷史須滿二年以上，管理對沖基金之資產不得少於美金二億元或等值外幣。 六、私募基金之基金管理機構須以在主權評等等級經國外信用評等機構評定為A+級或相當等級以上，且屬國際證券管理機構組織（IOSCO）多邊瞭解備忘錄（MMoU）之簽署國家或地區主管機關合法註冊者為限，且管理私募基金歷史須滿五年以上，管理私募基金之資產不得少於美金五億元或等值外幣。但下列情形不在此限： （一）基金管理機構係經主管機關核准直接或間接於境外合法註冊，得從事基金管理業務之金融控股公司之投資事業。 （二）基金管理機構係於我國境內合法設立，且符合保險業經董事會通過之境內基金管理機構篩選標準，並符合下列條件之一者： 1.其所管理我國境內之全部或部分創業投資事業、私募股權基金已取得中央主管機關之推薦函或資格函，或經主管機關核准之國內證券投資信託事業運用自有資金轉投資子公司擔任私募股權基金之普通合夥人。 2.其所管理之私募股權基金已依國家發展委員會促進私募股權基金投資產業輔導管理要點申請取得資格函，且投資範圍係配合政府政策。 保險業投資於以第一項各款基金為投資標的之組合型基金，其投資條件及限額應依各類基金之規定辦理。第一項第二款所稱之指數型基金，其追蹤之指數由主管機關公告之。 第一項第六款所稱之私募基金，係指投資私募股權、私募債權及不動產之私募基金。 保險業投資於第一項第五款至第八款之投資金額及條件，應符合第十七條之規定。", "anchor": "read/c8"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "clause", "title": "第9條 資產證券化商品", "text": "資產證券化商品 資產證券化商品四類。一般規定：評等 A- 以上，總額不超過核定國外投資額度 20%，每一商品不超過資金 1%。住宅不動產抵押貸款債券：資產池債權平均信用評等分數須達 680 分。房利美、房地美、吉利美發行或保證的住宅不動產抵押貸款債券，不受上述限制，但總額不超過核定額度 50%、每一機構不超過核定額度 25%。低評等或槓桿、次級房貸的抵押債務債券，金額與條件要符合第17條。 四類「資產、商業、住宅、抵押債務」；數字「A-、20%、1%、680 分」。 20% 是「核定國外投資額度」，1% 是「資金」，兩個基準不同。 第五條第十款所稱資產證券化商品之種類如下： 一、資產基礎證券。 二、商業不動產抵押貸款債券。 三、住宅不動產抵押貸款債券。 四、抵押債務債券。 保險業投資於前項之資產證券化商品，其信用評等須經國外信用評等機構評定為A-級或相當等級以上，且其投資總額不得超過保險業經核定之國外投資額度百分之二十，對每一資產證券化商品之投資金額，不得超過保險業資金百分之一。 保險業投資於第一項第三款之住宅不動產抵押貸款債券，其資產池之債權平均信用評等分數須達六百八十分以上。 保險業投資於美國聯邦國民抵押貸款協會、聯邦住宅抵押貸款公司及美國政府國民抵押貸款協會等機構發行或保證之住宅不動產抵押貸款債券，不受第二項及前項規定限制。但其投資總額不得超過保險業經核定之國外投資額度百分之五十，每一機構之債券投資金額，不得超過保險業經核定之國外投資額度百分之二十五。 保險業投資於下列抵押債務債券，其投資金額及條件應符合第十七條之規定： 一、資產池個別資產之信用評等等級經國外信用評等機構評定未達BBB-級或相當等級之抵押債務債券。 二、資產池採槓桿融資架構，或資產池之個別資產含次級房貸或槓桿貸款之抵押債務債券。", "anchor": "read/c9"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "clause", "title": "第10條 國際性組織債與其他有價證券", "text": "國際性組織債與其他有價證券 國際性組織發行的債券：評等 A- 以上，對每一國際性組織的投資總額不超過資金 5%。國內上市櫃的外幣計價股權、債權憑證或伊斯蘭固定收益證券：投資總額加計應計入國外投資額度的合計數，不超過核定國外投資額度 145%；可贖回債券的期間，自發行日起不得低於 5 年，自次級市場取得者自交割日起不得低於 3 年（有例外）。私募公司債（第5條第13款）：須為主順位，評等 BBB+ 以上。 「國際性組織：A-、資金 5%」。  保險業投資於第五條第十一款之國際性組織發行之債券，其債券發行評等等級，須經國外信用評等機構評定為A-級或相當等級以上，且其對每一國際性組織所發行債券之投資總額，不得超過該保險業資金百分之五。 保險業投資於第五條第十二款之國內證券市場上市或上櫃買賣之外幣計價股權、債權憑證或伊斯蘭固定收益證券，應符合下列投資條件及限額規定： 一、投資條件如下： （一）應按所投資股權、債權憑證或伊斯蘭固定收益證券，分別符合第一項、第六條第一項、第二項、第四項、第六項、第七項、第七條第二項、第十七條第二項規定之投資條件。 （二）發行條件包括發行人於一定期限屆至後得贖回該債券者，自發行日起至該一定期限屆至日止之期間，不得低於五年；自次級市場取得者，自交割日起至該一定期限屆至日止之期間，不得低於三年。但保險業於本辦法修正施行前，已有投資該債券者，不在此限。 （三）前目得贖回債券，其贖回價格係由下列二者孰高決定者，不適用前目規定： 1.債券面額加計應收利息。 2.贖回當時至到期日尚未配發之利息與本金折現後之總值。 二、投資限額如下： （一）投資總額加計應計入國外投資額度之合計數，不得超過保險業經核定國外投資額度之百分之一百四十五。但保險業於本辦法修正施行時，上開合計數已超過該限額者，投資總額不得再新增投資部位。 （二）投資金額應按所投資股權、債權憑證或伊斯蘭固定收益證券，分別計入第一項、第六條第一項、第二項、第四項、第六項、第七項、第七條第三項、第十七條第一項規定限額。 三、有關伊斯蘭固定收益證券之投資總額，得以發起人業主權益作為計算基礎，其他限額規定及發行機構組織型態，應以發起人作為規範對象。 保險業投資於第五條第十三款之私募公司債，須為主順位，其債券發行評等等級，須經國外信用評等機構評定為BBB+級或相當等級以上。", "anchor": "read/c10"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "clause", "title": "第11條 國外及大陸地區不動產投資", "text": "國外及大陸地區不動產投資 只能投資「投資時已合法利用並產生利用效益」者；除自用不動產外，認定標準是出租率達 60%，並符合當地經濟環境的投資報酬率。投資總額：不超過資金 1% 及業主權益 10%；最近一期自有資本與風險資本比率達法定標準 1.25 倍以上者，不超過資金 2.5% 及業主權益 40%；達法定標準 1.5 倍以上者，不超過資金 3% 及業主權益 40%。 「六成出租率；一％／十％；二點五％；三％」。 「法定標準」指保險業資本適足性管理辦法第5條的資本適足等級：現行（2026 起新制）為資本適足率 100%，舊制是 200%。所以題庫的 250%、300% 是舊制算法（200% 的 1.25 倍、1.5 倍），現行條文寫「法定標準 1.25 倍、1.5 倍」，換成新制就是 125%、150%。 保險業對國外及大陸地區不動產之投資，以投資時已合法利用並產生利用效益者為限，並應符合下列規定： 一、最近一期自有資本與風險資本之比率達法定標準。 二、最近二年資金運用無受主管機關依本法重大裁罰及處分，及最近二年執行各項資金運用作業內部控制程序無重大違規，或違反情事及缺失事項已改正並經主管機關認可。 三、董事會設置風險管理委員會，或公司內部設置風險管理部門及風控長，實際負責公司整體風險控管。 前項投資總額不得超過保險業資金百分之一及業主權益百分之十。但保險業最近一期自有資本與風險資本之比率達法定標準一點二五倍以上者，其投資總額不得超過保險業資金百分之二點五及業主權益百分之四十；最近一期自有資本與風險資本之比率達法定標準一點五倍以上者，其投資總額不得超過保險業資金百分之三及業主權益百分之四十。 第一項所稱投資時已合法利用並產生利用效益之認定標準，除自用不動產外，係指出租率達百分之六十，並符合當地經濟環境之投資報酬率。", "anchor": "read/c11"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "clause", "title": "第11-1條 不動產投資的方式", "text": "不動產投資的方式 四種方式：以自己名義取得；經由特定目的不動產投資事業取得；經由特定目的不動產投資事業並以貸款提供資金；經由信託方式取得。特定目的不動產投資事業，指保險業百分之百持有、專以投資國外或大陸地區不動產為目的的事業。取得或處分時要有當地合格國際性鑑價機構的鑑價報告；物業管理機構以國際性物業管理機構為限。 鑑價機構限主權評等 A+ 以上國家或地區主管機關核可，或我國合法設立且在當地與我國有營業據點者；物業管理機構要在當地設立滿三年以上等條件之一。 四種「自己名義、事業、事業加貸款、信託」。 取得後要在公司網站揭露三項：所在地、市場公平價值相關證明資料、權屬狀況面積及使用情形（條文原文，與題庫一致）。 保險業得以下列方式從事國外及大陸地區不動產之投資： 一、以自己名義取得國外及大陸地區不動產。 二、經由投資特定目的不動產投資事業取得國外及大陸地區不動產。 三、經由投資特定目的不動產投資事業，並以貸款方式提供該事業所需資金取得國外及大陸地區不動產。 四、經由信託方式取得國外及大陸地區不動產。 前項所稱特定目的不動產投資事業，係指保險業報經主管機關備查或核准由保險業百分之百持有並專以投資國外或大陸地區不動產為目的之事業；所稱經由信託方式取得國外及大陸地區不動產，係指保險業報經主管機關備查或核准由保險業或其特定目的不動產投資事業與受託機構簽訂信託契約，由受託機構依信託契約內容為取得、管理、使用、收益及處分者。 保險業及特定目的不動產投資事業取得或處分其投資之國外及大陸地區不動產，應經當地合格之國際性鑑價機構出具鑑價報告，且委託管理之對象以國際性物業管理機構者為限，如係以投資特定目的不動產投資事業方式辦理者，並應由當地合格律師事務所就其適法性出具法律意見書；取得後應於公司網站揭露下列事項： 一、國外及大陸地區不動產所在地。 二、市場公平價值之相關證明資料。 三、權屬狀況、面積及使用情形。 前項鑑價機構及物業管理機構應符合下列規定： 一、鑑價機構以在主權評等等級經國外信用評等機構評定為A+級或相當等級以上國家或地區之主管機關或我國合法設立登記，並已於預定投資之國外不動產或特定目的不動產投資事業設立登記之所在地及我國設有營業據點者為限。 二、物業管理機構應符合下列條件之一，但所投資之不動產已存在既有物業管理機構且合約未到期，或所投資不動產須經同一標的其他所有權人共同決定物業管理機構者，不在此限： （一）已有公開資料可以證明該物業管理機構於保險業預定投資不動產所在地設立達三年以上且具商業大樓物業管理面積達三萬五千平方公尺以上之經驗及管理資產價值達新臺幣一百億元或等值外幣。 （二）有公開具體事證證明該物業管理機構最近一年營業收入為當地前五大之物業管理機構。 保險業依第一項規定投資國外及大陸地區不動產，應於內部控制制度中增列投資國外及大陸地區不動產之處理程序，報經董事會決議通過，修正時亦同。其處理程序，至少應包括下列內容： 一、投資方針、策略及權責單位。 二、評估、交易、管理及作業處理程序。 三、風險監控管理措施。 前項第三款所列之風險監控管理措施，其風險控管範圍應包括就國外及大陸地區不動產所在國家，參考國外信用評等機構之國家風險評等資訊制定分級控管機制，並依各級別及個別國家訂定風險限額之管理規範。 保險業從事國外不動產投資，應指派具有相關從業經驗或專業訓練人員負責，並提出投資評估報告，逐案提報董事會通過後依授權辦理。 財產保險業及人身保險業應分別依財產保險業辦理資訊公開管理辦法第十一條及人身保險業辦理資訊公開管理辦法第十一條規定，於資訊公開網頁之說明文件應記載事項項下公開揭露下列資訊： 一、經會計師覆核之從事國外及大陸地區不動產投資之投資地區、金額及損益情形，並每年更新一次。 二、第十一條之二第七項各款資料。 三、第十一條之三第三項各款資料。 保險業依第一項各款規定從事國外及大陸地區不動產投資者，應於其年度財務報告內附註揭露下列事項： 一、依第一項第一款取得國外及大陸地區不動產者，其所持有不動產所有權是否受到限制。 二、依第一項第二款及第三款取得國外及大陸地區不動產者，所投資特定目的不動產投資事業是否有違反第十一條之二第三項第二款規定之情事，以及該事業所持有不動產所有權是否受到被提供為他人債務擔保以外之其他限制。 三、依第一項第四款取得國外及大陸地區不動產者，其信託財產所有權是否受到限制。", "anchor": "read/c11-1"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "clause", "title": "第11-2條 特定目的不動產投資事業的貸款與核准", "text": "特定目的不動產投資事業的貸款與核准 以貸款提供資金：董事會三分之二以上董事出席、出席董事四分之三以上同意。對同一事業貸款總餘額不超過業主權益 10%，並與其他放款一起併計：利害關係人放款不超過業主權益 1.5 倍；同一關係人放款不超過業主權益 40%；同一關係企業放款不超過業主權益 40%。該事業各項收入（預留必要營運資金外）要在每年結算並經會計師簽證後 6 個月內匯回母公司。投資特定目的不動產投資事業，每一標的物事前逐筆向主管機關申請核准；年度終了後 3 個月內報請備查；投資架構變動等情事於事實發生後 7 日內陳報。 「貸款：2/3 出席、3/4 同意、餘額 10%」；「匯回母公司：6 個月」；「備查：3 個月」；「陳報：7 日」。 看到「逐筆」就是向主管機關申請核准。本頁未收錄第11-2條原文，上列數字已與現行官方條文核對。", "anchor": "read/c11-2"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "clause", "title": "第12條 大陸地區人民幣資金運用", "text": "大陸地區人民幣資金運用 保險業已訂定經董事會通過的大陸地區投資交易處理程序與風險監控措施，並由董事會每年訂定外匯風險管理限額、由風險管理委員會或部門定期控管者，得從
