"text": "業務員招攬外幣非投資型保險時，依第八點，要在要保書及商品簡介的哪裡揭露風險與費用事項？ 任何一頁小字 明顯處 最後一頁 附件 第八點第二款第一目：應於要保書及商品簡介明顯處揭露保險費收取方式、匯款費用之負擔及商品所涉匯率風險，以及商品幣別所屬國家之政治、經濟變動風險等。", "anchor": "quiz"}, {"file": "ch09.html", "chTitle": "第9章 銷售應注意事項（風險、費用、適合度）", "type": "scen", "title": "匯率風險說明書要用哪三種匯率情境舉例說明？", "text": "匯率風險說明書要用哪三種匯率情境舉例說明？ 最近三年的高、低、收盤 收付幣別最近十年內的最高、平均、最低 客戶選擇的三種匯率 去年同期的三種匯率 第八點第二款第二目：採收付幣別最近十年內之最高、平均及最低等三種匯率情境。", "anchor": "quiz"}, {"file": "ch09.html", "chTitle": "第9章 銷售應注意事項（風險、費用、適合度）", "type": "scen", "title": "新臺幣兌美元由 33 變成 31，下列敘述何者正確？", "text": "新臺幣兌美元由 33 變成 31，下列敘述何者正確？ 新臺幣貶值、美元升值 新臺幣升值、美元貶值 新臺幣與美元都貶值 匯率沒有變化 1 美元原本可換 33 元新臺幣，變成只能換 31 元：新臺幣升值、美元貶值。（算術判斷）", "anchor": "quiz"}, {"file": "ch09.html", "chTitle": "第9章 銷售應注意事項（風險、費用、適合度）", "type": "scen", "title": "簽約時 1 美元＝31 元新臺幣，保險金額 10 萬美元。被保險人身故領取時 1 美元＝30 元新臺幣，受益人把美元換成新臺幣。結果是？", "text": "簽約時 1 美元＝31 元新臺幣，保險金額 10 萬美元。被保險人身故領取時 1 美元＝30 元新臺幣，受益人把美元換成新臺幣。結果是？ 匯兌損失新臺幣 10 萬元 匯兌利益新臺幣 10 萬元 匯兌損失新臺幣 1 萬元 沒有影響 簽約時換算 10萬×31＝310 萬元；領取時 10萬×30＝300 萬元，少 10 萬元，是匯兌損失。（算術判斷）", "anchor": "quiz"}, {"file": "ch09.html", "chTitle": "第9章 銷售應注意事項（風險、費用、適合度）", "type": "scen", "title": "要保人要繳 1 萬美元保費，需以新臺幣結購外幣。匯率從 30 變成 32，要保人需準備的新臺幣會如何？", "text": "要保人要繳 1 萬美元保費，需以新臺幣結購外幣。匯率從 30 變成 32，要保人需準備的新臺幣會如何？ 減少新臺幣 2 萬元 增加新臺幣 2 萬元 不變 增加新臺幣 20 萬元 1萬×30＝30 萬元，1萬×32＝32 萬元，多 2 萬元新臺幣；新臺幣貶值，結購外幣要花更多新臺幣。（算術判斷）", "anchor": "quiz"}, {"file": "ch09.html", "chTitle": "第9章 銷售應注意事項（風險、費用、適合度）", "type": "scen", "title": "依第八點，銷售外幣非投資型保險前，保險公司應建立什麼，並瞭解要保人的什麼？", "text": "依第八點，銷售外幣非投資型保險前，保險公司應建立什麼，並瞭解要保人的什麼？ 商品適合度政策；需求與承受匯率風險能力 廣告審查制度；投資績效 客戶忠誠度計畫；信用評等 招攬獎金制度；年齡 第八點第四款：應瞭解要保人之需求與承受匯率風險能力，銷售前並應建立商品適合度政策。", "anchor": "quiz"}, {"file": "ch09.html", "chTitle": "第9章 銷售應注意事項（風險、費用、適合度）", "type": "scen", "title": "外幣保險商品的「客戶適合度規範」是由誰訂定的？", "text": "外幣保險商品的「客戶適合度規範」是由誰訂定的？ 金管會 中央銀行 中華民國人壽保險商業同業公會 中華民國精算學會 第九點：精算學會訂外幣保險商品精算實務處理準則；壽險公會訂客戶適合度規範。", "anchor": "quiz"}, {"file": "ch09.html", "chTitle": "第9章 銷售應注意事項（風險、費用、適合度）", "type": "scen", "title": "依金管會110年函，保險公司應多久更新一次匯率風險說明書的匯率情境？", "text": "依金管會110年函，保險公司應多久更新一次匯率風險說明書的匯率情境？ 每月一次 每半年一次 每年一次，最遲 3 月 1 日前 每三年一次 函說明三（一）：每年更新一次，更新時點至遲應於每年 3 月 1 日前完成。", "anchor": "quiz"}, {"file": "ch09.html", "chTitle": "第9章 銷售應注意事項（風險、費用、適合度）", "type": "scen", "title": "關於匯率風險說明書的法律地位，下列何者正確？", "text": "關於匯率風險說明書的法律地位，下列何者正確？ 是要保書的一部分 不是要保書的一部分，但是保險契約構成之一部分 與契約無關，只是行銷文件 只由保險公司留存，不需交給要保人 函說明三（二）：非要保書之一部分，但為保險契約構成之一部分；要保人與保險公司雙方各執一份。", "anchor": "quiz"}, {"file": "ch10.html", "chTitle": "第10章 新型態人身保險商品認定標準", "type": "clause", "title": "第一點 訂定依據", "text": "訂定依據 這份認定標準是壽險公會依保險商品銷售前程序作業準則第17條第2項訂定的。 訂定者「壽險公會」。  本認定標準由中華民國人壽保險商業同業公會（以下簡稱壽險公會）依保險商品銷售前程序作業準則第十七條第二項規定訂定之。", "anchor": "read/c一"}, {"file": "ch10.html", "chTitle": "第10章 新型態人身保險商品認定標準", "type": "clause", "title": "第二點 什麼是新型態保險商品", "text": "什麼是新型態保險商品 新型態保險商品有兩種情況：國內市場尚未有同類型，或有其他特殊事項。「同類型」指已核准、核備或備查並銷售中的商品，且維持、減少原保險範圍與給付項目，或是組合已銷售的範圍、給付項目或投資標的。「其他特殊事項」共七款，其中和外幣保險最相關的是第一款：各公司第一張以外幣收付的人身保險商品。另有五款情形不算新型態：核准時間逾一年；同類型核准時間雖未逾一年但已核准達三張；以及（三）至（五）三種特定情形。 特殊事項七款「外、失、全、結、實、分、其他」＝外幣首張、失能表、全權決定、結構型、實物給付、分紅、其他認定。不算新型態「一年、三張」。 「各公司第一張以外幣收付之人身保險商品」不分傳統型或投資型，條文只寫「人身保險商品」。「一年」與「三張」是這個版本的數字，舊版寫過六個月與兩張，見上方提醒。 新型態人身保險商品（以下簡稱新型態保險商品），指國內保險市場尚未有同類型，或有其他特殊事項之保險商品。 前項所稱同類型保險商品，指經主管機關核准、核備或備查並於保險市場銷售中之保險商品，且符合下列條件之一者： （一）維持原保險範圍、保險給付項目。 （二）減少原保險範圍、保險給付項目。 （三）組合已核准、核備或備查並銷售中之保險範圍、保險給付項目或投資標的而成。 前項所指備查之保險商品，不包含依「保險商品銷售前程序作業準則」第二十一條第一項、第二十一條之一第一項或第三項規定，以備查方式辦理之保險商品。 第一項所稱其他特殊事項，指保險商品符合下列條件之一者： （一）各公司第一張以外幣收付之人身保險商品。 （二）失能程度與保險金給付表未依示範內容規範辦理。 （三）各公司第一張由保險人全權決定運用標的之投資型保險商品。 （四）各公司第一張連結國內結構型商品之投資型保險商品或連結國內結構型商品屬新種財務工程。（如結構型商品連結投資標的之計算公式或連結標的之資產為市場上未曾採行者） （五）實物給付項目非屬殯葬服務且保險期間與保險給付期間合計超過十年之實物給付型保險商品。 （六）給付項目包括提供不參加紅利分配之非屬人壽保險保險給付項目之分紅保險商品。但各公司該同類型新型態保險商品曾經主管機關核准並於保險市場銷售中者，不在此限。 （七）其他經主管機關認定有特殊事項情形者。 符合下列條件之一者，不屬新型態保險商品： （一）新型態保險商品經主管機關核准時間逾一年。 （二）同類型新型態保險商品經主管機關核准時間雖未逾一年，惟已核准達三張。 （三）同類型保險商品另提供鼓勵機制以鼓勵被保險人落實或提升自身健康管理觀念及行為，且其鼓勵機制之辦理方式符合「人身保險商品審查應注意事項」第二百二十點之三第二項第一款及第二款規範。 （四）同類型保險商品僅縮短或取消法定傳染病之等待期間。 （五）同類型疫苗接種不良反應保險商品，其保險範圍、保險給付項目及保險金額均未逾已核准保險商品之範圍。 要保書之告知事項及聲明事項應依「人身保險要保書示範內容及注意事項」規定辦理。如因配合保險商品特性欲加列問項、聲明事項或增加問項、聲明事項之內容時，應依前開注意事項第 8  點及第 12 點規定報經主管機關核准後始得列入；如欲加列之問項、聲明事項或增加問項、聲明事項之內容經主管機關認定涉及通案性質者，應交由壽險公會研議報准後，方得增列。", "anchor": "read/c二"}, {"file": "ch10.html", "chTitle": "第10章 新型態人身保險商品認定標準", "type": "clause", "title": "第三點 認定有疑義怎麼辦", "text": "認定有疑義怎麼辦 保險公司對認定有疑義時，檢附保單條款、計算說明書、投資標的說明書等文件並說明疑義處，函請壽險公會認定。 疑義找「壽險公會」。  保險公司對新型態人身保險商品認定有疑義時，應檢附相關保險單條款、計算說明書及投資標的說明書等文件，並就認定疑義部分予以說明，函請壽險公會認定之。", "anchor": "read/c三"}, {"file": "ch10.html", "chTitle": "第10章 新型態人身保險商品認定標準", "type": "clause", "title": "第四點 範例", "text": "範例 本認定標準另有附件範例。  附件範例本頁沒有收錄。 本認定標準之範例如附件。", "anchor": "read/c四"}, {"file": "ch10.html", "chTitle": "第10章 新型態人身保險商品認定標準", "type": "table", "title": "其他特殊事項（第二點第四項，七款）", "text": "其他特殊事項（第二點第四項，七款） 款 情形 一 各公司第一張以外幣收付之人身保險商品 二 失能程度與保險金給付表未依示範內容規範辦理 三 各公司第一張由保險人全權決定運用標的之投資型保險商品 四 各公司第一張連結國內結構型商品之投資型保險商品，或連結國內結構型商品屬新種財務工程 五 實物給付項目非屬殯葬服務，且保險期間與保險給付期間合計超過十年的實物給付型保險商品 六 給付項目包括提供不參加紅利分配之非屬人壽保險給付項目的分紅保險商品（有同類型已核准銷售中的但書） 七 其他經主管機關認定有特殊事項情形者", "anchor": "table/t0"}, {"file": "ch10.html", "chTitle": "第10章 新型態人身保險商品認定標準", "type": "table", "title": "不屬新型態保險商品（第二點第五項）", "text": "不屬新型態保險商品（第二點第五項） 款 情形 一 新型態保險商品經主管機關核准時間逾一年 二 同類型新型態保險商品核准時間雖未逾一年，惟已核准達三張 三 同類型保險商品另提供鼓勵被保險人健康管理的機制，且符合審查應注意事項規定 四 同類型保險商品僅縮短或取消法定傳染病之等待期間 五 同類型疫苗接種不良反應保險商品，範圍、給付項目、保險金額均未逾已核准商品", "anchor": "table/t1"}, {"file": "ch10.html", "chTitle": "第10章 新型態人身保險商品認定標準", "type": "table", "title": "同類型保險商品（第二點第二項）", "text": "同類型保險商品（第二點第二項） 條件 意思 前提 經主管機關核准、核備或備查並於保險市場銷售中 （一） 維持原保險範圍、保險給付項目 （二） 減少原保險範圍、保險給付項目 （三） 組合已核准、核備或備查並銷售中之保險範圍、給付項目或投資標的", "anchor": "table/t2"}, {"file": "ch10.html", "chTitle": "第10章 新型態人身保險商品認定標準", "type": "card", "title": "誰訂定新型態人身保險商品認定標準？", "text": "誰訂定新型態人身保險商品認定標準？ 壽險公會，依保險商品銷售前程序作業準則第17條第2項。", "anchor": "cards"}, {"file": "ch10.html", "chTitle": "第10章 新型態人身保險商品認定標準", "type": "card", "title": "什麼是新型態人身保險商品？", "text": "什麼是新型態人身保險商品？ 國內保險市場尚未有同類型，或有其他特殊事項之保險商品。", "anchor": "cards"}, {"file": "ch10.html", "chTitle": "第10章 新型態人身保險商品認定標準", "type": "card", "title": "「同類型保險商品」的前提與三種情形？", "text": "「同類型保險商品」的前提與三種情形？ 前提：經主管機關核准、核備或備查並於市場銷售中。情形：維持原保險範圍與給付項目；減少原保險範圍與給付項目；組合已銷售的範圍、給付項目或投資標的。", "anchor": "cards"}, {"file": "ch10.html", "chTitle": "第10章 新型態人身保險商品認定標準", "type": "card", "title": "「其他特殊事項」共幾款？", "text": "「其他特殊事項」共幾款？ 七款。", "anchor": "cards"}, {"file": "ch10.html", "chTitle": "第10章 新型態人身保險商品認定標準", "type": "card", "title": "各公司第一張以外幣收付的人身保險商品，是不是新型態？", "text": "各公司第一張以外幣收付的人身保險商品，是不是新型態？ 是，屬「其他特殊事項」第一款（條文不分傳統型或投資型）。", "anchor": "cards"}, {"file": "ch10.html", "chTitle": "第10章 新型態人身保險商品認定標準", "type": "card", "title": "第一張由保險人全權決定運用標的之投資型保險商品，是不是新型態？", "text": "第一張由保險人全權決定運用標的之投資型保險商品，是不是新型態？ 是，第三款。", "anchor": "cards"}, {"file": "ch10.html", "chTitle": "第10章 新型態人身保險商品認定標準", "type": "card", "title": "第一張連結國內結構型商品之投資型保險商品，何時屬新型態？", "text": "第一張連結國內結構型商品之投資型保險商品，何時屬新型態？ 各公司第一張，或所連結的結構型商品屬新種財務工程（計算公式或連結標的資產為市場上未曾採行者），第四款。", "anchor": "cards"}, {"file": "ch10.html", "chTitle": "第10章 新型態人身保險商品認定標準", "type": "card", "title": "實物給付型保險商品，什麼情形屬新型態？", "text": "實物給付型保險商品，什麼情形屬新型態？ 實物給付項目非屬殯葬服務，且保險期間與保險給付期間合計超過十年，第五款。", "anchor": "cards"}, {"file": "ch10.html", "chTitle": "第10章 新型態人身保險商品認定標準", "type": "card", "title": "新型態保險商品經主管機關核准後，多久就不再算新型態？", "text": "新型態保險商品經主管機關核准後，多久就不再算新型態？ 核准時間逾一年。", "anchor": "cards"}, {"file": "ch10.html", "chTitle": "第10章 新型態人身保險商品認定標準", "type": "card", "title": "同類型新型態保險商品核准時間雖未逾一年，什麼情形也不再算新型態？", "text": "同類型新型態保險商品核准時間雖未逾一年，什麼情形也不再算新型態？ 已核准達三張。", "anchor": "cards"}, {"file": "ch10.html", "chTitle": "第10章 新型態人身保險商品認定標準", "type": "card", "title": "保險公司對新型態商品認定有疑義，向誰函請認定？", "text": "保險公司對新型態商品認定有疑義，向誰函請認定？ 壽險公會，並檢附保單條款、計算說明書、投資標的說明書等文件說明疑義處。", "anchor": "cards"}, {"file": "ch10.html", "chTitle": "第10章 新型態人身保險商品認定標準", "type": "scen", "title": "某保險公司要推出公司的第一張以外幣收付的人身保險商品。依認定標準第二點，這張商品是？", "text": "某保險公司要推出公司的第一張以外幣收付的人身保險商品。依認定標準第二點，這張商品是？ 不是新型態保險商品 新型態保險商品（其他特殊事項第一款） 只有投資型才是新型態 由主管機關另行公告才知道 第二點第四項第一款：各公司第一張以外幣收付之人身保險商品屬其他特殊事項，即新型態保險商品。條文沒有限定傳統型或投資型。", "anchor": "quiz"}, {"file": "ch10.html", "chTitle": "第10章 新型態人身保險商品認定標準", "type": "scen", "title": "某保險公司要推出第一張「約定以新臺幣為收付幣別的傳統型保險商品」。依認定標準第二點，它屬於新型態保險商品嗎？", "text": "某保險公司要推出第一張「約定以新臺幣為收付幣別的傳統型保險商品」。依認定標準第二點，它屬於新型態保險商品嗎？ 屬於，因為是公司第一張 目前條文列舉的其他特殊事項中沒有這一款，不屬於 屬於，因為是傳統型 要看壽險公會抽籤 現行第二點第四項七款特殊事項中，沒有「新臺幣傳統型首張」這一款（這是舊版內容）。", "anchor": "quiz"}, {"file": "ch10.html", "chTitle": "第10章 新型態人身保險商品認定標準", "type": "scen", "title": "某新型態保險商品經主管機關核准後已逾一年。依認定標準第二點，結果是？", "text": "某新型態保險商品經主管機關核准後已逾一年。依認定標準第二點，結果是？ 仍是新型態 不屬新型態保險商品 需重新送審 改由壽險公會管理 第二點第五項第一款：新型態保險商品經主管機關核准時間逾一年，不屬新型態保險商品。", "anchor": "quiz"}, {"file": "ch10.html", "chTitle": "第10章 新型態人身保險商品認定標準", "type": "scen", "title": "某類新型態保險商品核准時間尚未滿一年，但同類型已經核准了三張。依認定標準第二點，第四張是？", "text": "某類新型態保險商品核准時間尚未滿一年，但同類型已經核准了三張。依認定標準第二點，第四張是？ 仍是新型態 不屬新型態保險商品 須延長核准 只有投資型才不算 第二點第五項第二款：同類型新型態保險商品核准時間雖未逾一年，惟已核准達三張，不屬新型態保險商品。", "anchor": "quiz"}, {"file": "ch10.html", "chTitle": "第10章 新型態人身保險商品認定標準", "type": "scen", "title": "下列哪一項「屬於」認定標準第二點第四項所列的其他特殊事項？", "text": "下列哪一項「屬於」認定標準第二點第四項所列的其他特殊事項？ 各公司第一張由保險人全權決定運用標的之投資型保險商品 核准時間逾一年的商品 同類型商品僅縮短法定傳染病等待期間 同類型疫苗接種不良反應商品，範圍未逾已核准商品 第四項第三款：各公司第一張由保險人全權決定運用標的之投資型保險商品。其餘三項是第五項「不屬新型態」的情形。", "anchor": "quiz"}, {"file": "ch10.html", "chTitle": "第10章 新型態人身保險商品認定標準", "type": "scen", "title": "保險公司對某商品是否屬於新型態有疑義，依認定標準第三點，應向誰函請認定？", "text": "保險公司對某商品是否屬於新型態有疑義，依認定標準第三點，應向誰函請認定？ 金管會 中央銀行 壽險公會 保發中心 第三點：函請壽險公會認定，並檢附保單條款、計算說明書及投資標的說明書等文件。", "anchor": "quiz"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "clause", "title": "第3條 管理資產要考量負債與風險", "text": "管理資產要考量負債與風險 管理資產要考量「負債及風險」，並分析資產與負債的關係，確保有足夠的清償能力。分析時要考慮兩件事：持有資產的到期日、流動性與負債的適當性；建立現金流量預測模型，測試能否承受市場情境與投資條件變化。 分析資產負債看「到期日、流動性」，加「現金流量預測」。 是「負債及風險」，不是「成本與收益」。 保險業管理資產時，應考量負債及風險，並分析資產與負債之關係，確保有足夠之清償能力。 前項分析資產與負債之關係，應考慮下列事項： 一、分析持有資產之到期日、流動性及與負債之適當性。 二、建立適當現金流量預測模型，以測試公司是否能承受市場情境與投資條件之變化，並檢視當其清償能力受到負面影響時，能否作適當調整。", "anchor": "read/c3"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "clause", "title": "第4條 辨識、衡量、報告、監控五類風險", "text": "辨識、衡量、報告、監控五類風險 對各項資產產生的風險要「辨識、衡量、報告、監控」。風險至少包括市場、信用、流動性、作業、法律五類。 動作「識、量、報、控」；五類「市、信、流、作、法」。 動詞是「報告」，不是「裁量」。 保險業應對各項資產所產生之各種風險加以辨識、衡量、報告及監控。 前項所稱各種風險至少應包括市場風險、信用風險、流動性風險、作業風險及法律風險。", "anchor": "read/c4"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "clause", "title": "第6條 投資管理流程", "text": "投資管理流程 投資管理流程四大塊：制定整體性投資政策；設置並授權單位執行；分析、衡量、控制投資結果與風險（含六項：風險管理機制、內控稽核、四大流程、績效評估、投資溝通、內部檢視）；建立內部股權投資人員利益衝突防範機制。 四塊「政策、授權、控管、防衝突」。 「投資執行報告」不在第6條的流程清單裡，它在第16條。 保險業訂立之投資管理流程，其內容應包括： 一、制定整體性投資政策。 二、設置並授權相關單位執行投資政策。 三、分析、衡量及控制投資結果與風險，其內容應包括： （一）建立風險管理機制。 （二）建立完善之內部控制及稽核制度。 （三）建立投資有價證券分析、決定、執行及檢討之四大流程。 （四）建立適當之投資績效評估流程。 （五）建立相關人員適當且即時之投資溝通機制。 （六）建立投資政策與流程合理性之內部檢視機制。 四、建立內部股權投資人員利益衝突防範機制，其內容應至少包括意圖獲取利益，以職務上所知悉消息，為自己或他人從事國內股權商品交易之禁止。", "anchor": "read/c6"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "clause", "title": "第7條 投資政策與每年檢討", "text": "投資政策與每年檢討 訂投資政策要考量：資產與負債關係、風險承受程度、長期風險報酬要求、流動性與清償能力，以及責任投資原則，並報董事會通過。政策至少每年檢討一次，並報董事會通過。 考量「資、風、報、流、責」；檢討「每年」。 題庫只列前四項考量，現行條文多了「責任投資原則」；「資產報酬要求」不在列舉裡，是「長期風險報酬要求」。 訂立前條投資政策時需考量資產與負債關係、風險承受程度、長期風險報酬要求、流動性與清償能力及責任投資原則後訂之，並報經董事會通過，其內容至少應包括下列事項： 一、資產配置之決策依據。 二、建立投資項目（含衍生性金融商品）之規範或限制（含續後之管理），如市場種類限制、最低信評或品質要求、分散投資或相關數量之限制、外匯限制與投資標的企業是否落實執行防制洗錢及打擊資恐及善盡環境保護、企業誠信與社會責任。 三、操作衍生性金融商品與購買結構型商品時，應特別詳細揭露。 四、投資決策授權層級。 前項投資政策至少每年應重新依照資產與負債關係、風險承受程度、長期風險報酬要求、流動性與清償能力狀況檢討一次，並報經董事會通過。", "anchor": "read/c7"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "clause", "title": "第7-1條 國內股權商品投資人員的利益衝突防範", "text": "國內股權商品投資人員的利益衝突防範 保險業要求國內股權商品投資相關人員盡忠實誠信義務，不得有洩漏消息、為自己或他人利益買賣、公開推介個別股票等行為。重點頻率：投資相關人員至少每月申報本人、配偶、未成年子女及被利用名義者的國內股權商品交易（當月無交易免申報）；內部稽核單位至少每年查核相關人員遵循情形，並揭露於內部稽核報告。 「申報每月、稽核每年」。 本條很長，本頁只整理頻率重點，未收錄原文，請看頁尾官方連結。", "anchor": "read/c7-1"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "clause", "title": "第9條 授權高階主管、董事會負最終責任", "text": "授權高階主管、董事會負最終責任 董事會授權高階主管人員負責投資政策的「規劃、管理及執行」；董事會對投資管理流程與投資政策負最終責任。 授權三動作「規劃、管理、執行」。  保險業應依其規模、業務性質及組織特性，由董事會授權高階主管人員負責投資政策之規劃、管理及執行。 董事會應負投資管理流程與投資政策之最終責任。", "anchor": "read/c9"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "clause", "title": "第14條 高階主管每年檢視", "text": "高階主管每年檢視 高階主管人員每年至少一次，依業務與市場情況檢視內部作業程序是否適當。 「每年至少一次」。  高階主管人員每年至少一次根據業務與市場情況，檢視其內部作業程序之適當性。", "anchor": "read/c14"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "clause", "title": "第16條 投資執行報告", "text": "投資執行報告 高階主管人員要把投資執行報告定期提報董事會或其授權單位，內容至少包括：投資期間重大資產變動、各類資產項目持有部位、未來短期投資活動。 三項「變動、部位、未來」。 提報對象是董事會或其授權單位，不是壽險公會、金管會或外匯局。 高階主管人員應將投資執行報告，定期提報董事會或其授權單位。 前項投資執行報告之內容至少應包含下列事項： 一、投資期間重大資產變動。 二、各類資產項目之持有部位。 三、未來短期之投資活動。", "anchor": "read/c16"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "clause", "title": "第19條 實施日期", "text": "實施日期 本自律規範自民國96年1月1日起實施；之後第7條、第7-2條的修正另有實施日。 實施「96年1月1日」。  本自律規範自中華民國九十六年一月一日起開始實施。 中華民國一百零四年五月十八日經壽險公會理監事聯席會及一百零四年五月二十九日經產險公會理事會決議通過之第七條修正條文，自一百零五年一月一日實施。 中華民國一百十年十二月十六日經壽險公會理監事聯席會及一百十年十二月三十日經產險公會理事會決議通過之第七條之二修正條文，自一百十一年七月一日實施。", "anchor": "read/c19"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "clause", "title": "令（一） 入帳、超限判斷與逾限改正", "text": "入帳、超限判斷與逾限改正 資金運用以購買成本入帳，計算部位時依商品特性適當評價；判斷有沒有超過限額，以最近一筆交易的成交價格為基準。不是因為公司加碼而超限（例如價格上漲、比例被動變大），由稽核部門追蹤控管；6 個月內還改不了，稽核部門要立刻報主管機關，並附書面說明與具體改善計畫。 「成本入帳、最近成交價判斷、六個月改不了報主管機關」 6 個月是「公司仍無法改正」的期限，報告的人是稽核部門，不是投資部門。 一、保險業辦理資金運用相關事宜，應遵循下列事項辦理： （一）保險業辦理各項資金運用時應以購買成本入帳，並於計算投資部位時，依商品特性予以適當評價，而判斷超限與否應以最近一筆交易之成交價格為評估基準；另非因公司增加投資之因素所致資金運用項目有逾保險法及相關法令所定限額之情況，公司稽核部門應予以追蹤控管，如公司於6 個月內仍無法改正前述逾限部位之調整情事，則稽核部門應立即陳報主管機關並提出書面說明及具體改善計畫。", "anchor": "read/c令（一）"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "clause", "title": "令（二） 國外投資總額的衡量日與算法", "text": "國外投資總額的衡量日與算法 實際匯出外幣、或用外幣買國外投資標的的那個時點，就是衡量日，要先評估會不會超限。國外投資總額 = 最近一期會計師簽證或核閱的決（結）算國外投資總額，加減到衡量日為止的新增減實際投資金額；新增減部分以「實際入帳時的匯率」換算。 「匯出或買進就是衡量日；新增減用入帳匯率」 換算匯率是「實際入帳時」，不是簽約日、也不是報表日。 一、保險業辦理資金運用相關事宜，應遵循下列事項辦理： （二）保險業於實際匯出外幣或以外幣購買國外投資標的之時點，均屬國外投資總額之衡量日，應評估有無逾限之虞；另關於國外投資總額之計算，則以最近一期會計師簽證或核閱之決（結）算之國外投資總額，加減至衡量日止所有新增減之實際國外投資金額，且新增減投資部分應以實際入帳時之匯率計算。", "anchor": "read/c令（二）"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "clause", "title": "令（三） 國外投資總額的計算範圍", "text": "國外投資總額的計算範圍 除了法令列的國外投資項目，還要把這些算進去：國外有價證券跨月交割產生的應收及應付款、衍生性金融資產與負債淨額、投資國外有價證券衍生的應收利息等與國外投資相關的項目。   一、保險業辦理資金運用相關事宜，應遵循下列事項辦理： （三）國外投資總額之計算範圍，除法令所載國外投資項目外，仍應計入國外有價證券因跨月交割所產生之應收及應付款、衍生性金融資產與負債淨額，以及因投資國外有價證券所衍生之應收利息等與國外投資相關之項目。", "anchor": "read/c令（三）"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "clause", "title": "令（四） 外幣非投資型保單併入國外投資限額", "text": "外幣非投資型保單併入國外投資限額 外幣收付的非投資型人身保險契約收的保費，以及用這些保費做的資金運用，除非相關法令明確排除，一律併入國外投資限額計算。向客戶解釋「為什麼公司外幣保單賣很多會受限」時，就是這條。 「外幣非投資型：保費和運用都併入國外投資限額」 第5章第15-1條的「彈性調整公式」與第15-2條的「不計入國外投資額度」，就是這條的例外與配套。 一、保險業辦理資金運用相關事宜，應遵循下列事項辦理： （四）外幣收付之非投資型人身保險契約所收取之保費及從事之資金運用，除相關法令有明確規範排除外，應併入國外投資限額計算。", "anchor": "read/c令（四）"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "clause", "title": "央行函（一） 壽險業匯出資金的三種方式", "text": "壽險業匯出資金的三種方式 壽險業要辦國外投資匯出資金，可在金管會核定的投資比率範圍內，用三種方式：（1）利用「每年 5 千萬美元累積結匯金額」；（2）經金融機構辦理特定金錢信託投資國外；（3）由業者向央行專案申請核准匯出資金、自行投資國外。 「額度、信託、專案」三擇一 「5 千萬美元」是民國 94 年這份函的寫法。第4章已查到央行 2024 年把公司、行號每年累積結匯金額調高為 1 億美元（推論：現行額度以央行最新規定為準）。題庫若寫 5 千萬，依題庫作答，但實務上要用現行額度。 主旨：即日起，貴行受理壽險業者辦理國外投資匯出資金業務，請依說明各點辦理，請查照。 說明：一、壽險業者辦理國外投資，可在行政院金融監督管理委員會核定投資比率範圍內，以下列方式匯出資金： (一)利用其每年5千萬美元累積結匯金額。 (二)經由金融機構辦理之特定金錢信託投資國外。 (三)由業者向本行專案申請核准匯出所需資金，自行投資國外。", "anchor": "read/c央行函（一）"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "clause", "title": "央行函（二、三） 仍依主管機關規定、舊函停止適用", "text": "仍依主管機關規定、舊函停止適用 壽險業投資國外的其他事項，仍依相關主管機關的規定辦理。央行外匯局 90 年 6 月 29 日（90）台央外伍字第 040025133 號函，自這份函生效日起停止適用。   主旨：即日起，貴行受理壽險業者辦理國外投資匯出資金業務，請依說明各點辦理，請查照。 二、壽險業者投資國外相關事宜，仍應依據相關主管機關之規定辦理。 三、本局90年6月29日(90)台央外伍字第040025133號函，自即日起停止適用。", "anchor": "read/c央行函（二、三）"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "table", "title": "風險與動作", "text": "風險與動作 項目 內容 對風險要做的四件事 辨識、衡量、報告、監控 風險至少五類 市場風險、信用風險、流動性風險、作業風險、法律風險", "anchor": "table/t0"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "table", "title": "頻率與時點速查", "text": "頻率與時點速查 項目 頻率 條文 投資政策重新檢討並報董事會通過 至少每年 第7條 高階主管檢視內部作業程序 每年至少一次 第14條 投資執行報告提報董事會或其授權單位 定期 第16條 股權投資相關人員申報個人交易 至少每月（當月無交易免申報） 第7-1條 內部稽核查核人員遵循情形 至少每年 第7-1條 自律規範實施日 民國96年1月1日 第19條", "anchor": "table/t1"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "table", "title": "投資管理流程的四個部分（第6條）", "text": "投資管理流程的四個部分（第6條） 部分 內容 一 制定整體性投資政策 二 設置並授權相關單位執行投資政策 三 分析、衡量及控制投資結果與風險（風險管理機制、內控稽核、四大流程、績效評估、投資溝通、內部檢視） 四 建立內部股權投資人員利益衝突防範機制", "anchor": "table/t2"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "table", "title": "三份文件速查", "text": "三份文件速查 文件 管什麼 記憶點 保險業資產管理自律規範（壽險公會） 管理資產、風險、投資政策與流程 每年檢討、報董事會、四大流程 金管會令 98 年 國外投資總額怎麼算、超限怎麼處理 成本入帳、最近成交價、6 個月、外幣保單併入限額 央行外匯局函 94 年 壽險業國外投資怎麼匯出資金 額度、信託、專案三擇一", "anchor": "table/t3"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "card", "title": "管理資產時要考量什麼？", "text": "管理資產時要考量什麼？ 負債及風險，並分析資產與負債之關係，確保有足夠之清償能力。", "anchor": "cards"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "card", "title": "分析資產與負債之關係要考慮哪兩件事？", "text": "分析資產與負債之關係要考慮哪兩件事？ 分析持有資產之到期日、流動性及與負債之適當性；建立適當現金流量預測模型。", "anchor": "cards"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "card", "title": "各種風險要做哪四件事？", "text": "各種風險要做哪四件事？ 辨識、衡量、報告、監控。", "anchor": "cards"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "card", "title": "風險至少包括哪五類？", "text": "風險至少包括哪五類？ 市場風險、信用風險、流動性風險、作業風險、法律風險。", "anchor": "cards"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "card", "title": "投資管理流程的四個部分？", "text": "投資管理流程的四個部分？ 制定整體性投資政策；設置並授權相關單位執行；分析、衡量及控制投資結果與風險；建立內部股權投資人員利益衝突防範機制。", "anchor": "cards"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "card", "title": "「分析、衡量及控制投資結果與風險」包含哪六項？", "text": "「分析、衡量及控制投資結果與風險」包含哪六項？ 風險管理機制；內部控制及稽核制度；投資有價證券分析、決定、執行及檢討四大流程；投資績效評估流程；相關人員適當且即時的投資溝通機制；投資政策與流程合理性的內部檢視機制。", "anchor": "cards"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "card", "title": "訂定投資政策要考量哪些事項？", "text": "訂定投資政策要考量哪些事項？ 資產與負債關係、風險承受程度、長期風險報酬要求、流動性與清償能力及責任投資原則；並報經董事會通過。", "anchor": "cards"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "card", "title": "投資政策多久重新檢討一次？", "text": "投資政策多久重新檢討一次？ 至少每年一次，並報經董事會通過。", "anchor": "cards"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "card", "title": "股權投資相關人員多久申報個人交易？", "text": "股權投資相關人員多久申報個人交易？ 至少每月（當月無交易則免申報）。", "anchor": "cards"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "card", "title": "內部稽核單位多久查核股權投資人員遵循情形？", "text": "內部稽核單位多久查核股權投資人員遵循情形？ 至少每年，並揭露於內部稽核報告。", "anchor": "cards"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "card", "title": "誰負責投資政策的規劃、管理及執行？誰負最終責任？", "text": "誰負責投資政策的規劃、管理及執行？誰負最終責任？ 董事會授權的高階主管人員負責規劃、管理及執行；董事會負投資管理流程與投資政策之最終責任。", "anchor": "cards"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "card", "title": "高階主管檢視內部作業程序適當性的頻率？", "text": "高階主管檢視內部作業程序適當性的頻率？ 每年至少一次。", "anchor": "cards"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "card", "title": "投資執行報告提報給誰？內容至少有哪些？", "text": "投資執行報告提報給誰？內容至少有哪些？ 提報董事會或其授權單位；內容至少含投資期間重大資產變動、各類資產項目持有部位、未來短期投資活動。", "anchor": "cards"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "card", "title": "資產管理自律規範何時開始實施？", "text": "資產管理自律規範何時開始實施？ 民國96年1月1日。", "anchor": "cards"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "card", "title": "判斷資金運用有沒有超限，用哪個價格？", "text": "判斷資金運用有沒有超限，用哪個價格？ 以最近一筆交易的成交價格為評估基準；資金運用以購買成本入帳。", "anchor": "cards"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "card", "title": "非因公司增加投資造成逾限，6 個月內仍無法改正，稽核部門要怎麼做？", "text": "非因公司增加投資造成逾限，6 個月內仍無法改正，稽核部門要怎麼做？ 立即陳報主管機關，並提出書面說明及具體改善計畫。", "anchor": "cards"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "card", "title": "國外投資總額的「衡量日」是哪一天？", "text": "國外投資總額的「衡量日」是哪一天？ 實際匯出外幣、或以外幣購買國外投資標的的時點。", "anchor": "cards"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "card", "title": "國外投資總額怎麼計算？新增減部分用什麼匯率？", "text": "國外投資總額怎麼計算？新增減部分用什麼匯率？ 最近一期會計師簽證或核閱的決（結）算國外投資總額，加減至衡量日止所有新增減實際投資金額；新增減部分以實際入帳時的匯率計算。", "anchor": "cards"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "card", "title": "國外投資總額的計算範圍，除了法令列的項目，還要計入什麼？", "text": "國外投資總額的計算範圍，除了法令列的項目，還要計入什麼？ 國外有價證券跨月交割的應收及應付款、衍生性金融資產與負債淨額、投資國外有價證券衍生的應收利息等與國外投資相關的項目。", "anchor": "cards"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "card", "title": "外幣收付非投資型人身保險的保費與資金運用，國外投資限額怎麼算？", "text": "外幣收付非投資型人身保險的保費與資金運用，國外投資限額怎麼算？ 除相關法令明確排除外，併入國外投資限額計算。", "anchor": "cards"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "card", "title": "壽險業辦理國外投資匯出資金，央行函列了哪三種方式？", "text": "壽險業辦理國外投資匯出資金，央行函列了哪三種方式？ （1）利用每年 5 千萬美元累積結匯金額；（2）經金融機構辦理特定金錢信託投資國外；（3）向央行專案申請核准匯出資金、自行投資國外。", "anchor": "cards"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "scen", "title": "依資產管理自律規範第4條，保險業對各項資產產生的風險，要做哪四件事？", "text": "依資產管理自律規範第4條，保險業對各項資產產生的風險，要做哪四件事？ 辨識、衡量、報告、監控 辨識、衡量、裁量、監控 評估、衡量、報告、處分 辨識、報告、監控、處分 第4條：加以辨識、衡量、報告及監控。", "anchor": "quiz"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "scen", "title": "下列哪一種風險「不在」資產管理自律規範第4條至少應包括的風險清單內？", "text": "下列哪一種風險「不在」資產管理自律規範第4條至少應包括的風險清單內？ 市場風險 信用風險 通貨膨脹風險 法律風險 第4條第2項：至少包括市場、信用、流動性、作業、法律五類風險，沒有列通貨膨脹風險。", "anchor": "quiz"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "scen", "title": "保險業的整體性投資政策，依第7條至少多久要重新檢討一次並報經董事會通過？", "text": "保險業的整體性投資政策，依第7條至少多久要重新檢討一次並報經董事會通過？ 每月 每季 每半年 每年 第7條第2項：投資政策至少每年應重新檢討一次，並報經董事會通過。", "anchor": "quiz"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "scen", "title": "高階主管人員的投資執行報告，依第16條應定期提報給誰？", "text": "高階主管人員的投資執行報告，依第16條應定期提報給誰？ 壽險公會 金管會 董事會或其授權單位 外匯局 第16條：應將投資執行報告，定期提報董事會或其授權單位。", "anchor": "quiz"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "scen", "title": "依第14條，高階主管人員檢視內部作業程序的適當性，頻率是？", "text": "依第14條，高階主管人員檢視內部作業程序的適當性，頻率是？ 每年至少一次 每季至少一次 每月至少一次 三年至少一次 第14條：每年至少一次，根據業務與市場情況檢視。", "anchor": "quiz"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "scen", "title": "依第3條，保險業管理資產時，應考量？", "text": "依第3條，保險業管理資產時，應考量？ 資產與負債 負債及風險 成本與收益 風險及報酬 第3條第1項：保險業管理資產時，應考量負債及風險，並分析資產與負債之關係。", "anchor": "quiz"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "scen", "title": "保險業資產管理自律規範原始版本自何時開始實施？", "text": "保險業資產管理自律規範原始版本自何時開始實施？ 民國95年1月1日 民國96年1月1日 民國96年7月5日 民國95年7月5日 第19條：自中華民國九十六年一月一日起開始實施。", "anchor": "quiz"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "scen", "title": "依金管會令，計算國外投資總額時，新增減投資部分應以何時的匯率換算？", "text": "依金管會令，計算國外投資總額時，新增減投資部分應以何時的匯率換算？ 簽約日匯率 實際入帳時之匯率 會計年度結束日匯率 每月月底匯率 金管保財字第09800101002號令（二）：新增減投資部分應以實際入帳時之匯率計算。", "anchor": "quiz"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "scen", "title": "外幣收付之非投資型人身保險契約所收取的保費及從事的資金運用，依金管會令，在國外投資限額上如何處理？", "text": "外幣收付之非投資型人身保險契約所收取的保費及從事的資金運用，依金管會令，在國外投資限額上如何處理？ 完全不計入國外投資限額 除法令明確排除外，併入國外投資限額計算 只計入保費、不計入資金運用 由公司自行決定是否計入 令（四）：除相關法令有明確規範排除外，應併入國外投資限額計算。", "anchor": "quiz"}, {"file": "ch11.html", "chTitle": "第11章 保險業各類監控措施（僅收錄資產管理自律規範）", "type": "scen", "title": "依央行外匯局函，壽險業辦理國外投資匯出資金，下列何者「不是」函列的方式？", "text": "依央行外匯局函，壽險業辦理國外投資匯出資金，下列何者「不是」函列的方式？ 利用其每年累積結匯金額 經由金融機構辦理特定金錢信託投資國外 由業者向央行專案申請核准匯出資金 直接向金管會申請核發外匯額度 函列三種：利用每年累積結匯金額、特定金錢信託投資國外、向央行專案申請核准。核發額度的對象不是金管會。", "anchor": "quiz"}], "cards": [{"no": "01", "key": "ch01:0", "ref": "13", "front": "保險法將保險分為哪兩大類？", "back": "財產保險及人身保險。", "tag": "第1章"}, {"no": "01", "key": "ch01:1", "ref": "13", "front": "保險法第13條，人身保險包括哪四種？", "back": "人壽保險、健康保險、傷害保險及年金保險。", "tag": "第1章"}, {"no": "01", "key": "ch01:2", "ref": "13", "front": "保險法第13條，財產保險包括哪些？", "back": "火災保險、海上保險、陸空保險、責任保險、保證保險及經主管機關核准的其他保險。", "tag": "第1章"}, {"no": "01", "key": "ch01:3", "ref": "保險原則", "front": "「依購買者性別、年齡別、死亡率來繳付保費」是什麼原則？", "back": "公平的危險分攤原則。", "tag": "第1章"}, {"no": "01", "key": "ch01:4", "ref": "保險原則", "front": "「全體保戶繳入的保費總額＝公司付給全體受益人的保險金總額」是什麼原則？", "back": "收支相等原則。", "tag": "第1章"}, {"no": "01", "key": "ch01:5", "ref": "135-1", "front": "年金保險的定義？", "back": "保險人於被保險人生存期間或特定期間內，依契約一次或分期給付一定金額。", "tag": "第1章"}, {"no": "01", "key": "ch01:6", "ref": "119", "front": "要保人終止契約，解約金怎麼給？", "back": "保費付足一年以上；保險人接到通知後一個月內償付；金額不得少於要保人應得保單價值準備金的四分之三。", "tag": "第1章"}, {"no": "01", "key": "ch01:7", "ref": "123", "front": "保險人破產時，受益人的債權怎麼計算？", "back": "以其保單價值準備金，按訂約時的保險費率比例計算。", "tag": "第1章"}, {"no": "01", "key": "ch01:8", "ref": "124", "front": "誰對保單價值準備金有優先受償之權？", "back": "人壽保險的要保人、被保險人、受益人。", "tag": "第1章"}, {"no": "01", "key": "ch01:9", "ref": "138", "front": "保險業辦理與保險有關的業務，涉及外匯業務，要經誰許可？", "back": "中央銀行。", "tag": "第1章"}, {"no": "01", "key": "ch01:10", "ref": "145", "front": "各種準備金的提存比率、計算方式，由誰訂辦法？", "back": "主管機關（保險業各種準備金提存辦法）。", "tag": "第1章"}, {"no": "01", "key": "ch01:11", "ref": "146-3", "front": "保險業放款只限哪四種？", "back": "銀行或信用保證機構保證的放款；動產或不動產擔保放款；合格有價證券為質的放款；人壽保險業以自己簽發的保單為質的放款。", "tag": "第1章"}, {"no": "01", "key": "ch01:12", "ref": "146-3", "front": "放款的每單位與總額上限？", "back": "前三種：每一單位放款不超過資金 5%；放款總額不超過資金 35%。", "tag": "第1章"}, {"no": "01", "key": "ch01:13", "ref": "146-4", "front": "保險法第146-4條的國外投資只限哪四種？", "back": "外匯存款、國外有價證券、設立或投資國外保險相關事業、其他經核准的國外投資。", "tag": "第1章"}, {"no": "01", "key": "ch01:14", "ref": "146-4", "front": "國外投資總額最高上限？", "back": "不得超過各該保險業資金 45%。", "tag": "第1章"}, {"no": "01", "key": "ch01:15", "ref": "146-4", "front": "哪些金額不計入國外投資限額？", "back": "核准銷售外幣收付非投資型人身保險商品並核准不計入的金額；投資國內上市櫃外幣計價股權或債券憑證的金額；核准設立或投資國外保險相關事業並核准不計入的金額；其他經核准的項目。", "tag": "第1章"}, {"no": "01", "key": "ch01:16", "ref": "146-6", "front": "投資保險相關事業，與被投資公司有控制從屬關係時，總額上限？", "back": "不得超過保險業業主權益 40%。（一般情形最高不超過業主權益）", "tag": "第1章"}, {"no": "01", "key": "ch01:17", "ref": "143-4", "front": "什麼是「資本嚴重不足」？", "back": "自有資本與風險資本比率低於一定比率的 25%，或保險業淨值低於零。", "tag": "第1章"}, {"no": "01", "key": "ch01:18", "ref": "比率規範四", "front": "被保險人到達年齡 30 歲以下，死亡給付對保單價值準備金（帳戶價值）的最低比率？", "back": "不得低於 190%。", "tag": "第1章"}, {"no": "01", "key": "ch01:19", "ref": "比率規範四", "front": "到達年齡 31–40、41–50、51–60 歲的最低比率？", "back": "160%、140%、120%。", "tag": "第1章"}, {"no": "01", "key": "ch01:20", "ref": "比率規範四", "front": "到達年齡 61–70、71–90、91 歲以上的最低比率？", "back": "110%、102%、100%。", "tag": "第1章"}, {"no": "01", "key": "ch01:21", "ref": "比率規範三", "front": "「到達年齡」怎麼算？", "back": "原始投保年齡，加上當時保單年度數，再減去一。", "tag": "第1章"}, {"no": "01", "key": "ch01:22", "ref": "比率規範一、二", "front": "死亡給付比率規範「不適用」哪三種情形？", "back": "小額終老保險；分紅保險及利率變動型人壽保險選擇增額繳清保險部分；傳統型人壽保險申請減額繳清保險或展期定期保險時。", "tag": "第1章"}, {"no": "01", "key": "ch01:23", "ref": "舊比率規範四", "front": "舊規範（99年）投資型人壽保險的最低比率？", "back": "到達年齡 40 歲以下 130%；41–70 歲 115%；71 歲以上 101%。", "tag": "第1章"}, {"no": "01", "key": "ch01:24", "ref": "比率規範五、六", "front": "哪種人壽保險要在「保險期間內全期」符合最低比率？", "back": "非投資型人壽保險（不含萬能人壽保險）；萬能與投資型是在投保、每次繳費、申請基本保額變更時符合。", "tag": "第1章"}, {"no": "01", "key": "ch01:25", "ref": "壽險種類", "front": "萬能保險怎麼計算保單價值？", "back": "保險費扣除附加費用後，依該保險費所適用的宣告利率計算。", "tag": "第1章"}, {"no": "01", "key": "ch01:26", "ref": "壽險種類", "front": "養老保險是哪兩種保險的結合？", "back": "定期保險與生存保險（口訣：定存）。", "tag": "第1章"}, {"no": "02", "key": "ch02:0", "ref": "1", "front": "本辦法的法源是什麼？", "back": "中央銀行法第35條第2項。", "tag": "第2章"}, {"no": "02", "key": "ch02:1", "ref": "3", "front": "第3條保險業得辦理的外匯業務有幾款？分別是什麼？", "back": "八款：外幣人身保險、外幣財產保險（金管會範圍）、外幣再保險、投資型年金轉即期年金以新臺幣給付、外幣保單質借放款、財富管理涉及外匯、擔任外幣聯貸參加行放款、央行許可的其他業務。", "tag": "第2章"}, {"no": "02", "key": "ch02:2", "ref": "3", "front": "外幣保單質借放款的保單，限於哪一種保單？", "back": "第一款所指的保險單，也就是以外幣收付之人身保險保單。", "tag": "第2章"}, {"no": "02", "key": "ch02:3", "ref": "4", "front": "保險業辦理外匯業務要向誰申請許可？依什麼許可？", "back": "向中央銀行申請許可，央行依其業務需要，在第3條各款範圍內分別許可。", "tag": "第2章"}, {"no": "02", "key": "ch02:4", "ref": "4", "front": "未經許可的外匯業務可以辦嗎？", "back": "不得辦理。", "tag": "第2章"}, {"no": "02", "key": "ch02:5", "ref": "5", "front": "本國保險業與外國保險業申請，各由誰備文？", "back": "本國保險業由總機構備文；外國保險業由在我國境內設立之分支機構備文。", "tag": "第2章"}, {"no": "02", "key": "ch02:6", "ref": "6", "front": "申請外匯業務要檢附的七項書件？", "back": "營業執照影本；董事會議事錄或外國總公司授權書；金管會核准證明文件；法遵、稽核、會計主管簽署的聲明書；營業計畫書；重要事項告知書（含風險告知）；其他本行規定文件。", "tag": "第2章"}, {"no": "02", "key": "ch02:7", "ref": "6", "front": "辦第3條第3款和第7款業務時，可以免附哪兩項？", "back": "免附第3項（金管會核准證明文件）和第6項（重要事項告知書）。", "tag": "第2章"}, {"no": "02", "key": "ch02:8", "ref": "7", "front": "什麼情形下央行得「退回」申請案？", "back": "書件不完備或應記載事項不充分，經通知限期補正，屆期未補正。", "tag": "第2章"}, {"no": "02", "key": "ch02:9", "ref": "8", "front": "央行得「駁回」申請的三種情形？", "back": "申請資格不符第5條；最近一年違反本辦法或其他外匯規定且情節重大（或限期改正逾期仍未改善）；其他足認有礙健全經營或不符金融政策要求。", "tag": "第2章"}, {"no": "02", "key": "ch02:10", "ref": "9", "front": "央行得廢止或撤銷許可的五種情形？", "back": "許可函後六個月內未開辦；違反第4條第3項或其他規定且情節重大；許可後發覺原申請事項虛偽且情節重大；停業、解散或破產；其他有礙健全經營。", "tag": "第2章"}, {"no": "02", "key": "ch02:11", "ref": "9", "front": "發給許可函後多久內要開辦？可以延期嗎？", "back": "六個月內；有正當理由申請延期並經核准，可延三個月，且只能一次。", "tag": "第2章"}, {"no": "02", "key": "ch02:12", "ref": "10", "front": "辦理外匯業務前，要先確實辨識什麼？", "back": "顧客身分或基本登記資料，以及憑辦文件是否符合規定。", "tag": "第2章"}, {"no": "02", "key": "ch02:13", "ref": "11", "front": "保險業辦理外匯業務，要向誰辦理結匯？要保存什麼？", "back": "向銀行業辦理結匯，並將結匯明細資料留存以供查核。", "tag": "第2章"}, {"no": "02", "key": "ch02:14", "ref": "12", "front": "誰可以派員查閱保險業外匯業務的帳冊文件？", "back": "本行（中央銀行）。", "tag": "第2章"}, {"no": "02", "key": "ch02:15", "ref": "13", "front": "外幣收付的保險，相關款項可以用新臺幣收付嗎？誰負責結匯？", "back": "原則上不得以新臺幣收付；結匯由要保人或受益人依申報辦法逕向銀行業辦理。", "tag": "第2章"}, {"no": "02", "key": "ch02:16", "ref": "13", "front": "投資型年金轉為一般帳簿即期年金後，可以怎麼給付？誰辦結匯？", "back": "可約定以新臺幣給付年金，由保險業依申報辦法等規定辦理結匯。", "tag": "第2章"}, {"no": "02", "key": "ch02:17", "ref": "14", "front": "保單質借和聯貸參加行放款的資金來源限制？", "back": "限於保險業用於國外投資的自有外幣資金。", "tag": "第2章"}, {"no": "02", "key": "ch02:18", "ref": "14", "front": "辦外幣聯貸參加行業務，放款對象限於哪些人？", "back": "限國內顧客。", "tag": "第2章"}, {"no": "02", "key": "ch02:19", "ref": "15", "front": "投資型保險連結衍生性商品並涉及外匯，投資標的不得涉及什麼？", "back": "本國貨幣市場的新臺幣利率指標及匯率指標；相關主管機關限制者。", "tag": "第2章"}, {"no": "03", "key": "ch03:0", "ref": "1", "front": "管理外匯條例的立法目的？", "back": "平衡國際收支、穩定金融、實施外匯管理。", "tag": "第3章"}, {"no": "03", "key": "ch03:1", "ref": "2", "front": "條文所稱「外匯」指什麼？誰核定外國有價證券的種類？", "back": "外國貨幣、票據及有價證券；由掌理外匯業務機關（央行）核定。", "tag": "第3章"}, {"no": "03", "key": "ch03:2", "ref": "3", "front": "第3條「管理外匯之行政主管機關」，條文字面與現行管轄機關？", "back": "條文字面是財政部；依行政院101年6月25日公告，自101年7月1日起由金管會管轄。掌理外匯業務機關為中央銀行。", "tag": "第3章"}, {"no": "03", "key": "ch03:3", "ref": "4", "front": "第4條行政主管機關辦理的六件事關鍵字？", "back": "政府（公營事業外幣債權債務）、國庫（對外債務保證與稽催）、軍政機關（進口外匯與匯出款項審核發證）、聯繫配合、罰鍰裁決與執行、其他行政事項。", "tag": "第3章"}, {"no": "03", "key": "ch03:4", "ref": "5", "front": "第5條央行辦理的事項有哪些？", "back": "外匯調度及收支計畫、指定並督導銀行、調節外匯供需、審核民間匯出匯入、監督民營事業國外借款、買賣外國貨幣票據有價證券、收支核算統計分析報告、其他業務。", "tag": "第3章"}, {"no": "03", "key": "ch03:5", "ref": "5", "front": "「指定銀行辦理外匯業務並督導之」是誰的職掌？", "back": "掌理外匯業務機關（中央銀行），第5條第2款。", "tag": "第3章"}, {"no": "03", "key": "ch03:6", "ref": "6-1", "front": "外匯收支或交易達多少要申報？辦法誰訂？", "back": "新臺幣五十萬元以上之等值；申報辦法由中央銀行定。", "tag": "第3章"}, {"no": "03", "key": "ch03:7", "ref": "7", "front": "第7條六類應結售中央銀行或指定銀行（或存入）的外匯？", "back": "出口或再出口貨品或其他交易所得；航運業、保險業及其他各業人民基於勞務所得；國外匯入款；核准國外投資的收入；企業核准國外投資融資技術合作的本息淨利及報酬金；其他。", "tag": "第3章"}, {"no": "03", "key": "ch03:8", "ref": "9", "front": "出境攜帶外幣限額，由誰以命令定？", "back": "條文字面：財政部（見第3條提醒）。", "tag": "第3章"}, {"no": "03", "key": "ch03:9", "ref": "11", "front": "攜帶外幣出入國境要向誰報明登記？", "back": "海關。", "tag": "第3章"}, {"no": "03", "key": "ch03:10", "ref": "13", "front": "第13條「得」提用或結購外匯的支付用途共幾款？", "back": "九款（進口貨款、保險業等基於交易或勞務所需費用、留學旅行就醫等、贍養國外家屬、外國人及華僑在中國投資本息淨利、核准國外借款本息、技術合作報酬金、核准國外投資或貸款、其他）。", "tag": "第3章"}, {"no": "03", "key": "ch03:11", "ref": "15", "front": "學校接受國外捐贈、供教學研究用的貨品，要向誰申請免結匯報運進口？", "back": "向（行政主管機關）申請核明，條文字面是財政部。", "tag": "第3章"}, {"no": "03", "key": "ch03:12", "ref": "16", "front": "價值不超過一定限額的餽贈品、商業樣品、非賣品，由誰核准進口？", "back": "海關。", "tag": "第3章"}, {"no": "03", "key": "ch03:13", "ref": "17", "front": "外匯原因消滅或變更而無須支付，怎麼辦？", "back": "依央行規定期限，存入或售還央行或其指定銀行。", "tag": "第3章"}, {"no": "03", "key": "ch03:14", "ref": "18", "front": "央行要按期把外匯買賣、結存、結欠及對外保證責任額彙報給誰？", "back": "行政主管機關（條文字面：財政部）。", "tag": "第3章"}, {"no": "03", "key": "ch03:15", "ref": "19-1", "front": "第19-1條行政院可採取的處置？", "back": "關閉外匯市場、停止或限制全部或部分外匯之支付、命令全部或部分外匯結售或存入指定銀行、其他必要之處置。", "tag": "第3章"}, {"no": "03", "key": "ch03:16", "ref": "19-1", "front": "19-1條決定後多久要送立法院追認？立法院休會時一定期間上限？", "back": "決定後十日內送請立法院追認，不同意則失效；休會時一定期間以二十日為限。", "tag": "第3章"}, {"no": "03", "key": "ch03:17", "ref": "19-2", "front": "故意違反19-1措施的罰則？何時免罰？", "back": "新臺幣三百萬元以下罰鍰；立法院不同意追認時免罰。", "tag": "第3章"}, {"no": "03", "key": "ch03:18", "ref": "19-3", "front": "第19-3條處置的對象與措施？", "back": "對危害國際安全之國家、地區或恐怖組織相關的個人、法人、團體、機關、機構，於銀行業之帳戶、匯款、通貨或其他支付工具，禁止提款、轉帳、付款、交付、轉讓或其他必要處置。", "tag": "第3章"}, {"no": "03", "key": "ch03:19", "ref": "20", "front": "故意不申報或申報不實，罰則？", "back": "新臺幣三萬元以上六十萬元以下罰鍰；受查詢未於限期說明或虛偽說明亦同。", "tag": "第3章"}, {"no": "03", "key": "ch03:20", "ref": "20", "front": "違反第7條不結售或不存入外匯，罰則？", "back": "按行為時匯率折算金額二倍以下罰鍰，並由央行追繳外匯。", "tag": "第3章"}, {"no": "03", "key": "ch03:21", "ref": "22", "front": "以非法買賣外匯為常業，罰則？", "back": "三年以下有期徒刑、拘役，或科或併科與營業總額等值以下罰金；外匯及價金沒收；法人、本人併科罰金。", "tag": "第3章"}, {"no": "03", "key": "ch03:22", "ref": "23", "front": "應追繳外匯而不以外匯歸還，罰則？", "back": "科以相當於應追繳外匯金額以下之罰鍰。", "tag": "第3章"}, {"no": "03", "key": "ch03:23", "ref": "24", "front": "第24條的處分是什麼？分哪四種情形？", "back": "沒入。違規買賣外匯（外匯及價金）；出境攜帶超過限額（超過部分）；出入國境不報明登記（全部）；申報不實（超過申報部分）。", "tag": "第3章"}, {"no": "03", "key": "ch03:24", "ref": "26-1", "front": "第26-1條可以停止適用哪三條？誰決定？恢復後怎麼辦？", "back": "行政院決定停止第7、13、17條；恢復適用後十日內送立法院追認，不同意即失效。", "tag": "第3章"}, {"no": "04", "key": "ch04:0", "ref": "1", "front": "本辦法依哪一條訂定？", "back": "管理外匯條例第6-1條第1項。", "tag": "第4章"}, {"no": "04", "key": "ch04:1", "ref": "2", "front": "誰是申報義務人？門檻多少？", "back": "新臺幣五十萬元以上等值外匯收支或交易的資金所有者或需求者。", "tag": "第4章"}, {"no": "04", "key": "ch04:2", "ref": "2", "front": "辦理新臺幣結匯申報，要經由誰向誰申報？", "back": "經由銀行業向中央銀行申報。", "tag": "第4章"}, {"no": "04", "key": "ch04:3", "ref": "2", "front": "申報書的填寫原則？", "back": "依外匯收支或交易有關合約等證明文件，誠實填妥申報書。", "tag": "第4章"}, {"no": "04", "key": "ch04:4", "ref": "3", "front": "「銀行業」包含哪六類？", "back": "銀 , "back": "主管機關核准後始得辦理。", "tag": "第5章"}, {"no": "05", "key": "ch05:29", "ref": "15", "front": "無需提高額度時，有交易處理程序與風險監控措施並經董事會通過者，額度？", "back": "資金 10%。", "tag": "第5章"}, {"no": "05", "key": "ch05:30", "ref": "15", "front": "國外投資交易處理程序的書面分析報告等資料，保存多久？", "back": "至少 5 年。", "tag": "第5章"}, {"no": "05", "key": "ch05:31", "ref": "15-1", "front": "彈性調整公式的三個條件？", "back": "經核准經營外幣收付非投資型人身保險業務；符合第15條第1至3項；該業務各種準備金全部運用於同幣別資金運用項目。", "tag": "第5章"}, {"no": "05", "key": "ch05:32", "ref": "16", "front": "國外投資達什麼情形，集保公司以外的保管機構不得超過幾家？", "back": "核定國外投資額度達資金 35% 或國外投資金額達美金 10 億元以上；不得超過 5 家。", "tag": "第5章"}, {"no": "05", "key": "ch05:33", "ref": "17", "front": "第17條高風險標的合計上限？", "back": "資金 5%。", "tag": "第5章"}, {"no": "05", "key": "ch05:34", "ref": "15", "front": "國外投資額度提高到 25%，要符合哪些條件？", "back": "符合基本規定（有交易處理程序與風險監控措施並經董事會通過）；最近一年內控無重大缺失或已改正；精算人員或外部投資機構評估有利經營；檢具含風險管理制度說明的完整投資手冊。", "tag": "第5章"}, {"no": "05", "key": "ch05:35", "ref": "15", "front": "從 25% 提高到 30%，多一個什麼條件？", "back": "最近一年資金運用無受主管機關重大裁罰及處分，或違反情事已改正並經認可。", "tag": "第5章"}, {"no": "05", "key": "ch05:36", "ref": "15", "front": "提高到 35%，條件包括哪些？", "back": "符合 30% 條件；公允價值部位用風險值並每週至少控管一次；攤銷後成本部位建模型並每半年向董事會報告；近二年無罰鍰；董事會下設風險管理委員會並設風險管理部門與風控長。", "tag": "第5章"}, {"no": "05", "key": "ch05:37", "ref": "15", "front": "申請超過 35%，條件有哪些？", "back": "取得 35% 核准已逾一年；董事會每年訂風險限額並定期控管；資本比率達法定標準 1.25 倍以上或評等 AA- 以上；當年度未取得其他提高核准。", "tag": "第5章"}, {"no": "05", "key": "ch05:38", "ref": "15", "front": "風險值（VaR）的計算規定？", "back": "按週為基礎樣本至少 3 年（或按日、至少 1 年）；資料至少每週更新；99% 信賴水準；10 個交易日；每月回溯測試。", "tag": "第5章"}, {"no": "05", "key": "ch05:39", "ref": "11", "front": "「法定標準」現行是多少？題庫的 250%、300% 怎麼來？", "back": "現行資本適足率法定標準為 100%（2026 起新制，舊制 200%）；條文寫 1.25 倍、1.5 倍。題庫的 250%、300% 是舊制 200% 的 1.25 倍、1.5 倍。", "tag": "第5章"}, {"no": "06", "key": "ch06:0", "ref": "一", "front": "「本業務」指的是什麼？", "back": "人身保險業辦理以外幣收付之非投資型人身保險業務。", "tag": "第6章"}, {"no": "06", "key": "ch06:1", "ref": "二", "front": "公司申請辦理本業務的四項資格條件？", "back": "一、最近一年內未有遭重大裁罰及處分（或已具體改善經認可）。二、國外投資採風險值評估，每週至少控管乙次。三、設有風險控管委員會或風控部門及風控長，並實際負責整體風險控管。四、最近一年公平待客原則評核結果為業界前 80%（有例外）。", "tag": "第6章"}, {"no": "06", "key": "ch06:2", "ref": "二", "front": "風險值（VaR）的條文定義，數字有哪些？", "back": "按週為基礎、樣本至少 3 年，或按日為基礎、樣本至少 1 年；資料至少每週更新；至少 99% 信賴水準；計算 10 個交易日的風險值；每月回溯測試。", "tag": "第6章"}, {"no": "06", "key": "ch06:3", "ref": "二", "front": "公平待客評核不夠前 80% 一定不能辦嗎？", "back": "不是。條文有但書：經公司提出合理說明並經主管機關核准者，不在此限。", "tag": "第6章"}, {"no": "06", "key": "ch06:4", "ref": "二", "front": "「重大裁罰及處分」在條文裡怎麼定義？", "back": "指金管會處理違反金融法令重大裁罰措施之對外公布說明辦法第二條所定各款之情事（條文本身不列金額）。", "tag": "第6章"}, {"no": "06", "key": "ch06:5", "ref": "三", "front": "契約可以約定什麼、不可以約定什麼（幣別）？", "back": "可以約定保費、給付、費用及其他款項收付的外幣幣別；不得約定新臺幣與外幣或各幣別間之相互變換。", "tag": "第6章"}, {"no": "06", "key": "ch06:6", "ref": "三", "front": "款項收付原則上要事先約定走什麼帳戶？", "back": "外匯存款戶存撥。", "tag": "第6章"}, {"no": "06", "key": "ch06:7", "ref": "三", "front": "生存保險金抵繳保費的例外，要同時符合哪三點？", "back": "生存保險金應給付日當日抵繳；抵繳的是相同幣別外幣保險契約的保費；生存保險金受益人與被抵繳契約的要保人為同一人。", "tag": "第6章"}, {"no": "06", "key": "ch06:8", "ref": "四", "front": "本業務的險種限於哪些？誰許可？", "back": "人壽保險、年金保險、健康保險；須經中央銀行許可。", "tag": "第6章"}, {"no": "06", "key": "ch06:9", "ref": "四", "front": "健康保險的給付項目限於什麼？", "back": "豁免保險費，或一次性給付之癌症疾病、重大疾病或特定疾病。", "tag": "第6章"}, {"no": "06", "key": "ch06:10", "ref": "四", "front": "「一次性給付」的定義？", "back": "保險事故發生並於保險人給付保險金後，保險契約即行終止之給付型態。", "tag": "第6章"}, {"no": "06", "key": "ch06:11", "ref": "五", "front": "外幣保單對應的一般帳簿資產可以兌換新臺幣嗎？", "back": "不得兌換為新臺幣；資金運用仍應依保險法第146條之4辦理。", "tag": "第6章"}, {"no": "06", "key": "ch06:12", "ref": "六", "front": "外幣非投資型保單可以和新臺幣收付的人身保險保單轉換契約嗎？", "back": "不得辦理契約轉換。", "tag": "第6章"}, {"no": "06", "key": "ch06:13", "ref": "七", "front": "第一張外幣非投資型商品向誰申請？要附什麼？", "back": "向主管機關申請核准；檢附符合第二點資格條件的說明文件，並依保險商品銷售前程序作業準則等規定送審。", "tag": "第6章"}, {"no": "06", "key": "ch06:14", "ref": "七", "front": "送審時除一般文件外，要併附哪三件？", "back": "各項交易之會計處理方式說明；外幣資產負債配置具體計畫及執行方法；外幣資產區隔之方式。", "tag": "第6章"}, {"no": "06", "key": "ch06:15", "ref": "七", "front": "要保書及保單條款要載明哪三件事？", "back": "保險費收取方式、匯款費用之負擔、匯率風險揭露。", "tag": "第6章"}, {"no": "06", "key": "ch06:16", "ref": "七", "front": "人民幣商品的自有資本與風險資本比率要符合哪一條？", "back": "保險法第143條之4。", "tag": "第6章"}, {"no": "06", "key": "ch06:17", "ref": "八", "front": "業務員銷售外幣非投資型商品的資格與每年訓練要求？", "back": "通過壽險公會舉辦的特別測驗並完成資格登錄；登錄後公司每年要辦至少 1 小時匯率風險及外匯相關法規在職教育訓練。", "tag": "第6章"}, {"no": "06", "key": "ch06:18", "ref": "八", "front": "業務員當年度沒參加或沒通過在職訓練，會怎樣？", "back": "公司應暫停授權其次一年度招攬該等保險商品。", "tag": "第6章"}, {"no": "06", "key": "ch06:19", "ref": "八", "front": "招攬時要揭露的項目，揭露在哪裡？", "back": "在要保書及商品簡介明顯處，揭露保險費收取方式、匯款費用之負擔、商品所涉匯率風險、商品幣別所屬國家之政治與經濟變動風險。", "tag": "第6章"}, {"no": "06", "key": "ch06:20", "ref": "八", "front": "匯率風險說明書要用哪三種情境？怎麼呈現？", "back": "收付幣別最近十年內的最高、平均、最低三種匯率；以視覺化方式，就死亡保險給付與簽約時收取的保費，分別折合新臺幣的金額，以及匯兌損益差額舉例說明。", "tag": "第6章"}, {"no": "06", "key": "ch06:21", "ref": "八", "front": "招攬時由誰在哪些文件上共同簽確認？", "back": "要保人及業務員，在要保書及匯率風險說明書上共同具簽確認。", "tag": "第6章"}, {"no": "06", "key": "ch06:22", "ref": "八", "front": "匯率風險說明書範本由誰擬訂、誰備查？", "back": "壽險公會擬訂範本，報主管機關備查。", "tag": "第6章"}, {"no": "06", "key": "ch06:23", "ref": "八", "front": "每年至少一次要向要保人揭露什麼？方式誰決定？", "back": "當年度解約金、死亡保險金額、生存保險金額等給付項目折合新臺幣的參考價值；提供方式由保險人與要保人約定。", "tag": "第6章"}, {"no": "06", "key": "ch06:24", "ref": "八", "front": "銷售前要先做哪兩件事？", "back": "瞭解要保人的需求與承受匯率風險能力；並建立商品適合度政策。", "tag": "第6章"}, {"no": "06", "key": "ch06:25", "ref": "九", "front": "還要遵循哪兩份專業規範？", "back": "精算學會的外幣保險商品精算實務處理準則；壽險公會的客戶適合度規範。", "tag": "第6章"}, {"no": "06", "key": "ch06:26", "ref": "十", "front": "自行查核與內部稽核的頻率？", "back": "業務單位每半年辦理專案自行查核；內部稽核單位每年辦理專案查核，報告提報最近一次董事會通過。", "tag": "第6章"}, {"no": "06", "key": "ch06:27", "ref": "十一", "front": "統計報表向誰申報？", "back": "主管機關或財團法人保險事業發展中心。", "tag": "第6章"}, {"no": "07", "key": "ch07:0", "ref": "3", "front": "重要事項告知書要說明哪些事項？", "back": "各項費用；投資標的及其可能風險；相關警語；其他經主管機關規定的事項，並經要保人簽章。", "tag": "第7章"}, {"no": "07", "key": "ch07:1", "ref": "4", "front": "專設帳簿的三原則？", "back": "資產與保險人其他資產分開設置並單獨管理；依公會會計制度範本定期評價並依契約通知要保人；資產運用與要保人同意或指定的方式及標的相符。", "tag": "第7章"}, {"no": "07", "key": "ch07:2", "ref": "5", "front": "委託的管理事業有變更，多久要申報？", "back": "變更後 15 個工作日內向主管機關申報。", "tag": "第7章"}, {"no": "07", "key": "ch07:3", "ref": "5", "front": "專設帳簿資產不得做哪三件事？", "back": "提供做為擔保之用；借予他人（主管機關另有規定除外）；從事法令禁止投資的項目。", "tag": "第7章"}, {"no": "07", "key": "ch07:4", "ref": "5", "front": "投資及交易的書面紀錄與檢討報告頻率？", "back": "作成書面紀錄，按月提出檢討報告，並依法建檔保存。", "tag": "第7章"}, {"no": "07", "key": "ch07:5", "ref": "6", "front": "保管機構變更要怎麼辦？", "back": "變更後 15 個工作日內向主管機關申報。", "tag": "第7章"}, {"no": "07", "key": "ch07:6", "ref": "8", "front": "專設帳簿與一般帳簿資產原則上可以互相移轉嗎？例外？", "back": "不得互相出售、交換或移轉；例外三種：設立或正常運作、保險成本及費用必要轉出、維護要保人或受益人利益並經核准。", "tag": "第7章"}, {"no": "07", "key": "ch07:7", "ref": "9", "front": "連結標的的發行或經理機構破產時，保險人要做什麼？", "back": "基於要保人、受益人之利益向該機構積極追償。", "tag": "第7章"}, {"no": "07", "key": "ch07:8", "ref": "10", "front": "第10條連結標的共幾款？", "back": "十二款（含其他經主管機關核准的投資標的）。", "tag": "第7章"}, {"no": "07", "key": "ch07:9", "ref": "10", "front": "「公開發行公司股票」在第10條嗎？", "back": "不在；股票只在第11條（全權決定運用）的範圍。", "tag": "第7章"}, {"no": "07", "key": "ch07:10", "ref": "11", "front": "第11條全權決定運用的範圍共幾款？外國有價證券有幾類？", "back": "十二款；外國有價證券限五類。", "tag": "第7章"}, {"no": "07", "key": "ch07:11", "ref": "12", "front": "第12條全權決定運用時不得做幾件事？", "back": "八件。", "tag": "第7章"}, {"no": "07", "key": "ch07:12", "ref": "13", "front": "哪些標的要求信用評等達一定等級？", "back": "第10條第1項第7款至第11款（公債、金融債券、公司債、結構型商品、房利美等抵押債權證券）；第11條部分債券類準用。", "tag": "第7章"}, {"no": "07", "key": "ch07:13", "ref": "16", "front": "表決權行使的相關紀錄要保存多久？", "back": "至少 5 年，循序編號建檔。", "tag": "第7章"}, {"no": "07", "key": "ch07:14", "ref": "17", "front": "保險人解散清算，專設帳簿剩餘財產如何分派？", "back": "按專設帳簿資產內保險人及要保人所有受益權價值的比例，分派給保險人及要保人或受益人。", "tag": "第7章"}, {"no": "07", "key": "ch07:15", "ref": "18", "front": "外幣收付的投資型保險，可以約定新臺幣與外幣互換收付幣別嗎？例外？", "back": "不得；例外是外幣投資型年金於累積期間屆滿、全部處分連結標的並轉為一般帳簿即期年金時，可約定以新臺幣給付年金。", "tag": "第7章"}, {"no": "07", "key": "ch07:16", "ref": "18", "front": "經營外幣投資型保險業務，須經誰許可？", "back": "中央銀行（以新臺幣給付年金的情形也要另外許可）。", "tag": "第7章"}, {"no": "07", "key": "ch07:17", "ref": "18", "front": "外幣收付的投資型保險，專設帳簿資產可投資什麼？", "back": "以投資外幣計價的投資標的為限。", "tag": "第7章"}, {"no": "07", "key": "ch07:18", "ref": "19", "front": "全權決定運用的五項資格？", "back": "自有資本與風險資本比率符合適足比率；最近一年無重大裁罰；國外投資採風險值並每週控管；有風險控管組織；公平待客評核前 80%。", "tag": "第7章"}, {"no": "07", "key": "ch07:19", "ref": "23", "front": "全委契約轉換，保險人可以拒絕嗎？", "back": "不得拒絕，除非因險種、期間或保險金額改變致危險增加。", "tag": "第7章"}, {"no": "07", "key": "ch07:20", "ref": "24", "front": "簽約後因法令變更致投資範圍增減，通知期間？", "back": "不低於 60 日；要保人異議並申請終止時，不得收取任何解約費用。", "tag": "第7章"}, {"no": "07", "key": "ch07:21", "ref": "26", "front": "保單帳戶價值多久計算一次？", "back": "除契約另有約定，每一營業日。", "tag": "第7章"}, {"no": "07", "key": "ch07:22", "ref": "27", "front": "全委專設帳簿的年度決算報告，何時內編具、怎麼處理？", "back": "會計年度終了後 4 個月內，經會計師查核簽證後函報主管機關備查並公告。", "tag": "第7章"}, {"no": "07", "key": "ch07:23", "ref": "14", "front": "投資型保險連結的境外基金，要符合什麼條件？", "back": "須是經主管機關核准或申報生效在國內募集及銷售的境外基金；但在國外證券交易市場交易的指數股票型基金（ETF）不在此限。", "tag": "第7章"}, {"no": "07", "key": "ch07:24", "ref": "14", "front": "結構型商品的定義？", "back": "結合固定收益商品與衍生性金融商品的組合型式商品或結構型債券。", "tag": "第7章"}, {"no": "07", "key": "ch07:25", "ref": "22", "front": "全委投資型保險的契約及相關資料，保存多久？", "back": "契約終止或失效後至少保存五年。", "tag": "第7章"}, {"no": "08", "key": "ch08:0", "ref": "二", "front": "保管機構的評等看哪一張附表？", "back": "附表一。", "tag": "第8章"}, {"no": "08", "key": "ch08:1", "ref": "三", "front": "公債、國庫券看什麼評等？看哪張附表？", "back": "發行國家的主權評等；附表二。", "tag": "第8章"}, {"no": "08", "key": "ch08:2", "ref": "三", "front": "國內結構型商品沒有商品發行評等時怎麼辦？", "back": "以國內發行機構或保證機構的長期債務信用評等替代。", "tag": "第8章"}, {"no": "08", "key": "ch08:3", "ref": "三", "front": "國外機構發行的金融債券、公司債，除評等外還有什麼要求？", "back": "發行機構或保證機構要在中華民國境內設有境外結構型商品管理規則第6條所定的分公司或子公司。", "tag": "第8章"}, {"no": "08", "key": "ch08:4", "ref": "五", "front": "投資型保險商品連結的標的，不得涉有哪三類情事？", "back": "私募基金受益憑證或其他國內外私募有價證券；追蹤指數逾越主管機關公告範圍的國外指數型基金（ETF 除外）；保險人利害關係人發行的金融債券、公司債、結構型商品。", "tag": "第8章"}, {"no": "08", "key": "ch08:5", "ref": "六", "front": "國內結構型商品的到期保本率？", "back": "至少為原計價貨幣本金的 100%，且不得含目標贖回式設計與發行機構得提前贖回的選擇權。", "tag": "第8章"}, {"no": "08", "key": "ch08:6", "ref": "六", "front": "國內結構型商品的計價幣別？", "back": "以新臺幣、人民幣及境外結構型商品管理規則第18條第2款所定計價幣別為限。", "tag": "第8章"}, {"no": "08", "key": "ch08:7", "ref": "七", "front": "連結國外債券要在哪裡買賣？有什麼限制？", "back": "要在國內證券市場上櫃買賣，且不得僅限銷售專業投資人；不得投資本國企業赴國外發行的債券，也不得投資 TLAC 債券。", "tag": "第8章"}, {"no": "08", "key": "ch08:8", "ref": "八", "front": "一般 ETF 的限制？", "back": "以投資股票、債券為主且不具槓桿或放空效果者為限。", "tag": "第8章"}, {"no": "08", "key": "ch08:9", "ref": "八", "front": "避險目的的放空 ETF，上限？", "back": "反向不超過一倍。", "tag": "第8章"}, {"no": "08", "key": "ch08:10", "ref": "八", "front": "風險管理目的的槓桿 ETF，上限？", "back": "正向不超過二倍。", "tag": "第8章"}, {"no": "08", "key": "ch08:11", "ref": "八", "front": "「高度相關性」的定義？", "back": "以過去三個月以上的全部交易歷史資料計算，相關係數達 70% 以上。", "tag": "第8章"}, {"no": "08", "key": "ch08:12", "ref": "八之一", "front": "有約定到期日的債券型基金，投資於附表五該評級的上限？", "back": "基金淨資產價值的 40%。", "tag": "第8章"}, {"no": "08", "key": "ch08:13", "ref": "八之二", "front": "非投資等級債券基金與新興市場債券基金（60% 以上），合計上限？", "back": "合計不超過 20%，其中非投資等級債券基金不超過 10%。", "tag": "第8章"}, {"no": "08", "key": "ch08:14", "ref": "九", "front": "連結標的被調降評等達附表五所列等級（含）以下，要怎麼處理？", "back": "保險人於事實發生之日起 3 日內通知要保人。", "tag": "第8章"}, {"no": "08", "key": "ch08:15", "ref": "十一", "front": "匯率避險衍生商品契約總名目價值的上限？", "back": "不超過被避險項目的總帳面價值；超限時受託機構於事實發生日起 3 個營業日內處置。", "tag": "第8章"}, {"no": "08", "key": "ch08:16", "ref": "十三", "front": "保險人要建立哪些與信用風險有關的機制？", "back": "投資標的與其發行、保證或經理機構的信用風險評估機制及分散準則，以及發行或經理機構破產的緊急應變及追償作業程序。", "tag": "第8章"}, {"no": "08", "key": "ch08:17", "ref": "十", "front": "投資型保險為匯率避險而交易貨幣衍生商品，「匯率避險目的」要符合哪些條件？", "back": "被避險項目已存在且可明確辨認；避險商品可降低其匯率風險並被指定為該項目的避險；連結標的與被避險項目不同時，需書面指定並證明高度相關。", "tag": "第8章"}, {"no": "08", "key": "ch08:18", "ref": "十", "front": "匯率避險的「高度相關性」怎麼算？", "back": "以過去三個月以上的全部交易歷史資料，價格變動率或報酬率相關係數達 70% 以上。", "tag": "第8章"}, {"no": "08", "key": "ch08:19", "ref": "十二", "front": "匯率避險衍生商品交易，外國金融機構交易對手的評等條件？", "back": "最近一年長期債務信評經 Moody's、S&P 或 Fitch 評定達 BBB+ 或相當等級以上（本國金融機構則要資本比率符合法定標準）。", "tag": "第8章"}, {"no": "09", "key": "ch09:8", "ref": "八", "front": "新臺幣由 33 變為 31，代表什麼？", "back": "1 美元只能換 31 元新臺幣：新臺幣升值、美元貶值。", "tag": "第9章"}, {"no": "09", "key": "ch09:9", "ref": "八", "front": "簽約時 1 美元＝31 元新臺幣，領死亡保險金時變成 30 元，受益人把美元換成新臺幣，結果？", "back": "換回的新臺幣變少，是匯兌損失。例如 10 萬美元少換 10 萬元新臺幣。", "tag": "第9章"}, {"no": "09", "key": "ch09:2", "ref": "函 三", "front": "匯率風險說明書的匯率情境，多久更新一次？", "back": "每年一次，最遲每年 3 月 1 日前完成。", "tag": "第9章"}, {"no": "09", "key": "ch09:3", "ref": "函 三", "front": "匯率風險說明書是不是要保書的一部分？", "back": "不是要保書的一部分，但是保險契約構成之一部分；經要保人審閱並親自簽章後，雙方各執一份。", "tag": "第9章"}, {"no": "09", "key": "ch09:4", "ref": "函 四", "front": "匯率風險說明書要在哪個階段提供？誰解說？", "back": "招攬階段就提供給消費者並由其親自簽章確認；由招攬的業務員當面解說清楚。", "tag": "第9章"}, {"no": "10", "key": "ch10:0", "ref": "一", "front": "誰訂定新型態人身保險商品認定標準？", "back": "壽險公會，依保險商品銷售前程序作業準則第17條第2項。", "tag": "第10章"}, {"no": "10", "key": "ch10:1", "ref": "二", "front": "什麼是新型態人身保險商品？", "back": "國內保險市場尚未有同類型，或有其他特殊事項之保險商品。", "tag": "第10章"}, {"no": "10", "key": "ch10:2", "ref": "二", "front": "「同類型保險商品」的前提與三種情形？", "back": "前提：經主管機關核准、核備或備查並於市場銷售中。情形：維持原保險範圍與給付項目；減少原保險範圍與給付項目；組合已銷售的範圍、給付項目或投資標的。", "tag": "第10章"}, {"no": "10", "key": "ch10:3", "ref": "二", "front": "「其他特殊事項」共幾款？", "back": "七款。", "tag": "第10章"}, {"no": "10", "key": "ch10:4", "ref": "二", "front": "各公司第一張以外幣收付的人身保險商品，是不是新型態？", "back": "是，屬「其他特殊事項」第一款（條文不分傳統型或投資型）。", "tag": "第10章"}, {"no": "10", "key": "ch10:5", "ref": "二", "front": "第一張由保險人全權決定運用標的之投資型保險商品，是不是新型態？", "back": "是，第三款。", "tag": "第10章"}, {"no": "10", "key": "ch10:6", "ref": "二", "front": "第一張連結國內結構型商品之投資型保險商品，何時屬新型態？", "back": "各公司第一張，或所連結的結構型商品屬新種財務工程（計算公式或連結標的資產為市場上未曾採行者），第四款。", "tag": "第10章"}, {"no": "10", "key": "ch10:7", "ref": "二", "front": "實物給付型保險商品，什麼情形屬新型態？", "back": "實物給付項目非屬殯葬服務，且保險期間與保險給付期間合計超過十年，第五款。", "tag": "第10章"}, {"no": "10", "key": "ch10:8", "ref": "二", "front": "新型態保險商品經主管機關核准後，多久就不再算新型態？", "back": "核准時間逾一年。", "tag": "第10章"}, {"no": "10", "key": "ch10:9", "ref": "二", "front": "同類型新型態保險商品核准時間雖未逾一年，什麼情形也不再算新型態？", "back": "已核准達三張。", "tag": "第10章"}, {"no": "10", "key": "ch10:10", "ref": "三", "front": "保險公司對新型態商品認定有疑義，向誰函請認定？", "back": "壽險公會，並檢附保單條款、計算說明書、投資標的說明書等文件說明疑義處。", "tag": "第10章"}, {"no": "11", "key": "ch11:0", "ref": "3", "front": "管理資產時要考量什麼？", "back": "負債及風險，並分析資產與負債之關係，確保有足夠之清償能力。", "tag": "第11章"}, {"no": "11", "key": "ch11:1", "ref": "3", "front": "分析資產與負債之關係要考慮哪兩件事？", "back": "分析持有資產之到期日、流動性及與負債之適當性；建立適當現金流量預測模型。", "tag": "第11章"}, {"no": "11", "key": "ch11:2", "ref": "4", "front": "各種風險要做哪四件事？", "back": "辨識、衡量、報告、監控。", "tag": "第11章"}, {"no": "11", "key": "ch11:3", "ref": "4", "front": "風險至少包括哪五類？", "back": "市場風險、信用風險、流動性風險、作業風險、法律風險。", "tag": "第11章"}, {"no": "11", "key": "ch11:4", "ref": "6", "front": "投資管理流程的四個部分？", "back": "制定整體性投資政策；設置並授權相關單位執行；分析、衡量及控制投資結果與風險；建立內部股權投資人員利益衝突防範機制。", "tag": "第11章"}, {"no": "11", "key": "ch11:5", "ref": "6", "front": "「分析、衡量及控制投資結果與風險」包含哪六項？", "back": "風險管理機制；內部控制及稽核制度；投資有價證券分析、決定、執行及檢討四大流程；投資績效評估流程；相關人員適當且即時的投資溝通機制；投資政策與流程合理性的內部檢視機制。", "tag": "第11章"}, {"no": "11", "key": "ch11:6", "ref": "7", "front": "訂定投資政策要考量哪些事項？", "back": "資產與負債關係、風險承受程度、長期風險報酬要求、流動性與清償能力及責任投資原則；並報經董事會通過。", "tag": "第11章"}, {"no": "11", "key": "ch11:7", "ref": "7", "front": "投資政策多久重新檢討一次？", "back": "至少每年一次，並報經董事會通過。", "tag": "第11章"}, {"no": "11", "key": "ch11:8", "ref": "7-1", "front": "股權投資相關人員多久申報個人交易？", "back": "至少每月（當月無交易則免申報）。", "tag": "第11章"}, {"no": "11", "key": "ch11:9", "ref": "7-1", "front": "內部稽核單位多久查核股權投資人員遵循情形？", "back": "至少每年，並揭露於內部稽核報告。", "tag": "第11章"}, {"no": "11", "key": "ch11:10", "ref": "9", "front": "誰負責投資政策的規劃、管理及執行？誰負最終責任？", "back": "董事會授權的高階主管人員負責規劃、管理及執行；董事會負投資管理流程與投資政策之最終責任。", "tag": "第11章"}, {"no": "11", "key": "ch11:11", "ref": "14", "front": "高階主管檢視內部作業程序適當性的頻率？", "back": "每年至少一次。", "tag": "第11章"}, {"no": "11", "key": "ch11:12", "ref": "16", "front": "投資執行報告提報給誰？內容至少有哪些？", "back": "提報董事會或其授權單位；內容至少含投資期間重大資產變動、各類資產項目持有部位、未來短期投資活動。", "tag": "第11章"}, {"no": "11", "key": "ch11:13", "ref": "19", "front": "資產管理自律規範何時開始實施？", "back": "民國96年1月1日。", "tag": "第11章"}, {"no": "11", "key": "ch11:14", "ref": "令（一）", "front": "判斷資金運用有沒有超限，用哪個價格？", "back": "以最近一筆交易的成交價格為評估基準；資金運用以購買成本入帳。", "tag": "第11章"}, {"no": "11", "key": "ch11:15", "ref": "令（一）", "front": "非因公司增加投資造成逾限，6 個月內仍無法改正，稽核部門要怎麼做？", "back": "立即陳報主管機關，並提出書面說明及具體改善計畫。", "tag": "第11章"}, {"no": "11", "key": "ch11:16", "ref": "令（二）", "front": "國外投資總額的「衡量日」是哪一天？", "back": "實際匯出外幣、或以外幣購買國外投資標的的時點。", "tag": "第11章"}, {"no": "11", "key": "ch11:17", "ref": "令（二）", "front": "國外投資總額怎麼計算？新增減部分用什麼匯率？", "back": "最近一期會計師簽證或核閱的決（結）算國外投資總額，加減至衡量日止所有新增減實際投資金額；新增減部分以實際入帳時的匯率計算。", "tag": "第11章"}, {"no": "11", "key": "ch11:18", "ref": "令（三）", "front": "國外投資總額的計算範圍，除了法令列的項目，還要計入什麼？", "back": "國外有價證券跨月交割的應收及應付款、衍生性金融資產與負債淨額、投資國外有價證券衍生的應收利息等與國外投資相關的項目。", "tag": "第11章"}, {"no": "11", "key": "ch11:19", "ref": "令（四）", "front": "外幣收付非投資型人身保險的保費與資金運用，國外投資限額怎麼算？", "back": "除相關法令明確排除外，併入國外投資限額計算。", "tag": "第11章"}, {"no": "11", "key": "ch11:20", "ref": "央行函（一）", "front": "壽險業辦理國外投資匯出資金，央行函列了哪三種方式？", "back": "（1）利用每年 5 千萬美元累積結匯金額；（2）經金融機構辦理特定金錢信託投資國外；（3）向央行專案申請核准匯出資金、自行投資國外。", "tag": "第11章"}], "scen": [{"no": "01", "ref": "13", "q": "依保險法第13條，人身保險包括下列哪些？A 人壽 B 責任 C 傷害 D 年金 E 健康", "opts": ["ABDE", "BCDE", "ABCD", "ACDE"], "ans": 3, "why": "第13條第3項：人壽、健康、傷害、年金。責任保險屬財產保險。", "tag": "第1章"}, {"no": "01", "ref": "119", "q": "要保人終止契約，保險費已付足一年以上，依保險法第119條，解約金金額？", "opts": ["不得少於保單價值準備金的四分之三", "得少於保單價值準備金的四分之三", "不得少於已繳保費", "由保險公司自行決定"], "ans": 0, "why": "第119條：保險人於接到通知後一個月內償付解約金，其金額不得少於要保人應得保單價值準備金之四分之三。", "tag": "第1章"}, {"no": "01", "ref": "146-4", "q": "依保險法第146-4條，保險業國外投資總額由主管機關核定，最高不得超過？", "opts": ["資金 35%", "資金 40%", "資金 45%", "業主權益 45%"], "ans": 2, "why": "第146-4條第2項：最高不得超過各該保險業資金百分之四十五。", "tag": "第1章"}, {"no": "01", "ref": "比率規範四", "q": "被保險人投保時 35 歲、現在是第 3 保單年度，到達年齡是 37 歲。依現行死亡給付比率規範，最低比率是？", "opts": ["190%", "160%", "140%", "120%"], "ans": 1, "why": "到達年齡＝35＋3－1＝37，落在 31–40 歲，不得低於 160%。", "tag": "第1章"}, {"no": "01", "ref": "比率規範一、二", "q": "下列哪一種保險，不適用死亡給付對保單價值準備金的最低比率規範？", "opts": ["定期壽險", "終身壽險", "小額終老保險", "投資型人壽保險"], "ans": 2, "why": "規範第二點：小額終老保險不適用。", "tag": "第1章"}, {"no": "01", "ref": "146-3", "q": "依保險法第146-3條，保險業以動產或不動產為擔保的放款，每一單位放款金額與放款總額的上限？", "opts": ["資金 5%、35%", "資金 10%、35%", "資金 5%、45%", "業主權益 5%、35%"], "ans": 0, "why": "第146-3條第2項：每一單位不超過資金 5%，放款總額不超過資金 35%。", "tag": "第1章"}, {"no": "01", "ref": "138", "q": "保險業辦理與保險有關的業務，涉及外匯業務，須經誰許可？", "opts": ["金管會", "中央銀行", "財政部", "壽險公會"], "ans": 1, "why": "保險法第138條第4項：涉及外匯業務之經營者，須經中央銀行之許可。", "tag": "第1章"}, {"no": "01", "ref": "143-4", "q": "依保險法第143-4條，「資本嚴重不足」是指？", "opts": ["淨值低於資本", "自有資本與風險資本比率低於一定比率的 25%，或淨值低於零", "資本適足率低於 100%", "比率低於 200%"], "ans": 1, "why": "第143-4條第3項。", "tag": "第1章"}, {"no": "01", "ref": "比率規範五、六", "q": "下列哪一種人壽保險，要在「保險期間內全期」符合最低比率？", "opts": ["非投資型萬能人壽保險", "投資型人壽保險", "非投資型人壽保險（不含萬能）", "以上皆是"], "ans": 2, "why": "規範第五點：非投資型（不含萬能）全期符合；萬能與投資型在投保、每次繳費、申請基本保額變更時符合。", "tag": "第1章"}, {"no": "01", "ref": "保險原則", "q": "「依購買者性別、年齡別、死亡率來繳付保險費」，是哪一個原則？", "opts": ["大數法則", "收支相等原則", "公平的危險分攤原則", "最小損害原則"], "ans": 2, "why": "公平的危險分攤；收支相等是保費總額＝保險金總額。", "tag": "第1章"}, {"no": "02", "ref": "13", "q": "客戶以美元購買外幣人身保險，想請保險公司收新臺幣、再由公司自行結匯。依第13條第1項，正確的說法是？", "opts": ["可以，保險公司可直接收新臺幣", "原則上款項不得以新臺幣收付，結匯由要保人或受益人依申報辦法逕向銀行業辦理", "由金管會代為結匯", "由央行直接收取新臺幣"], "ans": 1, "why": "第13條第1項：除本辦法或本行另有規定外，以外幣收付之保險，其相關款項之收付均不得以新臺幣為之；結匯由要保人或受益人逕向銀行業辦理。", "tag": "第2章"}, {"no": "02", "ref": "14", "q": "保險公司想辦理外幣保單質借放款，打算把新臺幣資金兌換成外幣來支應。依第14條，是否可以？", "opts": ["可以，只要匯率合適", "不可以，資金來源限用於國外投資的自有外幣資金", "可以，但要先經金管會同意", "可以，但只限一年期"], "ans": 1, "why": "第14條第1項：第3條第5款及第7款業務的資金來源，應以保險業用於國外投資之自有外幣資金為限。", "tag": "第2章"}, {"no": "02", "ref": "9", "q": "某保險公司取得外匯業務許可函後，八個月都還沒有開辦，也沒有申請延期。依第9條，央行可以怎麼處理？", "opts": ["只能口頭警告", "得按情節輕重廢止或撤銷該許可", "必須罰款", "應退回申請案"], "ans": 1, "why": "第9條第1款：發給許可函後六個月內未開辦者，央行得廢止或撤銷許可；有正當理由經核准可延三個月，限一次。「退回」是申請階段的書件問題。", "tag": "第2章"}, {"no": "02", "ref": "7", "q": "保險公司送件時，營業計畫書內容不充分，央行通知限期補正，公司逾期沒補。依第7條，央行得怎麼做？", "opts": ["廢止許可", "駁回申請", "退回申請案件", "直接核准"], "ans": 2, "why": "第7條：書件不完備或應記載事項不充分，經通知限期補正，屆期未補正，本行得退回其申請案件。", "tag": "第2章"}, {"no": "02", "ref": "8", "q": "下列哪一項是第8條列舉、央行得「駁回」申請的情形？", "opts": ["最近一年罰鍰累計達二百萬元", "申請資格不符第5條規定", "要保書欄位漏填", "負責人換人"], "ans": 1, "why": "第8條三款：申請資格不符第5條；最近一年有違反本辦法或其他外匯相關規定且情節重大（或限期改正逾期未改善）；其他足認有礙業務健全經營或不符金融政策要求之虞。罰鍰累計金額不是條文列舉的事由。", "tag": "第2章"}, {"no": "02", "ref": "6", "q": "保險公司申請辦理「擔任外幣聯合貸款案參加行之外幣放款」（第3條第7款）。依第6條第2項，下列哪兩項書件可以免附？", "opts": ["營業執照影本和董事會議事錄", "金管會核准證明文件和重要事項告知書", "營業計畫書和聲明書", "聲明書和重要事項告知書"], "ans": 1, "why": "第6條第2項：辦理第3條第3款及第7款業務時，免檢附前項第3款（金管會核准證明）及第6款（重要事項告知書）。", "tag": "第2章"}, {"no": "02", "ref": "5", "q": "一家外國保險業要向央行申請辦理外匯業務，應由誰備文？", "opts": ["外國總公司", "在我國境內設立之分支機構", "金管會", "壽險公會"], "ans": 1, "why": "第5條第2項：外國保險業申請辦理外匯業務，應由在我國境內設立之分支機構備文，檢附第6條規定書件向本行申請許可。", "tag": "第2章"}, {"no": "02", "ref": "15", "q": "某投資型保險商品連結衍生性商品並涉及外匯。依第15條，下列哪一項「不得」成為其投資標的內容？", "opts": ["外國貨幣市場的利率指標", "本國貨幣市場之新臺幣利率指標及匯率指標", "外國股價指數", "外幣債券"], "ans": 1, "why": "第15條：投資標的內容不得涉及本國貨幣市場之新臺幣利率指標及匯率指標，以及相關主管機關限制者。", "tag": "第2章"}, {"no": "02", "ref": "10", "q": "依第10條，保險業辦理各項外匯業務前，條文要求先確實辨識什麼？", "opts": ["客戶的投資偏好與財富來源", "顧客身分或基本登記資料，以及憑辦文件是否符合規定", "客戶的信用評等", "客戶的資產負債表"], "ans": 1, "why": "第10條的文字是「辨識顧客身分或基本登記資料及憑辦文件是否符合規定」，沒有寫瞭解客戶需求或財富來源。", "tag": "第2章"}, {"no": "02", "ref": "13", "q": "外幣投資型年金保險在累積期間屆滿後轉為一般帳簿的即期年金保險，若約定以新臺幣給付年金，結匯由誰辦理？", "opts": ["要保人", "受益人", "保險業", "銀行業自行決定"], "ans": 2, "why": "第13條第2項：此情形得約定以新臺幣給付年金，並由保險業依申報辦法等有關規定辦理結匯。（同條第1項一般外幣保險則由要保人或受益人逕向銀行業辦理。）", "tag": "第2章"}, {"no": "03", "ref": "24", "q": "旅客入境攜帶外幣，沒有向海關報明登記，被查獲。依第24條，處分是？", "opts": ["處新臺幣三百萬元以下罰鍰", "沒入", "處三年以下有期徒刑", "處新臺幣三萬元以上六十萬元以下罰鍰"], "ans": 1, "why": "第24條第3項：攜帶外幣出入國境，不依第11條規定報明登記者，沒入之；申報不實者，其超過申報部分沒入之。", "tag": "第3章"}, {"no": "03", "ref": "20", "q": "某人為達避稅目的，對新臺幣五十萬元以上的外匯收支故意申報不實。依第20條第1項，罰則是？", "opts": ["處新臺幣一萬元以上二十萬元以下罰鍰", "處新臺幣三萬元以上六十萬元以下罰鍰", "處新臺幣五萬元以上八十萬元以下罰鍰", "沒入其外匯"], "ans": 1, "why": "第20條第1項：違反第6-1條，故意不為申報或申報不實者，處新臺幣三萬元以上六十萬元以下罰鍰；受查詢時未於限期說明或虛偽說明亦同。", "tag": "第3章"}, {"no": "03", "ref": "22", "q": "某人長期私下替人買賣外匯營利，構成「以非法買賣外匯為常業」。依第22條，下列何者正確？", "opts": ["處三年以下有期徒刑、拘役或科或併科與營業總額等值以下之罰金，外匯及價金沒收", "僅處罰鍰", "僅沒入外匯", "處一年以下有期徒刑"], "ans": 0, "why": "第22條：處三年以下有期徒刑、拘役或科或併科與營業總額等值以下之罰金；其外匯及價金沒收之。", "tag": "第3章"}, {"no": "03", "ref": "2", "q": "依第2條，「外匯」的定義是？", "opts": ["外國貨幣、票據及有價證券", "外國貨幣、票據、有價證券及黃金", "外國貨幣及黃金", "外國貨幣及存款"], "ans": 0, "why": "第2條第1項：本條例所稱外匯，指外國貨幣、票據及有價證券。", "tag": "第3章"}, {"no": "03", "ref": "5", "q": "「調節外匯供需，以維持有秩序之外匯市場」，依第5條屬於誰的職掌？", "opts": ["行政主管機關", "掌理外匯業務機關（中央銀行）", "國際貿易主管機關", "海關"], "ans": 1, "why": "第5條第3款：掌理外匯業務機關辦理調節外匯供需，以維持有秩序之外匯市場。", "tag": "第3章"}, {"no": "03", "ref": "19-1", "q": "行政院依第19-1條決定關閉外匯市場。依條文，決定後要怎麼做？", "opts": ["十日內送立法院追認，不同意則失效", "三十日內送總統府備查", "由央行自行公告即可", "不需要任何追認"], "ans": 0, "why": "第19-1條第3項：行政院應於決定後十日內，送請立法院追認，如立法院不同意時，該決定應即失效。", "tag": "第3章"}, {"no": "03", "ref": "19-2", "q": "某人故意違反行政院依第19-1條採取的外匯措施，但後來立法院不同意追認該措施。依第19-2條，這個人？", "opts": ["仍處三百萬元以下罰鍰", "免罰", "處一百萬元以下罰鍰", "處三年以下有期徒刑"], "ans": 1, "why": "第19-2條第2項：前項規定於立法院對第19-1條之施行不同意追認時免罰。", "tag": "第3章"}, {"no": "03", "ref": "26-1", "q": "國際貿易長期順差、外匯存底鉅額累積時，誰可以決定停止第7、13、17條的適用？恢復適用後怎麼辦？", "opts": ["中央銀行；恢復後公告即可", "行政院；恢復後十日內送立法院追認", "立法院；恢復後送總統公告", "總統；恢復後送行政院核定"], "ans": 1, "why": "第26-1條：行政院得決定停止第7、13、17條的適用；恢復後十日內送請立法院追認，不同意該恢復適用的決定即失效。", "tag": "第3章"}, {"no": "03", "ref": "20", "q": "某人違反第7條規定，不將其出口貨款外匯結售或存入央行或其指定銀行。依第20條第2項，處分是？", "opts": ["沒入全部外匯", "按行為時匯率折算金額二倍以下罰鍰，並由央行追繳外匯", "三年以下有期徒刑", "新臺幣三萬元以上六十萬元以下罰鍰"], "ans": 1, "why": "第20條第2項：違反第7條不結售或不存入者，依其不結售或不存入外匯，處按行為時匯率折算金額二倍以下罰鍰，並由中央銀行追繳其外匯。", "tag": "第3章"}, {"no": "03", "ref": "11", "q": "旅客攜帶外幣出入國境，依第11條應向誰報明登記？", "opts": ["金管會", "中央銀行", "海關", "銀行"], "ans": 2, "why": "第11條：旅客或隨交通工具服務之人員，攜帶外幣出入國境者，應報明海關登記。", "tag": "第3章"}, {"no": "04", "ref": "5", "q": "某公司單筆結匯 150 萬美元，當年累積金額遠低於上限，也沒有其他特殊情形。依第5條，應如何辦理？", "opts": ["填妥申報書即可逕行辦理", "檢附證明文件，經銀行業確認與申報書相符後辦理", "必須向央行申請核准", "不能辦理"], "ans": 1, "why": "第5條第1款：公司、行號每筆結匯金額達等值一百萬美元以上，要檢附證明文件並經銀行業確認。央行核准則是第6條的情形。", "tag": "第4章"}, {"no": "04", "ref": "5", "q": "某個人單筆結匯 60 萬美元（非貨品進出口，也非核准投資）。依第5條，下列何者正確？", "opts": ["免證明文件，逕行辦理", "檢附證明文件，經銀行業確認後辦理", "向金管會申請核准", "向央行申請核准"], "ans": 1, "why": "第5條第2款：團體、個人每筆結匯金額達等值五十萬美元以上，要檢附證明文件並經銀行業確認。", "tag": "第4章"}, {"no": "04", "ref": "6", "q": "某個人今年的必要性匯款累積結匯金額已遠超過每年累積上限（約 2,000 萬美元，無論新舊制都超過）。依第6條，應如何辦理？", "opts": ["填妥申報書逕行辦理", "經由銀行業向央行申請核准後辦理", "向金管會申請核准", "不得辦理"], "ans": 1, "why": "第6條第1款：每年累積超過上限的必要性匯款，要檢附申報書及證明文件，經由銀行業向本行（央行）申請核准。", "tag": "第4章"}, {"no": "04", "ref": "4", "q": "某公司今年以新臺幣結購外幣（非貨品進出口），累計 3,000 萬美元，無論新舊制都未超過上限。依第4條，應如何辦理？", "opts": ["填妥申報書，逕行辦理", "一律向央行申請核准", "一律經銀行業確認證明文件", "不得辦理"], "ans": 0, "why": "第4條第1項第3款：公司、行號每年累積結購或結售金額未超過上限，填妥申報書即可逕行辦理。", "tag": "第4章"}, {"no": "04", "ref": "4", "q": "一位非居住民自然人單筆結售 8 萬美元。依第4條第1項第5款，下列何者正確？", "opts": ["須向央行申請核准", "未超過十萬美元，得填妥申報書逕行辦理", "須有法定代理人簽章", "一律不得結售"], "ans": 1, "why": "第4條第1項第5款：非居住民每筆結購或結售金額未超過等值十萬美元，可逕行辦理；但境外非中華民國金融機構不得以匯入款項辦理結售。", "tag": "第4章"}, {"no": "04", "ref": "6", "q": "一位非居住民因依法繼承境內遺產，單筆要結匯 15 萬美元。依第6條，應如何辦理？", "opts": ["逕行辦理", "檢附證明文件經銀行業確認即可", "經由銀行業向央行申請核准", "不得辦理"], "ans": 2, "why": "第6條第1項第3款第4目：非居住民於境內依法取得之遺產、保險金及撫卹金，每筆超過等值十萬美元者，要向央行申請核准。", "tag": "第4章"}, {"no": "04", "ref": "6", "q": "一位 17 歲、領有身分證、且未結婚的人，單筆結匯新臺幣 60 萬元。依第6條，下列何者正確？", "opts": ["逕行辦理即可", "須向央行申請核准，並由法定代理人代辦、共同簽章", "只要銀行業確認即可", "須由金管會核准"], "ans": 1, "why": "第6條第1項第2款及第2項：未滿十八歲者每筆達新臺幣五十萬元以上，須向央行申請核准；除已結婚者外，由法定代理人代辦並共同簽章。", "tag": "第4章"}, {"no": "04", "ref": "8", "q": "銀行業對櫃檯辦理新臺幣結匯申報所填報的申報書及提供文件，保存期限至少多久？", "opts": ["一年", "三年", "五年", "七年"], "ans": 2, "why": "第8條第2項：保存期限至少為五年。網際網路申報的電子紀錄與文件，第11條第3項第3款也是至少五年。", "tag": "第4章"}, {"no": "04", "ref": "13", "q": "申報人辦完結匯申報後，發現申報內容有誤，確定是非故意的。依第13條，下列何者正確？", "opts": ["不能更改，也沒有任何例外", "可經銀行業向央行申請更正，但要舉證並檢具律師、會計師或銀行業出具的無故意申報不實意見書", "可直接要求銀行業更改", "由金管會核准更正"], "ans": 1, "why": "第13條：申報後原則上不得要求更改；例外之一是非故意申報不實，經舉證並檢具律師、會計師或銀行業出具無故意申報不實意見書。", "tag": "第4章"}, {"no": "04", "ref": "3", "q": "依第3條對「銀行業」的定義，下列何者「不屬於」銀行業？", "opts": ["信用合作社", "農會信用部", "中華郵政股份有限公司", "外匯證券商"], "ans": 3, "why": "第3條第1款：銀行業＝銀行、全國農業金庫、信用合作社、農會信用部、漁會信用部、中華郵政。外匯證券商是第2款另外定義的。", "tag": "第4章"}, {"no": "05", "ref": "4", "q": "某保險公司想把外匯存款集中存放在同一家銀行。依第4條，該存款不得超過？", "opts": ["保險業業主權益 3%", "保險業資金 3%", "保險業資金 5%", "核定國外投資額度 3%"], "ans": 1, "why": "第4條第2項：存放於同一銀行之金額，不得超過該保險業資金百分之三。", "tag": "第5章"}, {"no": "05", "ref": "9", "q": "某保險公司投資一檔資產證券化商品，評等 A-。依第9條，單一商品的投資金額上限與總額上限分別是？", "opts": ["資金 1%；核定國外投資額度 20%", "資金 5%；核定國外投資額度 10%", "業主權益 1%；核定國外投資額度 20%", "資金 1%；資金 20%"], "ans": 0, "why": "第9條第2項：總額不得超過核定國外投資額度 20%，對每一資產證券化商品的投資金額不得超過資金 1%。", "tag": "第5章"}, {"no": "05", "ref": "9", "q": "保險業投資房利美（聯邦國民抵押貸款協會）發行的住宅不動產抵押貸款債券。依第9條第4項，限額是？", "opts": ["總額核定國外投資額度 20%，每一機構 1%", "不受 A- 與 20%、1% 的限制，但總額不超過核定額度 50%，每一機構不超過 25%", "完全沒有限額", "總額資金 5%"], "ans": 1, "why": "第9條第4項：不受第2項及第3項限制，但總額不得超過核定國外投資額度 50%，每一機構不得超過核定國外投資額度 25%。", "tag": "第5章"}, {"no": "05", "ref": "8", "q": "保險業投資國外對沖基金，對該基金經理公司的條件，下列何者符合第8條？", "opts": ["管理歷史滿 5 年、管理資產不少於美金 5 億元", "管理歷史滿 2 年、管理資產不少於美金 2 億元", "管理歷史滿 1 年、管理資產不少於美金 1 億元", "管理歷史滿 3 年、管理資產不少於美金 3 億元"], "ans": 1, "why": "對沖基金經理公司：主權評等 A+ 以上、IOSCO MMoU、歷史滿 2 年、管理資產不少於美金 2 億元。滿 5 年、5 億是私募基金。", "tag": "第5章"}, {"no": "05", "ref": "8", "q": "某保險公司對一檔對沖基金的投資金額達其資金的萬分之五以上。依第8條，還需要什麼程序？", "opts": ["不需要任何程序", "提報該保險業董事會通過後始得投資", "向央行申請核准", "向壽險公會備查"], "ans": 1, "why": "第8條第3項第4款：單一基金投資總額超過保險業資金萬分之五以上者，應提報董事會通過；未達新臺幣一億元者以一億元計。", "tag": "第5章"}, {"no": "05", "ref": "8", "q": "依第8條，保險業投資「國外表彰基金之有價證券」的總額，上限是？", "opts": ["資金 5%", "核定國外投資總額 40%", "業主權益 10%", "核定國外投資額度 20%"], "ans": 1, "why": "第8條第2項：國外表彰基金之有價證券總額，不得超過其依保險法第146-4條核定國外投資總額的 40%。", "tag": "第5章"}, {"no": "05", "ref": "11", "q": "保險業投資國外商辦大樓（非自用），依第11條，「已合法利用並產生利用效益」的認定標準是？", "opts": ["出租率達 40%", "出租率達 60%，並符合當地經濟環境投資報酬率", "只要取得所有權", "出租率達 80%"], "ans": 1, "why": "第11條第3項：除自用不動產外，係指出租率達百分之六十，並符合當地經濟環境之投資報酬率。（80% 是第11-4條另一個情形）", "tag": "第5章"}, {"no": "05", "ref": "11-2", "q": "保險業以貸款方式提供特定目的不動產投資事業資金，依第11-2條，董事會通過門檻是？", "opts": ["過半數董事出席、出席董事過半數同意", "三分之二以上董事出席、出席董事四分之三以上同意", "全體董事一致同意", "三分之二董事同意即可"], "ans": 1, "why": "第11-2條：應經董事會三分之二以上董事出席及出席董事四分之三以上同意。", "tag": "第5章"}, {"no": "05", "ref": "11-2", "q": "特定目的不動產投資事業取得的各項收入，除預留必要營運資金外，依第11-2條應在多久內匯回母公司？", "opts": ["每年結算並經會計師簽證後 3 個月內", "每年結算並經會計師簽證後 6 個月內", "每季結算後 1 個月內", "每年結算後 12 個月內"], "ans": 1, "why": "第11-2條：除預留必要之營運資金外，應於每年結算並經會計師簽證後六個月內匯回母公司。", "tag": "第5章"}, {"no": "05", "ref": "10", "q": "保險業投資國際性組織發行的債券，依第10條，評等與限額是？", "opts": ["評等 BBB 以上；資金 10%", "評等 A- 以上；每一國際性組織不超過資金 5%", "評等 AA 以上；資金 3%", "沒有評等要求；資金 5%"], "ans": 1, "why": "第10條第1項：債券發行評等須 A- 級或相當等級以上，且對每一國際性組織所發行債券的投資總額不得超過保險業資金 5%。", "tag": "第5章"}, {"no": "05", "ref": "16", "q": "某保險公司經核定的國外投資額度已達資金 35%。依第16條，其國外投資有價證券的保管有什麼規定？", "opts": ["可全部自行保管", "應集中由保管機構保管，且集保公司以外的保管機構不得超過 5 家", "只能由集保公司保管", "保管機構不得超過 2 家"], "ans": 1, "why": "第16條：核定國外投資額度達資金 35% 或國外投資金額達美金 10 億元以上者，國外投資有價證券應集中由保管機構保管，集保公司以外的保管機構不得超過五家（有特定金錢信託的例外）。", "tag": "第5章"}, {"no": "05", "ref": "15", "q": "保險業已訂定國外投資交易處理程序與風險監控措施並經董事會通過。依第15條，基本的國外投資額度與相關資料保存期間是？", "opts": ["資金 10%；至少保存 5 年", "資金 25%；至少保存 3 年", "資金 10%；至少保存 1 年", "資金 35%；至少保存 5 年"], "ans": 0, "why": "第15條：得在資金 10% 額度內辦理國外投資；交易處理程序所涉書面分析報告、紀錄、檢討報告等資料，至少保存 5 年。", "tag": "第5章"}, {"no": "05", "ref": "15", "q": "某人身保險公司已把國外投資額度提高到資金 35%。現在想申請超過 35%，依第15條，下列何者「不是」條件？", "opts": ["取得 35% 核准已逾一年", "董事會每年訂定風險限額並定期控管", "當年度未取得其他提高國外投資總額核准", "設有內部風險模型以量化公司整體風險"], "ans": 3, "why": "第15條第4項（超過 35%）：核准已逾一年、董事會每年訂風險限額、資本比率 1.25 倍以上或評等 AA- 以上、當年度未取得其他提高核准。「設有內部風險模型」是第5項（超過 40%）才要的條件。", "tag": "第5章"}, {"no": "06", "ref": "三", "q": "客戶問：「能不能在契約裡寫，將來我可以約定把收付幣別從美元換成澳幣？」業務員的正確回應是？", "opts": ["可以，只要雙方在契約裡約定即可", "不行，條文不得約定各幣別間相互變換", "可以，但要先向壽險公會報備", "可以，但只限年金保險"], "ans": 1, "why": "第三點第一項：可約定收付的外幣幣別，但不得約定新臺幣與外幣或各幣別間之相互變換。這一項沒有例外。", "tag": "第6章"}, {"no": "06", "ref": "六", "q": "客戶持有美元非投資型保單，想「轉換」成新臺幣收付的人身保險保單，以後不用管匯率。依第六點，應如何回答？", "opts": ["可以，向保險公司申請即可", "不得辦理契約轉換", "可以，但需經中央銀行許可", "可以，但每年限一次"], "ans": 1, "why": "第六點：外幣非投資型人身保險契約與新臺幣收付之人身保險契約間，不得辦理契約轉換。", "tag": "第6章"}, {"no": "06", "ref": "五", "q": "客戶問：「我繳美元，保險公司會不會把對應的資產換成新臺幣去運用？」依條文，下列何者正確？", "opts": ["會，條文允許自由兌換", "不會，對應的一般帳簿資產不得兌換為新臺幣", "會，但須先通知要保人", "由要保人決定"], "ans": 1, "why": "第五點：對應的一般帳簿資產不得兌換為新臺幣，且資金運用仍依保險法第146條之4辦理。", "tag": "第6章"}, {"no": "06", "ref": "四", "q": "客戶想買外幣的「住院醫療實支實付」健康保險。依第四點對健康保險給付項目的限制，最接近正確的說明是？", "opts": ["可以，健康保險全部都在範圍內", "不在範圍內，健康險給付項目限豁免保費或一次性給付之癌症、重大疾病或特定疾病", "可以，只要不是癌症", "可以，但須提高保費"], "ans": 1, "why": "第四點第二項：健康保險給付項目以豁免保險費或一次性給付之癌症疾病、重大疾病或特定疾病為限。實支實付醫療不在列舉項目內（此為依條文文字的判斷）。", "tag": "第6章"}, {"no": "06", "ref": "三", "q": "客戶有一張美元保單，約定其生存保險金應給付日當日，直接抵繳另一張澳幣保單的保費，且兩張保單是同一人。能適用第三點第二項的例外嗎？", "opts": ["能，因為要保人是同一人", "不能，抵繳的必須是相同幣別的外幣保險契約", "能，只要事先通知保險公司", "不能，因為生存保險金不能抵繳"], "ans": 1, "why": "例外要同時符合：應給付日當日、相同幣別、受益人與被抵繳契約要保人為同一人。美元抵澳幣，幣別不同，不符合。", "tag": "第6章"}, {"no": "06", "ref": "八", "q": "一位業務員當年度沒有參加匯率風險及外匯相關法規的在職教育訓練。依第八點第一款，結果是什麼？", "opts": ["下次補修即可，不影響招攬", "公司應暫停授權其次一年度招攬該等保險商品", "被撤銷業務員登錄", "公司應罰款"], "ans": 1, "why": "第八點第一款：當年度未參加或未通過訓練者，應暫停授權其次一年度招攬該等保險商品。撤銷登錄與罰款不是條文寫的後果。", "tag": "第6章"}, {"no": "06", "ref": "八", "q": "準備匯率風險說明書時，業務員要用哪組情境說明才符合條文？", "opts": ["最近三年的最高與最低匯率", "最近十年內的最高、平均、最低三種匯率", "去年同期匯率與今年匯率", "客戶自行指定的三種匯率"], "ans": 1, "why": "第八點第二款第二目：採收付幣別最近十年內之最高、平均及最低等三種匯率情境，並以視覺化方式舉例說明。", "tag": "第6章"}, {"no": "06", "ref": "八", "q": "客戶問：「這種保單，保險公司每年一定要給我什麼資訊？」依第八點第三款，最符合的是？", "opts": ["當年度投資績效", "當年度解約金、死亡保險金額、生存保險金額折合新臺幣的參考價值", "每季的匯率走勢報告", "每月對帳單"], "ans": 1, "why": "至少每年一次揭露解約金、死亡保險金額及生存保險金額等給付項目折合新臺幣計算後的參考價值；提供方式由保險人與要保人約定。本業務是非投資型，沒有「投資績效」。", "tag": "第6章"}, {"no": "06", "ref": "二", "q": "某公司最近一年公平待客原則評核結果在業界前 85%，其他條件都符合。依第二點，下列何者正確？", "opts": ["符合，因為門檻是前 90%", "原則上不符合，但可提出合理說明並經主管機關核准", "一定不符合，沒有例外", "只要公司規模夠大就符合"], "ans": 1, "why": "第二點第一項第四款：要前 80%，但經公司提出合理說明並經主管機關核准者，不在此限。", "tag": "第6章"}, {"no": "06", "ref": "十", "q": "依現行第十點，業務單位與內部稽核單位對本業務的專案查核頻率分別為？", "opts": ["業務單位每季、稽核每半年", "業務單位每半年、稽核每年", "業務單位每年、稽核每季", "兩者都是每季"], "ans": 1, "why": "現行條文：業務單位每半年專案自行查核；內部稽核單位每年專案查核，報告提報最近一次董事會通過。民國115年2月5日修正前的頻率較高（自行查核為每季）。", "tag": "第6章"}, {"no": "07", "ref": "8", "q": "某保險公司想把專設帳簿的資產出售給一般帳簿，沒有符合任何例外。依第8條，是否可以？", "opts": ["可以，雙方帳簿都是公司的", "原則上不得互相出售、交換或移轉", "可以，但要向央行申請", "可以，只要用現金"], "ans": 1, "why": "第8條：置於專設帳簿的資產與一般帳簿資產間，不得互相出售、交換或移轉，三種但書情形除外。", "tag": "第7章"}, {"no": "07", "ref": "6", "q": "保險公司變更了專設帳簿資產的保管機構。依第6條，應如何處理？", "opts": ["變更後 15 個工作日內向主管機關申報", "變更前 30 日向壽險公會備查", "不需要申報", "變更後 3 個月內向央行申報"], "ans": 0, "why": "第6條第2項：保管機構有變更者，應於變更後十五個工作日內向主管機關申報。", "tag": "第7章"}, {"no": "07", "ref": "23", "q": "某全委投資型保險的要保人申請轉換為不同投資方針的全委契約，沒有險種、期間、保險金額改變致危險增加的情形。依第23條，保險人？", "opts": ["可以任意拒絕", "不得拒絕", "須經主管機關核准才能接受", "須先終止原契約"], "ans": 1, "why": "第23條第1項：除因險種、保險期間或保險金額改變所致危險增加之情形外，保險人不得拒絕。", "tag": "第7章"}, {"no": "07", "ref": "24", "q": "全委投資型保險契約簽訂後，因法令變更使投資範圍增減，保險人通知要保人的期間，以及要保人異議終止契約時的解約費用，依第24條是？", "opts": ["不低於 60 日；不得收取任何解約費用", "不超過 30 日；可收取一般解約費用", "不低於 90 日；減半收取", "不超過 60 日；可收取手續費"], "ans": 0, "why": "第24條：以不低於六十日之期間內通知要保人；要保人在期間內表示異議並申請終止契約者，保險人不得向要保人收取任何解約費用。", "tag": "第7章"}, {"no": "07", "ref": "27", "q": "保險公司應於何時內編具全委投資型專設帳簿的資產年度決算報告？", "opts": ["會計年度終了後 1 個月內", "會計年度終了後 4 個月內", "會計年度終了後 6 個月內", "會計年度終了前"], "ans": 1, "why": "第27條第2項：應於會計年度終了後四個月內編具，並經會計師查核簽證後函報主管機關備查，並公告之。", "tag": "第7章"}, {"no": "07", "ref": "12", "q": "保險人全權決定運用專設帳簿資產時，下列哪一項是第12條「不得」做的？", "opts": ["投資公開發行公司股票", "投資私募有價證券", "投資台灣存託憑證", "投資證券投資信託基金"], "ans": 1, "why": "第12條第6款：不得投資私募有價證券。公開發行公司股票、台灣存託憑證、證券投資信託基金都在第11條範圍內。", "tag": "第7章"}, {"no": "07", "ref": "16", "q": "保險人行使專設帳簿持有股票的表決權，相關的決策與執行紀錄應保存多久？", "opts": ["至少 1 年", "至少 3 年", "至少 5 年", "至少 10 年"], "ans": 2, "why": "第16條第1項第4款：循序編號建檔，至少保存五年。", "tag": "第7章"}, {"no": "07", "ref": "10", "q": "下列哪一項「不在」第10條所列的投資型保險連結標的內？", "opts": ["證券投資信託基金受益憑證", "結構型商品", "公開發行之公司股票", "金融債券"], "ans": 2, "why": "第10條第1項十二款沒有列公開發行公司股票；股票只在第11條（全權決定運用）範圍內。", "tag": "第7章"}, {"no": "07", "ref": "18", "q": "外幣收付的投資型保險，其專設帳簿資產可以怎麼投資？", "opts": ["任何幣別都可以", "以投資外幣計價的投資標的為限", "只能投資新臺幣標的", "只能投資銀行存款"], "ans": 1, "why": "第18條第3項：以外幣收付之投資型保險契約，其專設帳簿資產，以投資外幣計價之投資標的為限。", "tag": "第7章"}, {"no": "07", "ref": "9", "q": "投資型保險連結的投資標的，其發行或經理機構破產了。依第9條，保險人應？", "opts": ["不必處理", "基於要保人、受益人之利益向該機構積極追償", "由要保人自行追償", "向主管機關申請補貼"], "ans": 1, "why": "第9條第2項：保險人應基於要保人、受益人之利益向該機構積極追償。", "tag": "第7章"}, {"no": "07", "ref": "14", "q": "投資型保險連結「境外基金」，依第14條，下列何者正確？", "opts": ["只要國外有核准就可以連結", "須經主管機關核准或申報生效在國內募集及銷售", "只能連結不動產投資信託基金", "只要保險人自己評估風險即可"], "ans": 1, "why": "第14條第1項：境外基金須經主管機關核准或申報生效在國內募集及銷售；國外證券交易市場交易的 ETF 例外。", "tag": "第7章"}, {"no": "08", "ref": "九", "q": "某投資型保險連結的金融債券，被信評機構調降評等達附表五所列等級以下。依第九點，保險人應？", "opts": ["事實發生日起 3 日內通知要保人", "事實發生日起 30 日內通知要保人", "年底彙總通知", "不需要通知"], "ans": 0, "why": "第九點：應於事實發生之日起三日內通知要保人。", "tag": "第8章"}, {"no": "08", "ref": "六", "q": "某國內結構型商品的到期保本率只有 90%，且含發行機構得提前贖回的選擇權。依第六點，可以連結嗎？", "opts": ["可以", "不可以，保本率至少 100%，且不得含目標贖回與提前贖回選擇權", "只要揭露風險就可以", "只要保證機構評等夠就可以"], "ans": 1, "why": "第六點第六款：到期保本率至少為原計價貨幣本金百分之一百，且不得含有目標贖回式設計及發行機構得提前贖回之選擇權。", "tag": "第8章"}, {"no": "08", "ref": "五", "q": "投資型保險想連結一檔證券投資信託事業以私募方式發行的基金受益憑證。依第五點？", "opts": ["可以", "不可以，不得連結私募基金受益憑證或其他國內外私募有價證券", "須向壽險公會報備", "可以，但比例不超過 5%"], "ans": 1, "why": "第五點第（一）款：不得連結或運用於證券投資信託事業以私募方式發行的基金受益憑證，或其他國內外私募的有價證券。", "tag": "第8章"}, {"no": "08", "ref": "八", "q": "保險人透過全權委託投資事業運用專設帳簿，為避險目的想連結放空 ETF。依第八點，上限是？", "opts": ["反向不超過一倍", "反向不超過二倍", "正向不超過二倍", "沒有上限"], "ans": 0, "why": "第八點第二項第一款：為避險目的者，得連結具放空效果的 ETF，且以反向不超過一倍為限。正向不超過二倍是風險管理目的的槓桿 ETF。", "tag": "第8章"}, {"no": "08", "ref": "八", "q": "「槓桿 ETF 與相對應標的具高度相關性」，依第八點的定義，是指？", "opts": ["過去一年全部資料，相關係數達 50%", "過去三個月以上全部交易歷史資料，相關係數達 70% 以上", "過去三個月以上的部分資料，相關係數達 80%", "過去一週，相關係數達 70%"], "ans": 1, "why": "第八點第三項：以過去三個月以上之全部交易歷史資料為樣本計算，相關係數達百分之七十以上。", "tag": "第8章"}, {"no": "08", "ref": "八之一", "q": "某有約定到期日的債券型基金，投資於附表五所列某一評級的債券。依第八點之一，該評級的投資總金額上限？", "opts": ["基金淨資產價值 10%", "基金淨資產價值 20%", "基金淨資產價值 40%", "基金淨資產價值 60%"], "ans": 2, "why": "第八點之一：投資於附表五所列該一定評級之投資總金額不得超過該基金淨資產價值之百分之四十。", "tag": "第8章"}, {"no": "08", "ref": "八之二", "q": "全權委託的專設帳簿，投資於非投資等級債券達淨資產 60% 以上的基金與新興市場債券達 60% 以上的基金。依第八點之二，上限是？", "opts": ["合計 10%，其中非投資等級 5%", "合計 20%，其中非投資等級 10%", "合計 40%，其中非投資等級 20%", "沒有限制"], "ans": 1, "why": "第八點之二第（一）款：合計不超過百分之二十，且其中非投資等級債券基金不超過百分之十。", "tag": "第8章"}, {"no": "08", "ref": "十一", "q": "匯率避險用的衍生性金融商品，其契約總名目價值依第十一點，上限是？", "opts": ["被避險項目帳面價值的 50%", "不超過被避險項目的總帳面價值", "專設帳簿資產的 10%", "沒有上限"], "ans": 1, "why": "第十一點：契約總（名目）價值合計不得超過被避險項目之總帳面價值；因市場波動超限者，受託機構三個營業日內處置後符合規定可不在此限。", "tag": "第8章"}, {"no": "08", "ref": "三", "q": "國內結構型商品沒有商品發行評等時，依第三點，評等怎麼認定？", "opts": ["視為不合格", "以國內發行機構或保證機構的長期債務信用評等替代", "由壽險公會認定", "以保管機構評等替代"], "ans": 1, "why": "第三點第（三）款但書：無法取得商品發行評等者，以國內發行機構或保證機構之長期債務信用評等等級替代。", "tag": "第8章"}, {"no": "08", "ref": "十", "q": "依注意事項第十點，認定「匯率避險目的」的貨幣衍生商品交易，下列何者「不符合」？", "opts": ["被避險項目已存在且可明確辨認", "避險商品可降低被避險項目的匯率風險", "連結標的與被避險項目間相關係數達 70% 以上", "先買進衍生商品，之後再找可避險的標的"], "ans": 3, "why": "第十點第2項第1款：被避險項目必須已存在並使專設帳簿資產暴露於匯率風險；不能先交易再找標的。", "tag": "第8章"}, {"no": "09", "ref": "七", "q": "依第七點，外幣非投資型保險商品的要保書及保單條款，要載明下列哪一組事項？", "opts": ["保險費收取方式、匯款費用之負擔、匯率風險揭露", "客戶適合度、匯款費用之負擔、保險費收取方式", "匯率風險揭露、外幣資產區隔方式、會計處理方式", "保險費收取方式、資產負債配置、匯率風險揭露"], "ans": 0, "why": "第七點第二項：應於要保書及保單條款載明保險費收取方式、匯款費用之負擔及匯率風險揭露等相關事宜。客戶適合度、資產區隔、會計處理等不在這一句裡。", "tag": "第9章"}, {"no": "09", "ref": "八", "q": "業務員招攬外幣非投資型保險時，依第八點，要在要保書及商品簡介的哪裡揭露風險與費用事項？", "opts": ["任何一頁小字", "明顯處", "最後一頁", "附件"], "ans": 1, "why": "第八點第二款第一目：應於要保書及商品簡介明顯處揭露保險費收取方式、匯款費用之負擔及商品所涉匯率風險，以及商品幣別所屬國家之政治、經濟變動風險等。", "tag": "第9章"}, {"no": "09", "ref": "八", "q": "匯率風險說明書要用哪三種匯率情境舉例說明？", "opts": ["最近三年的高、低、收盤", "收付幣別最近十年內的最高、平均、最低", "客戶選擇的三種匯率", "去年同期的三種匯率"], "ans": 1, "why": "第八點第二款第二目：採收付幣別最近十年內之最高、平均及最低等三種匯率情境。", "tag": "第9章"}, {"no": "09", "ref": "八", "q": "新臺幣兌美元由 33 變成 31，下列敘述何者正確？", "opts": ["新臺幣貶值、美元升值", "新臺幣升值、美元貶值", "新臺幣與美元都貶值", "匯率沒有變化"], "ans": 1, "why": "1 美元原本可換 33 元新臺幣，變成只能換 31 元：新臺幣升值、美元貶值。（算術判斷）", "tag": "第9章"}, {"no": "09", "ref": "八", "q": "簽約時 1 美元＝31 元新臺幣，保險金額 10 萬美元。被保險人身故領取時 1 美元＝30 元新臺幣，受益人把美元換成新臺幣。結果是？", "opts": ["匯兌損失新臺幣 10 萬元", "匯兌利益新臺幣 10 萬元", "匯兌損失新臺幣 1 萬元", "沒有影響"], "ans": 0, "why": "簽約時換算 10萬×31＝310 萬元；領取時 10萬×30＝300 萬元，少 10 萬元，是匯兌損失。（算術判斷）", "tag": "第9章"}, {"no": "09", "ref": "八", "q": "要保人要繳 1 萬美元保費，需以新臺幣結購外幣。匯率從 30 變成 32，要保人需準備的新臺幣會如何？", "opts": ["減少新臺幣 2 萬元", "增加新臺幣 2 萬元", "不變", "增加新臺幣 20 萬元"], "ans": 1, "why": "1萬×30＝30 萬元，1萬×32＝32 萬元，多 2 萬元新臺幣；新臺幣貶值，結購外幣要花更多新臺幣。（算術判斷）", "tag": "第9章"}, {"no": "09", "ref": "八", "q": "依第八點，銷售外幣非投資型保險前，保險公司應建立什麼，並瞭解要保人的什麼？", "opts": ["商品適合度政策；需求與承受匯率風險能力", "廣告審查制度；投資績效", "客戶忠誠度計畫；信用評等", "招攬獎金制度；年齡"], "ans": 0, "why": "第八點第四款：應瞭解要保人之需求與承受匯率風險能力，銷售前並應建立商品適合度政策。", "tag": "第9章"}, {"no": "09", "ref": "九", "q": "外幣保險商品的「客戶適合度規範」是由誰訂定的？", "opts": ["金管會", "中央銀行", "中華民國人壽保險商業同業公會", "中華民國精算學會"], "ans": 2, "why": "第九點：精算學會訂外幣保險商品精算實務處理準則；壽險公會訂客戶適合度規範。", "tag": "第9章"}, {"no": "09", "ref": "函 三", "q": "依金管會110年函，保險公司應多久更新一次匯率風險說明書的匯率情境？", "opts": ["每月一次", "每半年一次", "每年一次，最遲 3 月 1 日前", "每三年一次"], "ans": 2, "why": "函說明三（一）：每年更新一次，更新時點至遲應於每年 3 月 1 日前完成。", "tag": "第9章"}, {"no": "09", "ref": "函 三", "q": "關於匯率風險說明書的法律地位，下列何者正確？", "opts": ["是要保書的一部分", "不是要保書的一部分，但是保險契約構成之一部分", "與契約無關，只是行銷文件", "只由保險公司留存，不需交給要保人"], "ans": 1, "why": "函說明三（二）：非要保書之一部分，但為保險契約構成之一部分；要保人與保險公司雙方各執一份。", "tag": "第9章"}, {"no": "10", "ref": "二", "q": "某保險公司要推出公司的第一張以外幣收付的人身保險商品。依認定標準第二點，這張商品是？", "opts": ["不是新型態保險商品", "新型態保險商品（其他特殊事項第一款）", "只有投資型才是新型態", "由主管機關另行公告才知道"], "ans": 1, "why": "第二點第四項第一款：各公司第一張以外幣收付之人身保險商品屬其他特殊事項，即新型態保險商品。條文沒有限定傳統型或投資型。", "tag": "第10章"}, {"no": "10", "ref": "二", "q": "某保險公司要推出第一張「約定以新臺幣為收付幣別的傳統型保險商品」。依認定標準第二點，它屬於新型態保險商品嗎？", "opts": ["屬於，因為是公司第一張", "目前條文列舉的其他特殊事項中沒有這一款，不屬於", "屬於，因為是傳統型", "要看壽險公會抽籤"], "ans": 1, "why": "現行第二點第四項七款特殊事項中，沒有「新臺幣傳統型首張」這一款（這是舊版內容）。", "tag": "第10章"}, {"no": "10", "ref": "二", "q": "某新型態保險商品經主管機關核准後已逾一年。依認定標準第二點，結果是？", "opts": ["仍是新型態", "不屬新型態保險商品", "需重新送審", "改由壽險公會管理"], "ans": 1, "why": "第二點第五項第一款：新型態保險商品經主管機關核准時間逾一年，不屬新型態保險商品。", "tag": "第10章"}, {"no": "10", "ref": "二", "q": "某類新型態保險商品核准時間尚未滿一年，但同類型已經核准了三張。依認定標準第二點，第四張是？", "opts": ["仍是新型態", "不屬新型態保險商品", "須延長核准", "只有投資型才不算"], "ans": 1, "why": "第二點第五項第二款：同類型新型態保險商品核准時間雖未逾一年，惟已核准達三張，不屬新型態保險商品。", "tag": "第10章"}, {"no": "10", "ref": "二", "q": "下列哪一項「屬於」認定標準第二點第四項所列的其他特殊事項？", "opts": ["各公司第一張由保險人全權決定運用標的之投資型保險商品", "核准時間逾一年的商品", "同類型商品僅縮短法定傳染病等待期間", "同類型疫苗接種不良反應商品，範圍未逾已核准商品"], "ans": 0, "why": "第四項第三款：各公司第一張由保險人全權決定運用標的之投資型保險商品。其餘三項是第五項「不屬新型態」的情形。", "tag": "第10章"}, {"no": "10", "ref": "三", "q": "保險公司對某商品是否屬於新型態有疑義，依認定標準第三點，應向誰函請認定？", "opts": ["金管會", "中央銀行", "壽險公會", "保發中心"], "ans": 2, "why"
