事人民幣計價的資金運用；大陸地區政府、公司有價證券限於：政府公債及國庫券（含銀行間債券市場）、集中市場股票及 IPO 股票、集中市場或銀行間債券市場的公司債及金融債券、掛牌上市的證券投資基金及 ETF、避險用的衍生性金融商品。限額：政府公債及國庫券不超過核定國外投資額度 5%；次順位公司債與金融債不超過 1%；同一公司的證券不超過核定額度 1% 及發行公司業主權益 10%；每一基金不超過核定額度 1% 及基金已發行總額 10%；前述第1至4款有價證券及 ETF 合計不超過 10%。  第2項第2款：投資時資本適足比率未達法定標準者，只能做第1項第1款（政府公債、國庫券）與第5款（避險衍生性商品）；經核准才可做第3、4款（公司債、金融債券、基金與 ETF）。 保險業已訂定經董事會通過之從事大陸地區投資相關交易處理程序及風險監控管理措施，並由董事會每年訂定外匯風險管理限額及由風險管理委員會或風險管理部門定期控管者，得依本辦法從事以人民幣計價之各項資金運用，但其於從事大陸地區政府、公司相關有價證券之運用，以下列項目為限： 一、大陸地區政府公債及國庫券，包括於銀行間債券市場交易之標的。 二、大陸地區集中市場交易股票及集中市場上市前首次公開募集股票。 三、大陸地區集中市場或銀行間債券市場交易之公司債及金融債券。 四、大陸地區掛牌上市之證券投資基金及指數股票型基金（ETF）。 五、於依本項第一款至前款所為實際投資額度內，得基於避險目的，從事衍生性金融商品交易。 保險業依前項規定從事大陸地區政府、公司相關有價證券之投資，應符合下列規定： 一、無第十七條第二項第一款及第三款所列之情事。 二、投資時最近一期自有資本與風險資本之比率未達法定標準者，以從事前項第一款、第五款投資為限。但經主管機關核准投資前項第三款及第四款規定者，不在此限。 三、保險業依前款規定從事之投資總額，不得超過該保險業經核定國外投資額度百分之五。 保險業資金投資第一項第三款所列公司債及金融債券，其債券發行評等等級須經國外信用評等機構評定為BBB+級或相當等級以上，但無債券發行評等者，其發行公司或保證公司之信用評等等級應符合下列規定： 一、投資於公司債或金融債券且非屬次順位者，其發行公司或保證公司之信用評等等級須經國外信用評等機構評定為A-級或相當等級以上。 二、投資於次順位公司債及次順位金融債券者，其發行公司或保證公司之信用評等等級須經國外信用評等機構評定為A+級或相當等級以上。 第一項各款所列保險業資金得從事運用之項目，主管機關得於必要時予以限制。 第一項所列投資項目，其交易金額應分別併入本辦法各項商品限額計算，並應符合下列規定： 一、投資於大陸地區政府公債及國庫券之投資總額，不得超過該保險業經核定國外投資額度百分之五。 二、投資於第一項第三款之公司債及金融債券且屬次順位者之投資總額，不得超過該保險業經核定國外投資額度百分之一。 三、投資於同一公司所發行符合第一項第二款及第三款之有價證券投資總額，不得超過該保險業經核定國外投資額度百分之一及發行公司業主權益百分之十。 四、投資於大陸地區掛牌上市證券投資基金及指數股票型基金之每一基金投資總額，不得超過該保險業經核定國外投資額度百分之一及該基金已發行總額百分之十。 五、投資於第一項第一款至第四款之有價證券及指數股票型基金之投資總額，合計不得超過該保險業經核定國外投資額度百分之十。 保險業從事第一項各款資金運用，應確實遵循相關法令規定及各項資金運用內部作業規範。財產保險業及人身保險業並應分別依財產保險業辦理資訊公開管理辦法第十一條及人身保險業辦理資訊公開管理辦法第十一條規定，於資訊公開網頁之說明文件應記載事項項下公開揭露從事第一項各款資金運用之投資總額及損益情形，並每季更新一次。", "anchor": "read/c12"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "clause", "title": "第13條 投資國外保險相關事業的資格", "text": "投資國外保險相關事業的資格 保險業業主權益超過保險法第139條所定最低資本或基金最低額，經主管機關核准，得投資第3條第1項第6款的國外保險相關事業。與被投資公司具控制與從屬關係者，連同其他依規定投資保險相關事業的投資總額，四者併計不得超過業主權益 40%（有核准的例外）。第13-3條另規定：被投資事業發生法定情事，應於事實發生後 7 日內陳報；每年 4 月底前彙整前一年度所投資所有國外保險相關事業的業務報告提報主管機關。 「事業：4 月底；陳報：7 日」。 投資後的陳報與年度業務報告規定在第13-3條；本頁未收錄原文，數字已與現行官方條文核對。", "anchor": "read/c13"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "clause", "title": "第14條 重大投資案須核准", "text": "重大投資案須核准 第3條第1項第7款（經行政院核定的經建計畫重大投資案）的國外投資，須經主管機關核准。 「重大投資案找主管機關核准」。  保險業辦理第三條第一項第七款之國外投資，須經主管機關核准後始得辦理。", "anchor": "read/c14"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "clause", "title": "第15條 國外投資額度與提高", "text": "國外投資額度與提高 已訂定國外投資交易處理程序與風險監控措施並經董事會通過者，可在資金 10% 額度內辦理。程序要有書面分析報告、交付執行紀錄、檢討報告，資料至少保存 5 年。申請提高額度是逐級加條件：25%（內控無重大缺失、精算人員或外部投資機構評估有利、完整投資手冊）→ 30%（再加：最近一年無重大裁罰）→ 35%（再加：公允價值部位用風險值並每週至少控管一次；攤銷後成本部位建模型並每半年向董事會報告；近二年無罰鍰；董事會下設風險管理委員會、設風險管理部門與風控長）。超過 35%：取得 35% 核准逾一年、董事會每年訂風險限額、資本比率達法定標準 1.25 倍以上或評等 AA- 以上、當年度未取得其他提高核准。超過 40%：最近一年度與近三年度平均都達 1.25 倍以上，或評等 AA+ 以上；設有內部風險模型；當年度未取得其他提高核准。主管機關核定的提高比例以資金 5% 為限。人身保險業商品結構綜合評分值符合標準者二擇一：加計資金 1% 的國外投資額度，或把第 15-2 條公式中準備金的 40% 提高為 42%。風險值：按週為基礎樣本至少 3 年（或按日、至少 1 年）、99% 信賴水準、10 個交易日、每月回溯測試。 「十、二十五、三十、三十五、四十」；程序資料保存「五年」；風險值「99%、10 日、每月回測」。 準備金比率現行是 40%→42%（第15條末項第2款）。題庫若寫 35%→37%，是舊版數字。 保險業已訂定國外投資相關交易處理程序及風險監控管理措施，並經董事會通過者，得在該保險業資金百分之十額度內辦理國外投資。 保險業訂定前項國外投資相關交易處理程序應包括書面分析報告之製作、交付執行之紀錄與檢討報告之提交等，其相關資料應至少保存五年。 第一項所稱國外投資風險監控管理措施，應包括有效執行之風險管理政策、風險管理架構及風險管理制度，其中風險管理制度應涵蓋國外投資相關風險類別之識別、衡量、監控及限額控管之執行及變更程序。 保險業申請提高國外投資額度，應檢附申請表（如附表二）依下列規定辦理： 一、符合下列規定者，其國外投資總額得提高至其資金百分之二十五： （一）符合第一項至第三項之規定。 （二）最近一年執行各種資金運用作業內部控制處理程序無重大缺失，或缺失事項已改正並經主管機關認可。 （三）經所屬簽證精算人員或外部投資機構評估辦理國外投資有利其經營。 （四）檢具含風險管理制度相關說明之完整投資手冊。 二、符合下列規定者，其國外投資總額得提高至其資金百分之三十： （一）符合前款規定。 （二）最近一年資金運用無受主管機關重大裁罰及處分，或違反情事已改正並經主管機關認可。 三、符合下列規定者，其國外投資總額得提高至其資金百分之三十五： （一）符合前款規定。 （二）國外投資分類為透過損益按公允價值衡量之金融資產及透過其他綜合損益按公允價值衡量之金融資產之部位已採用計算風險值評估風險，並每週至少控管乙次。 （三）國外投資分類為按攤銷後成本衡量之金融資產之部位，已建置適當模型分析、辨識或量化其相關風險，並至少每半年向董事會報告風險評估情形。 （四）最近二年資金運用無受主管機關罰鍰處分情事，或違反情事已改正並經主管機關認可。 （五）董事會下設風險管理委員會且於公司內部設風險管理部門及置風控長一人，並實際負責公司整體風險控管，其風險控管範圍至少應包括國外投資所衍生相關風險之評估及控管與所衍生風險對於保險業清償能力之影響。 四、申請提高國外投資總額超過其資金百分之三十五者，應符合下列規定： （一）符合前款規定。 （二）取得國外投資總額提高至資金百分之三十五之核准已逾一年。 （三）由董事會每年訂定風險限額，並由風險管理委員會或風險控管部門定期控管。 （四）最近一期自有資本與風險資本之比率達法定標準一點二五倍以上或經國內外信用評等機構評定最近一年信用評等等級為AA-級或相當等級以上。 （五）當年度未取得其他提高國外投資總額核准。 五、申請提高國外投資總 管理部門及風控長，實際負責公司整體風險控管。 保險業辦理第一項第三款之投資，除與交易對手簽訂承諾投資之交易契約時，應符合前項第二款規定外，就中華民國一百十一年一月二十八日修正施行後所簽訂契約者，於後續依約參與注資時，保險業倘有最近連續兩期未能符合前項第二款規定者，不得參與注資。", "anchor": "read/c17"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "table", "title": "數字速查：誰的 5%、誰的 10%", "text": "數字速查：誰的 5%、誰的 10% 項目 限額（基準） 條文 同一銀行的外匯存款 資金 3% 第4條 每一外國中央政府所屬機構債券 資金 5% 第6條第1項 每一外國地方政府債券 核定國外投資額度 5% 第6條第2項 每一銀行債券、可轉讓定期存單（含同銀行股票） 資金 5%，且發行銀行業主權益 10% 第6條第4項 BBB、BBB-、BB+ 次順位銀行債（每一銀行） 保險業業主權益 10% 第6條第4項 外幣商業本票（每一公司，含同公司其他證券） 資金 5%，且發行公司業主權益 10% 第6條第7項 BBB、BBB-、BB+ 債券（每一公司） 保險業業主權益 10% 第7條第3項 股票、IPO 股票、非本國企業存託憑證、可轉債及附認股權公司債（總額） 核定國外投資總額 40% 第7條第3項 每一公司股票及公司債（含質押放款） 資金 5%，且公司業主權益 10% 第3條第5項 國外表彰基金總額 核定國外投資總額 40% 第8條第2項 每一國外基金（證券投資基金、指數型、ETF、REITs、基礎建設、商品） 資金 5%，且基金已發行總額 10% 第8條第2項 國際性組織債券（每一組織） 資金 5%（評等 A- 以上） 第10條第1項 資產證券化商品 總額：核定國外投資額度 20%；每一商品：資金 1% 第9條第2項 房利美、房地美、吉利美的住宅不動產抵押貸款債券 總額：核定額度 50%；每一機構：核定額度 25% 第9條第4項 高風險標的合計 資金 5% 第17條 同一特定目的不動產投資事業貸款總餘額 業主權益 10% 第11-2條", "anchor": "table/t0"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "table", "title": "對沖基金 vs 私募基金", "text": "對沖基金 vs 私募基金  對沖基金 私募基金 管理者主權評等 A+ 以上 A+ 以上 註冊地 IOSCO MMoU 簽署國家或地區主管機關 IOSCO MMoU 簽署國家或地區主管機關 管理歷史 滿 2 年 滿 5 年 管理資產 不少於美金 2 億元 不少於美金 5 億元（有但書） 總額（連同私募公司債） 資金 2%（核定額度超過資金 40% 者 3%） 同左 單一基金 不超過基金已發行總額 10%；達資金萬分之五須董事會通過 同左", "anchor": "table/t1"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "table", "title": "國外投資額度階梯（第15條）", "text": "國外投資額度階梯（第15條） 額度 主要條件（摘要） 資金 10% 已訂交易處理程序與風險監控措施，並經董事會通過 提高至 25% 符合上列；最近一年內控無重大缺失或已改正；精算人員或外部投資機構評估有利經營；檢具含風險管理制度說明的完整投資手冊 提高至 30% 符合 25%；最近一年資金運用無重大裁罰及處分，或違反情事已改正並經認可 提高至 35% 符合 30%；公允價值部位用風險值、每週至少控管一次；攤銷後成本部位建模型並每半年向董事會報告；近二年無罰鍰；董事會下設風險管理委員會、設風險管理部門與風控長 超過 35% 取得 35% 核准逾一年；董事會每年訂風險限額；比率達法定標準 1.25 倍以上或評等 AA- 以上；當年度未取得其他提高核准 超過 40% 最近一年度與最近三年度平均都達法定標準 1.25 倍以上，或評等 AA+ 以上；設內部風險模型；當年度未取得其他提高核准", "anchor": "table/t2"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "table", "title": "不動產與大陸地區人民幣", "text": "不動產與大陸地區人民幣 項目 規定 條文 已合法利用並產生效益 出租率達 60%（自用不動產除外）並符合當地投報率 第11條 不動產投資總額 資金 1% 及業主權益 10%；1.25 倍以上：2.5% 及 40%；1.5 倍以上：3% 及 40% 第11條 貸款董事會門檻 三分之二出席、出席董事四分之三同意 第11-2條 收入匯回母公司 每年結算並經會計師簽證後 6 個月內 第11-2條 年度資料報備查 年度終了後 3 個月內 第11-2條 情事陳報 事實發生後 7 日內 第11-2條；第13-3條 大陸政府公債及國庫券 核定國外投資額度 5% 第12條 大陸次順位公司債與金融債 核定國外投資額度 1% 第12條 大陸同一公司證券 核定額度 1% 及業主權益 10% 第12條 大陸合計 核定國外投資額度 10% 第12條", "anchor": "table/t3"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "table", "title": "題庫與現行條文不同的地方", "text": "題庫與現行條文不同的地方 項目 題庫 官方現行條文（2026/9/4） 風險資本比率 250%、300% 法定標準的 1.25 倍、1.5 倍 第15條準備金比率 35% 提高為 37% 40% 提高為 42% 外國中央政府債 （未收錄） 第6條第1項：發行人評等 BBB- 以上 高風險標的資格 比率 250% 比率達法定標準 1.25 倍（有 AA 例外） 法定標準本身 （舊制）資本適足率 200% 資本適足性管理辦法第5條：資本適足率 100%（2026 起新制）", "anchor": "table/t4"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "第3條共幾款國外投資項目？", "text": "第3條共幾款國外投資項目？ 八款：外匯存款、國外有價證券、外幣放款、衍生性金融商品、國外不動產、國外保險相關事業等、經建計畫重大投資案、其他核准項目。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "外幣放款加計保險法146-3第1至3款放款總餘額，上限？", "text": "外幣放款加計保險法146-3第1至3款放款總餘額，上限？ 不得超過保險業資金 35%。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "同一銀行外匯存款上限？", "text": "同一銀行外匯存款上限？ 保險業資金 3%。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "第5條國外有價證券共幾類？", "text": "第5條國外有價證券共幾類？ 十四類。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "外國中央政府公債、國庫券，發行人評等條件？", "text": "外國中央政府公債、國庫券，發行人評等條件？ BBB- 級或相當等級以上。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "每一外國中央政府所屬機構債券的投資上限？", "text": "每一外國中央政府所屬機構債券的投資上限？ 資金 5%（債券評等 AA- 以上）。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "BBB、BBB-、BB+ 次順位銀行債，每一銀行上限？", "text": "BBB、BBB-、BB+ 次順位銀行債，每一銀行上限？ 保險業業主權益 10%。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "股票、IPO、存託憑證等總額上限？", "text": "股票、IPO、存託憑證等總額上限？ 核定國外投資總額 40%。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "每一公司 BBB、BBB-、BB+ 債券上限？", "text": "每一公司 BBB、BBB-、BB+ 債券上限？ 保險業業主權益 10%。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "國外表彰基金總額上限？", "text": "國外表彰基金總額上限？ 核定國外投資總額 40%。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "每一國外基金（證券投資、指數型、ETF、REITs、基礎建設、商品）上限？", "text": "每一國外基金（證券投資、指數型、ETF、REITs、基礎建設、商品）上限？ 資金 5%，且基金已發行總額 10%。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "對沖基金與私募基金投資總額（含私募公司債）上限？", "text": "對沖基金與私募基金投資總額（含私募公司債）上限？ 資金 2%；核定國外投資額度超過資金 40% 者為 3%。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "單一對沖或私募基金投資總額達多少須董事會通過？", "text": "單一對沖或私募基金投資總額達多少須董事會通過？ 達資金萬分之五以上；未達新臺幣一億元者以一億元計。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "對沖基金經理公司的條件？", "text": "對沖基金經理公司的條件？ 主權評等 A+ 以上、IOSCO MMoU 簽署國家或地區註冊、歷史滿 2 年、管理資產不少於美金 2 億元。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "私募基金管理機構的條件？", "text": "私募基金管理機構的條件？ 主權評等 A+ 以上、IOSCO MMoU、歷史滿 5 年、管理資產不少於美金 5 億元（有但書）。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "資產證券化商品的四類？", "text": "資產證券化商品的四類？ 資產基礎證券、商業不動產抵押貸款債券、住宅不動產抵押貸款債券、抵押債務債券。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "資產證券化商品的評等與限額？", "text": "資產證券化商品的評等與限額？ 評等 A- 以上；總額不超過核定國外投資額度 20%；每一商品不超過資金 1%。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "住宅不動產抵押貸款債券的資產池條件？", "text": "住宅不動產抵押貸款債券的資產池條件？ 債權平均信用評等分數須達 680 分以上。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "房利美、房地美、吉利美的住宅不動產抵押貸款債券，限額？", "text": "房利美、房地美、吉利美的住宅不動產抵押貸款債券，限額？ 不受 A-、20%、1% 與 680 分限制；總額不超過核定額度 50%，每一機構不超過核定額度 25%。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "國際性組織債券的評等與限額？", "text": "國際性組織債券的評等與限額？ 評等 A- 以上；每一國際性組織不超過資金 5%。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "不動產「已合法利用並產生利用效益」的認定？", "text": "不動產「已合法利用並產生利用效益」的認定？ 除自用不動產外，出租率達 60%，並符合當地經濟環境投資報酬率。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "不動產投資總額的基本上限？", "text": "不動產投資總額的基本上限？ 資金 1% 及業主權益 10%。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "不動產貸款的董事會門檻？", "text": "不動產貸款的董事會門檻？ 董事會三分之二以上董事出席、出席董事四分之三以上同意。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "對同一特定目的不動產投資事業的貸款總餘額上限？", "text": "對同一特定目的不動產投資事業的貸款總餘額上限？ 保險業業主權益 10%。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "特定目的不動產投資事業的收入多久匯回母公司？", "text": "特定目的不動產投資事業的收入多久匯回母公司？ 每年結算並經會計師簽證後 6 個月內。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "投資特定目的不動產投資事業，核准方式？", "text": "投資特定目的不動產投資事業，核准方式？ 每一標的物事前逐筆檢送書件向主管機關申請核准。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "大陸地區政府公債及國庫券的投資上限？", "text": "大陸地區政府公債及國庫券的投資上限？ 核定國外投資額度 5%。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "投資國外保險相關事業的業務報告，何時前提報？", "text": "投資國外保險相關事業的業務報告，何時前提報？ 每年 4 月底前，彙整前一年度所投資所有國外保險相關事業的業務報告。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "第3條第1項第7款（經建計畫重大投資案）的國外投資，須經誰核准？", "text": "第3條第1項第7款（經建計畫重大投資案）的國外投資，須經誰核准？ 主管機關核准後始得辦理。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "無需提高額度時，有交易處理程序與風險監控措施並經董事會通過者，額度？", "text": "無需提高額度時，有交易處理程序與風險監控措施並經董事會通過者，額度？ 資金 10%。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "國外投資交易處理程序的書面分析報告等資料，保存多久？", "text": "國外投資交易處理程序的書面分析報告等資料，保存多久？ 至少 5 年。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "彈性調整公式的三個條件？", "text": "彈性調整公式的三個條件？ 經核准經營外幣收付非投資型人身保險業務；符合第15條第1至3項；該業務各種準備金全部運用於同幣別資金運用項目。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "國外投資達什麼情形，集保公司以外的保管機構不得超過幾家？", "text": "國外投資達什麼情形，集保公司以外的保管機構不得超過幾家？ 核定國外投資額度達資金 35% 或國外投資金額達美金 10 億元以上；不得超過 5 家。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "第17條高風險標的合計上限？", "text": "第17條高風險標的合計上限？ 資金 5%。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "國外投資額度提高到 25%，要符合哪些條件？", "text": "國外投資額度提高到 25%，要符合哪些條件？ 符合基本規定（有交易處理程序與風險監控措施並經董事會通過）；最近一年內控無重大缺失或已改正；精算人員或外部投資機構評估有利經營；檢具含風險管理制度說明的完整投資手冊。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "從 25% 提高到 30%，多一個什麼條件？", "text": "從 25% 提高到 30%，多一個什麼條件？ 最近一年資金運用無受主管機關重大裁罰及處分，或違反情事已改正並經認可。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "提高到 35%，條件包括哪些？", "text": "提高到 35%，條件包括哪些？ 符合 30% 條件；公允價值部位用風險值並每週至少控管一次；攤銷後成本部位建模型並每半年向董事會報告；近二年無罰鍰；董事會下設風險管理委員會並設風險管理部門與風控長。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "申請超過 35%，條件有哪些？", "text": "申請超過 35%，條件有哪些？ 取得 35% 核准已逾一年；董事會每年訂風險限額並定期控管；資本比率達法定標準 1.25 倍以上或評等 AA- 以上；當年度未取得其他提高核准。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "風險值（VaR）的計算規定？", "text": "風險值（VaR）的計算規定？ 按週為基礎樣本至少 3 年（或按日、至少 1 年）；資料至少每週更新；99% 信賴水準；10 個交易日；每月回溯測試。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "card", "title": "「法定標準」現行是多少？題庫的 250%、300% 怎麼來？", "text": "「法定標準」現行是多少？題庫的 250%、300% 怎麼來？ 現行資本適足率法定標準為 100%（2026 起新制，舊制 200%）；條文寫 1.25 倍、1.5 倍。題庫的 250%、300% 是舊制 200% 的 1.25 倍、1.5 倍。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "scen", "title": "某保險公司想把外匯存款集中存放在同一家銀行。依第4條，該存款不得超過？", "text": "某保險公司想把外匯存款集中存放在同一家銀行。依第4條，該存款不得超過？ 保險業業主權益 3% 保險業資金 3% 保險業資金 5% 核定國外投資額度 3% 第4條第2項：存放於同一銀行之金額，不得超過該保險業資金百分之三。", "anchor": "quiz"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "scen", "title": "某保險公司投資一檔資產證券化商品，評等 A-。依第9條，單一商品的投資金額上限與總額上限分別是？", "text": "某保險公司投資一檔資產證券化商品，評等 A-。依第9條，單一商品的投資金額上限與總額上限分別是？ 資金 1%；核定國外投資額度 20% 資金 5%；核定國外投資額度 10% 業主權益 1%；核定國外投資額度 20% 資金 1%；資金 20% 第9條第2項：總額不得超過核定國外投資額度 20%，對每一資產證券化商品的投資金額不得超過資金 1%。", "anchor": "quiz"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "scen", "title": "保險業投資房利美（聯邦國民抵押貸款協會）發行的住宅不動產抵押貸款債券。依第9條第4項，限額是？", "text": "保險業投資房利美（聯邦國民抵押貸款協會）發行的住宅不動產抵押貸款債券。依第9條第4項，限額是？ 總額核定國外投資額度 20%，每一機構 1% 不受 A- 與 20%、1% 的限制，但總額不超過核定額度 50%，每一機構不超過 25% 完全沒有限額 總額資金 5% 第9條第4項：不受第2項及第3項限制，但總額不得超過核定國外投資額度 50%，每一機構不得超過核定國外投資額度 25%。", "anchor": "quiz"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "scen", "title": "保險業投資國外對沖基金，對該基金經理公司的條件，下列何者符合第8條？", "text": "保險業投資國外對沖基金，對該基金經理公司的條件，下列何者符合第8條？ 管理歷史滿 5 年、管理資產不少於美金 5 億元 管理歷史滿 2 年、管理資產不少於美金 2 億元 管理歷史滿 1 年、管理資產不少於美金 1 億元 管理歷史滿 3 年、管理資產不少於美金 3 億元 對沖基金經理公司：主權評等 A+ 以上、IOSCO MMoU、歷史滿 2 年、管理資產不少於美金 2 億元。滿 5 年、5 億是私募基金。", "anchor": "quiz"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "scen", "title": "某保險公司對一檔對沖基金的投資金額達其資金的萬分之五以上。依第8條，還需要什麼程序？", "text": "某保險公司對一檔對沖基金的投資金額達其資金的萬分之五以上。依第8條，還需要什麼程序？ 不需要任何程序 提報該保險業董事會通過後始得投資 向央行申請核准 向壽險公會備查 第8條第3項第4款：單一基金投資總額超過保險業資金萬分之五以上者，應提報董事會通過；未達新臺幣一億元者以一億元計。", "anchor": "quiz"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "scen", "title": "依第8條，保險業投資「國外表彰基金之有價證券」的總額，上限是？", "text": "依第8條，保險業投資「國外表彰基金之有價證券」的總額，上限是？ 資金 5% 核定國外投資總額 40% 業主權益 10% 核定國外投資額度 20% 第8條第2項：國外表彰基金之有價證券總額，不得超過其依保險法第146-4條核定國外投資總額的 40%。", "anchor": "quiz"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "scen", "title": "保險業投資國外商辦大樓（非自用），依第11條，「已合法利用並產生利用效益」的認定標準是？", "text": "保險業投資國外商辦大樓（非自用），依第11條，「已合法利用並產生利用效益」的認定標準是？ 出租率達 40% 出租率達 60%，並符合當地經濟環境投資報酬率 只要取得所有權 出租率達 80% 第11條第3項：除自用不動產外，係指出租率達百分之六十，並符合當地經濟環境之投資報酬率。（80% 是第11-4條另一個情形）", "anchor": "quiz"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "scen", "title": "保險業以貸款方式提供特定目的不動產投資事業資金，依第11-2條，董事會通過門檻是？", "text": "保險業以貸款方式提供特定目的不動產投資事業資金，依第11-2條，董事會通過門檻是？ 過半數董事出席、出席董事過半數同意 三分之二以上董事出席、出席董事四分之三以上同意 全體董事一致同意 三分之二董事同意即可 第11-2條：應經董事會三分之二以上董事出席及出席董事四分之三以上同意。", "anchor": "quiz"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "scen", "title": "特定目的不動產投資事業取得的各項收入，除預留必要營運資金外，依第11-2條應在多久內匯回母公司？", "text": "特定目的不動產投資事業取得的各項收入，除預留必要營運資金外，依第11-2條應在多久內匯回母公司？ 每年結算並經會計師簽證後 3 個月內 每年結算並經會計師簽證後 6 個月內 每季結算後 1 個月內 每年結算後 12 個月內 第11-2條：除預留必要之營運資金外，應於每年結算並經會計師簽證後六個月內匯回母公司。", "anchor": "quiz"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "scen", "title": "保險業投資國際性組織發行的債券，依第10條，評等與限額是？", "text": "保險業投資國際性組織發行的債券，依第10條，評等與限額是？ 評等 BBB 以上；資金 10% 評等 A- 以上；每一國際性組織不超過資金 5% 評等 AA 以上；資金 3% 沒有評等要求；資金 5% 第10條第1項：債券發行評等須 A- 級或相當等級以上，且對每一國際性組織所發行債券的投資總額不得超過保險業資金 5%。", "anchor": "quiz"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "scen", "title": "某保險公司經核定的國外投資額度已達資金 35%。依第16條，其國外投資有價證券的保管有什麼規定？", "text": "某保險公司經核定的國外投資額度已達資金 35%。依第16條，其國外投資有價證券的保管有什麼規定？ 可全部自行保管 應集中由保管機構保管，且集保公司以外的保管機構不得超過 5 家 只能由集保公司保管 保管機構不得超過 2 家 第16條：核定國外投資額度達資金 35% 或國外投資金額達美金 10 億元以上者，國外投資有價證券應集中由保管機構保管，集保公司以外的保管機構不得超過五家（有特定金錢信託的例外）。", "anchor": "quiz"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "scen", "title": "保險業已訂定國外投資交易處理程序與風險監控措施並經董事會通過。依第15條，基本的國外投資額度與相關資料保存期間是？", "text": "保險業已訂定國外投資交易處理程序與風險監控措施並經董事會通過。依第15條，基本的國外投資額度與相關資料保存期間是？ 資金 10%；至少保存 5 年 資金 25%；至少保存 3 年 資金 10%；至少保存 1 年 資金 35%；至少保存 5 年 第15條：得在資金 10% 額度內辦理國外投資；交易處理程序所涉書面分析報告、紀錄、檢討報告等資料，至少保存 5 年。", "anchor": "quiz"}, {"file": "ch05.html", "chTitle": "第5章 保險業辦理國外投資管理辦法", "type": "scen", "title": "某人身保險公司已把國外投資額度提高到資金 35%。現在想申請超過 35%，依第15條，下列何者「不是」條件？", "text": "某人身保險公司已把國外投資額度提高到資金 35%。現在想申請超過 35%，依第15條，下列何者「不是」條件？ 取得 35% 核准已逾一年 董事會每年訂定風險限額並定期控管 當年度未取得其他提高國外投資總額核准 設有內部風險模型以量化公司整體風險 第15條第4項（超過 35%）：核准已逾一年、董事會每年訂風險限額、資本比率 1.25 倍以上或評等 AA- 以上、當年度未取得其他提高核准。「設有內部風險模型」是第5項（超過 40%）才要的條件。", "anchor": "quiz"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "clause", "title": "第一點 適用範圍", "text": "適用範圍 這份規則管的是「保險公司」辦理「外幣收付、非投資型」人身保險這門業務。條文裡的「本業務」就是指這門業務。  整份規則的主詞多半是人身保險業（公司），只有第八點把要求落到業務員的招攬行為。 人身保險業辦理以外幣收付之非投資型人身保險業務（以下簡稱本業務），應依本注意事項辦理。", "anchor": "read/c一"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "clause", "title": "第二點 公司要符合的資格條件", "text": "公司要符合的資格條件 公司想做這門業務要過四關：沒被重罰、用風險值管國外投資、有風控組織、公平待客評核排在業界前八成。風險值（VaR）的算法條文寫得很死：資料基礎、更新頻率、信賴水準、天數、回溯測試都有固定數字。 四關「罰、險、控、客」＝裁罰、風險值、風控組織、公平待客。VaR 數字「99／10／週更／月測」＝99% 信賴水準、10 個交易日、資料每週更新、每月回溯測試。 「重大裁罰」的內容條文本身沒列金額，是指向另一份辦法的第二條。 人身保險業申請辦理本業務，應符合下列資格條件： （一）最近一年內未有遭主管機關重大裁罰及處分者，或受處分情事已獲具體改善經主管機關認可者。 （二）國外投資部分已採用計算風險值（Value at Risk） 評估風險，並每週至少控管乙次。 （三）董事會中設有風險控管委員會或於公司內部設置風險控管部門及風控長或職務相當之人，並實際負責公司整體風險控管。 （四）最近一年公平待客原則評核結果為人身保險業前百分之八十。但經人身保險業提出合理說明並經主管機關核准者，不在此限。 前項第一款所稱重大裁罰及處分，指金融監督管理委員會處理違反金融法令重大裁罰措施之對外公布說明辦法第二條所定各款之情事。 第一項第二款所稱之風險值，係指按週為基礎、樣本期間至少三年，或按日為基礎、樣本期間至少一年，樣本之資料至少每週更新一次，以至少百分之九十九的信賴水準計算十個交易日之風險值，且須每月進行回溯測試。", "anchor": "read/c二"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "clause", "title": "第三點 收付幣別與收付方式", "text": "收付幣別與收付方式 可以約定用哪個外幣收付，但不能約定新臺幣和外幣、或外幣和外幣之間互相變換。款項要事先約定走外匯存款戶。唯一的例外是生存保險金直接抵繳另一張保單的保費，而且要同時符合三個條件。 抵繳例外三要件「同日、同幣、同一人」＝生存保險金應給付日當日、相同幣別、受益人與被抵繳保單的要保人為同一人。 「不得變換」是第一項的規定，沒有例外；例外只出現在第二項的「外匯存款戶存撥」。 訂立以外幣收付之非投資型人身保險契約時，保險人與要保人得約定保險費、保險給付、費用及其他款項收付之外幣幣別。但不得約定新臺幣與外幣或各幣別間之相互變換。 前項保險費、保險給付、費用及其他款項之收付，保險人應與要保人事先約定收付以外匯存款戶存撥之。但保險人與要保人約定，於其他外幣保險契約所定生存保險金應給付日當日，以該生存保險金，抵繳相同幣別外幣保險契約之保險費，且該生存保險金之受益人，與所抵繳保險契約之要保人為同一人者，不在此限。", "anchor": "read/c三"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "clause", "title": "第四點 可經營的險種與健康險給付範圍", "text": "可經營的險種與健康險給付範圍 險種只有三種：人壽、年金、健康，而且要經中央銀行許可。健康險又更窄：只能是豁免保費，或一次性給付的癌症、重大疾病、特定疾病。一次性給付的意思是賠付後契約就結束。 險種「壽、年、健」；許可找中央銀行。 條文用「以……為限」，所以條文列舉之外的險種（例如傷害保險）不在這門業務範圍內。這是依條文文字的推論。 人身保險業經營本業務，險種以人壽保險、年金保險及健康保險為限，並須經中央銀行許可。 前項健康保險之給付項目，以豁免保險費或一次性給付之癌症疾病、重大疾病或特定疾病為限。 前項所稱一次性給付，係指保險事故發生並於保險人給付保險金後，保險契約即行終止之給付型態。", "anchor": "read/c四"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "clause", "title": "第五點 資產不得兌換新臺幣", "text": "資產不得兌換新臺幣 外幣保單對應的資產不能換成新臺幣，資金運用還是要照保險法第146條之4。 不換台幣、照146-4。 關鍵字是「不得」。這是最容易因漏字而讀反的一條。 以外幣收付之非投資型人身保險契約，其對應之一般帳簿資產不得兌換為新臺幣，且其資金運用仍應依保險法第一百四十六條之四規定辦理。", "anchor": "read/c五"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "clause", "title": "第六點 不得契約轉換", "text": "不得契約轉換 外幣非投資型保單和新臺幣收付的人身保險保單之間，不能互相轉換契約。 三個「不」一起記：不變換（三）、不兌換（五）、不轉換（六）。 條文只寫外幣非投資型與「新臺幣收付之人身保險契約」之間不得轉換，沒有談到其他組合，不要自行延伸。 以外幣收付之非投資型人身保險契約與新臺幣收付之人身保險契約間，不得辦理契約轉換。", "anchor": "read/c六"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "clause", "title": "第七點 商品送審與條款載明事項", "text": "商品送審與條款載明事項 第一張商品要向主管機關申請核准。送審除了一般文件，還要多附三件：會計處理說明、外幣資產負債配置計畫、外幣資產區隔方式。另外，要保書和保單條款要寫明三件事：保費怎麼收、匯款費用誰負擔、匯率風險。人民幣商品另有四項配置計畫要求，以及自有資本與風險資本比率要符合保險法第143條之4。 送審多附三件「帳、配、隔」＝會計處理、配置計畫、資產區隔。條款載明三事「收、付、險」＝保費收取方式、匯款費用負擔、匯率風險。核准找主管機關。 第七點的「載明」（要保書＋保單條款，三項）和第八點的「揭露」（要保書＋商品簡介明顯處，四項）很像，請看「對照表」分頁。 人身保險業辦理第一張以外幣收付之非投資型人身保險商品，應檢附符合第二點資格條件之說明文件，依保險商品銷售前程序作業準則等規定向主管機關申請核准。 人身保險業送審該等保險商品時，除應依保險商品銷售前程序作業準則等規定檢附相關送審文件外，應併檢附該等保險商品各項交易之會計處理方式說明、外幣資產負債配置具體計畫及執行方法，及外幣資產區隔之方式。並應於要保書及保單條款載明保險費收取方式、匯款費用之負擔及匯率風險揭露等相關事宜。 人身保險業送審以人民幣收付之非投資型人身保險商品，依前項檢附之外幣資產負債配置具體計畫及執行方式應至少包含下列項目： （一）資產負債配置執行之目標、策略及方法、資產配置主要考量、投資準則及資產配置規劃等。 （二）應載明不含既有資產之預期新錢投資組合報酬率數值，且提供該數值所隱含之預期資產配置比例及各類資產預期報酬率，並據以說明該數值假設之合理性及其與商品預定利率之關聯性。 （三）相關風險控管措施及機制，包括可投資人民幣資產之風險、人民幣資產負債配合風險及人民幣資金回流機制之風險評估及控管措施。 （四）簽證精算人員應出具該等計畫執行具體可行之專業評估意見，後續並由公司風險管理部門持續追蹤該等計畫實際執行情形，如發現有與原計畫顯著差異情形，應由風控長或職務相當之人立即向董事長及總經理提出書面說明及改善計畫。 人身保險業銷售以人民幣收付之非投資型人身保險商品，其自有資本與風險資本之比率應符合保險法第一百四十三條之四之規定。", "anchor": "read/c七"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "clause", "title": "第八點 業務員資格、招攬揭露與每年揭露", "text": "業務員資格、招攬揭露與每年揭露 這一點和業務員最直接相關。業務員要先過公會特別測驗並登錄；之後每年至少上一小時匯率風險及外匯法規訓練，沒上或沒通過，公司下一年度就要暫停授權該業務員招攬這類商品。招攬時要說明並揭露費用、匯率風險、政經風險，提供「最近十年最高、平均、最低」三種情境的匯率風險說明書，並由要保人和業務員共同簽確認。每年至少一次要把解約金、死亡保險金額、生存保險金額折成新臺幣的參考價值告訴客戶。銷售前還要瞭解客戶需求與承受匯率風險的能力，公司要有商品適合度政策。 三種情境「高、均、低」，期間「十年」。每年至少「一小時」訓練、至少「一次」揭露。 對業務員來說，漏上年度訓練的後果是「次一年度被暫停招攬外幣非投資型商品」，不只是補修而已。 人身保險業辦理本業務，除應落實招攬人員管理、商品資訊揭露及商品適合度政策外，並應遵循下列事項： （一）銷售該等保險商品之業務員應通過中華民國人壽保險商業同業公會所舉辦之特別測驗，並完成資格登錄；登錄後，各人身保險業每年應為其舉辦至少一小時之匯率風險及外匯相關法規在職教育訓練課程，當年度未參加或未通過訓練者，應暫停授權其次一年度招攬該等保險商品。各人身保險業如開放保險代理人或業務往來保險經紀人從事本業務之招攬者，亦應自行參照前開原則研訂相關規範，並要求保險代理人或業務往來保險經紀人落實執行。 （二）銷售該等保險商品時，應於招攬時揭露及說明下列事項，並由要保人及業務員於要保書及匯率風險說明書共同具簽確認： 1.應於要保書及商品簡介明顯處揭露保險費收取方式、匯款費用之負擔及商品所涉匯率風險及商品幣別所屬國家之政治、經濟變動風險等。 2.應提供匯率風險說明書，且應採該保險商品收付幣別最近十年內之最高、平均及最低等三種匯率情境，以視覺化方式就死亡保險給付、簽訂保險契約時收取之保險費，分別於三種匯率情境下折合新臺幣計算之金額，以及其匯兌損益之差額舉例說明。 （三）應至少每年一次向要保人揭露該等保險商品當年度解約金、死亡保險金額及生存保險金額等給付項目折合新臺幣計算後之參考價值。其提供方式由保險人與要保人約定之。 （四）應瞭解要保人之需求與承受匯率風險能力，銷售該等保險商品前並應建立商品適合度政策。 前項第二款第二目之匯率風險說明書，由中華民國人壽保險商業同業公會擬訂範本報主管機關備查。", "anchor": "read/c八"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "clause", "title": "第九點 另需遵循的專業準則與規範", "text": "另需遵循的專業準則與規範 除了央行和主管機關的規定，還要照精算學會的精算實務處理準則，以及壽險公會的客戶適合度規範。 精算學會管「精算準則」；壽險公會管「客戶適合度」。 這兩份文件的內容不在本條文裡，本頁沒有收錄。 人身保險業經營本業務，除應依中央銀行及主管機關相關規定辦理外，並應遵循中華民國精算學會所訂外幣保險商品精算實務處理準則及中華民國人壽保險商業同業公會所訂客戶適合度規範。", "anchor": "read/c九"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "clause", "title": "第十點 內部控制與稽核", "text": "內部控制與稽核 公司要把這份規則放進內控與稽核。業務單位每半年自行查核一次；內部稽核單位每年專案查核一次，報告還要提報最近一次董事會通過。 「單位半年、稽核一年、報告上董事會」。 這兩個頻率在民國115年2月5日修正過。若手上的舊講義或題目寫「每季」，以現行條文為準。 人身保險業辦理本業務，除應落實風險管理與內部控制及稽核制度外，並應遵循下列事項： （一）應將本注意事項之內容，納入內部控制及內部稽核項目，並依據保險業內部控制及稽核制度實施辦法第五條規定訂定本業務相關內部控制作業之處理程序。 （二）應依前揭辦法第七條及第二十四條規定，由從事該等保險商品招攬、核保、理賠、精算、保全、法務及投資之業務單位每半年辦理專案自行查核。 （三）應依前揭辦法第七條及第十八條規定，由內部稽核單位每年辦理該等保險商品招攬、核保、理賠、精算、保全、法務及投資作業之專案查核，上開稽核報告並應提報最近一次董事會通過。 （四）內部稽核單位每年辦理查核作業之原則如下： 1.查核各業務單位對外幣收付之非投資型保險商品開發、銷售、資訊揭露、風險告知、資金運用及外匯管理等相關法令及自律規範之遵循情形，以及該等保險商品銷售作業處理程序（含招攬人員資格及教育訓練、商品適合度政策）落實情形。 2.查核內部控制措施時，應包括內部牽制及勾稽功能。 3.評估各項內部控制處理程序之妥適性，並提出修正建議，以確保制度能持續有效執行。 4.評估各業務單位每半年自行查核辦理績效。", "anchor": "read/c十"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "clause", "title": "第十一點 統計報表申報", "text": "統計報表申報 依主管機關規定的格式、內容、期限，把統計報表報給主管機關或保險事業發展中心。 報表「報主管機關或保發中心」。  人身保險業應依主管機關規定之格式、內容及期限，將本業務相關統計報表向主管機關或財團法人保險事業發展中心申報，以供主管機關監理之用。", "anchor": "read/c十一"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "table", "title": "三個「不得」", "text": "三個「不得」 條文 不得做什麼 備註 第三點第一項 不得約定新臺幣與外幣、或各幣別間相互變換 可約定外幣幣別；此項沒有例外 第五點 對應的一般帳簿資產不得兌換為新臺幣 資金運用仍依保險法第146條之4 第六點 外幣非投資型契約與新臺幣收付之人身保險契約間不得契約轉換 只寫這個組合，不要自行延伸", "anchor": "table/t0"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "table", "title": "第七點「載明」vs 第八點「揭露」", "text": "第七點「載明」vs 第八點「揭露」 比較 第七點（送審） 第八點第二款第一目（招攬） 動詞 載明 揭露 地點 要保書及保單條款 要保書及商品簡介明顯處 保險費收取方式 有 有 匯款費用之負擔 有 有 匯率風險 有（匯率風險揭露） 有 商品幣別所屬國家之政治、經濟變動風險 沒有 有 項目數 3 項 4 項", "anchor": "table/t1"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "table", "title": "數字與期限", "text": "數字與期限 項目 規定 出處 公平待客原則評核 最近一年為人身保險業前 80%（可提合理說明，經主管機關核准） 第二點第一項第四款 沒被重罰期間 最近一年內 第二點第一項第一款 風險值控管頻率 每週至少控管乙次 第二點第一項第二款 風險值資料基礎 按週：樣本至少 3 年；按日：樣本至少 1 年 第二點第三項 風險值更新／信賴水準／天數／回測 資料至少每週更新；99%；10 個交易日；每月回溯測試 第二點第三項 業務員在職訓練 每年至少 1 小時（匯率風險及外匯相關法規） 第八點第一款 匯率風險說明書情境 收付幣別最近 10 年內最高、平均、最低，共 3 種 第八點第二款第二目 折合新臺幣參考價值揭露 至少每年 1 次 第八點第三款 業務單位專案自行查核 每半年 第十點第二款 內部稽核單位專案查核 每年；報告提報最近一次董事會通過 第十點第三款 保險法條號 146 條之 4（資金運用）；143 條之 4（人民幣商品自有資本與風險資本比率） 第五點；第七點", "anchor": "table/t2"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "table", "title": "誰管什麼", "text": "誰管什麼 單位 在本注意事項中的角色 出處 中央銀行 許可經營本業務的險種 第四點 主管機關（金管會） 核准第一張商品送審；備查匯率風險說明書範本；規定統計報表格式、內容、期限 第七點；第八點；第十一點 中華民國人壽保險商業同業公會 舉辦業務員特別測驗；擬訂匯率風險說明書範本；訂客戶適合度規範 第八點；第九點 中華民國精算學會 訂外幣保險商品精算實務處理準則 第九點 財團法人保險事業發展中心 可受理統計報表申報（與主管機關擇一） 第十一點", "anchor": "table/t3"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "card", "title": "「本業務」指的是什麼？", "text": "「本業務」指的是什麼？ 人身保險業辦理以外幣收付之非投資型人身保險業務。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "card", "title": "公司申請辦理本業務的四項資格條件？", "text": "公司申請辦理本業務的四項資格條件？ 一、最近一年內未有遭重大裁罰及處分（或已具體改善經認可）。二、國外投資採風險值評估，每週至少控管乙次。三、設有風險控管委員會或風控部門及風控長，並實際負責整體風險控管。四、最近一年公平待客原則評核結果為業界前 80%（有例外）。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "card", "title": "風險值（VaR）的條文定義，數字有哪些？", "text": "風險值（VaR）的條文定義，數字有哪些？ 按週為基礎、樣本至少 3 年，或按日為基礎、樣本至少 1 年；資料至少每週更新；至少 99% 信賴水準；計算 10 個交易日的風險值；每月回溯測試。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "card", "title": "公平待客評核不夠前 80% 一定不能辦嗎？", "text": "公平待客評核不夠前 80% 一定不能辦嗎？ 不是。條文有但書：經公司提出合理說明並經主管機關核准者，不在此限。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "card", "title": "「重大裁罰及處分」在條文裡怎麼定義？", "text": "「重大裁罰及處分」在條文裡怎麼定義？ 指金管會處理違反金融法令重大裁罰措施之對外公布說明辦法第二條所定各款之情事（條文本身不列金額）。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "card", "title": "契約可以約定什麼、不可以約定什麼（幣別）？", "text": "契約可以約定什麼、不可以約定什麼（幣別）？ 可以約定保費、給付、費用及其他款項收付的外幣幣別；不得約定新臺幣與外幣或各幣別間之相互變換。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "card", "title": "款項收付原則上要事先約定走什麼帳戶？", "text": "款項收付原則上要事先約定走什麼帳戶？ 外匯存款戶存撥。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "card", "title": "生存保險金抵繳保費的例外，要同時符合哪三點？", "text": "生存保險金抵繳保費的例外，要同時符合哪三點？ 生存保險金應給付日當日抵繳；抵繳的是相同幣別外幣保險契約的保費；生存保險金受益人與被抵繳契約的要保人為同一人。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "card", "title": "本業務的險種限於哪些？誰許可？", "text": "本業務的險種限於哪些？誰許可？ 人壽保險、年金保險、健康保險；須經中央銀行許可。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "card", "title": "健康保險的給付項目限於什麼？", "text": "健康保險的給付項目限於什麼？ 豁免保險費，或一次性給付之癌症疾病、重大疾病或特定疾病。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "card", "title": "「一次性給付」的定義？", "text": "「一次性給付」的定義？ 保險事故發生並於保險人給付保險金後，保險契約即行終止之給付型態。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "card", "title": "外幣保單對應的一般帳簿資產可以兌換新臺幣嗎？", "text": "外幣保單對應的一般帳簿資產可以兌換新臺幣嗎？ 不得兌換為新臺幣；資金運用仍應依保險法第146條之4辦理。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "card", "title": "外幣非投資型保單可以和新臺幣收付的人身保險保單轉換契約嗎？", "text": "外幣非投資型保單可以和新臺幣收付的人身保險保單轉換契約嗎？ 不得辦理契約轉換。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "card", "title": "第一張外幣非投資型商品向誰申請？要附什麼？", "text": "第一張外幣非投資型商品向誰申請？要附什麼？ 向主管機關申請核准；檢附符合第二點資格條件的說明文件，並依保險商品銷售前程序作業準則等規定送審。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "card", "title": "送審時除一般文件外，要併附哪三件？", "text": "送審時除一般文件外，要併附哪三件？ 各項交易之會計處理方式說明；外幣資產負債配置具體計畫及執行方法；外幣資產區隔之方式。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "card", "title": "要保書及保單條款要載明哪三件事？", "text": "要保書及保單條款要載明哪三件事？ 保險費收取方式、匯款費用之負擔、匯率風險揭露。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "card", "title": "人民幣商品的自有資本與風險資本比率要符合哪一條？", "text": "人民幣商品的自有資本與風險資本比率要符合哪一條？ 保險法第143條之4。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "card", "title": "業務員銷售外幣非投資型商品的資格與每年訓練要求？", "text": "業務員銷售外幣非投資型商品的資格與每年訓練要求？ 通過壽險公會舉辦的特別測驗並完成資格登錄；登錄後公司每年要辦至少 1 小時匯率風險及外匯相關法規在職教育訓練。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "card", "title": "業務員當年度沒參加或沒通過在職訓練，會怎樣？", "text": "業務員當年度沒參加或沒通過在職訓練，會怎樣？ 公司應暫停授權其次一年度招攬該等保險商品。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "card", "title": "招攬時要揭露的項目，揭露在哪裡？", "text": "招攬時要揭露的項目，揭露在哪裡？ 在要保書及商品簡介明顯處，揭露保險費收取方式、匯款費用之負擔、商品所涉匯率風險、商品幣別所屬國家之政治與經濟變動風險。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "card", "title": "匯率風險說明書要用哪三種情境？怎麼呈現？", "text": "匯率風險說明書要用哪三種情境？怎麼呈現？ 收付幣別最近十年內的最高、平均、最低三種匯率；以視覺化方式，就死亡保險給付與簽約時收取的保費，分別折合新臺幣的金額，以及匯兌損益差額舉例說明。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "card", "title": "招攬時由誰在哪些文件上共同簽確認？", "text": "招攬時由誰在哪些文件上共同簽確認？ 要保人及業務員，在要保書及匯率風險說明書上共同具簽確認。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "card", "title": "匯率風險說明書範本由誰擬訂、誰備查？", "text": "匯率風險說明書範本由誰擬訂、誰備查？ 壽險公會擬訂範本，報主管機關備查。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "card", "title": "每年至少一次要向要保人揭露什麼？方式誰決定？", "text": "每年至少一次要向要保人揭露什麼？方式誰決定？ 當年度解約金、死亡保險金額、生存保險金額等給付項目折合新臺幣的參考價值；提供方式由保險人與要保人約定。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "card", "title": "銷售前要先做哪兩件事？", "text": "銷售前要先做哪兩件事？ 瞭解要保人的需求與承受匯率風險能力；並建立商品適合度政策。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "card", "title": "還要遵循哪兩份專業規範？", "text": "還要遵循哪兩份專業規範？ 精算學會的外幣保險商品精算實務處理準則；壽險公會的客戶適合度規範。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "card", "title": "自行查核與內部稽核的頻率？", "text": "自行查核與內部稽核的頻率？ 業務單位每半年辦理專案自行查核；內部稽核單位每年辦理專案查核，報告提報最近一次董事會通過。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "card", "title": "統計報表向誰申報？", "text": "統計報表向誰申報？ 主管機關或財團法人保險事業發展中心。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "scen", "title": "客戶問：「能不能在契約裡寫，將來我可以約定把收付幣別從美元換成澳幣？」業務員的正確回應是？", "text": "客戶問：「能不能在契約裡寫，將來我可以約定把收付幣別從美元換成澳幣？」業務員的正確回應是？ 可以，只要雙方在契約裡約定即可 不行，條文不得約定各幣別間相互變換 可以，但要先向壽險公會報備 可以，但只限年金保險 第三點第一項：可約定收付的外幣幣別，但不得約定新臺幣與外幣或各幣別間之相互變換。這一項沒有例外。", "anchor": "quiz"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "scen", "title": "客戶持有美元非投資型保單，想「轉換」成新臺幣收付的人身保險保單，以後不用管匯率。依第六點，應如何回答？", "text": "客戶持有美元非投資型保單，想「轉換」成新臺幣收付的人身保險保單，以後不用管匯率。依第六點，應如何回答？ 可以，向保險公司申請即可 不得辦理契約轉換 可以，但需經中央銀行許可 可以，但每年限一次 第六點：外幣非投資型人身保險契約與新臺幣收付之人身保險契約間，不得辦理契約轉換。", "anchor": "quiz"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "scen", "title": "客戶問：「我繳美元，保險公司會不會把對應的資產換成新臺幣去運用？」依條文，下列何者正確？", "text": "客戶問：「我繳美元，保險公司會不會把對應的資產換成新臺幣去運用？」依條文，下列何者正確？ 會，條文允許自由兌換 不會，對應的一般帳簿資產不得兌換為新臺幣 會，但須先通知要保人 由要保人決定 第五點：對應的一般帳簿資產不得兌換為新臺幣，且資金運用仍依保險法第146條之4辦理。", "anchor": "quiz"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "scen", "title": "客戶想買外幣的「住院醫療實支實付」健康保險。依第四點對健康保險給付項目的限制，最接近正確的說明是？", "text": "客戶想買外幣的「住院醫療實支實付」健康保險。依第四點對健康保險給付項目的限制，最接近正確的說明是？ 可以，健康保險全部都在範圍內 不在範圍內，健康險給付項目限豁免保費或一次性給付之癌症、重大疾病或特定疾病 可以，只要不是癌症 可以，但須提高保費 第四點第二項：健康保險給付項目以豁免保險費或一次性給付之癌症疾病、重大疾病或特定疾病為限。實支實付醫療不在列舉項目內（此為依條文文字的判斷）。", "anchor": "quiz"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "scen", "title": "客戶有一張美元保單，約定其生存保險金應給付日當日，直接抵繳另一張澳幣保單的保費，且兩張保單是同一人。能適用第三點第二項的例外嗎？", "text": "客戶有一張美元保單，約定其生存保險金應給付日當日，直接抵繳另一張澳幣保單的保費，且兩張保單是同一人。能適用第三點第二項的例外嗎？ 能，因為要保人是同一人 不能，抵繳的必須是相同幣別的外幣保險契約 能，只要事先通知保險公司 不能，因為生存保險金不能抵繳 例外要同時符合：應給付日當日、相同幣別、受益人與被抵繳契約要保人為同一人。美元抵澳幣，幣別不同，不符合。", "anchor": "quiz"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "scen", "title": "一位業務員當年度沒有參加匯率風險及外匯相關法規的在職教育訓練。依第八點第一款，結果是什麼？", "text": "一位業務員當年度沒有參加匯率風險及外匯相關法規的在職教育訓練。依第八點第一款，結果是什麼？ 下次補修即可，不影響招攬 公司應暫停授權其次一年度招攬該等保險商品 被撤銷業務員登錄 公司應罰款 第八點第一款：當年度未參加或未通過訓練者，應暫停授權其次一年度招攬該等保險商品。撤銷登錄與罰款不是條文寫的後果。", "anchor": "quiz"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "scen", "title": "準備匯率風險說明書時，業務員要用哪組情境說明才符合條文？", "text": "準備匯率風險說明書時，業務員要用哪組情境說明才符合條文？ 最近三年的最高與最低匯率 最近十年內的最高、平均、最低三種匯率 去年同期匯率與今年匯率 客戶自行指定的三種匯率 第八點第二款第二目：採收付幣別最近十年內之最高、平均及最低等三種匯率情境，並以視覺化方式舉例說明。", "anchor": "quiz"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "scen", "title": "客戶問：「這種保單，保險公司每年一定要給我什麼資訊？」依第八點第三款，最符合的是？", "text": "客戶問：「這種保單，保險公司每年一定要給我什麼資訊？」依第八點第三款，最符合的是？ 當年度投資績效 當年度解約金、死亡保險金額、生存保險金額折合新臺幣的參考價值 每季的匯率走勢報告 每月對帳單 至少每年一次揭露解約金、死亡保險金額及生存保險金額等給付項目折合新臺幣計算後的參考價值；提供方式由保險人與要保人約定。本業務是非投資型，沒有「投資績效」。", "anchor": "quiz"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "scen", "title": "某公司最近一年公平待客原則評核結果在業界前 85%，其他條件都符合。依第二點，下列何者正確？", "text": "某公司最近一年公平待客原則評核結果在業界前 85%，其他條件都符合。依第二點，下列何者正確？ 符合，因為門檻是前 90% 原則上不符合，但可提出合理說明並經主管機關核准 一定不符合，沒有例外 只要公司規模夠大就符合 第二點第一項第四款：要前 80%，但經公司提出合理說明並經主管機關核准者，不在此限。", "anchor": "quiz"}, {"file": "ch06.html", "chTitle": "第6章 外幣非投資型人身保險：資格條件及注意事項", "type": "scen", "title": "依現行第十點，業務單位與內部稽核單位對本業務的專案查核頻率分別為？", "text": "依現行第十點，業務單位與內部稽核單位對本業務的專案查核頻率分別為？ 業務單位每季、稽核每半年 業務單位每半年、稽核每年 業務單位每年、稽核每季 兩者都是每季 現行條文：業務單位每半年專案自行查核；內部稽核單位每年專案查核，報告提報最近一次董事會通過。民國115年2月5日修正前的頻率較高（自行查核為每季）。", "anchor": "quiz"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "clause", "title": "第2條 契約要記載保護條文", "text": "契約要記載保護條文 訂約時，為保護要保人或受益人的投資權益，要依保險法及其他法令記載相關條文。   訂立投資型保險契約時，保險人就要保人或受益人投資權益之保護，應依本法及其他有關法令規定記載相關條文。", "anchor": "read/c2"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "clause", "title": "第3條 重要事項告知書", "text": "重要事項告知書 訂約時要以重要事項告知書向要保人說明並經簽章：各項費用、投資標的及其可能風險、相關警語、其他規定事項。 四項「費、標、警、他」。  保險人銷售投資型保險商品時，應充分揭露相關資訊；於訂約時，應以重要事項告知書向要保人說明下列事項，並經其簽章： 一、各項費用。 二、投資標的及其可能風險。 三、相關警語。 四、其他經主管機關規定之事項。 前項資訊揭露及銷售應遵循事項，由主管機關另定之。", "anchor": "read/c3"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "clause", "title": "第4條 專設帳簿", "text": "專設帳簿 投資型保險要專設帳簿記載投資資產價值。三原則：與其他資產分開設置並單獨管理；依公會會計制度範本定期評價，並依契約約定方式計算、通知要保人；資產運用要與要保人同意或指定的投資方式及標的相符。 三原則「分開、評價、相符」。  保險人經營投資型保險之業務應專設帳簿，記載其投資資產之價值。 前項專設帳簿應符合下列原則： 一、專設帳簿之資產，應與保險人之其他資產分開設置，並單獨管理之。 二、除本辦法另有規定外，保險人應依中華民國人壽保險商業同業公會（以下簡稱同業公會）報經主管機關備查之人壽保險業會計制度範本，定期對專設帳簿之資產加以評價，並依保險契約所約定之方式計算及通知要保人其於專設帳簿內受益之資產價值。 三、專設帳簿資產之運用，應與要保人同意或指定之投資方式及投資標的相符。", "anchor": "read/c4"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "clause", "title": "第5條 運用與管理專設帳簿資產", "text": "運用與管理專設帳簿資產 兩種方式：保險人自己指派專業人員運用；非全權決定的商品可委託經核准的全權委託投資事業。委託的管理事業要向主管機關申報，變更後 15 個工作日內申報。投資及交易要有書面紀錄，每月提出檢討報告。不得做三件事：提供資產擔保、借予他人、從事法令禁止的投資。 申報變更「十五個工作日」；檢討報告「按月」；不得「擔保、出借、禁投」。  保險人運用與管理專設帳簿資產，以下列方式之一行之： 一、保險人指派具有金融、證券或其他投資業務經驗之專業人員運用與管理專設帳簿之資產。但涉及由保險人全權決定運用於證券交易法第六條之有價證券者，應另依證券投資信託及顧問法申請兼營全權委託投資業務。 二、非由保險人全權決定運用標的之投資型保險，保險人得委託經主管機關核准經營或兼營全權委託投資業務之事業代為運用與管理專設帳簿之資產者，該管理事業之選任，應依保險人內部所訂之委外代為資金管理處理程序及相關法令之規定辦理。保險人應向主管機關申報其所選任之管理事業，管理事業有變更者，應於變更後十五個工作日內向主管機關申報。 保險人依前項規定運用專設帳簿之資產進行投資及交易，應作成書面紀錄，按月提出檢討報告，並應依法建檔保存。 保險人依第一項規定運用與管理專設帳簿資產時，不得有下列情事： 一、提供專設帳簿之資產做為擔保之用。 二、將專設帳簿之資產借予他人。但主管機關另有規定者，不在此限。 三、從事法令禁止投資之項目。", "anchor": "read/c5"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "clause", "title": "第6條 保管機構", "text": "保管機構 專設帳簿資產要交給保管機構，並向主管機關申報；保管機構變更後 15 個工作日內申報。保管機構是指經主管機關認可的信評機構評等達一定等級以上的金融機構。 「保管：申報、十五個工作日」。  保險人應為要保人或受益人之利益管理專設帳簿之資產。 保險人應將專設帳簿之資產交由保管機構保管，並應向主管機關申報其所選任之保管機構，保管機構有變更者，應於變更後十五個工作日內向主管機關申報。 保險人與要保人締結第二章所定保險契約時，應提供委任保管契約內容，並依該保管契約內容將第一項專設帳簿之資產交由保管機構保管。保險人應向主管機關申報其所選任之保管機構，保管機構有變更者，應於變更後十五個工作日內向主管機關申報。 前二項所稱保管機構，指經主管機關認可之信用評等機構評等達一定等級以上之金融機構。 保險人依前條第一項第二款委託經主管機關核准兼營全權委託投資業務之信託業代為運用與管理專設帳簿之資產，並由該信託業自行保管資產者，準用第二項及第四項規定。", "anchor": "read/c6"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "clause", "title": "第7條 投資方式或標的的變更", "text": "投資方式或標的的變更 投資型保險的投資方式或標的要變更，必須依法令規定及保險契約的約定辦理。   投資型保險之投資方式或標的之變更，須依法令規定及保險契約之約定行之。", "anchor": "read/c7"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "clause", "title": "第8條 專設帳簿與一般帳簿間不得互相移轉", "text": "專設帳簿與一般帳簿間不得互相移轉 專設帳簿資產和一般帳簿資產原則上不得互相出售、交換或移轉。三種例外：一般帳簿資產轉入做為設立或支應正常運作；為保險成本或第3條費用必要的轉出；為維護要保人或受益人利益並經主管機關核准。例外時原則上以現金移轉。 例外三種「設立、費用、利益」。  置於專設帳簿之資產與保險人之一般帳簿資產間，不得互相出售、交換或移轉。但有下列情事之一者，不在此限： 一、將一般帳簿資產轉入非由保險人全權決定運用標的之投資型保險專設帳簿做為其設立之用，或用於支應該轉入專設帳簿保單之正常運作。 二、為保險成本或第三條訂定之各項費用必要之轉出。 三、為維護要保人或受益人之利益並經主管機關核准。 前項但書各款情形，除事先經主管機關核准者，得以符合第十條第一項規定之標的資產為移轉外，應以現金移轉為之。", "anchor": "read/c8"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "clause", "title": "第9條 善良管理人義務與破產追償", "text": "善良管理人義務與破產追償 董事、監察人、經理人及運用管理專設帳簿資產的人，要盡善良管理人之注意，不得利用職務上消息為自己或保戶以外的人交易或洩漏消息。連結標的的發行或經理機構破產時，保險人要為要保人、受益人利益積極追償。 「發行或經理機構破產：保險人追償」。 題目若把「保管」也放進破產追償，請回到條文：只有「發行或經理」機構。 保險人之董事、監察人、經理人及負責運用與管理專設帳簿資產之人，應盡善良管理人之注意，忠實執行專設帳簿投資管理業務，不得以職務上所知悉之消息，為專設帳簿保戶以外之人或自己從事投資相關之交易活動，或洩漏消息予他人。 投資型保險契約所提供連結之投資標的發行或經理機構破產時，保險人應基於要保人、受益人之利益向該機構積極追償。", "anchor": "read/c9"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "clause", "title": "第10條 投資型保險可連結的標的（十二款）", "text": "投資型保險可連結的標的（十二款） 非全權決定運用的投資型保險，連結標的以十二款為限：銀行存款、證券投資信託基金、境外基金、共同信託基金、不動產投資或資產信託受益證券、金融資產證券化商品、各國中央政府公債國庫券、金融債券、公司債、結構型商品、房利美等不動產抵押債權證券、其他核准標的。「公開發行的公司股票」不在這十二款裡。 十二款「存、基、境、共、不、資、公、金、司、結、抵、他」。 「股票」只出現在第11條（全權決定運用）的範圍，不在第10條。 投資型保險契約所提供連結之投資標的及專設帳簿資產之運用，除要保人以保險契約約定委任保險人全權決定運用標的者外，以下列為限： 一、銀行存款。 二、證券投資信託基金受益憑證。 三、境外基金。 四、共同信託基金受益證券。 五、依不動產證券化條例所發行之不動產投資信託受益證券或不動產資產信託受益證券。 六、依金融資產證券化條例所發行之受益證券或資產基礎證券。 七、各國中央政府發行之公債、國庫券。 八、金融債券。 九、公開發行之有擔保公司債，或經評等為相當等級以上之公司所發行之公司債，或外國證券集中交易市場、店頭市場交易之公司債。 十、結構型商品。 十一、美國聯邦國民抵押貸款協會、聯邦住宅抵押貸款公司及美國政府國民抵押貸款協會所發行或保證之不動產抵押債權證券。 十二、其他經主管機關核准之投資標的。 前項專設帳簿資產屬保險人之自有部位與保險人之其他投資合計，不得超過本法第一百四十六條至第一百四十六條之二、第一百四十六條之四、第一百四十六條之五及第一百四十六條之七所定限額。 保險人依第五條第一項第二款委託經主管機關核准經營或兼營全權委託投資業務之事業代為運用與管理專設帳簿之資產者，其投資型保險契約所提供連結之投資標的及專設帳簿資產之運用，除第一項所列標的外，得為匯率避險目的，並依主管機關規定之範圍、條件及相關事項，從事與專設帳簿資產有關之貨幣相關衍生性金融商品交易。", "anchor": "read/c10"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "clause", "title": "第10-1條 委託全權委託投資業者運用專設帳簿", "text": "委託全權委託投資業者運用專設帳簿 保險人把專設帳簿資產委託給經核准的全權委託投資業者運用時：要建立委託處理程序並經董事會通過（作業、內控、內稽、會計、風險管理、選任與管理、損失處理機制）；委託前要確認受託機構也有經董事會通過的交易處理程序，並納入年度查核。 「委託先有董事會通過的處理程序」 受託機構也要有自己的董事會通過程序。 保險人依第五條第一項第二款委託經主管機關核准經營或兼營全權委託投資業務之事業代為運用與管理專設帳簿之資產者，應符合下列規定： 一、應建立對委託全權委託投資業務事業之處理程序，並經董事會通過。處理程序內容至少應包括作業程序、內部控制制度、內部稽核制度、會計處理制度、風險管理措施、對全權委託投資業務事業之選任及管理措施，以及全權委託投資業務事業未依委託契約辦理所致損失之處理機制等。 二、委託前應確認受託機構已就全權委託投資交易業務訂定處理程序，並報經其董事會通過。處理程序內容至少應包括交易原則及方針、作業程序、內部控制制度、內部稽核制度、風險管理措施及交易對手之風險管理制度。受託機構並應依下列原則納入年度查核計畫作成稽核報告： （一）查核遵循法令規定及委託契約之事項。 （二）查核內部控管措施時，應包括查核內部控制及勾稽功能。 （三）評估風險管理作業之獨立性及執行情形。 （四）查核交易文件資料來源之可靠性。 保險人依第五條第一項第二款委託經主管機關核准經營或兼營全權委託投資業務之事業代為運用與管理專設帳簿資產者，不適用證券投資信託事業證券投資顧問事業經營全權委託投資業務管理辦法第二十八條第四項規定。", "anchor": "read/c10-1"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "clause", "title": "第11條 保險人全權決定運用標的的範圍（十二款）", "text": "保險人全權決定運用標的的範圍（十二款） 要保人以契約委任保險人全權決定運用標的時，範圍以十二款為限，其中包含公開發行公司股票、台灣存託憑證、外國有價證券、證券相關商品。外國有價證券限五類：外國中央政府公債國庫券、外國銀行金融債與可轉讓定期存單與浮動利率中期債券、外國集中市場或店頭市場的股票與公司債、境外基金、房利美等不動產抵押債權證券。  第10條（一般）與第11條（全權決定運用）範圍不同；「股票」只在第11條。 保險人接受要保人以保險契約委任全權決定運用標的者，其運用範圍以下列為限： 一、銀行存款。 二、公債、國庫券。 三、金融債券、可轉讓定期存單、銀行承兌匯票、金融機構保證商業本票。 四、公開發行之公司股票。 五、公開發行之有擔保公司債，或經評等為相當等級以上之公司所發行之公司債。 六、證券投資信託基金受益憑證及共同信託基金受益證券。 七、台灣存託憑證。 八、依金融資產證券化條例發行之受益證券或資產基礎證券。 九、依不動產證券化條例發行之不動產資產信託受益證券及不動產投資信託受益證券。 十、外國有價證券。 十一、證券相關商品。 十二、其他經主管機關核准之標的。 前項第十款所稱外國有價證券，以下列各款為限： 一、外國中央政府發行之公債、國庫券。 二、外國銀行發行之金融債券、可轉讓定期存單、浮動利率中期債券。 三、外國證券集中交易市場、店頭市場交易之股票、公司債。 四、境外基金。 五、美國聯邦國民抵押貸款協會、聯邦住宅抵押貸款公司及美國政府國民抵押貸款協會所發行或保證之不動產抵押債權證券。", "anchor": "read/c11"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "clause", "title": "第12條 全權決定運用時不得做的八件事", "text": "全權決定運用時不得做的八件事 全權決定運用時不得：辦理放款；與其他專設帳簿或一般帳簿資產交易（集中市場成交且非故意相對交易者除外）；投資保險人自己發行的股票或公司債；投資與保險人有利害關係公司的股票、公司債或金融債；投資有利害關係證券承銷商承銷的有價證券；投資私募有價證券；證券信用交易；出借或借入有價證券。 八不「放款、對作、自家、關係人、承銷、私募、信用、出借」。  保險人為前條之運用時，除主管機關另有規定外，不得有下列情事： 一、辦理放款。 二、與其他投資型保險專設帳簿投資資產或與保險人之一般帳簿資產為交易行為。但經由證券集中市場或證券商營業處所委託買賣成交，且非故意發生相對交易之結果者，不在此限。 三、投資於保險人發行之股票或公司債。 四、投資與保險人有利害關係之公司所發行之股票、公司債或金融債券。 五、投資與保險人有利害關係之證券承銷商所承銷之有價證券。 六、投資私募有價證券。 七、從事證券信用交易。 八、出借或借入有價證券。", "anchor": "read/c12"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "clause", "title": "第13條 評等要求", "text": "評等要求 第10條第7款至第11款（公債、金融債、公司債、結構型商品、房利美等抵押債權證券）的標的，要經主管機關認可的信用評等機構評等達一定等級以上；第11條部分債券類標的準用。 評等範圍「第10條第7至11款」。  投資型保險之投資標的為第十條第一項第七款至第十一款所定標的者，應經主管機關認可之信用評等機構評等達一定等級以上。 投資型保險之投資標的為第十一條第一項第三款、第五款及同條第二項第一款、第二款、第三款及第五款所定公債、債券或不動產抵押債權證券者，準用前項規定。", "anchor": "read/c13"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "clause", "title": "第14條 基金、共同信託基金與結構型商品的定義", "text": "基金、共同信託基金與結構型商品的定義 連結證券投資信託基金：須是經核准或申報生效得募集發行的基金；境外基金須經核准或申報生效在國內募集及銷售（國外交易所的 ETF 除外）。共同信託基金受益證券須經主管機關核准。結構型商品＝固定收益商品＋衍生性金融商品的組合式商品或結構型債券。 「基金要核准或生效；ETF 例外；結構型＝固收＋衍生」 國外證券交易市場交易的指數股票型基金不受「須在國內募集銷售」的限制。 投資型保險之投資標的為證券投資信託基金受益憑證者，應為經主管機關核准或申報生效得募集發行之證券投資信託基金受益憑證；其為境外基金者，係經主管機關核准或申報生效在國內募集及銷售之境外基金。但於國外證券交易市場交易之指數股票型基金，不在此限。 投資型保險之投資標的為共同信託基金受益證券者，應經主管機關核准。 投資型保險之投資標的為結構型商品者，係指結合固定收益商品與衍生性金融商品之組合型式商品或結構型債券。 第十條第一項及第十一條所列各種投資標的之限制及不得涉及事項，由主管機關另定之。", "anchor": "read/c14"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "clause", "title": "第15條 評價", "text": "評價 專設帳簿資產依契約約定評價日的市價評價，並編列資產明細；保險人自有部位及保險人部分承擔投資損益風險者除外。 評價「契約約定評價日、市價」。  專設帳簿資產應依投資型保險契約約定評價日之市價評價，並依相關法令編列資產明細。但保險人之自有部位及依保險契約約定由保險人部分承擔投資損益風險者，不在此限。", "anchor": "read/c15"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "clause", "title": "第16條 表決權的行使", "text": "表決權的行使 行使專設帳簿持股的表決權：由保險人指派該事業人員為之；基於保戶最大利益，不得參與發行公司經營或不當安排；出席前先將評估分析作成說明；相關紀錄循序編號建檔，至少保存 5 年。出席基金受益人會議也基於保戶最大利益，並準用第三、四款。 紀錄「循序編號、五年」。  保險人行使投資型保險專設帳簿持有股票之投票表決權者，應依下列規定辦理： 一、除法令另有規定外，應由保險人指派該事業人員為之。 二、保險人行使表決權，應基於投資型保險保戶之最大利益，且不得直接或間接參與該股票發行公司經營或有不當之安排情事。 三、保險人於出席投資型保險專設帳簿所持有股票之發行公司股東會前，應將行使表決權之評估分析作業，作成說明。 四、保險人應將投資型保險專設帳簿所持有股票發行公司之股東會通知書及出席證登記管理，並應就出席股東會行使表決權，表決權行使之評估分析作業、決策程序及執行結果作成書面紀錄，循序編號建檔，至少保存五年。 保險人出席投資型保險專設帳簿所持有證券投資信託基金受益憑證之受益人會議，應基於投資型保險保戶之最大利益行使表決權，並準用前項第三款及第四款之規定。", "anchor": "read/c16"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "clause", "title": "第17條 解散清算", "text": "解散清算 保險人解散清算時，專設帳簿資產先清償了結專設帳簿的費用與債務，剩餘財產依保險人及要保人所有受益權價值比例分派給保險人及要保人或受益人。   保險人解散清算時，專設帳簿之資產在清償因了結專設帳簿而生之費用及債務後，賸餘之財產，應按專設帳簿資產內保險人及要保人所有受益權價值之比例分派予保險人及要保人或受益人。", "anchor": "read/c17"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "clause", "title": "第18條 外幣收付的投資型保險", "text": "外幣收付的投資型保險 外幣收付的投資型保險：不得在新臺幣與外幣間約定互換收付幣別；例外是外幣投資型年金在累積期間屆滿、全部處分連結標的並轉為一般帳簿即期年金時，可約定以新臺幣給付年金。經營外幣投資型業務及這種新臺幣給付年金，要分別經央行許可。專設帳簿資產限投資外幣計價標的；款項收付走外匯存款戶（有兩個例外）。新臺幣收付的投資型保險，結匯依申報辦法。 央行許可「外幣業務」「新臺幣給付年金」各一次；專設帳簿「外幣計價標的為限」。 這一條和第六章（外幣非投資型）第3點的「外匯存款戶」「抵繳」規定相近，但適用的是外幣「投資型」保險。 訂立投資型保險契約時，保險人與要保人得約定保險費、保險給付、費用及其他款項收付之幣別，且不得於新臺幣與外幣間約定相互變換收付之幣別。但以外幣收付之投資型年金保險，於年金累積期間屆滿時將連結投資標的全部處分出售，並轉換為一般帳簿之即期年金保險者，得約定以新臺幣給付年金。 保險人經營以外幣收付之投資型保險業務及依前項但書之規定辦理以新臺幣給付年金者，須分別經中央銀行之許可。 以外幣收付之投資型保險契約，其專設帳簿資產，以投資外幣計價之投資標的為限；保險人並應與要保人事先約定收付方式，且以外匯存款戶存撥之。但有下列情形之一者，不在此限： 一、依第一項但書規定辦理以新臺幣給付年金。 二、保險人與要保人約定，於其他外幣保險契約所定生存保險金應給付日當日，以該生存保險金，抵繳相同幣別外幣保險契約之保險費，且該生存保險金之受益人，與所抵繳保險契約之要保人為同一人。 以新臺幣收付之投資型保險契約，其結匯事宜應依中央銀行訂定之外匯收支或交易申報辦法等有關規定辦理。", "anchor": "read/c18"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "clause", "title": "第19條 全權決定運用的資格（五項）", "text": "全權決定運用的資格（五項） 全權決定運用的五項資格：自有資本與風險資本比率符合適足比率；最近一年無重大裁罰（或已改善）；國外投資採風險值並每週控管；有風險控管組織；公平待客評核前 80%。條件與第六章第二點相近（多了第一項的適足比率，沒有第六章的某些措辭）。 五項「資、罰、險、控、客」。  保險人銷售由其全權決定運用標的之投資型保險，應符合下列資格條件： 一、最近一年之自有資本與風險資本之比率符合本法第一百四十三條之四第一項之適足比率。 二、最近一年內未有遭主管機關重大裁罰及處分者，或受處分情事已獲具體改善經主管機關認可者。 三、國外投資部分已採用計算風險值評估風險，並每週至少控管乙次。 四、董事會中設有風險控管委員會或於公司內部設置風險控管部門及風控長或職務相當之人，並實際負責公司整體風險控管。 五、最近一年公平待客原則評核結果為人身保險業前百分之八十。但提出合理說明並經主管機關核准者，不在此限。 前項第二款所稱重大裁罰及處分，指金融監督管理委員會處理違反金融法令重大裁罰措施之對外公布說明辦法第二條所定各款之情事。 第一項第三款所稱之風險值，係指按週為基礎、樣本期間至少三年，或按日為基礎、樣本期間至少一年，樣本之資料至少每週更新一次，以至少百分之九十九的信賴水準，計算十個交易日之風險值，且須每月進行回溯測試。 保險人依證券投資信託及顧問法申請兼營全權委託投資業務前，應先經主管機關認可其符合第一項所定資格。", "anchor": "read/c19"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "clause", "title": "第20條 全委投資型保險的定義", "text": "全委投資型保險的定義 保險人銷售由自己全權決定運用標的的投資型保險，稱為全委投資型保險；其專設帳簿資產的運用方式，以由保險人全權決定運用為限。   保險人經許可以委任方式兼營投資型保險專設帳簿資產全權委託投資業務者，係指保險人銷售由其全權決定運用標的之投資型保險（以下簡稱全委投資型保險）業務。 全委投資型保險專設帳簿資產之運用方式，以由保險人全權決定運用為限。", "anchor": "read/c20"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "clause", "title": "第21條 全委專設帳簿分別獨立保管", "text": "全委專設帳簿分別獨立保管 全委投資型保險的專設帳簿資產，要依第6條第3、4項規定，按保險商品別分別獨立保管。   全委投資型保險專設帳簿之資產，應依第六條第三項及第四項規定按保險商品別分別獨立保管。", "anchor": "read/c21"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "clause", "title": "第22條 全委契約與商品說明書要載明的事項", "text": "全委契約與商品說明書要載明的事項 除了投資型保險資訊揭露的一般規定，保險契約還要載明：契約轉換條款、越權交易的責任歸屬、其他經規定的事項。商品說明書要載明性質範圍與收費、分析方法與投資策略、部門主管與業務人員學經歷、最近二年度損益表與資產負債表、訴訟或非訟事件、風險警語等。說明書有重大影響保戶權益的變更要報備；契約與相關資料於契約終止或失效後至少保存五年。 「契約三項、說明書六項、保存五年」 保存期間是契約終止或失效後「至少五年」。 全委投資型保險之保險契約及保險商品說明書，除應符合投資型保險資訊揭露應遵循事項及證券投資信託事業證券投資顧問事業經營全權委託投資業務管理辦法規定之應載事項外，並應分別載明下列事項： 一、保險契約： （一）保險契約轉換條款。 （二）越權交易之責任歸屬。 （三）其他經主管機關規定應記載事項。 二、保險商品說明書： （一）全委投資型保險之性質、範圍、經營原則、收費方式、禁止規定、保戶、保險人及保管機構之法律關係及運作方式等事項。 （二）運用委託投資資產之分析方法、資訊來源及投資策略。 （三）經營全委投資型保險業務之部門主管及業務人員之學歷與經歷。 （四）最近二年度損益表及資產負債表。 （五）因業務發生訴訟或非訟事件之說明。 （六）投資或交易風險警語、投資或交易標的之特性、可能之風險及法令限制。 前項說明書如有重大影響保戶權益事項之變更，應向主管機關報備。 全委投資型保險之保險契約及相關資料，於契約終止或失效後至少保存五年。", "anchor": "read/c22"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "clause", "title": "第23條 全委契約轉換", "text": "全委契約轉換 全委投資型保險的要保人可申請轉換為不同投資方針的全委契約；除因險種、期間或保險金額改變致危險增加外，保險人不得拒絕。保險人要訂定契約轉換及紛爭調處辦法並公告；收轉換費用要事先告知。 「轉換：不得拒絕（除危險增加）」。  全委投資型保險契約之要保人得向保險人申請轉換為不同投資方針之全委投資型保險契約，且除因險種、保險期間或保險金額改變所致危險增加之情形外，保險人不得拒絕。 保險人受理契約轉換之申請，應訂定契約轉換及紛爭調處辦法並公告之； 如有收取契約轉換費用者，保險人於受理轉換申請時，應事先告知要保人。", "anchor": "read/c23"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "clause", "title": "第24條 法令變更的通知", "text": "法令變更的通知 簽約後因法令變更致投資或交易範圍增減，保險人要以不低於 60 日的期間通知要保人；要保人在期間內異議並申請終止契約，保險人不得收取任何解約費用。 「六十日、免解約費」。  全委投資型保險契約於簽訂後，因法令變更致其投資或交易範圍有增減時，保險人應以不低於六十日之期間內通知要保人。 要保人於前項期間內表示異議而向保險人申請終止保險契約者，保險人不得向要保人收取任何解約費用。", "anchor": "read/c24"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "clause", "title": "第25條 會計制度", "text": "會計制度 全委專設帳簿的會計制度，依一般公認會計原則、公會釐訂的規範及有關法令辦理。   全委投資型保險專設帳簿之會計制度應依一般公認會計原則、同業公會釐訂之規範及有關法令之規定辦理。", "anchor": "read/c25"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "clause", "title": "第26條 每營業日計算保單帳戶價值", "text": "每營業日計算保單帳戶價值 除契約另有約定，保險人每一營業日要分別計算每一要保人的保單帳戶價值。 「每一營業日」。  除保險契約另有約定外，保險人應於每一營業日就各全委投資型保險專設帳簿分別計算其每一要保人之保單帳戶價值。", "anchor": "read/c26"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "clause", "title": "第27條 帳簿與年度決算報告", "text": "帳簿與年度決算報告 每一全委專設帳簿要分別造具帳簿並定期編製運用狀況報告書；會計年度終了後 4 個月內編具年度決算報告，經會計師查核簽證後函報主管機關備查並公告。 「四個月、會計師簽證、備查並公告」。  保險人應就各全委投資型保險專設帳簿分別造具帳簿，載明該全委投資型保險專設帳簿之處理狀況，並定期編製運用狀況報告書。 保險人應於會計年度終了後四個月內，就各全委投資型保險專設帳簿分別編具全委投資型保險專設帳簿資產年度決算報告，經會計師查核簽證後函報主管機關備查，並公告之。", "anchor": "read/c27"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "table", "title": "第10條 vs 第11條：誰可以買股票？", "text": "第10條 vs 第11條：誰可以買股票？  第10條（一般投資型保險） 第11條（保險人全權決定運用） 適用情形 除全權決定運用外的連結標的與專設帳簿資產 要保人以契約委任保險人全權決定運用標的 公開發行公司股票 沒有 有（第4款） 台灣存託憑證 沒有 有（第7款） 外國有價證券 境外基金、各國中央政府公債國庫券、外國集中市場公司債等分項列於各款 限五類，第10款另列 證券相關商品 沒有 有（第11款） 結構型商品 有（第10款） 沒有列舉", "anchor": "table/t0"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "table", "title": "第12條：全權決定運用時不得做的八件事", "text": "第12條：全權決定運用時不得做的八件事 款 不得 一 辦理放款 二 與其他專設帳簿或一般帳簿資產交易（集中市場成交且非故意相對交易者除外） 三 投資於保險人發行的股票或公司債 四 投資與保險人有利害關係公司的股票、公司債或金融債券 五 投資與保險人有利害關係的證券承銷商所承銷的有價證券 六 投資私募有價證券 七 證券信用交易 八 出借或借入有價證券", "anchor": "table/t1"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "table", "title": "數字與期限", "text": "數字與期限 項目 規定 條文 變更管理事業或保管機構 變更後 15 個工作日內向主管機關申報 第5、6條 投資及交易檢討報告 按月提出 第5條 表決權行使紀錄 循序編號建檔，至少保存 5 年 第16條 法令變更通知要保人 不低於 60 日 第24條 計算保單帳戶價值 每一營業日 第26條 年度決算報告 會計年度終了後 4 個月內 第27條 全委資格：公平待客評核 前 80% 第19條 全委資格：風險值 99%、10 個交易日、每月回溯測試 第19條", "anchor": "table/t2"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "table", "title": "專設帳簿與一般帳簿移轉的三種例外（第8條）", "text": "專設帳簿與一般帳簿移轉的三種例外（第8條） 款 情形 一 一般帳簿資產轉入專設帳簿，做為設立之用，或支應正常運作 二 為保險成本或第3條訂定的各項費用必要之轉出 三 為維護要保人或受益人利益並經主管機關核准", "anchor": "table/t3"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "card", "title": "重要事項告知書要說明哪些事項？", "text": "重要事項告知書要說明哪些事項？ 各項費用；投資標的及其可能風險；相關警語；其他經主管機關規定的事項，並經要保人簽章。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "card", "title": "專設帳簿的三原則？", "text": "專設帳簿的三原則？ 資產與保險人其他資產分開設置並單獨管理；依公會會計制度範本定期評價並依契約通知要保人；資產運用與要保人同意或指定的方式及標的相符。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "card", "title": "委託的管理事業有變更，多久要申報？", "text": "委託的管理事業有變更，多久要申報？ 變更後 15 個工作日內向主管機關申報。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "card", "title": "專設帳簿資產不得做哪三件事？", "text": "專設帳簿資產不得做哪三件事？ 提供做為擔保之用；借予他人（主管機關另有規定除外）；從事法令禁止投資的項目。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "card", "title": "投資及交易的書面紀錄與檢討報告頻率？", "text": "投資及交易的書面紀錄與檢討報告頻率？ 作成書面紀錄，按月提出檢討報告，並依法建檔保存。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "card", "title": "保管機構變更要怎麼辦？", "text": "保管機構變更要怎麼辦？ 變更後 15 個工作日內向主管機關申報。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "card", "title": "專設帳簿與一般帳簿資產原則上可以互相移轉嗎？例外？", "text": "專設帳簿與一般帳簿資產原則上可以互相移轉嗎？例外？ 不得互相出售、交換或移轉；例外三種：設立或正常運作、保險成本及費用必要轉出、維護要保人或受益人利益並經核准。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "card", "title": "連結標的的發行或經理機構破產時，保險人要做什麼？", "text": "連結標的的發行或經理機構破產時，保險人要做什麼？ 基於要保人、受益人之利益向該機構積極追償。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "card", "title": "第10條連結標的共幾款？", "text": "第10條連結標的共幾款？ 十二款（含其他經主管機關核准的投資標的）。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "card", "title": "「公開發行公司股票」在第10條嗎？", "text": "「公開發行公司股票」在第10條嗎？ 不在；股票只在第11條（全權決定運用）的範圍。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "card", "title": "第11條全權決定運用的範圍共幾款？外國有價證券有幾類？", "text": "第11條全權決定運用的範圍共幾款？外國有價證券有幾類？ 十二款；外國有價證券限五類。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "card", "title": "第12條全權決定運用時不得做幾件事？", "text": "第12條全權決定運用時不得做幾件事？ 八件。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "card", "title": "哪些標的要求信用評等達一定等級？", "text": "哪些標的要求信用評等達一定等級？ 第10條第1項第7款至第11款（公債、金融債券、公司債、結構型商品、房利美等抵押債權證券）；第11條部分債券類準用。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "card", "title": "表決權行使的相關紀錄要保存多久？", "text": "表決權行使的相關紀錄要保存多久？ 至少 5 年，循序編號建檔。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "card", "title": "保險人解散清算，專設帳簿剩餘財產如何分派？", "text": "保險人解散清算，專設帳簿剩餘財產如何分派？ 按專設帳簿資產內保險人及要保人所有受益權價值的比例，分派給保險人及要保人或受益人。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "card", "title": "外幣收付的投資型保險，可以約定新臺幣與外幣互換收付幣別嗎？例外？", "text": "外幣收付的投資型保險，可以約定新臺幣與外幣互換收付幣別嗎？例外？ 不得；例外是外幣投資型年金於累積期間屆滿、全部處分連結標的並轉為一般帳簿即期年金時，可約定以新臺幣給付年金。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "card", "title": "經營外幣投資型保險業務，須經誰許可？", "text": "經營外幣投資型保險業務，須經誰許可？ 中央銀行（以新臺幣給付年金的情形也要另外許可）。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "card", "title": "外幣收付的投資型保險，專設帳簿資產可投資什麼？", "text": "外幣收付的投資型保險，專設帳簿資產可投資什麼？ 以投資外幣計價的投資標的為限。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "card", "title": "全權決定運用的五項資格？", "text": "全權決定運用的五項資格？ 自有資本與風險資本比率符合適足比率；最近一年無重大裁罰；國外投資採風險值並每週控管；有風險控管組織；公平待客評核前 80%。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "card", "title": "全委契約轉換，保險人可以拒絕嗎？", "text": "全委契約轉換，保險人可以拒絕嗎？ 不得拒絕，除非因險種、期間或保險金額改變致危險增加。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "card", "title": "簽約後因法令變更致投資範圍增減，通知期間？", "text": "簽約後因法令變更致投資範圍增減，通知期間？ 不低於 60 日；要保人異議並申請終止時，不得收取任何解約費用。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "card", "title": "保單帳戶價值多久計算一次？", "text": "保單帳戶價值多久計算一次？ 除契約另有約定，每一營業日。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "card", "title": "全委專設帳簿的年度決算報告，何時內編具、怎麼處理？", "text": "全委專設帳簿的年度決算報告，何時內編具、怎麼處理？ 會計年度終了後 4 個月內，經會計師查核簽證後函報主管機關備查並公告。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "card", "title": "投資型保險連結的境外基金，要符合什麼條件？", "text": "投資型保險連結的境外基金，要符合什麼條件？ 須是經主管機關核准或申報生效在國內募集及銷售的境外基金；但在國外證券交易市場交易的指數股票型基金（ETF）不在此限。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "card", "title": "結構型商品的定義？", "text": "結構型商品的定義？ 結合固定收益商品與衍生性金融商品的組合型式商品或結構型債券。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "card", "title": "全委投資型保險的契約及相關資料，保存多久？", "text": "全委投資型保險的契約及相關資料，保存多久？ 契約終止或失效後至少保存五年。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "scen", "title": "某保險公司想把專設帳簿的資產出售給一般帳簿，沒有符合任何例外。依第8條，是否可以？", "text": "某保險公司想把專設帳簿的資產出售給一般帳簿，沒有符合任何例外。依第8條，是否可以？ 可以，雙方帳簿都是公司的 原則上不得互相出售、交換或移轉 可以，但要向央行申請 可以，只要用現金 第8條：置於專設帳簿的資產與一般帳簿資產間，不得互相出售、交換或移轉，三種但書情形除外。", "anchor": "quiz"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "scen", "title": "保險公司變更了專設帳簿資產的保管機構。依第6條，應如何處理？", "text": "保險公司變更了專設帳簿資產的保管機構。依第6條，應如何處理？ 變更後 15 個工作日內向主管機關申報 變更前 30 日向壽險公會備查 不需要申報 變更後 3 個月內向央行申報 第6條第2項：保管機構有變更者，應於變更後十五個工作日內向主管機關申報。", "anchor": "quiz"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "scen", "title": "某全委投資型保險的要保人申請轉換為不同投資方針的全委契約，沒有險種、期間、保險金額改變致危險增加的情形。依第23條，保險人？", "text": "某全委投資型保險的要保人申請轉換為不同投資方針的全委契約，沒有險種、期間、保險金額改變致危險增加的情形。依第23條，保險人？ 可以任意拒絕 不得拒絕 須經主管機關核准才能接受 須先終止原契約 第23條第1項：除因險種、保險期間或保險金額改變所致危險增加之情形外，保險人不得拒絕。", "anchor": "quiz"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "scen", "title": "全委投資型保險契約簽訂後，因法令變更使投資範圍增減，保險人通知要保人的期間，以及要保人異議終止契約時的解約費用，依第24條是？", "text": "全委投資型保險契約簽訂後，因法令變更使投資範圍增減，保險人通知要保人的期間，以及要保人異議終止契約時的解約費用，依第24條是？ 不低於 60 日；不得收取任何解約費用 不超過 30 日；可收取一般解約費用 不低於 90 日；減半收取 不超過 60 日；可收取手續費 第24條：以不低於六十日之期間內通知要保人；要保人在期間內表示異議並申請終止契約者，保險人不得向要保人收取任何解約費用。", "anchor": "quiz"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "scen", "title": "保險公司應於何時內編具全委投資型專設帳簿的資產年度決算報告？", "text": "保險公司應於何時內編具全委投資型專設帳簿的資產年度決算報告？ 會計年度終了後 1 個月內 會計年度終了後 4 個月內 會計年度終了後 6 個月內 會計年度終了前 第27條第2項：應於會計年度終了後四個月內編具，並經會計師查核簽證後函報主管機關備查，並公告之。", "anchor": "quiz"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "scen", "title": "保險人全權決定運用專設帳簿資產時，下列哪一項是第12條「不得」做的？", "text": "保險人全權決定運用專設帳簿資產時，下列哪一項是第12條「不得」做的？ 投資公開發行公司股票 投資私募有價證券 投資台灣存託憑證 投資證券投資信託基金 第12條第6款：不得投資私募有價證券。公開發行公司股票、台灣存託憑證、證券投資信託基金都在第11條範圍內。", "anchor": "quiz"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "scen", "title": "保險人行使專設帳簿持有股票的表決權，相關的決策與執行紀錄應保存多久？", "text": "保險人行使專設帳簿持有股票的表決權，相關的決策與執行紀錄應保存多久？ 至少 1 年 至少 3 年 至少 5 年 至少 10 年 第16條第1項第4款：循序編號建檔，至少保存五年。", "anchor": "quiz"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "scen", "title": "下列哪一項「不在」第10條所列的投資型保險連結標的內？", "text": "下列哪一項「不在」第10條所列的投資型保險連結標的內？ 證券投資信託基金受益憑證 結構型商品 公開發行之公司股票 金融債券 第10條第1項十二款沒有列公開發行公司股票；股票只在第11條（全權決定運用）範圍內。", "anchor": "quiz"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "scen", "title": "外幣收付的投資型保險，其專設帳簿資產可以怎麼投資？", "text": "外幣收付的投資型保險，其專設帳簿資產可以怎麼投資？ 任何幣別都可以 以投資外幣計價的投資標的為限 只能投資新臺幣標的 只能投資銀行存款 第18條第3項：以外幣收付之投資型保險契約，其專設帳簿資產，以投資外幣計價之投資標的為限。", "anchor": "quiz"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "scen", "title": "投資型保險連結的投資標的，其發行或經理機構破產了。依第9條，保險人應？", "text": "投資型保險連結的投資標的，其發行或經理機構破產了。依第9條，保險人應？ 不必處理 基於要保人、受益人之利益向該機構積極追償 由要保人自行追償 向主管機關申請補貼 第9條第2項：保險人應基於要保人、受益人之利益向該機構積極追償。", "anchor": "quiz"}, {"file": "ch07.html", "chTitle": "第7章 投資型保險投資管理辦法", "type": "scen", "title": "投資型保險連結「境外基金」，依第14條，下列何者正確？", "text": "投資型保險連結「境外基金」，依第14條，下列何者正確？ 只要國外有核准就可以連結 須經主管機關核准或申報生效在國內募集及銷售 只能連結不動產投資信託基金 只要保險人自己評估風險即可 第14條第1項：境外基金須經主管機關核准或申報生效在國內募集及銷售；國外證券交易市場交易的 ETF 例外。", "anchor": "quiz"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "clause", "title": "第一點 訂定依據", "text": "訂定依據 本注意事項依投資型保險投資管理辦法第6條第4項、第10條第3項、第13條、第14條第4項訂定。   一、依據投資型保險投資管理辦法（以下簡稱本辦法）第六條第四項、第十條第三項、第十三條及第十四條第四項規定，訂定本注意事項。", "anchor": "read/c一"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "clause", "title": "第二點 保管機構的評等", "text": "保管機構的評等 專設帳簿資產要交給符合附表一所列信評機構評等達一定等級以上的國內或國外保管機構。 保管機構找「附表一」。 具體評等等級放在官方附表一（附件），見頁尾連結。 保險人應依本辦法第六條第二項及第三項規定，將投資型保險專設帳簿資產交由符合附表一所列信用評等機構評等達一定等級以上之國內或國外保管機構予以保管。", "anchor": "read/c二"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "clause", "title": "第三點 連結標的的信用評等", "text": "連結標的的信用評等 連結的標的要達一定評等：公債與國庫券看發行國家主權評等（附表二）；金融債、公司債、浮動利率中期債券：國內機構發行用附表三，國外機構發行用附表一並要求發行或保證機構在境內設有分公司或子公司；國內結構型商品看商品發行評等（附表三，沒有商品評等則以發行或保證機構的長期債務評等替代）；房利美等的抵押債權證券用附表四，且不得為再證券化或合成型證券化商品。 「主權二、國內三、國外一、結構三、MBS 四」＝附表編號。 附表一至四的具體等級在官方附件，見頁尾連結。 投資型保險商品所連結投資標的為本辦法第十條第一項第七款至第十一款，或第十一條第一項第三款、第五款及第二項第一款、第二款、第三款及第五款所定公債、國庫券、金融債券、公司債、結構型商品、國外不動產抵押債權證券及浮動利率中期債券者，除連結境外結構型商品之信用評等等級應依第四點規定辦理外，應分別符合下列信用評等等級： （一）公債、國庫券之發行國家主權評等，應符合附表二所列信用評等機構評等達一定等級以上。 （二）金融債券、公司債及浮動利率中期債券： 1.國內機構發行者：債務發行評等應符合附表三所列信用評等機構評等達一定等級以上。 2.國外機構發行者：債務發行評等應符合附表一所列信用評等機構評等達一定等級以上，且該債券之發行機構或保證機構應於中華民國境內設有境外結構型商品管理規則第六條所定之分公司或子公司。 （三）國內結構型商品：商品發行評等應符合附表三所列信用評等機構評等達一定等級以上。但無法取得商品發行評等之國內結構型商品者，應以國內發行機構或保證機構之長期債務信用評等等級替代之。 （四）美國聯邦國民抵押貸款協會、聯邦住宅抵押貸款公司及美國政府國民抵押貸款協會所發行或保證之不動產抵押債權證券：該證券之發行評等應符合附表四所列信用評等機構評等達一定等級以上，且不得為再次證券化商品及合成型證券化商品。", "anchor": "read/c三"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "clause", "title": "第四點 境外結構型商品", "text": "境外結構型商品 連結境外結構型商品，要符合境外結構型商品管理規則；但不得連結在外國證券交易所掛牌交易的境外結構型商品。   四、投資型保險商品連結之各種境外結構型商品，應符合境外結構型商品管理規則及相關規定。但不得連結境外結構型商品管理規則第四條第一項所定於外國證券交易所掛牌交易之境外結構型商品。", "anchor": "read/c四"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "clause", "title": "第五點 不得涉有的情事", "text": "不得涉有的情事 不得連結或運用：私募基金受益憑證或其他國內外私募有價證券；追蹤指數逾越主管機關公告範圍的國外指數型基金（ETF 除外）；保險人利害關係人發行的金融債券、公司債或結構型商品。 「私募、指數超範圍、利害關係人」。  投資型保險商品所連結投資標的或專設帳簿資產之運用，不得涉有下列情事： （一）連結或運用於證券投資信託事業以私募方式發行之證券投資信託基金受益憑證，或其他國內外私募之有價證券。 （二）連結或運用於國外指數型基金者，其追蹤指數逾越主管機關公告保險業投資國外指數型基金之追蹤指數範圍，但於國內、外證券交易市場交易之指數股票型基金，不在此限。 （三）連結或運用於保險法第一百四十六條之七第三項規定保險人之利害關係人所發行之金融債券、公司債或結構型商品。", "anchor": "read/c五"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "clause", "title": "第六點 國內結構型商品的規定", "text": "國內結構型商品的規定 國內結構型商品：計價幣別限新臺幣、人民幣等規定幣別；發行條件要記載發行與保證機構長期債務評等並揭露風險；不得連結新臺幣匯率指標、新臺幣利率指標（新臺幣計價者除外）、本國企業國外發行有價證券、國內投信國外發行受益憑證、臺股指數及相關商品（有例外）、未經核准的境外基金、私募有價證券、列舉外的衍生性金融商品；涉及大陸地區限列舉標的；到期保本率至少 100%，且不得含目標贖回式設計與發行機構得提前贖回的選擇權。 保本「百分之百」；不得含「目標贖回、提前贖回」。 第（三）款的「不得連結」共八項，請看「對照表」分頁。 投資型保險商品連結之各種國內結構型商品，應符合下列規定： （一）計價幣別以新臺幣、人民幣及境外結構型商品管理規則第十八條第二款所定計價幣別為限。 （二）發行條件除應記載發行機構、保證機構之長期債務信用評等外，並應揭露該等結構型商品之風險及相關重要資訊，其揭露事項依銀行辦理衍生性金融商品業務應注意事項或財團法人中華民國證券櫃檯買賣中心證券商營業處所經營衍生性金融商品交易業務規則相關規定辦理。 （三）不得連結下列標的： 1.新臺幣匯率指標。 2.新臺幣利率指標，但以新臺幣計價之結構型商品不在此限。 3.本國企業於國外發行之有價證券。 4.國內證券投資信託事業於國外發行之受益憑證。 5.國內外機構編製之臺股指數及其相關金融商品。但如該指數係由臺灣證券交易所或證券櫃檯買賣中心公布之各類指數及該指數係由臺灣證券交易所或證券櫃檯買賣中心與國外機構合作編製非以臺股為主要成分股之指數，不在此限。 6.未經本會核准或申報生效得募集及銷售之境外基金。 7.國內外私募之有價證券。 8.股權、利率、匯率、基金、商品、上述相關指數及指數型基金以外之衍生性金融商品。但指數股票型基金，以本會核定之證券市場掛牌交易之以投資股票、債券為主且不具槓桿或放空效果者為限。 （四）涉及大陸地區之商品或契約以連結下列標的及中央銀行已開放之範圍為限： 1.以外幣或人民幣計價或交割之無本金交割商品（1）涉及人民幣匯率：無本金交割之外幣對人民幣遠期外匯（NDF）、無本金交割之外幣對人民幣匯率選擇權（NDO） 或無本金交割之外幣對人民幣換匯換利（NDCCS） 。 （2）涉及人民幣利率：無本金交割之外幣對人民幣利率交換（NDIRS） 。 2.以外幣或人民幣計價或交割商品（1）涉及人民幣匯率：遠期外匯、換匯、換匯換利或匯率選擇權，但上開商品均不得涉及新臺幣匯率。 （2）涉及人民幣利率：遠期利率協議、利率交換、利率交換選擇權或利率選擇權。 3.涉及人民幣計價或交割之與大陸地區相關公開上市之股價指數： 股價遠期契約、股價交換或股價選擇權。 4.其他經中央銀行開放外匯指定銀行辦理之連結標的。 5.連結第一目至第三目標的之衍生性金融商品或契約以結合外幣或人民幣定期存款之結構型商品為限。 （五）除另有規定外，結構型商品得於中央銀行已開放之範圍內同時連結二種之資產類別。 （六）結構型商品之到期保本率至少為原計價貨幣本金（或其等值）之百分之一百，且不得含有目標贖回式設計及發行機構得提前贖回之選擇權。", "anchor": "read/c六"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "clause", "title": "第七點 連結國外債券的規定", "text": "連結國外債券的規定 連結國外債券：計價幣別限規定幣別；債券要在國內證券市場上櫃買賣，且不得僅限專業投資人；大陸、港澳有價證券準用外國有價證券管理規則第5條；不得投資本國企業赴國外發行的債券；不得投資具損失吸收能力（TLAC）債券。 「國內上櫃、非專投、非本國企業、非 TLAC」。  投資型保險商品連結第三點所列國外債券者，應符合下列規定： （一）計價幣別以人民幣及境外結構型商品管理規則第十八條第二款所定計價幣別為限。 （二）該債券應於國內證券市場上櫃買賣，且不得為僅限銷售予專業投資人者。 （三）投資大陸地區或港澳地區有價證券之範圍及限制，準用證券商受託買賣外國有價證券管理規則第五條之相關規定。 （四）不得投資本國企業赴國外發行之債券。 （五）不得投資具損失吸收能力（Total Loss Absorbing Capacity ）債券。", "anchor": "read/c七"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "clause", "title": "第八點 指數股票型基金（ETF）", "text": "指數股票型基金（ETF） 一般 ETF 以投資股票、債券為主且不具槓桿或放空效果者為限。透過全權委託投資業務事業運用專設帳簿資產時，符合條件可連結槓桿或放空 ETF：避險目的可連結放空 ETF，反向不超過一倍；風險管理目的、追蹤指數時可連結槓桿 ETF，正向不超過二倍。「高度相關」指以過去三個月以上全部交易歷史資料計算，相關係數達 70% 以上。 「避險反一倍、風管正二倍、相關七成、三個月」。  投資型保險商品連結本辦法第十四條第一項但書所稱於國內、外證券交易市場交易之指數股票型基金，除第二項另有規定外，以投資股票、債券為主且不具槓桿或放空效果者為限。 保險人依本辦法第五條第一項第二款委託經主管機關核准經營或兼營全權委託投資業務之事業代為運用與管理專設帳簿之資產，符合下列規定者，得連結具槓桿或放空效果之指數股票型基金： （一）為避險目的者，得連結具放空效果之指數股票型基金，且以反向不超過一倍為限。保險人應要求全權委託投資業務事業於交易分析敘明與相對應標的具高度相關性，且持有避險效果部位之淨資產價值不得超過持有相對應標的與加計槓桿效果後之淨資產價值總和。 （二）為風險管理目的者，於全權委託投資帳戶追蹤指數時，得為貼近指數報酬連結具槓桿效果之指數股票型基金，且以正向不超過二倍為限。保險人應要求全權委託投資業務事業於交易分析敘明全權委託投資帳戶存在績效劣於追蹤指數之事實，及運用具槓桿效果之指數股票型基金之預期效益，且與相對應標的具高度相關性。 前項所稱具高度相關性，指以過去三個月以上之全部交易歷史資料為樣本計算，具槓桿或放空效果之指數股票型基金與相對應標的價格變動率或報酬率相關係數達百分之七十以上。保險人應確認全權委託投資業務事業已建立從事具槓桿或放空效果之指數股票型基金交易後，持續評估避險或風險管理有效性之機制。 第一項所稱國外證券交易市場交易之指數股票型基金，應於證券商受託買賣外國有價證券管理規則第五條第一項所定之外國證券交易所交易。", "anchor": "read/c八"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "clause", "title": "第八之一點 有約定到期日的債券型基金", "text": "有約定到期日的債券型基金 有約定到期日的債券型基金：所投資債券要達附表五評等，且投資於附表五所列該一定評級的總金額不得超過基金淨資產價值 40%；存續期間增加的投資也適用。 「附表五、四成」。  投資型保險商品連結之投資標的為本辦法第十四條第一項證券投資信託基金受益憑證中屬債券型基金且有約定到期日者，該基金所投資公債、國庫券之發行國家主權評等，或公債、國庫券以外債券之債務發行評等，應符合附表五所列信用評等機構評等達一定等級以上，且投資於附表五所列該一定評級之投資總金額不得超過該基金淨資產價值之百分之四十。 前項之規定，於有約定到期日債券型基金存續期間所增加之投資，亦適用之。", "anchor": "read/c八之一"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "clause", "title": "第八之二點 高風險基金的投資比例", "text": "高風險基金的投資比例 透過全權委託投資事業運用時：非投資等級債券達基金淨資產價值 60% 以上的基金，與新興市場國家債券達 60% 以上的基金，合計不超過 20%，其中非投資等級債券基金不超過 10%。其他投資型保險商品連結的標的，不得涉及這兩類基金。 「六成債券：合計二成、非投資等級一成」。  投資型保險商品連結之投資標的為本辦法第十四條第一項證券投資信託基金受益憑證、境外基金或國外證券交易市場交易之指數股票型基金者，應依下列規定辦理： （一）保險人依本辦法第五條第一項第二款委託經主管機關核准經營或兼營全權委託投資業務之事業代為運用與管理專設帳簿之資產者，投資於下列基金之金額，合計投資比例上限不超過百分之二十，且其中連結第一目之基金之投資比例上限不超過百分之十： 1.非投資等級債券總金額（或成分權重）達基金淨資產價值（或標的指數成分權重）百分之六十以上之基金。 2.新興市場國家債券總金額（或成分權重）達基金淨資產價值（或標的指數成分權重）百分之六十以上之基金。 （二）前款以外之投資型保險商品連結之投資標的，不得涉及前款各目基金。", "anchor": "read/c八之二"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "clause", "title": "第九點 事後評估與通知要保人", "text": "事後評估與通知要保人 保險人要事後定期評估連結標的信用風險：國內結構型商品、金融債券、公司債、浮動利率中期債券若遭調降評等達附表五所列等級（含）以下，保險人要在事實發生日起 3 日內通知要保人。 「調降到附表五以下：三日內通知」。  保險人應事後定期評估第三點所列投資型保險商品連結投資標的之信用風險，並應依下列規定辦理： （一）國內結構型商品之發行評等、發行機構或保證機構長期債務信用評等，如有遭信用評等機構調降評等達附表五所列等級（含）以下之情事者，保險人應於事實發生之日起三日內通知要保人。 （二）金融債券、公司債及浮動利率中期債券之債務發行評等，如有遭信用評等機構調降評等達附表五所列等級（含）以下之情事者，保險人應於事實發生之日起三日內通知要保人。", "anchor": "read/c九"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "clause", "title": "第十點 匯率避險的貨幣衍生商品交易範圍", "text": "匯率避險的貨幣衍生商品交易範圍 只適用保險人委託全權委託投資業者運用專設帳簿資產的情形。交易範圍：期貨商可受託的貨幣相關期貨、選擇權、期貨選擇權契約；與專設帳簿資產有關的貨幣間遠期外匯、換匯、換匯換利及其他匯率避險交易。「匯率避險目的」要同時符合：被避險項目已存在且可明確辨認；避險商品能降低其匯率風險並被指定為該項目的避險；連結標的與被避險項目不同時，要書面指定並證明高度相關（過去三個月以上全部交易資料，相關係數達 70% 以上）。保險人還要確認業者建立持續評估避險有效性的機制。 「已存在、可降低、高度相關七成」 這是「避險」不是「投機」：被避險項目必須先存在。 十、保險人依本辦法第五條第一項第二款委託經主管機關核准經營或兼營全權委託投資業務之事業代為運用與管理專設帳簿之資產者，其為匯率避險目的，從事與專設帳簿資產有關之貨幣相關衍生性金融商品交易，其交易範圍應符合下列規定： （一）經本會依期貨交易法第五條公告期貨商得受託從事交易與貨幣相關之期貨契約、選擇權契約及期貨選擇權契約。 （二）與專設帳簿資產有關之貨幣間之遠期外匯交易、換匯交易、換匯換利交易及其他匯率避險交易。 前項匯率避險目的之交易，指符合下列條件之交易： （一）被避險項目已存在並使專設帳簿資產暴露於損失之匯率風險中，且可明確辨認。 （二）避險衍生性金融商品可降低被避險項目之匯率風險，並被指定作為該項目之避險。 （三）執行避險交易時，若避險衍生性金融商品連結標的與被避險項目不同者，應於正式書面文件中指定避險衍生性金融商品連結標的與被避險項目，且證明避險衍生性金融商品之連結標的或其商品組合與被避險項目間存在高度相關性。 前項高度相關性，指以過去三個月以上之全部交易歷史資料為樣本計算，避險衍生性金融商品之連結標的或其商品組合與被避險項目價格變動率或報酬率相關係數達百分之七十以上。 保險人應確認全權委託投資業務事業已建立從事貨幣相關衍生性金融商品交易後，持續評估避險有效性之機制。", "anchor": "read/c十"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "clause", "title": "第十一點 匯率避險衍生商品的金額上限", "text": "匯率避險衍生商品的金額上限 為匯率避險的衍生性金融商品，契約總名目價值合計不得超過被避險項目的總帳面價值；若因市場波動超限，受託機構在事實發生日起 3 個營業日內處置後符合規定，則不在此限。 「名目價值不超過帳面價值；三個營業日」。  第十點衍生性金融商品交易之契約總（名目）價值，合計不得超過被避險項目之總帳面價值。但因市場波動因素導致投資金額有逾上開額度情形，且受託機構於事實發生之日起三個營業日內採取適當處置後，已符合投資額度規定者，不在此限。", "anchor": "read/c十一"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "clause", "title": "第十二點 匯率避險衍生商品的交易對手", "text": "匯率避險衍生商品的交易對手 除臺灣期貨交易所的期貨契約（及經核准與國外交易所合作、於國外交易所上市的期貨契約）外，交易對手要是：資本比率符合法定標準的本國金融機構；或最近一年長期債務信評經 Moody's、S&P 或 Fitch 評定達 BBB+ 或相當等級以上的外國金融機構。 「本國符合法定標準；外國 BBB+」  十二、第十點衍生性金融商品交易除臺灣期貨交易所股份有限公司交易之期貨交易契約，及該公司經本會核准與國外交易所簽署合作協議，於該國外交易所上市之期貨交易契約外，其交易對手應符合下列規定： （一）最近一期自有資本與風險性資產之比率、自有資本適足比率、調整後淨資本額占期貨交易人未沖銷部位所需之客戶保證金總額比例，符合法定標準之本國金融機構。 （二）最近一年長期債務信用評等等級經Moody’s Investors Service、Standard & Poor’s Corp.或Fitch Ratings Ltd.評定達BBB+級或相當等級以上之外國金融機構。", "anchor": "read/c十二"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "clause", "title": "第十三點 信用風險評估與破產應變", "text": "信用風險評估與破產應變 保險人要建立投資標的及其發行、保證、經理機構的信用風險評估機制與分散準則，並訂定發行或經理機構破產時的緊急應變及追償作業程序。 「發行、保證、經理」三種機構。  保險人應確實建立投資標的與該標的發行、保證或經理機構之信用風險評估機制及分散準則，並應依本辦法第九條第二項規定訂定投資標的發行或經理機構破產之緊急應變及追償作業程序。", "anchor": "read/c十三"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "table", "title": "評等要求對應哪一張附表（第二、三、八之一、九點）", "text": "評等要求對應哪一張附表（第二、三、八之一、九點） 標的 適用附表 保管機構（第二點） 附表一 公債、國庫券：發行國家主權評等（第三點第一款） 附表二 國內機構發行的金融債券、公司債、浮動利率中期債券（第三點第二款第1目） 附表三 國外機構發行的金融債券、公司債、浮動利率中期債券（第三點第二款第2目） 附表一；且發行或保證機構須在境內設有分公司或子公司 國內結構型商品（第三點第三款） 附表三 房利美、房地美、吉利美的不動產抵押債權證券（第三點第四款） 附表四 有約定到期日的債券型基金；調降評等通知（第八點之一、第九點） 附表五", "anchor": "table/t0"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "table", "title": "槓桿與放空 ETF（第八點）", "text": "槓桿與放空 ETF（第八點） 目的 可連結 上限 避險 具放空效果的 ETF 反向不超過一倍 風險管理（全權委託帳戶追蹤指數時） 具槓桿效果的 ETF 正向不超過二倍 高度相關性定義 過去三個月以上全部交易歷史資料，價格變動率或報酬率相關係數 達 70% 以上", "anchor": "table/t1"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "table", "title": "數字與期限", "text": "數字與期限 項目 規定 點次 債券型基金（有到期日）投資於附表五該評級 不超過基金淨資產價值 40% 八之一 高風險基金合計比例（全權委託） 不超過 20%，其中非投資等級債券基金不超過 10% 八之二 調降評等通知要保人 事實發生日起 3 日內 九 匯率避險衍生商品超限處置 事實發生日起 3 個營業日內 十一 結構型商品到期保本率 至少 100% 六", "anchor": "table/t2"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "table", "title": "國內結構型商品「不得連結」（第六點第三款，八項）", "text": "國內結構型商品「不得連結」（第六點第三款，八項） 款 不得連結 1 新臺幣匯率指標 2 新臺幣利率指標（新臺幣計價之結構型商品除外） 3 本國企業於國外發行之有價證券 4 國內證券投資信託事業於國外發行之受益憑證 5 國內外機構編製之臺股指數及其相關金融商品（有例外） 6 未經核准或申報生效得募集及銷售之境外基金 7 國內外私募之有價證券 8 股權、利率、匯率、基金、商品、相關指數及指數型基金以外之衍生性金融商品（ETF 有條件）", "anchor": "table/t3"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "card", "title": "保管機構的評等看哪一張附表？", "text": "保管機構的評等看哪一張附表？ 附表一。", "anchor": "cards"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "card", "title": "公債、國庫券看什麼評等？看哪張附表？", "text": "公債、國庫券看什麼評等？看哪張附表？ 發行國家的主權評等；附表二。", "anchor": "cards"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "card", "title": "國內結構型商品沒有商品發行評等時怎麼辦？", "text": "國內結構型商品沒有商品發行評等時怎麼辦？ 以國內發行機構或保證機構的長期債務信用評等替代。", "anchor": "cards"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "card", "title": "國外機構發行的金融債券、公司債，除評等外還有什麼要求？", "text": "國外機構發行的金融債券、公司債，除評等外還有什麼要求？ 發行機構或保證機構要在中華民國境內設有境外結構型商品管理規則第6條所定的分公司或子公司。", "anchor": "cards"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "card", "title": "投資型保險商品連結的標的，不得涉有哪三類情事？", "text": "投資型保險商品連結的標的，不得涉有哪三類情事？ 私募基金受益憑證或其他國內外私募有價證券；追蹤指數逾越主管機關公告範圍的國外指數型基金（ETF 除外）；保險人利害關係人發行的金融債券、公司債、結構型商品。", "anchor": "cards"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "card", "title": "國內結構型商品的到期保本率？", "text": "國內結構型商品的到期保本率？ 至少為原計價貨幣本金的 100%，且不得含目標贖回式設計與發行機構得提前贖回的選擇權。", "anchor": "cards"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "card", "title": "國內結構型商品的計價幣別？", "text": "國內結構型商品的計價幣別？ 以新臺幣、人民幣及境外結構型商品管理規則第18條第2款所定計價幣別為限。", "anchor": "cards"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "card", "title": "連結國外債券要在哪裡買賣？有什麼限制？", "text": "連結國外債券要在哪裡買賣？有什麼限制？ 要在國內證券市場上櫃買賣，且不得僅限銷售專業投資人；不得投資本國企業赴國外發行的債券，也不得投資 TLAC 債券。", "anchor": "cards"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "card", "title": "一般 ETF 的限制？", "text": "一般 ETF 的限制？ 以投資股票、債券為主且不具槓桿或放空效果者為限。", "anchor": "cards"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "card", "title": "避險目的的放空 ETF，上限？", "text": "避險目的的放空 ETF，上限？ 反向不超過一倍。", "anchor": "cards"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "card", "title": "風險管理目的的槓桿 ETF，上限？", "text": "風險管理目的的槓桿 ETF，上限？ 正向不超過二倍。", "anchor": "cards"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "card", "title": "「高度相關性」的定義？", "text": "「高度相關性」的定義？ 以過去三個月以上的全部交易歷史資料計算，相關係數達 70% 以上。", "anchor": "cards"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "card", "title": "有約定到期日的債券型基金，投資於附表五該評級的上限？", "text": "有約定到期日的債券型基金，投資於附表五該評級的上限？ 基金淨資產價值的 40%。", "anchor": "cards"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "card", "title": "非投資等級債券基金與新興市場債券基金（60% 以上），合計上限？", "text": "非投資等級債券基金與新興市場債券基金（60% 以上），合計上限？ 合計不超過 20%，其中非投資等級債券基金不超過 10%。", "anchor": "cards"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "card", "title": "連結標的被調降評等達附表五所列等級（含）以下，要怎麼處理？", "text": "連結標的被調降評等達附表五所列等級（含）以下，要怎麼處理？ 保險人於事實發生之日起 3 日內通知要保人。", "anchor": "cards"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "card", "title": "匯率避險衍生商品契約總名目價值的上限？", "text": "匯率避險衍生商品契約總名目價值的上限？ 不超過被避險項目的總帳面價值；超限時受託機構於事實發生日起 3 個營業日內處置。", "anchor": "cards"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "card", "title": "保險人要建立哪些與信用風險有關的機制？", "text": "保險人要建立哪些與信用風險有關的機制？ 投資標的與其發行、保證或經理機構的信用風險評估機制及分散準則，以及發行或經理機構破產的緊急應變及追償作業程序。", "anchor": "cards"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "card", "title": "投資型保險為匯率避險而交易貨幣衍生商品，「匯率避險目的」要符合哪些條件？", "text": "投資型保險為匯率避險而交易貨幣衍生商品，「匯率避險目的」要符合哪些條件？ 被避險項目已存在且可明確辨認；避險商品可降低其匯率風險並被指定為該項目的避險；連結標的與被避險項目不同時，需書面指定並證明高度相關。", "anchor": "cards"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "card", "title": "匯率避險的「高度相關性」怎麼算？", "text": "匯率避險的「高度相關性」怎麼算？ 以過去三個月以上的全部交易歷史資料，價格變動率或報酬率相關係數達 70% 以上。", "anchor": "cards"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "card", "title": "匯率避險衍生商品交易，外國金融機構交易對手的評等條件？", "text": "匯率避險衍生商品交易，外國金融機構交易對手的評等條件？ 最近一年長期債務信評經 Moody's、S&P 或 Fitch 評定達 BBB+ 或相當等級以上（本國金融機構則要資本比率符合法定標準）。", "anchor": "cards"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "scen", "title": "某投資型保險連結的金融債券，被信評機構調降評等達附表五所列等級以下。依第九點，保險人應？", "text": "某投資型保險連結的金融債券，被信評機構調降評等達附表五所列等級以下。依第九點，保險人應？ 事實發生日起 3 日內通知要保人 事實發生日起 30 日內通知要保人 年底彙總通知 不需要通知 第九點：應於事實發生之日起三日內通知要保人。", "anchor": "quiz"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "scen", "title": "某國內結構型商品的到期保本率只有 90%，且含發行機構得提前贖回的選擇權。依第六點，可以連結嗎？", "text": "某國內結構型商品的到期保本率只有 90%，且含發行機構得提前贖回的選擇權。依第六點，可以連結嗎？ 可以 不可以，保本率至少 100%，且不得含目標贖回與提前贖回選擇權 只要揭露風險就可以 只要保證機構評等夠就可以 第六點第六款：到期保本率至少為原計價貨幣本金百分之一百，且不得含有目標贖回式設計及發行機構得提前贖回之選擇權。", "anchor": "quiz"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "scen", "title": "投資型保險想連結一檔證券投資信託事業以私募方式發行的基金受益憑證。依第五點？", "text": "投資型保險想連結一檔證券投資信託事業以私募方式發行的基金受益憑證。依第五點？ 可以 不可以，不得連結私募基金受益憑證或其他國內外私募有價證券 須向壽險公會報備 可以，但比例不超過 5% 第五點第（一）款：不得連結或運用於證券投資信託事業以私募方式發行的基金受益憑證，或其他國內外私募的有價證券。", "anchor": "quiz"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "scen", "title": "保險人透過全權委託投資事業運用專設帳簿，為避險目的想連結放空 ETF。依第八點，上限是？", "text": "保險人透過全權委託投資事業運用專設帳簿，為避險目的想連結放空 ETF。依第八點，上限是？ 反向不超過一倍 反向不超過二倍 正向不超過二倍 沒有上限 第八點第二項第一款：為避險目的者，得連結具放空效果的 ETF，且以反向不超過一倍為限。正向不超過二倍是風險管理目的的槓桿 ETF。", "anchor": "quiz"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "scen", "title": "「槓桿 ETF 與相對應標的具高度相關性」，依第八點的定義，是指？", "text": "「槓桿 ETF 與相對應標的具高度相關性」，依第八點的定義，是指？ 過去一年全部資料，相關係數達 50% 過去三個月以上全部交易歷史資料，相關係數達 70% 以上 過去三個月以上的部分資料，相關係數達 80% 過去一週，相關係數達 70% 第八點第三項：以過去三個月以上之全部交易歷史資料為樣本計算，相關係數達百分之七十以上。", "anchor": "quiz"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "scen", "title": "某有約定到期日的債券型基金，投資於附表五所列某一評級的債券。依第八點之一，該評級的投資總金額上限？", "text": "某有約定到期日的債券型基金，投資於附表五所列某一評級的債券。依第八點之一，該評級的投資總金額上限？ 基金淨資產價值 10% 基金淨資產價值 20% 基金淨資產價值 40% 基金淨資產價值 60% 第八點之一：投資於附表五所列該一定評級之投資總金額不得超過該基金淨資產價值之百分之四十。", "anchor": "quiz"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "scen", "title": "全權委託的專設帳簿，投資於非投資等級債券達淨資產 60% 以上的基金與新興市場債券達 60% 以上的基金。依第八點之二，上限是？", "text": "全權委託的專設帳簿，投資於非投資等級債券達淨資產 60% 以上的基金與新興市場債券達 60% 以上的基金。依第八點之二，上限是？ 合計 10%，其中非投資等級 5% 合計 20%，其中非投資等級 10% 合計 40%，其中非投資等級 20% 沒有限制 第八點之二第（一）款：合計不超過百分之二十，且其中非投資等級債券基金不超過百分之十。", "anchor": "quiz"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "scen", "title": "匯率避險用的衍生性金融商品，其契約總名目價值依第十一點，上限是？", "text": "匯率避險用的衍生性金融商品，其契約總名目價值依第十一點，上限是？ 被避險項目帳面價值的 50% 不超過被避險項目的總帳面價值 專設帳簿資產的 10% 沒有上限 第十一點：契約總（名目）價值合計不得超過被避險項目之總帳面價值；因市場波動超限者，受託機構三個營業日內處置後符合規定可不在此限。", "anchor": "quiz"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "scen", "title": "國內結構型商品沒有商品發行評等時，依第三點，評等怎麼認定？", "text": "國內結構型商品沒有商品發行評等時，依第三點，評等怎麼認定？ 視為不合格 以國內發行機構或保證機構的長期債務信用評等替代 由壽險公會認定 以保管機構評等替代 第三點第（三）款但書：無法取得商品發行評等者，以國內發行機構或保證機構之長期債務信用評等等級替代。", "anchor": "quiz"}, {"file": "ch08.html", "chTitle": "第8章 投資型保險專設帳簿保管機構及投資標的應注意事項", "type": "scen", "title": "依注意事項第十點，認定「匯率避險目的」的貨幣衍生商品交易，下列何者「不符合」？", "text": "依注意事項第十點，認定「匯率避險目的」的貨幣衍生商品交易，下列何者「不符合」？ 被避險項目已存在且可明確辨認 避險商品可降低被避險項目的匯率風險 連結標的與被避險項目間相關係數達 70% 以上 先買進衍生商品，之後再找可避險的標的 第十點第2項第1款：被避險項目必須已存在並使專設帳簿資產暴露於匯率風險；不能先交易再找標的。", "anchor": "quiz"}, {"file": "ch09.html", "chTitle": "第9章 銷售應注意事項（風險、費用、適合度）", "type": "clause", "title": "第三點 收付幣別與款項收付方式（匯率風險說明書的基礎）", "text": "收付幣別與款項收付方式（匯率風險說明書的基礎） 保險費、保險給付、費用及其他款項，約定以外幣收付，不得約定新臺幣與外幣或各幣別間相互變換；款項收付要事先約定走外匯存款戶存撥（生存保險金抵繳同幣別保單保費且受益人與要保人同一人的例外）。 全外幣、走外匯存款戶。 這是匯率風險說明書（範本）開頭那段話的法源。 訂立以外幣收付之非投資型人身保險契約時，保險人與要保人得約定保險費、保險給付、費用及其他款項收付之外幣幣別。但不得約定新臺幣與外幣或各幣別間之相互變換。 前項保險費、保險給付、費用及其他款項之收付，保險人應與要保人事先約定收付以外匯存款戶存撥之。但保險人與要保人約定，於其他外幣保險契約所定生存保險金應給付日當日，以該生存保險金，抵繳相同幣別外幣保險契約之保險費，且該生存保險金之受益人，與所抵繳保險契約之要保人為同一人者，不在此限。", "anchor": "read/c三"}, {"file": "ch09.html", "chTitle": "第9章 銷售應注意事項（風險、費用、適合度）", "type": "clause", "title": "第七點 要保書及保單條款要載明的三件事", "text": "要保書及保單條款要載明的三件事 送審時，要保書與保單條款要載明：保險費收取方式、匯款費用之負擔、匯率風險揭露。 「收、付、險」。 本頁只收錄這一點的送審規定；其他送審文件在第六章。 人身保險業送審該等保險商品時，除應依保險商品銷售前程序作業準則等規定檢附相關送審文件外，應併檢附該等保險商品各項交易之會計處理方式說明、外幣資產負債配置具體計畫及執行方法，及外幣資產區隔之方式。並應於要保書及保單條款載明保險費收取方式、匯款費用之負擔及匯率風險揭露等相關事宜。", "anchor": "read/c七"}, {"file": "ch09.html", "chTitle": "第9章 銷售應注意事項（風險、費用、適合度）", "type": "clause", "title": "第八點 招攬時揭露、匯率風險說明書、適合度", "text": "招攬時揭露、匯率風險說明書、適合度 招攬時要在要保書及商品簡介明顯處揭露保險費收取方式、匯款費用負擔、匯率風險、幣別所屬國家政經變動風險；提供匯率風險說明書（最近十年最高、平均、最低三種情境）並由要保人與業務員共同簽確認；每年至少一次揭露折合新臺幣的參考價值；銷售前要瞭解要保人需求與承受匯率風險能力，並建立商品適合度政策。 「要保書四揭露、說明書三情境、每年一次、適合度」。 這一點的完整原文與業務員資格訓練要求，在第六章。說明書的更新時間、法律地位，見下方三則公函說明。 人身保險業辦理本業務，除應落實招攬人員管理、商品資訊揭露及商品適合度政策外，並應遵循下列事項： （一）銷售該等保險商品之業務員應通過中華民國人壽保險商業同業公會所舉辦之特別測驗，並完成資格登錄；登錄後，各人身保險業每年應為其舉辦至少一小時之匯率風險及外匯相關法規在職教育訓練課程，當年度未參加或未通過訓練者，應暫停授權其次一年度招攬該等保險商品。各人身保險業如開放保險代理人或業務往來保險經紀人從事本業務之招攬者，亦應自行參照前開原則研訂相關規範，並要求保險代理人或業務往來保險經紀人落實執行。 （二）銷售該等保險商品時，應於招攬時揭露及說明下列事項，並由要保人及業務員於要保書及匯率風險說明書共同具簽確認： 1.應於要保書及商品簡介明顯處揭露保險費收取方式、匯款費用之負擔及商品所涉匯率風險及商品幣別所屬國家之政治、經濟變動風險等。 2.應提供匯率風險說明書，且應採該保險商品收付幣別最近十年內之最高、平均及最低等三種匯率情境，以視覺化方式就死亡保險給付、簽訂保險契約時收取之保險費，分別於三種匯率情境下折合新臺幣計算之金額，以及其匯兌損益之差額舉例說明。 （三）應至少每年一次向要保人揭露該等保險商品當年度解約金、死亡保險金額及生存保險金額等給付項目折合新臺幣計算後之參考價值。其提供方式由保險人與要保人約定之。 （四）應瞭解要保人之需求與承受匯率風險能力，銷售該等保險商品前並應建立商品適合度政策。 前項第二款第二目之匯率風險說明書，由中華民國人壽保險商業同業公會擬訂範本報主管機關備查。", "anchor": "read/c八"}, {"file": "ch09.html", "chTitle": "第9章 銷售應注意事項（風險、費用、適合度）", "type": "clause", "title": "第九點 客戶適合度規範", "text": "客戶適合度規範 除央行及主管機關規定外，要遵循精算學會的外幣保險商品精算實務處理準則，以及壽險公會的客戶適合度規範。 適合度規範在「壽險公會」。 客戶適合度調查評估表的內容由壽險公會規範，本頁未收錄。 人身保險業經營本業務，除應依中央銀行及主管機關相關規定辦理外，並應遵循中華民國精算學會所訂外幣保險商品精算實務處理準則及中華民國人壽保險商業同業公會所訂客戶適合度規範。", "anchor": "read/c九"}, {"file": "ch09.html", "chTitle": "第9章 銷售應注意事項（風險、費用、適合度）", "type": "clause", "title": "函 二 匯率風險說明書的圖示要完整", "text": "匯率風險說明書的圖示要完整 匯率風險說明書裡「各幣別匯率與匯兌損益」的圖示，三種情境都要標出：情境一、情境二（無匯兌損益）、情境三；橫軸 t-1～t-10 要列明定義。 「三情境都要標：一、二（無損益）、三」 三種情境是最近十年的最高、平均、最低匯率（見第六章第八點）。 二、有關旨揭匯率風險說明書應修正內容如下： （一）關於各幣別之匯率與匯兌損益圖示舉例部分，係以紅框標示情境一及情境三，惟尚缺情境二（無匯兌損益），請將情境二標註於圖示中，以資完整。 （二）另前開圖示之左右縱軸已分別標示「匯率」及「匯兌損益」，惟橫軸部分（t-1～t-10）未列明定義，請一併修正。", "anchor": "read/c函 二"}, {"file": "ch09.html", "chTitle": "第9章 銷售應注意事項（風險、費用、適合度）", "type": "clause", "title": "函 三 每年 3 月 1 日前更新；說明書的法律地位", "text": "每年 3 月 1 日前更新；說明書的法律地位 各保險公司要把說明書的匯率情境每年更新一次，最遲每年 3 月 1 日前完成。說明書不是要保書的一部分，但是保險契約的一部分；要保人審閱並親自簽章確認後，保險公司與要保人各執一份，保險公司併同要保書留存備查。 「三月一日前更新；非要保書、是契約的一部分；雙方各執一份」 易混淆：說明書「不是要保書的一部分」，但「是保險契約構成之一部分」。 三、有關旨揭配套措施應修正內容如下： （一）各保險公司應就匯率風險說明書之匯率情境每年更新一次，更新時點至遲應於每年3 月1 日前完成更新。 （二）匯率風險說明書非為要保書之一部分，但為保險契約構成之一部分，經要保人審閱並親自簽章確認瞭解所載內容後，應由保險公司及要保人雙方各執一份，保險公司應併同要保書留存備查。", "anchor": "read/c函 三"}, {"file": "ch09.html", "chTitle": "第9章 銷售應注意事項（風險、費用、適合度）", "type": "clause", "title": "函 四 招攬階段就要提供並當面解說", "text": "招攬階段就要提供並當面解說 為了讓消費者有充分時間理解，公司要在「招攬階段」就把說明書給消費者看，並由消費者親自簽章確認；招攬的業務員要當面解說清楚。  重點是「招攬階段就提供」，不是簽約當天才給。 四、為使消費者有充分時間理解匯率風險說明書內容，各公司應於招攬階段即提供該說明書予消費者參閱及親自簽章確認，並由招攬之業務員當面解說清楚，俾減少事後糾紛之產生。", "anchor": "read/c函 四"}, {"file": "ch09.html", "chTitle": "第9章 銷售應注意事項（風險、費用、適合度）", "type": "table", "title": "匯兌方向速查", "text": "匯兌方向速查 匯率（新臺幣兌 1 美元）變化 新臺幣 美元 對領美元再換回新臺幣的人 33 → 31 升值 貶值 換回的新臺幣變少（匯兌損失） 30 → 32 貶值 升值 換回的新臺幣變多（匯兌利益）", "anchor": "table/t0"}, {"file": "ch09.html", "chTitle": "第9章 銷售應注意事項（風險、費用、適合度）", "type": "table", "title": "匯率風險說明書的時間與地位", "text": "匯率風險說明書的時間與地位 項目 規定 出處 匯率情境更新 每年一次，最遲每年 3 月 1 日前 函（110年）說明三（一） 說明書的法律地位 非要保書的一部分，是保險契約構成之一部分 函說明三（二） 保存 保險公司與要保人各執一份；保險公司併同要保書留存 函說明三（二） 何時提供 招攬階段就提供，要保人親自簽章，業務員當面解說 函說明四 三種情境 最近十年最高、平均、最低 第六章第八點", "anchor": "table/t1"}, {"file": "ch09.html", "chTitle": "第9章 銷售應注意事項（風險、費用、適合度）", "type": "card", "title": "新臺幣由 33 變為 31，代表什麼？", "text": "新臺幣由 33 變為 31，代表什麼？ 1 美元只能換 31 元新臺幣：新臺幣升值、美元貶值。", "anchor": "cards"}, {"file": "ch09.html", "chTitle": "第9章 銷售應注意事項（風險、費用、適合度）", "type": "card", "title": "簽約時 1 美元＝31 元新臺幣，領死亡保險金時變成 30 元，受益人把美元換成新臺幣，結果？", "text": "簽約時 1 美元＝31 元新臺幣，領死亡保險金時變成 30 元，受益人把美元換成新臺幣，結果？ 換回的新臺幣變少，是匯兌損失。例如 10 萬美元少換 10 萬元新臺幣。", "anchor": "cards"}, {"file": "ch09.html", "chTitle": "第9章 銷售應注意事項（風險、費用、適合度）", "type": "card", "title": "匯率風險說明書的匯率情境，多久更新一次？", "text": "匯率風險說明書的匯率情境，多久更新一次？ 每年一次，最遲每年 3 月 1 日前完成。", "anchor": "cards"}, {"file": "ch09.html", "chTitle": "第9章 銷售應注意事項（風險、費用、適合度）", "type": "card", "title": "匯率風險說明書是不是要保書的一部分？", "text": "匯率風險說明書是不是要保書的一部分？ 不是要保書的一部分，但是保險契約構成之一部分；經要保人審閱並親自簽章後，雙方各執一份。", "anchor": "cards"}, {"file": "ch09.html", "chTitle": "第9章 銷售應注意事項（風險、費用、適合度）", "type": "card", "title": "匯率風險說明書要在哪個階段提供？誰解說？", "text": "匯率風險說明書要在哪個階段提供？誰解說？ 招攬階段就提供給消費者並由其親自簽章確認；由招攬的業務員當面解說清楚。", "anchor": "cards"}, {"file": "ch09.html", "chTitle": "第9章 銷售應注意事項（風險、費用、適合度）", "type": "scen", "title": "依第七點，外幣非投資型保險商品的要保書及保單條款，要載明下列哪一組事項？", "text": "依第七點，外幣非投資型保險商品的要保書及保單條款，要載明下列哪一組事項？ 保險費收取方式、匯款費用之負擔、匯率風險揭露 客戶適合度、匯款費用之負擔、保險費收取方式 匯率風險揭露、外幣資產區隔方式、會計處理方式 保險費收取方式、資產負債配置、匯率風險揭露 第七點第二項：應於要保書及保單條款載明保險費收取方式、匯款費用之負擔及匯率風險揭露等相關事宜。客戶適合度、資產區隔、會計處理等不在這一句裡。", "anchor": "quiz"}, {"file": "ch09.html", "chTitle": "第9章 銷售應注意事項（風險、費用、適合度）", "type": "scen", "title": "業務員招攬外幣非投資型保險時，依第八點，要在要保書及商品簡介的哪裡揭露風險與費用事項？",
