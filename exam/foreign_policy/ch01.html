<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>第一章 壽險基本概念與保險法重點</title><style>:root{--bg:#f7f6f2;--card:#fff;--ink:#222;--sub:#666;--line:#e3e0d8;--brand:#1f5f8b;--brand2:#e8f1f7;--ok:#2e7d32;--okbg:#e8f5e9;--bad:#b3261e;--badbg:#fdecea;--warn:#8a5a00;--warnbg:#fff4de}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
a{color:var(--brand)}
header{background:var(--brand);color:#fff;padding:12px 16px 14px}

header h1{margin:4px 0 0;font-size:20px;line-height:1.4}

.wrap{max-width:900px;margin:0 auto;padding:0 12px 60px}
.banner{background:var(--warnbg);color:var(--warn);border:1px solid #f0d9a8;border-radius:8px;padding:10px 12px;margin:12px 0;font-size:14px}

section{display:none;padding-top:14px}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 12px}
.card h3{margin:0 0 6px;font-size:17px}
.no{display:inline-block;background:var(--brand);color:#fff;border-radius:6px;padding:0 8px;margin-right:8px;font-size:14px}
.lab{display:inline-block;font-size:12px;border-radius:4px;padding:0 6px;margin-right:6px;vertical-align:1px}
.lab.fact{background:#e3f2e5;color:#1b5e20}.lab.my{background:#e8eaf6;color:#283593}.lab.hint{background:var(--warnbg);color:var(--warn)}
.mn{background:var(--brand2);border-radius:8px;padding:8px 10px;margin:8px 0}
details{margin:8px 0}details summary{cursor:pointer;color:var(--brand);font-size:15px}
.off{border-left:3px solid var(--brand);padding:2px 0 2px 10px;margin:8px 0;font-size:15px;color:#333}.off p{margin:4px 0}

th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}th{background:var(--brand2)}
.tw{overflow-x:auto;margin-bottom:16px}
.fc{min-height:210px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.fc .q{font-size:19px;font-weight:600}.fc .a{font-size:16px;text-align:left;margin-top:8px}.fc small{color:var(--sub)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.btn{border:1px solid var(--brand);background:#fff;color:var(--brand);border-radius:8px;padding:9px 16px;font-size:16px;cursor:pointer}
.btn.pri{background:var(--brand);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0}.bar>i{display:block;height:100%;background:var(--ok)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;margin:6px 0;font-size:16px;cursor:pointer}
.opt.right{background:var(--okbg);border-color:var(--ok)}.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.why{display:none;background:var(--brand2);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:15px}
.stat{color:var(--sub);font-size:14px}
footer{color:var(--sub);font-size:13px;margin-top:24px}
.pager{display:flex;justify-content:space-between;gap:8px;margin-top:18px}.pager a{flex:1;text-align:center;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px;text-decoration:none;font-size:14px}

mark{background:#fff0a8;padding:0 1px}
.search{display:flex;gap:8px;margin:14px 0 6px}.search input{flex:1;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.res{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0;display:block;text-decoration:none;color:var(--ink)}
.res small{color:var(--sub)}.res b{color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.ch{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-decoration:none;color:var(--ink);display:block}
.ch:hover{border-color:var(--brand)}.ch h3{margin:0 0 4px;font-size:16px;color:var(--brand)}.ch p{margin:4px 0;font-size:14px}
.chip{display:inline-block;background:var(--brand2);color:#134;border-radius:999px;padding:0 9px;margin:2px 3px 2px 0;font-size:12.5px}
.filter{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.filter button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer}.filter button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
h2{font-size:18px;margin:24px 0 8px}

.pw{margin:6px 0}.pw p{margin:4px 0}.pl{margin:6px 0 6px 0;padding-left:20px}.pl li{margin:5px 0;line-height:1.7}.pl ul{margin:4px 0;padding-left:18px;list-style:disc}.pl ul li{margin:2px 0}.pl>li>b{color:#283593}
table.ft{font-size:14px;table-layout:fixed}table.ft td:first-child,table.ft th:first-child{font-weight:600;width:34%;word-break:break-all}table.ft td,table.ft th{word-break:break-word;padding:6px 7px}table.ft th{width:auto}

{"t": "本章收錄方式", "d": "保險法第13、119、123、124、135-1、138、143-4、145、146-3、146-4、146-6條與死亡給付比率規範全文，已逐字比對官方文字。標示「概念整理」的項目沒有官方原文，是題庫的概念，已改寫成自己的話。"}], "clauses": [{"no": "保險原則", "title": "保險三大原則（概念整理）", "official": [], "plain": "大數法則：個人何時死亡不可知，但全體人口每年各年齡的死亡人數、比率大致穩定，所以保險公司可以預估。公平的危險分攤：依性別、年齡別、死亡率收保費，風險高的人保費較高。收支相等原則：全體保戶繳入的保費總額，與公司給付給全體受益人的保險金總額，相等計算。", "mnemonic": "「大數、公平、收支相等」", "tip": "三個原則的名稱常被互換：「依年齡性別死亡率收費」是公平的危險分攤，「保費總額＝保險金總額」是收支相等。"}, {"no": "13", "title": "保險法｜保險怎麼分類", "official": ["保險分為財產保險及人身保險。", "財產保險，包括火災保險、海上保險、陸空保險、責任保險、保證保險及經主管機關核准之其他保險。", "人身保險，包括人壽保險、健康保險、傷害保險及年金保險。"], "plain": "保險分為財產保險與人身保險兩大類。財產保險有火災、海上、陸空、責任、保證保險及經核准的其他保險；人身保險有人壽、健康、傷害、年金四種。責任保險是財產保險，不是人身保險。", "mnemonic": "「財產：火海陸責保；人身：壽健傷年」", "tip": "題目常問「人身保險包括哪些」，選項會混入責任保險。"}, {"no": "壽險種類", "title": "壽險、萬能、養老、投資型（概念整理）", "official": [], "plain": "依保險事故，壽險分生存保險、死亡保險、生死合險三種（主管機關的商品審查注意事項也用這三種名稱）。萬能保險：保費扣除附加費用後，依宣告利率計算保單價值。養老保險：定期保險＋生存保險，口訣「定存」。投資型保險：結合保險與投資，基本性質仍是保險，受保險法規規範。依期間，保險分定期保險與終身保險。", "mnemonic": "「養老＝定期＋生存（定存）」", "tip": "「生死合險」是死亡或屆滿仍生存都給付；單純死亡保險只給身故。"}, {"no": "年金分類", "title": "年金保險怎麼分（概念整理）", "official": [], "plain": "年金保險人在被保險人生存期間或特定期間內，依契約一次或分期給付一定金額（保險法第135-1條）。分類方式：依給付始期分即期、遞延；依給付方式分終身年金、定期生存年金、附保證期間年金、附保證金額年金；依受領人數分個人、多數受領人、團體；多數受領人又分連生共存、最後生存者、連生遺族年金。", "mnemonic": "", "tip": "不要把「定期生存年金」放進「多數受領人年金」的分類裡，兩者是不同的分類軸。"}, {"no": "計算基礎", "title": "外幣保險的保險費計算基礎（題庫重點）", "official": [], "plain": "外幣收付非投資型保險，保險費由哪些「率」算出來，題庫愛考。人壽保險看死亡率和營業費用率；年金保險看危險發生率和附加費用率；利率變動型年金再多一個宣告利率。", "mnemonic": "「人壽：利、死、營；年金：利、險、附；利變年金：年金三項＋宣告」", "tip": "最常見的陷阱是把人壽和年金的用詞互換：人壽沒有「附加費用率」、年金沒有「營業費用率」。來源：題庫練習題；官方的利率變動型年金保險費率相關規範有用到預定利率、宣告利率、預定死亡率等符號，可部分佐證，但這份分類清單本身我沒有找到官方逐字條文。", "facts": {"head": ["商品", "保險費的計算基礎", "怎麼記"], "rows": [["傳統型人壽保險", "預定利率、預定死亡率、預定營業費用率", "人壽＝死亡率＋營業費用率"], ["傳統型年金保險", "預定利率、預定危險發生率、預定附加費用率", "年金＝危險發生率＋附加費用率"], ["利率變動型年金保險", "預定利率、預定危險發生率、預定附加費用率、宣告利率", "年金三項，再加宣告利率（共四項）"]]}}, {"no": "利變年金", "title": "利率變動型年金保險重點（題庫重點）", "official": [], "plain": "利率變動型年金：累積期間依宣告利率累積，開始給付時用累積的金額換算年金。重點是宣告利率和預定利率的關係。", "mnemonic": "「給付期間預定利率：不高於宣告利率、不為負」", "tip": "題庫選項常把「不得」拿掉，改成「得高於」或「得為負數」，看到就是錯的。", "facts": {"head": ["項目", "規定（依題庫）"], "rows": [["年金累積期間", "保費扣除附加費用後，依宣告利率計算年金保單價值準備金；責任準備金以年金保單價值準備金全額提存"], ["年金給付開始時", "依年金保單價值準備金計算年金金額，這類商品稱為「利率變動型年金保險」"], ["給付期間的預定利率", "不得高於年金給付開始日當月之宣告利率，且不得為負數"], ["乙型給付期間的年金金額", "與宣告利率、年金生命表、預定利率有關（和預定附加費用率無關）"]]}}, {"no": "準備金方式", "title": "責任準備金提存方式（題庫考的是舊辦法用語）", "official": [], "plain": "這些是題庫練習題考的提存方式。注意：保險業各種準備金提存辦法已在 2025/4/25 大幅修正，現行辦法全文已找不到「二十年繳費終身保險修正制」「平衡準備金制」「一年定期修正制」等用語，所以作答依題庫，對客戶說明就不要引用成現行規定。", "mnemonic": "「看到保證利率選萬能」", "tip": "「變更責任準備金提存方式，應事先經主管機關核准」這句，金管會110年8月24日令（彙整經驗生命表、準備金利率與提存方式）也有同樣的規定。", "facts": {"head": ["情形", "提存方式（依題庫）"], "rows": [["保險期間超過一年的人壽保險（95/1/1 起訂定，純保險費較二十年繳費終身保險大者）", "採二十年繳費終身保險修正制"], ["生存保險（按一定期間給付的生存保險金部分）、年金保險", "最低責任準備金以平衡準備金制為原則"], ["利率變動型人壽保險", "最低責任準備金由主管機關另定"], ["保險期間超過一年的健康保險", "一年定期修正制（特殊性質者另定）"], ["94/6/2 起簽發的利率變動型年金，年金累積期間", "以年金保單價值準備金全額提存"], ["利率變動型年金累積期間附有保證利率", "保證利率期間，比照萬能保險的責任準備金規範"], ["外幣收付的非投資型人身保險", "費率與準備金提存，比照新臺幣收付的非投資型商品"], ["變更責任準備金提存方式", "應事先經主管機關核准"]]}}, {"no": "135-1", "title": "保險法｜年金保險的定義", "official": ["年金保險人於被保險人生存期間或特定期間內，依照契約負一次或分期給付一定金額之責。"], "plain": "年金保險是：保險人在被保險人生存期間或特定期間內，依照契約一次或分期給付一定金額。", "mnemonic": "", "tip": ""}, {"no": "119", "title": "保險法｜解約金", "official": ["要保人終止保險契約，而保險費已付足一年以上者，保險人應於接到通知後一個月內償付解約金；其金額不得少於要保人應得保單價值準備金之四分之三。", "償付解約金之條件及金額，應載明於保險契約。"], "plain": "要保人終止契約、而且保險費已付足一年以上，保險人要在接到通知後一個月內給付解約金；金額不得少於要保人應得保單價值準備金的四分之三。解約金的條件與金額，要寫在保險契約裡。", "mnemonic": "「付足一年、一個月內、不少於四分之三」", "tip": "是「不得少於」四分之三，不是「得少於」。"}, {"no": "123", "title": "保險法｜破產時的保護", "official": ["保險人破產時，受益人對於保險人得請求之保險金額之債權，以其保單價值準備金按訂約時之保險費率比例計算之。要保人破產時，保險契約訂有受益人者，仍為受益人之利益而存在。", "投資型保險契約之投資資產，非各該投資型保險之受益人不得主張，亦不得請求扣押或行使其他權利。"], "plain": "保險人破產時，受益人對保險人的債權，按保單價值準備金依訂約時的保險費率比例計算。要保人破產時，契約訂有受益人的，仍為受益人的利益而存在。投資型保險契約的投資資產，只有該投資型保險的受益人可以主張，別人不能請求扣押或行使其他權利。", "mnemonic": "", "tip": ""}, {"no": "124", "title": "保險法｜優先受償", "official": ["人壽保險之要保人、被保險人、受益人，對於被保險人之保單價值準備金，有優先受償之權。"], "plain": "人壽保險的要保人、被保險人、受益人，對被保險人的保單價值準備金，有優先受償的權利。", "mnemonic": "", "tip": ""}, {"no": "138", "title": "保險法｜兼營與外匯業務", "official": ["財產保險業經營財產保險，人身保險業經營人身保險，同一保險業不得兼營財產保險及人身保險業務。但財產保險業經主管機關核准經營傷害保險及健康保險者，不在此限。", "財產保險業依前項但書規定經營傷害保險及健康保險業務應具備之條件、業務範圍、申請核准應檢附之文件及其他應遵行事項之辦法，由主管機關定之。", "保險業不得兼營本法規定以外之業務。但經主管機關核准辦理其他與保險有關業務者，不在此限。", "保險業辦理前項與保險有關業務，涉及外匯業務之經營者，須經中央銀行之許可。", "保險合作社不得經營非社員之業務。"], "plain": "財產保險業只能做財產保險、人身保險業只能做人身保險，同一家保險業不得兼營；但財產保險業經核准，可以經營傷害保險及健康保險。保險業不得兼營保險法以外的業務，但經核准辦理其他與保險有關業務者除外；這類業務涉及外匯業務，要經中央銀行許可。", "mnemonic": "「財產不兼人身；外匯要央行許可」", "tip": "題庫第46題問「何者不正確」，常見做法是把條文的「不得」改成「得」、把「傷害保險」換成「人身保險」、把「外匯業務」換成「結匯業務」。", "facts": {"head": ["條文說的", "易錯寫法（題庫常出）"], "rows": [["同一保險業不得兼營財產保險及人身保險；例外：財產保險業經核准，可經營「傷害保險及健康保險」", "寫成「得兼營」、或例外寫成「人身保險及健康保險」都錯"], ["保險業不得兼營保險法以外的業務；經核准辦理其他與保險有關業務者除外", "寫成「得兼營」就錯"], ["辦理與保險有關業務，涉及「外匯業務」之經營者，須經「中央銀行」許可", "寫成「結匯業務」就錯"], ["保險合作社「不得」經營非社員之業務", "寫成「得經營」就錯"]]}}, {"no": "145", "title": "保險法｜準備金的提存", "official": ["保險業於營業年度屆滿時，應分別保險種類，計算其應提存之各種準備金，記載於特設之帳簿。", "前項所稱各種準備金之提存比率、計算方式及其他應遵行事項之辦法，由主管機關定之。"], "plain": "保險業營業年度屆滿時，要分保險種類計算應提存的各種準備金，記載於特設的帳簿；提存比率、計算方式等，由主管機關訂辦法（保險業各種準備金提存辦法）。", "mnemonic": "", "tip": ""}, {"no": "146-3", "title": "保險法｜放款限制", "official": ["保險業辦理放款，以下列各款為限：", "一、銀行或主管機關認可之信用保證機構提供保證之放款。", "二、以動產或不動產為擔保之放款。", "三、以合於第一百四十六條之一之有價證券為質之放款。", "四、人壽保險業以各該保險業所簽發之人壽保險單為質之放款。", "前項第一款至第三款放款，每一單位放款金額不得超過該保險業資金百分之五；其放款總額，不得超過該保險業資金百分之三十五。", "保險業依第一項第一款、第二款及第三款對其負責人、職員或主要股東，或對與其負責人或辦理授信之職員有利害關係者，所為之擔保放款，應有十足擔保，其條件不得優於其他同類放款對象，如放款達主管機關規定金額以上者，並應經三分之二以上董事之出席及出席董事四分之三以上同意；其利害關係人之範圍、限額、放款總餘額及其他應遵行事項之辦法，由主管機關定之。", "保險業依第一百四十六條之一第一項第三款及第四款對每一公司有價證券之投資與依第一項第三款以該公司發行之有價證券為質之放款，合併計算不得超過其資金百分之十及該發行有價證券之公司業主權益百分之十。"], "plain": "保險業放款只限四種：有銀行或信用保證機構保證的、以動產或不動產為擔保的、以合格有價證券為質的、人壽保險業以自己簽發的保單為質的（保單質借）。前三種：每一單位放款不得超過資金 5%，放款總額不得超過資金 35%。", "mnemonic": "「單一 5%、總額 35%」", "tip": "保單質借（第四款）不在這個 5%、35% 限制裡。"}, {"no": "146-4", "title": "保險法｜國外投資範圍與上限", "official": ["保險業資金辦理國外投資，以下列各款為限：", "一、外匯存款。", "二、國外有價證券。", "三、設立或投資國外保險公司、保險代理人公司、保險經紀人公司或其他經主管機關核准之保險相關事業。", "四、其他經主管機關核准之國外投資。", "保險業資金依前項規定辦理國外投資總額，由主管機關視各保險業之經營情況核定之，最高不得超過各該保險業資金百分之四十五。但下列金額不計入其國外投資限額：", "一、保險業經主管機關核准銷售以外幣收付之非投資型人身保險商品，並經核准不計入國外投資之金額。", "二、保險業依本法規定投資於國內證券市場上市或上櫃買賣之外幣計價股權或債券憑證之投資金額。", "三、保險業經主管機關核准設立或投資國外保險相關事業，並經核准不計入國外投資之金額。", "四、其他經主管機關核准之投資項目及金額。", "保險業資金辦理國外投資之投資規範、投資額度、審核及其他應遵行事項之辦法，由主管機關定之。主管機關並得視保險業之財務狀況、風險管理及法令遵循之情形就前項第二款之投資金額予以限制。"], "plain": "國外投資只限四種：外匯存款、國外有價證券、國外保險相關事業、其他經核准的國外投資。總額由主管機關視各公司經營情況核定，最高不得超過資金 45%。但四種金額不計入國外投資限額：經核准銷售外幣收付非投資型人身保險商品並核准不計入的金額、投資國內上市櫃外幣計價股權或債券憑證的金額、經核准設立或投資國外保險相關事業並核准不計入的金額、其他經核准的項目。", "mnemonic": "「最高 45%（資金）；四種可不計入」", "tip": "45% 是「資金」的 45%，不是業主權益。外幣保單的準備金運用額度另見第5章第15-1、15-2條。"}, {"no": "146-6", "title": "保險法｜投資保險相關事業", "official": ["保險業業主權益，超過第一百三十九條規定最低資本或基金最低額者，得經主管機關核准，投資保險相關事業所發行之股票，不受第一百四十六條之一第一項第三款及第三項規定之限制；其投資總額，最高不得超過該保險業業主權益。", "保險業依前項規定投資而與被投資公司具有控制與從屬關係者，其投資總額，最高不得超過該保險業業主權益百分之四十。", "保險業依第一項規定投資保險相關事業，其控制與從屬關係之範圍、投資申報方式及其他應遵行事項之辦法，由主管機關定之。"], "plain": "業主權益超過第139條所定最低資本或基金最低額者，經核准可投資保險相關事業發行的股票，投資總額最高不得超過業主權益；若與被投資公司有控制與從屬關係，總額最高不得超過業主權益 40%。", "mnemonic": "", "tip": ""}, {"no": "143-4", "title": "保險法｜資本適足與資本等級", "official": ["保險業自有資本與風險資本之比率及淨值比率，不得低於一定比率。", "保險業依自有資本與風險資本之比率及淨值比率，劃分為下列資本等級：", "一、資本適足。", "二、資本不足。", "三、資本顯著不足。", "四、資本嚴重不足。", "前項第四款所稱資本嚴重不足，指自有資本與風險資本之比率低於第一項所定一定比率之百分之二十五或保險業淨值低於零。", "第一項所定一定比率、淨值比率之計算、自有資本與風險資本之範圍、計算方法、管理、第二項資本等級之劃分及其他應遵行事項之辦法，由主管機關定之。"], "plain": "保險業的自有資本與風險資本比率、淨值比率不得低於一定比率；依此分四個資本等級：資本適足、不足、顯著不足、嚴重不足。資本嚴重不足＝比率低於一定比率的 25%，或淨值低於零。「一定比率」的數字由主管機關辦法訂定（保險業資本適足性管理辦法第5條：現行資本適足率 100%，舊制是 200%）。", "mnemonic": "「適足、不足、顯著不足、嚴重不足」", "tip": "第5章的「法定標準」就是這裡的資本適足標準。"}, {"no": "比率規範一、二", "title": "死亡給付比率規範｜目的與適用範圍", "official": ["一、為維持人壽保險商品之基本保險保障比重，藉以提高國人保險保障，特訂定本規範。", "二、本規範之適用範圍如下：", "（一）本規範生效日後所簽訂之人壽保險契約。", "（二）本規範生效日後申請將保險契約轉換為人壽保險契約者。", "有下列情形之一者，不適用前項規定：", "（一）小額終老保險。", "（二）分紅保險及利率變動型人壽保險選擇增額繳清保險部分。", "（三）傳統型人壽保險申請減額繳清保險或展期定期保險時。"], "plain": "目的：維持人壽保險商品的基本保障比重。適用：規範生效日後簽訂的人壽保險契約，以及生效日後申請把契約轉換為人壽保險的。不適用：小額終老保險；分紅保險及利率變動型人壽保險選擇增額繳清保險的部分；傳統型人壽保險申請減額繳清或展期定期保險時。", "mnemonic": "", "tip": ""}, {"no": "比率規範三", "title": "死亡給付比率規範｜名詞定義", "official": ["三、本規範用詞定義如下：", "（一）死亡給付：指人壽保險契約約定之身故保險金或喪葬費用保險金金額。", "（二）保單價值準備金：", "1.非投資型萬能人壽保險：指累積價值準備金，加計當時之淨保險費金額。淨保險費金額係指保險人已將要保人繳交保險費扣除附加費用，但尚未按宣告利率計息之金額。", "2.其它非投資型人壽保險：指人身保險業以計算保險契約簽單保險費之利率及危險發生率為基礎，並依主管機關規定方式計算之準備金。", "（三）保單帳戶價值：指投資型人壽保險契約所有連結投資標的之價值總和，加計當時之預定投資保費金額。預定投資保費金額係指保險人已將要保人所繳保險費扣除前置費用，但尚未實際配置於投資標的之金額。", "（四）比率：", "1.非投資型人壽保險：指死亡給付除以保單價值準備金之值。", "2.投資型人壽保險：指死亡給付除以保單帳戶價值之值。", "（五）到達年齡：指依被保險人之原始投保年齡，加上當時保單年度數，再減去一後所計得之年齡。"], "plain": "死亡給付＝身故保險金或喪葬費用保險金；非投資型壽險比率＝死亡給付 ÷ 保單價值準備金，投資型壽險比率＝死亡給付 ÷ 保單帳戶價值；到達年齡＝原始投保年齡＋當時保單年度數－1。", "mnemonic": "「到達年齡＝投保年齡＋保單年度－1」", "tip": "到達年齡是「減一」，不是加一。"}, {"no": "比率規範四", "title": "死亡給付比率規範｜各年齡最低比率", "official": ["四、人壽保險之比率應符合下列規定。但含人壽保險之綜合型保險商品前十年各年度之解約金不大於以年繳計算之累積實繳總保費或銷售對象為人身保險業財富管理客戶之保險商品者，不在此限：", "（一）被保險人之到達年齡在三十歲以下；其比率不得低於百分之一百九十。", "（二）被保險人之到達年齡在三十一歲以上、四十歲以下；其比率不得低於一百六十。", "（三）被保險人之到達年齡在四十一歲以上、五十歲以下；其比率不得低於百分之一百四十。", "（四）被保險人之到達年齡在五十一歲以上、六十歲以下；其比率不得低於百分之一百二十。", "（五）被保險人之到達年齡在六十一歲以上、七十歲以下；其比率不得低於百分之一百一十。", "（六）被保險人之到達年齡在七十一歲以上、九十歲以下；其比率不得低於百分之一百零二。", "（七）被保險人之到達年齡在九十一歲以上；其比率不得低於百分之一百。"], "plain": "依被保險人到達年齡：30 歲以下不得低於 190%；31–40 歲 160%；41–50 歲 140%；51–60 歲 120%；61–70 歲 110%；71–90 歲 102%；91 歲以上 100%。含人壽保險的綜合型商品，前十年各年度解約金不大於以年繳計算的累積實繳總保費，或銷售對象為財富管理客戶的商品，不適用。", "mnemonic": "「190、160、140、120、110、102、100」", "tip": "現行規範適用「全部人壽保險」，不再只限投資型。題庫提醒考題可能出舊制數字，新舊都要熟，見對照表。"}, {"no": "比率規範五、六", "title": "死亡給付比率規範｜何時符合、契約與招攬", "official": ["五、前點比率，非投資型人壽保險（不含萬能人壽保險）應於保險期間內全期符合；非投資型萬能人壽保險及投資型人壽保險應於要保人投保、每次繳交保險費及申請基本保額變更時符合，並重新計算各契約應符合之最低比率，並依下列繳費別判定：", "（一）定期定額繳費保件：於保險人列印保險費繳費通知單時重新計算，其含當次繳費後之比率，不得低於當時各該契約應符合之最低比率。", "（二）彈性繳費保件：於要保人每次繳交保險費時重新計算，其含當次繳費後之比率，不得低於當時各該契約應符合之最低比率。", "六、保險人應將人壽保險契約不符合最低比率時之保險費繳交限制及處理方式約定於契約條款，並應於招攬時向要保人妥為解說。"], "plain": "非投資型人壽保險（不含萬能）要在保險期間「全期」符合；萬能及投資型人壽保險在投保、每次繳費、申請基本保額變更時符合並重新計算。定期定額繳費在列印繳費通知單時重算；彈性繳費在每次繳費時重算。不符合最低比率時的保費繳交限制與處理方式，要寫在契約條款，並在招攬時向要保人解說。", "mnemonic": "", "tip": ""}, {"no": "舊比率規範四", "title": "舊規範（99 年）｜投資型人壽保險的最低比率", "official": ["四、投資型人壽保險死亡給付對保單帳戶價值之比率，應於要保人投保及每次繳交保險費時符合下列規定：", "（一）被保險人滿十五足歲且到達年齡在四十歲以下者，其比率不得低於百分之一百三十。", "（二）被保險人之到達年齡在四十一歲以上、七十歲以下者，其比率不得低於百分之一百十五。", "（三）被保險人之到達年齡在七十一歲以上者，其比率不得低於百分之一百零一。"], "plain": "舊規範只管投資型人壽保險：滿 15 足歲且到達年齡 40 歲以下不得低於 130%；41–70 歲 115%；71 歲以上 101%。", "mnemonic": "「130、115、101」", "tip": "這是金管會 99 年的舊規範，現行規範是上面的 108 年令（115 年 10 月 8 日修正）。"}], "tables": [{"title": "保險費計算基礎（外幣收付非投資型，題庫重點）", "head": ["商品", "保險費的計算基礎", "怎麼記"], "rows": [["傳統型人壽保險", "預定利率、預定死亡率、預定營業費用率", "人壽＝死亡率＋營業費用率"], ["傳統型年金保險", "預定利率、預定危險發生率、預定附加費用率", "年金＝危險發生率＋附加費用率"], ["利率變動型年金保險", "預定利率、預定危險發生率、預定附加費用率、宣告利率", "年金三項，再加宣告利率"], ["（對照）利變年金給付期間的預定利率", "不得高於給付開始日當月宣告利率，且不得為負數", "題庫選項常拿掉「不得」"]]}, {"title": "死亡給付對保單價值準備金（帳戶價值）最低比率：現行 vs 舊制", "head": ["到達年齡", "現行（全部人壽保險）", "舊規範（99年，僅投資型）"], "rows": [["30 歲以下", "190%", "15–40 歲：130%"], ["31–40 歲", "160%", "130%"], ["41–50 歲", "140%", "41–70 歲：115%"], ["51–60 歲", "120%", "115%"], ["61–70 歲", "110%", "115%"], ["71–90 歲", "102%", "71 歲以上：101%"], ["91 歲以上", "100%", "101%"]]}, {"title": "保險法的數字速查", "head": ["項目", "規定", "條文"], "rows": [["解約金", "保費付足一年以上；一個月內給付；不少於保單價值準備金 3/4", "第119條"], ["放款", "每一單位不超過資金 5%；總額不超過資金 35%", "第146-3條"], ["國外投資總額", "最高不超過資金 45%", "第146-4條"], ["投資保險相關事業", "總額不超過業主權益；有控制從屬關係者不超過業主權益 40%", "第146-6條"], ["資本嚴重不足", "比率低於一定比率的 25%，或淨值低於零", "第143-4條"]]}, {"title": "壽險經驗生命表（官方令整理）", "head": ["生命表", "用在哪裡／何時", "出處"], "rows": [["臺灣壽險業經驗生命表（第一回）", "64年2月5日起簽發的新契約費率與準備金", "110年8月24日令"], ["第二回", "74年1月1日起簽發的新契約費率與準備金", "110年8月24日令"], ["第三回", "78年9月1日起；計提準備金用到 92年12月31日；92年1月1日起新保單的費率生命表得自行決定", "110年8月24日令"], ["第四回", "93年1月1日至101年6月30日計提責任準備金", "110年8月24日令"], ["第六回", "110年7月1日起適用", "110年3月29日令"], ["第七回", "115年1月1日生效", "114年7月29日令"]]}, {"title": "跨章期限與頻率速查（皆已對照官方原文）", "head": ["項目", "規定", "章"], "rows": [["信評調降通知要保人", "事實發生日起 3 日內", "第8章"], ["保管機構（管理事業）變更申報", "變更後 15 個工作日內", "第7章"], ["法令變更通知要保人", "不低於 60 日", "第7章"], ["全委專設帳簿決算報告", "會計年度終了後 4 個月內", "第7章"], ["業務單位專案自行查核", "每半年（2026/2/5 起；舊為每季）", "第6章"], ["內部稽核單位專案查核", "每年", "第6章"], ["特定目的不動產投資事業收入匯回", "每年結算並經會計師簽證後 6 個月內", "第5章"], ["風險值回溯測試", "每月", "第5、6、7章"], ["書面紀錄、資料保存", "至少 5 年", "第5、7章"], ["匯率風險說明書情境更新", "每年，最遲 3 月 1 日前", "第9章"], ["投資政策與內部作業程序檢視", "每年", "第11章"]]}], "cards": [{"id": 0, "ref": "13", "front": "保險法將保險分為哪兩大類？", "back": "財產保險及人身保險。"}, {"id": 1, "ref": "13", "front": "保險法第13條，人身保險包括哪四種？", "back": "人壽保險、健康保險、傷害保險及年金保險。"}, {"id": 2, "ref": "13", "front": "保險法第13條，財產保險包括哪些？", "back": "火災保險、海上保險、陸空保險、責任保險、保證保險及經主管機關核准的其他保險。"}, {"id": 3, "ref": "保險原則", "front": "「依購買者性別、年齡別、死亡率來繳付保費」是什麼原則？", "back": "公平的危險分攤原則。"}, {"id": 4, "ref": "保險原則", "front": "「全體保戶繳入的保費總額＝公司付給全體受益人的保險金總額」是什麼原則？", "back": "收支相等原則。"}, {"id": 5, "ref": "135-1", "front": "年金保險的定義？", "back": "保險人於被保險人生存期間或特定期間內，依契約一次或分期給付一定金額。"}, {"id": 6, "ref": "119", "front": "要保人終止契約，解約金怎麼給？", "back": "保費付足一年以上；保險人接到通知後一個月內償付；金額不得少於要保人應得保單價值準備金的四分之三。"}, {"id": 7, "ref": "123", "front": "保險人破產時，受益人的債權怎麼計算？", "back": "以其保單價值準備金，按訂約時的保險費率比例計算。"}, {"id": 8, "ref": "124", "front": "誰對保單價值準備金有優先受償之權？", "back": "人壽保險的要保人、被保險人、受益人。"}, {"id": 9, "ref": "138", "front": "保險業辦理與保險有關的業務，涉及外匯業務，要經誰許可？", "back": "中央銀行。"}, {"id": 10, "ref": "145", "front": "各種準備金的提存比率、計算方式，由誰訂辦法？", "back": "主管機關（保險業各種準備金提存辦法）。"}, {"id": 11, "ref": "146-3", "front": "保險業放款只限哪四種？", "back": "銀行或信用保證機構保證的放款；動產或不動產擔保放款；合格有價證券為質的放款；人壽保險業以自己簽發的保單為質的放款。"}, {"id": 12, "ref": "146-3", "front": "放款的每單位與總額上限？", "back": "前三種：每一單位放款不超過資金 5%；放款總額不超過資金 35%。"}, {"id": 13, "ref": "146-4", "front": "保險法第146-4條的國外投資只限哪四種？", "back": "外匯存款、國外有價證券、設立或投資國外保險相關事業、其他經核准的國外投資。"}, {"id": 14, "ref": "146-4", "front": "國外投資總額最高上限？", "back": "不得超過各該保險業資金 45%。"}, {"id": 15, "ref": "146-4", "front": "哪些金額不計入國外投資限額？", "back": "核准銷售外幣收付非投資型人身保險商品並核准不計入的金額；投資國內上市櫃外幣計價股權或債券憑證的金額；核准設立或投資國外保險相關事業並核准不計入的金額；其他經核准的項目。"}, {"id": 16, "ref": "146-6", "front": "投資保險相關事業，與被投資公司有控制從屬關係時，總額上限？", "back": "不得超過保險業業主權益 40%。（一般情形最高不超過業主權益）"}, {"id": 17, "ref": "143-4", "front": "什麼是「資本嚴重不足」？", "back": "自有資本與風險資本比率低於一定比率的 25%，或保險業淨值低於零。"}, {"id": 18, "ref": "比率規範四", "front": "被保險人到達年齡 30 歲以下，死亡給付對保單價值準備金（帳戶價值）的最低比率？", "back": "不得低於 190%。"}, {"id": 19, "ref": "比率規範四", "front": "到達年齡 31–40、41–50、51–60 歲的最低比率？", "back": "160%、140%、120%。"}, {"id": 20, "ref": "比率規範四", "front": "到達年齡 61–70、71–90、91 歲以上的最低比率？", "back": "110%、102%、100%。"}, {"id": 21, "ref": "比率規範三", "front": "「到達年齡」怎麼算？", "back": "原始投保年齡，加上當時保單年度數，再減去一。"}, {"id": 22, "ref": "比率規範一、二", "front": "死亡給付比率規範「不適用」哪三種情形？", "back": "小額終老保險；分紅保險及利率變動型人壽保險選擇增額繳清保險部分；傳統型人壽保險申請減額繳清保險或展期定期保險時。"}, {"id": 23, "ref": "舊比率規範四", "front": "舊規範（99年）投資型人壽保險的最低比率？", "back": "到達年齡 40 歲以下 130%；41–70 歲 115%；71 歲以上 101%。"}, {"id": 24, "ref": "比率規範五、六", "front": "哪種人壽保險要在「保險期間內全期」符合最低比率？", "back": "非投資型人壽保險（不含萬能人壽保險）；萬能與投資型是在投保、每次繳費、申請基本保額變更時符合。"}, {"id": 25, "ref": "壽險種類", "front": "萬能保險怎麼計算保單價值？", "back": "保險費扣除附加費用後，依該保險費所適用的宣告利率計算。"}, {"id": 26, "ref": "壽險種類", "front": "養老保險是哪兩種保險的結合？", "back": "定期保險與生存保險（口訣：定存）。"}, {"id": 27, "ref": "計算基礎", "front": "外幣收付非投資型「人壽保險」的保險費計算基礎？", "back": "預定利率、預定死亡率、預定營業費用率。"}, {"id": 28, "ref": "計算基礎", "front": "外幣收付非投資型「年金保險」的保險費計算基礎？", "back": "預定利率、預定危險發生率、預定附加費用率。"}, {"id": 29, "ref": "計算基礎", "front": "外幣收付「利率變動型年金保險」的保險費計算基礎？", "back": "預定利率、預定危險發生率、預定附加費用率，再加宣告利率（共四項）。"}, {"id": 30, "ref": "計算基礎", "front": "人壽和年金的計算基礎，差在哪兩個「率」？", "back": "人壽用死亡率和營業費用率；年金用危險發生率和附加費用率。"}, {"id": 31, "ref": "利變年金", "front": "利率變動型年金保險，年金給付期間的預定利率有什麼限制？", "back": "不得高於年金給付開始日當月之宣告利率，且不得為負數。"}, {"id": 32, "ref": "利變年金", "front": "利率變動型年金乙型，給付期間的年金金額與哪些有關？", "back": "宣告利率、年金生命表、預定利率（和預定附加費用率無關）。"}, {"id": 33, "ref": "利變年金", "front": "累積期間依宣告利率計算年金保單價值準備金，開始給付時依它計算年金金額，這是什麼商品？", "back": "利率變動型年金保險。"}, {"id": 34, "ref": "準備金方式", "front": "94/6/2 起簽發的利率變動型年金，年金累積期間責任準備金怎麼提存？", "back": "以年金保單價值準備金全額提存。"}, {"id": 35, "ref": "準備金方式", "front": "利率變動型年金附保證利率，保證期間責任準備金比照什麼？", "back": "比照萬能保險的責任準備金規範（看到保證利率選萬能）。"}, {"id": 36, "ref": "準備金方式", "front": "外幣收付非投資型人身保險的費率與準備金提存，比照什麼？", "back": "比照以新臺幣收付的非投資型人身保險商品。"}, {"id": 37, "ref": "準備金方式", "front": "變更責任準備金的提存方式，要怎樣？", "back": "應事先經主管機關核准。"}, {"id": 38, "ref": "準備金方式", "front": "92/1/1 起新銷售的人壽保險，計算保險費率的生命表？", "back": "得自行決定（官方令）。"}, {"id": 39, "ref": "138", "front": "保險法第138條：同一保險業可以兼營財產保險和人身保險嗎？有例外嗎？", "back": "不可以。例外：財產保險業經主管機關核准，可經營傷害保險及健康保險。"}, {"id": 40, "ref": "138", "front": "保險法第138條：保險合作社可以經營非社員的業務嗎？", "back": "不得經營非社員之業務。"}, {"id": 41, "ref": "138", "front": "保險法第138條：保險業辦理與保險有關業務，涉及什麼業務，要經誰許可？", "back": "涉及外匯業務之經營者，須經中央銀行許可。"}, {"id": 42, "ref": "145", "front": "保險法第145條：準備金要分別依什麼計算？記載在哪裡？", "back": "依保險種類分別計算各種準備金，記載於特設之帳簿。"}], "scenarios": [{"ref": "13", "q": "依保險法第13條，人身保險包括下列哪些？A 人壽 B 責任 C 傷害 D 年金 E 健康", "opts": ["ABDE", "BCDE", "ABCD", "ACDE"], "ans": 3, "why": "第13條第3項：人壽、健康、傷害、年金。責任保險屬財產保險。"}, {"ref": "119", "q": "要保人終止契約，保險費已付足一年以上，依保險法第119條，解約金金額？", "opts": ["不得少於保單價值準備金的四分之三", "得少於保單價值準備金的四分之三", "不得少於已繳保費", "由保險公司自行決定"], "ans": 0, "why": "第119條：保險人於接到通知後一個月內償付解約金，其金額不得少於要保人應得保單價值準備金之四分之三。"}, {"ref": "146-4", "q": "依保險法第146-4條，保險業國外投資總額由主管機關核定，最高不得超過？", "opts": ["資金 35%", "資金 40%", "資金 45%", "業主權益 45%"], "ans": 2, "why": "第146-4條第2項：最高不得超過各該保險業資金百分之四十五。"}, {"ref": "比率規範四", "q": "被保險人投保時 35 歲、現在是第 3 保單年度，到達年齡是 37 歲。依現行死亡給付比率規範，最低比率是？", "opts": ["190%", "160%", "140%", "120%"], "ans": 1, "why": "到達年齡＝35＋3－1＝37，落在 31–40 歲，不得低於 160%。"}, {"ref": "比率規範一、二", "q": "下列哪一種保險，不適用死亡給付對保單價值準備金的最低比率規範？", "opts": ["定期壽險", "終身壽險", "小額終老保險", "投資型人壽保險"], "ans": 2, "why": "規範第二點：小額終老保險不適用。"}, {"ref": "146-3", "q": "依保險法第146-3條，保險業以動產或不動產為擔保的放款，每一單位放款金額與放款總額的上限？", "opts": ["資金 5%、35%", "資金 10%、35%", "資金 5%、45%", "業主權益 5%、35%"], "ans": 0, "why": "第146-3條第2項：每一單位不超過資金 5%，放款總額不超過資金 35%。"}, {"ref": "138", "q": "保險業辦理與保險有關的業務，涉及外匯業務，須經誰許可？", "opts": ["金管會", "中央銀行", "財政部", "壽險公會"], "ans": 1, "why": "保險法第138條第4項：涉及外匯業務之經營者，須經中央銀行之許可。"}, {"ref": "143-4", "q": "依保險法第143-4條，「資本嚴重不足」是指？", "opts": ["淨值低於資本", "自有資本與風險資本比率低於一定比率的 25%，或淨值低於零", "資本適足率低於 100%", "比率低於 200%"], "ans": 1, "why": "第143-4條第3項。"}, {"ref": "比率規範五、六", "q": "下列哪一種人壽保險，要在「保險期間內全期」符合最低比率？", "opts": ["非投資型萬能人壽保險", "投資型人壽保險", "非投資型人壽保險（不含萬能）", "以上皆是"], "ans": 2, "why": "規範第五點：非投資型（不含萬能）全期符合；萬能與投資型在投保、每次繳費、申請基本保額變更時符合。"}, {"ref": "保險原則", "q": "「依購買者性別、年齡別、死亡率來繳付保險費」，是哪一個原則？", "opts": ["大數法則", "收支相等原則", "公平的危險分攤原則", "最小損害原則"], "ans": 2, "why": "公平的危險分攤；收支相等是保費總額＝保險金總額。"}, {"ref": "計算基礎", "q": "以外幣收付之非投資型人壽保險，保險費的計算基礎為：A 預定死亡率 B 預定利率 C 預定危險發生率 D 預定營業費用率", "opts": ["ACD", "BCD", "ABC", "ABD"], "ans": 3, "why": "人壽：預定死亡率、預定利率、預定營業費用率（ABD）。危險發生率是年金用的。"}, {"ref": "計算基礎", "q": "以外幣收付之非投資型年金保險，保險費的計算基礎為：A 預定危險發生率 B 預定利率 C 預定營業費用率 D 預定附加費用率", "opts": ["BCD", "ABD", "ABC", "ACD"], "ans": 1, "why": "年金：預定危險發生率、預定利率、預定附加費用率（ABD）。營業費用率是人壽用的。"}, {"ref": "計算基礎", "q": "以外幣收付之利率變動型年金保險，保險費的計算基礎為：A 預定危險發生率 B 宣告利率 C 預定利率 D 預定附加費用率", "opts": ["ABCD", "ABC", "BCD", "ACD"], "ans": 0, "why": "年金三項再加宣告利率，共四項（ABCD）。"}, {"ref": "利變年金", "q": "利率變動型年金保險契約，年金給付期間之預定利率：", "opts": ["不得低於年金給付開始日當月之宣告利率", "不得高於年金給付開始日當月之宣告利率，但得為負數", "應高於年金給付開始日當月之宣告利率", "不得高於年金給付開始日當月之宣告利率，且不得為負數"], "ans": 3, "why": "不得高於宣告利率，且不得為負數。"}, {"ref": "利變年金", "q": "利率變動型年金乙型於給付期間，保戶可領取的年金金額與哪些有關？A 預定附加費用率 B 宣告利率 C 年金生命表 D 預定利率", "opts": ["ABC", "ACD", "BCD", "ABD"], "ans": 2, "why": "宣告利率、年金生命表、預定利率（BCD），和預定附加費用率無關。"}, {"ref": "138", "q": "有關保險法第138條的敘述，何者「不正確」？A 保險合作社得經營非社員之業務 B 同一保險業不得兼營財產保險及人身保險業務，財產保險業經核准經營人身保險及健康保險者，不在此限 C 保險業不得兼營保險法規定以外之業務 D 保險業辦理其他與保險有關業務，涉及結匯業務之經營者，須經中央銀行許可", "opts": ["ABD", "BCD", "BC", "AB"], "ans": 0, "why": "A 錯：保險合作社「不得」經營非社員之業務。B 錯：例外是「傷害保險及健康保險」，不是人身保險。D 錯：條文是「外匯業務」不是結匯業務。C 正確。"}, {"ref": "145", "q": "依保險法第145條，保險業於營業年度屆滿時，應分別依下列何者，計算其應提存之各種準備金？", "opts": ["保險期間", "繳費期間", "保險種類", "所繳保險費"], "ans": 2, "why": "第145條第1項：應分別保險種類，計算應提存之各種準備金，記載於特設之帳簿。"}], "chNo": "01", "summary": "保險法與壽險的基本盤：保險怎麼分類、解約金、國外投資與放款上限、資本等級，以及死亡給付最低比率與生命表沿革。後面各章的數字大多從這裡長出來。", "scope": "收錄保險法第13、119、123、124、135-1、138、143-4、145、146-3、146-4、146-6條與死亡給付比率規範全文；標示「概念整理」的項目為題庫概念。", "nav": {"prev": null, "next": {"file": "ch02.html", "label": "第2章 保險業辦理外匯業務管理辦法"}}}</script>
<script>const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>{t=String(t||'');const ss=t.split(/(?<=。)/).map(x=>x.trim()).filter(Boolean);if(t.length<=90||ss.length<2&&t.indexOf('；')<0)return '<p>'+esc(t)+'</p>';
  const li=s=>{s=s.replace(/。$/,'');const m=s.match(/^([^：；]{1,40})：(.+)$/);if(m&&m[2].split('；').length>=3)return '<li><b>'+esc(m[1])+'</b><ul>'+m[2].split('；').map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></li>';
    const parts=s.split('；');if(parts.length>=3)return '<li>'+parts.map(x=>esc(x)).join('<br>')+'</li>';return '<li>'+esc(s)+'</li>'};
  return '<ul class="pl">'+ss.map(li).join('')+'</ul>'};
const factsT=f=>f?'<div class="tw"><table class="ft"><thead><tr>'+f.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+f.rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'';
const lab=x=>/^[一二三四五六七八九十]+(之[一二三四五六七八九十]+)?$/.test(x)?'第'+x+'點':/^[0-9]+(-[0-9]+)?$/.test(x)?'第'+x+'條':x;
const mem={};
const store={get(k){try{const v=localStorage.getItem(k);return v===null?mem[k]:v}catch(e){return mem[k]}},set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const BOXKEY='twlife_boxes_v2';
let boxes={};try{boxes=JSON.parse(store.get(BOXKEY)||'{}')}catch(e){boxes={}}
const saveBoxes=()=>store.set(BOXKEY,JSON.stringify(boxes));
function Flash(root,getCards){
  let queue=[],cur=null,flipped=false;
  function build(){const cs=getCards();queue=shuffle(cs.filter(c=>(boxes[c.key]||0)<1)).sort((a,b)=>(boxes[a.key]||0)-(boxes[b.key]||0));flipped=false}
  function render(){
    const cs=getCards(),n=cs.length,done=cs.filter(c=>(boxes[c.key]||0)>=1).length;
    let h='<div class="stat">已熟練 '+done+' / '+n+' 張（答對 1 次視為熟練，進度存在這個瀏覽器）</div><div class="bar"><i style="width:'+(n?done/n*100:0)+'%"></i></div>';
    if(!n){root.innerHTML=h+'<div class="card"><p>沒有可用的閃卡。</p></div>';return}
    if(!queue.length){root.innerHTML=h+'<div class="card"><h3>全部熟練了</h3><p>可以去做情境題，或重設後再來一輪。</p></div><div class="row"><button class="btn" data-a="reset">重設進度</button></div>';return}
    cur=queue[0];
    h+='<div class="card fc" tabindex="0" role="button" data-a="flip"><small>'+(cur.tag?esc(cur.tag)+'｜':'')+esc(lab(cur.ref))+'｜剩 '+queue.length+' 張</small><div class="q">'+esc(cur.front)+'</div>'+(flipped?'<div class="a"><span class="lab fact">答案</span>'+esc(cur.back)+'</div>':'<small>點一下翻面</small>')+'</div>';
    if(flipped)h+='<div class="row"><button class="btn bad" data-a="no">還不熟</button><button class="btn ok" data-a="yes">會了</button></div>';
    h+='<div class="row"><button class="btn" data-a="reset">重設進度</button></div>';
    root.innerHTML=h;
  }
  root.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
    if(a==='flip'){flipped=!flipped;render()}
    else if(a==='reset'){if(confirm('確定要清除這些閃卡的進度？')){getCards().forEach(c=>delete boxes[c.key]);saveBoxes();build();render()}}
    else if(cur&&(a==='yes'||a==='no')){const ok=a==='yes';boxes[cur.key]=ok?Math.min(1,(boxes[cur.key]||0)+1):0;saveBoxes();queue.shift();if(!ok||boxes[cur.key]<1)queue.splice(queue.length?Math.max(1,Math.min(queue.length,ok?6:3)):0,0,cur);flipped=false;render()}});
  root.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.fc')){e.preventDefault();flipped=!flipped;render()}});
  return {refresh(){build();render()}};
}
function Quiz(root,getItems,perRound){
  let items=[],score=0,answered=0,done=false;
  function draw(){
    const perms=items.map(s=>shuffle(s.opts.map((_,k)=>k)));
    root.innerHTML='<div class="stat" id="sc"></div>'+items.map((s,i)=>'<div class="card" data-i="'+i+'"><b>'+(i+1)+'. </b><span class="lab my">'+(s.tag?esc(s.tag)+' ':'')+esc(lab(s.ref))+'</span>'+esc(s.q)+perms[i].map((k,pos)=>'<button class="opt" data-o="'+k+'">'+String.fromCharCode(65+pos)+'. '+esc(s.opts[k])+'</button>').join('')+'<div class="why"></div></div>').join('')+'<div id="qend"></div>';
    score=0;answered=0;upd();
  }
  function upd(){const el=$('#sc',root);if(el)el.textContent='已作答 '+answered+' / '+items.length+'，答對 '+score+' 題';
    if(perRound&&answered===items.length&&items.length){$('#qend',root).innerHTML='<div class="card"><h3>這一組：'+score+' / '+items.length+'</h3></div><div class="row"><button class="btn pri" data-a="again">再來一組</button></div>'}}
  function again(){const all=getItems();items=perRound?shuffle(all).slice(0,perRound):all;draw()}
  root.addEventListener('click',e=>{
    const ag=e.target.closest('[data-a="again"]');if(ag){again();window.scrollTo(0,root.offsetTop-60);return}
    const b=e.target.closest('.opt');if(!b)return;const box=b.closest('.card');if(box.dataset.done)return;
    const s=items[+box.dataset.i],j=+b.dataset.o;box.dataset.done=1;answered++;if(j===s.ans)score++;
    let right='';$$('.opt',box).forEach((x,pos)=>{const k=+x.dataset.o;if(k===s.ans){x.classList.add('right');right=String.fromCharCode(65+pos)}else if(k===j)x.classList.add('wrong')});
    const w=$('.why',box);w.style.display='block';w.innerHTML=(j===s.ans?'答對了。':'答錯了，正解是 '+right+'。')+esc(s.why);upd()});
  return {refresh:again};
}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const LAWS=D.laws;
$('#h1').textContent=D.chapter+'｜'+D.title;
$('#intro').textContent=D.summary||'';
document.title=D.chapter+' '+D.title;
$('#foot').innerHTML='官方來源：'+LAWS.map(L=>esc(L.name)+'（'+esc(L.amended)+(L.kind==='press'?'發布':'修正')+'）<a href="'+esc(L.url)+'" target="_blank" rel="noopener">'+esc(L.url)+'</a>').join('<br>')+(D.scope?'<br>'+esc(D.scope):'')+'<br>條文原文取自官方網頁；「白話」「口訣」「情境題」為編寫者整理，不是法條。法規可能再修正，請以官方最新公告為準；本內容不是法律或投資意見。';
const TABS=[['read','條文速讀'],['table','對照表'],['cards','閃卡'],['quiz','情境題']];
const nav=$('#nav');
TABS.forEach(([id,name])=>{const b=document.createElement('button');b.textContent=name;b.setAttribute('role','tab');b.dataset.id=id;b.onclick=()=>show(id);nav.appendChild(b)});
let curTab='read';
function show(id,anchor){curTab=id;TABS.forEach(([t])=>$('#s-'+t).classList.toggle('on',t===id));$$('button',nav).forEach(b=>b.setAttribute('aria-selected',b.dataset.id===id));
  history.replaceState(null,'','#'+id+(anchor?'/'+anchor:''));
  if(anchor){const el=document.getElementById(anchor);if(el){const d=el.querySelector('details');el.scrollIntoView({block:'start'});el.classList.add('hl')}}else window.scrollTo(0,0)}
$('#s-read').innerHTML=(D.alerts||[]).map(a=>'<div class="banner"><b>'+esc(a.t)+'</b>'+esc(a.d)+'</div>').join('')+D.clauses.map(c=>{
  const off=c.official.map(p=>'<p>'+esc(p)+'</p>').join('');
  return '<div class="card" id="c'+esc(c.no)+'"><h3><span class="no">'+esc(lab(c.no))+'</span>'+esc(c.title)+'</h3>'
   +'<div class="pw"><span class="lab my">白話</span>'+fmt(c.plain)+'</div>'+factsT(c.facts)
   +(c.mnemonic?'<div class="mn"><span class="lab my">口訣</span>'+esc(c.mnemonic)+'</div>':'')
   +(c.tip?'<p><span class="lab hint">提醒</span>'+esc(c.tip)+'</p>':'')
   +(c.official.length?'<details><summary>展開官方條文原文</summary><div class="off"><span class="lab fact">原文</span>'+off+'</div></details>':'')+'</div>'}).join('');
$('#s-table').innerHTML=D.tables.map((t,i)=>'<h3 id="t'+i+'">'+esc(t.title)+'</h3><div class="tw"><table><thead><tr>'+t.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+t.rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>').join('');
const cardsAll=D.cards.map(c=>({key:'ch'+D.chNo+':'+c.id,ref:c.ref,front:c.front,back:c.back}));
const fl=Flash($('#s-cards'),()=>cardsAll);fl.refresh();
const qz=Quiz($('#s-quiz'),()=>D.scenarios,0);qz.refresh();
// 上下章
const N=D.nav||{};
function setLink(el,o,dir){if(o){el.href=o.file;el.textContent=dir==='p'?'← '+o.label:o.label+' →'}else{el.style.visibility='hidden'}}
setLink($('#prev'),N.prev,'p');setLink($('#next'),N.next,'n');
// 左右滑動：換分頁，到頭就換章
function step(d){const i=TABS.findIndex(t=>t[0]===curTab)+d;
  if(i<0){if(N.prev)location.href=N.prev.file+'#read';return}
  if(i>=TABS.length){if(N.next)location.href=N.next.file+'#read';return}
  show(TABS[i][0])}
let sx=0,sy=0,skip=false;
document.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;const el=e.target&&e.target.nodeType===1?e.target:(e.target&&e.target.parentElement);skip=!!(el&&el.closest('.tw,nav,input,.off'))},{passive:true});
document.addEventListener('touchend',e=>{if(skip)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>70&&Math.abs(dy)<45){step(dx<0?1:-1)}},{passive:true});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1)});
// 深層連結
function route(){const h=(location.hash||'#read').slice(1).split('/');show(TABS.some(t=>t[0]===h[0])?h[0]:'read',h[1]?decodeURIComponent(h[1]):null)}
window.addEventListener('hashchange',route);route();
</script></body></html>
