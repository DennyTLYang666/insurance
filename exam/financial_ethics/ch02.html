<script id="data" type="application/json">{"chapter": "第二章", "title": "廣告、適合度、說明揭露三個辦法：待客的具體做法", "laws": [{"pcode": "G0380227", "name": "金融服務業從事廣告業務招攬及營業促銷活動辦法", "amended": "民國114年6月30日", "url": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380227", "source": "法務部全國法規資料庫（經 kong0107/mojLawSplitJSON 公開鏡像取得，鏡像更新日 20261016）", "retrieved": "2026-11-03", "mirrorDate": "20250630"}, {"pcode": "G0380229", "name": "金融服務業確保金融商品或服務適合金融消費者辦法", "amended": "民國114年6月30日", "url": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380229", "source": "法務部全國法規資料庫（經 kong0107/mojLawSplitJSON 公開鏡像取得，鏡像更新日 20261016）", "retrieved": "2026-11-03", "mirrorDate": "20250630"}, {"pcode": "G0380228", "name": "金融服務業提供金融商品或服務前說明契約重要內容及揭露風險辦法", "amended": "民國114年6月30日", "url": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380228", "source": "法務部全國法規資料庫（經 kong0107/mojLawSplitJSON 公開鏡像取得，鏡像更新日 20261016）", "retrieved": "2026-11-03", "mirrorDate": "20250630"}], "alerts": [{"t": "這章是上一章第8、9、10條的細則", "d": "廣告辦法對應第8條，適合度辦法對應第9條，說明揭露辦法對應第10條。考試和實務上最常被問的是：什麼廣告話術不行、保險業要了解客戶什麼、說明時要說哪些事。"}, {"t": "後果的提醒（風險）", "d": "違反廣告、適合度、說明揭露規定，依金融消費者保護法第30-1條，公司最高可被罰1,000萬元。業務員個人的招攬行為另有業務員管理規則等處分（見第三章）。"}, {"t": "新近修正", "d": "三個辦法都在民國114年6月30日修正發布，114年9月15日起施行。適合度辦法本次修正第1、12條並增訂第11-1、11-2條（融資租賃業相關）；廣告辦法與說明揭露辦法是修正發布全文，與舊版逐條差異我沒有比對，考前如果用的是舊版教材或舊題庫，請以本頁收錄的現行條文為準。本頁只收錄與保險、證券、銀行業務員相關的條文，融資租賃業專屬條文未收錄。"}], "clauses": [{"title": "什麼算廣告、業務招攬與營業促銷", "plain": "以促進業務為目的，利用傳播媒體、宣傳工具或方式，就業務傳遞、宣傳、推廣、招攬或促銷。包括：印刷刊物、宣傳單、簡報、投資說明書、保險建議書、電視電話簡訊、看板、公開網路與電子郵件、現場說明會等。", "mnemonic": "只要是為了促進業務的宣傳，連簡報和建議書都算。", "tip": "私人社群貼文或影片，只要是為了促進業務、且涉及公共領域，也可能被認定是廣告。", "official": ["本辦法所稱廣告、業務招攬及營業促銷活動，指以促進業務為目的，利用下列傳播媒體、宣傳工具或方式，就業務及相關事務為傳遞、散布、宣傳、推廣、招攬或促銷者：", "一、報紙、雜誌、期刊或其他出版印刷刊物。", "二、宣傳單、海報、廣告稿、新聞稿、信函、簡報、投資說明書、保險建議書、公開說明書、貼紙、日（月）曆、電話簿或其他印刷物。", "三、電視、電影、電話、電腦、傳真、手機簡訊、廣播、廣播電臺、幻燈片、跑馬燈或其他通訊傳播媒體。", "四、看板、布條、招牌、牌坊、公車或其他交通工具上之廣告或其他任何形式之靜止或活動之工具與設施。", "五、與公共領域相關之網際網路、電子看板、電子郵件、電子視訊、電子語音或其他電子通訊傳播設備。", "六、舉辦現場講習會、座談會、說明會、現場展示會或其他公開活動。", "七、其他任何形式之廣告宣傳、業務招攬及營業促銷活動。"], "has_official": true, "no": "廣3"}, {"title": "廣告的四大原則", "plain": "廣告、招攬、促銷要依社會一般道德、誠實信用及保護金融消費者的精神：一、內容真實、避免誤導，義務不得低於廣告內容與招攬時提示的資料；二、利率、費用、報酬、風險要以衡平且顯著的方式表達；三、用中文並力求淺顯，必要時附註原文；四、以金融服務業名義為之。", "mnemonic": "真實不誤導、風險顯著、中文淺顯、公司名義。", "tip": "『以金融服務業名義為之』：業務員不能用個人名義發出看似公司立場的宣傳。", "facts": {"head": ["原則", "重點"], "rows": [["一", "內容真實，義務不得低於廣告內容與招攬時提示的資料"], ["二", "涉及利率、費用、報酬、風險，要衡平且顯著"], ["三", "用中文，力求淺顯易懂，必要時附註原文"], ["四", "以金融服務業名義為之"]]}, "official": ["金融服務業從事廣告、業務招攬及營業促銷活動，應依社會一般道德、誠實信用原則及保護金融消費者之精神，遵守下列原則：", "一、應致力充實金融消費資訊及確保內容之真實，避免誤導金融消費者，對金融消費者所負擔義務不得低於廣告之內容及進行業務招攬或營業促銷活動時所提示之資料或說明。", "二、對金融商品或服務內容之揭露如涉及利率、費用、報酬及風險時，應以衡平及顯著之方式表達。", "三、應以中文表達並力求淺顯易懂，必要時得附註原文。", "四、應以金融服務業名義為之。", "經主管機關依本法公告為金融服務業之融資租賃業（以下簡稱融資租賃業）依前項第二款辦理時，對利率之表示，應以年利率為之；對金融消費者應付總費用之表示，應以年百分率為之。"], "has_official": true, "no": "廣4"}, {"title": "廣告不得有的10種情事", "plain": "不得：違法或違反自律規範；虛偽不實、詐欺、隱匿或足致誤信；損害同業或他人信譽；冒用或使用近似他人商標、名號；故意截取報章雜誌不實報導當廣告；誇大業績或績效；藉主管機關核准或備查，讓客戶誤以為主管機關已保證；對未經核准或備查的商品預先宣傳或促銷；使人誤信能保證本金安全或保證獲利；刻意以不明顯字體標示附註與限制事項。", "mnemonic": "不實、貶同業、冒名、截報導、誇績效、拿核准當保證、先賣未核准、保證本金獲利、字小藏限制。", "tip": "『經主管機關核准』不等於『主管機關保證安全』。說『金管會核准』來讓客戶放心，就是第7款的違規。", "facts": {"head": ["款", "禁止的情事"], "rows": [["1", "違反法令、主管機關規定或自律規範"], ["2", "虛偽不實、詐欺、隱匿或其他足致他人誤信"], ["3", "損害金融服務業或他人營業信譽"], ["4", "冒用或使用相同、近似他人商標、服務標章、名號，致有混淆之虞"], ["5", "故意截取報章雜誌不實報導作為廣告內容"], ["6", "對業績及績效作誇大宣傳"], ["7", "藉主管機關核准或備查，誤導客戶以為主管機關已提供保證"], ["8", "對未經核准或備查的商品或服務，預為宣傳或促銷（依法得逕行辦理者除外）"], ["9", "文字或訊息使人誤信能保證本金安全或保證獲利"], ["10", "刻意以不明顯字體標示附註與限制事項"]]}, "official": ["金融服務業從事廣告、業務招攬及營業促銷活動，不得有下列各款之情事：", "一、違反法令、主管機關之規定或自律規範。", "二、虛偽不實、詐欺、隱匿、或其他足致他人誤信。", "三、損害金融服務業或他人營業信譽。", "四、冒用或使用相同或近似於他人之註冊商標、服務標章或名號，致有混淆金融消費者之虞。", "五、故意截取報章雜誌不實之報導作為廣告內容。", "六、對於業績及績效作誇大之宣傳。", "七、藉主管機關對金融商品或服務之核准或備查程序，誤導金融消費者認為主管機關已對該金融商品或服務提供保證。", "八、除依法得逕行辦理之金融商品或服務外，對未經主管機關核准或備查之金融商品或服務，預為宣傳或促銷。", "九、使用之文字或訊息內容使人誤信能保證本金之安全或保證獲利。", "十、刻意以不明顯字體標示附註與限制事項。"], "has_official": true, "no": "廣5"}, {"title": "宣傳資料要先審核才能用", "plain": "金融服務業要訂定宣傳資料的製作管理規範與散發控管流程。宣傳資料對外使用前，要依規範審核，確認沒有不當、不實陳述、誤導客戶或違反法令的情形，才能使用。", "mnemonic": "先審後發。", "tip": "業務員自製的海報、短影音，在公司沒審核前就發出，等於繞過公司這道防線。", "official": ["金融服務業應訂定廣告、業務招攬及營業促銷活動之宣傳資料製作管理規範，及其散發公布之控管作業流程。", "金融服務業從事廣告、業務招攬及營業促銷活動之宣傳資料，於對外使用前，應按業務種類，依前項規範審核，確認內容無不當、不實陳述、誤導金融消費者、違反相關法令及自律規範之情事者，始得為之。"], "has_official": true, "no": "廣6"}, {"title": "簽約前要了解客戶，並建立差異化事前審查機制", "plain": "訂契約前，要依辦法充分瞭解客戶，並依不同商品或服務的特性，建立差異化的事前審查機制，確保適合度。本辦法沒有規定的，依各業務類別的法令與自律規範。", "mnemonic": "商品不同，審查不同。", "official": ["金融服務業與金融消費者訂立提供金融商品或服務之契約前，應依本辦法規定充分瞭解金融消費者之相關資料及依不同金融商品或服務之特性，建立差異化事前審查機制，以確保該商品或服務對金融消費者之適合度；本辦法未規定者，應按業務類別，分別適用各該業務法令及自律規範之規定。"], "has_official": true, "no": "適2"}, {"title": "簽約要有人覆核", "plain": "訂契約時，要有適當的單位或人員，審核簽約程序以及客戶提供資訊的完整性，才可以辦理。", "mnemonic": "簽約要有人覆核資料完整。", "official": ["金融服務業與金融消費者訂立契約時，須有適當之單位或人員審核簽約程序及金融消費者所提供資訊之完整性後，始得辦理。"], "has_official": true, "no": "適3"}, {"title": "投資型商品：要了解客戶的三件事", "plain": "銀行業、證券期貨業提供投資型金融商品或服務，簽約前至少要：一、訂定接受客戶的原則；二、訂定瞭解客戶審查程序，留存身分、財務背景、所得與資金來源、風險偏好、過往投資經驗、簽約目的與需求，內容與分析結果要經客戶簽名、蓋用原留印鑑或雙方同意方式確認，修正時也要；三、評估客戶投資能力（資金操作狀況與專業能力、投資屬性與風險承受度、合適的投資建議範圍）。", "mnemonic": "接受客戶原則＋了解客戶審查（要客戶確認）＋評估投資能力。", "tip": "『了解客戶資料』要客戶確認；修正時也要再確認，不是業務員自己填就好。", "official": ["銀行業及證券期貨業提供投資型金融商品或服務，於訂立契約前，應充分瞭解金融消費者之相關資料，其內容至少應包括下列事項：", "一、接受金融消費者原則：應訂定金融消費者往來之條件。", "二、瞭解金融消費者審查原則：應訂定瞭解金融消費者審查作業程序，及留存之基本資料，包括金融消費者之身分、財務背景、所得與資金來源、風險偏好、過往投資經驗及簽訂契約目的與需求等。該資料之內容及分析結果，應經金融消費者以簽名、蓋用原留印鑑或其他雙方同意之方式確認；修正時，亦同。", "三、評估金融消費者投資能力：除參考前款資料外，並應綜合考量下列資料，以評估金融消費者之投資能力：", "（一）金融消費者資金操作狀況及專業能力。", "（二）金融消費者之投資屬性、對風險之瞭解及風險承受度。", "（三）金融消費者服務之合適性，合適之投資建議範圍。"], "has_official": true, "no": "適4"}, {"title": "投資型商品：適合度評估與商品審查", "plain": "銀行業、證券期貨業提供投資型商品或服務前，要依特性評估適合度；銀行業還要設商品審查小組，對投資型商品做上架前審查。適合度的內容至少要有客戶風險承受等級，以及商品或服務風險等級的分類，確認客戶足以承擔該風險。", "mnemonic": "客戶有等級，商品有等級，對得上才賣；銀行另設上架審查小組。", "tip": "投資型商品的範圍列在第5條（信託、衍生性、結構型、基金、全權委託等）。", "official": ["銀行業及證券期貨業提供投資型金融商品或服務前，應依各類金融商品或服務之特性評估金融商品或服務對金融消費者之適合度；銀行業並應設立商品審查小組，對所提供投資型金融商品進行上架前審查。", "前項金融商品或服務適合度之內容，至少應包括金融消費者風險承受等級及金融商品或服務風險等級之分類，以確認金融消費者足以承擔該金融商品或服務之相關風險。"], "has_official": true, "no": "適6"}, {"title": "保險業：簽約前要了解客戶的內容", "plain": "保險業在客戶訂保險契約或接受服務前，至少要了解：一、客戶基本資料（要保人、被保險人基本資料，要保人與被保險人、被保險人與受益人之關係等）；二、訂定接受客戶（投保）的條件；三、了解客戶的投保目的與需求程度，並進行核保。基本資料至少包括姓名、性別、出生年月日、身分證字號及聯絡方式；法人則是名稱、代表人、地址、聯絡電話。", "mnemonic": "基本資料、接受投保原則、投保目的與需求。", "tip": "要保人與被保險人、被保險人與受益人之『關係』也是要了解的基本資料。", "official": ["保險業在提供金融消費者訂立保險契約或相關服務前，應充分瞭解金融消費者，其內容至少應包括下列事項：", "一、金融消費者基本資料", "（一）要保人及被保險人之基本資料。", "（二）要保人與被保險人及被保險人與受益人之關係。", "（三）其他主管機關規定之基本資料。", "二、接受金融消費者原則：應訂定金融消費者投保之條件。", "三、瞭解金融消費者審查原則：應瞭解金融消費者之投保目的及需求程度，並進行相關核保程序。", "前項第一款所定基本資料，至少應包括姓名、性別、出生年月日、身分證字號及聯絡方式；金融消費者為法人時，為法人之名稱、代表人、地址、聯絡電話等。"], "has_official": true, "no": "適8"}, {"title": "保險業：財產保險與非投資型保險的適合度三件事", "plain": "保險業提供財產保險及非投資型保險商品或服務前，要考量：一、客戶是否確實了解所交保險費是用來購買保險商品；二、投保險種、保險金額及保險費支出，與實際需求是否相當；三、如果買外幣收付的非投資型保險，要了解客戶對匯率風險的承受能力。", "mnemonic": "知道是保險、需求相當、外幣看匯率承受力。", "tip": "賣外幣保單時，匯率風險承受能力是一定要問的，這是適合度辦法明文規定。", "official": ["保險業在提供金融消費者財產保險及非投資型保險商品或服務前，應考量之適合度事項如下：", "一、金融消費者是否確實瞭解其所交保險費係用以購買保險商品。", "二、金融消費者投保險種、保險金額及保險費支出與其實際需求是否相當。", "三、金融消費者如係購買以外幣收付之非投資型保險商品時，應瞭解客戶對匯率風險之承受能力。"], "has_official": true, "no": "適9"}, {"title": "保險業：投資型保險的適合度四件事", "plain": "保險業提供投資型保險前，要考量：一、客戶是否確實了解所交保險費是用來購買保險商品；二、險種、保額、保費與實際需求是否相當；三、客戶的投資屬性、風險承受能力，以及是否確實了解投資損益由自己承擔；四、建立交易控管機制，避免提供客戶逾越財力狀況或不合適的商品或服務。", "mnemonic": "比非投資型多兩件：投資損益自負、交易控管不超過財力。", "facts": {"head": ["事項", "非投資型（第9條）", "投資型（第10條）"], "rows": [["了解所交保費是用來買保險", "有", "有"], ["險種、保額、保費與需求相當", "有", "有"], ["外幣收付要了解匯率風險承受能力", "有", "—"], ["投資屬性、風險承受能力、損益自負", "—", "有"], ["交易控管，避免逾越財力", "—", "有"]]}, "official": ["保險業在提供金融消費者投資型保險商品或服務前，應考量之適合度事項如下：", "一、金融消費者是否確實瞭解其所交保險費係用以購買保險商品。", "二、金融消費者投保險種、保險金額及保險費支出與其實際需求是否相當。", "三、金融消費者之投資屬性、風險承受能力，及是否確實瞭解投資型保險之投資損益係由其自行承擔。", "四、建立交易控管機制，避免提供金融消費者逾越財力狀況或不合適之商品或服務。"], "has_official": true, "no": "適10"}, {"title": "要有內部作業規範並落實", "plain": "金融服務業要依法令、主管機關規定及自律規範，訂定內部作業規範並落實執行，確保提供的商品或服務對客戶適合。", "mnemonic": "制度要有，也要做到。", "official": ["金融服務業應依法令、主管機關規定及自律規範訂定內部作業規範，並落實執行，以確保提供金融商品或服務對金融消費者之適合度。"], "has_official": true, "no": "適11"}, {"title": "說明與揭露的四個基本原則", "plain": "一、本於誠實信用原則，以客戶能充分了解的文字或方式；二、資訊或資料都要正確，陳述或圖表要公平表達，不得虛偽不實、詐欺、隱匿或足致誤信，並且要註記日期；三、銷售文件用中文，力求淺顯，必要時附註原文；四、所有銷售文件要編印頁碼或適當方式，讓客戶確認是否收到完整訊息。", "mnemonic": "誠信易懂、正確註日期、中文淺顯、要有頁碼。", "tip": "『要註記日期』和『要編頁碼』是容易被忽略、卻是明文要求的細節。", "facts": {"head": ["款", "要求"], "rows": [["1", "誠實信用，客戶能充分了解"], ["2", "資訊正確、公平表達、不得誤導，並註記日期"], ["3", "銷售文件用中文，淺顯易懂，必要時附註原文"], ["4", "編印頁碼或適當方式，讓客戶確認收到完整訊息"]]}, "official": ["金融服務業說明金融商品或服務契約之重要內容及揭露風險，應遵守下列基本原則：", "一、應本於誠實信用原則，並以金融消費者能充分瞭解之文字或其他方式為之。", "二、任何說明或揭露之資訊或資料均須正確，所有陳述或圖表均應公平表達，並不得有虛偽不實、詐欺、隱匿、或足致他人誤信之情事，上述資訊或資料應註記日期。", "三、銷售文件之用語應以中文表達，並力求淺顯易懂，必要時得附註原文。", "四、所有銷售文件必須編印頁碼或適當方式，俾供金融消費者確認是否已接收完整訊息。"], "has_official": true, "no": "說3"}, {"title": "說明對象：契約相對人，無行為能力等要對代理人", "plain": "說明與揭露的對象是與業者訂契約的相對人。如果相對人是無行為能力人、限制行為能力人、受輔助宣告人，或授與締約代理權的本人，說明與揭露要向其法定代理人、輔助人或意定代理人為之。", "mnemonic": "本人沒能力，就對代理人說明。", "official": ["金融服務業依本辦法應予揭露及說明之金融消費者，指與金融服務業訂定金融商品或服務契約之契約相對人。", "前項金融消費者為無行為能力人、限制行為能力人、受輔助宣告人或授與締約代理權之本人者，金融服務業依本辦法應為之說明或揭露事項應向其法定代理人、輔助人或意定代理人為之。"], "has_official": true, "no": "說4"}, {"title": "要說明的六項重要內容", "plain": "依商品或服務特性，要說明：一、客戶權利行使、變更、解除、終止的方式與限制；二、業者的重要權利、義務、責任；三、客戶要負擔的費用及違約金（收取時點、計算、收取方式）；四、有沒有受存款保險、保險安定基金或其他保障機制保障；五、爭議處理與申訴管道；六、其他法令規定應定期或不定期報告或應說明的事項。", "mnemonic": "權利行使、業者義務、費用違約金、有無保障、申訴管道、其他法定事項。", "tip": "『有沒有受存款保險、保險安定基金保障』是一定要講的。保險安定基金的保障有限度，不要說成『全額保障』。", "facts": {"head": ["款", "重要內容"], "rows": [["1", "客戶權利行使、變更、解除、終止之方式及限制"], ["2", "業者重要權利、義務及責任"], ["3", "客戶應負擔費用及違約金（時點、計算、收取方式）"], ["4", "有無受存款保險、保險安定基金或其他保障機制保障"], ["5", "紛爭處理及申訴管道"], ["6", "其他法令規定應定期或不定期報告、應說明之事項"]]}, "official": ["金融服務業應依各類金融商品或服務之特性向金融消費者說明之重要內容如下：", "一、金融消費者對該金融商品或服務之權利行使、變更、解除及終止之方式及限制。", "二、金融服務業對該金融商品或服務之重要權利、義務及責任。", "三、金融消費者應負擔之費用及違約金，包括收取時點、計算及收取方式。", "四、金融商品或服務有無受存款保險、保險安定基金或其他相關保障機制之保障。", "五、因金融服務業所提供之金融商品或服務所生紛爭之處理及申訴之管道。", "六、其他法令就各該金融商品或服務所定應定期或不定期報告之事項及其他應說明之事項。", "經主管機關依本法公告為金融服務業之融資租賃業（以下簡稱融資租賃業）除依前項規定說明商品或服務重要內容外，並應說明利率及利息計算方式，且不得有下列各款之情事：", "一、代金融消費者、保證人、或相關第三人簽章。", "二、使金融消費者簽具發票日或金額為空白之本票。", "三、未經金融消費者同意或授權而填寫有關業務契約文件。", "四、繳款遲延時，併收賠償性違約金與遲延利息。"], "has_official": true, "no": "說5"}, {"title": "投資型商品：還要揭露風險資訊", "plain": "投資型商品或服務，除了第5條的說明，還要揭露可能涉及的風險資訊，其中投資風險要包含最大可能損失與商品所涉匯率風險。最大可能損失、匯率風險如果無法用數額表達，可以用文字表達。投資型保險業務也屬於投資型商品。", "mnemonic": "投資型要講最大可能損失＋匯率風險。", "tip": "這個辦法的投資型商品清單比適合度辦法多一項：投資型保險業務。", "official": ["金融服務業提供之金融商品或服務屬投資型商品或服務者，除應依前條辦理外，並應向金融消費者揭露可能涉及之風險資訊，其中投資風險應包含最大可能損失、商品所涉匯率風險。", "前項所稱投資型金融商品或服務，係指下列商品或服務：", "一、信託業辦理特定金錢信託業務或特定有價證券信託業務，受託投資國內外有價證券、短期票券或結構型商品。", "二、信託業辦理具運用決定權之金錢信託或有價證券信託，以財務規劃或資產負債配置為目的，受託投資國內外有價證券、短期票券或結構型商品。", "三、信託業運用信託財產於黃金或衍生性金融商品。", "四、共同信託基金業務。", "五、信託資金集合管理運用帳戶業務。", "六、銀行與客戶承作之衍生性金融商品及結構型商品業務。", "七、黃金及貴金屬業務。但不包括受託買賣集中市場或櫃檯買賣市場交易之黃金業務及銀行辦理與客戶間之黃金現貨買賣及保管業務。", "八、受託買賣非集中市場交易且具衍生性商品性質之外國有價證券業務。", "九、證券商營業處所經營衍生性金融商品及槓桿交易商經營槓桿保證金契約交易業務。", "十、證券投資信託基金及境外基金。但不包括受託買賣集中市場或櫃檯買賣市場交易之證券投資信託基金。", "十一、期貨信託基金。但不包括受託買賣集中市場或櫃檯買賣市場交易之期貨信託基金。", "十二、全權委託投資業務。", "十三、全權委託期貨交易業務。", "十四、投資型保險業務。", "第一項所稱最大可能損失、商品所涉匯率風險，不能以數額表達者，得以文字表達。"], "has_official": true, "no": "說6"}, {"title": "用哪些文件說明，要顯著表達", "plain": "要依商品或服務性質，在公開說明書、投資說明書、商品說明書、風險預告書、客戶須知、約定書、申請書或契約等文件，或經雙方同意的網際網路等方式，說明及揭露，並且用顯著字體或方式表達。", "mnemonic": "寫在文件上，字體要顯著。", "official": ["金融服務業提供金融商品或服務，應按金融商品或服務之性質於公開說明書、投資說明書、商品說明書、風險預告書、客戶須知、約定書、申請書或契約等說明文件，或經由雙方同意之網際網路或其他約定方式，說明及揭露前二條之重要內容，並以顯著字體或方式表達。", "融資租賃業與金融消費者完成契約訂定後，應即時將該契約交付金融消費者。", "融資租賃業受領金融消費者清償本金或利息時，如經金融消費者要求，且融資租賃業確認契約金額及相關費用均已清償完畢，融資租賃業應交付清償證明，載明清償日期及清償金額。"], "has_official": true, "no": "說7"}, {"title": "電話行銷、線上成交可以用電話說明", "plain": "金融服務業以電話行銷提供商品或服務並採取線上成交的，應說明或揭露的事項，可以由電話行銷人員以電話說明方式為之。", "mnemonic": "電話行銷＋線上成交，可用電話說明。", "official": ["金融服務業得以電話行銷提供金融商品或服務並採取線上成交者，依本辦法規定應說明或揭露事項，得由電話行銷人員以電話說明方式為之。"], "has_official": true, "no": "說8"}, {"title": "說明要留存，複雜高風險商品要錄音錄影並保存", "plain": "向客戶說明與揭露時，要留存相關資料；依其他法令要錄音錄影的，依其規定。複雜性高風險商品，要依金融消費者保護法第10條第4項錄音或錄影；內容至少保存『商品存續期間加三個月』，未滿5年的至少保存5年以上；發生爭議時，要保存到爭議終結為止。這些要納入內控及稽核。", "mnemonic": "存續期間加3個月，不滿5年保存5年；有爭議保存到爭議結束。", "tip": "『非臨櫃自動化通路交易』，指的是以電子設備留存說明、揭露過程軌跡的電子交易。", "facts": {"head": ["項目", "規定"], "rows": [["留存", "向客戶說明、揭露的相關資料要留存"], ["錄音錄影的商品", "複雜性高風險商品（依金保法第10條第4項）"], ["保存期間", "商品存續期間加3個月；未滿5年者，至少保存5年"], ["發生爭議", "保存至爭議終結為止"]]}, "official": ["金融服務業依本辦法向金融消費者說明重要內容及揭露風險時，應留存相關資料；依其他法令規定應錄音錄影者，並應依其規定辦理。", "金融服務業提供之金融商品屬複雜性高風險商品者，應依本法第十條第四項規定錄音或錄影；錄音或錄影內容至少應保存該商品存續期間加計三個月之期間，如未滿五年應至少保存五年以上。但發生金融消費爭議時，應保存至該爭議終結為止。", "本法第十條第四項所稱非臨櫃之自動化通路交易，係指金融服務業以電子設備留存同條第一項及第三項對金融消費者進行之說明及揭露相關作業過程軌跡之電子交易。", "第一項及第二項規定應納入金融服務業內部控制及稽核制度管理。"], "has_official": true, "no": "說9"}], "tables": [{"title": "廣告十款禁止情事速記", "head": ["類型", "禁止做什麼"], "rows": [["違法", "違反法令、主管機關規定或自律規範"], ["誤導", "虛偽不實、詐欺、隱匿或足致誤信；使人誤信保證本金或保證獲利"], ["攻擊他人", "損害同業或他人營業信譽；冒用近似商標或名號"], ["操作資訊", "故意截取不實報導；誇大業績績效；字體小藏附註與限制"], ["借用公信力", "拿主管機關核准或備查，讓人以為已提供保證"], ["提前宣傳", "對未經核准或備查的商品，預為宣傳或促銷"]]}, {"title": "保險業『了解客戶＋適合度』清單比較", "head": ["項目", "保險一般（第8條）", "非投資型（第9條）", "投資型（第10條）"], "rows": [["基本資料、投保條件、投保目的與需求", "要", "—", "—"], ["所交保費是用來買保險", "—", "要", "要"], ["險種、保額、保費與實際需求相當", "—", "要", "要"], ["外幣收付，了解匯率風險承受能力", "—", "要", "—"], ["投資屬性、風險承受能力、損益自負", "—", "—", "要"], ["建立交易控管，避免逾越財力", "—", "—", "要"]]}, {"title": "說明義務與錄音錄影的數字", "head": ["條", "數字", "什麼事"], "rows": [["說9", "商品存續期間＋3個月", "複雜性高風險商品錄音錄影的保存期間（未滿5年）"], ["說9", "5年", "上述期間未滿5年時，至少保存5年"], ["說9", "到爭議終結", "發生金融消費爭議時，保存到爭議終結"], ["說6", "最大可能損失、匯率風險", "投資型商品要揭露的風險，不能用數額表達時可用文字"]]}], "cards": [{"ref": "廣5", "front": "廣告可不可以讓人誤信能保證本金安全或保證獲利？", "back": "不可以（廣告辦法第5條第9款）。", "id": 1}, {"ref": "廣5", "front": "可不可以說『這個商品經金管會核准，所以很安全』？", "back": "不可以。藉主管機關的核准或備查程序，誤導客戶以為主管機關已保證，違反第5條第7款。", "id": 2}, {"ref": "廣5", "front": "對還沒經主管機關核准或備查的商品，可以先宣傳嗎？", "back": "不可以（依法得逕行辦理者除外），違反第5條第8款。", "id": 3}, {"ref": "廣4", "front": "廣告中的利率、費用、報酬、風險要怎麼表達？", "back": "以衡平且顯著的方式表達。", "id": 4}, {"ref": "廣6", "front": "宣傳資料在對外使用前要做什麼？", "back": "要依公司的製作管理規範審核，確認無不當、不實或誤導，才能使用。", "id": 5}, {"ref": "適4", "front": "投資型商品『了解客戶』的資料，要經過客戶怎麼處理？", "back": "要經客戶簽名、蓋用原留印鑑或雙方同意方式確認；修正時也要。", "id": 6}, {"ref": "適6", "front": "銀行業提供投資型商品，上架前要經過什麼？", "back": "商品審查小組的上架前審查。", "id": 7}, {"ref": "適8", "front": "保險業要了解客戶的基本資料，至少包括哪些？", "back": "姓名、性別、出生年月日、身分證字號及聯絡方式；法人為名稱、代表人、地址、聯絡電話。", "id": 8}, {"ref": "適9", "front": "賣外幣收付的非投資型保險，適合度要特別了解什麼？", "back": "客戶對匯率風險的承受能力。", "id": 9}, {"ref": "適10", "front": "投資型保險的適合度，比非投資型多哪兩件事？", "back": "客戶的投資屬性、風險承受能力與損益自負；建立交易控管機制，避免提供逾越財力或不合適的商品。", "id": 10}, {"ref": "說3", "front": "說明與揭露的銷售文件，有哪些形式要求？", "back": "中文、淺顯易懂；資訊要註記日期；要編印頁碼或適當方式，讓客戶確認收到完整訊息。", "id": 11}, {"ref": "說4", "front": "客戶是限制行為能力人時，說明與揭露要向誰為之？", "back": "向其法定代理人（受輔助宣告人向輔助人，授與代理權者向意定代理人）。", "id": 12}, {"ref": "說5", "front": "說明時，有沒有受保障機制（存款保險、保險安定基金）要不要講？", "back": "要，這是第5條第4款規定的重要內容。", "id": 13}, {"ref": "說6", "front": "投資型商品的投資風險，要包含哪兩項？", "back": "最大可能損失、商品所涉匯率風險。", "id": 14}, {"ref": "說9", "front": "複雜性高風險商品的錄音錄影，至少保存多久？", "back": "商品存續期間加3個月；未滿5年的至少5年；有爭議保存到爭議終結。", "id": 15}], "scenarios": [{"ref": "廣5", "q": "業務員在簡報上寫『本商品已經金管會核准，請安心購買』。依廣告辦法，這屬於？", "opts": ["合法，有核准可以直接講", "違反第5條第7款：藉核准程序誤導客戶以為主管機關已保證", "合法，只要客戶有簽名", "只要不寫保證獲利就合法"], "ans": 1, "why": "廣告辦法第5條第7款：不得藉主管機關核准或備查程序，誤導金融消費者認為主管機關已對商品提供保證。"}, {"ref": "廣5", "q": "某保單廣告用很大的字寫『高額回饋』，把『提前解約有損失』印成很小的灰色字體。這違反廣告辦法的哪一類規定？", "opts": ["第5條第10款：刻意以不明顯字體標示附註與限制事項", "沒有違反", "第5條第5款：截取報導", "第5條第4款：冒用商標"], "ans": 0, "why": "第5條第10款禁止刻意以不明顯字體標示附註與限制事項。"}, {"ref": "廣5", "q": "某商品還在等主管機關核准，業務員先開始對潛在客戶介紹並收取預約。依廣告辦法，這屬於？", "opts": ["可以，反正之後會核准", "違反第5條第8款：對未經核准或備查的商品預為宣傳或促銷", "只要不收錢就可以", "只要客戶同意就可以"], "ans": 1, "why": "第5條第8款：除依法得逕行辦理者外，對未經核准或備查的金融商品或服務，預為宣傳或促銷，是禁止的。"}, {"ref": "適9", "q": "保險業務員銷售外幣收付的非投資型保險，依適合度辦法，應特別了解客戶什麼？", "opts": ["客戶的投資報酬率期待", "客戶對匯率風險的承受能力", "客戶的學歷", "客戶的職業證照"], "ans": 1, "why": "適合度辦法第9條第3款：購買外幣收付的非投資型保險商品，應瞭解客戶對匯率風險之承受能力。"}, {"ref": "適10", "q": "下列哪一項是『投資型保險』適合度要考量、但『非投資型保險』不需要的事項？", "opts": ["客戶是否了解所交保險費是用來購買保險", "險種、保額、保費與實際需求是否相當", "客戶是否確實了解投資損益由自己承擔，並建立交易控管機制", "外幣收付時的匯率風險"], "ans": 2, "why": "第10條第3、4款是投資型保險特有：投資屬性、風險承受力、損益自負，以及避免逾越財力的交易控管。其他是共通事項或非投資型事項。"}, {"ref": "適4", "q": "銀行辦理投資型商品，要留存的客戶基本資料與分析結果，應如何確認？", "opts": ["業務員自行填寫即可", "經客戶簽名、蓋用原留印鑑或其他雙方同意之方式確認", "由主管簽名", "由客戶口頭同意"], "ans": 1, "why": "適合度辦法第4條第2款：資料內容與分析結果，應經客戶以簽名、蓋用原留印鑑或其他雙方同意方式確認；修正時亦同。"}, {"ref": "說6", "q": "向客戶銷售基金時，除了一般重要內容，投資風險至少要揭露哪一組？", "opts": ["最大可能損失、商品所涉匯率風險", "公司獲利、經理人學歷", "手續費折扣、贈品內容", "股東名單、辦公室地址"], "ans": 0, "why": "說明揭露辦法第6條第1項：投資型商品的投資風險應包含最大可能損失、商品所涉匯率風險；無法以數額表達時，可用文字。"}, {"ref": "說4", "q": "客戶是限制行為能力人，說明及揭露要向誰為之？", "opts": ["客戶本人即可", "其法定代理人", "業務員的主管", "任何家屬皆可"], "ans": 1, "why": "說明揭露辦法第4條第2項：契約相對人為無行為能力人、限制行為能力人、受輔助宣告人或授與締約代理權之本人者，應向其法定代理人、輔助人或意定代理人為之。"}, {"ref": "說9", "q": "某複雜性高風險商品，存續期間是2年，依說明揭露辦法，錄音錄影至少應保存多久？", "opts": ["2年3個月", "5年以上", "1年", "到客戶要求刪除為止"], "ans": 1, "why": "第9條第2項：至少保存『存續期間加3個月』，如未滿5年，應至少保存5年以上。2年3個月不滿5年，所以至少保存5年。發生爭議時還要保存到爭議終結。"}, {"ref": "說3", "q": "下列哪一項不是說明揭露辦法第3條要求的基本原則？", "opts": ["資訊與資料應註記日期", "銷售文件用中文並力求淺顯易懂", "銷售文件要編印頁碼或適當方式，讓客戶確認收到完整", "說明文件應由業務員簽名保證獲利"], "ans": 3, "why": "第3條的基本原則是誠信、資訊正確並註記日期、中文淺顯、編印頁碼；沒有任何一條允許保證獲利，保證獲利更是廣告辦法禁止的。"}], "chNo": "02", "summary": "金融消費者保護法第8、9、10條的施行細則：廣告能說什麼不能說什麼（10種禁止情事）、簽約前要了解客戶什麼（保險業與投資型商品各有清單）、說明揭露要說哪些重要內容、錄音錄影要留多久。", "scope": "收錄金融服務業從事廣告業務招攬及營業促銷活動辦法第3、4、5、6條；金融服務業確保金融商品或服務適合金融消費者辦法第2、3、4、6、8、9、10、11條；金融服務業提供金融商品或服務前說明契約重要內容及揭露風險辦法第3、4、5、6、7、8、9條。", "nav": {"prev": {"file": "ch01.html", "label": "第1章 金融消費者保護法：公平待客、說明、適合度與爭議處理"}, "next": {"file": "ch03.html", "label": "第3章 保險招攬：業務員、經紀人、代理人與公證人"}}}</script>
<script>const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

function Flash(root,getCards){

  }
  root.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;

function Quiz(root,getItems,perRound){

    score=0;answered=0;upd();
  }
  function upd(){const el=$('#sc',root);if(el)el.textContent='已作答 '+answered+' / '+items.length+'，答對 '+score+' 題';
    if(perRound&&answered===items.length&&items.length){$('#qend',root).innerHTML='<div class="card"><h3>這一組：'+score+' / '+items.length+'</h3></div><div class="row"><button class="btn pri" data-a="again">再來一組</button></div>'}}
  function again(){const all=getItems();items=perRound?shuffle(all).slice(0,perRound):all;draw()}

<script>// 語音：導覽列多一顆「🎧 語音」鈕，按下就從頭播放；畫面上方只留最後兩行字幕（固定高度，不會推動下面的頁面）。
// 再按一次＝暫停／繼續；點字幕也一樣；字幕右側的 ✕ 關閉。播完一段自動接下一段。
// 資料來自 mp3/timing/chNN.js（window.AUDIO_TIMING），由 make_timing.py 產生；沒有這個檔就不會出現「語音」鈕。
(function(){
const T=window.AUDIO_TIMING;
if(!T||!T.segments||!T.segments.length)return;
const BASE='mp3',segs=T.segments,au=document.getElementById('au');
const cap=document.getElementById('cap'),rowA=document.getElementById('cap-a'),rowB=document.getElementById('cap-b'),top=document.getElementById('top');
const SP={F:'主持人',M:'專家'},PUNC='，、：；。！？';

btn.id='au-btn';btn.type='button';btn.textContent='🎧 語音';btn.setAttribute('aria-pressed','false');btn.title='按下開始聽這一章的語音重點';
nav.appendChild(btn);

// ---- 字幕斷行：依目前寬度，把每句切成一行一行 ----
const fontPx=()=>parseFloat(getComputedStyle(rowB).fontSize)||17;
const cw=(s,f)=>{let w=0;for(const c of s)w+=c.charCodeAt(0)<128?f*0.56:f;return w};
function wrap(text,lim0,lim,f){
  const parts=text.match(new RegExp('[^'+PUNC+']+['+PUNC+']*|['+PUNC+']+','g'))||[text];
  const out=[];let cur='',w=0,lim_=lim0;
  const push=()=>{if(cur){out.push(cur);cur='';w=0;lim_=lim}};
  for(const p of parts){
    const pw=cw(p,f);
    if(w+pw<=lim_){cur+=p;w+=pw;continue}
    push();
    if(pw<=lim_){cur=p;w=pw;continue}
    for(const c of p){const x=cw(c,f);if(w+x>lim_)push();cur+=c;w+=x}
  }
  push();return out;
}
function buildLines(){
  lines=[];if(si<0)return;
  const s=segs[si],f=fontPx(),avail=Math.max(120,(rowB.clientWidth||cap.clientWidth||300)-2);let prevSpk=null;
  s.cues.forEach((c,k)=>{
    const t0=c.t,t1=k+1<s.cues.length?s.cues[k+1].t:s.dur;
    const span=Math.max(0.4,t1-t0-0.7);                       // 句尾約有 0.7 秒停頓，不分給字
    const badge=c.spk!==prevSpk;prevSpk=c.spk;
    const bw=badge?SP[c.spk].length*12+18:0;                   // 說話者小標籤的寬度（12px 字＋留白）
    const ls=wrap(c.text,avail-bw,avail,f),ws=ls.map(x=>Math.max(1,cw(x,f))),tot=ws.reduce((a,b)=>a+b,0);
    let acc=0;ls.forEach((x,j)=>{lines.push({t:t0+span*acc/tot,spk:c.spk,badge:badge&&j===0,text:x});acc+=ws[j]});
  });
}
const esc2=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const rowHTML=l=>l?(l.badge?'<span class="sp '+l.spk+'">'+SP[l.spk]+'</span>':'')+esc2(l.text):'';
function paint(){
  const t=au.currentTime;let j=-1;
  for(let k=0;k<lines.length;k++){if(lines[k].t<=t+0.05)j=k;else break}
  if(j===li)return;li=j;

}
function tick(){paint();raf=au.paused?0:requestAnimationFrame(tick)}

// ---- 播放 ----
const nice=t=>String(t).replace(/_/g,' ');
function meta(){if('mediaSession' in navigator&&window.MediaMetadata&&si>=0)navigator.mediaSession.metadata=new MediaMetadata({title:nice(segs[si].title),artist:D.chapter+' '+D.title,album:'考試複習語音'})}
function pad(){document.documentElement.style.scrollPaddingTop=cap.hidden?'':(top.offsetHeight+8)+'px'}
function setSrc(i){if(si===i)return;si=i;li=-2;rowA.innerHTML=rowB.innerHTML='';au.src=encodeURI(BASE+'/'+segs[i].file);au.load();au.playbackRate=1;buildLines();meta()}
function playSeg(i){

function toggle(){if(!started)start();else if(au.paused)au.play().catch(()=>{});else au.pause()}
btn.onclick=toggle;
cap.addEventListener('click',e=>{if(e.target.closest('#cap-x'))stop();else toggle()});
