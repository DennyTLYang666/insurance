<script id="data" type="application/json">{"chapter": "第八章", "title": "賄賂、貪污與檢舉：送禮、挪用客戶款項與保護檢舉人", "laws": [{"pcode": "C0000001", "name": "中華民國刑法", "amended": "民國115年7月22日", "url": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=C0000001", "source": "法務部全國法規資料庫（經 kong0107/mojLawSplitJSON 公開鏡像取得，鏡像更新日 20261016）", "retrieved": "2026-11-03", "mirrorDate": "20260722"}, {"pcode": "C0000007", "name": "貪污治罪條例", "amended": "民國105年6月22日", "url": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=C0000007", "source": "法務部全國法規資料庫（經 kong0107/mojLawSplitJSON 公開鏡像取得，鏡像更新日 20261016）", "retrieved": "2026-11-03", "mirrorDate": "20160622"}, {"pcode": "I0070003", "name": "獎勵保護檢舉貪污瀆職辦法", "amended": "民國108年2月1日", "url": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0070003", "source": "法務部全國法規資料庫（經 kong0107/mojLawSplitJSON 公開鏡像取得，鏡像更新日 20261016）", "retrieved": "2026-11-03", "mirrorDate": "20190201"}], "alerts": [{"t": "『送禮』和『行賄』的界線在對價關係", "d": "依貪污治罪條例第11條，對公務員，無論是『違背職務』或『不違背職務』的行為，行求、期約或交付賄賂或其他不正利益，都有刑責（違背職務：1年以上7年以下；不違背職務：3年以下）。判斷是不是賄賂，實務上看是否與職務行為有『對價關係』（這是實務見解，不是條文原文；你的筆記也是這個重點）。"}, {"t": "後果的提醒（風險）", "d": "金融從業人員挪用、侵占客戶款項，依刑法第336條業務侵占，6個月以上5年以下有期徒刑；為他人處理事務卻圖私利而違背任務，依刑法第342條背信，5年以下有期徒刑。行賄公務員，最重7年以下有期徒刑（但自首者免除其刑，偵查或審判中自白可減輕或免除）。"}, {"t": "沒有收錄的部分", "d": "公司內部吹哨者管道、上市櫃公司誠信經營守則屬於公司治理與自律規範，不是這幾部法律的條文，本章沒有收錄；檢舉獎金的給獎標準在辦法的附表（PDF附件），我無法從資料庫鏡像取得內容，所以只收錄條文，沒有附表金額。"}], "clauses": [{"title": "公務員收受職務上行為的賄賂", "plain": "公務員或仲裁人，對於職務上的行為，要求、期約或收受賄賂或其他不正利益的，處7年以下有期徒刑，得併科70萬元以下罰金。", "mnemonic": "公務員收職務上行為的賄賂：7年以下。", "tip": "貪污治罪條例第5條對公務員『職務上行為』收賄的規定較重（7年以上），一般公務員會適用貪污治罪條例。", "official": ["公務員或仲裁人對於職務上之行為，要求、期約或收受賄賂或其他不正利益者，處七年以下有期徒刑，得併科七十萬元以下罰金。"], "has_official": true, "no": "刑121"}, {"title": "收賄與行賄：違背職務行為", "plain": "公務員或仲裁人，對於違背職務的行為，要求、期約或收受賄賂或其他不正利益的，處3年以上10年以下有期徒刑，得併科200萬元以下罰金；因而為違背職務行為的，處無期徒刑或5年以上有期徒刑。對公務員或仲裁人的違背職務行為，行求、期約或交付賄賂或其他不正利益的，處3年以下有期徒刑，得併科30萬元以下罰金；自首者減輕或免除其刑，偵查或審判中自白者，得減輕其刑。", "mnemonic": "收賄違背職務：3到10年；行賄違背職務：3年以下，自首減免、自白可減。", "tip": "行賄的人（包含公司業務員）也有刑責，不是只有收錢的公務員。", "official": ["公務員或仲裁人對於違背職務之行為，要求、期約或收受賄賂或其他不正利益者，處三年以上十年以下有期徒刑，得併科二百萬元以下罰金。", "因而為違背職務之行為者，處無期徒刑或五年以上有期徒刑，得併科四百萬元以下罰金。", "對於公務員或仲裁人關於違背職務之行為，行求、期約或交付賄賂或其他不正利益者，處三年以下有期徒刑，得併科三十萬元以下罰金。但自首者減輕或免除其刑。在偵查或審判中自白者，得減輕其刑。"], "has_official": true, "no": "刑122"}, {"title": "公務員對職務上行為要求、期約或收受賄賂", "plain": "公務員有下列行為之一，處7年以上有期徒刑，得併科6,000萬元以下罰金：意圖得利，擅提或截留公款、違背法令收募稅捐或公債；利用職務上機會，以詐術使人交付財物；對於職務上之行為，要求、期約或收受賄賂或其他不正利益。", "mnemonic": "職務上行為收賄：7年以上。", "official": ["有下列行為之一者，處七年以上有期徒刑，得併科新臺幣六千萬元以下罰金：", "一、意圖得利，擅提或截留公款或違背法令收募稅捐或公債者。", "二、利用職務上之機會，以詐術使人將本人之物或第三人之物交付者。", "三、對於職務上之行為，要求、期約或收受賄賂或其他不正利益者。", "前項第一款及第二款之未遂犯罰之。"], "has_official": true, "no": "貪5"}, {"title": "對公務員行賄：違背職務與不違背職務", "plain": "對公務員，關於違背職務的行為，行求、期約或交付賄賂或其他不正利益的，處1年以上7年以下有期徒刑，得併科300萬元以下罰金。關於不違背職務的行為，行求、期約或交付賄賂或其他不正利益的，處3年以下有期徒刑、拘役或科或併科50萬元以下罰金。不具公務員身分的人也適用。犯行賄罪而自首的，免除其刑；偵查或審判中自白的，減輕或免除其刑。", "mnemonic": "行賄公務員：違背職務1到7年；不違背職務3年以下；自首免刑、自白減輕。", "tip": "你的筆記有一題：公司自己符合規定，只是想縮短辦理時間，就送承辦公務員高價禮品。條文上，無論違背職務與否，行求、期約或交付賄賂或不正利益都有刑責（只是刑度不同），所以不能送。", "facts": {"head": ["行為", "刑責"], "rows": [["對公務員違背職務的行為行賄", "1年以上7年以下有期徒刑，得併科300萬元以下罰金"], ["對公務員不違背職務的行為行賄", "3年以下有期徒刑、拘役或科或併科50萬元以下罰金"], ["自首", "免除其刑"], ["偵查或審判中自白", "減輕或免除其刑"]]}, "official": ["對於第二條人員，關於違背職務之行為，行求、期約或交付賄賂或其他不正利益者，處一年以上七年以下有期徒刑，得併科新臺幣三百萬元以下罰金。", "對於第二條人員，關於不違背職務之行為，行求、期約或交付賄賂或其他不正利益者，處三年以下有期徒刑、拘役或科或併科新臺幣五十萬元以下罰金。", "對於外國、大陸地區、香港或澳門之公務員，就跨區貿易、投資或其他商業活動有關事項，為前二項行為者，依前二項規定處斷。", "不具第二條人員之身分而犯前三項之罪者，亦同。", "犯前四項之罪而自首者，免除其刑；在偵查或審判中自白者，減輕或免除其刑。", "在中華民國領域外犯第一項至第三項之罪者，不問犯罪地之法律有無處罰規定，均依本條例處罰。"], "has_official": true, "no": "貪11"}, {"title": "洩漏或交付國防以外應秘密的消息", "plain": "公務員洩漏或交付關於國防以外應秘密的文書、圖畫、消息或物品的，處3年以下有期徒刑；因過失犯的，處1年以下有期徒刑、拘役或9千元以下罰金。非公務員因職務或業務知悉或持有這些消息而洩漏或交付的，處1年以下有期徒刑、拘役或9千元以下罰金。", "mnemonic": "洩漏國防以外的秘密：公務員3年以下，非公務員1年以下。", "tip": "檢舉人資料被洩漏，就是適用這類洩密罪（見獎勵保護檢舉貪污瀆職辦法第10條）。", "official": ["公務員洩漏或交付關於中華民國國防以外應秘密之文書、圖畫、消息或物品者，處三年以下有期徒刑。", "因過失犯前項之罪者，處一年以下有期徒刑、拘役或九千元以下罰金。", "非公務員因職務或業務知悉或持有第一項之文書、圖畫、消息或物品，而洩漏或交付之者，處一年以下有期徒刑、拘役或九千元以下罰金。"], "has_official": true, "no": "刑132"}, {"title": "業務侵占", "plain": "對於業務上所持有的物，犯侵占罪的，處6個月以上5年以下有期徒刑，得併科9萬元以下罰金；未遂也罰。對於公務上或因公益所持有的物，處1年以上7年以下有期徒刑，得併科15萬元以下罰金。", "mnemonic": "業務上持有的錢、物，侵占：6月到5年。", "tip": "業務員代收保費卻挪用，除了違反業務員管理規則第19條第9款，也可能構成業務侵占。", "official": ["對於公務上或因公益所持有之物，犯前條第一項之罪者，處一年以上七年以下有期徒刑，得併科十五萬元以下罰金。", "對於業務上所持有之物，犯前條第一項之罪者，處六月以上五年以下有期徒刑，得併科九萬元以下罰金。", "前二項之未遂犯罰之。"], "has_official": true, "no": "刑336"}, {"title": "背信：為他人處理事務卻圖私利", "plain": "為他人處理事務，意圖為自己或第三人不法利益，或損害本人利益，而為違背其任務的行為，致生損害於本人的財產或其他利益的，處5年以下有期徒刑、拘役，或科或併科50萬元以下罰金；未遂也罰。", "mnemonic": "替人處理事務，圖私利違背任務，造成損害：5年以下。", "tip": "受託管理財產、代客操作的人，違背任務圖私利，容易落在這條。", "official": ["為他人處理事務，意圖為自己或第三人不法之利益，或損害本人之利益，而為違背其任務之行為，致生損害於本人之財產或其他利益者，處五年以下有期徒刑、拘役或科或併科五十萬元以下罰金。", "前項之未遂犯罰之。"], "has_official": true, "no": "刑342"}, {"title": "要在『未被發覺前』向有權機關檢舉", "plain": "檢舉人要在貪污瀆職事實『未被發覺前』，向檢察機關、司法警察機關或政風機構檢舉，才依本辦法核給檢舉獎金。", "mnemonic": "未發覺前檢舉，才有獎金。", "official": ["檢舉人於前條所列案件之貪污瀆職事實未被發覺前，向檢察機關、司法警察機關或政風機構檢舉者，依本辦法規定核給檢舉獎金（以下簡稱獎金）。"], "has_official": true, "no": "獎3"}, {"title": "不給獎金的六種情形", "plain": "不給獎金：一、檢舉事實與判決書事實不符；二、公務員執行職務知有嫌疑而檢舉（法令另有規定者除外）；三、共同實行或教唆、幫助犯貪污瀆職；四、對公務員期約或交付賄賂後再行檢舉；五、匿名或不以真實姓名檢舉、未提出具體事證或拒絕作筆錄；六、委託他人檢舉、以他人名義檢舉或受委託檢舉。", "mnemonic": "事實不符、公務員職務、共犯、先行賄再檢舉、匿名沒證據、代檢舉。", "tip": "匿名檢舉不能領獎金；要用真實姓名並製作筆錄。", "official": ["有下列情事之一者，不給與獎金：", "一、檢舉事實與判決書所載之事實不符。", "二、公務員執行職務知有貪污瀆職嫌疑而檢舉。", "三、共同實行或教唆、幫助他人犯貪污瀆職案件。", "四、對於公務員期約或交付賄賂或不正利益後再行檢舉。", "五、匿名或不以真實姓名檢舉、檢舉而未提出具體事證或拒絕製作筆錄。", "六、委託他人檢舉、以他人名義檢舉或受委託而檢舉。", "前項第二款情形，法令另有規定者，從其規定。"], "has_official": true, "no": "獎4"}, {"title": "檢舉同一案犯罪人數逾5人，增給1/2，最高1,000萬", "plain": "因檢舉同一貪污瀆職案件的犯罪人數，經法院判決有罪確定逾5人的，增給二分之一獎金，最高以新臺幣1,000萬元為限。同一案件包括一人犯數罪或數人共犯一罪、數罪或裁判上一罪的情形。", "mnemonic": "逾5人增給一半，上限1,000萬。", "tip": "筆記裡提到的『同一貪污瀆職案件最高獎金1,000萬元』，條文原文是在這條出現的（逾5人增給二分之一獎金，最高以1,000萬元為限）。給獎標準金額在辦法附表，這裡沒有收錄。", "official": ["因檢舉同一貪污瀆職案件之犯罪人數，經法院判決有罪確定逾五人者，增給二分之一獎金。最高以新臺幣一千萬元為限。", "前項所定同一貪污瀆職案件，包括一人犯數罪或數人共犯一罪、數罪或裁判上一罪之情形。"], "has_official": true, "no": "獎5"}, {"title": "獎金分兩階段發放", "plain": "檢舉貪污瀆職案件，經法院判決有罪的，依附表標準給與獎金三分之一；經法院判決有罪確定後，給與其餘獎金。獎金扣除應繳稅額後給與。除誣告情形外，給與的獎金不予追回。", "mnemonic": "判決有罪先發1/3；確定再發其餘。", "facts": {"head": ["階段", "發多少"], "rows": [["法院判決有罪", "依附表標準給與獎金三分之一"], ["判決有罪確定", "給與其餘獎金"], ["獎金", "扣除應繳稅額後給與；除誣告外不追回"]]}, "official": ["檢舉貪污瀆職案件，經法院判決有罪者，依附表之標準給與獎金三分之一，經法院判決有罪確定後，給與其餘獎金。", "檢舉人檢舉之事實有第四條第一項第一款不給與獎金之情事，經第八條第二項規定之審查會審核同意，認該檢舉內容對查獲貪污瀆職案件有直接重要幫助，且經法院判決有罪確定者，得依附表之標準給與十分之一獎金。", "檢舉獎金於扣除應繳稅額後給與之。", "檢舉人死亡者，由其繼承人依民法相關規定具領。", "給與之獎金，除有第十一條規定情形外，不予追回。"], "has_official": true, "no": "獎7"}, {"title": "檢舉資料要保密；洩漏者依法處罰", "plain": "受理檢舉的機關，對檢舉書、筆錄等資料，應予保密，另行保存，不附於偵查案卷內。檢察官或法官為釐清案情，或相關機關為審核獎金發放事宜有必要時，得調閱。無故洩漏這些資料的，依刑法或其他法令處罰。", "mnemonic": "檢舉人資料：保密、另行保存、洩漏要罰。", "official": ["受理檢舉機關，對於前條之檢舉書、筆錄等資料，應予保密，另行保存，不附於偵查案卷內。但檢察官或法官為釐清案情，或相關機關為審核檢舉獎金發放事宜，有必要時，得調閱之。", "無故洩漏前項資料者，應依刑法或其他法令處罰之。"], "has_official": true, "no": "獎10"}, {"title": "誣告他人，要追回獎金", "plain": "檢舉人誣告他人貪污瀆職，經法院判決有罪確定的，由受理檢舉機關追回已核發的獎金；檢舉人死亡的，向其繼承人追回。", "mnemonic": "誣告有罪確定，獎金追回。", "official": ["檢舉人誣告他人貪污瀆職，經法院判決有罪確定者，由受理檢舉機關追回已核發之獎金。", "前項情形，檢舉人死亡者，向其繼承人追回已核發之獎金。"], "has_official": true, "no": "獎11"}, {"title": "檢舉人安全要保護", "plain": "檢舉人的安全，應予保護；對檢舉人威脅、恐嚇或其他不法行為的，應依法嚴懲。", "mnemonic": "保護檢舉人安全；威脅恐嚇要嚴懲。", "official": ["檢舉人之安全，應予保護，對檢舉人威脅、恐嚇或其他不法行為者，應依法嚴懲。"], "has_official": true, "no": "獎12"}], "tables": [{"title": "對公務員送禮／行賄：怎麼判斷刑度", "head": ["情形", "刑責", "依據"], "rows": [["對違背職務的行為行賄", "1年以上7年以下有期徒刑，得併科300萬元以下罰金", "貪污治罪條例第11條第1項"], ["對不違背職務的行為行賄", "3年以下有期徒刑、拘役或科或併科50萬元以下罰金", "貪污治罪條例第11條第2項"], ["行賄後自首", "免除其刑", "貪污治罪條例第11條第5項"], ["行賄後偵查或審判中自白", "減輕或免除其刑", "貪污治罪條例第11條第5項"]]}, {"title": "挪用、侵占與背信：金融從業人員常見刑責", "head": ["行為", "刑責", "依據"], "rows": [["業務侵占（挪用客戶款項、保費）", "6個月以上5年以下有期徒刑，得併科9萬元以下罰金", "刑法第336條第2項"], ["背信（為他人處理事務圖私利）", "5年以下有期徒刑、拘役，或科或併科50萬元以下罰金", "刑法第342條"], ["洩漏業務秘密", "1年以下（工商秘密）", "刑法第317條（見第四章）"]]}, {"title": "檢舉貪污獎金：要點速記", "head": ["項目", "重點"], "rows": [["檢舉時點", "貪污瀆職事實未被發覺前"], ["檢舉對象機關", "檢察機關、司法警察機關或政風機構"], ["不給獎金", "事實不符、公務員職務、共犯、先行賄後檢舉、匿名或無具體事證、代檢舉"], ["獎金發放", "判決有罪給1/3，確定後給其餘"], ["逾5人", "增給1/2，最高1,000萬元"], ["檢舉資料", "保密，另行保存；洩漏依刑法或其他法令處罰"], ["誣告", "有罪確定，追回已核發獎金"]]}], "cards": [{"ref": "貪11", "front": "對公務員違背職務的行為行賄，刑責？", "back": "1年以上7年以下有期徒刑，得併科300萬元以下罰金（貪污治罪條例第11條）。", "id": 1}, {"ref": "貪11", "front": "對公務員不違背職務的行為行賄，有沒有刑責？", "back": "有，3年以下有期徒刑、拘役或科或併科50萬元以下罰金。", "id": 2}, {"ref": "貪11", "front": "行賄後自首，會怎麼樣？", "back": "免除其刑；偵查或審判中自白者，減輕或免除其刑。", "id": 3}, {"ref": "刑122", "front": "公務員對違背職務行為收賄，刑責？", "back": "3年以上10年以下有期徒刑，得併科200萬元以下罰金（因而違背職務者更重）。", "id": 4}, {"ref": "刑336", "front": "代收客戶款項卻挪用，可能構成什麼罪？", "back": "業務侵占（刑法第336條第2項）：6個月以上5年以下有期徒刑。", "id": 5}, {"ref": "刑342", "front": "受託管理財產，違背任務圖私利致委託人受損，可能構成什麼罪？", "back": "背信罪（刑法第342條）：5年以下有期徒刑、拘役，或科或併科50萬元以下罰金。", "id": 6}, {"ref": "獎3", "front": "檢舉貪污瀆職要在什麼時點檢舉，才有獎金？", "back": "貪污瀆職事實『未被發覺前』。", "id": 7}, {"ref": "獎4", "front": "匿名檢舉貪污，能不能領獎金？", "back": "不能；匿名或不以真實姓名檢舉、未提出具體事證或拒絕作筆錄，不給獎金。", "id": 8}, {"ref": "獎4", "front": "行賄公務員後再去檢舉，能不能領獎金？", "back": "不能。", "id": 9}, {"ref": "獎5", "front": "同一貪污瀆職案件，犯罪人數逾5人時，獎金如何增加？上限？", "back": "增給二分之一獎金，最高以新臺幣1,000萬元為限。", "id": 10}, {"ref": "獎7", "front": "檢舉貪污獎金怎麼分階段發放？", "back": "判決有罪先給三分之一；判決有罪確定後給其餘獎金。", "id": 11}, {"ref": "獎10", "front": "檢舉書、筆錄等資料要怎麼處理？", "back": "保密，另行保存，不附於偵查案卷；無故洩漏要依刑法或其他法令處罰。", "id": 12}, {"ref": "獎11", "front": "檢舉人誣告他人，獎金會怎樣？", "back": "經法院判決有罪確定，由受理機關追回已核發獎金。", "id": 13}, {"ref": "刑132", "front": "洩漏國防以外應秘密消息，公務員與非公務員刑責分別是？", "back": "公務員3年以下有期徒刑；非公務員因職務或業務知悉而洩漏，1年以下有期徒刑、拘役或9千元以下罰金。", "id": 14}], "scenarios": [{"ref": "貪11", "q": "某公司業務員為了縮短申請流程，送一份高價禮品給承辦的公務員，希望能優先處理（該公司案件本身符合規定）。依貪污治罪條例第11條，下列何者最正確？", "opts": ["只是人情往來，不會有刑責", "對公務員行求、期約或交付不正利益，即使是不違背職務的行為，也有刑責", "只有違背職務才有刑責", "只要公務員沒收下就沒有責任"], "ans": 1, "why": "貪污治罪條例第11條第2項：對公務員關於不違背職務的行為，行求、期約或交付賄賂或其他不正利益的，處3年以下有期徒刑、拘役或科或併科50萬元以下罰金。『行求』只要提出就成立，不用等對方收下。"}, {"ref": "貪11", "q": "行賄公務員後，行為人主動向檢察機關自首。依貪污治罪條例第11條第5項，法律效果是？", "opts": ["加重其刑", "免除其刑", "沒有影響", "只能減輕一半"], "ans": 1, "why": "第11條第5項：犯行賄罪而自首者，免除其刑；在偵查或審判中自白者，減輕或免除其刑。"}, {"ref": "刑336", "q": "保險業務員收了客戶現金保費，沒有交給公司，而是自己花掉。除了違反保險業務員管理規則，還可能涉及？", "opts": ["沒有刑事責任", "刑法業務侵占罪（6個月以上5年以下有期徒刑）", "刑法誹謗罪", "刑法妨害名譽罪"], "ans": 1, "why": "刑法第336條第2項：對於業務上所持有之物犯侵占罪，處6個月以上5年以下有期徒刑，得併科9萬元以下罰金。"}, {"ref": "刑342", "q": "受託代客操作的人員，為了自己或第三人的不法利益，違背任務操作，致客戶財產受損。可能構成？", "opts": ["背信罪", "誹謗罪", "偽造文書罪", "沒有任何罪"], "ans": 0, "why": "刑法第342條：為他人處理事務，意圖為自己或第三人不法利益，違背其任務致生損害於本人財產的，處5年以下有期徒刑、拘役或科或併科50萬元以下罰金。"}, {"ref": "獎3", "q": "某人發現公司內部有貪污，想要領檢舉獎金，下列時點何者才符合？", "opts": ["案件已被媒體報導之後", "貪污瀆職事實『未被發覺前』", "檢察官已起訴之後", "判決確定之後"], "ans": 1, "why": "獎勵保護檢舉貪污瀆職辦法第3條：檢舉人在貪污瀆職事實未被發覺前，向檢察機關、司法警察機關或政風機構檢舉。"}, {"ref": "獎4", "q": "下列哪一種情形，依獎勵保護檢舉貪污瀆職辦法，『不給與』獎金？", "opts": ["以真實姓名向檢察機關檢舉", "匿名檢舉且未提出具體事證", "提出具體事證並接受筆錄", "事實與判決書所載相符"], "ans": 1, "why": "第4條第5款：匿名或不以真實姓名檢舉、檢舉而未提出具體事證或拒絕製作筆錄，不給與獎金。"}, {"ref": "獎5", "q": "同一貪污瀆職案件，檢舉後犯罪人經法院判決有罪確定逾5人，獎金如何處理？", "opts": ["獎金減半", "增給二分之一，最高以新臺幣1,000萬元為限", "不再給獎金", "增給一倍，無上限"], "ans": 1, "why": "第5條：因檢舉同一案件的犯罪人數，經法院判決有罪確定逾5人者，增給二分之一獎金；最高以新臺幣1,000萬元為限。"}, {"ref": "獎10", "q": "受理檢舉機關的承辦人，無故把檢舉人的資料洩漏給被檢舉人。依辦法第10條，下列何者正確？", "opts": ["不需負責", "應依刑法或其他法令處罰", "只需內部警告", "只有罰款，不會有刑責"], "ans": 1, "why": "第10條第2項：無故洩漏檢舉書、筆錄等資料者，應依刑法或其他法令處罰（例如刑法第132條洩密罪）。"}, {"ref": "獎11", "q": "檢舉人檢舉他人貪污，經查是誣告，法院判決有罪確定。獎金如何處理？", "opts": ["獎金照給", "由受理機關追回已核發的獎金", "減半給予", "不影響"], "ans": 1, "why": "第11條：檢舉人誣告他人貪污瀆職，經法院判決有罪確定，由受理檢舉機關追回已核發的獎金。"}, {"ref": "獎7", "q": "檢舉貪污獎金，在法院『判決有罪』（尚未確定）時，依辦法第7條應該怎麼發？", "opts": ["全額發給", "依附表標準先給三分之一，確定後再給其餘", "完全不發", "減半發給"], "ans": 1, "why": "第7條第1項：經法院判決有罪者，依附表標準給與獎金三分之一；經法院判決有罪確定後，給與其餘獎金。"}], "chNo": "08", "summary": "金融從業人員最容易碰到的刑責：對公務員送禮或行賄、收受客戶的好處、挪用或侵占客戶款項、為他人處理事務卻圖私利（背信），以及檢舉貪污瀆職時，檢舉人的資料要保密、獎金怎麼算。職業道德科的賄賂貪污、檢舉人制度題從這裡出。", "scope": "收錄中華民國刑法第121、122、132、336、342條；貪污治罪條例第5、11條；獎勵保護檢舉貪污瀆職辦法第3、4、5、7、10、11、12條。", "nav": {"prev": {"file": "ch07.html", "label": "第7章 利益衝突與忠實義務：信託、銀行與不得保證獲利"}, "next": null}}</script>
<script>const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>{t=String(t||'');const ss=t.split(/(?<=。)/).map(x=>x.trim()).filter(Boolean);if(t.length<=90||ss.length<2&&t.indexOf('；')<0)return '<p>'+esc(t)+'</p>';
  const li=s=>{s=s.replace(/。$/,'');const m=s.match(/^([^：；]{1,40})：(.+)$/);if(m&&m[2].split('；').length>=3)return '<li><b>'+esc(m[1])+'</b><ul>'+m[2].split('；').map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></li>';
    const parts=s.split('；');if(parts.length>=3)return '<li>'+parts.map(x=>esc(x)).join('<br>')+'</li>';return '<li>'+esc(s)+'</li>'};
  return '<ul class="pl">'+ss.map(li).join('')+'</ul>'};
const factsT=f=>f?'<div class="tw"><table class="ft"><thead><tr>'+f.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+f.rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'';
const LAWMAP={"金保": "金融消費者保護法", "適": "適合度辦法", "說": "說明揭露辦法", "廣": "廣告辦法", "個": "個資法", "洗": "洗錢防制法", "洗辦": "金融機構防制洗錢辦法", "保": "保險法", "規": "業務員管理規則", "招": "招攬核保理賠辦法", "證": "證券交易法", "證商": "證券商負責人與業務人員管理規則", "期商": "期貨商負責人及業務員管理規則", "投顧": "投信投顧法", "投保": "投保法", "信": "信託法", "信業": "信託業法", "銀": "銀行法", "刑": "刑法", "貪": "貪污治罪條例", "獎": "檢舉貪污獎勵辦法"};
const lab=x=>{const m=String(x).match(/^([^0-9]+)([0-9]+(?:-[0-9]+)?)$/);return m&&LAWMAP[m[1]]?LAWMAP[m[1]]+'第'+m[2]+'條':x};
const mem={};
const store={get(k){try{const v=localStorage.getItem(k);return v===null?mem[k]:v}catch(e){return mem[k]}},set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const BOXKEY='twlife_ethics_boxes_v1';
let boxes={};try{boxes=JSON.parse(store.get(BOXKEY)||'{}')}catch(e){boxes={}}
const saveBoxes=()=>store.set(BOXKEY,JSON.stringify(boxes));
function Flash(root,getCards){
  let queue=[],cur=null,flipped=false;
  function build(){const cs=getCards();queue=shuffle(cs.filter(c=>(boxes[c.key]||0)<1)).sort((a,b)=>(boxes[a.key]||0)-(boxes[b.key]||0));flipped=false}
  function render(){
    const cs=getCards(),n=cs.length,done=cs.filter(c=>(boxes[c.key]||0)>=1).length;
    let h='<div class="stat">已熟練 '+done+' / '+n+' 張（答對 1 次視為熟練，進度存在這個瀏覽器）</div><div class="bar"><i style="width:'+(n?done/n*100:0)+'%"></i></div>';
    if(!n){root.innerHTML=h+'<div class="card"><p>沒有可用的閃卡。</p></div>';return}
    if(!queue.length){root.innerHTML=h+'<div class="card"><h3>全部熟練了</h3><p>可以去做情境題，或重設後再來一輪。</p></div><div class="row"><button class="btn" data-a="reset">重設進度</button></div>';return}
    cur=queue[0];
    h+='<div class="card fc" tabindex="0" role="button" data-a="flip"><small>'+(cur.tag?esc(cur.tag)+'｜':'')+esc(lab(cur.ref))+'｜剩 '+queue.length+' 張</small><div class="q">'+esc(cur.front)+'</div>'+(flipped?'<div class="a"><span class="lab fact">答案</span>'+esc(cur.back)+'</div>':'<small>點一下翻面</small>')+'</div>';
    if(flipped)h+='<div class="row"><button class="btn bad" data-a="no">還不熟</button><button class="btn ok" data-a="yes">會了</button></div>';
    h+='<div class="row"><button class="btn" data-a="reset">重設進度</button></div>';
    root.innerHTML=h;
  }
  root.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
    if(a==='flip'){flipped=!flipped;render()}
    else if(a==='reset'){if(confirm('確定要清除這些閃卡的進度？')){getCards().forEach(c=>delete boxes[c.key]);saveBoxes();build();render()}}
    else if(cur&&(a==='yes'||a==='no')){const ok=a==='yes';boxes[cur.key]=ok?Math.min(1,(boxes[cur.key]||0)+1):0;saveBoxes();queue.shift();if(!ok||boxes[cur.key]<1)queue.splice(queue.length?Math.max(1,Math.min(queue.length,ok?6:3)):0,0,cur);flipped=false;render()}});
  root.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.fc')){e.preventDefault();flipped=!flipped;render()}});
  return {refresh(){build();render()}};
}
function Quiz(root,getItems,perRound){
  let items=[],score=0,answered=0,done=false;
  function draw(){
    const perms=items.map(s=>shuffle(s.opts.map((_,k)=>k)));
    root.innerHTML='<div class="stat" id="sc"></div>'+items.map((s,i)=>'<div class="card" data-i="'+i+'"><b>'+(i+1)+'. </b><span class="lab my">'+(s.tag?esc(s.tag)+' ':'')+esc(lab(s.ref))+'</span>'+esc(s.q)+perms[i].map((k,pos)=>'<button class="opt" data-o="'+k+'">'+String.fromCharCode(65+pos)+'. '+esc(s.opts[k])+'</button>').join('')+'<div class="why"></div></div>').join('')+'<div id="qend"></div>';
    score=0;answered=0;upd();
  }
  function upd(){const el=$('#sc',root);if(el)el.textContent='已作答 '+answered+' / '+items.length+'，答對 '+score+' 題';
    if(perRound&&answered===items.length&&items.length){$('#qend',root).innerHTML='<div class="card"><h3>這一組：'+score+' / '+items.length+'</h3></div><div class="row"><button class="btn pri" data-a="again">再來一組</button></div>'}}
  function again(){const all=getItems();items=perRound?shuffle(all).slice(0,perRound):all;draw()}
  root.addEventListener('click',e=>{
    const ag=e.target.closest('[data-a="again"]');if(ag){again();window.scrollTo(0,root.offsetTop-60);return}
    const b=e.target.closest('.opt');if(!b)return;const box=b.closest('.card');if(box.dataset.done)return;
    const s=items[+box.dataset.i],j=+b.dataset.o;box.dataset.done=1;answered++;if(j===s.ans)score++;
    let right='';$$('.opt',box).forEach((x,pos)=>{const k=+x.dataset.o;if(k===s.ans){x.classList.add('right');right=String.fromCharCode(65+pos)}else if(k===j)x.classList.add('wrong')});
    const w=$('.why',box);w.style.display='block';w.innerHTML=(j===s.ans?'答對了。':'答錯了，正解是 '+right+'。')+esc(s.why);upd()});
  return {refresh:again};
}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const LAWS=D.laws;
$('#h1').textContent=D.chapter+'｜'+D.title;
$('#intro').textContent=D.summary||'';
document.title=D.chapter+' '+D.title;
$('#foot').innerHTML='官方來源：'+LAWS.map(L=>esc(L.name)+'（'+esc(L.amended)+(L.kind==='press'?'發布':'修正')+'）'+(L.note?'｜'+esc(L.note)+'｜':'')+'<a href="'+esc(L.url)+'" target="_blank" rel="noopener">'+esc(L.url)+'</a>').join('<br>')+(D.scope?'<br>'+esc(D.scope):'')+'<br>條文原文取自法務部全國法規資料庫的公開資料鏡像（更新日 2026-10-16），尚未逐條與官網現行頁面比對；「白話」「口訣」「情境題」為編寫者整理，不是法條。法規可能再修正，請以官方最新公告為準；本內容不是法律意見。';
const TABS=[['read','條文速讀'],['table','對照表'],['cards','閃卡'],['quiz','情境題']];
const nav=$('#nav');
TABS.forEach(([id,name])=>{const b=document.createElement('button');b.textContent=name;b.setAttribute('role','tab');b.dataset.id=id;b.onclick=()=>show(id);nav.appendChild(b)});
let curTab='read';
function show(id,anchor){curTab=id;TABS.forEach(([t])=>$('#s-'+t).classList.toggle('on',t===id));$$('button',nav).forEach(b=>b.setAttribute('aria-selected',b.dataset.id===id));
  history.replaceState(null,'','#'+id+(anchor?'/'+anchor:''));
  if(anchor){const el=document.getElementById(anchor);if(el){const d=el.querySelector('details');el.scrollIntoView({block:'start'});el.classList.add('hl')}}else window.scrollTo(0,0)}
$('#s-read').innerHTML=(D.alerts||[]).map(a=>'<div class="banner"><b>'+esc(a.t)+'</b>'+esc(a.d)+'</div>').join('')+D.clauses.map(c=>{
  const off=c.official.map(p=>'<p>'+esc(p)+'</p>').join('');
  return '<div class="card" id="c'+esc(c.no)+'"><h3><span class="no">'+esc(lab(c.no))+'</span>'+esc(c.title)+'</h3>'
   +'<div class="pw"><span class="lab my">白話</span>'+fmt(c.plain)+'</div>'+factsT(c.facts)
   +(c.mnemonic?'<div class="mn"><span class="lab my">口訣</span>'+esc(c.mnemonic)+'</div>':'')
   +(c.tip?'<p><span class="lab hint">提醒</span>'+esc(c.tip)+'</p>':'')
   +(c.official.length?'<details><summary>展開官方條文原文</summary><div class="off"><span class="lab fact">原文</span>'+off+'</div></details>':'')+'</div>'}).join('');
$('#s-table').innerHTML=D.tables.map((t,i)=>'<h3 id="t'+i+'">'+esc(t.title)+'</h3><div class="tw"><table><thead><tr>'+t.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+t.rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>').join('');
const cardsAll=D.cards.map(c=>({key:'ch'+D.chNo+':'+c.id,ref:c.ref,front:c.front,back:c.back}));
const fl=Flash($('#s-cards'),()=>cardsAll);fl.refresh();
const qz=Quiz($('#s-quiz'),()=>D.scenarios,0);qz.refresh();
// 上下章
const N=D.nav||{};
function setLink(el,o,dir){if(o){el.href=o.file;el.textContent=dir==='p'?'← '+o.label:o.label+' →'}else{el.style.visibility='hidden'}}
setLink($('#prev'),N.prev,'p');setLink($('#next'),N.next,'n');
// 左右滑動：換分頁，到頭就換章
function step(d){const i=TABS.findIndex(t=>t[0]===curTab)+d;
  if(i<0){if(N.prev)location.href=N.prev.file+'#read';return}
  if(i>=TABS.length){if(N.next)location.href=N.next.file+'#read';return}
  show(TABS[i][0])}
let sx=0,sy=0,skip=false;
document.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;const el=e.target&&e.target.nodeType===1?e.target:(e.target&&e.target.parentElement);skip=!!(el&&el.closest('.tw,nav,input,.off'))},{passive:true});
document.addEventListener('touchend',e=>{if(skip)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>70&&Math.abs(dy)<45){step(dx<0?1:-1)}},{passive:true});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1)});
// 深層連結
function route(){const h=(location.hash||'#read').slice(1).split('/');show(TABS.some(t=>t[0]===h[0])?h[0]:'read',h[1]?decodeURIComponent(h[1]):null)}
window.addEventListener('hashchange',route);route();
</script></body></html>
