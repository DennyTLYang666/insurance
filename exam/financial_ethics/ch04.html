<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>第四章 客戶資料保密與個人資料保護</title><style>:root{--bg:#f7f6f2;--card:#fff;--ink:#222;--sub:#666;--line:#e3e0d8;--brand:#1f5f8b;--brand2:#e8f1f7;--ok:#2e7d32;--okbg:#e8f5e9;--bad:#b3261e;--badbg:#fdecea;--warn:#8a5a00;--warnbg:#fff4de}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
a{color:var(--brand)}
header{background:var(--brand);color:#fff;padding:12px 16px 14px}
header a{color:#fff;text-decoration:none;font-size:14px;opacity:.9}
header h1{margin:4px 0 0;font-size:20px;line-height:1.4}
header p{margin:6px 0 0;font-size:14px;opacity:.95}
.wrap{max-width:900px;margin:0 auto;padding:0 12px 60px}
.banner{background:var(--warnbg);color:var(--warn);border:1px solid #f0d9a8;border-radius:8px;padding:10px 12px;margin:12px 0;font-size:14px}
.banner b{margin-right:4px}
nav{position:sticky;top:0;background:var(--bg);z-index:5;display:flex;gap:6px;padding:10px 0;overflow-x:auto;border-bottom:1px solid var(--line)}
nav button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:15px;cursor:pointer;color:var(--ink)}
nav button[aria-selected="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
section{display:none;padding-top:14px}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 12px}
.card h3{margin:0 0 6px;font-size:17px}
.no{display:inline-block;background:var(--brand);color:#fff;border-radius:6px;padding:0 8px;margin-right:8px;font-size:14px}
.lab{display:inline-block;font-size:12px;border-radius:4px;padding:0 6px;margin-right:6px;vertical-align:1px}
.lab.fact{background:#e3f2e5;color:#1b5e20}.lab.my{background:#e8eaf6;color:#283593}.lab.hint{background:var(--warnbg);color:var(--warn)}
.mn{background:var(--brand2);border-radius:8px;padding:8px 10px;margin:8px 0}
details{margin:8px 0}details summary{cursor:pointer;color:var(--brand);font-size:15px}
.off{border-left:3px solid var(--brand);padding:2px 0 2px 10px;margin:8px 0;font-size:15px;color:#333}.off p{margin:4px 0}
table{border-collapse:collapse;width:100%;font-size:15px;background:#fff}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}th{background:var(--brand2)}
.tw{overflow-x:auto;margin-bottom:16px}
.fc{min-height:210px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.fc .q{font-size:19px;font-weight:600}.fc .a{font-size:16px;text-align:left;margin-top:8px}.fc small{color:var(--sub)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.btn{border:1px solid var(--brand);background:#fff;color:var(--brand);border-radius:8px;padding:9px 16px;font-size:16px;cursor:pointer}
.btn.pri{background:var(--brand);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0}.bar>i{display:block;height:100%;background:var(--ok)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;margin:6px 0;font-size:16px;cursor:pointer}
.opt.right{background:var(--okbg);border-color:var(--ok)}.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.why{display:none;background:var(--brand2);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:15px}
.stat{color:var(--sub);font-size:14px}
footer{color:var(--sub);font-size:13px;margin-top:24px}
.pager{display:flex;justify-content:space-between;gap:8px;margin-top:18px}.pager a{flex:1;text-align:center;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px;text-decoration:none;font-size:14px}
.hl{animation:hl 1.6s ease-out}@keyframes hl{0%{box-shadow:0 0 0 4px #ffd54f}100%{box-shadow:0 0 0 0 transparent}}
mark{background:#fff0a8;padding:0 1px}
.search{display:flex;gap:8px;margin:14px 0 6px}.search input{flex:1;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.res{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0;display:block;text-decoration:none;color:var(--ink)}
.res small{color:var(--sub)}.res b{color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.ch{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-decoration:none;color:var(--ink);display:block}
.ch:hover{border-color:var(--brand)}.ch h3{margin:0 0 4px;font-size:16px;color:var(--brand)}.ch p{margin:4px 0;font-size:14px}
.chip{display:inline-block;background:var(--brand2);color:#134;border-radius:999px;padding:0 9px;margin:2px 3px 2px 0;font-size:12.5px}
.filter{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.filter button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer}.filter button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
h2{font-size:18px;margin:24px 0 8px}

.pw{margin:6px 0}.pw p{margin:4px 0}.pl{margin:6px 0 6px 0;padding-left:20px}.pl li{margin:5px 0;line-height:1.7}.pl ul{margin:4px 0;padding-left:18px;list-style:disc}.pl ul li{margin:2px 0}.pl>li>b{color:#283593}
table.ft{font-size:14px;table-layout:fixed}table.ft td:first-child,table.ft th:first-child{font-weight:600;width:34%;word-break:break-all}table.ft td,table.ft th{word-break:break-word;padding:6px 7px}table.ft th{width:auto}
</style></head>

<script id="data" type="application/json">{"chapter": "第四章", "title": "客戶資料保密與個人資料保護", "laws": [{"pcode": "I0050021", "name": "個人資料保護法", "amended": "民國114年11月11日", "url": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0050021", "source": "法務部全國法規資料庫（經 kong0107/mojLawSplitJSON 公開鏡像取得，鏡像更新日 20261016）", "retrieved": "2026-11-03", "mirrorDate": "20251111", "note": "個資法於民國114年11月11日修正公布，其中第1-1、12、18、21至26、41、47至49、52、53、55條等的施行日由行政院另定；本章不收錄這些條文，只收錄不在這次修正範圍內的條文。考前請到法規資料庫確認施行狀況。"}, {"pcode": "G0380001", "name": "銀行法", "amended": "民國112年6月28日", "url": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380001", "source": "法務部全國法規資料庫（經 kong0107/mojLawSplitJSON 公開鏡像取得，鏡像更新日 20261016）", "retrieved": "2026-11-03", "mirrorDate": "20230628"}, {"pcode": "G0390002", "name": "保險法", "amended": "民國114年6月18日", "url": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0390002", "source": "法務部全國法規資料庫（經 kong0107/mojLawSplitJSON 公開鏡像取得，鏡像更新日 20261016）", "retrieved": "2026-11-03", "mirrorDate": "20250618"}, {"pcode": "G0400020", "name": "證券商負責人與業務人員管理規則", "amended": "民國114年7月18日", "url": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0400020", "source": "法務部全國法規資料庫（經 kong0107/mojLawSplitJSON 公開鏡像取得，鏡像更新日 20261016）", "retrieved": "2026-11-03", "mirrorDate": "20250718"}, {"pcode": "C0000001", "name": "中華民國刑法", "amended": "民國115年7月22日", "url": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=C0000001", "source": "法務部全國法規資料庫（經 kong0107/mojLawSplitJSON 公開鏡像取得，鏡像更新日 20261016）", "retrieved": "2026-11-03", "mirrorDate": "20260722"}], "alerts": [{"t": "個資法有一次修正還沒施行", "d": "個資法在民國114年11月11日修正公布，部分條文（含第12、18、21至26、41、47至49條等）施行日由行政院另定。我抓的資料庫鏡像已經把新條文寫進去，但這些新條文還不一定生效，所以我沒有收錄這些條文；收錄的第2、3、5、6、8、9、10、11、19、20、29、30、42條不在修正範圍內。是否已有施行公告，我沒有查到，考前請自行確認。"}, {"t": "後果的提醒（風險）", "d": "違反個資法致客戶受損，非公務機關要負損害賠償責任（除非能證明無故意或過失）；非法變更、刪除個人資料檔案，最重處5年以下有期徒刑。業務員無故洩漏因業務知悉的工商秘密，也可能觸犯刑法第317條；保險、證券、銀行各有各的保密規定。"}, {"t": "『可以拿客戶資料做什麼』的判斷順序", "d": "先看是不是特種個資（病歷、醫療、基因、性生活、健康檢查、犯罪前科，原則不得蒐集）；再看蒐集時有沒有告知；最後看利用有沒有超出『當初的特定目的』。"}], "clauses": [{"title": "什麼是個人資料；蒐集、處理、利用有什麼不同", "plain": "個人資料是指自然人的姓名、出生年月日、身分證字號、護照號碼、特徵、指紋、婚姻、家庭、教育、職業、病歷、醫療、基因、性生活、健康檢查、犯罪前科、聯絡方式、財務情況、社會活動，以及其他可以直接或間接識別個人的資料。蒐集是以任何方式取得；處理是為建立或利用檔案所做的記錄、輸入、儲存、編輯、更正、複製、檢索、刪除、輸出、連結、內部傳送；利用是把蒐集的資料做處理以外的使用。", "mnemonic": "取得是蒐集；整理檔案是處理；拿去用是利用。", "tip": "財務情況、聯絡方式、職業都是個人資料；客戶的保單內容、收入、受益人資料也在其中。", "official": ["本法用詞，定義如下：", "一、個人資料：指自然人之姓名、出生年月日、國民身分證統一編號、護照號碼、特徵、指紋、婚姻、家庭、教育、職業、病歷、醫療、基因、性生活、健康檢查、犯罪前科、聯絡方式、財務情況、社會活動及其他得以直接或間接方式識別該個人之資料。", "二、個人資料檔案：指依系統建立而得以自動化機器或其他非自動化方式檢索、整理之個人資料之集合。", "三、蒐集：指以任何方式取得個人資料。", "四、處理：指為建立或利用個人資料檔案所為資料之記錄、輸入、儲存、編輯、更正、複製、檢索、刪除、輸出、連結或內部傳送。", "五、利用：指將蒐集之個人資料為處理以外之使用。", "六、國際傳輸：指將個人資料作跨國（境）之處理或利用。", "七、公務機關：指依法行使公權力之中央或地方機關或行政法人。", "八、非公務機關：指前款以外之自然人、法人或其他團體。", "九、當事人：指個人資料之本人。"], "has_official": true, "no": "個2"}, {"title": "當事人五項權利，不能預先拋棄", "plain": "當事人對自己的個人資料，有五項權利：查詢或請求閱覽、請求製給複製本、請求補充或更正、請求停止蒐集處理或利用、請求刪除。這些權利不能預先拋棄，也不能用特約限制。", "mnemonic": "查、複製、補正、停止、刪除；不能拋棄。", "tip": "契約條款寫『客戶同意放棄一切個資權利』，無效。", "official": ["當事人就其個人資料依本法規定行使之下列權利，不得預先拋棄或以特約限制之：", "一、查詢或請求閱覽。", "二、請求製給複製本。", "三、請求補充或更正。", "四、請求停止蒐集、處理或利用。", "五、請求刪除。"], "has_official": true, "no": "個3"}, {"title": "誠信與比例原則", "plain": "蒐集、處理或利用個人資料，要尊重當事人權益，依誠實及信用方法為之，不得逾越特定目的的必要範圍，並且要與蒐集目的有正當合理的關聯。", "mnemonic": "誠信、不超出特定目的、有關聯。", "official": ["個人資料之蒐集、處理或利用，應尊重當事人之權益，依誠實及信用方法為之，不得逾越特定目的之必要範圍，並應與蒐集之目的具有正當合理之關聯。"], "has_official": true, "no": "個5"}, {"title": "特種個資原則上不得蒐集：病歷、醫療、基因、性生活、健康檢查、犯罪前科", "plain": "病歷、醫療、基因、性生活、健康檢查及犯罪前科的個人資料，原則上不得蒐集、處理或利用。例外有：法律明文規定；公務機關執行法定職務或非公務機關履行法定義務必要範圍內，且有適當安全維護措施；當事人自行公開或已合法公開；醫療、衛生或犯罪預防目的的統計或學術研究，且無從識別當事人；協助公務機關執行法定職務或非公務機關履行法定義務；經當事人書面同意（但超出特定目的必要範圍，或其他法律另有限制，或同意違反其意願的除外）。", "mnemonic": "六種特種個資，原則禁止；六個例外，書面同意是其一。", "tip": "保險業蒐集病歷、醫療、健康檢查資料，另有保險法第177-1條的特別規定。依本條例外蒐集時，也要準用第8、9條的告知規定。", "official": ["有關病歷、醫療、基因、性生活、健康檢查及犯罪前科之個人資料，不得蒐集、處理或利用。但有下列情形之一者，不在此限：", "一、法律明文規定。", "二、公務機關執行法定職務或非公務機關履行法定義務必要範圍內，且事前或事後有適當安全維護措施。", "三、當事人自行公開或其他已合法公開之個人資料。", "四、公務機關或學術研究機構基於醫療、衛生或犯罪預防之目的，為統計或學術研究而有必要，且資料經過提供者處理後或經蒐集者依其揭露方式無從識別特定之當事人。", "五、為協助公務機關執行法定職務或非公務機關履行法定義務必要範圍內，且事前或事後有適當安全維護措施。", "六、經當事人書面同意。但逾越特定目的之必要範圍或其他法律另有限制不得僅依當事人書面同意蒐集、處理或利用，或其同意違反其意願者，不在此限。", "依前項規定蒐集、處理或利用個人資料，準用第八條、第九條規定；其中前項第六款之書面同意，準用第七條第一項、第二項及第四項規定，並以書面為之。"], "has_official": true, "no": "個6"}, {"title": "向當事人蒐集資料時要告知六項", "plain": "向當事人蒐集個人資料時，要明確告知：一、機關或單位名稱；二、蒐集目的；三、個人資料類別；四、利用的期間、地區、對象與方式；五、當事人依第3條可行使的權利與方式；六、當事人可自由選擇提供時，不提供對其權益的影響。有六種情形可以免告知，例如依法律規定免告知、履行法定義務所必要、當事人明知應告知內容、非基於營利且對當事人顯無不利影響等。", "mnemonic": "誰蒐集、為何蒐集、什麼資料、怎麼用、有什麼權利、不給有什麼影響。", "facts": {"head": ["款", "告知事項"], "rows": [["1", "公務機關或非公務機關名稱"], ["2", "蒐集之目的"], ["3", "個人資料之類別"], ["4", "個人資料利用之期間、地區、對象及方式"], ["5", "當事人依第3條得行使之權利及方式"], ["6", "當事人得自由選擇提供時，不提供對其權益之影響"]]}, "official": ["公務機關或非公務機關依第十五條或第十九條規定向當事人蒐集個人資料時，應明確告知當事人下列事項：", "一、公務機關或非公務機關名稱。", "二、蒐集之目的。", "三、個人資料之類別。", "四、個人資料利用之期間、地區、對象及方式。", "五、當事人依第三條規定得行使之權利及方式。", "六、當事人得自由選擇提供個人資料時，不提供將對其權益之影響。", "有下列情形之一者，得免為前項之告知：", "一、依法律規定得免告知。", "二、個人資料之蒐集係公務機關執行法定職務或非公務機關履行法定義務所必要。", "三、告知將妨害公務機關執行法定職務。", "四、告知將妨害公共利益。", "五、當事人明知應告知之內容。", "六、個人資料之蒐集非基於營利之目的，且對當事人顯無不利之影響。"], "has_official": true, "no": "個8"}, {"title": "不是向本人蒐集的，要補告知資料來源", "plain": "蒐集的個人資料不是由當事人提供，要在處理或利用前，告知當事人資料來源以及第8條第1項第1至5款的事項。有例外，例如當事人自行公開或已合法公開、不能向當事人或法定代理人告知、統計或學術研究無從識別等。這個告知，可以在首次對當事人利用時一併為之。", "mnemonic": "間接蒐集，要告知來源。", "tip": "業務員從朋友、轉介紹那邊取得的客戶資料，就是『非由當事人提供』。", "official": ["公務機關或非公務機關依第十五條或第十九條規定蒐集非由當事人提供之個人資料，應於處理或利用前，向當事人告知個人資料來源及前條第一項第一款至第五款所列事項。", "有下列情形之一者，得免為前項之告知：", "一、有前條第二項所列各款情形之一。", "二、當事人自行公開或其他已合法公開之個人資料。", "三、不能向當事人或其法定代理人為告知。", "四、基於公共利益為統計或學術研究之目的而有必要，且該資料須經提供者處理後或蒐集者依其揭露方式，無從識別特定當事人者為限。", "五、大眾傳播業者基於新聞報導之公益目的而蒐集個人資料。", "第一項之告知，得於首次對當事人為利用時併同為之。"], "has_official": true, "no": "個9"}, {"title": "當事人請求查詢、閱覽、複製本", "plain": "當事人請求查詢、閱覽或製給複製本，機關要答覆。除非會妨害國家安全或重大利益、妨害公務機關執行法定職務、或妨害該蒐集機關或第三人的重大利益。", "mnemonic": "當事人請求，原則要答覆；有三種例外。", "official": ["公務機關或非公務機關應依當事人之請求，就其蒐集之個人資料，答覆查詢、提供閱覽或製給複製本。但有下列情形之一者，不在此限：", "一、妨害國家安全、外交及軍事機密、整體經濟利益或其他國家重大利益。", "二、妨害公務機關執行法定職務。", "三、妨害該蒐集機關或第三人之重大利益。"], "has_official": true, "no": "個10"}, {"title": "正確、更正、刪除", "plain": "要維護資料正確，主動或依請求更正、補充。正確性有爭議時，要停止處理或利用（執行職務或業務必須，或經當事人書面同意並註明爭議的除外）。特定目的消失或期限屆滿時，要刪除、停止處理或利用（執行職務或業務必須，或經當事人書面同意的除外）。違反本法蒐集處理利用的，要刪除、停止。可歸責於機關而未更正或補充的，更正補充後要通知曾提供利用的對象。", "mnemonic": "資料要正確；目的消失就刪；違法蒐集就刪；更正後通知接收者。", "official": ["公務機關或非公務機關應維護個人資料之正確，並應主動或依當事人之請求更正或補充之。", "個人資料正確性有爭議者，應主動或依當事人之請求停止處理或利用。但因執行職務或業務所必須，或經當事人書面同意，並經註明其爭議者，不在此限。", "個人資料蒐集之特定目的消失或期限屆滿時，應主動或依當事人之請求，刪除、停止處理或利用該個人資料。但因執行職務或業務所必須或經當事人書面同意者，不在此限。", "違反本法規定蒐集、處理或利用個人資料者，應主動或依當事人之請求，刪除、停止蒐集、處理或利用該個人資料。", "因可歸責於公務機關或非公務機關之事由，未為更正或補充之個人資料，應於更正或補充後，通知曾提供利用之對象。"], "has_official": true, "no": "個11"}, {"title": "非公務機關蒐集或處理（金融業）：要有特定目的＋八種理由之一", "plain": "非公務機關（含保險公司、銀行、證券商）蒐集或處理個人資料（特種個資除外），要有特定目的，並符合下列之一：法律明文規定；與當事人有契約或類似契約之關係且已採取適當安全措施；當事人自行公開或已合法公開；學術研究機構統計或研究（無從識別）；經當事人同意；為增進公共利益所必要；取自一般可得之來源（但當事人禁止處理利用有更重大利益的除外）；對當事人權益無侵害。", "mnemonic": "特定目的＋法律、契約、已公開、學術、同意、公益、一般來源、無侵害。", "tip": "與客戶有契約關係（例如保險契約）是常用的依據，但仍要『採取適當安全措施』。", "facts": {"head": ["款", "理由"], "rows": [["1", "法律明文規定"], ["2", "與當事人有契約或類似契約之關係，且已採取適當安全措施"], ["3", "當事人自行公開或已合法公開"], ["4", "學術研究機構基於公共利益為統計或研究，無從識別當事人"], ["5", "經當事人同意"], ["6", "為增進公共利益所必要"], ["7", "取自一般可得之來源（當事人禁止有更值得保護之重大利益者除外）"], ["8", "對當事人權益無侵害"]]}, "official": ["非公務機關對個人資料之蒐集或處理，除第六條第一項所規定資料外，應有特定目的，並符合下列情形之一者：", "一、法律明文規定。", "二、與當事人有契約或類似契約之關係，且已採取適當之安全措施。", "三、當事人自行公開或其他已合法公開之個人資料。", "四、學術研究機構基於公共利益為統計或學術研究而有必要，且資料經過提供者處理後或經蒐集者依其揭露方式無從識別特定之當事人。", "五、經當事人同意。", "六、為增進公共利益所必要。", "七、個人資料取自於一般可得之來源。但當事人對該資料之禁止處理或利用，顯有更值得保護之重大利益者，不在此限。", "八、對當事人權益無侵害。", "蒐集或處理者知悉或經當事人通知依前項第七款但書規定禁止對該資料之處理或利用時，應主動或依當事人之請求，刪除、停止處理或利用該個人資料。"], "has_official": true, "no": "個19"}, {"title": "利用不能超出特定目的；用來行銷，客戶拒絕就要停", "plain": "非公務機關利用個人資料，要在蒐集的特定目的必要範圍內。可以做特定目的外利用的情形有七種：法律明文規定、增進公共利益所必要、免除當事人生命身體自由財產上的危險、防止他人權益的重大危害、學術研究（無從識別）、經當事人同意、有利於當事人權益。用個資行銷，當事人表示拒絕接受行銷，要立即停止；首次行銷時要提供拒絕的方式，並支付所需費用。", "mnemonic": "不超目的；行銷可拒絕，拒絕就停；首次行銷要給拒絕管道。", "tip": "保單客戶資料拿去賣別的金融商品，是否超出『當初的特定目的』，要看當初告知的內容與同意範圍。客戶說不要行銷，就要立即停止，不能再打電話。", "official": ["非公務機關對個人資料之利用，除第六條第一項所規定資料外，應於蒐集之特定目的必要範圍內為之。但有下列情形之一者，得為特定目的外之利用：", "一、法律明文規定。", "二、為增進公共利益所必要。", "三、為免除當事人之生命、身體、自由或財產上之危險。", "四、為防止他人權益之重大危害。", "五、公務機關或學術研究機構基於公共利益為統計或學術研究而有必要，且資料經過提供者處理後或經蒐集者依其揭露方式無從識別特定之當事人。", "六、經當事人同意。", "七、有利於當事人權益。", "非公務機關依前項規定利用個人資料行銷者，當事人表示拒絕接受行銷時，應即停止利用其個人資料行銷。", "非公務機關於首次行銷時，應提供當事人表示拒絕接受行銷之方式，並支付所需費用。"], "has_official": true, "no": "個20"}, {"title": "非公務機關的損害賠償責任", "plain": "非公務機關違反本法，致個人資料遭不法蒐集、處理、利用或其他侵害當事人權利的，要負損害賠償責任。但能證明其無故意或過失的，不在此限。", "mnemonic": "違法致損害，要賠；舉證無故意過失才免責。", "official": ["非公務機關違反本法規定，致個人資料遭不法蒐集、處理、利用或其他侵害當事人權利者，負損害賠償責任。但能證明其無故意或過失者，不在此限。", "依前項規定請求賠償者，適用前條第二項至第六項規定。"], "has_official": true, "no": "個29"}, {"title": "損害賠償請求權時效：2年、5年", "plain": "損害賠償請求權，自請求權人知有損害及賠償義務人時起，2年間不行使而消滅；自損害發生時起，超過5年，也消滅。", "mnemonic": "知道起2年，發生起5年。", "facts": {"head": ["起算", "期間"], "rows": [["知有損害及賠償義務人時起", "2年"], ["自損害發生時起", "5年"]]}, "official": ["損害賠償請求權，自請求權人知有損害及賠償義務人時起，因二年間不行使而消滅；自損害發生時起，逾五年者，亦同。"], "has_official": true, "no": "個30"}, {"title": "非法變更、刪除個資檔案的刑責", "plain": "意圖為自己或第三人不法利益，或損害他人利益，對個人資料檔案非法變更、刪除或以其他非法方法，致妨害檔案正確而足生損害於他人的，處5年以下有期徒刑、拘役，或科或併科新臺幣100萬元以下罰金。", "mnemonic": "動資料檔案：5年、100萬。", "official": ["意圖為自己或第三人不法之利益或損害他人之利益，而對於個人資料檔案為非法變更、刪除或以其他非法方法，致妨害個人資料檔案之正確而足生損害於他人者，處五年以下有期徒刑、拘役或科或併科新臺幣一百萬元以下罰金。"], "has_official": true, "no": "個42"}, {"title": "銀行對客戶存放款匯款資料要保密", "plain": "銀行對客戶的存款、放款或匯款等有關資料，除了法律另有規定、對同一客戶逾期債權已轉銷呆帳達一定金額的呆帳資料、經檢察官提起公訴案件相關的逾期放款或催收款資料、其他主管機關規定的情形外，應保守秘密。銀行非依法院裁判或其他法律規定，不得接受第三人有關停止給付存款或匯款、扣留擔保物或保管物的請求。", "mnemonic": "客戶存放款資料要保密；例外：法律規定、呆帳、公訴、主管機關規定。", "tip": "連警察、第三人來要客戶資料，也要有法律依據，不是一句『我是警察』就可以給。", "official": ["銀行非依法院之裁判或其他法律之規定，不得接受第三人有關停止給付存款或匯款、扣留擔保物或保管物或其他類似之請求。", "銀行對於客戶之存款、放款或匯款等有關資料，除有下列情形之一者外，應保守秘密：", "一、法律另有規定。", "二、對同一客戶逾期債權已轉銷呆帳者，累計轉銷呆帳金額超過新臺幣五千萬元，或貸放後半年內發生逾期累計轉銷呆帳金額達新臺幣三千萬元以上，其轉銷呆帳資料。", "三、依第一百二十五條之二、第一百二十五條之三或第一百二十七條之一規定，經檢察官提起公訴之案件，與其有關之逾期放款或催收款資料。", "四、其他經主管機關規定之情形。"], "has_official": true, "no": "銀48"}, {"title": "保險業蒐集病歷、醫療、健康檢查資料：要本人書面同意", "plain": "經營或執行業務的保險業、保險代理人、經紀人、公證人；協助保險契約義務確定或履行而受保險業委託的法人；辦理爭議處理、車禍受害人補償而經許可設立的保險事務財團法人，經本人書面同意，可以蒐集、處理或利用病歷、醫療、健康檢查的個人資料。保險業為執行核保或理賠需要，處理利用依法蒐集的受益人姓名、出生日期、身分證字號、聯絡方式，可免依個資法第9條第1項告知。", "mnemonic": "保險業蒐集健康資料：要本人書面同意。", "tip": "個資法第6條把健康資料列為特種個資、原則禁止；保險法這一條就是保險業的特別例外，前提是『本人書面同意』。", "official": ["符合下列各款規定之一者，於經本人書面同意，得蒐集、處理或利用病歷、醫療、健康檢查之個人資料：", "一、依本法經營或執行業務之保險業、保險代理人、經紀人、公證人。", "二、協助保險契約義務之確定或履行而受保險業委託之法人。", "三、辦理爭議處理、車禍受害人補償業務而經主管機關許可設立之保險事務財團法人。", "前項書面同意方式、第一款業務範圍及其他應遵行事項，由主管機關訂定辦法管理之。", "保險業為執行核保或理賠作業需要，處理、利用依法所蒐集保險契約受益人之姓名、出生年月日、國民身分證統一編號及聯絡方式，得免為個人資料保護法第九條第一項之告知。", "中華民國一百年六月十四日修正之本條文施行前，第一項各款之人已依法蒐集之病歷、醫療、健康檢查之個人資料，於修正施行後，得繼續處理及為符合蒐集之特定目的必要範圍內利用。"], "has_official": true, "no": "保177-1"}, {"title": "證券商業務人員：誠信，不得洩漏客戶委託事項", "plain": "證券商負責人及業務人員執行業務，應本誠實及信用原則。除其他法令另有規定外，不得：為獲取投機利益，以職務上知悉的消息，從事上市或上櫃有價證券買賣；非依法令所為的查詢，洩漏客戶委託事項及其他職務上獲悉的秘密。", "mnemonic": "不能用職務消息炒股；不能洩漏客戶委託事項。", "official": ["證券商負責人及業務人員執行業務應本誠實及信用原則。", "證券商之負責人及業務人員，除其他法令另有規定外，不得有下列行為：", "一、為獲取投機利益之目的，以職務上所知悉之消息，從事上市或上櫃有價證券買賣之交易活動。", "二、非應依法令所為之查詢，洩漏客戶委託事項及其他職務上所獲悉之秘密。", "三、受理客戶對買賣有價證券之種類、數量、價格及買進或賣出之全權委託。", "四、對客戶作贏利之保證或分享利益之證券買賣。", "五、約定與客戶共同承擔買賣有價證券之交易損益，而從事證券買賣。", "六、接受客戶委託買賣有價證券時，同時以自己之計算為買入或賣出之相對行為。", "七、利用客戶名義或帳戶，申購、買賣有價證券。", "八、以他人或親屬名義供客戶申購、買賣有價證券。", "九、與客戶有借貸款項、有價證券或為借貸款項、有價證券之媒介情事。", "十、辦理承銷、自行或受託買賣有價證券時，有隱瞞、詐欺或其他足以致人誤信之行為。", "十一、挪用或代客戶保管有價證券、款項、印鑑或存摺。", "十二、受理未經辦妥受託契約之客戶，買賣有價證券。", "十三、未依據客戶委託事項及條件，執行有價證券之買賣。", "十四、向客戶或不特定多數人提供某種有價證券將上漲或下跌之判斷，以勸誘買賣。", "十五、向不特定多數人推介買賣特定之股票。但因承銷有價證券所需者，不在此限。", "十六、接受客戶以同一或不同帳戶為同種有價證券買進與賣出或賣出與買進相抵之交割。但依法令辦理信用交易資券相抵交割及接受客戶以同一帳戶於同一營業日為現款買進有價證券成交後，以現券賣出同種類有價證券，就相同數量部分相抵交割者，不在此限。", "十七、代理他人開戶、申購、買賣或交割有價證券。但為委託人之法定代理人，不在此限。", "十八、受理本公司之董事、監察人、受僱人代理他人開戶、申購、買賣或交割有價證券。", "十九、受理非本人開戶。但本會另有規定者，不在此限。", "二十、受理非本人或未具客戶委任書之代理人申購、買賣或交割有價證券。但證券商依其與客戶及證券投資顧問事業共同簽訂之三方契約，接受證券投資顧問事業由電腦系統自動為客戶執行自動再平衡交易者，不在此限。", "二十一、知悉客戶有利用公開發行公司尚未公開而對其股票價格有重大影響之消息或有操縱市場行為之意圖，仍接受委託買賣。", "二十二、辦理有價證券承銷業務之人員與發行公司或其相關人員間有獲取不當利益之約定。", "二十三、招攬、媒介、促銷未經核准之有價證券或其衍生性商品。", "二十四、其他違反證券管理法令或經本會規定不得為之行為。", "前項人員執行業務，對證券商管理法令規定不得為之行為，亦不得為之。", "前二項之規定於證券商其他受僱人準用之。"], "has_official": true, "no": "證商18"}, {"title": "洩漏因業務知悉的工商秘密", "plain": "依法令或契約有守因業務知悉或持有工商秘密義務的人，無故洩漏的，處1年以下有期徒刑、拘役或3萬元以下罰金。", "mnemonic": "有保密義務的人洩工商秘密：1年以下。", "tip": "金融業從業人員與公司、客戶之間有保密契約或法令義務，客戶的工商秘密也可能落在這條。", "official": ["依法令或契約有守因業務知悉或持有工商秘密之義務而無故洩漏之者，處一年以下有期徒刑、拘役或三萬元以下罰金。"], "has_official": true, "no": "刑317"}, {"title": "洩漏因電腦設備知悉的他人秘密", "plain": "無故洩漏因利用電腦或其他相關設備知悉或持有他人秘密的，處2年以下有期徒刑、拘役或1萬5千元以下罰金。", "mnemonic": "電腦系統看到的客戶秘密，不能洩漏：2年以下。", "tip": "系統裡看得到客戶資料，不代表可以拿出去用。", "official": ["無故洩漏因利用電腦或其他相關設備知悉或持有他人之秘密者，處二年以下有期徒刑、拘役或一萬五千元以下罰金。"], "has_official": true, "no": "刑318-1"}], "tables": [{"title": "個資法：蒐集前告知六項 vs 當事人五項權利", "head": ["類型", "項目"], "rows": [["蒐集時要告知（第8條）", "名稱、蒐集目的、資料類別、利用期間地區對象方式、當事人可行使的權利、不提供的影響"], ["當事人五項權利（第3條）", "查詢或閱覽；複製本；補充或更正；停止蒐集處理利用；刪除"], ["特種個資（第6條）", "病歷、醫療、基因、性生活、健康檢查、犯罪前科"]]}, {"title": "各業保密規定一覽", "head": ["對象", "規定", "依據"], "rows": [["銀行", "客戶存款、放款、匯款資料要保密，例外：法律規定、呆帳、公訴、主管機關規定", "銀行法第48條"], ["保險業", "蒐集病歷、醫療、健康檢查資料要本人書面同意", "保險法第177-1條"], ["證券商業務人員", "不得洩漏客戶委託事項及職務上獲悉的秘密", "證券商負責人與業務人員管理規則第18條"], ["有保密義務者", "無故洩漏因業務知悉的工商秘密，1年以下", "刑法第317條"], ["電腦設備", "無故洩漏因電腦設備知悉的他人秘密，2年以下", "刑法第318-1條"]]}, {"title": "數字速記：個資法", "head": ["條", "數字", "什麼事"], "rows": [["8", "6項", "蒐集前要告知的事項"], ["3", "5項", "當事人不能預先拋棄的權利"], ["6", "6種", "原則禁止蒐集的特種個資"], ["19", "8款", "非公務機關蒐集處理的理由（特種個資除外）"], ["20", "7款", "特定目的外利用的情形"], ["30", "2年、5年", "損害賠償請求權時效"], ["42", "5年以下、100萬以下", "非法變更刪除個資檔案"]]}], "cards": [{"ref": "個2", "front": "財務情況、聯絡方式、職業算不算個人資料？", "back": "算，都是個資法第2條列舉的個人資料。", "id": 1}, {"ref": "個3", "front": "當事人對個資有哪五項權利？能不能預先拋棄？", "back": "查詢閱覽、製給複製本、補充更正、停止蒐集處理利用、刪除；不能預先拋棄，也不能以特約限制。", "id": 2}, {"ref": "個5", "front": "蒐集個資不得逾越什麼？", "back": "不得逾越特定目的之必要範圍，並要與目的有正當合理的關聯。", "id": 3}, {"ref": "個6", "front": "哪六種個資原則上不得蒐集、處理、利用？", "back": "病歷、醫療、基因、性生活、健康檢查、犯罪前科。", "id": 4}, {"ref": "個6", "front": "特種個資有哪些例外之一是『經當事人書面同意』？有沒有但書？", "back": "有。但逾越特定目的必要範圍、其他法律另有限制，或同意違反其意願的，不得僅依書面同意。", "id": 5}, {"ref": "個8", "front": "向當事人蒐集個資時，要告知哪六項？", "back": "名稱、蒐集目的、資料類別、利用期間地區對象方式、當事人權利及方式、不提供對權益的影響。", "id": 6}, {"ref": "個9", "front": "個資不是向本人蒐集的，要告知什麼？何時告知？", "back": "告知資料來源與第8條第1至5款事項；於處理或利用前，或於首次利用時一併告知。", "id": 7}, {"ref": "個19", "front": "非公務機關蒐集或處理一般個資，要有什麼，加上哪些理由之一？", "back": "要有特定目的；再符合法律、契約、已公開、學術、同意、公益、一般來源、無侵害等八款之一。", "id": 8}, {"ref": "個20", "front": "客戶表示拒絕接受行銷，要怎麼辦？", "back": "要立即停止利用其個資行銷；首次行銷時要提供拒絕方式並支付所需費用。", "id": 9}, {"ref": "個29", "front": "個資外洩致損害，非公務機關什麼情況可以免責？", "back": "能證明其無故意或過失。", "id": 10}, {"ref": "個30", "front": "個資損害賠償請求權的時效？", "back": "知有損害及賠償義務人時起2年；損害發生時起5年。", "id": 11}, {"ref": "銀48", "front": "銀行對客戶存款、放款、匯款資料，原則上要怎麼處理？", "back": "保守秘密；例外為法律另有規定、特定呆帳、公訴案件相關逾期放款或催收款，以及主管機關規定的情形。", "id": 12}, {"ref": "保177-1", "front": "保險業蒐集被保險人的病歷、醫療、健康檢查資料，要取得什麼？", "back": "本人書面同意。", "id": 13}, {"ref": "證商18", "front": "證券商業務人員可以洩漏客戶委託事項嗎？", "back": "不可以（非依法令所為之查詢）。", "id": 14}, {"ref": "刑317", "front": "有保密義務的人無故洩漏業務上知悉的工商秘密，刑責？", "back": "1年以下有期徒刑、拘役或3萬元以下罰金（刑法第317條）。", "id": 15}], "scenarios": [{"ref": "個6", "q": "保險業務員為了評估客戶投保，想蒐集客戶的病歷與健康檢查資料。依個資法第6條與保險法第177-1條，下列何者最正確？", "opts": ["任何人都可以任意蒐集", "保險業經本人書面同意，得蒐集、處理或利用", "只要客戶口頭說好就可以", "完全禁止，不論客戶同不同意"], "ans": 1, "why": "個資法第6條原則禁止蒐集病歷、醫療、健康檢查資料，但保險法第177-1條規定：保險業、代理人、經紀人、公證人等，經本人書面同意，得蒐集、處理或利用。要書面，不是口頭。"}, {"ref": "個8", "q": "向客戶蒐集個資時，下列哪一項不是個資法第8條規定『應明確告知』的內容？", "opts": ["蒐集之目的", "個人資料利用之期間、地區、對象及方式", "當事人得行使的權利及方式", "業務員的年度業績"], "ans": 3, "why": "第8條要告知：名稱、蒐集目的、資料類別、利用的期間地區對象方式、當事人權利及方式、不提供對權益的影響。業績不在其中。"}, {"ref": "個9", "q": "業務員從同事轉介紹得到一位潛在客戶的聯絡資料（並非由客戶本人提供）。依個資法，下列何者正確？", "opts": ["不需要任何告知", "於處理或利用前，應告知資料來源與蒐集單位等事項（有例外），可於首次利用時一併告知", "永遠不可以使用", "只要客戶親友同意就可以"], "ans": 1, "why": "第9條：非由當事人提供的個資，要在處理或利用前告知資料來源及第8條第1至5款事項；告知可在首次對當事人利用時一併為之；另有免告知的例外。"}, {"ref": "個20", "q": "某保戶明確表示『不要再打電話推銷』。保險公司仍持續打電話行銷。依個資法第20條，這樣的行為？", "opts": ["沒問題，因為是公司客戶", "違反規定，當事人拒絕接受行銷時，應即停止利用其個資行銷", "只要加一個月緩衝期就可以", "客戶要書面申請才有效"], "ans": 1, "why": "第20條第2項：非公務機關利用個資行銷，當事人表示拒絕接受行銷時，應即停止利用其個人資料行銷。"}, {"ref": "個3", "q": "保險契約條款寫『要保人同意放棄個資法規定的所有權利』。這個條款的效力是？", "opts": ["有效，因為是雙方約定", "無效，個資法第3條的權利不得預先拋棄或以特約限制", "有效，只要公司事先說明", "要經主管機關核准才生效"], "ans": 1, "why": "第3條：當事人的查詢、複製、補正、停止、刪除等權利，不得預先拋棄或以特約限制。"}, {"ref": "個30", "q": "客戶發現個資被不當洩漏，依個資法第30條，損害賠償請求權時效，下列何者正確？", "opts": ["知有損害及賠償義務人時起2年；損害發生時起5年", "一律10年", "知道時起5年", "只有5年，沒有2年的規定"], "ans": 0, "why": "第30條：自請求權人知有損害及賠償義務人時起2年間不行使而消滅；自損害發生時起逾5年者亦同。"}, {"ref": "銀48", "q": "警察到銀行，口頭要求提供某客戶的存款資料，沒有出示任何法律依據。銀行應如何處理？", "opts": ["直接提供，因為是警察", "依銀行法第48條，除有法律依據等例外外，應保守秘密", "通知客戶本人後就可以提供", "送給任何主管機關人員都可以"], "ans": 1, "why": "銀行法第48條：客戶存款、放款、匯款等資料，除法律另有規定等法定例外外，應保守秘密。"}, {"ref": "證商18", "q": "證券商業務人員向朋友透露某客戶的委託下單內容。這違反什麼規定？", "opts": ["沒有違反，因為只是閒聊", "違反證券商負責人與業務人員管理規則第18條：不得洩漏客戶委託事項及職務上獲悉的秘密", "只是違反公司內規", "只要客戶沒損失就沒事"], "ans": 1, "why": "第18條第2項第2款：非依法令所為的查詢，不得洩漏客戶委託事項及其他職務上所獲悉的秘密。"}, {"ref": "個19", "q": "保險公司依保險契約向客戶蒐集基本聯絡資料，屬於個資法第19條的哪一種情形？", "opts": ["第2款：與當事人有契約或類似契約之關係，且已採取適當之安全措施", "第7款：取自一般可得之來源", "第6款：增進公共利益所必要", "第8款：對當事人權益無侵害（只要沒有契約就可以蒐集）"], "ans": 0, "why": "第19條第1項第2款：與當事人有契約或類似契約之關係，且已採取適當之安全措施，是金融業最常用的依據之一。"}, {"ref": "刑317", "q": "某銀行行員因業務知悉客戶的商業秘密，並依契約負有保密義務，卻無故洩漏給客戶的競爭對手。可能觸犯？", "opts": ["刑法第317條洩漏業務上知悉之工商秘密罪", "沒有任何法律責任", "只有民事責任，沒有刑責", "只違反公司內規"], "ans": 0, "why": "刑法第317條：依法令或契約有守因業務知悉或持有工商秘密義務而無故洩漏的，處1年以下有期徒刑、拘役或3萬元以下罰金。"}], "chNo": "04", "summary": "客戶的資料能不能蒐集、怎麼告知、能不能拿去行銷、洩漏了要負什麼責任。包括個資法（含病歷、健康檢查等特種個資）、銀行法第48條的客戶資料保密、保險法第177-1條（保險業蒐集病歷、健康資料的特別規定）、證券商業務人員不得洩漏客戶委託事項，以及刑法的洩密罪。", "scope": "收錄個人資料保護法第2、3、5、6、8、9、10、11、19、20、29、30、42條；銀行法第48條；保險法第177-1條；證券商負責人與業務人員管理規則第18條；中華民國刑法第317、318-1條。", "nav": {"prev": {"file": "ch03.html", "label": "第3章 保險招攬：業務員、經紀人、代理人與公證人"}, "next": {"file": "ch05.html", "label": "第5章 洗錢防制：確認客戶身分、申報與刑責"}}}</script>
<script>const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>{t=String(t||'');const ss=t.split(/(?<=。)/).map(x=>x.trim()).filter(Boolean);if(t.length<=90||ss.length<2&&t.indexOf('；')<0)return '<p>'+esc(t)+'</p>';
  const li=s=>{s=s.replace(/。$/,'');const m=s.match(/^([^：；]{1,40})：(.+)$/);if(m&&m[2].split('；').length>=3)return '<li><b>'+esc(m[1])+'</b><ul>'+m[2].split('；').map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></li>';
    const parts=s.split('；');if(parts.length>=3)return '<li>'+parts.map(x=>esc(x)).join('<br>')+'</li>';return '<li>'+esc(s)+'</li>'};
  return '<ul class="pl">'+ss.map(li).join('')+'</ul>'};
const factsT=f=>f?'<div class="tw"><table class="ft"><thead><tr>'+f.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+f.rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'';
const LAWMAP={"金保": "金融消費者保護法", "適": "適合度辦法", "說": "說明揭露辦法", "廣": "廣告辦法", "個": "個資法", "洗": "洗錢防制法", "洗辦": "金融機構防制洗錢辦法", "保": "保險法", "規": "業務員管理規則", "招": "招攬核保理賠辦法", "證": "證券交易法", "證商": "證券商負責人與業務人員管理規則", "期商": "期貨商負責人及業務員管理規則", "投顧": "投信投顧法", "投保": "投保法", "信": "信託法", "信業": "信託業法", "銀": "銀行法", "刑": "刑法", "貪": "貪污治罪條例", "獎": "檢舉貪污獎勵辦法"};
const lab=x=>{const m=String(x).match(/^([^0-9]+)([0-9]+(?:-[0-9]+)?)$/);return m&&LAWMAP[m[1]]?LAWMAP[m[1]]+'第'+m[2]+'條':x};
const mem={};
const store={get(k){try{const v=localStorage.getItem(k);return v===null?mem[k]:v}catch(e){return mem[k]}},set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const BOXKEY='twlife_ethics_boxes_v1';
let boxes={};try{boxes=JSON.parse(store.get(BOXKEY)||'{}')}catch(e){boxes={}}
const saveBoxes=()=>store.set(BOXKEY,JSON.stringify(boxes));
function Flash(root,getCards){
  let queue=[],cur=null,flipped=false;
  function build(){const cs=getCards();queue=shuffle(cs.filter(c=>(boxes[c.key]||0)<1)).sort((a,b)=>(boxes[a.key]||0)-(boxes[b.key]||0));flipped=false}
  function render(){
    const cs=getCards(),n=cs.length,done=cs.filter(c=>(boxes[c.key]||0)>=1).length;
    let h='<div class="stat">已熟練 '+done+' / '+n+' 張（答對 1 次視為熟練，進度存在這個瀏覽器）</div><div class="bar"><i style="width:'+(n?done/n*100:0)+'%"></i></div>';
    if(!n){root.innerHTML=h+'<div class="card"><p>沒有可用的閃卡。</p></div>';return}
    if(!queue.length){root.innerHTML=h+'<div class="card"><h3>全部熟練了</h3><p>可以去做情境題，或重設後再來一輪。</p></div><div class="row"><button class="btn" data-a="reset">重設進度</button></div>';return}
    cur=queue[0];
    h+='<div class="card fc" tabindex="0" role="button" data-a="flip"><small>'+(cur.tag?esc(cur.tag)+'｜':'')+esc(lab(cur.ref))+'｜剩 '+queue.length+' 張</small><div class="q">'+esc(cur.front)+'</div>'+(flipped?'<div class="a"><span class="lab fact">答案</span>'+esc(cur.back)+'</div>':'<small>點一下翻面</small>')+'</div>';
    if(flipped)h+='<div class="row"><button class="btn bad" data-a="no">還不熟</button><button class="btn ok" data-a="yes">會了</button></div>';
    h+='<div class="row"><button class="btn" data-a="reset">重設進度</button></div>';
    root.innerHTML=h;
  }
  root.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
    if(a==='flip'){flipped=!flipped;render()}
    else if(a==='reset'){if(confirm('確定要清除這些閃卡的進度？')){getCards().forEach(c=>delete boxes[c.key]);saveBoxes();build();render()}}
    else if(cur&&(a==='yes'||a==='no')){const ok=a==='yes';boxes[cur.key]=ok?Math.min(1,(boxes[cur.key]||0)+1):0;saveBoxes();queue.shift();if(!ok||boxes[cur.key]<1)queue.splice(queue.length?Math.max(1,Math.min(queue.length,ok?6:3)):0,0,cur);flipped=false;render()}});
  root.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.fc')){e.preventDefault();flipped=!flipped;render()}});
  return {refresh(){build();render()}};
}
function Quiz(root,getItems,perRound){
  let items=[],score=0,answered=0,done=false;
  function draw(){
    const perms=items.map(s=>shuffle(s.opts.map((_,k)=>k)));
    root.innerHTML='<div class="stat" id="sc"></div>'+items.map((s,i)=>'<div class="card" data-i="'+i+'"><b>'+(i+1)+'. </b><span class="lab my">'+(s.tag?esc(s.tag)+' ':'')+esc(lab(s.ref))+'</span>'+esc(s.q)+perms[i].map((k,pos)=>'<button class="opt" data-o="'+k+'">'+String.fromCharCode(65+pos)+'. '+esc(s.opts[k])+'</button>').join('')+'<div class="why"></div></div>').join('')+'<div id="qend"></div>';
    score=0;answered=0;upd();
  }
  function upd(){const el=$('#sc',root);if(el)el.textContent='已作答 '+answered+' / '+items.length+'，答對 '+score+' 題';
    if(perRound&&answered===items.length&&items.length){$('#qend',root).innerHTML='<div class="card"><h3>這一組：'+score+' / '+items.length+'</h3></div><div class="row"><button class="btn pri" data-a="again">再來一組</button></div>'}}
  function again(){const all=getItems();items=perRound?shuffle(all).slice(0,perRound):all;draw()}
  root.addEventListener('click',e=>{
    const ag=e.target.closest('[data-a="again"]');if(ag){again();window.scrollTo(0,root.offsetTop-60);return}
    const b=e.target.closest('.opt');if(!b)return;const box=b.closest('.card');if(box.dataset.done)return;
    const s=items[+box.dataset.i],j=+b.dataset.o;box.dataset.done=1;answered++;if(j===s.ans)score++;
    let right='';$$('.opt',box).forEach((x,pos)=>{const k=+x.dataset.o;if(k===s.ans){x.classList.add('right');right=String.fromCharCode(65+pos)}else if(k===j)x.classList.add('wrong')});
    const w=$('.why',box);w.style.display='block';w.innerHTML=(j===s.ans?'答對了。':'答錯了，正解是 '+right+'。')+esc(s.why);upd()});
  return {refresh:again};
}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const LAWS=D.laws;
$('#h1').textContent=D.chapter+'｜'+D.title;
$('#intro').textContent=D.summary||'';
document.title=D.chapter+' '+D.title;
$('#foot').innerHTML='官方來源：'+LAWS.map(L=>esc(L.name)+'（'+esc(L.amended)+(L.kind==='press'?'發布':'修正')+'）'+(L.note?'｜'+esc(L.note)+'｜':'')+'<a href="'+esc(L.url)+'" target="_blank" rel="noopener">'+esc(L.url)+'</a>').join('<br>')+(D.scope?'<br>'+esc(D.scope):'')+'<br>條文原文取自法務部全國法規資料庫的公開資料鏡像（更新日 2026-10-16），尚未逐條與官網現行頁面比對；「白話」「口訣」「情境題」為編寫者整理，不是法條。法規可能再修正，請以官方最新公告為準；本內容不是法律意見。';
const TABS=[['read','條文速讀'],['table','對照表'],['cards','閃卡'],['quiz','情境題']];
const nav=$('#nav');
TABS.forEach(([id,name])=>{const b=document.createElement('button');b.textContent=name;b.setAttribute('role','tab');b.dataset.id=id;b.onclick=()=>show(id);nav.appendChild(b)});
let curTab='read';
function show(id,anchor){curTab=id;TABS.forEach(([t])=>$('#s-'+t).classList.toggle('on',t===id));$$('button',nav).forEach(b=>b.setAttribute('aria-selected',b.dataset.id===id));
  history.replaceState(null,'','#'+id+(anchor?'/'+anchor:''));
  if(anchor){const el=document.getElementById(anchor);if(el){const d=el.querySelector('details');el.scrollIntoView({block:'start'});el.classList.add('hl')}}else window.scrollTo(0,0)}
$('#s-read').innerHTML=(D.alerts||[]).map(a=>'<div class="banner"><b>'+esc(a.t)+'</b>'+esc(a.d)+'</div>').join('')+D.clauses.map(c=>{
  const off=c.official.map(p=>'<p>'+esc(p)+'</p>').join('');
  return '<div class="card" id="c'+esc(c.no)+'"><h3><span class="no">'+esc(lab(c.no))+'</span>'+esc(c.title)+'</h3>'
   +'<div class="pw"><span class="lab my">白話</span>'+fmt(c.plain)+'</div>'+factsT(c.facts)
   +(c.mnemonic?'<div class="mn"><span class="lab my">口訣</span>'+esc(c.mnemonic)+'</div>':'')
   +(c.tip?'<p><span class="lab hint">提醒</span>'+esc(c.tip)+'</p>':'')
   +(c.official.length?'<details><summary>展開官方條文原文</summary><div class="off"><span class="lab fact">原文</span>'+off+'</div></details>':'')+'</div>'}).join('');
$('#s-table').innerHTML=D.tables.map((t,i)=>'<h3 id="t'+i+'">'+esc(t.title)+'</h3><div class="tw"><table><thead><tr>'+t.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+t.rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>').join('');
const cardsAll=D.cards.map(c=>({key:'ch'+D.chNo+':'+c.id,ref:c.ref,front:c.front,back:c.back}));
const fl=Flash($('#s-cards'),()=>cardsAll);fl.refresh();
const qz=Quiz($('#s-quiz'),()=>D.scenarios,0);qz.refresh();
// 上下章
const N=D.nav||{};
function setLink(el,o,dir){if(o){el.href=o.file;el.textContent=dir==='p'?'← '+o.label:o.label+' →'}else{el.style.visibility='hidden'}}
setLink($('#prev'),N.prev,'p');setLink($('#next'),N.next,'n');
// 左右滑動：換分頁，到頭就換章
function step(d){const i=TABS.findIndex(t=>t[0]===curTab)+d;
  if(i<0){if(N.prev)location.href=N.prev.file+'#read';return}
  if(i>=TABS.length){if(N.next)location.href=N.next.file+'#read';return}
  show(TABS[i][0])}
let sx=0,sy=0,skip=false;
document.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;const el=e.target&&e.target.nodeType===1?e.target:(e.target&&e.target.parentElement);skip=!!(el&&el.closest('.tw,nav,input,.off'))},{passive:true});
document.addEventListener('touchend',e=>{if(skip)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>70&&Math.abs(dy)<45){step(dx<0?1:-1)}},{passive:true});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1)});
// 深層連結
function route(){const h=(location.hash||'#read').slice(1).split('/');show(TABS.some(t=>t[0]===h[0])?h[0]:'read',h[1]?decodeURIComponent(h[1]):null)}
window.addEventListener('hashchange',route);route();
</script></body></html>
