<script id="data" type="application/json">{"chapter": "第七章", "title": "利益衝突與忠實義務：信託、銀行與不得保證獲利", "laws": [{"pcode": "I0020024", "name": "信託法", "amended": "民國98年12月30日", "url": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=I0020024", "source": "法務部全國法規資料庫（經 kong0107/mojLawSplitJSON 公開鏡像取得，鏡像更新日 20261016）", "retrieved": "2026-11-03", "mirrorDate": "20091230"}, {"pcode": "G0310027", "name": "信託業法", "amended": "民國107年1月31日", "url": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0310027", "source": "法務部全國法規資料庫（經 kong0107/mojLawSplitJSON 公開鏡像取得，鏡像更新日 20261016）", "retrieved": "2026-11-03", "mirrorDate": "20180131"}, {"pcode": "G0380001", "name": "銀行法", "amended": "民國112年6月28日", "url": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380001", "source": "法務部全國法規資料庫（經 kong0107/mojLawSplitJSON 公開鏡像取得，鏡像更新日 20261016）", "retrieved": "2026-11-03", "mirrorDate": "20230628"}], "alerts": [{"t": "這章對應職業道德題的『利益衝突原則』", "d": "職業道德題常問：受託管理運用財產要和自有財產『分別管理』（信託法第24條）；受託人不得以任何名義享有信託利益（第34條）；信託業『不得承諾擔保本金或最低收益率』（信託業法第31條）；行員不得向客戶收取佣金或不當利益（銀行法第35條）。"}, {"t": "後果的提醒（風險）", "d": "信託業未分別管理信託財產，行為負責人最重處6個月以上5年以下有期徒刑；將信託財產轉為自有財產，最重處1年以上7年以下有期徒刑，得併科1,000萬元以下罰金（信託業法第51條）。銀行負責人或職員向客戶收取佣金、酬金或不當利益，處3年以下有期徒刑、拘役，或科或併科500萬元以下罰金（銀行法第127條）。"}, {"t": "『信託』與『信託業』的差別", "d": "信託法規範所有受託人（民間、律師、家人都可能）；信託業法規範『經主管機關許可的信託業』（銀行信託部、信託公司等）；銀行法則規範銀行本身的授信、保密與行員行為。"}], "clauses": [{"title": "受託人要以善良管理人的注意處理信託事務", "plain": "受託人應依信託本旨，以善良管理人的注意，處理信託事務。", "mnemonic": "依信託本旨，善良管理人之注意。", "official": ["受託人應依信託本旨，以善良管理人之注意，處理信託事務。"], "has_official": true, "no": "信22"}, {"title": "信託財產與自有財產要分別管理", "plain": "受託人要把信託財產與自己的自有財產及其他信託財產分別管理；信託財產是金錢的，可以分別記帳。違反而獲得利益的，委託人或受益人可請求把利益歸於信託財產；致信託財產受損的，受託人即使沒有過失也要負損害賠償責任（但能證明縱有分別管理仍不免發生損害的除外）。請求權自知悉時起2年、事實發生時起逾5年消滅。", "mnemonic": "信託財產、自有財產分開；違反所得歸信託；無過失也要賠；2年5年。", "facts": {"head": ["重點", "規定"], "rows": [["原則", "信託財產與自有財產、其他信託財產分別管理（金錢可分別記帳）"], ["違反獲利", "委託人或受益人可請求將利益歸於信託財產"], ["致信託財產受損", "受託人雖無過失，亦應負損害賠償責任（能證明縱分別管理仍不免損害者除外）"], ["請求權時效", "知悉之日起2年；事實發生時起逾5年"]]}, "official": ["受託人應將信託財產與其自有財產及其他信託財產分別管理。信託財產為金錢者，得以分別記帳方式為之。", "前項不同信託之信託財產間，信託行為訂定得不必分別管理者，從其所定。", "受託人違反第一項規定獲得利益者，委託人或受益人得請求將其利益歸於信託財產。如因而致信託財產受損害者，受託人雖無過失，亦應負損害賠償責任；但受託人證明縱為分別管理，而仍不免發生損害者，不在此限。", "前項請求權，自委託人或受益人知悉之日起，二年間不行使而消滅。自事實發生時起，逾五年者，亦同。"], "has_official": true, "no": "信24"}, {"title": "受託人不得以任何名義享有信託利益", "plain": "受託人不得以任何名義享有信託利益。但與他人為共同受益人時，不在此限。", "mnemonic": "受託人不能自己吃信託利益（共同受益人除外）。", "tip": "『受託人公平對待所有客戶、不得偏袒某一客戶』這類題，就是從忠實義務延伸出的原則。", "official": ["受託人不得以任何名義，享有信託利益。但與他人為共同受益人時，不在此限。"], "has_official": true, "no": "信34"}, {"title": "信託業：善良管理人與忠實義務", "plain": "信託業處理信託事務，應以善良管理人的注意為之，並負忠實義務。信託業應負的義務及行為規範，由信託業同業公會擬訂，報請主管機關核定。", "mnemonic": "信託業：善管＋忠實。", "official": ["信託業處理信託事務，應以善良管理人之注意為之，並負忠實義務。", "前項信託業應負之義務及相關行為規範，由信託業商業同業公會擬訂，報請主管機關核定。", "政黨或其他政治團體交付信託之財產及其信託利益之取得與分配，信託業者應定期公告；其公告事項及公告方式等事項之辦法，由主管機關定之。"], "has_official": true, "no": "信業22"}, {"title": "信託業不得虛偽、詐欺、足致誤信", "plain": "信託業經營信託業務，不得對委託人或受益人有虛偽、詐欺或其他足致他人誤信的行為。", "mnemonic": "對委託人、受益人，不得虛偽詐欺。", "official": ["信託業經營信託業務，不得對委託人或受益人有虛偽、詐欺或其他足致他人誤信之行為。"], "has_official": true, "no": "信業23"}, {"title": "信託業不得用信託財產與自己或利害關係人交易", "plain": "信託業不得以信託財產：購買本身或其利害關係人發行或承銷的有價證券或票券；購買本身或其利害關係人的財產；讓售給本身或其利害關係人；其他經主管機關規定的利害關係交易。信託契約約定信託業對信託財產不具運用決定權的，不受限制，但要充分告知委託人（受益人已確定的並要告知受益人）。政府發行的債券不受限制。", "mnemonic": "信託財產不買自己人的證券、不買自己人的財產、不賣給自己人。", "tip": "這是『利益衝突原則』的最典型規定：有運用決定權的人，不能把客戶的錢拿去照顧自己人。", "official": ["信託業不得以信託財產為下列行為：", "一、購買本身或其利害關係人發行或承銷之有價證券或票券。", "二、購買本身或其利害關係人之財產。", "三、讓售與本身或其利害關係人。", "四、其他經主管機關規定之利害關係交易行為。", "信託契約約定信託業對信託財產不具運用決定權者，不受前項規定之限制；信託業應就信託財產與信託業本身或利害關係人交易之情形，充分告知委託人，如受益人已確定者，並應告知受益人。", "政府發行之債券，不受第一項規定之限制。"], "has_official": true, "no": "信業25"}, {"title": "特定利害關係交易：要事前告知並取得書面同意", "plain": "除依信託契約約定，或事先告知受益人並取得其書面同意外，信託業不得：以信託財產購買其銀行業務部門經紀的有價證券或票券；以信託財產存放於其銀行業務部門或利害關係人處作為存款，或與其銀行業務部門為外匯相關交易；以信託財產與本身或利害關係人為第25條第1項以外的其他交易。信託業應就利害關係交易防制措施，訂定書面政策及程序。", "mnemonic": "跟自己人往來：契約約定，或事先告知受益人並取得書面同意。", "official": ["信託業除依信託契約之約定，或事先告知受益人並取得其書面同意外，不得為下列行為：", "一、以信託財產購買其銀行業務部門經紀之有價證券或票券。", "二、以信託財產存放於其銀行業務部門或其利害關係人處作為存款或與其銀行業務部門為外匯相關之交易。", "三、以信託財產與本身或其利害關係人為第二十五條第一項以外之其他交易。", "信託契約約定信託業對信託財產不具運用決定權者，不受前項規定之限制；信託業應就信託財產與信託業本身或利害關係人交易之情形，充分告知委託人，如受益人已確定者，並應告知受益人。", "第一項第二款所定外匯相關之交易，應符合外匯相關法令規定，並應就外匯相關風險充分告知委託人，如受益人已確定者，並應告知受益人。", "信託業應就利害關係交易之防制措施，訂定書面政策及程序。"], "has_official": true, "no": "信業27"}, {"title": "信託業不得承諾擔保本金或最低收益率", "plain": "信託業不得承諾擔保本金或最低收益率。", "mnemonic": "不保本、不保最低收益。", "tip": "這是考試很愛考的：財富管理、信託、基金銷售都不得保證獲利或負擔損失。", "official": ["信託業不得承諾擔保本金或最低收益率。"], "has_official": true, "no": "信業31"}, {"title": "信託業違反分別管理或轉為自有財產的刑責", "plain": "信託業違反信託法第24條，未將信託財產與自有財產或其他信託財產分別管理或分別記帳的，行為負責人處6個月以上5年以下有期徒刑，得併科300萬元以下罰金。違反信託法第35條，將信託財產轉為自有財產，或於信託財產上設定或取得權利的，行為負責人處1年以上7年以下有期徒刑，得併科1,000萬元以下罰金。", "mnemonic": "沒分開管理：6月到5年；信託財產變自己的：1到7年。", "facts": {"head": ["違反情形", "刑責（行為負責人）"], "rows": [["未分別管理或分別記帳（違反信託法第24條）", "6個月以上5年以下有期徒刑，得併科300萬元以下罰金"], ["將信託財產轉為自有財產，或在信託財產上設定、取得權利（違反信託法第35條）", "1年以上7年以下有期徒刑，得併科1,000萬元以下罰金"]]}, "official": ["信託業違反信託法第二十四條規定，未將信託財產與其自有財產或其他信託財產分別管理或分別記帳者，其行為負責人處六月以上五年以下有期徒刑，得併科新臺幣三百萬元以下罰金。", "信託業違反信託法第三十五條規定，將信託財產轉為自有財產，或於信託財產上設定或取得權利者，其行為負責人處一年以上七年以下有期徒刑，得併科新臺幣一千萬元以下罰金。"], "has_official": true, "no": "信業51"}, {"title": "銀行不得對自己人無擔保授信", "plain": "銀行不得對持有實收資本總額3%以上的企業，或本行負責人、職員、主要股東，或與本行負責人或辦理授信的職員有利害關係者，為無擔保授信。但消費者貸款及對政府貸款不在此限。主要股東指持有銀行已發行股份總數1%以上者；自然人主要股東，配偶與未成年子女的持股要計入。", "mnemonic": "自己人（負責人、職員、主要股東、利害關係人）不能無擔保授信；消費者貸款、政府貸款例外。", "official": ["銀行不得對其持有實收資本總額百分之三以上之企業，或本行負責人﹑職員﹑或主要股東，或對與本行負責人或辦理授信之職員有利害關係者，為無擔保授信。但消費者貸款及對政府貸款不在此限。", "前項消費者貸款額度，由中央主管機關定之。", "本法所稱主要股東係指持有銀行已發行股份總數百分之一以上者；主要股東為自然人時，本人之配偶與其未成年子女之持股應計入本人之持股。"], "has_official": true, "no": "銀32"}, {"title": "對自己人擔保授信：要十足擔保、條件不優於同類", "plain": "銀行對持有實收資本總額5%以上的企業，或本行負責人、職員、主要股東，或與本行負責人或辦理授信職員有利害關係者，為擔保授信，應有十足擔保，其條件不得優於其他同類授信對象；達主管機關規定金額以上，還要經三分之二以上董事出席及出席董事四分之三以上同意。", "mnemonic": "自己人擔保授信：十足擔保、條件不優於一般客戶。", "official": ["銀行對其持有實收資本總額百分之五以上之企業，或本行負責人、職員、或主要股東，或對與本行負責人或辦理授信之職員有利害關係者為擔保授信，應有十足擔保，其條件不得優於其他同類授信對象，如授信達中央主管機關規定金額以上者，並應經三分之二以上董事之出席及出席董事四分之三以上同意。", "前項授信限額﹑授信總餘額﹑授信條件及同類授信對象，由中央主管機關洽商中央銀行定之。"], "has_official": true, "no": "銀33"}, {"title": "行員不得向客戶收取佣金、酬金或不當利益", "plain": "銀行負責人及職員，不得以任何名義，向存戶、借款人或其他顧客收受佣金、酬金或其他不當利益。", "mnemonic": "不得以任何名義向客戶收佣金、酬金、不當利益。", "tip": "連『謝禮』『紅包』『介紹費』都可能被視為不當利益；對應職業道德題中的『不得向客戶收受不當利益』。", "official": ["銀行負責人及職員不得以任何名義，向存戶、借款人或其他顧客收受佣金、酬金或其他不當利益。"], "has_official": true, "no": "銀35"}, {"title": "違反第35條的刑責", "plain": "違反第35條規定（向客戶收受佣金、酬金或不當利益）的，處3年以下有期徒刑、拘役，或科或併科新臺幣500萬元以下罰金；但其他法律有較重處罰的，依其規定。", "mnemonic": "收客戶佣金、不當利益：3年以下、500萬以下。", "official": ["違反第三十五條規定者，處三年以下有期徒刑、拘役或科或併科新臺幣五百萬元以下罰金。但其他法律有較重之處罰規定者，依其規定。", "違反第四十七條之二或第一百二十三條準用第三十五條規定者，依前項規定處罰。"], "has_official": true, "no": "銀127"}, {"title": "銀行負責人及職員不得兼任其他銀行職務", "plain": "銀行負責人及職員，不得兼任其他銀行的任何職務。但因投資關係，並經中央主管機關核准的，可以兼任被投資銀行的董事或監察人。", "mnemonic": "不得兼任其他銀行職務（投資關係經核准除外）。", "official": ["銀行負責人及職員不得兼任其他銀行任何職務。但因投資關係，並經中央主管機關核准者，得兼任被投資銀行之董事或監察人。"], "has_official": true, "no": "銀35-1"}], "tables": [{"title": "利益衝突規範總整理", "head": ["情形", "規定", "依據"], "rows": [["信託財產與自有財產", "要分別管理（金錢可分別記帳）", "信託法第24條"], ["受託人自己享有信託利益", "不得以任何名義享有（共同受益人除外）", "信託法第34條"], ["信託財產買自己人證券、財產或賣給自己人", "不得；無運用決定權者要告知", "信託業法第25條"], ["與自己人其他交易、存放自家銀行部門", "要契約約定或事先告知並取得書面同意", "信託業法第27條"], ["承諾保本或最低收益", "不得", "信託業法第31條"], ["對負責人、職員、主要股東無擔保授信", "不得（消費者貸款、對政府貸款除外）", "銀行法第32條"], ["對自己人擔保授信", "要十足擔保，條件不優於同類", "銀行法第33條"], ["向客戶收佣金、酬金、不當利益", "不得，違反3年以下有期徒刑", "銀行法第35、127條"], ["兼任其他銀行職務", "不得（投資關係經核准除外）", "銀行法第35-1條"]]}, {"title": "刑責速記：受託與銀行", "head": ["違反", "刑責"], "rows": [["未分別管理信託財產（信託業）", "6個月以上5年以下，得併科300萬元以下罰金"], ["將信託財產轉為自有財產（信託業）", "1年以上7年以下，得併科1,000萬元以下罰金"], ["銀行負責人或職員收客戶佣金、不當利益", "3年以下，或科或併科500萬元以下罰金"]]}], "cards": [{"ref": "信24", "front": "受託人管理信託財產，與自己的財產要怎麼處理？", "back": "分別管理（信託財產是金錢的，可以分別記帳）。", "id": 1}, {"ref": "信24", "front": "受託人違反分別管理規定，信託財產受損，沒有過失要不要賠？", "back": "要負損害賠償責任；但能證明縱使分別管理仍不免發生損害的，不在此限。", "id": 2}, {"ref": "信34", "front": "受託人可不可以享有信託利益？", "back": "不可以，但與他人為共同受益人時除外。", "id": 3}, {"ref": "信業22", "front": "信託業處理信託事務，要盡什麼義務？", "back": "善良管理人之注意義務，並負忠實義務。", "id": 4}, {"ref": "信業25", "front": "信託業可不可以用信託財產購買自己的利害關係人發行的證券？", "back": "不可以（無運用決定權者不受限制，但要充分告知）。", "id": 5}, {"ref": "信業27", "front": "信託業與自己人有其他交易，要符合什麼條件？", "back": "依信託契約約定，或事先告知受益人並取得書面同意。", "id": 6}, {"ref": "信業31", "front": "信託業可不可以承諾保本或最低收益率？", "back": "不可以。", "id": 7}, {"ref": "信業51", "front": "信託業將信託財產轉為自有財產，行為負責人的刑責？", "back": "1年以上7年以下有期徒刑，得併科1,000萬元以下罰金。", "id": 8}, {"ref": "信業51", "front": "信託業沒有把信託財產與自有財產分別管理，行為負責人的刑責？", "back": "6個月以上5年以下有期徒刑，得併科300萬元以下罰金。", "id": 9}, {"ref": "銀32", "front": "銀行可以對自己的負責人、職員無擔保授信嗎？", "back": "不可以；消費者貸款及對政府貸款除外。", "id": 10}, {"ref": "銀33", "front": "銀行對自己人擔保授信，條件要怎麼設？", "back": "要有十足擔保，條件不得優於同類授信對象。", "id": 11}, {"ref": "銀35", "front": "銀行行員可以向客戶收佣金、酬金嗎？", "back": "不可以，不得以任何名義向存戶、借款人或顧客收受佣金、酬金或不當利益。", "id": 12}, {"ref": "銀127", "front": "行員收客戶佣金或不當利益，刑責？", "back": "3年以下有期徒刑、拘役，或科或併科500萬元以下罰金。", "id": 13}, {"ref": "銀35-1", "front": "銀行負責人及職員可不可以兼任其他銀行職務？", "back": "不可以；因投資關係並經中央主管機關核准，得兼任被投資銀行的董事或監察人。", "id": 14}], "scenarios": [{"ref": "信24", "q": "信託業為了方便，把客戶的信託資金和公司自有資金放在同一個帳戶裡共同記帳。依信託法第24條，這樣的做法？", "opts": ["可以，只要最後能算清楚", "不可以，信託財產與自有財產要分別管理（金錢可分別記帳）", "可以，只要客戶沒有意見", "可以，只要董事會通過"], "ans": 1, "why": "信託法第24條：受託人應將信託財產與其自有財產及其他信託財產分別管理；金錢可分別記帳。違反的，信託業法第51條有刑責。"}, {"ref": "信業31", "q": "信託業的業務員對客戶說：『這個信託商品我們保證本金不會虧損，最低年收益3%。』依信託業法，這樣的承諾？", "opts": ["可以，只要寫在契約裡", "不可以，信託業不得承諾擔保本金或最低收益率", "可以，只要經主管同意", "可以，只要客戶是高資產客戶"], "ans": 1, "why": "信託業法第31條：信託業不得承諾擔保本金或最低收益率。"}, {"ref": "信業25", "q": "信託業對信託財產有運用決定權，打算以信託財產購買信託業自己的關係企業發行的有價證券。依信託業法，這樣的做法？", "opts": ["可以，只要價格合理", "原則上不可以（第25條）；無運用決定權時才可例外並要充分告知", "可以，只要事後告知客戶", "可以，只要主管機關口頭同意"], "ans": 1, "why": "信託業法第25條第1項：不得以信託財產購買本身或其利害關係人發行或承銷的有價證券或票券；第2項才規定契約約定信託業對信託財產不具運用決定權者不受限制，但要充分告知。"}, {"ref": "信34", "q": "受託人在管理信託財產時，可不可以自己享有信託利益？", "opts": ["可以，因為他在管理", "原則上不可以，除非與他人為共同受益人", "可以，只要比例不超過一半", "可以，只要不告訴別人"], "ans": 1, "why": "信託法第34條：受託人不得以任何名義享有信託利益。但與他人為共同受益人時，不在此限。"}, {"ref": "銀35", "q": "銀行理專收到客戶送的紅包，並答應優先核貸。依銀行法第35條與第127條，下列何者正確？", "opts": ["只是人情往來，沒有問題", "違反第35條，可能被處3年以下有期徒刑、拘役，或科或併科500萬元以下罰金", "只違反公司內規", "只要退回紅包就沒事"], "ans": 1, "why": "銀行法第35條：不得以任何名義向客戶收受佣金、酬金或不當利益；第127條：違反者處3年以下有期徒刑、拘役或科或併科500萬元以下罰金。"}, {"ref": "銀32", "q": "銀行不得對下列何者為『無擔保授信』？", "opts": ["持有銀行實收資本總額3%以上的企業", "對一般民眾的消費者貸款", "對政府的貸款", "持有同一銀行的普通存戶"], "ans": 0, "why": "銀行法第32條：不得對持有實收資本總額3%以上的企業、本行負責人、職員、主要股東，或與負責人或授信職員有利害關係者為無擔保授信；消費者貸款及對政府貸款例外。"}, {"ref": "銀33", "q": "銀行對自己的董事為擔保授信，條件應該如何設定？", "opts": ["可以比一般客戶更優惠", "要有十足擔保，條件不得優於其他同類授信對象", "可以完全不用擔保", "由董事長自己決定"], "ans": 1, "why": "銀行法第33條：對負責人等為擔保授信，應有十足擔保，其條件不得優於其他同類授信對象。"}, {"ref": "信業51", "q": "信託業將客戶的信託財產轉為自己的自有財產。依信託業法第51條，行為負責人最重可能處？", "opts": ["6個月以上5年以下有期徒刑", "1年以上7年以下有期徒刑，得併科1,000萬元以下罰金", "罰鍰10萬元", "沒有刑責"], "ans": 1, "why": "信託業法第51條第2項：違反信託法第35條，將信託財產轉為自有財產，或於信託財產上設定或取得權利者，行為負責人處1年以上7年以下有期徒刑，得併科1,000萬元以下罰金。"}, {"ref": "信22", "q": "受託人處理信託事務，信託法要求應以何種注意為之？", "opts": ["與處理自己事務同一注意", "善良管理人之注意", "不需注意", "重大過失即可"], "ans": 1, "why": "信託法第22條：受託人應依信託本旨，以善良管理人之注意，處理信託事務。"}, {"ref": "銀35-1", "q": "銀行行員可不可以同時兼任另一家銀行的職務？", "opts": ["可以，只要自己想兼任", "原則上不可以，因投資關係並經中央主管機關核准者除外", "可以，只要兩家銀行同意", "可以，只要不領薪水"], "ans": 1, "why": "銀行法第35-1條：銀行負責人及職員不得兼任其他銀行任何職務，但因投資關係並經中央主管機關核准，得兼任被投資銀行的董事或監察人。"}], "chNo": "07", "summary": "客戶利益優先於公司與個人利益：受託人要善良管理、分別管理、不得享有信託利益；信託業不得拿信託財產和自己或利害關係人交易、不得承諾保本或最低收益；銀行不得對自己人無擔保授信、行員不得向客戶收取佣金或不當利益。這章對應職業道德題中的利益衝突、財富管理、受託管理財產。", "scope": "收錄信託法第22、24、34條；信託業法第22、23、25、27、31、51條；銀行法第32、33、35、127、35-1條。", "nav": {"prev": {"file": "ch06.html", "label": "第6章 證券、期貨與基金從業人員：內線交易、操縱、誠信與投資人保護"}, "next": {"file": "ch08.html", "label": "第8章 賄賂、貪污與檢舉：送禮、挪用客戶款項與保護檢舉人"}}}</script>
<script>const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>{t=String(t||'');const ss=t.split(/(?<=。)/).map(x=>x.trim()).filter(Boolean);if(t.length<=90||ss.length<2&&t.indexOf('；')<0)return '<p>'+esc(t)+'</p>';
  const li=s=>{s=s.replace(/。$/,'');const m=s.match(/^([^：；]{1,40})：(.+)$/);if(m&&m[2].split('；').length>=3)return '<li><b>'+esc(m[1])+'</b><ul>'+m[2].split('；').map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></li>';
    const parts=s.split('；');if(parts.length>=3)return '<li>'+parts.map(x=>esc(x)).join('<br>')+'</li>';return '<li>'+esc(s)+'</li>'};
  return '<ul class="pl">'+ss.map(li).join('')+'</ul>'};
const factsT=f=>f?'<div class="tw"><table class="ft"><thead><tr>'+f.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+f.rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'';
const LAWMAP={"金保": "金融消費者保護法", "適": "適合度辦法", "說": "說明揭露辦法", "廣": "廣告辦法", "個": "個資法", "洗": "洗錢防制法", "洗辦": "金融機構防制洗錢辦法", "保": "保險法", "規": "業務員管理規則", "招": "招攬核保理賠辦法", "證": "證券交易法", "證商": "證券商負責人與業務人員管理規則", "期商": "期貨商負責人及業務員管理規則", "投顧": "投信投顧法", "投保": "投保法", "信": "信託法", "信業": "信託業法", "銀": "銀行法", "刑": "刑法", "貪": "貪污治罪條例", "獎": "檢舉貪污獎勵辦法"};
const lab=x=>{const m=String(x).match(/^([^0-9]+)([0-9]+(?:-[0-9]+)?)$/);return m&&LAWMAP[m[1]]?LAWMAP[m[1]]+'第'+m[2]+'條':x};
const mem={};
const store={get(k){try{const v=localStorage.getItem(k);return v===null?mem[k]:v}catch(e){return mem[k]}},set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const BOXKEY='twlife_ethics_boxes_v1';
let boxes={};try{boxes=JSON.parse(store.get(BOXKEY)||'{}')}catch(e){boxes={}}
const saveBoxes=()=>store.set(BOXKEY,JSON.stringify(boxes));
function Flash(root,getCards){
  let queue=[],cur=null,flipped=false;
  function build(){const cs=getCards();queue=shuffle(cs.filter(c=>(boxes[c.key]||0)<1)).sort((a,b)=>(boxes[a.key]||0)-(boxes[b.key]||0));flipped=false}
  function render(){
    const cs=getCards(),n=cs.length,done=cs.filter(c=>(boxes[c.key]||0)>=1).length;
    let h='<div class="stat">已熟練 '+done+' / '+n+' 張（答對 1 次視為熟練，進度存在這個瀏覽器）</div><div class="bar"><i style="width:'+(n?done/n*100:0)+'%"></i></div>';
    if(!n){root.innerHTML=h+'<div class="card"><p>沒有可用的閃卡。</p></div>';return}
    if(!queue.length){root.innerHTML=h+'<div class="card"><h3>全部熟練了</h3><p>可以去做情境題，或重設後再來一輪。</p></div><div class="row"><button class="btn" data-a="reset">重設進度</button></div>';return}
    cur=queue[0];
    h+='<div class="card fc" tabindex="0" role="button" data-a="flip"><small>'+(cur.tag?esc(cur.tag)+'｜':'')+esc(lab(cur.ref))+'｜剩 '+queue.length+' 張</small><div class="q">'+esc(cur.front)+'</div>'+(flipped?'<div class="a"><span class="lab fact">答案</span>'+esc(cur.back)+'</div>':'<small>點一下翻面</small>')+'</div>';
    if(flipped)h+='<div class="row"><button class="btn bad" data-a="no">還不熟</button><button class="btn ok" data-a="yes">會了</button></div>';
    h+='<div class="row"><button class="btn" data-a="reset">重設進度</button></div>';
    root.innerHTML=h;
  }
  root.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
    if(a==='flip'){flipped=!flipped;render()}
    else if(a==='reset'){if(confirm('確定要清除這些閃卡的進度？')){getCards().forEach(c=>delete boxes[c.key]);saveBoxes();build();render()}}
    else if(cur&&(a==='yes'||a==='no')){const ok=a==='yes';boxes[cur.key]=ok?Math.min(1,(boxes[cur.key]||0)+1):0;saveBoxes();queue.shift();if(!ok||boxes[cur.key]<1)queue.splice(queue.length?Math.max(1,Math.min(queue.length,ok?6:3)):0,0,cur);flipped=false;render()}});
  root.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.fc')){e.preventDefault();flipped=!flipped;render()}});
  return {refresh(){build();render()}};
}
function Quiz(root,getItems,perRound){
  let items=[],score=0,answered=0,done=false;
  function draw(){
    const perms=items.map(s=>shuffle(s.opts.map((_,k)=>k)));
    root.innerHTML='<div class="stat" id="sc"></div>'+items.map((s,i)=>'<div class="card" data-i="'+i+'"><b>'+(i+1)+'. </b><span class="lab my">'+(s.tag?esc(s.tag)+' ':'')+esc(lab(s.ref))+'</span>'+esc(s.q)+perms[i].map((k,pos)=>'<button class="opt" data-o="'+k+'">'+String.fromCharCode(65+pos)+'. '+esc(s.opts[k])+'</button>').join('')+'<div class="why"></div></div>').join('')+'<div id="qend"></div>';
    score=0;answered=0;upd();
  }
  function upd(){const el=$('#sc',root);if(el)el.textContent='已作答 '+answered+' / '+items.length+'，答對 '+score+' 題';
    if(perRound&&answered===items.length&&items.length){$('#qend',root).innerHTML='<div class="card"><h3>這一組：'+score+' / '+items.length+'</h3></div><div class="row"><button class="btn pri" data-a="again">再來一組</button></div>'}}
  function again(){const all=getItems();items=perRound?shuffle(all).slice(0,perRound):all;draw()}
  root.addEventListener('click',e=>{
    const ag=e.target.closest('[data-a="again"]');if(ag){again();window.scrollTo(0,root.offsetTop-60);return}
    const b=e.target.closest('.opt');if(!b)return;const box=b.closest('.card');if(box.dataset.done)return;
    const s=items[+box.dataset.i],j=+b.dataset.o;box.dataset.done=1;answered++;if(j===s.ans)score++;
    let right='';$$('.opt',box).forEach((x,pos)=>{const k=+x.dataset.o;if(k===s.ans){x.classList.add('right');right=String.fromCharCode(65+pos)}else if(k===j)x.classList.add('wrong')});
    const w=$('.why',box);w.style.display='block';w.innerHTML=(j===s.ans?'答對了。':'答錯了，正解是 '+right+'。')+esc(s.why);upd()});
  return {refresh:again};
}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const LAWS=D.laws;
$('#h1').textContent=D.chapter+'｜'+D.title;
$('#intro').textContent=D.summary||'';
document.title=D.chapter+' '+D.title;
$('#foot').innerHTML='官方來源：'+LAWS.map(L=>esc(L.name)+'（'+esc(L.amended)+(L.kind==='press'?'發布':'修正')+'）'+(L.note?'｜'+esc(L.note)+'｜':'')+'<a href="'+esc(L.url)+'" target="_blank" rel="noopener">'+esc(L.url)+'</a>').join('<br>')+(D.scope?'<br>'+esc(D.scope):'')+'<br>條文原文取自法務部全國法規資料庫的公開資料鏡像（更新日 2026-10-16），尚未逐條與官網現行頁面比對；「白話」「口訣」「情境題」為編寫者整理，不是法條。法規可能再修正，請以官方最新公告為準；本內容不是法律意見。';
const TABS=[['read','條文速讀'],['table','對照表'],['cards','閃卡'],['quiz','情境題']];
const nav=$('#nav');
TABS.forEach(([id,name])=>{const b=document.createElement('button');b.textContent=name;b.setAttribute('role','tab');b.dataset.id=id;b.onclick=()=>show(id);nav.appendChild(b)});
let curTab='read';
function show(id,anchor){curTab=id;TABS.forEach(([t])=>$('#s-'+t).classList.toggle('on',t===id));$$('button',nav).forEach(b=>b.setAttribute('aria-selected',b.dataset.id===id));
  history.replaceState(null,'','#'+id+(anchor?'/'+anchor:''));
  if(anchor){const el=document.getElementById(anchor);if(el){const d=el.querySelector('details');el.scrollIntoView({block:'start'});el.classList.add('hl')}}else window.scrollTo(0,0)}
$('#s-read').innerHTML=(D.alerts||[]).map(a=>'<div class="banner"><b>'+esc(a.t)+'</b>'+esc(a.d)+'</div>').join('')+D.clauses.map(c=>{
  const off=c.official.map(p=>'<p>'+esc(p)+'</p>').join('');
  return '<div class="card" id="c'+esc(c.no)+'"><h3><span class="no">'+esc(lab(c.no))+'</span>'+esc(c.title)+'</h3>'
   +'<div class="pw"><span class="lab my">白話</span>'+fmt(c.plain)+'</div>'+factsT(c.facts)
   +(c.mnemonic?'<div class="mn"><span class="lab my">口訣</span>'+esc(c.mnemonic)+'</div>':'')
   +(c.tip?'<p><span class="lab hint">提醒</span>'+esc(c.tip)+'</p>':'')
   +(c.official.length?'<details><summary>展開官方條文原文</summary><div class="off"><span class="lab fact">原文</span>'+off+'</div></details>':'')+'</div>'}).join('');
$('#s-table').innerHTML=D.tables.map((t,i)=>'<h3 id="t'+i+'">'+esc(t.title)+'</h3><div class="tw"><table><thead><tr>'+t.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+t.rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>').join('');
const cardsAll=D.cards.map(c=>({key:'ch'+D.chNo+':'+c.id,ref:c.ref,front:c.front,back:c.back}));
const fl=Flash($('#s-cards'),()=>cardsAll);fl.refresh();
const qz=Quiz($('#s-quiz'),()=>D.scenarios,0);qz.refresh();
// 上下章
const N=D.nav||{};
function setLink(el,o,dir){if(o){el.href=o.file;el.textContent=dir==='p'?'← '+o.label:o.label+' →'}else{el.style.visibility='hidden'}}
setLink($('#prev'),N.prev,'p');setLink($('#next'),N.next,'n');
// 左右滑動：換分頁，到頭就換章
function step(d){const i=TABS.findIndex(t=>t[0]===curTab)+d;
  if(i<0){if(N.prev)location.href=N.prev.file+'#read';return}
  if(i>=TABS.length){if(N.next)location.href=N.next.file+'#read';return}
  show(TABS[i][0])}
let sx=0,sy=0,skip=false;
document.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;const el=e.target&&e.target.nodeType===1?e.target:(e.target&&e.target.parentElement);skip=!!(el&&el.closest('.tw,nav,input,.off,#cap'))},{passive:true});
document.addEventListener('touchend',e=>{if(skip)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>70&&Math.abs(dy)<45){step(dx<0?1:-1)}},{passive:true});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1)});
// 深層連結
function route(){const h=(location.hash||'#read').slice(1).split('/');show(TABS.some(t=>t[0]===h[0])?h[0]:'read',h[1]?decodeURIComponent(h[1]):null)}
window.addEventListener('hashchange',route);route();
</script>
<script>// 語音：導覽列多一顆「🎧 語音」鈕，按下就從頭播放；畫面上方只留最後兩行字幕（固定高度，不會推動下面的頁面）。
// 再按一次＝暫停／繼續；點字幕也一樣；字幕右側的 ✕ 關閉。播完一段自動接下一段。
// 資料來自 mp3/timing/chNN.js（window.AUDIO_TIMING），由 make_timing.py 產生；沒有這個檔就不會出現「語音」鈕。
(function(){
const T=window.AUDIO_TIMING;
if(!T||!T.segments||!T.segments.length)return;
const BASE='mp3',segs=T.segments,au=document.getElementById('au');
const cap=document.getElementById('cap'),rowA=document.getElementById('cap-a'),rowB=document.getElementById('cap-b'),top=document.getElementById('top');
const SP={F:'主持人',M:'專家'},PUNC='，、：；。！？';
let si=-1,lines=[],li=-2,started=false,raf=0,endTimer=0;

// ---- 按鈕 ----
const btn=document.createElement('button');
btn.id='au-btn';btn.type='button';btn.textContent='🎧 語音';btn.setAttribute('aria-pressed','false');btn.title='按下開始聽這一章的語音重點';
nav.appendChild(btn);
function label(){btn.textContent=!started?'🎧 語音':(au.paused?'▶ 語音':'⏸ 語音');btn.setAttribute('aria-pressed',started?'true':'false')}

// ---- 字幕斷行：依目前寬度，把每句切成一行一行 ----
const fontPx=()=>parseFloat(getComputedStyle(rowB).fontSize)||17;
const cw=(s,f)=>{let w=0;for(const c of s)w+=c.charCodeAt(0)<128?f*0.56:f;return w};
function wrap(text,lim0,lim,f){
  const parts=text.match(new RegExp('[^'+PUNC+']+['+PUNC+']*|['+PUNC+']+','g'))||[text];
  const out=[];let cur='',w=0,lim_=lim0;
  const push=()=>{if(cur){out.push(cur);cur='';w=0;lim_=lim}};
  for(const p of parts){
    const pw=cw(p,f);
    if(w+pw<=lim_){cur+=p;w+=pw;continue}
    push();
    if(pw<=lim_){cur=p;w=pw;continue}
    for(const c of p){const x=cw(c,f);if(w+x>lim_)push();cur+=c;w+=x}
  }
  push();return out;
}
function buildLines(){
  lines=[];if(si<0)return;
  const s=segs[si],f=fontPx(),avail=Math.max(120,(rowB.clientWidth||cap.clientWidth||300)-2);let prevSpk=null;
  s.cues.forEach((c,k)=>{
    const t0=c.t,t1=k+1<s.cues.length?s.cues[k+1].t:s.dur;
    const span=Math.max(0.4,t1-t0-0.7);                       // 句尾約有 0.7 秒停頓，不分給字
    const badge=c.spk!==prevSpk;prevSpk=c.spk;
    const bw=badge?SP[c.spk].length*12+18:0;                   // 說話者小標籤的寬度（12px 字＋留白）
    const ls=wrap(c.text,avail-bw,avail,f),ws=ls.map(x=>Math.max(1,cw(x,f))),tot=ws.reduce((a,b)=>a+b,0);
    let acc=0;ls.forEach((x,j)=>{lines.push({t:t0+span*acc/tot,spk:c.spk,badge:badge&&j===0,text:x});acc+=ws[j]});
  });
}
const esc2=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const rowHTML=l=>l?(l.badge?'<span class="sp '+l.spk+'">'+SP[l.spk]+'</span>':'')+esc2(l.text):'';
function paint(){
  const t=au.currentTime;let j=-1;
  for(let k=0;k<lines.length;k++){if(lines[k].t<=t+0.05)j=k;else break}
  if(j===li)return;li=j;
  rowA.innerHTML=rowHTML(lines[j-1]);rowB.innerHTML=rowHTML(lines[j]);
}
function tick(){paint();raf=au.paused?0:requestAnimationFrame(tick)}

// ---- 播放 ----
const nice=t=>String(t).replace(/_/g,' ');
function meta(){if('mediaSession' in navigator&&window.MediaMetadata&&si>=0)navigator.mediaSession.metadata=new MediaMetadata({title:nice(segs[si].title),artist:D.chapter+' '+D.title,album:'考試複習語音'})}
function pad(){document.documentElement.style.scrollPaddingTop=cap.hidden?'':(top.offsetHeight+8)+'px'}
function setSrc(i){if(si===i)return;si=i;li=-2;rowA.innerHTML=rowB.innerHTML='';au.src=encodeURI(BASE+'/'+segs[i].file);au.load();au.playbackRate=1;buildLines();meta()}
function playSeg(i){
  setSrc(i);
  const go=()=>{buildLines();au.play().catch(()=>{})};
  if(au.readyState>=1)go();else au.addEventListener('loadedmetadata',go,{once:true});
}
function start(){clearTimeout(endTimer);started=true;cap.hidden=false;pad();si=-1;playSeg(0)}
function stop(){clearTimeout(endTimer);au.pause();started=false;si=-1;lines=[];li=-2;cap.hidden=true;rowA.innerHTML=rowB.innerHTML='';pad();label()}
function toggle(){if(!started)start();else if(au.paused)au.play().catch(()=>{});else au.pause()}
btn.onclick=toggle;
cap.addEventListener('click',e=>{if(e.target.closest('#cap-x'))stop();else toggle()});
au.addEventListener('play',()=>{label();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)});
au.addEventListener('pause',label);
au.addEventListener('seeked',paint);
au.addEventListener('ended',()=>{
  if(si<segs.length-1)playSeg(si+1);
  else{started=false;label();endTimer=setTimeout(()=>{if(!started)stop()},2500)}   // 全部播完，字幕停 2.5 秒後自動收起
});
au.addEventListener('error',()=>{rowA.textContent='';rowB.textContent='找不到音檔（'+BASE+'/'+(segs[si]?segs[si].file:'')+'）'});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(si>=0){buildLines();li=-2;paint();pad()}},150)});
if('mediaSession' in navigator){[['play',()=>au.play()],['pause',()=>au.pause()],['previoustrack',()=>started&&playSeg(Math.max(0,si-1))],['nexttrack',()=>started&&si<segs.length-1&&playSeg(si+1)]].forEach(([a,f])=>{try{navigator.mediaSession.setActionHandler(a,f)}catch(e){}})}
})();
</script></body></html>
