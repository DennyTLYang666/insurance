<script id="data" type="application/json">{"chapter": "第一章", "title": "金融消費者保護法：公平待客、說明、適合度與爭議處理", "laws": [{"pcode": "G0380226", "name": "金融消費者保護法", "amended": "民國112年12月6日", "url": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380226", "source": "法務部全國法規資料庫（經 kong0107/mojLawSplitJSON 公開鏡像取得，鏡像更新日 20261016）", "retrieved": "2026-11-03", "mirrorDate": "20231206"}], "alerts": [{"t": "這章是職業道德科的核心", "d": "第7條（公平誠信、善良管理人、忠實義務）、第8條（廣告）、第9條（適合度）、第10條（說明與揭露）是『待客四件事』。題目常把這四條的內容互相調換來設陷阱。"}, {"t": "後果的提醒（風險）", "d": "違反廣告、適合度、說明揭露、酬金制度規定，罰鍰30萬至1,000萬元；協助客戶『包裝』成專業投資人，罰1,000萬至5,000萬元。另外客戶可以請求損害賠償，法院還能判故意最高3倍、過失最高1倍的懲罰性賠償。罰鍰與賠償都是對金融服務業（公司）；業務員個人另有業務員管理規則等的處分。"}, {"t": "本章是『法律』，細節在辦法", "d": "第8、9、10條各授權主管機關訂辦法（廣告辦法、適合度辦法、說明揭露辦法），細節見第二章。"}], "clauses": [{"title": "金融服務業的範圍", "plain": "金融服務業包括銀行業、證券業、期貨業、保險業、電子支付業，以及主管機關公告的其他金融服務業。證券交易所、櫃買中心、集保、期交所等不算。", "mnemonic": "銀、證、期、保、電支。", "tip": "保險公司、銀行、證券商、期貨商的業務員都受這部法律規範。", "official": ["本法所定金融服務業，包括銀行業、證券業、期貨業、保險業、電子支付業及其他經主管機關公告之金融服務業。", "前項銀行業、證券業、期貨業及保險業之範圍，依金融監督管理委員會組織法第二條第三項規定。但不包括證券交易所、證券櫃檯買賣中心、證券集中保管事業、期貨交易所及其他經主管機關公告之事業。", "第一項所稱電子支付業，指電子支付機構管理條例第三條第一款之電子支付機構。"], "has_official": true, "no": "金保3"}, {"title": "誰是金融消費者", "plain": "接受金融服務業提供金融商品或服務的人。但專業投資機構、以及符合一定財力或專業能力的自然人或法人，不算。業者如果協助客戶『創造』符合形式條件的外觀，這個客戶還是金融消費者。", "mnemonic": "專業的不算；包裝出來的算。", "tip": "為了少做說明或適合度評估，教客戶『把資產湊到門檻』，不但沒用，還有第30-1條第2項1,000萬至5,000萬元的罰鍰。", "official": ["本法所稱金融消費者，指接受金融服務業提供金融商品或服務者。但不包括下列對象：", "一、專業投資機構。", "二、符合一定財力或專業能力之自然人或法人。", "前項專業投資機構之範圍及一定財力或專業能力之條件，由主管機關定之。", "金融服務業對自然人或法人未符合前項所定之條件，而協助其創造符合形式上之外觀條件者，該自然人或法人仍為本法所稱金融消費者。"], "has_official": true, "no": "金保4"}, {"title": "金融消費爭議", "plain": "金融消費者與金融服務業之間，因商品或服務產生的『民事』爭議。", "mnemonic": "民事爭議才走評議。", "official": ["本法所稱金融消費爭議，指金融消費者與金融服務業間因商品或服務所生之民事爭議。"], "has_official": true, "no": "金保5"}, {"title": "責任不能事先免除", "plain": "金融服務業對金融消費者的責任，不能預先約定限制或免除。這樣約定的部分無效。", "mnemonic": "免責條款，無效。", "tip": "客戶簽了『一切風險自負、公司概不負責』，不能因此免除公司依本法應負的責任。", "official": ["本法所定金融服務業對金融消費者之責任，不得預先約定限制或免除。", "違反前項規定者，該部分約定無效。"], "has_official": true, "no": "金保6"}, {"title": "公平合理、誠信，與善良管理人、忠實義務", "plain": "訂契約要本公平合理、平等互惠及誠信原則。條款顯失公平的部分無效；條款有疑義時，作有利於金融消費者的解釋。提供商品或服務要盡善良管理人的注意義務；商品或服務有信託、委託性質的，還要依法令或契約負忠實義務。", "mnemonic": "公平誠信、疑義利消費者、善管、信託委託要忠實。", "tip": "考試最愛：條款有疑義，解釋方向是『有利於金融消費者』，不是有利於公司。", "facts": {"head": ["情形", "法律效果"], "rows": [["條款顯失公平", "該部分條款無效"], ["條款有疑義", "作有利於金融消費者的解釋"], ["一般金融商品或服務", "盡善良管理人之注意義務"], ["有信託、委託等性質", "另負忠實義務"]]}, "official": ["金融服務業與金融消費者訂立提供金融商品或服務之契約，應本公平合理、平等互惠及誠信原則。", "金融服務業與金融消費者訂立之契約條款顯失公平者，該部分條款無效；契約條款如有疑義時，應為有利於金融消費者之解釋。", "金融服務業提供金融商品或服務，應盡善良管理人之注意義務；其提供之金融商品或服務具有信託、委託等性質者，並應依所適用之法規規定或契約約定，負忠實義務。"], "has_official": true, "no": "金保7"}, {"title": "廣告與招攬不得誤導", "plain": "刊登、播放廣告、業務招攬、營業促銷，不得有虛偽、詐欺、隱匿或其他足致他人誤信的情事，要確保廣告內容真實；對客戶負擔的義務，不能低於廣告內容與招攬時提示的資料或說明。不能藉『金融教育宣導』推薦個別金融商品或服務。", "mnemonic": "廣告說到做到；教育宣導不推薦商品。", "tip": "業務員口頭說明的內容，也會變成公司對客戶的義務下限。口頭保證不能當作沒說過。", "official": ["金融服務業刊登、播放廣告及進行業務招攬或營業促銷活動時，不得有虛偽、詐欺、隱匿或其他足致他人誤信之情事，並應確保其廣告內容之真實，其對金融消費者所負擔之義務不得低於前述廣告之內容及進行業務招攬或營業促銷活動時對金融消費者所提示之資料或說明。", "前項廣告、業務招攬及營業促銷活動之方式、內容及其他應遵行事項之辦法，由主管機關定之。", "金融服務業不得藉金融教育宣導，引薦個別金融商品或服務。"], "has_official": true, "no": "金保8"}, {"title": "簽約前要了解客戶，確保適合度", "plain": "訂契約前，要充分了解金融消費者的相關資料，確保商品或服務對他『適合』。要了解哪些資料、適合度要考量什麼，由主管機關訂辦法。", "mnemonic": "先了解人，再賣商品。", "tip": "第9條講『了解客戶＋適合度』，第10條才講『說明＋揭露風險』，不要混在一起。", "official": ["金融服務業與金融消費者訂立提供金融商品或服務之契約前，應充分瞭解金融消費者之相關資料，以確保該商品或服務對金融消費者之適合度。", "前項應充分瞭解之金融消費者相關資料、適合度應考量之事項及其他應遵行事項之辦法，由主管機關定之。"], "has_official": true, "no": "金保9"}, {"title": "簽約前要說明契約重要內容並揭露風險", "plain": "訂契約前，要向客戶充分說明商品、服務及契約的重要內容，並充分揭露風險。說明要用客戶能充分瞭解的文字或方式，內容包括交易成本、可能收益及風險。涉及個資的，要說明個資保護的權利與拒絕同意可能的不利益。複雜性高風險商品的說明揭露，原則上要錄音或錄影。", "mnemonic": "說明＋揭露風險；成本、收益、風險三樣；複雜高風險要錄音錄影。", "tip": "例外：非臨櫃的自動化通路交易，或客戶不同意錄音錄影時，可以不錄。授信不能只因客戶拒絕授權查聯徵，就唯一理由拒貸。", "facts": {"head": ["要說明、揭露的重點", "內容"], "rows": [["說明對象", "商品、服務、契約的重要內容"], ["揭露", "風險"], ["說明內容至少包括", "交易成本、可能之收益、風險"], ["複雜性高風險商品", "原則上錄音或錄影（非臨櫃自動化通路、客戶不同意除外）"]]}, "official": ["金融服務業與金融消費者訂立提供金融商品或服務之契約前，應向金融消費者充分說明該金融商品、服務及契約之重要內容，並充分揭露其風險。", "前項涉及個人資料之蒐集、處理及利用者，應向金融消費者充分說明個人資料保護之相關權利，以及拒絕同意可能之不利益；金融服務業辦理授信業務，應同時審酌借款戶、資金用途、還款來源、債權保障及授信展望等授信原則，不得僅因金融消費者拒絕授權向經營金融機構間信用資料之服務事業查詢信用資料，作為不同意授信之唯一理由。", "第一項金融服務業對金融消費者進行之說明及揭露，應以金融消費者能充分瞭解之文字或其他方式為之，其內容應包括但不限交易成本、可能之收益及風險等有關金融消費者權益之重要內容；其相關應遵循事項之辦法，由主管機關定之。", "金融服務業提供之金融商品屬第十一條之二第二項所定之複雜性高風險商品者，前項之說明及揭露，除以非臨櫃之自動化通路交易或金融消費者不予同意之情形外，應錄音或錄影。"], "has_official": true, "no": "金保10"}, {"title": "違反適合度或說明義務的損害賠償", "plain": "違反第9條或第10條，造成客戶損害，要負賠償責任。除非業者能證明損害不是因為沒了解客戶適合度，或沒說明、說明不實、錯誤、沒充分揭露風險造成的。", "mnemonic": "舉證責任在業者。", "tip": "實務上要自保，就是留下『有了解客戶、有說明、有揭露』的紀錄（簽名、錄音、問卷）。", "official": ["金融服務業違反前二條規定，致金融消費者受有損害者，應負損害賠償責任。但金融服務業能證明損害之發生非因其未充分瞭解金融消費者之商品或服務適合度或非因其未說明、說明不實、錯誤或未充分揭露風險之事項所致者，不在此限。"], "has_official": true, "no": "金保11"}, {"title": "業務人員酬金制度", "plain": "金融服務業要訂定業務人員酬金制度，並提報董（理）事會通過。制度要衡平考量客戶權益、商品對業者和客戶可能產生的各項風險，不能只看業績目標達成。", "mnemonic": "獎金不能只看業績。", "tip": "這條直接影響業務員的獎金設計，是新近修法加入的重點。", "official": ["金融服務業應訂定業務人員之酬金制度，並提報董（理）事會通過。", "前項酬金制度應衡平考量客戶權益、金融商品或服務對金融服務業及客戶可能產生之各項風險，不得僅考量金融商品或服務之業績目標達成情形。", "前項金融服務業業務人員酬金制度應遵行之原則，由所屬同業公會擬訂或經主管機關指定之公會團體擬訂，報請主管機關核定。"], "has_official": true, "no": "金保11-1"}, {"title": "複雜性高風險商品要董事會通過", "plain": "初次銷售的複雜性高風險商品，要報經董（理）事會或常務董（理）事會通過。哪些算複雜性高風險商品由主管機關定。外國金融服務業在臺分支機構，則要經其在臺負責人同意。", "mnemonic": "首賣複雜商品，董事會點頭。", "official": ["金融服務業初次銷售之複雜性高風險商品應報經董（理）事會或常務董（理）事會通過。", "前項所定複雜性高風險商品類型，由主管機關定之。", "第一項複雜性高風險商品及前條第一項之酬金制度，於外國金融服務業在臺分支機構，應經其在臺負責人同意。"], "has_official": true, "no": "金保11-2"}, {"title": "懲罰性賠償", "plain": "業者違反本法要負賠償責任時，故意所致的損害，法院可以依客戶請求，酌定損害額3倍以下的懲罰性賠償；過失所致的，可酌定1倍以下。請求權從知道可以請求時起2年不行使就消滅；從賠償原因發生起超過5年，也消滅。", "mnemonic": "故意3倍、過失1倍；2年知、5年絕。", "facts": {"head": ["項目", "數字"], "rows": [["故意", "損害額3倍以下"], ["過失", "損害額1倍以下"], ["時效（知道時起）", "2年"], ["時效（原因發生起）", "5年"]]}, "official": ["金融服務業因違反本法規定應負損害賠償責任者，對於故意所致之損害，法院得因金融消費者之請求，依侵害情節，酌定損害額三倍以下之懲罰性賠償；對於過失所致之損害，得酌定損害額一倍以下之懲罰性賠償。", "前項懲罰性賠償請求權，自請求權人知有得受賠償之原因時起二年間不行使而消滅；自賠償原因發生之日起逾五年者，亦同。"], "has_official": true, "no": "金保11-3"}, {"title": "納入內部控制與稽核", "plain": "金融服務業要把第8條到第10條、第11-1條、第11-2條規定的事項，納入內部控制及稽核制度並確實執行。", "mnemonic": "待客規定要進內控。", "official": ["金融服務業應將第八條至第十條、第十一條之一及第十一條之二規定事項，納入其內部控制及稽核制度，並確實執行。"], "has_official": true, "no": "金保12"}, {"title": "先申訴、再評議", "plain": "客戶有爭議，要先向金融服務業申訴；業者要在收到申訴後30日內處理並回覆。客戶不接受處理結果，或業者逾期不處理，客戶可以在收到結果或期限屆滿後60日內，向爭議處理機構（金融消費評議中心）申請評議。", "mnemonic": "申訴30日，評議60日。", "facts": {"head": ["步驟", "期限"], "rows": [["業者處理申訴並回覆", "收到申訴後30日內"], ["客戶申請評議", "收到處理結果或期限屆滿後60日內"]]}, "official": ["為公平合理、迅速有效處理金融消費爭議，以保護金融消費者權益，應依本法設立爭議處理機構。", "金融消費者就金融消費爭議事件應先向金融服務業提出申訴，金融服務業應於收受申訴之日起三十日內為適當之處理，並將處理結果回覆提出申訴之金融消費者；金融消費者不接受處理結果者或金融服務業逾上述期限不為處理者，金融消費者得於收受處理結果或期限屆滿之日起六十日內，向爭議處理機構申請評議；金融消費者向爭議處理機構提出申訴者，爭議處理機構之金融消費者服務部門應將該申訴移交金融服務業處理。", "爭議處理機構除處理金融消費爭議外，並應辦理對金融服務業及金融消費者之教育宣導，使金融服務業與金融消費者均能充分瞭解正確之金融消費觀念及金融消費關係之權利與義務，以有效預防金融消費爭議發生。", "爭議處理機構辦理金融消費爭議處理及前項業務，得向金融服務業收取年費及爭議處理服務費。", "前項年費及服務費之收取標準及有關規定由主管機關定之。"], "has_official": true, "no": "金保13"}, {"title": "申訴或評議會中斷時效", "plain": "客戶依申訴或評議內容主張的請求權，時效因申訴或申請評議而中斷。但申訴或評議申請撤回、申訴後未申請評議、評議申請不受理、評議不成立，時效視為不中斷。", "mnemonic": "申訴評議中斷時效；撤回、沒後續、不受理、不成立就當沒中斷。", "official": ["金融消費者依其申訴或申請評議內容所得主張之請求權，其時效因依本法申訴或申請評議而中斷。", "有下列情形之一者，前項請求權時效視為不中斷：", "一、申訴或評議之申請經撤回。", "二、申訴後未依第十三條第二項規定申請評議。", "三、評議之申請經不受理。", "四、評議不成立。"], "has_official": true, "no": "金保21"}, {"title": "評議書", "plain": "評議委員會的評議決定，以爭議處理機構名義作成評議書，送達當事人。", "mnemonic": "評議決定，用評議書送達。", "official": ["評議委員會之評議決定應以爭議處理機構名義作成評議書，送達當事人。", "前項送達，準用民事訴訟法有關送達之規定。"], "has_official": true, "no": "金保28"}, {"title": "評議成立：雙方接受，且業者一定額度以下必須接受", "plain": "當事人要在評議書載明的期限內，以書面表示接受或拒絕。雙方都接受，評議才成立。業者如果事前書面同意，或在契約等文件中表明願意適用評議程序，對於一定額度以下的評議決定，必須接受。這個額度由爭議處理機構擬訂，報主管機關核定後公告。", "mnemonic": "雙方接受才成立；小額，業者不能拒絕。", "tip": "『一定額度』是公告的數字，不在法條裡，要用時請查最新公告。", "official": ["當事人應於評議書所載期限內，以書面通知爭議處理機構，表明接受或拒絕評議決定之意思。評議經當事人雙方接受而成立。", "金融服務業於事前以書面同意或於其商品、服務契約或其他文件中表明願意適用本法之爭議處理程序者，對於評議委員會所作其應向金融消費者給付每一筆金額或財產價值在一定額度以下之評議決定，應予接受；評議決定超過一定額度，而金融消費者表明願意縮減該金額或財產價值至一定額度者，亦同。", "前項一定額度，由爭議處理機構擬訂，報請主管機關核定後公告之。"], "has_official": true, "no": "金保29"}, {"title": "評議成立後可送法院核可", "plain": "客戶可以在評議成立之日起90日（不變期間）內，申請把評議書送請法院核可；評議中心要在5日內送出。法院核可後，評議書與民事確定判決有同一效力，當事人不能再起訴或再申訴、申請評議。", "mnemonic": "90日申請、5日送件，核可＝確定判決。", "tip": "業者在送請核可前已完全履行評議內容的，免送核可。", "facts": {"head": ["項目", "數字"], "rows": [["客戶申請送法院核可", "評議成立日起90日（不變期間）"], ["評議中心送法院", "受理申請後5日內"], ["核可後效力", "與民事確定判決同一效力"]]}, "official": ["金融消費者得於評議成立之日起九十日之不變期間內，申請爭議處理機構將評議書送請法院核可。爭議處理機構應於受理前述申請之日起五日內，將評議書及卷證送請爭議處理機構事務所所在地之管轄地方法院核可。但爭議處理機構送請法院核可前，金融服務業已依評議成立之內容完全履行者，免送請核可。", "除有第三項情形外，法院對於前項之評議書應予核可。法院核可後，應將經核可之評議書併同評議事件卷證發還爭議處理機構，並將經核可之評議書以正本送達當事人及其代理人。", "法院因評議書內容牴觸法令、違背公共秩序或善良風俗或有其他不能強制執行之原因而未予核可者，法院應將其理由通知爭議處理機構及當事人。", "評議書依第二項規定經法院核可者，與民事確定判決有同一之效力，當事人就該事件不得再行起訴或依本法申訴、申請評議。", "評議書經法院核可後，依法有無效或得撤銷之原因者，當事人得向管轄地方法院提起宣告評議無效或撤銷評議之訴。", "前項情形，準用民事訴訟法第五百條至第五百零二條及第五百零六條、強制執行法第十八條第二項規定。"], "has_official": true, "no": "金保30"}, {"title": "罰鍰：30萬至1,000萬元", "plain": "違反廣告招攬辦法、第9條適合度、第10條說明揭露、第11-1條酬金制度規定的，罰30萬至1,000萬元。協助客戶創造符合『專業投資人』形式條件的，罰1,000萬至5,000萬元。情節重大的，主管機關可在所得利益範圍內加重，不受上限限制。", "mnemonic": "待客四件事違規：30萬到1,000萬；包裝專業投資人：1,000萬到5,000萬。", "facts": {"head": ["違規", "罰鍰"], "rows": [["廣告招攬方式或內容違規、未做適合度、未說明揭露、酬金制度違規", "30萬至1,000萬元"], ["協助客戶創造符合專業投資人的形式條件", "1,000萬至5,000萬元"], ["上述且情節重大", "可在所得利益範圍內加重"]]}, "official": ["金融服務業有下列情形之一者，處新臺幣三十萬元以上一千萬元以下罰鍰：", "一、違反第八條第二項所定辦法中有關廣告、業務招攬、營業促銷活動方式或內容之規定。", "二、違反第九條第一項規定未充分瞭解金融消費者相關資料及確保金融消費者之適合度，或同條第二項所定辦法中有關適合度應考量事項之規定。", "三、違反第十條第一項規定，未向金融消費者充分說明金融商品、服務、契約之重要內容或充分揭露風險，或違反同條第三項所定辦法中有關說明、揭露應以金融消費者能充分瞭解之方式或內容之規定。", "四、違反第十一條之一規定，未訂定或未依主管機關核定應遵行之原則訂定酬金制度或未確實執行。", "金融服務業對自然人或法人未符合第四條第二項所定之條件，而協助其創造符合形式上之外觀條件者，處新臺幣一千萬元以上五千萬元以下罰鍰。", "金融服務業有前二項情形之一，且情節重大者，主管機關得於其所得利益之範圍內酌量加重，不受前二項罰鍰最高額之限制。"], "has_official": true, "no": "金保30-1"}, {"title": "罰鍰：30萬至300萬元", "plain": "酬金制度未提報董（理）事會通過，或初次銷售的複雜性高風險商品未報經董（理）事會或常務董（理）事會通過（外商分行未經在臺負責人同意），罰30萬至300萬元。", "mnemonic": "沒過董事會：30萬到300萬。", "official": ["金融服務業有下列情形之一者，處新臺幣三十萬元以上三百萬元以下罰鍰：", "一、違反第十一條之一第一項或第十一條之二第三項規定，業務人員酬金制度未提報董（理）事會通過，或未經外國金融服務業在臺分支機構負責人同意。", "二、違反第十一條之二第一項或第三項規定，初次銷售之複雜性高風險商品未報經董（理）事會或常務董（理）事會通過，或未經外國金融服務業在臺分支機構負責人同意。"], "has_official": true, "no": "金保30-2"}], "tables": [{"title": "數字與期限速記：金融消費者保護法", "head": ["條", "數字", "什麼事"], "rows": [["13", "30日", "業者處理客戶申訴並回覆的期限"], ["13", "60日", "客戶不接受或業者逾期，申請評議的期限"], ["30", "90日（不變期間）", "評議成立後，客戶申請送法院核可"], ["30", "5日內", "評議中心將評議書送法院"], ["11-3", "3倍／1倍", "懲罰性賠償：故意最高3倍、過失最高1倍"], ["11-3", "2年／5年", "懲罰性賠償請求權時效"], ["30-1", "30萬至1,000萬元", "廣告、適合度、說明揭露、酬金制度違規"], ["30-1", "1,000萬至5,000萬元", "協助客戶創造專業投資人的形式條件"], ["30-2", "30萬至300萬元", "酬金制度或複雜性高風險商品沒過董事會"]]}, {"title": "誰是金融消費者", "head": ["對象", "是不是金融消費者", "依據"], "rows": [["一般自然人或法人", "是", "第4條第1項"], ["專業投資機構", "不是", "第4條第1項第1款"], ["符合一定財力或專業能力的自然人或法人", "不是", "第4條第1項第2款"], ["業者協助『包裝』成符合條件的人", "仍然是", "第4條第3項"]]}, {"title": "待客四件事：廣告、適合度、說明、酬金", "head": ["條", "時點", "要做什麼", "違反的罰鍰"], "rows": [["8", "廣告、招攬、促銷", "內容真實，不得誤導；不得藉金融教育宣導引薦個別商品", "30萬至1,000萬元（違反廣告辦法）"], ["9", "簽約前", "充分了解客戶，確保適合度", "30萬至1,000萬元"], ["10", "簽約前", "充分說明重要內容並揭露風險", "30萬至1,000萬元"], ["11-1", "制度面", "酬金制度要衡平考量客戶權益與風險，提報董事會", "30萬至1,000萬元；未提報董事會30萬至300萬元"]]}], "cards": [{"ref": "金保4", "front": "哪些人不算金融消費者？", "back": "專業投資機構，以及符合一定財力或專業能力的自然人或法人。", "id": 1}, {"ref": "金保4", "front": "業者幫客戶『湊』出專業投資人的條件，客戶還是不是金融消費者？", "back": "是。業者還會被罰1,000萬至5,000萬元（第30-1條第2項）。", "id": 2}, {"ref": "金保6", "front": "能不能在契約裡預先約定免除業者對金融消費者的責任？", "back": "不能。這樣的約定無效。", "id": 3}, {"ref": "金保7", "front": "金融商品契約條款有疑義時，要作誰有利的解釋？", "back": "有利於金融消費者的解釋。", "id": 4}, {"ref": "金保7", "front": "提供的服務有信託、委託性質時，除了善良管理人注意義務，還要負什麼義務？", "back": "忠實義務。", "id": 5}, {"ref": "金保8", "front": "可不可以藉『金融教育宣導』推薦個別金融商品？", "back": "不可以。", "id": 6}, {"ref": "金保8", "front": "業務員在招攬時提示的資料或說明，和公司的義務有什麼關係？", "back": "公司對客戶的義務，不能低於廣告內容與招攬時提示的資料或說明。", "id": 7}, {"ref": "金保9", "front": "簽約前『了解客戶、確保適合度』是第幾條？", "back": "第9條。", "id": 8}, {"ref": "金保10", "front": "簽約前『說明重要內容、揭露風險』是第幾條？說明內容至少包括什麼？", "back": "第10條；至少包括交易成本、可能之收益及風險。", "id": 9}, {"ref": "金保10", "front": "複雜性高風險商品的說明與揭露，原則上要怎麼留存？", "back": "錄音或錄影（非臨櫃自動化通路、客戶不同意者除外）。", "id": 10}, {"ref": "金保11-1", "front": "業務人員的酬金制度，不能只考量什麼？要由誰通過？", "back": "不能只考量業績目標達成；要提報董（理）事會通過。", "id": 11}, {"ref": "金保11-3", "front": "懲罰性賠償的上限？", "back": "故意所致損害：3倍以下；過失所致損害：1倍以下。", "id": 12}, {"ref": "金保13", "front": "業者收到客戶申訴，要在幾日內處理？客戶要在幾日內申請評議？", "back": "30日內處理；客戶收到結果或期限屆滿後60日內申請評議。", "id": 13}, {"ref": "金保30", "front": "評議成立後，客戶要在幾日內申請送法院核可？核可後效力如何？", "back": "90日（不變期間）；與民事確定判決同一效力。", "id": 14}, {"ref": "金保30-1", "front": "違反廣告、適合度、說明揭露、酬金制度規定的罰鍰範圍？", "back": "30萬至1,000萬元。", "id": 15}], "scenarios": [{"ref": "金保8", "q": "業務員為了吸引客戶，口頭承諾某商品『保證不會虧本』，但公司的廣告和文件並沒有這樣寫。依金融消費者保護法第8條，下列何者正確？", "opts": ["只有廣告文字才算，口頭說的不算", "業務招攬時提示的說明，也是公司義務的下限，且不得有足致他人誤信的情事", "只要客戶事後沒有異議就沒問題", "公司只要事後澄清就不用負責"], "ans": 1, "why": "第8條規定招攬、促銷時不得有虛偽、隱匿或足致誤信的情事，公司對客戶的義務也不得低於招攬時提示的資料或說明。口頭保證不能當作沒說過。"}, {"ref": "金保4", "q": "一位客戶資產不夠『專業投資人』的門檻，理專教他先把資金匯進帳戶，達到門檻後簽成專業投資人。這位客戶現在算不算金融消費者？", "opts": ["不算，因為形式上符合門檻", "算，而且業者協助包裝可罰1,000萬至5,000萬元", "算，但業者不會被罰", "不算，因為客戶自己同意"], "ans": 1, "why": "第4條第3項：業者協助創造符合形式條件的外觀，客戶仍然是金融消費者；第30-1條第2項對業者罰1,000萬至5,000萬元。"}, {"ref": "金保7", "q": "金融商品契約有一個條款，雙方對文字有不同解釋。依第7條，應如何解釋？", "opts": ["有利於金融服務業", "有利於金融消費者", "以公司內規為準", "交由業務員決定"], "ans": 1, "why": "第7條第2項：契約條款如有疑義時，應為有利於金融消費者之解釋。"}, {"ref": "金保9", "q": "在簽約『前』，要先了解客戶的資料，確保商品對客戶適合，這是第幾條的要求？", "opts": ["第7條", "第8條", "第9條", "第10條"], "ans": 2, "why": "第9條：充分了解金融消費者相關資料，確保適合度。第10條才是充分說明與揭露風險。"}, {"ref": "金保10", "q": "依第10條，向客戶說明金融商品時，說明內容至少要包括下列哪一項？", "opts": ["業務員的業績排名", "交易成本、可能之收益及風險", "公司股東名單", "同業的商品比較"], "ans": 1, "why": "第10條第3項：說明及揭露的內容包括但不限於交易成本、可能之收益及風險等客戶權益的重要內容。"}, {"ref": "金保10", "q": "銀行首次銷售複雜性高風險商品，客戶在櫃台當面購買，也同意錄音。依第10條第4項，說明與揭露應該如何處理？", "opts": ["口頭說明即可", "錄音或錄影", "客戶簽名即可，不必錄", "只要在網站公告"], "ans": 1, "why": "複雜性高風險商品的說明與揭露，原則上要錄音或錄影；例外是非臨櫃的自動化通路交易，或客戶不同意。本題是臨櫃且客戶同意，所以要錄。"}, {"ref": "金保11-1", "q": "某公司的業務獎金制度，只看『保費業績達成率』，完全不考慮客戶風險與客訴。依第11-1條，這樣的制度？", "opts": ["可以，業績越高獎金越高最公平", "不行，酬金制度要衡平考量客戶權益與風險，不能只看業績目標達成", "可以，只要不給主管看", "可以，只要客戶沒有投訴"], "ans": 1, "why": "第11-1條第2項：酬金制度應衡平考量客戶權益、商品對業者及客戶可能產生的風險，不得僅考量業績目標達成。"}, {"ref": "金保13", "q": "客戶向保險公司申訴，公司逾期30日都沒有處理。客戶要在多久內向金融消費評議中心申請評議？", "opts": ["期限屆滿後60日內", "期限屆滿後30日內", "期限屆滿後90日內", "沒有期限"], "ans": 0, "why": "第13條第2項：客戶不接受處理結果，或業者逾期不處理，可在收到結果或期限屆滿之日起60日內申請評議。"}, {"ref": "金保11-3", "q": "業者因過失違反本法，造成客戶損害，法院依客戶請求，懲罰性賠償最多可以酌定多少？", "opts": ["不可以有懲罰性賠償", "損害額1倍以下", "損害額3倍以下", "損害額5倍以下"], "ans": 1, "why": "第11-3條：故意最高3倍；過失最高1倍。"}, {"ref": "金保30", "q": "評議書經法院核可後，下列何者正確？", "opts": ["客戶仍可再向法院起訴", "與民事確定判決有同一效力，當事人不得再起訴或申訴", "業者可以隨時撤銷", "需再經主管機關核准才有效"], "ans": 1, "why": "第30條第4項：評議書依規定經法院核可者，與民事確定判決有同一之效力，當事人就該事件不得再行起訴或依本法申訴、申請評議。"}], "chNo": "01", "summary": "金融從業人員每天都在用的一部法：誰是金融消費者、契約要公平誠信、廣告不能誤導、簽約前要了解客戶並說明風險、業務人員的獎金制度，以及出了爭議怎麼申訴、評議。考試的職業道德題與情境題很多都從這裡出。", "scope": "收錄金融消費者保護法第3、4、5、6、7、8、9、10、11、11-1、11-2、11-3、12、13、21、28、29、30、30-1、30-2條。", "nav": {"prev": null, "next": {"file": "ch02.html", "label": "第2章 廣告、適合度、說明揭露三個辦法：待客的具體做法"}}}</script>

const factsT=f=>f?'<div class="tw"><table class="ft"><thead><tr>'+f.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+f.rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'';
const LAWMAP={"金保": "金融消費者保護法", "適": "適合度辦法", "說": "說明揭露辦法", "廣": "廣告辦法", "個": "個資法", "洗": "洗錢防制法", "洗辦": "金融機構防制洗錢辦法", "保": "保險法", "規": "業務員管理規則", "招": "招攬核保理賠辦法", "證": "證券交易法", "證商": "證券商負責人與業務人員管理規則", "期商": "期貨商負責人及業務員管理規則", "投顧": "投信投顧法", "投保": "投保法", "信": "信託法", "信業": "信託業法", "銀": "銀行法", "刑": "刑法", "貪": "貪污治罪條例", "獎": "檢舉貪污獎勵辦法"};
const lab=x=>{const m=String(x).match(/^([^0-9]+)([0-9]+(?:-[0-9]+)?)$/);return m&&LAWMAP[m[1]]?LAWMAP[m[1]]+'第'+m[2]+'條':x};
const mem={};
const store={get(k){try{const v=localStorage.getItem(k);return v===null?mem[k]:v}catch(e){return mem[k]}},set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const BOXKEY='twlife_ethics_boxes_v1';
let boxes={};try{boxes=JSON.parse(store.get(BOXKEY)||'{}')}catch(e){boxes={}}
const saveBoxes=()=>store.set(BOXKEY,JSON.stringify(boxes));
function Flash(root,getCards){
  let queue=[],cur=null,flipped=false;
  function build(){const cs=getCards();queue=shuffle(cs.filter(c=>(boxes[c.key]||0)<1)).sort((a,b)=>(boxes[a.key]||0)-(boxes[b.key]||0));flipped=false}
  function render(){
    const cs=getCards(),n=cs.length,done=cs.filter(c=>(boxes[c.key]||0)>=1).length;
    let h='<div class="stat">已熟練 '+done+' / '+n+' 張（答對 1 次視為熟練，進度存在這個瀏覽器）</div><div class="bar"><i style="width:'+(n?done/n*100:0)+'%"></i></div>';
    if(!n){root.innerHTML=h+'<div class="card"><p>沒有可用的閃卡。</p></div>';return}
    if(!queue.length){root.innerHTML=h+'<div class="card"><h3>全部熟練了</h3><p>可以去做情境題，或重設後再來一輪。</p></div><div class="row"><button class="btn" data-a="reset">重設進度</button></div>';return}
    cur=queue[0];
    h+='<div class="card fc" tabindex="0" role="button" data-a="flip"><small>'+(cur.tag?esc(cur.tag)+'｜':'')+esc(lab(cur.ref))+'｜剩 '+queue.length+' 張</small><div class="q">'+esc(cur.front)+'</div>'+(flipped?'<div class="a"><span class="lab fact">答案</span>'+esc(cur.back)+'</div>':'<small>點一下翻面</small>')+'</div>';
    if(flipped)h+='<div class="row"><button class="btn bad" data-a="no">還不熟</button><button class="btn ok" data-a="yes">會了</button></div>';
    h+='<div class="row"><button class="btn" data-a="reset">重設進度</button></div>';
    root.innerHTML=h;
  }
  root.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
    if(a==='flip'){flipped=!flipped;render()}
    else if(a==='reset'){if(confirm('確定要清除這些閃卡的進度？')){getCards().forEach(c=>delete boxes[c.key]);saveBoxes();build();render()}}
    else if(cur&&(a==='yes'||a==='no')){const ok=a==='yes';boxes[cur.key]=ok?Math.min(1,(boxes[cur.key]||0)+1):0;saveBoxes();queue.shift();if(!ok||boxes[cur.key]<1)queue.splice(queue.length?Math.max(1,Math.min(queue.length,ok?6:3)):0,0,cur);flipped=false;render()}});
  root.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.fc')){e.preventDefault();flipped=!flipped;render()}});
  return {refresh(){build();render()}};
}
function Quiz(root,getItems,perRound){
  let items=[],score=0,answered=0,done=false;
  function draw(){
    const perms=items.map(s=>shuffle(s.opts.map((_,k)=>k)));
    root.innerHTML='<div class="stat" id="sc"></div>'+items.map((s,i)=>'<div class="card" data-i="'+i+'"><b>'+(i+1)+'. </b><span class="lab my">'+(s.tag?esc(s.tag)+' ':'')+esc(lab(s.ref))+'</span>'+esc(s.q)+perms[i].map((k,pos)=>'<button class="opt" data-o="'+k+'">'+String.fromCharCode(65+pos)+'. '+esc(s.opts[k])+'</button>').join('')+'<div class="why"></div></div>').join('')+'<div id="qend"></div>';
    score=0;answered=0;upd();
  }
  function upd(){const el=$('#sc',root);if(el)el.textContent='已作答 '+answered+' / '+items.length+'，答對 '+score+' 題';
    if(perRound&&answered===items.length&&items.length){$('#qend',root).innerHTML='<div class="card"><h3>這一組：'+score+' / '+items.length+'</h3></div><div class="row"><button class="btn pri" data-a="again">再來一組</button></div>'}}
  function again(){const all=getItems();items=perRound?shuffle(all).slice(0,perRound):all;draw()}
  root.addEventListener('click',e=>{
    const ag=e.target.closest('[data-a="again"]');if(ag){again();window.scrollTo(0,root.offsetTop-60);return}
    const b=e.target.closest('.opt');if(!b)return;const box=b.closest('.card');if(box.dataset.done)return;
    const s=items[+box.dataset.i],j=+b.dataset.o;box.dataset.done=1;answered++;if(j===s.ans)score++;
    let right='';$$('.opt',box).forEach((x,pos)=>{const k=+x.dataset.o;if(k===s.ans){x.classList.add('right');right=String.fromCharCode(65+pos)}else if(k===j)x.classList.add('wrong')});
    const w=$('.why',box);w.style.display='block';w.innerHTML=(j===s.ans?'答對了。':'答錯了，正解是 '+right+'。')+esc(s.why);upd()});
  return {refresh:again};
}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const LAWS=D.laws;
$('#h1').textContent=D.chapter+'｜'+D.title;
$('#intro').textContent=D.summary||'';
document.title=D.chapter+' '+D.title;
$('#foot').innerHTML='官方來源：'+LAWS.map(L=>esc(L.name)+'（'+esc(L.amended)+(L.kind==='press'?'發布':'修正')+'）'+(L.note?'｜'+esc(L.note)+'｜':'')+'<a href="'+esc(L.url)+'" target="_blank" rel="noopener">'+esc(L.url)+'</a>').join('<br>')+(D.scope?'<br>'+esc(D.scope):'')+'<br>條文原文取自法務部全國法規資料庫的公開資料鏡像（更新日 2026-10-16），尚未逐條與官網現行頁面比對；「白話」「口訣」「情境題」為編寫者整理，不是法條。法規可能再修正，請以官方最新公告為準；本內容不是法律意見。';
const TABS=[['read','條文速讀'],['table','對照表'],['cards','閃卡'],['quiz','情境題']];
const nav=$('#nav');
TABS.forEach(([id,name])=>{const b=document.createElement('button');b.textContent=name;b.setAttribute('role','tab');b.dataset.id=id;b.onclick=()=>show(id);nav.appendChild(b)});
let curTab='read';
function show(id,anchor){curTab=id;TABS.forEach(([t])=>$('#s-'+t).classList.toggle('on',t===id));$$('button',nav).forEach(b=>b.setAttribute('aria-selected',b.dataset.id===id));
  history.replaceState(null,'','#'+id+(anchor?'/'+anchor:''));
  if(anchor){const el=document.getElementById(anchor);if(el){const d=el.querySelector('details');el.scrollIntoView({block:'start'});el.classList.add('hl')}}else window.scrollTo(0,0)}
$('#s-read').innerHTML=(D.alerts||[]).map(a=>'<div class="banner"><b>'+esc(a.t)+'</b>'+esc(a.d)+'</div>').join('')+D.clauses.map(c=>{
  const off=c.official.map(p=>'<p>'+esc(p)+'</p>').join('');
  return '<div class="card" id="c'+esc(c.no)+'"><h3><span class="no">'+esc(lab(c.no))+'</span>'+esc(c.title)+'</h3>'
   +'<div class="pw"><span class="lab my">白話</span>'+fmt(c.plain)+'</div>'+factsT(c.facts)
   +(c.mnemonic?'<div class="mn"><span class="lab my">口訣</span>'+esc(c.mnemonic)+'</div>':'')
   +(c.tip?'<p><span class="lab hint">提醒</span>'+esc(c.tip)+'</p>':'')
   +(c.official.length?'<details><summary>展開官方條文原文</summary><div class="off"><span class="lab fact">原文</span>'+off+'</div></details>':'')+'</div>'}).join('');
$('#s-table').innerHTML=D.tables.map((t,i)=>'<h3 id="t'+i+'">'+esc(t.title)+'</h3><div class="tw"><table><thead><tr>'+t.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+t.rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>').join('');
const cardsAll=D.cards.map(c=>({key:'ch'+D.chNo+':'+c.id,ref:c.ref,front:c.front,back:c.back}));
const fl=Flash($('#s-cards'),()=>cardsAll);fl.refresh();
const qz=Quiz($('#s-quiz'),()=>D.scenarios,0);qz.refresh();
// 上下章
const N=D.nav||{};
function setLink(el,o,dir){if(o){el.href=o.file;el.textContent=dir==='p'?'← '+o.label:o.label+' →'}else{el.style.visibility='hidden'}}
setLink($('#prev'),N.prev,'p');setLink($('#next'),N.next,'n');
// 左右滑動：換分頁，到頭就換章
function step(d){const i=TABS.findIndex(t=>t[0]===curTab)+d;
  if(i<0){if(N.prev)location.href=N.prev.file+'#read';return}
  if(i>=TABS.length){if(N.next)location.href=N.next.file+'#read';return}
  show(TABS[i][0])}
let sx=0,sy=0,skip=false;
document.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;const el=e.target&&e.target.nodeType===1?e.target:(e.target&&e.target.parentElement);skip=!!(el&&el.closest('.tw,nav,input,.off,#cap'))},{passive:true});
document.addEventListener('touchend',e=>{if(skip)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>70&&Math.abs(dy)<45){step(dx<0?1:-1)}},{passive:true});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1)});
// 深層連結
function route(){const h=(location.hash||'#read').slice(1).split('/');show(TABS.some(t=>t[0]===h[0])?h[0]:'read',h[1]?decodeURIComponent(h[1]):null)}
window.addEventListener('hashchange',route);route();
</script>
<script>// 語音：導覽列多一顆「🎧 語音」鈕，按下就從頭播放；畫面上方只留最後兩行字幕（固定高度，不會推動下面的頁面）。
// 再按一次＝暫停／繼續；點字幕也一樣；字幕右側的 ✕ 關閉。播完一段自動接下一段。
// 資料來自 mp3/timing/chNN.js（window.AUDIO_TIMING），由 make_timing.py 產生；沒有這個檔就不會出現「語音」鈕。
(function(){
const T=window.AUDIO_TIMING;
if(!T||!T.segments||!T.segments.length)return;
const BASE='mp3',segs=T.segments,au=document.getElementById('au');
const cap=document.getElementById('cap'),rowA=document.getElementById('cap-a'),rowB=document.getElementById('cap-b'),top=document.getElementById('top');
const SP={F:'主持人',M:'專家'},PUNC='，、：；。！？';
let si=-1,lines=[],li=-2,started=false,raf=0,endTimer=0;

// ---- 按鈕 ----
const btn=document.createElement('button');
btn.id='au-btn';btn.type='button';btn.textContent='🎧 語音';btn.setAttribute('aria-pressed','false');btn.title='按下開始聽這一章的語音重點';
nav.appendChild(btn);
function label(){btn.textContent=!started?'🎧 語音':(au.paused?'▶ 語音':'⏸ 語音');btn.setAttribute('aria-pressed',started?'true':'false')}

// ---- 字幕斷行：依目前寬度，把每句切成一行一行 ----
const fontPx=()=>parseFloat(getComputedStyle(rowB).fontSize)||17;
const cw=(s,f)=>{let w=0;for(const c of s)w+=c.charCodeAt(0)<128?f*0.56:f;return w};
function wrap(text,lim0,lim,f){
  const parts=text.match(new RegExp('[^'+PUNC+']+['+PUNC+']*|['+PUNC+']+','g'))||[text];
  const out=[];let cur='',w=0,lim_=lim0;
  const push=()=>{if(cur){out.push(cur);cur='';w=0;lim_=lim}};
  for(const p of parts){
    const pw=cw(p,f);
    if(w+pw<=lim_){cur+=p;w+=pw;continue}
    push();
    if(pw<=lim_){cur=p;w=pw;continue}
    for(const c of p){const x=cw(c,f);if(w+x>lim_)push();cur+=c;w+=x}
  }
  push();return out;
}
function buildLines(){
  lines=[];if(si<0)return;
  const s=segs[si],f=fontPx(),avail=Math.max(120,(rowB.clientWidth||cap.clientWidth||300)-2);let prevSpk=null;
  s.cues.forEach((c,k)=>{
    const t0=c.t,t1=k+1<s.cues.length?s.cues[k+1].t:s.dur;
    const span=Math.max(0.4,t1-t0-0.7);                       // 句尾約有 0.7 秒停頓，不分給字
    const badge=c.spk!==prevSpk;prevSpk=c.spk;
    const bw=badge?SP[c.spk].length*12+18:0;                   // 說話者小標籤的寬度（12px 字＋留白）
    const ls=wrap(c.text,avail-bw,avail,f),ws=ls.map(x=>Math.max(1,cw(x,f))),tot=ws.reduce((a,b)=>a+b,0);
    let acc=0;ls.forEach((x,j)=>{lines.push({t:t0+span*acc/tot,spk:c.spk,badge:badge&&j===0,text:x});acc+=ws[j]});
  });
}
const esc2=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const rowHTML=l=>l?(l.badge?'<span class="sp '+l.spk+'">'+SP[l.spk]+'</span>':'')+esc2(l.text):'';
function paint(){
  const t=au.currentTime;let j=-1;
  for(let k=0;k<lines.length;k++){if(lines[k].t<=t+0.05)j=k;else break}
  if(j===li)return;li=j;
  rowA.innerHTML=rowHTML(lines[j-1]);rowB.innerHTML=rowHTML(lines[j]);
}
function tick(){paint();raf=au.paused?0:requestAnimationFrame(tick)}

// ---- 播放 ----
const nice=t=>String(t).replace(/_/g,' ');
function meta(){if('mediaSession' in navigator&&window.MediaMetadata&&si>=0)navigator.mediaSession.metadata=new MediaMetadata({title:nice(segs[si].title),artist:D.chapter+' '+D.title,album:'考試複習語音'})}
function pad(){document.documentElement.style.scrollPaddingTop=cap.hidden?'':(top.offsetHeight+8)+'px'}
function setSrc(i){if(si===i)return;si=i;li=-2;rowA.innerHTML=rowB.innerHTML='';au.src=encodeURI(BASE+'/'+segs[i].file);au.load();au.playbackRate=1;buildLines();meta()}
function playSeg(i){
  setSrc(i);
  const go=()=>{buildLines();au.play().catch(()=>{})};
  if(au.readyState>=1)go();else au.addEventListener('loadedmetadata',go,{once:true});
}
function start(){clearTimeout(endTimer);started=true;cap.hidden=false;pad();si=-1;playSeg(0)}
function stop(){clearTimeout(endTimer);au.pause();started=false;si=-1;lines=[];li=-2;cap.hidden=true;rowA.innerHTML=rowB.innerHTML='';pad();label()}
function toggle(){if(!started)start();else if(au.paused)au.play().catch(()=>{});else au.pause()}
btn.onclick=toggle;
cap.addEventListener('click',e=>{if(e.target.closest('#cap-x'))stop();else toggle()});
au.addEventListener('play',()=>{label();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)});
au.addEventListener('pause',label);
au.addEventListener('seeked',paint);
au.addEventListener('ended',()=>{
  if(si<segs.length-1)playSeg(si+1);
  else{started=false;label();endTimer=setTimeout(()=>{if(!started)stop()},2500)}   // 全部播完，字幕停 2.5 秒後自動收起
});
au.addEventListener('error',()=>{rowA.textContent='';rowB.textContent='找不到音檔（'+BASE+'/'+(segs[si]?segs[si].file:'')+'）'});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(si>=0){buildLines();li=-2;paint();pad()}},150)});
if('mediaSession' in navigator){[['play',()=>au.play()],['pause',()=>au.pause()],['previoustrack',()=>started&&playSeg(Math.max(0,si-1))],['nexttrack',()=>started&&si<segs.length-1&&playSeg(si+1)]].forEach(([a,f])=>{try{navigator.mediaSession.setActionHandler(a,f)}catch(e){}})}
})();
</script></body></html>
