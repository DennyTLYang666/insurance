<script id="data" type="application/json">{"chapter": "第三章", "title": "保險招攬：業務員、經紀人、代理人與公證人", "laws": [{"pcode": "G0390002", "name": "保險法", "amended": "民國114年6月18日", "url": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0390002", "source": "法務部全國法規資料庫（經 kong0107/mojLawSplitJSON 公開鏡像取得，鏡像更新日 20261016）", "retrieved": "2026-11-03", "mirrorDate": "20250618"}, {"pcode": "G0390016", "name": "保險業務員管理規則", "amended": "民國114年1月2日", "url": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0390016", "source": "法務部全國法規資料庫（經 kong0107/mojLawSplitJSON 公開鏡像取得，鏡像更新日 20261016）", "retrieved": "2026-11-03", "mirrorDate": "20250102"}, {"pcode": "G0390042", "name": "保險業招攬及核保理賠辦法", "amended": "民國115年4月21日", "url": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0390042", "source": "法務部全國法規資料庫（經 kong0107/mojLawSplitJSON 公開鏡像取得，鏡像更新日 20261016）", "retrieved": "2026-11-03", "mirrorDate": "20260421"}], "alerts": [{"t": "題庫舊答案可能和現行條文不一樣（請特別注意）", "d": "你的筆記裡寫『以登錄證供他人使用，停止招攬6個月』，但現行業務員管理規則第19條第1項是把17款情事統一規定為『一年以下停止招攬行為』，整條沒有『6個月』的字樣（我在規則全文與招攬辦法中都搜尋過）。這是『題庫答案』與『現行條文』不一致的地方；題庫答案可能是舊版規定，這是我的推論，我沒有查到舊版條文原文。考試如果真的出這題，題庫給什麼答案你就要看你拿到的最新題庫為準；實務上則以現行條文為準。"}, {"t": "這章和你的日常工作最直接相關", "d": "第6條（出示登錄證、告知授權範圍）、第15條（親晤、親簽、視為公司授權範圍、公司負連帶責任）、第16條（文宣要標明公司且要與核准內容相符）、第19條（17種停止招攬行為）是實務上最常被檢查的地方。"}, {"t": "後果的提醒（風險）", "d": "違反第19條，處分是『一年以下停止招攬行為』；最近5年內受停止招攬期間累計達2年，所屬公司『應』撤銷登錄。涉及犯罪嫌疑的還要移送偵辦。業務員招攬造成客戶損失，所屬公司依法負連帶責任（第15條）。"}, {"t": "本章大部分是行政命令", "d": "業務員管理規則與招攬核保理賠辦法，都是主管機關依保險法授權訂定的命令，不是法律。業務員管理規則最近一次修正是民國114年1月2日；招攬辦法最近修正是115年4月21日（資料庫日期）。"}], "clauses": [{"title": "保險代理人", "plain": "根據代理契約或授權書，向保險人收取費用，並代理經營業務的人。", "mnemonic": "代理人＝向保險公司收費，代理經營業務。", "official": ["本法所稱保險代理人，指根據代理契約或授權書，向保險人收取費用，並代理經營業務之人。"], "has_official": true, "no": "保8"}, {"title": "保險業務員", "plain": "為保險業、保險經紀人公司、保險代理人公司，或兼營保險代理人、經紀人業務的銀行，從事保險招攬的人。", "mnemonic": "業務員＝從事招攬的人。", "official": ["本法所稱保險業務員，指為保險業、保險經紀人公司、保險代理人公司或兼營保險代理人或保險經紀人業務之銀行，從事保險招攬之人。"], "has_official": true, "no": "保8-1"}, {"title": "保險經紀人", "plain": "基於被保險人的利益，洽訂保險契約或提供相關服務，而收取佣金或報酬的人。", "mnemonic": "經紀人站在被保險人這一邊。", "tip": "考試常問『經紀人是基於誰的利益』：被保險人，不是要保人，也不是保險公司。", "official": ["本法所稱保險經紀人，指基於被保險人之利益，洽訂保險契約或提供相關服務，而收取佣金或報酬之人。"], "has_official": true, "no": "保9"}, {"title": "公證人", "plain": "向保險人或被保險人收取費用，為其辦理保險標的的查勘、鑑定、估價與賠款的理算、洽商，而予證明的人。", "mnemonic": "公證人＝查勘、鑑定、理算、證明。", "official": ["本法所稱公證人，指向保險人或被保險人收取費用，為其辦理保險標的之查勘，鑑定及估價與賠款之理算、洽商，而予證明之人。"], "has_official": true, "no": "保10"}, {"title": "代理人、經紀人、公證人要許可；經紀人要善管與忠實", "plain": "保險代理人、經紀人、公證人要經主管機關許可、繳存保證金並投保相關保險、領有執業證照，才能執行業務。保險經紀人要以善良管理人的注意義務為被保險人洽訂契約，並負忠實義務；在主管機關指定範圍內，要主動提供書面分析報告，向客戶收報酬的，還要明確告知收費標準。", "mnemonic": "三種人都要許可；經紀人有善管與忠實，另要書面分析報告。", "tip": "代理人、公證人投保的是責任保險；經紀人要投保責任保險和保證保險。", "official": ["保險代理人、經紀人、公證人應經主管機關許可，繳存保證金並投保相關保險，領有執業證照後，始得經營或執行業務。", "前項所定相關保險，於保險代理人、公證人為責任保險；於保險經紀人為責任保險及保證保險。", "第一項繳存保證金、投保相關保險之最低金額及實施方式，由主管機關考量保險代理人、經紀人、公證人經營業務與執行業務範圍及規模等因素定之。", "保險代理人、經紀人、公證人之資格取得、申請許可應具備之條件、程序、應檢附之文件、董事、監察人與經理人應具備之資格條件、解任事由、設立分支機構之條件、財務與業務管理、教育訓練、廢止許可及其他應遵行事項之管理規則，由主管機關定之。", "銀行得經主管機關許可擇一兼營保險代理人或保險經紀人業務，並應分別準用本法有關保險代理人、保險經紀人之規定。", "保險經紀人應以善良管理人之注意義務，為被保險人洽訂保險契約或提供相關服務，並負忠實義務。", "保險經紀人為被保險人洽訂保險契約前，於主管機關指定之適用範圍內，應主動提供書面之分析報告，向要保人或被保險人收取報酬者，應明確告知其報酬收取標準。", "前項書面分析報告之適用範圍、內容及報酬收取標準之範圍，由主管機關定之。"], "has_official": true, "no": "保163"}, {"title": "沒登錄、沒領登錄證，不能招攬", "plain": "業務員沒有依規則辦理登錄、領得登錄證，不能替所屬公司招攬保險。", "mnemonic": "沒證不能招攬。", "official": ["業務員非依本規則辦理登錄，領得登錄證，不得為其所屬公司招攬保險。", "業務員與所屬公司簽訂之勞務契約，依民法及相關法令規定辦理。"], "has_official": true, "no": "規3"}, {"title": "登錄程序與『招攬要出示登錄證、告知授權範圍』", "plain": "具備資格的人，填登錄申請書，由所屬公司向各有關公會辦理登錄。曾被撤銷業務員登錄的人，要重新參加資格測驗合格才能再登錄。業務員招攬保險時，要出示登錄證，並告知授權範圍（主管機關另有規定的除外）。", "mnemonic": "招攬時：出示登錄證＋告知授權範圍。", "tip": "條文要求的是『出示登錄證、告知授權範圍』。我在規則、保險法、招攬辦法全文搜尋，沒有找到『要提供名片』的規定。", "official": ["具備前條第一項資格者，得填妥登錄申請書，由所屬公司為其向各有關公會辦理登錄。", "各有關公會應將審查合格之業務員通知其所屬公司，以憑製發登錄證，所屬公司並應於每月十五日前，將上月製發登錄證情形報各有關公會彙總。", "登錄申請書、登錄程序及登錄證之格式與應記載事項，由各有關公會定之。", "已領有保險代理人、保險經紀人執業證照者，得向主管機關繳銷執業證照後，檢附繳銷執業證照證明，由其所屬公司為其辦理登錄。", "曾受第十一條之一、第十三條或第十九條第三項撤銷業務員登錄處分者，應重新參加前條第一項第一款所定資格測驗合格，始得辦理登錄。", "業務員於招攬保險時，應出示登錄證，並告知授權範圍。但主管機關另有規定者，不在此限。"], "has_official": true, "no": "規6"}, {"title": "不予登錄、應註銷登錄的情事", "plain": "申請登錄的人有以下情事之一，不予登錄；已登錄的，所屬公司要通知公會註銷登錄：無行為能力、限制行為能力或受輔助宣告尚未撤銷；登錄文件虛偽；犯組織犯罪防制條例之罪（5年內）；犯偽造文書、侵占、詐欺、背信（3年內）；違反各金融管理法律受刑之宣告（3年內）；受破產宣告尚未復權；重大喪失債信情事尚未了結或了結後未逾3年；在停止招攬期間；重複登錄；已領代理人、經紀人執照等；最近3年有不誠信或不正當活動。", "mnemonic": "沒能力、文件假、組織犯罪5年、詐欺侵占背信3年、金融犯罪3年、破產未復權、喪失債信3年。", "tip": "『重大喪失債信，了結後未逾3年』：不予登錄；已登錄的，所屬公司要通知公會註銷登錄。", "facts": {"head": ["款", "情事", "期間"], "rows": [["1", "無行為能力、限制行為能力、受輔助宣告尚未撤銷", "—"], ["2", "申請登錄文件有虛偽記載", "—"], ["3", "犯組織犯罪防制條例之罪，有罪判決確定", "執行完畢、緩刑期滿或赦免後未逾5年"], ["4", "犯偽造文書、侵占、詐欺、背信，有期徒刑以上", "執行完畢、緩刑期滿或赦免後未逾3年"], ["5", "違反保險法、銀行法、證券交易法、洗錢防制法等金融管理法律，受刑之宣告確定", "執行完畢、緩刑期滿或赦免後未逾3年"], ["6", "受破產宣告，尚未復權", "—"], ["7", "重大喪失債信情事尚未了結或了結後", "未逾3年"], ["8", "在受同類保險業務業者停止招攬期限內", "—"], ["9", "已登錄於其他同類業者未註銷而重複登錄", "—"], ["10", "已領保險代理人或經紀人執業證照，或擔任代理人、經紀人、公證人公司負責人", "—"], ["11", "最近3年有事實證明從事不誠信或不正當活動，不適合擔任", "最近3年"]]}, "official": ["申請登錄之業務員有下列情事之一，應不予登錄；已登錄者，所屬公司應通知各有關公會註銷登錄：", "一、無行為能力、限制行為能力或受輔助宣告尚未撤銷者。", "二、申請登錄之文件有虛偽之記載者。", "三、曾犯組織犯罪防制條例規定之罪，經有罪判決確定，尚未執行完畢，或執行完畢、緩刑期滿或赦免後尚未逾五年者。", "四、曾犯偽造文書、侵占、詐欺、背信罪，經宣告有期徒刑以上之刑確定，尚未執行完畢，或執行完畢、緩刑期滿或赦免後尚未逾三年者。", "五、違反保險法、銀行法、金融控股公司法、信託業法、票券金融管理法、金融資產證券化條例、不動產證券化條例、證券交易法、期貨交易法、證券投資信託及顧問法、管理外匯條例、信用合作社法、洗錢防制法或其他金融管理法律，受刑之宣告確定，尚未執行完畢，或執行完畢、緩刑期滿或赦免後尚未逾三年者。", "六、受破產之宣告，尚未復權者。", "七、有重大喪失債信情事尚未了結或了結後尚未逾三年者。", "八、依第十九條規定在受經營同類保險業務之保險業、保險代理人公司、保險經紀人公司或銀行停止招攬行為期限內者。", "九、已登錄為其他經營同類保險業務之保險業、保險代理人公司、保險經紀人公司或銀行之業務員未予註銷，而重複登錄者。", "十、已領得保險代理人或保險經紀人執業證照，或充任其他保險代理人公司、保險經紀人公司或保險公證人公司之負責人者。", "十一、最近三年有事實證明從事或涉及其他不誠信或不正當之活動，顯示其不適合擔任業務員者。"], "has_official": true, "no": "規7"}, {"title": "登錄證5年，要在期滿前換證", "plain": "業務員登錄證有效期間是5年，要在期滿前辦妥換發登錄證，在換證辦好之前，不能招攬保險。", "mnemonic": "5年一換，沒換不能招攬。", "official": ["業務員登錄證有效期間為五年，應於期滿前辦妥換發登錄證手續，未辦妥前不得為保險之招攬。", "業務員換證作業規範，由各有關公會訂定報主管機關備查。"], "has_official": true, "no": "規9"}, {"title": "異動要在5日內申報", "plain": "業務員有異動，所屬公司要在異動後5日內向公會申報（變更登錄、停止招攬登錄、註銷登錄、撤銷登錄）。在辦妥異動登錄前，這個業務員的招攬行為仍視為所屬公司的行為。", "mnemonic": "異動5日內申報；沒辦妥前，招攬算公司的。", "official": ["業務員有異動者，所屬公司應於異動後五日內，依下列規定向各有關公會申報：", "一、登錄事項有變更者，為變更登錄。", "二、業務員受停止招攬行為之處分者，為停止招攬登錄。", "三、業務員有第七條、死亡、喪失行為能力、終止合約、或其他終止招攬行為之情事者，為註銷登錄。", "四、業務員有第十一條之一、第十三條或第十九條第三項撤銷之情事者，為撤銷登錄。", "前項第二款至第四款情形，業務員應向原所屬公司繳銷登錄證。前項第三款業務員之異動日，應以業務員辦妥異動手續日為準。", "所屬公司在辦妥異動登錄前，對於該業務員之保險招攬行為仍視為所屬公司之行為。", "所屬公司如有停業、解散或其他原因無法繼續經營或執行業務者，應為其業務員向各有關公會辦理註銷登錄；所屬公司未辦理者，業務員得委由其所屬公司之商業同業公會向各有關公會辦理註銷登錄。", "業務員與所屬公司之勞務契約終止後，所屬公司無正當理由不予辦理註銷登錄者，業務員得向其所屬公司之商業同業公會申請處理。", "前項申請事由經查證屬實者，各有關公會應依本規則規定辦理註銷登錄並通知所屬公司。"], "has_official": true, "no": "規10"}, {"title": "每年教育訓練", "plain": "業務員登錄後，每年要參加所屬公司辦理的教育訓練。教育訓練課程要依招攬的險種訂定。", "mnemonic": "每年參加教育訓練。", "official": ["業務員應自登錄後每年參加所屬公司辦理之教育訓練。", "各有關公會應訂定教育訓練要點，並報主管機關備查後通知所屬會員公司辦理。", "前項教育訓練要點應依業務員招攬保險種類訂定相關課程。"], "has_official": true, "no": "規12"}, {"title": "不參加或補訓不及格，撤銷登錄", "plain": "不參加教育訓練的，所屬公司要撤銷其登錄。教育訓練成績不合格，1年內補訓仍不合格的，也一樣撤銷。", "mnemonic": "不參加＝撤銷；補訓1年內仍不合格＝撤銷。", "official": ["業務員不參加教育訓練者，所屬公司應撤銷其業務員登錄。", "參加教育訓練成績不合格，於一年內再行補訓成績仍不合格者，亦同。"], "has_official": true, "no": "規13"}, {"title": "專屬原則：專為所屬公司招攬", "plain": "業務員登錄後，要專為其所屬公司從事保險招攬。取得相關資格的，可以另外登錄於一家『非經營同類保險業務』的公司，並以一家為限。轉任他公司要重新登錄。", "mnemonic": "專屬所屬公司；兼登錄要非同類，且只能一家。", "official": ["業務員經登錄後，應專為其所屬公司從事保險之招攬。", "保險業、保險代理人公司之業務員，取得相關資格，得登錄於另一家非經營同類保險業務之保險業或保險代理人公司，並以一家為限。", "保險經紀人公司之業務員取得相關資格，得登錄於另一家非經營同類保險業務之保險經紀人公司，並以一家為限。", "業務員轉任他公司時，應依第六條規定重新登錄；異動後再任原所屬公司之業務員者，亦同。"], "has_official": true, "no": "規14"}, {"title": "招攬視為公司授權範圍；公司負連帶責任；親晤、親簽", "plain": "業務員經授權所做的招攬行為，視為所屬公司授權範圍內的行為；公司要嚴加管理，並就招攬行為所生的損害依法負連帶責任。授權要以書面為之，並載明在登錄證上。招攬行為包括：解釋商品與保單條款、說明填寫要保書注意事項、轉送要保文件與保險單、其他經授權的行為。業務員要取得要保人及被保險人親簽的文件；招攬人身保險商品，應親晤要保人及被保險人；要保書上要親自簽名並記載登錄字號。", "mnemonic": "授權視為公司行為、公司連帶負責；人身保險要親晤、要保書要親簽並寫登錄字號。", "tip": "『所屬公司負連帶賠償責任』是考試常見題；連帶責任的對象是『所屬公司』，不是介紹人。", "facts": {"head": ["重點", "規定"], "rows": [["授權範圍", "視為所屬公司授權範圍內的行為"], ["損害責任", "所屬公司依法負連帶責任"], ["授權形式", "書面，載明於登錄證"], ["招攬行為包括", "解釋商品與條款；說明填寫要保書；轉送要保文件與保險單；其他授權行為"], ["人身保險", "應親晤要保人及被保險人（主管機關另有規定除外）"], ["要保書", "業務員親自簽名並記載登錄字號"]]}, "official": ["業務員經授權從事保險招攬之行為，視為該所屬公司授權範圍之行為，所屬公司對其登錄之業務員應嚴加管理並就其業務員招攬行為所生之損害依法負連帶責任。業務員同時登錄為財產保險及人身保險業務員者，其分別登錄之所屬公司應依法負連帶責任。", "前項授權，應以書面為之，並載明於其登錄證上。", "第一項所稱保險招攬之行為，係指業務員從事下列之行為：", "一、解釋保險商品內容及保單條款。", "二、說明填寫要保書注意事項。", "三、轉送要保文件及保險單。", "四、其他經所屬公司授權從事保險招攬之行為。", "業務員從事前項所稱保險招攬之行為，應取得要保人及被保險人親簽之投保相關文件；業務員招攬涉及人身保險之商品者，應親晤要保人及被保險人。但主管機關另有規定者不在此限。", "業務員應於所招攬之要保書上親自簽名並記載其登錄字號。但主管機關另有規定者不在此限。"], "has_official": true, "no": "規15"}, {"title": "文宣要標明公司，內容要與核准的條款相符", "plain": "招攬用的文宣、廣告、簡介、商品說明書、建議書，要標明所屬公司名稱（代理人、經紀人或銀行所屬的，還要標明往來保險業名稱），不能假借其他名義或方式招攬。內容要與保險業報經主管機關審查通過的保單條款、費率、要保書相符，且經所屬公司核可，並符合資訊揭露規範。", "mnemonic": "標明公司、內容相符、公司核可。", "tip": "自己做的建議書或短影音，沒標公司名稱、或內容和核准條款不一致，都踩到這條。", "official": ["業務員從事保險招攬所用之文宣、廣告、簡介、商品說明書及建議書等文書，應標明所屬公司之名稱，所屬公司為代理人、經紀人或銀行者並應標明往來保險業名稱，並不得假借其他名義、方式為保險之招攬。", "前項文宣、廣告、簡介、商品說明書及建議書等文書之內容，應與保險業報經主管機關審查通過之保險單條款、費率及要保書等文件相符，且經所屬公司核可同意使用，其內容並應符合主管機關訂定之資訊揭露規範。", "保險代理人、經紀人公司或銀行所屬業務員使用之文宣、廣告、簡介、商品說明書及建議書等文書應經其往來保險業提供或同意方可使用。"], "has_official": true, "no": "規16"}, {"title": "17種停止招攬行為", "plain": "業務員有17款情事之一，除有犯罪嫌疑，公司要依法移送偵辦外，還要按情節輕重，處一年以下停止招攬行為。最近5年內受停止招攬處分期間累計達2年，所屬公司應撤銷其登錄。", "mnemonic": "十七款，一年以下停招；5年累計2年，撤銷登錄。", "tip": "實務上最常見的是：代客戶簽名（第7款）、未經授權代收保費或挪用侵占（第9款）、登錄證給別人用（第10款）、推介未核准商品（第11款）。", "facts": {"head": ["款", "情事"], "rows": [["1", "就影響要保人、被保險人權益事項為不實說明或不為說明"], ["2", "唆使不告知或不實告知；或明知而故意隱匿"], ["3", "妨害要保人或被保險人告知"], ["4", "以錯價、放佣或其他不當折減保險費招攬"], ["5", "以誇大不實宣傳、廣告或其他不當方法招攬"], ["6", "未經所屬公司同意而招聘人員"], ["7", "代要保人或被保險人簽章，或未經同意或授權填寫保險契約文件"], ["8", "以威脅、利誘、隱匿、欺騙等方法，慫恿終止有效契約而投保新契約致要保人受損"], ["9", "未經授權代收保費，或挪用、侵占所收保費，或未交付正式收據"], ["10", "以登錄證供他人使用或使用他人登錄證"], ["11", "招攬或推介未經主管機關核准或備查的保險業務或其他金融商品"], ["12", "為未經核准經營保險業務的法人或個人招攬"], ["13", "以誇大不實方式，就不同契約或與銀行存款、其他金融商品作不當比較"], ["14", "散播不實言論或文宣，擾亂金融秩序"], ["15", "挪用款項或代要保人保管保險單及印鑑"], ["16", "違反第9條、第11條第2項、第14條第1項、第15條第4、5項或第16條"], ["17", "其他利用業務員身分從事業務上不當行為"]]}, "official": ["業務員有下列各款情事之一者，除有犯罪嫌疑，其行為時之所屬公司應依法移送偵辦外，並應按其情節輕重，予以一年以下停止招攬行為之處分：", "一、就影響要保人或被保險人權益之事項為不實之說明或不為說明。", "二、唆使要保人或被保險人對保險人為不告知或不實之告知；或明知要保人或被保險人不告知或為不實之告知而故意隱匿。", "三、妨害要保人或被保險人為告知。", "四、對要保人或被保險人以錯價、放佣或其他不當折減保險費之方法為招攬。", "五、對要保人、被保險人或第三人以誇大不實之宣傳、廣告或其他不當之方法為招攬。", "六、未經所屬公司同意而招聘人員。", "七、代要保人或被保險人簽章、或未經其同意或授權填寫有關保險契約文件。", "八、以威脅、利誘、隱匿、欺騙等不當之方法或不實之說明慫恿要保人終止有效契約而投保新契約致使要保人受損害。", "九、未經授權而代收保險費或經授權代收保險費而挪用、侵占所收保險費或代收保險費未依規定交付保險業開發之正式收據。", "十、以登錄證供他人使用或使用他人登錄證。", "十一、招攬或推介未經主管機關核准或備查之保險業務或其他金融商品。", "十二、為未經主管機關核准經營保險業務之法人或個人招攬保險。", "十三、以誇大不實之方式就不同保險契約內容，或與銀行存款及其他金融商品作不當之比較。", "十四、散播不實言論或文宣，擾亂金融秩序。", "十五、挪用款項或代要保人保管保險單及印鑑。", "十六、違反第九條、第十一條第二項、第十四條第一項、第十五條第四項、第五項或第十六條規定。", "十七、其他利用其業務員身分從事業務上不當行為。", "前項業務員行為時之所屬公司已解散或註銷公司執業證照者，由現行所登錄之所屬公司予以處分。", "最近五年內受停止招攬行為處分期間累計達二年者，所屬公司應予撤銷其業務員登錄處分。"], "has_official": true, "no": "規19"}, {"title": "不服處分：申復1個月、覆核3個月", "plain": "業務員不服停止招攬登錄、撤銷登錄處分，可以在處分通知到達後1個月內，以書面向原處分公司申復（限一次），公司要在書面到達後1個月內將復查結果書面通知。業務員對復查結果有異議，可以在收到結果後3個月內，向公會的申訴委員會申請覆核（限一次）。", "mnemonic": "申復1個月、公司1個月回覆；覆核3個月。", "facts": {"head": ["步驟", "對象", "期限", "次數"], "rows": [["申復", "原處分公司", "處分通知到達後1個月內", "1次"], ["公司復查回覆", "業務員", "書面資料到達後1個月內", "—"], ["覆核", "公會申訴委員會", "收到復查結果後3個月內", "1次"]]}, "official": ["業務員不服受停止招攬登錄、撤銷登錄處分者，得於受處分之通知到達之日起一個月內，以書面具明理由向原處分公司提出申復，並以一次為限，原處分公司並應於申復書面資料到達一個月內將復查結果以書面通知業務員。", "業務員對前項復查結果有異議者，得於收到復查結果之日起三個月內以書面具明理由向各有關公會之申訴委員會申請覆核，並以一次為限。", "前項申訴委員會之組織，其成員應包含業務員代表，並由各有關公會訂定後報主管機關備查。"], "has_official": true, "no": "規19-1"}, {"title": "招攬處理制度的重點（含65歲以上客戶）", "plain": "保險業的招攬處理制度，至少要明定：業務人員資格與訓練（每年要參加公平對待65歲以上客戶的教育訓練）；酬金與承受風險、支給時間的連結考核；代收保費管理；了解要保人及被保險人（基本資料、投保條件、目的與需求、保費資金來源、評估65歲以上客戶的辨識能力）；商品適合度政策；誠實填寫招攬報告書；禁止行為（含錯價放佣、勸誘解約、使用未經同意文宣、挪用侵占保費、提供不適合商品等）；對65歲以上客戶銷售有解約金商品要錄音錄影或留存電子軌跡並覆審；有保單價值準備金等商品要由非銷售通路人員電訪。", "mnemonic": "了解客戶、適合度、招攬報告書、禁止行為、65歲以上要錄音覆審、保費資金來源要電訪。", "tip": "錄音錄影、電子軌跡要保存到『契約期滿後5年，或未承保確定之日起5年』。內容至少包括：出示登錄證與授權、告知商品與公司與繳費、說明重要條款與除外責任、契約撤銷權、確認保費可負擔；投資型保險還要說明投資風險、費用、較差情境下可能損失。", "facts": {"head": ["款", "重點"], "rows": [["5", "了解要保人、被保險人：基本資料、投保條件、目的需求、保費資金來源、65歲以上辨識能力"], ["6", "適合度政策：知道是買保險、險種保額保費與需求相當、外幣要了解匯率風險承受能力、投資型要了解投資屬性與損益自負"], ["7", "業務員誠實填寫招攬報告書（招攬經過、收入、投保其他保險、受益人等）"], ["8", "禁止情事（11目）：如錯價放佣、勸誘貸款繳費、挪用侵占保費、提供不適合商品等"], ["10、11", "65歲以上客戶、有解約金商品：經同意錄音錄影或留存電子軌跡並覆審；保存至契約期滿後5年或未承保確定日起5年"], ["12", "有保單價值準備金等商品：由非銷售通路人員電訪、視訊或遠距訪問；資金來源是解約、貸款或保單借款者，要確認並告知風險"]]}, "official": ["保險業訂定其內部之業務招攬處理制度及程序，至少應包括並明定下列事項：", "一、保險業從事保險招攬之業務人員資格、招攬險種、在職訓練、獎懲及權利義務，其中在職訓練包括保險業應要求業務人員每年參加公平對待六十五歲以上之客戶之相關教育訓練。", "二、保險業從事保險招攬之業務人員酬金與承受風險及支給時間之連結考核，招攬品質、招攬糾紛等之管理。", "三、保險業從事保險招攬之業務人員代收保險費之收費作業、送金單或收據之領用、收費時間及繳回等管理。", "四、依行銷通路別及其特性訂定應遵行之事項。", "五、保險業從事保險招攬之業務人員應充分瞭解要保人及被保險人之事項，其內容至少應包括：", "（一）基本資料：", "1.要保人及被保險人之基本資料（至少應包括姓名、性別、出生年月日、身分證字號及聯絡方式；若為法人者，為法人之名稱、代表人、地址、聯絡電話）；", "2.要保人與被保險人及被保險人與受益人之關係；", "3.若保險契約係以電子保單型式出單者，至少應取得要保人及被保險人之行動電話號碼、電子郵件信箱或其他經主管機關認可足資傳遞電子文件之聯絡方式；", "4.其他主管機關規定之基本資料。", "（二）要保人及被保險人是否符合投保之條件。", "（三）要保人及被保險人之投保目的及需求。", "（四）繳交保險費之資金來源。", "（五）評估六十五歲以上之客戶是否具有辨識不利其投保權益情形之能力。但保險商品之特性經依保險商品銷售前程序作業準則第六條第七款規定評估不具潛在影響及各種不利因素者，不在此限。", "六、保險商品適合度政策，其內容至少應包括：", "（一）要保人已確實瞭解其所繳交保險費係用以購買保險商品。", "（二）要保人投保險種、保險金額及保險費支出與其實際需求具相當性。", "（三）要保人如係投保外幣收付之保險商品，應瞭解要保人對匯率風險之承受能力。", "（四）要保人如係投保投資型保險商品，應考量要保人之投資屬性、風險承受能力、繳交保險費之資金來源，並確定要保人已確實瞭解投資型保險之投資損益係由其自行承擔，且不得提供逾越要保人財力狀況或不合適之商品。", "七、保險業從事保險招攬之業務人員有誠實填寫招攬報告書之義務，其內容至少應包括：", "（一）招攬經過。", "（二）要保人及被保險人工作年收入及其他收入。", "（三）要保人及被保險人是否投保其他商業保險，以及投保前三個月內客戶是否有辦理終止契約、貸款或保險單借款之情形。", "（四）家中主要經濟來源者。", "（五）身故受益人是否指定為配偶、直系親屬，或指定為法定繼承人，且其順位及應得比例適用民法繼承編相關規定。若否，應說明原因。", "（六）對六十五歲以上之客戶投保案件，應載明該客戶是否具有辨識不利其投保權益情形之能力、保險商品適合該客戶及評估理由，並做成評估紀錄。但保險商品之特性經依保險商品銷售前程序作業準則第六條第七款規定評估不具潛在影響及各種不利因素者，不在此限。", "（七）其他有利於核保之資訊。", "八、保險業或其從事保險招攬之業務人員不得有下列情事：", "（一）以未具保險業招攬人員資格者為招攬。", "（二）對要保人或被保險人以錯價、放佣或其他不當折減保險費之方法為招攬。", "（三）以誇大不實、引人錯誤之宣傳、廣告、以不同保險公司之契約內容作不當比較或其他不當之方法為招攬。", "（四）勸誘客戶解除或終止契約，或以貸款、保險單借款繳交保險費。", "（五）使用未經保險業同意之文宣、廣告、簡介、商品說明書及建議書等文書為招攬。", "（六）慫恿要保人或被保險人違反告知義務或以不當之手段唆使要保人辦理退保、轉保、縮小保額、繳清、展期或貸款等行為。", "（七）酬金支付對象與要保書所載招攬人員不同。", "（八）挪用或侵占保險費。", "（九）未確認要保人或被保險人對保單之適合度，包括對六十五歲以上之客戶提供不適合之保險商品。", "（十）給付或支領因不當勸誘客戶向保險業申辦貸款之報酬。", "（十一）其他損害要保人、被保險人或受益人權益之情事。", "九、保險業應要求為其從事保險招攬之保險代理人及其業務員遵循下列事項：", "（一）保險代理人管理規則、保險業務員管理規則之規定及保險代理合約之約定。", "（二）除本項第一款之獎懲及第二款之酬金與承受風險及支給時間之連結考核等事項外，應依據本項第一款至第八款所列事項辦理，並明定於保險代理合約。", "十、保險業銷售各種有解約金之保險商品（不包括小額終老保險、團體年金保險及保險期間在三年以下之傷害保險）予六十五歲以上之客戶，應經客戶同意後將銷售過程以錄音或錄影方式保留紀錄，或以電子設備留存相關作業過程之軌跡，並應由適當之單位或主管人員進行覆審，確認客戶辦理該等商品交易之適當性。前揭錄音、錄影或以電子設備辦理之方式，由中華民國人壽保險商業同業公會訂定，並報主管機關備查。但保險業另訂定其他客戶投保權益保障措施，並報經主管機關備查者，不在此限。", "十一、前款銷售過程以錄音或錄影方式保留紀錄，或以電子設備留存相關作業過程之軌跡至少應包括下列事項，且應保存至保險契約期滿後五年或未承保確定之日起五年：", "（一）招攬之業務員出示其合格登錄證，說明其所屬公司及獲授權招攬保險商品。", "（二）告知客戶其購買之保險商品、保險公司名稱及招攬人員與保險公司之關係、繳費年期及繳費金額。", "（三）說明商品重要條款內容、除外責任及建議書內容。", "（四）說明契約撤銷之權利。", "（五）詢問客戶是否瞭解每年必需繳交之保費，並確認客戶是否可負擔保費。", "（六）客戶購買之保險商品如係投資型保險商品，並應說明商品之投資風險、保險商品說明書重要內容、保單相關費用（包括保險成本等保險費用）及其收取方式，以及詢問客戶是否瞭解在較差情境下之可能損失金額，並確認客戶是否可承受損失。", "十二、保險業就客戶購買有保單價值準備金之保險商品（不包括小額終老保險、保險期間在三年以下之傷害保險）、健康保險商品或有生存保險金之房貸壽險商品者，應遵循下列規定：", "（一）保險業應另指派非銷售通路之人員，於銷售保險契約後且同意承保前，再依下列事項進行電話訪問、視訊或遠距訪問，並應保留電話訪問錄音紀錄、視訊或遠距訪問錄音或錄影紀錄備供查核，且應保存至保險契約期滿後五年或未承保確定之日起五年：", "1.對於繳交保險費之資金來源為解約、貸款或保險單借款之要保人及實際繳交保險費之人，應確認或告知下列事項：", "（1）確認符合第五款、第六款及第八款所定事項。", "（2）對於繳交保險費之資金來源為貸款或保險單借款之要保人及實際繳交保險費之人，向其明確告知其因財務槓桿操作方式所將面臨之相關風險，以及最大可能損失金額。", "（3）對於繳交保險費之資金來源為解約之要保人及實際繳交保險費之人，向其明確告知其因終止契約後再投保所產生之保險契約相關權益損失情形。", "2.對於年齡在六十五歲以上之客戶，應依客戶所購買保險商品不利於其投保權益之情形進行關懷提問，確認客戶瞭解保險商品特性對其之潛在影響及各種不利因素。但保險商品之特性經依保險商品銷售前程序作業準則第六條第七款規定評估不具潛在影響及各種不利因素者，或保險業另訂定符合第十款但書規定之客戶投保權益保障措施者，不在此限。", "（二）保險經紀人或保險代理人業依保險經紀人管理規則第三十三條之一或保險代理人管理規則第三十三條之一規定，對客戶辦理電話、視訊或遠距訪問之事項者，保險業免再依前目規定就相同事項進行電話、視訊或遠距訪問。", "十三、其他主管機關規定應遵行之事項。", "保險業應要求業務往來保險經紀人遵行下列事項：", "一、符合保險經紀人管理規則之規定及業務往來合約之約定。", "二、不得以保險費折讓或其他不當之誘因向要保人推介保險商品。", "三、不得勸誘客戶解除或終止契約，或以貸款、保險單借款繳交保險費，並應瞭解繳交保險費之資金來源是否為解約、貸款或保險單借款。", "四、不得有其他損害要保人、被保險人或受益人權益之情事。", "第一項第七款之規定，於招攬財產保險時，得不適用。", "第一項第七款所規定之招攬報告書內容，於招攬微型保險時得不適用，由保險業依其內部風險控管考量自行訂定。", "保險業辦理財富管理業務，已訂定該業務之招攬控管措施，並報經主管機關備查，或保險業申請辦理財富管理業務時，已檢附該措施並經主管機關核准者，得依下列事項辦理：", "一、不適用第一項第五款第五目、第十款、第十一款及第十二款第一目之2之規定。", "二、保險業對財富管理客戶，以其保險契約為擔保辦理保費融資者，不適用第一項第八款第四目、第一項第十二款第一目之1之規定。"], "has_official": true, "no": "招6"}, {"title": "公司要避免業務員招攬致客戶損害", "plain": "保險業對所屬業務員經授權的招攬行為，或依代理合約授權代理人及其業務員的招攬行為，應避免因故意或過失致要保人、被保險人受損害，且不得推卸依法應負的賠償責任。", "mnemonic": "業務員的招攬，公司不能推卸責任。", "official": ["保險業對於其所屬保險業務員經授權從事保險招攬行為或保險業依保險代理合約授權保險代理人及其業務員執行招攬業務，應避免因故意或過失，致要保人或被保險人受有損害，且不得推卸其依法應負之賠償責任。"], "has_official": true, "no": "招11"}], "tables": [{"title": "保險代理人、經紀人、公證人、業務員比較", "head": ["角色", "定義重點", "站在誰那邊／做什麼", "依據"], "rows": [["保險代理人", "根據代理契約或授權書，向保險人收費，代理經營業務", "代理保險公司", "保險法第8條"], ["保險經紀人", "基於被保險人的利益，洽訂保險契約或提供相關服務，收佣金或報酬", "被保險人；善管、忠實；書面分析報告", "保險法第9、163條"], ["保險公證人", "向保險人或被保險人收費，查勘、鑑定、估價、理算並證明", "獨立查勘、理算", "保險法第10條"], ["保險業務員", "為保險業、經紀人公司、代理人公司或兼營銀行從事招攬的人", "從事招攬，要登錄、領登錄證", "保險法第8-1條"]]}, {"title": "數字速記：業務員管理規則與招攬辦法", "head": ["條", "數字", "什麼事"], "rows": [["規9", "5年", "登錄證有效期間"], ["規10", "5日內", "異動後所屬公司向公會申報"], ["規7", "5年、3年", "組織犯罪防制條例之罪5年；偽造文書、侵占、詐欺、背信、違反金融管理法律、重大喪失債信了結後均3年"], ["規12", "每年", "教育訓練"], ["規13", "1年內", "教育訓練不合格，1年內補訓仍不合格，撤銷登錄"], ["規19", "1年以下", "停止招攬處分"], ["規19", "5年內累計2年", "所屬公司應撤銷業務員登錄"], ["規19-1", "1個月／1個月／3個月", "申復／公司回覆／覆核"], ["招6", "契約期滿後5年", "65歲以上客戶錄音錄影、電子軌跡保存期間（或未承保確定日起5年）"]]}], "cards": [{"ref": "規3", "front": "沒登錄、沒領登錄證，能不能替所屬公司招攬保險？", "back": "不能。", "id": 1}, {"ref": "規6", "front": "業務員招攬保險時，依規定要做哪兩件事？", "back": "出示登錄證，並告知授權範圍。", "id": 2}, {"ref": "規9", "front": "登錄證有效期間？換證沒辦好前能不能招攬？", "back": "5年；換證辦妥前不能招攬。", "id": 3}, {"ref": "規7", "front": "重大喪失債信，了結後未逾幾年，不予登錄？已登錄者怎麼辦？", "back": "3年；所屬公司要通知公會註銷登錄。", "id": 4}, {"ref": "規7", "front": "無行為能力、限制行為能力的人，可不可以登錄成業務員？", "back": "不可以（規則第7條第1款，另含受輔助宣告尚未撤銷）。", "id": 5}, {"ref": "規10", "front": "業務員異動，所屬公司要在幾日內向公會申報？", "back": "5日內。", "id": 6}, {"ref": "規14", "front": "業務員要專為誰招攬？可以兼登錄別家嗎？", "back": "專為所屬公司；取得資格可再登錄於一家非同類的公司，以一家為限。", "id": 7}, {"ref": "規15", "front": "業務員招攬造成客戶損害，誰要和業務員負連帶賠償責任？", "back": "所屬公司。", "id": 8}, {"ref": "規15", "front": "招攬人身保險，要不要親晤要保人及被保險人？", "back": "要（主管機關另有規定者除外）。", "id": 9}, {"ref": "規16", "front": "業務員用的文宣、建議書要符合哪些要求？", "back": "標明所屬公司名稱；內容與審查通過的條款、費率、要保書相符；經所屬公司核可。", "id": 10}, {"ref": "規19", "front": "規則第19條17款情事的處分是什麼？", "back": "一年以下停止招攬行為；有犯罪嫌疑還要移送偵辦。", "id": 11}, {"ref": "規19", "front": "最近5年內受停止招攬處分期間累計達幾年，要撤銷登錄？", "back": "2年，所屬公司應撤銷登錄。", "id": 12}, {"ref": "規19-1", "front": "不服停止招攬處分，申復與覆核的期限？", "back": "通知到達後1個月內向原公司申復；收到復查結果後3個月內向公會申訴委員會申請覆核；各限一次。", "id": 13}, {"ref": "保9", "front": "保險經紀人是基於誰的利益洽訂保險契約？", "back": "被保險人。", "id": 14}, {"ref": "保163", "front": "保險經紀人除了善良管理人注意義務，還要負什麼義務？", "back": "忠實義務；並在主管機關指定範圍內主動提供書面分析報告。", "id": 15}, {"ref": "招6", "front": "招攬辦法規定：65歲以上客戶買有解約金的商品，要怎麼留存紀錄？保存多久？", "back": "經客戶同意錄音錄影，或以電子設備留存過程軌跡，並由適當單位或主管覆審；保存至契約期滿後5年或未承保確定日起5年。", "id": 16}], "scenarios": [{"ref": "規7", "q": "一位已登錄的業務員被認定『重大喪失債信情事尚未了結』。依業務員管理規則，所屬公司應如何處理？", "opts": ["維持登錄", "通知公會註銷登錄", "停止招攬1年即可", "經本人同意可繼續登錄"], "ans": 1, "why": "規則第7條第7款：重大喪失債信情事尚未了結或了結後未逾3年者，申請登錄不予登錄；已登錄者，所屬公司應通知各有關公會註銷登錄。"}, {"ref": "規9", "q": "業務員的登錄證快到期了，下列做法何者正確？", "opts": ["期滿後再補辦換證，期間仍可招攬", "期滿前辦妥換證，未辦妥前不得招攬", "期滿後6個月內都可以招攬", "由客戶自行向公會申請"], "ans": 1, "why": "規則第9條：登錄證有效期間5年，應於期滿前辦妥換發，未辦妥前不得為保險之招攬。"}, {"ref": "規6", "q": "業務員拜訪客戶時，依規定一定要做的是？", "opts": ["出示登錄證、告知授權範圍", "出示名片、告知年資", "出示公司執照、保證收益", "出示業績排名"], "ans": 0, "why": "規則第6條最後一項：招攬時應出示登錄證，並告知授權範圍。條文沒有要求提供名片。"}, {"ref": "規15", "q": "業務員招攬人壽保險（人身保險）時，下列何者符合規定？", "opts": ["只見要保人，被保險人由要保人轉達", "親晤要保人及被保險人，並取得親簽文件", "委託朋友代為面談", "用電話確認即可，不用面對面"], "ans": 1, "why": "規則第15條第4項：招攬人身保險商品者，應親晤要保人及被保險人；並應取得要保人及被保險人親簽的投保相關文件（主管機關另有規定者除外）。"}, {"ref": "規15", "q": "業務員招攬行為造成客戶損害，依規定應與誰負連帶賠償責任？", "opts": ["介紹人", "所屬公司", "要保人的朋友", "沒有人"], "ans": 1, "why": "規則第15條第1項：所屬公司對其登錄的業務員應嚴加管理，並就業務員招攬行為所生的損害依法負連帶責任。"}, {"ref": "規19", "q": "業務員為了加快作業，代客戶在要保書上簽名。依管理規則第19條，這屬於？", "opts": ["不構成違規", "第19條第7款情事，處一年以下停止招攬", "只需口頭警告", "應註銷登錄，但不需處分"], "ans": 1, "why": "第19條第7款：代要保人或被保險人簽章，或未經同意或授權填寫保險契約文件，屬於應處一年以下停止招攬行為的情形。"}, {"ref": "規19", "q": "業務員最近5年內受停止招攬處分的期間，累計達幾年，所屬公司應撤銷其業務員登錄？", "opts": ["半年", "1年", "2年", "5年"], "ans": 2, "why": "第19條第3項：最近5年內受停止招攬行為處分期間累計達2年者，所屬公司應予撤銷其業務員登錄處分。"}, {"ref": "規19-1", "q": "業務員被處停止招攬，想表示不服，第一步依規定應該怎麼做？", "opts": ["3個月內向公會申訴委員會申請覆核", "1個月內以書面向原處分公司申復", "直接向法院起訴", "向主管機關檢舉同事"], "ans": 1, "why": "第19-1條第1項：處分通知到達後1個月內，以書面向原處分公司申復（限一次）；對復查結果有異議，才在收到結果後3個月內向公會申訴委員會申請覆核。"}, {"ref": "保9", "q": "保險經紀人洽訂保險契約，是基於誰的利益？", "opts": ["要保人", "被保險人", "受益人", "保險人"], "ans": 1, "why": "保險法第9條：保險經紀人是基於被保險人的利益，洽訂保險契約或提供相關服務，而收取佣金或報酬的人。"}, {"ref": "招6", "q": "銷售有解約金的保險商品給67歲的客戶，依招攬辦法第6條，應如何處理銷售過程紀錄？", "opts": ["不需要留存", "經客戶同意，錄音錄影或電子留存過程軌跡，並由適當單位覆審；保存至契約期滿後5年", "只留紙本簽名", "保存1年即可"], "ans": 1, "why": "招攬辦法第6條第1項第10、11款：65歲以上客戶、有解約金商品，經同意錄音錄影或留存電子軌跡，並覆審；保存至保險契約期滿後5年或未承保確定日起5年。"}, {"ref": "規19", "q": "業務員將自己的登錄證借給朋友去招攬保險。依現行業務員管理規則第19條，下列敘述何者較正確？", "opts": ["不屬於第19條規定的情事", "屬於第19條第10款情事，處一年以下停止招攬行為（現行條文）", "一律終身禁止招攬", "只需補繳罰款"], "ans": 1, "why": "第19條第10款：以登錄證供他人使用或使用他人登錄證。處分是第1項統一的『一年以下停止招攬行為』。你的筆記題庫寫的是『6個月』，與現行條文不同，請以你拿到的最新題庫答案為考試依據。"}], "chNo": "03", "summary": "保險業務員怎麼登錄、招攬時一定要做什麼、不能做什麼、做了會怎樣；以及保險代理人、經紀人、公證人三種角色的差別；加上招攬辦法對65歲以上客戶的特別規定。職業道德科第一個主題就是保險招攬。", "scope": "收錄保險法第8、8-1、9、10、163條；保險業務員管理規則第3、6、7、9、10、12、13、14、15、16、19、19-1條；保險業招攬及核保理賠辦法第6、11條。", "nav": {"prev": {"file": "ch02.html", "label": "第2章 廣告、適合度、說明揭露三個辦法：待客的具體做法"}, "next": {"file": "ch04.html", "label": "第4章 客戶資料保密與個人資料保護"}}}</script>
<script>const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>{t=String(t||'');const ss=t.split(/(?<=。)/).map(x=>x.trim()).filter(Boolean);if(t.length<=90||ss.length<2&&t.indexOf('；')<0)return '<p>'+esc(t)+'</p>';
  const li=s=>{s=s.replace(/。$/,'');const m=s.match(/^([^：；]{1,40})：(.+)$/);if(m&&m[2].split('；').length>=3)return '<li><b>'+esc(m[1])+'</b><ul>'+m[2].split('；').map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></li>';
    const parts=s.split('；');if(parts.length>=3)return '<li>'+parts.map(x=>esc(x)).join('<br>')+'</li>';return '<li>'+esc(s)+'</li>'};
  return '<ul class="pl">'+ss.map(li).join('')+'</ul>'};
const factsT=f=>f?'<div class="tw"><table class="ft"><thead><tr>'+f.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+f.rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'';
const LAWMAP={"金保": "金融消費者保護法", "適": "適合度辦法", "說": "說明揭露辦法", "廣": "廣告辦法", "個": "個資法", "洗": "洗錢防制法", "洗辦": "金融機構防制洗錢辦法", "保": "保險法", "規": "業務員管理規則", "招": "招攬核保理賠辦法", "證": "證券交易法", "證商": "證券商負責人與業務人員管理規則", "期商": "期貨商負責人及業務員管理規則", "投顧": "投信投顧法", "投保": "投保法", "信": "信託法", "信業": "信託業法", "銀": "銀行法", "刑": "刑法", "貪": "貪污治罪條例", "獎": "檢舉貪污獎勵辦法"};
const lab=x=>{const m=String(x).match(/^([^0-9]+)([0-9]+(?:-[0-9]+)?)$/);return m&&LAWMAP[m[1]]?LAWMAP[m[1]]+'第'+m[2]+'條':x};
const mem={};
const store={get(k){try{const v=localStorage.getItem(k);return v===null?mem[k]:v}catch(e){return mem[k]}},set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const BOXKEY='twlife_ethics_boxes_v1';
let boxes={};try{boxes=JSON.parse(store.get(BOXKEY)||'{}')}catch(e){boxes={}}
const saveBoxes=()=>store.set(BOXKEY,JSON.stringify(boxes));
function Flash(root,getCards){
  let queue=[],cur=null,flipped=false;
  function build(){const cs=getCards();queue=shuffle(cs.filter(c=>(boxes[c.key]||0)<1)).sort((a,b)=>(boxes[a.key]||0)-(boxes[b.key]||0));flipped=false}
  function render(){
    const cs=getCards(),n=cs.length,done=cs.filter(c=>(boxes[c.key]||0)>=1).length;
    let h='<div class="stat">已熟練 '+done+' / '+n+' 張（答對 1 次視為熟練，進度存在這個瀏覽器）</div><div class="bar"><i style="width:'+(n?done/n*100:0)+'%"></i></div>';
    if(!n){root.innerHTML=h+'<div class="card"><p>沒有可用的閃卡。</p></div>';return}
    if(!queue.length){root.innerHTML=h+'<div class="card"><h3>全部熟練了</h3><p>可以去做情境題，或重設後再來一輪。</p></div><div class="row"><button class="btn" data-a="reset">重設進度</button></div>';return}
    cur=queue[0];
    h+='<div class="card fc" tabindex="0" role="button" data-a="flip"><small>'+(cur.tag?esc(cur.tag)+'｜':'')+esc(lab(cur.ref))+'｜剩 '+queue.length+' 張</small><div class="q">'+esc(cur.front)+'</div>'+(flipped?'<div class="a"><span class="lab fact">答案</span>'+esc(cur.back)+'</div>':'<small>點一下翻面</small>')+'</div>';
    if(flipped)h+='<div class="row"><button class="btn bad" data-a="no">還不熟</button><button class="btn ok" data-a="yes">會了</button></div>';
    h+='<div class="row"><button class="btn" data-a="reset">重設進度</button></div>';
    root.innerHTML=h;
  }
  root.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
    if(a==='flip'){flipped=!flipped;render()}
    else if(a==='reset'){if(confirm('確定要清除這些閃卡的進度？')){getCards().forEach(c=>delete boxes[c.key]);saveBoxes();build();render()}}
    else if(cur&&(a==='yes'||a==='no')){const ok=a==='yes';boxes[cur.key]=ok?Math.min(1,(boxes[cur.key]||0)+1):0;saveBoxes();queue.shift();if(!ok||boxes[cur.key]<1)queue.splice(queue.length?Math.max(1,Math.min(queue.length,ok?6:3)):0,0,cur);flipped=false;render()}});
  root.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.fc')){e.preventDefault();flipped=!flipped;render()}});
  return {refresh(){build();render()}};
}
function Quiz(root,getItems,perRound){
  let items=[],score=0,answered=0,done=false;
  function draw(){
    const perms=items.map(s=>shuffle(s.opts.map((_,k)=>k)));
    root.innerHTML='<div class="stat" id="sc"></div>'+items.map((s,i)=>'<div class="card" data-i="'+i+'"><b>'+(i+1)+'. </b><span class="lab my">'+(s.tag?esc(s.tag)+' ':'')+esc(lab(s.ref))+'</span>'+esc(s.q)+perms[i].map((k,pos)=>'<button class="opt" data-o="'+k+'">'+String.fromCharCode(65+pos)+'. '+esc(s.opts[k])+'</button>').join('')+'<div class="why"></div></div>').join('')+'<div id="qend"></div>';
    score=0;answered=0;upd();
  }
  function upd(){const el=$('#sc',root);if(el)el.textContent='已作答 '+answered+' / '+items.length+'，答對 '+score+' 題';
    if(perRound&&answered===items.length&&items.length){$('#qend',root).innerHTML='<div class="card"><h3>這一組：'+score+' / '+items.length+'</h3></div><div class="row"><button class="btn pri" data-a="again">再來一組</button></div>'}}
  function again(){const all=getItems();items=perRound?shuffle(all).slice(0,perRound):all;draw()}
  root.addEventListener('click',e=>{
    const ag=e.target.closest('[data-a="again"]');if(ag){again();window.scrollTo(0,root.offsetTop-60);return}
    const b=e.target.closest('.opt');if(!b)return;const box=b.closest('.card');if(box.dataset.done)return;
    const s=items[+box.dataset.i],j=+b.dataset.o;box.dataset.done=1;answered++;if(j===s.ans)score++;
    let right='';$$('.opt',box).forEach((x,pos)=>{const k=+x.dataset.o;if(k===s.ans){x.classList.add('right');right=String.fromCharCode(65+pos)}else if(k===j)x.classList.add('wrong')});
    const w=$('.why',box);w.style.display='block';w.innerHTML=(j===s.ans?'答對了。':'答錯了，正解是 '+right+'。')+esc(s.why);upd()});
  return {refresh:again};
}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const LAWS=D.laws;
$('#h1').textContent=D.chapter+'｜'+D.title;
$('#intro').textContent=D.summary||'';
document.title=D.chapter+' '+D.title;
$('#foot').innerHTML='官方來源：'+LAWS.map(L=>esc(L.name)+'（'+esc(L.amended)+(L.kind==='press'?'發布':'修正')+'）'+(L.note?'｜'+esc(L.note)+'｜':'')+'<a href="'+esc(L.url)+'" target="_blank" rel="noopener">'+esc(L.url)+'</a>').join('<br>')+(D.scope?'<br>'+esc(D.scope):'')+'<br>條文原文取自法務部全國法規資料庫的公開資料鏡像（更新日 2026-10-16），尚未逐條與官網現行頁面比對；「白話」「口訣」「情境題」為編寫者整理，不是法條。法規可能再修正，請以官方最新公告為準；本內容不是法律意見。';
const TABS=[['read','條文速讀'],['table','對照表'],['cards','閃卡'],['quiz','情境題']];
const nav=$('#nav');
TABS.forEach(([id,name])=>{const b=document.createElement('button');b.textContent=name;b.setAttribute('role','tab');b.dataset.id=id;b.onclick=()=>show(id);nav.appendChild(b)});
let curTab='read';
function show(id,anchor){curTab=id;TABS.forEach(([t])=>$('#s-'+t).classList.toggle('on',t===id));$$('button',nav).forEach(b=>b.setAttribute('aria-selected',b.dataset.id===id));
  history.replaceState(null,'','#'+id+(anchor?'/'+anchor:''));
  if(anchor){const el=document.getElementById(anchor);if(el){const d=el.querySelector('details');el.scrollIntoView({block:'start'});el.classList.add('hl')}}else window.scrollTo(0,0)}
$('#s-read').innerHTML=(D.alerts||[]).map(a=>'<div class="banner"><b>'+esc(a.t)+'</b>'+esc(a.d)+'</div>').join('')+D.clauses.map(c=>{
  const off=c.official.map(p=>'<p>'+esc(p)+'</p>').join('');
  return '<div class="card" id="c'+esc(c.no)+'"><h3><span class="no">'+esc(lab(c.no))+'</span>'+esc(c.title)+'</h3>'
   +'<div class="pw"><span class="lab my">白話</span>'+fmt(c.plain)+'</div>'+factsT(c.facts)
   +(c.mnemonic?'<div class="mn"><span class="lab my">口訣</span>'+esc(c.mnemonic)+'</div>':'')
   +(c.tip?'<p><span class="lab hint">提醒</span>'+esc(c.tip)+'</p>':'')
   +(c.official.length?'<details><summary>展開官方條文原文</summary><div class="off"><span class="lab fact">原文</span>'+off+'</div></details>':'')+'</div>'}).join('');
$('#s-table').innerHTML=D.tables.map((t,i)=>'<h3 id="t'+i+'">'+esc(t.title)+'</h3><div class="tw"><table><thead><tr>'+t.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+t.rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>').join('');
const cardsAll=D.cards.map(c=>({key:'ch'+D.chNo+':'+c.id,ref:c.ref,front:c.front,back:c.back}));
const fl=Flash($('#s-cards'),()=>cardsAll);fl.refresh();
const qz=Quiz($('#s-quiz'),()=>D.scenarios,0);qz.refresh();
// 上下章
const N=D.nav||{};
function setLink(el,o,dir){if(o){el.href=o.file;el.textContent=dir==='p'?'← '+o.label:o.label+' →'}else{el.style.visibility='hidden'}}
setLink($('#prev'),N.prev,'p');setLink($('#next'),N.next,'n');
// 左右滑動：換分頁，到頭就換章
function step(d){const i=TABS.findIndex(t=>t[0]===curTab)+d;
  if(i<0){if(N.prev)location.href=N.prev.file+'#read';return}
  if(i>=TABS.length){if(N.next)location.href=N.next.file+'#read';return}
  show(TABS[i][0])}
let sx=0,sy=0,skip=false;
document.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;const el=e.target&&e.target.nodeType===1?e.target:(e.target&&e.target.parentElement);skip=!!(el&&el.closest('.tw,nav,input,.off'))},{passive:true});
document.addEventListener('touchend',e=>{if(skip)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>70&&Math.abs(dy)<45){step(dx<0?1:-1)}},{passive:true});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1)});
// 深層連結
function route(){const h=(location.hash||'#read').slice(1).split('/');show(TABS.some(t=>t[0]===h[0])?h[0]:'read',h[1]?decodeURIComponent(h[1]):null)}
window.addEventListener('hashchange',route);route();
</script></body></html>
