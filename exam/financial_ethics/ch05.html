<script id="data" type="application/json">{"chapter": "第五章", "title": "洗錢防制：確認客戶身分、申報與刑責", "laws": [{"pcode": "G0380131", "name": "洗錢防制法", "amended": "民國113年7月31日", "url": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380131", "source": "法務部全國法規資料庫（經 kong0107/mojLawSplitJSON 公開鏡像取得，鏡像更新日 20261016）", "retrieved": "2026-11-03", "mirrorDate": "20240731"}, {"pcode": "G0380252", "name": "金融機構防制洗錢辦法", "amended": "民國110年12月14日", "url": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380252", "source": "法務部全國法規資料庫（經 kong0107/mojLawSplitJSON 公開鏡像取得，鏡像更新日 20261016）", "retrieved": "2026-11-03", "mirrorDate": "20211214"}], "alerts": [{"t": "最容易踩到的：洩漏申報、協助規避、介紹帳戶", "d": "（1）疑似洗錢交易的申報，不能告訴客戶或任何無關的人（洗錢防制法第24條第2項，2年以下有期徒刑、拘役或50萬元以下罰金，金融機構人員也適用）。（2）協助客戶規避確認身分、申報等洗錢防制程序，可能觸犯第20條。（3）幫人找人頭帳戶，可能觸犯第21、22條。"}, {"t": "後果的提醒（風險）", "d": "洗錢罪（第19條）最重處3年以上10年以下有期徒刑，併科1億元以下罰金；金融機構未依規定確認客戶身分、留存紀錄、申報，最高被罰1,000萬元。法人的從業人員因執行業務犯罪，法人還可能被併科10倍以下罰金（已盡力防止者除外）。"}, {"t": "洗錢防制法在114年修正過（以資料庫日期為準）", "d": "本章收錄的洗錢防制法是資料庫目前的版本（最近修正日期民國113年7月31日）。第6、11條的施行日期由行政院另定，本章沒有收錄。條號與舊版教材可能不同（例如洗錢罪現在是第19條，不是第14條），請以本頁條號為準。"}], "clauses": [{"title": "什麼是洗錢（四種行為）", "plain": "洗錢指：一、隱匿特定犯罪所得或掩飾其來源；二、妨礙或危害國家對特定犯罪所得的調查、發現、保全、沒收或追徵；三、收受、持有或使用他人的特定犯罪所得；四、使用自己的特定犯罪所得與他人進行交易。", "mnemonic": "隱匿、妨礙調查、收受持有他人的、拿自己的去交易。", "official": ["本法所稱洗錢，指下列行為：", "一、隱匿特定犯罪所得或掩飾其來源。", "二、妨礙或危害國家對於特定犯罪所得之調查、發現、保全、沒收或追徵。", "三、收受、持有或使用他人之特定犯罪所得。", "四、使用自己之特定犯罪所得與他人進行交易。"], "has_official": true, "no": "洗2"}, {"title": "哪些人適用洗錢防制規定", "plain": "金融機構包括銀行、信託投資公司、信用合作社、農漁會信用部、票券金融公司、信用卡公司、保險公司、證券商、投信、投顧、期貨商、信託業等。另外指定的非金融事業或人員包括銀樓業、地政士與不動產經紀業（從事不動產買賣交易）、律師公證人會計師（特定交易）、信託及公司服務提供業、第三方支付等。", "mnemonic": "金融機構：銀行、保險、證券、期貨、信託；加上銀樓、地政士、不動產經紀等指定行業。", "tip": "保險代理人、經紀人是否適用，細節在金融機構防制洗錢辦法第2條（主管機關指定的金融機構）。", "official": ["本法所稱金融機構，包括下列機構：", "一、銀行。", "二、信託投資公司。", "三、信用合作社。", "四、農會信用部。", "五、漁會信用部。", "六、全國農業金庫。", "七、辦理儲金匯兌、簡易人壽保險業務之郵政機構。", "八、票券金融公司。", "九、信用卡公司。", "十、保險公司。", "十一、證券商。", "十二、證券投資信託事業。", "十三、證券金融事業。", "十四、證券投資顧問事業。", "十五、證券集中保管事業。", "十六、期貨商。", "十七、信託業。", "十八、其他經目的事業主管機關指定之金融機構。", "辦理融資性租賃、提供虛擬資產服務之事業或人員，適用本法關於金融機構之規定。", "本法所稱指定之非金融事業或人員，指從事下列交易之事業或人員：", "一、銀樓業。", "二、地政士及不動產經紀業從事與不動產買賣交易有關之行為。", "三、律師、公證人、會計師為客戶準備或進行下列交易時：", "（一）買賣不動產。", "（二）管理客戶金錢、證券或其他資產。", "（三）管理銀行、儲蓄或證券帳戶。", "（四）有關提供公司設立、營運或管理之資金籌劃。", "（五）法人或法律協議之設立、營運或管理以及買賣事業體。", "四、信託及公司服務提供業為客戶準備或進行下列交易時：", "（一）關於法人之籌備或設立事項。", "（二）擔任或安排他人擔任公司董事或秘書、合夥之合夥人或在其他法人組織之類似職位。", "（三）提供公司、合夥、信託、其他法人或協議註冊之辦公室、營業地址、居住所、通訊或管理地址。", "（四）擔任或安排他人擔任信託或其他類似契約性質之受託人或其他相同角色。", "（五）擔任或安排他人擔任實質持股股東。", "五、提供第三方支付服務之事業或人員。", "六、其他業務特性或交易型態易為洗錢犯罪利用之事業或從業人員。", "第二項辦理融資性租賃、提供虛擬資產服務之事業或人員之範圍、第三項第六款指定之非金融事業或人員，其適用之交易型態，及得不適用第十二條第一項申報規定之前項各款事業或人員，由法務部會同中央目的事業主管機關報請行政院指定。", "第一項至第三項之金融機構、事業或人員所從事之交易，必要時，得由法務部會同中央目的事業主管機關指定其達一定金額者，應使用現金以外之支付工具。", "第一項至第三項之金融機構、事業或人員違反前項規定者，由中央目的事業主管機關處交易金額二倍以下罰鍰。", "前六項之中央目的事業主管機關認定有疑義者，由行政院指定之。", "第四項、第五項及前項之指定，其事務涉司法院者，由行政院會同司法院指定之。"], "has_official": true, "no": "洗5"}, {"title": "要建立洗錢防制內部控制與稽核制度", "plain": "金融機構應依洗錢與資恐風險及業務規模，建立內控與稽核制度，內容包括：作業及控制程序、定期辦理在職訓練、指派專責人員、備置並更新風險評估報告、稽核程序等。未建立制度或不符規定，限期改善，屆期未改善，金融機構罰50萬至1,000萬元，並得按次處罰；規避、拒絕或妨礙查核，罰50萬至500萬元。", "mnemonic": "制度、訓練、專責人員、風險評估、稽核；罰50萬到1,000萬。", "official": ["金融機構及指定之非金融事業或人員應依洗錢與資恐風險及業務規模，建立洗錢防制內部控制與稽核制度；其內容應包括下列事項：", "一、防制洗錢及打擊資恐之作業及控制程序。", "二、定期舉辦或參加防制洗錢之在職訓練。", "三、指派專責人員負責協調監督第一款事項之執行。", "四、備置並定期更新防制洗錢及打擊資恐風險評估報告。", "五、稽核程序。", "六、其他經中央目的事業主管機關指定之事項。", "前項制度之執行，中央目的事業主管機關應定期查核，並得委託其他機關（構）、法人或團體辦理。", "第一項制度之實施內容、作業程序、執行措施，前項查核之方式、受委託之資格條件及其他應遵行事項之辦法，由中央目的事業主管機關會商法務部及相關機關定之；於訂定前應徵詢相關公會之意見。", "違反第一項規定未建立制度，或前項辦法中有關制度之實施內容、作業程序、執行措施之規定者，由中央目的事業主管機關限期令其改善，屆期未改善者，處金融機構新臺幣五十萬元以上一千萬元以下罰鍰、處指定之非金融事業或人員新臺幣五萬元以上五百萬元以下罰鍰，並得按次處罰。", "金融機構及指定之非金融事業或人員規避、拒絕或妨礙現地或非現地查核者，由中央目的事業主管機關處金融機構新臺幣五十萬元以上五百萬元以下罰鍰、處指定之非金融事業或人員新臺幣五萬元以上二百五十萬元以下罰鍰，並得按次處罰。"], "has_official": true, "no": "洗7"}, {"title": "確認客戶身分、保存5年、政治性職務加強審查", "plain": "金融機構應進行確認客戶身分程序並留存資料；程序以風險為基礎，並包括實質受益人的審查。確認客戶身分取得的資料，應自業務關係終止時起至少保存5年（臨時性交易則自交易終止時起5年）。對現任或曾任國內外政府或國際組織重要政治性職務的客戶或受益人及其家庭成員、密切關係人，要加強客戶審查。違反者，金融機構罰50萬至1,000萬元。", "mnemonic": "認識客戶、查實質受益人、保存5年、重要政治性職務要加強審查。", "facts": {"head": ["項目", "規定"], "rows": [["確認客戶身分", "風險為基礎，包括實質受益人審查"], ["資料保存", "業務關係終止時起至少5年（臨時性交易自交易終止時起5年）"], ["重要政治性職務", "加強客戶審查"], ["違反罰鍰（金融機構）", "50萬至1,000萬元"]]}, "official": ["金融機構及指定之非金融事業或人員應進行確認客戶身分程序，並留存其確認客戶身分程序所得資料；其確認客戶身分程序應以風險為基礎，並應包括實質受益人之審查。", "前項確認客戶身分程序所得資料，應自業務關係終止時起至少保存五年；臨時性交易者，應自臨時性交易終止時起至少保存五年。但法律另有較長保存期間規定者，從其規定。", "金融機構及指定之非金融事業或人員對現任或曾任國內外政府或國際組織重要政治性職務之客戶或受益人與其家庭成員及有密切關係之人，應以風險為基礎，執行加強客戶審查程序。", "第一項確認客戶身分範圍、留存確認資料之範圍、程序、方式及前項加強客戶審查之範圍、程序、方式之辦法，由中央目的事業主管機關會商法務部及相關機關定之；於訂定前應徵詢相關公會之意見。前項重要政治性職務之人與其家庭成員及有密切關係之人之範圍，由法務部定之。", "違反第一項至第三項規定或前項所定辦法中有關確認客戶身分、留存確認資料、加強客戶審查之範圍、程序、方式之規定者，由中央目的事業主管機關處金融機構新臺幣五十萬元以上一千萬元以下罰鍰、處指定之非金融事業或人員新臺幣五萬元以上五百萬元以下罰鍰，並得按次處罰。"], "has_official": true, "no": "洗8"}, {"title": "交易紀錄要保存5年", "plain": "金融機構因執行業務辦理國內外交易，應留存必要交易紀錄；自交易完成時起，至少保存5年（法律另有較長規定者從其規定）。違反者，金融機構罰50萬至1,000萬元。", "mnemonic": "交易完成起，保存5年。", "official": ["金融機構及指定之非金融事業或人員因執行業務而辦理國內外交易，應留存必要交易紀錄。", "前項必要交易紀錄之保存，自交易完成時起，應至少保存五年。但法律另有較長保存期間規定者，從其規定。", "第一項留存必要交易紀錄之適用交易範圍、程序、方式之辦法，由中央目的事業主管機關會商法務部及相關機關定之；於訂定前應徵詢相關公會之意見。", "違反第一項、第二項規定或前項所定辦法中有關留存必要交易紀錄之範圍、程序、方式之規定者，由中央目的事業主管機關處金融機構新臺幣五十萬元以上一千萬元以下罰鍰、處指定之非金融事業或人員新臺幣五萬元以上五百萬元以下罰鍰，並得按次處罰。"], "has_official": true, "no": "洗10"}, {"title": "大額通貨交易要申報調查局", "plain": "對達一定金額的通貨交易，應向法務部調查局申報。依規定申報，免除業務上應保守秘密的義務；該機構的負責人、董事、經理人及職員也一樣。違反者，金融機構罰50萬至1,000萬元。", "mnemonic": "大額現金申報；依規定申報，免保密義務。", "tip": "『一定金額』是新臺幣50萬元（含等值外幣），定義在金融機構防制洗錢辦法第2條第2款。", "official": ["金融機構及指定之非金融事業或人員對於達一定金額之通貨交易，除本法另有規定外，應向法務部調查局申報。", "金融機構及指定之非金融事業或人員依前項規定為申報者，免除其業務上應保守秘密之義務。該機構或事業之負責人、董事、經理人及職員，亦同。", "第一項一定金額、通貨交易之範圍、種類、申報之範圍、方式、程序及其他應遵行事項之辦法，由中央目的事業主管機關會商法務部及相關機關定之；於訂定前應徵詢相關公會之意見。", "違反第一項規定或前項所定辦法中有關申報之範圍、方式、程序之規定者，由中央目的事業主管機關處金融機構新臺幣五十萬元以上一千萬元以下罰鍰、處指定之非金融事業或人員新臺幣五萬元以上五百萬元以下罰鍰，並得按次處罰。"], "has_official": true, "no": "洗12"}, {"title": "疑似洗錢交易要申報，未完成也要", "plain": "對疑似犯洗錢罪（第19、20條）的交易，應向法務部調查局申報；交易未完成者也要申報。依規定申報，免除業務上保守秘密義務；該機構的負責人、董事、經理人及職員也一樣。違反者，金融機構罰50萬至1,000萬元。", "mnemonic": "疑似洗錢：不論金額、未完成也要申報；申報免保密義務。", "tip": "疑似洗錢交易沒有金額門檻，不是一定要50萬以上。", "official": ["金融機構及指定之非金融事業或人員對疑似犯第十九條、第二十條之罪之交易，應向法務部調查局申報；其交易未完成者，亦同。", "金融機構及指定之非金融事業或人員依前項規定為申報者，免除其業務上應保守秘密之義務。該機構或事業之負責人、董事、經理人及職員，亦同。", "第一項之申報範圍、方式、程序及其他應遵行事項之辦法，由中央目的事業主管機關會商法務部及相關機關定之；於訂定前應徵詢相關公會之意見。", "前項、第七條第三項、第八條第四項、第十條第三項及前條第三項之辦法，其事務涉司法院者，由司法院會商行政院定之。", "違反第一項規定或第三項所定辦法中有關申報之範圍、方式、程序之規定者，由中央目的事業主管機關處金融機構新臺幣五十萬元以上一千萬元以下罰鍰、處指定之非金融事業或人員新臺幣五萬元以上五百萬元以下罰鍰，並得按次處罰。"], "has_official": true, "no": "洗13"}, {"title": "洗錢罪：3年以上10年以下", "plain": "有第2條各款洗錢行為的，處3年以上10年以下有期徒刑，併科新臺幣1億元以下罰金。洗錢的財物或財產上利益未達1億元的，處6個月以上5年以下有期徒刑，併科5,000萬元以下罰金。未遂犯也罰。", "mnemonic": "洗錢：1億以上3到10年；未達1億6月到5年；未遂也罰。", "facts": {"head": ["洗錢金額", "刑度", "併科罰金"], "rows": [["1億元以上", "3年以上10年以下有期徒刑", "1億元以下"], ["未達1億元", "6月以上5年以下有期徒刑", "5,000萬元以下"], ["未遂", "也處罰", "—"]]}, "official": ["有第二條各款所列洗錢行為者，處三年以上十年以下有期徒刑，併科新臺幣一億元以下罰金。其洗錢之財物或財產上利益未達新臺幣一億元者，處六月以上五年以下有期徒刑，併科新臺幣五千萬元以下罰金。", "前項之未遂犯罰之。"], "has_official": true, "no": "洗19"}, {"title": "特殊洗錢罪：無合理來源又規避洗錢防制程序", "plain": "收受、持有或使用的財物或財產上利益，有下列情形之一而無合理來源的，處6個月以上5年以下有期徒刑，得併科5,000萬元以下罰金：一、冒名或以假名等不實資訊開立帳戶；二、以不正方法取得、使用他人帳戶；三、規避第8條、第10條至第13條的洗錢防制程序。未遂也罰。", "mnemonic": "假名開戶、不正方法拿別人帳戶、規避洗錢防制程序，又說不出來源。", "tip": "第3款是對業務員最重要的：幫客戶想辦法避開確認身分、保存紀錄、申報，風險很高。", "official": ["收受、持有或使用之財物或財產上利益，有下列情形之一，而無合理來源者，處六月以上五年以下有期徒刑，得併科新臺幣五千萬元以下罰金：", "一、冒名、以假名或其他與身分相關之不實資訊向金融機構、提供虛擬資產服務或第三方支付服務之事業或人員申請開立帳戶、帳號。", "二、以不正方法取得、使用他人向金融機構申請開立之帳戶、向提供虛擬資產服務或第三方支付服務之事業或人員申請之帳號。", "三、規避第八條、第十條至第十三條所定洗錢防制程序。", "前項之未遂犯罰之。"], "has_official": true, "no": "洗20"}, {"title": "不得把帳戶交給別人使用", "plain": "任何人不得將自己或他人的帳戶交付、提供給他人使用（符合一般商業、金融交易習慣，或基於親友間信賴關係等正當理由的除外）。違反的，由警察機關裁處告誡；期約或收受對價、交付帳戶合計3個以上，或告誡後5年內再犯的，處3年以下有期徒刑、拘役或科或併科100萬元以下罰金；並且金融機構要對相關帳戶暫停、限制功能或關閉。", "mnemonic": "帳戶不外借；有對價、3個以上、5年內再犯＝刑責。", "facts": {"head": ["情形", "後果"], "rows": [["一般違反（無加重事由）", "警察機關裁處告誡"], ["期約或收受對價", "3年以下有期徒刑、拘役或科或併科100萬元以下罰金"], ["交付帳戶合計3個以上", "同上"], ["告誡後5年內再犯", "同上"], ["金融機構", "對相關帳戶暫停、限制功能或關閉"]]}, "official": ["任何人不得將自己或他人向金融機構申請開立之帳戶、向提供虛擬資產服務或第三方支付服務之事業或人員申請之帳號交付、提供予他人使用。但符合一般商業、金融交易習慣，或基於親友間信賴關係或其他正當理由者，不在此限。", "違反前項規定者，由直轄市、縣（市）政府警察機關裁處告誡。經裁處告誡後逾五年再違反前項規定者，亦同。", "違反第一項規定而有下列情形之一者，處三年以下有期徒刑、拘役或科或併科新臺幣一百萬元以下罰金：", "一、期約或收受對價而犯之。", "二、交付、提供之帳戶或帳號合計三個以上。", "三、經直轄市、縣（市）政府警察機關依前項或第四項規定裁處後，五年以內再犯。", "前項第一款或第二款情形，應依第二項規定，由該管機關併予裁處之。", "違反第一項規定者，金融機構、提供虛擬資產服務及第三方支付服務之事業或人員，應對其已開立之帳戶、帳號，或欲開立之新帳戶、帳號，於一定期間內，暫停或限制該帳戶、帳號之全部或部分功能，或逕予關閉。", "前項帳戶、帳號之認定基準，暫停、限制功能或逕予關閉之期間、範圍、程序、方式、作業程序之辦法，由法務部會同中央目的事業主管機關定之。", "警政主管機關應會同社會福利主管機關，建立個案通報機制，於依第二項規定為告誡處分時，倘知悉有社會救助需要之個人或家庭，應通報直轄市、縣（市）社會福利主管機關，協助其獲得社會救助法所定社會救助。"], "has_official": true, "no": "洗22"}, {"title": "法人也可能被罰，自首與自白減刑", "plain": "法人的代表人、代理人、受僱人或其他從業人員，因執行業務犯前四條之罪，除處罰行為人外，對法人並科10倍以下罰金（已盡力防止者除外）。犯第19至21條之罪，自首並繳交全部所得，減輕或免除其刑；犯前四條之罪，在偵查及歷次審判中均自白並繳交所得，減輕其刑。", "mnemonic": "法人併罰10倍；自首、偵審都自白可以減刑。", "official": ["法人之代表人、代理人、受僱人或其他從業人員，因執行業務犯前四條之罪者，除處罰行為人外，對該法人並科以十倍以下之罰金。但法人之代表人或自然人對於犯罪之發生，已盡力為防止行為者，不在此限。", "犯第十九條至第二十一條之罪，於犯罪後自首，如有所得並自動繳交全部所得財物者，減輕或免除其刑；並因而使司法警察機關或檢察官得以扣押全部洗錢之財物或財產上利益，或查獲其他正犯或共犯者，免除其刑。", "犯前四條之罪，在偵查及歷次審判中均自白者，如有所得並自動繳交全部所得財物者，減輕其刑；並因而使司法警察機關或檢察官得以扣押全部洗錢之財物或財產上利益，或查獲其他正犯或共犯者，減輕或免除其刑。", "第十九條、第二十條或第二十一條之罪，於中華民國人民在中華民國領域外犯罪者，適用之。", "第十九條之罪，不以本法所定特定犯罪之行為或結果在中華民國領域內為必要。但該特定犯罪依行為地之法律不罰者，不在此限。"], "has_official": true, "no": "洗23"}, {"title": "洩漏申報疑似洗錢的刑責", "plain": "公務員洩漏或交付關於申報疑似洗錢交易或涉嫌文件、消息的，處3年以下有期徒刑。第5條第1至3項不具公務員身分的人（金融機構、指定之非金融事業或人員）洩漏或交付的，處2年以下有期徒刑、拘役或50萬元以下罰金。", "mnemonic": "申報疑似洗錢，不能洩漏：公務員3年、金融機構人員2年。", "tip": "客戶問『是不是被通報了』，不能回答；也不能提前提醒客戶。", "official": ["公務員洩漏或交付關於申報疑似犯第十九條、第二十條之罪之交易或犯第十九條、第二十條之罪嫌疑之文書、圖畫、消息或物品者，處三年以下有期徒刑。", "第五條第一項至第三項不具公務員身分之人洩漏或交付關於申報疑似犯第十九條、第二十條之罪之交易或犯第十九條、第二十條之罪嫌疑之文書、圖畫、消息或物品者，處二年以下有期徒刑、拘役或新臺幣五十萬元以下罰金。"], "has_official": true, "no": "洗24"}, {"title": "一定金額＝50萬；金融機構範圍；實質受益人；風險基礎", "plain": "金融機構包括銀行業、證券期貨業、保險業，以及經金管會指定的其他機構（電子支付機構、槓桿交易商、保險代理人公司、保險經紀人公司及個人執業之保險代理人、經紀人等）。『一定金額』是新臺幣50萬元（含等值外幣）；通貨交易是單筆現金收或付或換鈔交易；實質受益人是對客戶具最終所有權或控制權的自然人，或由他人代理交易的本人。風險基礎方法：高風險加強措施，低風險可簡化。", "mnemonic": "一定金額＝50萬；保險代理人經紀人也被指定。", "facts": {"head": ["名詞", "意思"], "rows": [["一定金額", "新臺幣50萬元（含等值外幣）"], ["一定數量", "50張儲值卡"], ["通貨交易", "單筆現金收或付、換鈔交易"], ["實質受益人", "對客戶具最終所有權或控制權的自然人，或由他人代理交易的本人"], ["風險基礎方法", "高風險加強措施；低風險可簡化措施"]]}, "official": ["本辦法用詞定義如下：", "一、金融機構：包括下列之銀行業、證券期貨業、保險業及其他經金融監督管理委員會（以下簡稱本會）指定之金融機構：", "（一）銀行業：包括銀行、信用合作社、辦理儲金匯兌之郵政機構、票券金融公司、信用卡公司及信託業。", "（二）證券期貨業：包括證券商、證券投資信託事業、證券金融事業、證券投資顧問事業、證券集中保管事業、期貨商。", "（三）保險業：包括保險公司、專業再保險公司及辦理簡易人壽保險業務之郵政機構。", "（四）其他經本會指定之金融機構：包括電子支付機構、外籍移工匯兌公司（限於經營外籍移工國外小額匯兌業務之範圍內）、槓桿交易商、期貨信託事業、期貨經理事業，以及保險代理人公司、保險經紀人公司及個人執業之保險代理人、保險經紀人（以下簡稱保險代理人、保險經紀人）。", "二、一定金額：指新臺幣五十萬元（含等值外幣）。", "三、一定數量：指五十張儲值卡。", "四、通貨交易：指單筆現金收或付（在會計處理上，凡以現金收支傳票記帳者皆屬之）或換鈔交易。", "五、客戶：包括銀行業、證券期貨業及保險業等金融機構之客戶，與電子支付帳戶及儲值卡之使用者。上開使用者指與電子支付機構簽訂契約，利用電子支付帳戶或儲值卡，移轉支付款項或進行儲值者。", "六、電子支付帳戶：指以網路或電子支付平臺為中介，接受使用者註冊與開立記錄支付款項移轉及儲值情形，並利用電子設備以連線方式傳遞收付訊息之支付工具。", "七、儲值卡：指具有資料儲存或計算功能之晶片、卡片、憑證等實體或非實體形式發行，並以電子、磁力或光學等技術儲存金錢價值之支付工具。", "八、實質受益人：指對客戶具最終所有權或控制權之自然人，或由他人代理交易之自然人本人，包括對法人或法律協議具最終有效控制權之自然人。", "九、風險基礎方法：指金融機構應確認、評估及瞭解其暴露之洗錢及資恐風險，並採取適當防制洗錢及打擊資恐措施，以有效降低此類風險。依該方法，金融機構對於較高風險情形應採取加強措施，對於較低風險情形，則可採取相對簡化措施，以有效分配資源，並以最適當且有效之方法，降低經其確認之洗錢及資恐風險。"], "has_official": true, "no": "洗辦2"}, {"title": "確認客戶身分：什麼時候、怎麼做", "plain": "不得接受匿名或假名建立或維持業務關係。這些時候要確認客戶身分：建立業務關係時；臨時性交易達一定金額以上，或辦理新臺幣3萬元（含等值外幣）以上的跨境匯款；發現疑似洗錢或資恐；對過去取得的客戶身分資料真實性或妥適性有懷疑。要辨識客戶與代理人、實質受益人（法人客戶：直接或間接持有股份或資本超過25%的最終自然人），並了解業務關係的目的與性質。保險業在人壽、投資型、年金保險受益人確定或指定時，要取得受益人姓名或名稱及身分證明文件號碼，並在支付保險金時驗證其身分。", "mnemonic": "不收匿名；建立關係、臨時大額、跨境3萬、疑似、懷疑資料；法人看25%；保險受益人指定要取資料、給付要驗證。", "tip": "完成確認客戶身分前，原則上不得與客戶建立業務關係或進行臨時性交易，除非符合例外並能儘速完成驗證。", "facts": {"head": ["情形", "要確認客戶身分"], "rows": [["建立業務關係", "要"], ["臨時性交易達一定金額（50萬）以上；多筆顯有關聯合計達一定金額", "要"], ["新臺幣3萬元（含等值外幣）以上跨境匯款", "要"], ["發現疑似洗錢或資恐", "要"], ["對過去取得的身分資料真實性或妥適性有懷疑", "要"], ["法人客戶的實質受益人", "持有股份或資本超過25%的最終自然人；找不到再找其他有控制權的人；仍找不到才辨識高階管理人員"]]}, "official": ["金融機構確認客戶身分措施，應依下列規定辦理：", "一、金融機構不得接受客戶以匿名或使用假名建立或維持業務關係。", "二、金融機構於下列情形時，應確認客戶身分：", "（一）與客戶建立業務關係時。", "（二）進行下列臨時性交易：", "1.辦理一定金額以上交易（含國內匯款）或一定數量以上儲值卡交易時。多筆顯有關聯之交易合計達一定金額以上時，亦同。", "2.辦理新臺幣三萬元（含等值外幣）以上之跨境匯款時。", "（三）發現疑似洗錢或資恐交易時。", "（四）對於過去所取得客戶身分資料之真實性或妥適性有所懷疑時。", "三、前款第一目於電子支付機構，係指接受客戶申請註冊及開立電子支付帳戶或辦理儲值卡記名作業時；於外籍移工匯兌公司辦理外籍移工國外小額匯兌業務，係指接受客戶申請註冊時。", "四、金融機構確認客戶身分應採取下列方式：", "（一）以可靠、獨立來源之文件、資料或資訊，辨識及驗證客戶身分，並保存該身分證明文件影本或予以記錄。", "（二）對於由代理人辦理者，應確實查證代理之事實，並以可靠、獨立來源之文件、資料或資訊，辨識及驗證代理人身分，並保存該身分證明文件影本或予以記錄。", "（三）辨識客戶實質受益人，並以合理措施驗證其身分，包括使用可靠來源之資料或資訊。", "（四）確認客戶身分措施，應包括瞭解業務關係之目的與性質，並視情形取得相關資訊。", "五、前款規定於客戶為法人、團體或信託之受託人時，應瞭解客戶或信託（包括類似信託之法律協議）之業務性質，並至少取得客戶或信託之下列資訊，辨識及驗證客戶身分：", "（一）客戶或信託之名稱、法律形式及存在證明。", "（二）規範及約束客戶或信託之章程或類似之權力文件。但下列情形得不適用：", "1.第七款第三目所列對象及辦理第七款第四目所列保險商品，其無第六條第一項第三款但書情形者。", "2.辦理儲值卡記名業務者。", "3.團體客戶經確認其未訂定章程或類似之權力文件者。", "（三）在客戶中擔任高階管理人員者之姓名。", "（四）客戶註冊登記之辦公室地址，及其主要之營業處所地址。", "六、客戶為法人時，應瞭解其是否可發行無記名股票，並對已發行無記名股票之客戶採取適當措施以確保其實質受益人之更新。", "七、第四款第三目規定於客戶為法人、團體或信託之受託人時，應瞭解客戶或信託之所有權及控制權結構，並透過下列資訊，辨識客戶之實質受益人，及採取合理措施驗證：", "（一）客戶為法人、團體時：", "1.具控制權之最終自然人身分。所稱具控制權係指直接、間接持有該法人股份或資本超過百分之二十五者，金融機構得請客戶提供股東名冊或其他文件協助完成辨識。", "2.依前小目規定未發現具控制權之自然人，或對具控制權自然人是否為實質受益人有所懷疑時，應辨識有無透過其他方式對客戶行使控制權之自然人。", "3.依前二小目規定均未發現具控制權之自然人時，金融機構應辨識高階管理人員之身分。", "（二）客戶為信託之受託人時：應確認委託人、受託人、信託監察人、信託受益人及其他可有效控制該信託帳戶之人，或與上述人員具相當或類似職務者之身分。", "（三）客戶或具控制權者為下列身分者，除有第六條第一項第三款但書情形或已發行無記名股票情形者外，不適用第四款第三目辨識及驗證實質受益人身分之規定。", "1.我國政府機關。", "2.我國公營事業機構。", "3.外國政府機關。", "4.我國公開發行公司或其子公司。", "5.於國外掛牌並依掛牌所在地規定，應揭露其主要股東之股票上市、上櫃公司及其子公司。", "6.受我國監理之金融機構及其管理之投資工具。", "7.設立於我國境外，且所受監理規範與防制洗錢金融行動工作組織（FATF）所定防制洗錢及打擊資恐標準一致之金融機構，及該金融機構管理之投資工具。", "8.我國政府機關管理之基金。", "9.員工持股信託、員工福利儲蓄信託。", "（四）金融機構辦理財產保險、傷害保險、健康保險或不具有保單價值準備金之保險商品，除客戶有第六條第一項第三款但書情形者外，不適用第四款第三目辨識及驗證實質受益人身分之規定。", "八、保險業應於人壽保險、投資型保險及年金保險契約之保險受益人確定或經指定時，採取下列措施：", "（一）對於經指定為保險受益人者，應取得其姓名或名稱及身分證明文件號碼或註冊設立日期。", "（二）對於依據契約特性或其他方式指定為保險受益人者，應取得充分資訊，以使保險業於支付保險金時得藉以辨識該保險受益人身分。", "（三）於支付保險金時，驗證該保險受益人之身分。", "九、金融機構完成確認客戶身分措施前，不得與該客戶建立業務關係或進行臨時性交易。但符合下列各目情形者，得先取得辨識客戶及實質受益人身分之資料，並於建立業務關係後，再完成驗證：", "（一）洗錢及資恐風險受到有效管理。包括應針對客戶可能利用交易完成後才驗證身分之情形，採取風險管控措施。", "（二）為避免對客戶業務之正常運作造成干擾所必須。", "（三）會在合理可行之情形下儘速完成客戶及實質受益人之身分驗證。如未能在合理可行之時限內完成客戶及實質受益人之身分驗證，須終止該業務關係，並應事先告知客戶。", "十、金融機構對於無法完成確認客戶身分相關規定程序者，應考量申報與該客戶有關之疑似洗錢或資恐交易。", "十一、金融機構懷疑某客戶或交易可能涉及洗錢或資恐，且合理相信執行確認客戶身分程序可能對客戶洩露訊息時，得不執行該等程序，而改以申報疑似洗錢或資恐交易。", "十二、電子支付帳戶之客戶身分確認程序應依電子支付機構身分確認機制及交易限額管理辦法相關規定辦理，不適用第四款至第七款規定。", "十三、辦理儲值卡記名作業，不適用第四款第三目及第六款規定。"], "has_official": true, "no": "洗辦3"}, {"title": "九種情形要婉拒建立業務關係或交易", "plain": "有下列情形之一，應婉拒建立業務關係或交易：疑似使用匿名、假名、人頭、虛設行號或虛設法人；客戶拒絕提供審核身分的文件；代理人辦理而查證代理事實及身分有困難；持用偽造、變造身分證明文件；出示的身分證明文件均為影本（有例外）；提供的文件可疑、模糊不清或無法查證；不尋常拖延補件；對象為資恐防制法指定制裁的個人、法人或團體等；其他異常情形且客戶無法合理說明。", "mnemonic": "人頭假名、不給文件、代理難查、偽造變造、只有影本、文件可疑、拖延補件、制裁名單、其他異常。", "tip": "業務員遇到『只肯給影本』『不願說資金來源』的客戶，依規定要婉拒，不是勉強收件。", "official": ["金融機構確認客戶身分時，有下列情形之一者，應予以婉拒建立業務關係或交易：", "一、疑似使用匿名、假名、人頭、虛設行號或虛設法人團體開設帳戶、投保或辦理儲值卡記名作業。", "二、客戶拒絕提供審核客戶身分措施相關文件。", "三、對於由代理人辦理開戶、儲值卡記名作業、註冊電子支付帳戶、投保、保險理賠、保險契約變更或交易者，且查證代理之事實及身分資料有困難。", "四、持用偽、變造身分證明文件。", "五、出示之身分證明文件均為影本。但依規定得以身分證明文件影本或影像檔，輔以其他管控措施辦理之業務，不在此限。", "六、提供文件資料可疑、模糊不清，不願提供其他佐證資料或提供之文件資料無法進行查證。", "七、客戶不尋常拖延應補充之身分證明文件。", "八、建立業務關係對象為資恐防制法指定制裁之個人、法人或團體，以及外國政府或國際組織認定或追查之恐怖分子或團體。但依資恐防制法第六條第一項第一款至第三款所為支付不在此限。", "九、建立業務關係或交易時，有其他異常情形，客戶無法提出合理說明。"], "has_official": true, "no": "洗辦4"}, {"title": "紀錄憑證保存至少5年", "plain": "金融機構對國內外交易的所有必要紀錄，至少保存5年；確認客戶身分取得的所有紀錄、帳戶或契約文件檔案、業務往來資訊（含對複雜、異常交易詢問取得的背景或目的資訊與分析資料），要保存到業務關係結束後或臨時性交易結束後至少5年（法律另有較長保存期間者從其規定）。交易紀錄要足以重建個別交易，並能迅速提供給有權機關。", "mnemonic": "交易紀錄5年；身分資料到關係結束後5年。", "official": ["金融機構應以紙本或電子資料保存與客戶往來及交易之紀錄憑證，並依下列規定辦理：", "一、金融機構對國內外交易之所有必要紀錄，應至少保存五年。但法律另有較長保存期間規定者，從其規定。", "二、金融機構對下列資料，應保存至與客戶業務關係結束後或臨時性交易結束後，至少五年。但法律另有較長保存期間規定者，從其規定：", "（一）確認客戶身分所取得之所有紀錄，如護照、身分證、駕照或類似之官方身分證明文件影本或紀錄。", "（二）帳戶、電子支付帳戶或卡戶檔案或契約文件檔案。", "（三）業務往來資訊，包括對複雜、異常交易進行詢問所取得之背景或目的資訊與分析資料。", "三、金融機構保存之交易紀錄應足以重建個別交易，以備作為認定不法活動之證據。", "四、金融機構對權責機關依適當授權要求提供交易紀錄及確認客戶身分等相關資訊時，應確保能夠迅速提供。"], "has_official": true, "no": "洗辦12"}, {"title": "大額通貨交易：確認身分、5個營業日內申報", "plain": "對達一定金額（50萬元）以上的通貨交易，要確認客戶身分並留存紀錄憑證（如能確認客戶為交易帳戶本人，可免確認但要在交易紀錄上敘明是本人交易）；要在交易完成後5個營業日內，依調查局格式以媒體申報方式向調查局申報。", "mnemonic": "50萬現金：確認身分，5個營業日內申報。", "official": ["金融機構對達一定金額以上之通貨交易，應依下列規定辦理：", "一、應確認客戶身分並留存相關紀錄憑證。", "二、確認客戶身分措施，應依下列規定辦理：", "（一）憑客戶提供之身分證明文件或護照確認其身分，並將其姓名、出生年月日、住址、電話、交易帳戶號碼、交易金額及身分證明文件號碼等事項加以記錄。但如能確認客戶為交易帳戶本人者，可免確認身分，惟應於交易紀錄上敘明係本人交易。", "（二）交易如係由代理人為之者，應憑代理人提供之身分證明文件或護照確認其身分，並將其姓名、出生年月日、住址、電話、交易帳戶號碼、交易金額及身分證明文件號碼等事項加以記錄。", "（三）交易如係屬臨時性交易者，應依第三條第四款規定確認客戶身分。", "三、除第十四條規定之情形外，應依法務部調查局（以下簡稱調查局）所定之申報格式，於交易完成後五個營業日內以媒體申報方式，向調查局申報。無法以媒體方式申報而有正當理由者，得報經調查局同意後，以書面申報之。", "四、向調查局申報資料及相關紀錄憑證之保存，應依第十二條規定辦理。"], "has_official": true, "no": "洗辦13"}, {"title": "疑似洗錢交易：專責主管核定後2個營業日內申報", "plain": "經檢視屬疑似洗錢或資恐交易的，不論金額多寡，都要簽報，經專責主管核定後立即向調查局申報，核定後的申報期限不得逾2個營業日；交易未完成者也一樣。明顯重大緊急案件，要立即以傳真或其他方式申報，並補辦書面資料。", "mnemonic": "疑似洗錢：不論金額；核定後2個營業日內；重大緊急立即申報。", "facts": {"head": ["類型", "金額門檻", "申報期限"], "rows": [["大額通貨交易", "達50萬元（含等值外幣）", "交易完成後5個營業日內"], ["疑似洗錢或資恐交易", "不論金額", "專責主管核定後立即申報，核定後不得逾2個營業日"], ["明顯重大緊急的疑似洗錢案件", "不論金額", "立即以傳真或其他可行方式申報，並補辦書面"]]}, "official": ["金融機構對疑似洗錢或資恐交易之申報，應依下列規定辦理：", "一、金融機構對於符合第九條第五款規定之監控型態或其他異常情形，應依同條第四款及第六款規定，儘速完成是否為疑似洗錢或資恐交易之檢視，並留存紀錄。", "二、對於經檢視屬疑似洗錢或資恐交易者，不論交易金額多寡，均應依調查局所定之申報格式簽報，並於專責主管核定後立即向調查局申報，核定後之申報期限不得逾二個營業日。交易未完成者，亦同。", "三、對屬明顯重大緊急之疑似洗錢或資恐交易案件之申報，應立即以傳真或其他可行方式儘速向調查局申報，並應補辦書面資料。但經調查局以傳真資料確認回條確認收件者，無需補辦申報書。金融機構並應留存傳真資料確認回條。", "四、前二款申報書及傳真資料確認回條，應依調查局規定之格式辦理。", "五、向調查局申報資料及相關紀錄憑證之保存，應依第十二條規定辦理。"], "has_official": true, "no": "洗辦15"}], "tables": [{"title": "數字速記：洗錢防制", "head": ["條", "數字", "什麼事"], "rows": [["辦2", "新臺幣50萬元（含等值外幣）", "一定金額（大額通貨交易門檻）"], ["辦3", "新臺幣3萬元（含等值外幣）以上", "跨境匯款要確認客戶身分"], ["辦3", "25%", "法人客戶：持有股份或資本超過25%的最終自然人是實質受益人"], ["洗8、10、辦12", "5年", "身分資料與交易紀錄的最低保存期間"], ["辦13", "5個營業日內", "大額通貨交易申報期限"], ["辦15", "核定後2個營業日內", "疑似洗錢交易申報期限"], ["洗19", "3年以上10年以下；6月以上5年以下", "洗錢罪刑度（1億元以上；未達1億元）"], ["洗24", "2年以下／3年以下", "洩漏申報疑似洗錢（金融機構人員／公務員）"], ["洗7、8、10、12、13", "50萬至1,000萬元", "金融機構違反洗錢防制規定的罰鍰"]]}, {"title": "大額通貨交易 vs 疑似洗錢交易", "head": ["項目", "大額通貨交易", "疑似洗錢交易"], "rows": [["門檻", "達50萬元（含等值外幣）", "沒有金額門檻"], ["申報對象", "法務部調查局", "法務部調查局"], ["期限", "交易完成後5個營業日內", "專責主管核定後2個營業日內（重大緊急：立即）"], ["交易未完成", "—", "也要申報"], ["保密義務", "依規定申報者免除", "依規定申報者免除"], ["對客戶能不能說", "—", "不能洩漏（第24條）"]]}], "cards": [{"ref": "洗辦2", "front": "『一定金額』是多少？", "back": "新臺幣50萬元（含等值外幣）。", "id": 1}, {"ref": "洗辦3", "front": "跨境匯款多少錢以上要確認客戶身分？", "back": "新臺幣3萬元（含等值外幣）以上。", "id": 2}, {"ref": "洗辦3", "front": "法人客戶的實質受益人，先看誰？", "back": "直接或間接持有股份或資本超過25%的最終自然人。", "id": 3}, {"ref": "洗辦3", "front": "保險業對人壽、投資型、年金保險受益人，在什麼時點要做什麼？", "back": "受益人確定或指定時取得其姓名或名稱及證件號碼；支付保險金時驗證其身分。", "id": 4}, {"ref": "洗8", "front": "確認客戶身分取得的資料，要保存多久？", "back": "業務關係終止時起至少5年（臨時性交易為交易終止時起5年）。", "id": 5}, {"ref": "洗10", "front": "交易紀錄要保存多久？", "back": "交易完成時起至少5年。", "id": 6}, {"ref": "洗辦13", "front": "大額通貨交易，要在多久內向調查局申報？", "back": "交易完成後5個營業日內。", "id": 7}, {"ref": "洗辦15", "front": "疑似洗錢交易有沒有金額門檻？申報期限？", "back": "沒有金額門檻；專責主管核定後立即申報，不得逾2個營業日。", "id": 8}, {"ref": "洗13", "front": "交易沒完成，但很可疑，要不要申報？", "back": "要，交易未完成者也要申報。", "id": 9}, {"ref": "洗13", "front": "依規定申報疑似洗錢交易，會不會違反保密義務？", "back": "不會，依規定申報者免除業務上應保守秘密的義務。", "id": 10}, {"ref": "洗24", "front": "金融機構人員洩漏申報疑似洗錢交易的消息，刑責？", "back": "2年以下有期徒刑、拘役或50萬元以下罰金。", "id": 11}, {"ref": "洗19", "front": "洗錢罪的刑度？", "back": "1億元以上：3年以上10年以下有期徒刑，併科1億元以下罰金；未達1億元：6月以上5年以下，併科5,000萬元以下罰金；未遂也罰。", "id": 12}, {"ref": "洗20", "front": "幫客戶規避洗錢防制程序，可能構成什麼？", "back": "可能構成第20條特殊洗錢罪（無合理來源又規避第8條、第10至13條程序）：6月以上5年以下有期徒刑。", "id": 13}, {"ref": "洗22", "front": "把帳戶交給別人使用，有對價或3個以上帳戶，刑責？", "back": "3年以下有期徒刑、拘役或科或併科100萬元以下罰金。", "id": 14}, {"ref": "洗辦4", "front": "客戶只肯提供身分證影本，還拒絕說明，該怎麼辦？", "back": "依辦法第4條，應婉拒建立業務關係或交易（例如拒絕提供審核文件、文件均為影本等情形，有例外規定）。", "id": 15}], "scenarios": [{"ref": "洗辦2", "q": "依金融機構防制洗錢辦法，大額通貨交易的『一定金額』是多少？", "opts": ["新臺幣10萬元", "新臺幣30萬元", "新臺幣50萬元（含等值外幣）", "新臺幣100萬元"], "ans": 2, "why": "金融機構防制洗錢辦法第2條第2款：一定金額，指新臺幣50萬元（含等值外幣）。"}, {"ref": "洗辦3", "q": "客戶匯款到國外，金額為新臺幣3萬元，依辦法，銀行應如何處理？", "opts": ["不需要確認客戶身分", "應確認客戶身分（辦理新臺幣3萬元以上的跨境匯款）", "由客戶自己決定要不要提供", "只有超過50萬才要確認"], "ans": 1, "why": "辦法第3條第2款：辦理新臺幣3萬元（含等值外幣）以上的跨境匯款，屬於臨時性交易，要確認客戶身分。"}, {"ref": "洗13", "q": "理專發現客戶的交易疑似洗錢，並向調查局完成申報。申報後客戶問：『我是不是被通報了？』理專應如何回答？", "opts": ["如實告知", "不能洩漏申報內容或消息（洩漏者可能被處2年以下有期徒刑、拘役或50萬元以下罰金）", "只要不說細節就可以", "要先徵得主管同意再告訴客戶"], "ans": 1, "why": "洗錢防制法第24條第2項：金融機構人員洩漏或交付關於申報疑似洗錢交易的消息，處2年以下有期徒刑、拘役或50萬元以下罰金。"}, {"ref": "洗13", "q": "疑似洗錢交易的申報，有沒有最低金額的限制？", "opts": ["有，50萬元以上才要", "有，100萬元以上才要", "沒有金額限制，交易未完成也要申報", "只有現金交易才要申報"], "ans": 2, "why": "洗錢防制法第13條：對疑似洗錢交易應申報，交易未完成者亦同；辦法第15條也寫『不論交易金額多寡』。"}, {"ref": "洗辦13", "q": "某銀行櫃台收到客戶現金存款80萬元，依辦法，下列何者正確？", "opts": ["確認客戶身分並留存紀錄，於交易完成後5個營業日內向調查局申報", "不需要申報", "只要主管知道就好", "3個月內申報即可"], "ans": 0, "why": "辦法第13條：達50萬元以上的通貨交易，要確認客戶身分並留存紀錄，並於交易完成後5個營業日內向調查局申報。"}, {"ref": "洗辦3", "q": "一位法人客戶，某自然人直接持有該公司28%的股份，依辦法應如何判斷？", "opts": ["該自然人是實質受益人，要辨識及驗證", "不需要辨識", "只有持股超過50%才要", "只需辨識董事長"], "ans": 0, "why": "辦法第3條第7款：具控制權指直接或間接持有法人股份或資本超過25%；28%超過25%，要辨識並採取合理措施驗證。"}, {"ref": "洗辦4", "q": "客戶堅持只提供身分證影本，也拒絕提供其他佐證資料。依辦法第4條，金融機構應怎麼辦？", "opts": ["勉強受理", "婉拒建立業務關係或交易（無例外規定時）", "由業務員代簽", "收取手續費後受理"], "ans": 1, "why": "辦法第4條：出示的身分證明文件均為影本（有法定例外）、客戶拒絕提供審核文件、提供文件可疑等，應婉拒建立業務關係或交易。"}, {"ref": "洗20", "q": "業務員教客戶把50萬元以上的現金拆成多筆小額存入，目的是避開申報。這樣的行為，最可能涉及？", "opts": ["沒有法律問題", "可能涉及洗錢防制法第20條『規避洗錢防制程序』的特殊洗錢罪（無合理來源時）", "只是違反公司內規", "只會被罰款1,000元"], "ans": 1, "why": "第20條第1項第3款：規避第8條、第10至13條所定洗錢防制程序，而收受、持有或使用的財物無合理來源，處6個月以上5年以下有期徒刑，得併科5,000萬元以下罰金。"}, {"ref": "洗22", "q": "某人為了賺取報酬，把自己的3個銀行帳戶交給陌生人使用。依洗錢防制法第22條，下列何者正確？", "opts": ["只被警察告誡，沒有刑責", "可能被處3年以下有期徒刑、拘役或科或併科100萬元以下罰金", "沒有任何責任", "只需把帳戶關閉"], "ans": 1, "why": "第22條第3項：期約或收受對價，或交付帳戶合計3個以上，處3年以下有期徒刑、拘役或科或併科100萬元以下罰金。"}, {"ref": "洗8", "q": "依洗錢防制法第8條，確認客戶身分取得的資料，在業務關係終止後，至少要保存多久？", "opts": ["1年", "3年", "5年", "10年"], "ans": 2, "why": "第8條第2項：確認客戶身分程序所得資料，應自業務關係終止時起至少保存5年。"}], "chNo": "05", "summary": "金融從業人員在洗錢防制中的三件事：確認客戶身分（含實質受益人）、保存紀錄、申報（50萬元以上現金交易、疑似洗錢交易），以及絕對不能洩漏申報、不能協助規避、不能教人交付帳戶。包括洗錢防制法與金融機構防制洗錢辦法。", "scope": "收錄洗錢防制法第2、5、7、8、10、12、13、19、20、22、23、24條；金融機構防制洗錢辦法第2、3、4、12、13、15條。", "nav": {"prev": {"file": "ch04.html", "label": "第4章 客戶資料保密與個人資料保護"}, "next": {"file": "ch06.html", "label": "第6章 證券、期貨與基金從業人員：內線交易、操縱、誠信與投資人保護"}}}</script>
<script>const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>{t=String(t||'');const ss=t.split(/(?<=。)/).map(x=>x.trim()).filter(Boolean);if(t.length<=90||ss.length<2&&t.indexOf('；')<0)return '<p>'+esc(t)+'</p>';
  const li=s=>{s=s.replace(/。$/,'');const m=s.match(/^([^：；]{1,40})：(.+)$/);if(m&&m[2].split('；').length>=3)return '<li><b>'+esc(m[1])+'</b><ul>'+m[2].split('；').map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></li>';
    const parts=s.split('；');if(parts.length>=3)return '<li>'+parts.map(x=>esc(x)).join('<br>')+'</li>';return '<li>'+esc(s)+'</li>'};
  return '<ul class="pl">'+ss.map(li).join('')+'</ul>'};
const factsT=f=>f?'<div class="tw"><table class="ft"><thead><tr>'+f.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+f.rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'';
const LAWMAP={"金保": "金融消費者保護法", "適": "適合度辦法", "說": "說明揭露辦法", "廣": "廣告辦法", "個": "個資法", "洗": "洗錢防制法", "洗辦": "金融機構防制洗錢辦法", "保": "保險法", "規": "業務員管理規則", "招": "招攬核保理賠辦法", "證": "證券交易法", "證商": "證券商負責人與業務人員管理規則", "期商": "期貨商負責人及業務員管理規則", "投顧": "投信投顧法", "投保": "投保法", "信": "信託法", "信業": "信託業法", "銀": "銀行法", "刑": "刑法", "貪": "貪污治罪條例", "獎": "檢舉貪污獎勵辦法"};
const lab=x=>{const m=String(x).match(/^([^0-9]+)([0-9]+(?:-[0-9]+)?)$/);return m&&LAWMAP[m[1]]?LAWMAP[m[1]]+'第'+m[2]+'條':x};
const mem={};
const store={get(k){try{const v=localStorage.getItem(k);return v===null?mem[k]:v}catch(e){return mem[k]}},set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const BOXKEY='twlife_ethics_boxes_v1';
let boxes={};try{boxes=JSON.parse(store.get(BOXKEY)||'{}')}catch(e){boxes={}}
const saveBoxes=()=>store.set(BOXKEY,JSON.stringify(boxes));
function Flash(root,getCards){
  let queue=[],cur=null,flipped=false;
  function build(){const cs=getCards();queue=shuffle(cs.filter(c=>(boxes[c.key]||0)<1)).sort((a,b)=>(boxes[a.key]||0)-(boxes[b.key]||0));flipped=false}
  function render(){
    const cs=getCards(),n=cs.length,done=cs.filter(c=>(boxes[c.key]||0)>=1).length;
    let h='<div class="stat">已熟練 '+done+' / '+n+' 張（答對 1 次視為熟練，進度存在這個瀏覽器）</div><div class="bar"><i style="width:'+(n?done/n*100:0)+'%"></i></div>';
    if(!n){root.innerHTML=h+'<div class="card"><p>沒有可用的閃卡。</p></div>';return}
    if(!queue.length){root.innerHTML=h+'<div class="card"><h3>全部熟練了</h3><p>可以去做情境題，或重設後再來一輪。</p></div><div class="row"><button class="btn" data-a="reset">重設進度</button></div>';return}
    cur=queue[0];
    h+='<div class="card fc" tabindex="0" role="button" data-a="flip"><small>'+(cur.tag?esc(cur.tag)+'｜':'')+esc(lab(cur.ref))+'｜剩 '+queue.length+' 張</small><div class="q">'+esc(cur.front)+'</div>'+(flipped?'<div class="a"><span class="lab fact">答案</span>'+esc(cur.back)+'</div>':'<small>點一下翻面</small>')+'</div>';
    if(flipped)h+='<div class="row"><button class="btn bad" data-a="no">還不熟</button><button class="btn ok" data-a="yes">會了</button></div>';
    h+='<div class="row"><button class="btn" data-a="reset">重設進度</button></div>';
    root.innerHTML=h;
  }
  root.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
    if(a==='flip'){flipped=!flipped;render()}
    else if(a==='reset'){if(confirm('確定要清除這些閃卡的進度？')){getCards().forEach(c=>delete boxes[c.key]);saveBoxes();build();render()}}
    else if(cur&&(a==='yes'||a==='no')){const ok=a==='yes';boxes[cur.key]=ok?Math.min(1,(boxes[cur.key]||0)+1):0;saveBoxes();queue.shift();if(!ok||boxes[cur.key]<1)queue.splice(queue.length?Math.max(1,Math.min(queue.length,ok?6:3)):0,0,cur);flipped=false;render()}});
  root.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.fc')){e.preventDefault();flipped=!flipped;render()}});
  return {refresh(){build();render()}};
}
function Quiz(root,getItems,perRound){
  let items=[],score=0,answered=0,done=false;
  function draw(){
    const perms=items.map(s=>shuffle(s.opts.map((_,k)=>k)));
    root.innerHTML='<div class="stat" id="sc"></div>'+items.map((s,i)=>'<div class="card" data-i="'+i+'"><b>'+(i+1)+'. </b><span class="lab my">'+(s.tag?esc(s.tag)+' ':'')+esc(lab(s.ref))+'</span>'+esc(s.q)+perms[i].map((k,pos)=>'<button class="opt" data-o="'+k+'">'+String.fromCharCode(65+pos)+'. '+esc(s.opts[k])+'</button>').join('')+'<div class="why"></div></div>').join('')+'<div id="qend"></div>';
    score=0;answered=0;upd();
  }
  function upd(){const el=$('#sc',root);if(el)el.textContent='已作答 '+answered+' / '+items.length+'，答對 '+score+' 題';
    if(perRound&&answered===items.length&&items.length){$('#qend',root).innerHTML='<div class="card"><h3>這一組：'+score+' / '+items.length+'</h3></div><div class="row"><button class="btn pri" data-a="again">再來一組</button></div>'}}
  function again(){const all=getItems();items=perRound?shuffle(all).slice(0,perRound):all;draw()}
  root.addEventListener('click',e=>{
    const ag=e.target.closest('[data-a="again"]');if(ag){again();window.scrollTo(0,root.offsetTop-60);return}
    const b=e.target.closest('.opt');if(!b)return;const box=b.closest('.card');if(box.dataset.done)return;
    const s=items[+box.dataset.i],j=+b.dataset.o;box.dataset.done=1;answered++;if(j===s.ans)score++;
    let right='';$$('.opt',box).forEach((x,pos)=>{const k=+x.dataset.o;if(k===s.ans){x.classList.add('right');right=String.fromCharCode(65+pos)}else if(k===j)x.classList.add('wrong')});
    const w=$('.why',box);w.style.display='block';w.innerHTML=(j===s.ans?'答對了。':'答錯了，正解是 '+right+'。')+esc(s.why);upd()});
  return {refresh:again};
}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const LAWS=D.laws;
$('#h1').textContent=D.chapter+'｜'+D.title;
$('#intro').textContent=D.summary||'';
document.title=D.chapter+' '+D.title;
$('#foot').innerHTML='官方來源：'+LAWS.map(L=>esc(L.name)+'（'+esc(L.amended)+(L.kind==='press'?'發布':'修正')+'）'+(L.note?'｜'+esc(L.note)+'｜':'')+'<a href="'+esc(L.url)+'" target="_blank" rel="noopener">'+esc(L.url)+'</a>').join('<br>')+(D.scope?'<br>'+esc(D.scope):'')+'<br>條文原文取自法務部全國法規資料庫的公開資料鏡像（更新日 2026-10-16），尚未逐條與官網現行頁面比對；「白話」「口訣」「情境題」為編寫者整理，不是法條。法規可能再修正，請以官方最新公告為準；本內容不是法律意見。';
const TABS=[['read','條文速讀'],['table','對照表'],['cards','閃卡'],['quiz','情境題']];
const nav=$('#nav');
TABS.forEach(([id,name])=>{const b=document.createElement('button');b.textContent=name;b.setAttribute('role','tab');b.dataset.id=id;b.onclick=()=>show(id);nav.appendChild(b)});
let curTab='read';
function show(id,anchor){curTab=id;TABS.forEach(([t])=>$('#s-'+t).classList.toggle('on',t===id));$$('button',nav).forEach(b=>b.setAttribute('aria-selected',b.dataset.id===id));
  history.replaceState(null,'','#'+id+(anchor?'/'+anchor:''));
  if(anchor){const el=document.getElementById(anchor);if(el){const d=el.querySelector('details');el.scrollIntoView({block:'start'});el.classList.add('hl')}}else window.scrollTo(0,0)}
$('#s-read').innerHTML=(D.alerts||[]).map(a=>'<div class="banner"><b>'+esc(a.t)+'</b>'+esc(a.d)+'</div>').join('')+D.clauses.map(c=>{
  const off=c.official.map(p=>'<p>'+esc(p)+'</p>').join('');
  return '<div class="card" id="c'+esc(c.no)+'"><h3><span class="no">'+esc(lab(c.no))+'</span>'+esc(c.title)+'</h3>'
   +'<div class="pw"><span class="lab my">白話</span>'+fmt(c.plain)+'</div>'+factsT(c.facts)
   +(c.mnemonic?'<div class="mn"><span class="lab my">口訣</span>'+esc(c.mnemonic)+'</div>':'')
   +(c.tip?'<p><span class="lab hint">提醒</span>'+esc(c.tip)+'</p>':'')
   +(c.official.length?'<details><summary>展開官方條文原文</summary><div class="off"><span class="lab fact">原文</span>'+off+'</div></details>':'')+'</div>'}).join('');
$('#s-table').innerHTML=D.tables.map((t,i)=>'<h3 id="t'+i+'">'+esc(t.title)+'</h3><div class="tw"><table><thead><tr>'+t.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+t.rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>').join('');
const cardsAll=D.cards.map(c=>({key:'ch'+D.chNo+':'+c.id,ref:c.ref,front:c.front,back:c.back}));
const fl=Flash($('#s-cards'),()=>cardsAll);fl.refresh();
const qz=Quiz($('#s-quiz'),()=>D.scenarios,0);qz.refresh();
// 上下章
const N=D.nav||{};
function setLink(el,o,dir){if(o){el.href=o.file;el.textContent=dir==='p'?'← '+o.label:o.label+' →'}else{el.style.visibility='hidden'}}
setLink($('#prev'),N.prev,'p');setLink($('#next'),N.next,'n');
// 左右滑動：換分頁，到頭就換章
function step(d){const i=TABS.findIndex(t=>t[0]===curTab)+d;
  if(i<0){if(N.prev)location.href=N.prev.file+'#read';return}
  if(i>=TABS.length){if(N.next)location.href=N.next.file+'#read';return}
  show(TABS[i][0])}
let sx=0,sy=0,skip=false;
document.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;const el=e.target&&e.target.nodeType===1?e.target:(e.target&&e.target.parentElement);skip=!!(el&&el.closest('.tw,nav,input,.off,#cap'))},{passive:true});
document.addEventListener('touchend',e=>{if(skip)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>70&&Math.abs(dy)<45){step(dx<0?1:-1)}},{passive:true});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1)});
// 深層連結
function route(){const h=(location.hash||'#read').slice(1).split('/');show(TABS.some(t=>t[0]===h[0])?h[0]:'read',h[1]?decodeURIComponent(h[1]):null)}
window.addEventListener('hashchange',route);route();
</script>
<script>// 語音：導覽列多一顆「🎧 語音」鈕，按下就從頭播放；畫面上方只留最後兩行字幕（固定高度，不會推動下面的頁面）。
// 再按一次＝暫停／繼續；點字幕也一樣；字幕右側的 ✕ 關閉。播完一段自動接下一段。
// 資料來自 mp3/timing/chNN.js（window.AUDIO_TIMING），由 make_timing.py 產生；沒有這個檔就不會出現「語音」鈕。
(function(){
const T=window.AUDIO_TIMING;
if(!T||!T.segments||!T.segments.length)return;
const BASE='mp3',segs=T.segments,au=document.getElementById('au');
const cap=document.getElementById('cap'),rowA=document.getElementById('cap-a'),rowB=document.getElementById('cap-b'),top=document.getElementById('top');
const SP={F:'主持人',M:'專家'},PUNC='，、：；。！？';
let si=-1,lines=[],li=-2,started=false,raf=0,endTimer=0;

// ---- 按鈕 ----
const btn=document.createElement('button');
btn.id='au-btn';btn.type='button';btn.textContent='🎧 語音';btn.setAttribute('aria-pressed','false');btn.title='按下開始聽這一章的語音重點';
nav.appendChild(btn);
function label(){btn.textContent=!started?'🎧 語音':(au.paused?'▶ 語音':'⏸ 語音');btn.setAttribute('aria-pressed',started?'true':'false')}

// ---- 字幕斷行：依目前寬度，把每句切成一行一行 ----
const fontPx=()=>parseFloat(getComputedStyle(rowB).fontSize)||17;
const cw=(s,f)=>{let w=0;for(const c of s)w+=c.charCodeAt(0)<128?f*0.56:f;return w};
function wrap(text,lim0,lim,f){
  const parts=text.match(new RegExp('[^'+PUNC+']+['+PUNC+']*|['+PUNC+']+','g'))||[text];
  const out=[];let cur='',w=0,lim_=lim0;
  const push=()=>{if(cur){out.push(cur);cur='';w=0;lim_=lim}};
  for(const p of parts){
    const pw=cw(p,f);
    if(w+pw<=lim_){cur+=p;w+=pw;continue}
    push();
    if(pw<=lim_){cur=p;w=pw;continue}
    for(const c of p){const x=cw(c,f);if(w+x>lim_)push();cur+=c;w+=x}
  }
  push();return out;
}
function buildLines(){
  lines=[];if(si<0)return;
  const s=segs[si],f=fontPx(),avail=Math.max(120,(rowB.clientWidth||cap.clientWidth||300)-2);let prevSpk=null;
  s.cues.forEach((c,k)=>{
    const t0=c.t,t1=k+1<s.cues.length?s.cues[k+1].t:s.dur;
    const span=Math.max(0.4,t1-t0-0.7);                       // 句尾約有 0.7 秒停頓，不分給字
    const badge=c.spk!==prevSpk;prevSpk=c.spk;
    const bw=badge?SP[c.spk].length*12+18:0;                   // 說話者小標籤的寬度（12px 字＋留白）
    const ls=wrap(c.text,avail-bw,avail,f),ws=ls.map(x=>Math.max(1,cw(x,f))),tot=ws.reduce((a,b)=>a+b,0);
    let acc=0;ls.forEach((x,j)=>{lines.push({t:t0+span*acc/tot,spk:c.spk,badge:badge&&j===0,text:x});acc+=ws[j]});
  });
}
const esc2=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const rowHTML=l=>l?(l.badge?'<span class="sp '+l.spk+'">'+SP[l.spk]+'</span>':'')+esc2(l.text):'';
function paint(){
  const t=au.currentTime;let j=-1;
  for(let k=0;k<lines.length;k++){if(lines[k].t<=t+0.05)j=k;else break}
  if(j===li)return;li=j;
  rowA.innerHTML=rowHTML(lines[j-1]);rowB.innerHTML=rowHTML(lines[j]);
}
function tick(){paint();raf=au.paused?0:requestAnimationFrame(tick)}

// ---- 播放 ----
const nice=t=>String(t).replace(/_/g,' ');
function meta(){if('mediaSession' in navigator&&window.MediaMetadata&&si>=0)navigator.mediaSession.metadata=new MediaMetadata({title:nice(segs[si].title),artist:D.chapter+' '+D.title,album:'考試複習語音'})}
function pad(){document.documentElement.style.scrollPaddingTop=cap.hidden?'':(top.offsetHeight+8)+'px'}
function setSrc(i){if(si===i)return;si=i;li=-2;rowA.innerHTML=rowB.innerHTML='';au.src=encodeURI(BASE+'/'+segs[i].file);au.load();au.playbackRate=1;buildLines();meta()}
function playSeg(i){
  setSrc(i);
  const go=()=>{buildLines();au.play().catch(()=>{})};
  if(au.readyState>=1)go();else au.addEventListener('loadedmetadata',go,{once:true});
}
function start(){clearTimeout(endTimer);started=true;cap.hidden=false;pad();si=-1;playSeg(0)}
function stop(){clearTimeout(endTimer);au.pause();started=false;si=-1;lines=[];li=-2;cap.hidden=true;rowA.innerHTML=rowB.innerHTML='';pad();label()}
function toggle(){if(!started)start();else if(au.paused)au.play().catch(()=>{});else au.pause()}
btn.onclick=toggle;
cap.addEventListener('click',e=>{if(e.target.closest('#cap-x'))stop();else toggle()});
au.addEventListener('play',()=>{label();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)});
au.addEventListener('pause',label);
au.addEventListener('seeked',paint);
au.addEventListener('ended',()=>{
  if(si<segs.length-1)playSeg(si+1);
  else{started=false;label();endTimer=setTimeout(()=>{if(!started)stop()},2500)}   // 全部播完，字幕停 2.5 秒後自動收起
});
au.addEventListener('error',()=>{rowA.textContent='';rowB.textContent='找不到音檔（'+BASE+'/'+(segs[si]?segs[si].file:'')+'）'});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(si>=0){buildLines();li=-2;paint();pad()}},150)});
if('mediaSession' in navigator){[['play',()=>au.play()],['pause',()=>au.pause()],['previoustrack',()=>started&&playSeg(Math.max(0,si-1))],['nexttrack',()=>started&&si<segs.length-1&&playSeg(si+1)]].forEach(([a,f])=>{try{navigator.mediaSession.setActionHandler(a,f)}catch(e){}})}
})();
</script></body></html>
