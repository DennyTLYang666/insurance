"read/c規19"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "clause", "title": "管理規則第19-1條 不服處分的救濟：申復與覆核", "text": "不服處分的救濟：申復與覆核 業務員不服受停止招攬登錄、撤銷登錄處分，可以在處分通知到達之日起1個月內，用書面具明理由向原處分公司申復，以一次為限；原處分公司要在申復書面資料到達後1個月內，把復查結果用書面通知。對復查結果有異議的，可以在收到結果之日起3個月內，向各有關公會的申訴委員會申請覆核，也以一次為限。申訴委員會的成員要包含業務員代表。 申復一個月，覆核三個月。  業務員不服受停止招攬登錄、撤銷登錄處分者，得於受處分之通知到達之日起一個月內，以書面具明理由向原處分公司提出申復，並以一次為限，原處分公司並應於申復書面資料到達一個月內將復查結果以書面通知業務員。 業務員對前項復查結果有異議者，得於收到復查結果之日起三個月內以書面具明理由向各有關公會之申訴委員會申請覆核，並以一次為限。 前項申訴委員會之組織，其成員應包含業務員代表，並由各有關公會訂定後報主管機關備查。 申復（一次為限） 原處分公司 處分通知到達之日起1個月內；公司在申復資料到達後1個月內書面回覆 覆核（一次為限） 各有關公會的申訴委員會 收到復查結果之日起3個月內", "anchor": "read/c規19-1"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "table", "title": "數字速記：業務員管理規則", "text": "數字速記：業務員管理規則 條 數字 什麼事 9 5年 登錄證有效期間 10 5日內 業務員有異動，所屬公司應在異動後5日內向公會申報（第10條，本頁未收錄原文） 7 5年、3年 組織犯罪防制條例之罪：尚未逾5年；偽造文書等、違反金融管理法律、債信了結後：尚未逾3年 12 每年 教育訓練 13 1年內 成績不合格，一年內補訓仍不合格，撤銷登錄 19 1年以下 停止招攬行為 19 5年內累計2年 所屬公司應撤銷業務員登錄 19-1 1個月、3個月 申復、覆核", "anchor": "table/t0"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "table", "title": "停止招攬 vs 撤銷登錄：什麼情形會被哪種處分", "text": "停止招攬 vs 撤銷登錄：什麼情形會被哪種處分 處分 條 情形 停止招攬（一年以下） 19 17種不得為的行為 撤銷登錄 19 III 最近5年內受停止招攬處分期間累計達2年 撤銷登錄 13 不參加教育訓練；成績不合格且一年內補訓仍不合格 撤銷登錄 11-1 參加資格測驗或特別測驗時發生重大違規、舞弊（本頁未收錄原文） 不予登錄／註銷 7 限制行為能力、虛偽文件、特定犯罪、破產、債信等11種情形", "anchor": "table/t1"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "card", "title": "沒登錄、沒領登錄證，能不能替所屬公司招攬保險？", "text": "沒登錄、沒領登錄證，能不能替所屬公司招攬保險？ 不能。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "card", "title": "取得業務員資格的學歷條件？", "text": "取得業務員資格的學歷條件？ 成年，高中（職）以上學校畢業或同等學歷，並符合測驗合格等條件之一。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "card", "title": "招攬保險時業務員要先做什麼？", "text": "招攬保險時業務員要先做什麼？ 出示登錄證並告知授權範圍（主管機關另有規定者除外）。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "card", "title": "登錄證有效期間？", "text": "登錄證有效期間？ 5年，期滿前要辦換發，未辦妥前不得招攬。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "card", "title": "業務員不參加教育訓練，會怎樣？", "text": "業務員不參加教育訓練，會怎樣？ 所屬公司要撤銷其業務員登錄。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "card", "title": "人身保險業務員可不可以另外登錄另一家人身保險公司？", "text": "人身保險業務員可不可以另外登錄另一家人身保險公司？ 不可以。可另外登錄的只限『非經營同類保險業務』的公司，且以一家為限。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "card", "title": "招攬人身保險商品，要親晤誰？", "text": "招攬人身保險商品，要親晤誰？ 要保人及被保險人（主管機關另有規定者除外）。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "card", "title": "業務員在要保書上要做什麼？", "text": "業務員在要保書上要做什麼？ 親自簽名並記載登錄字號。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "card", "title": "文宣、建議書的內容要符合什麼？", "text": "文宣、建議書的內容要符合什麼？ 與保險業報主管機關審查通過的保單條款、費率、要保書相符，且經所屬公司核可，並符合資訊揭露規範。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "card", "title": "第19條的處分是什麼？", "text": "第19條的處分是什麼？ 依情節輕重，一年以下停止招攬行為；有犯罪嫌疑的要移送偵辦。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "card", "title": "最近5年內停止招攬期間累計達多久，要撤銷登錄？", "text": "最近5年內停止招攬期間累計達多久，要撤銷登錄？ 累計達2年，所屬公司應撤銷其業務員登錄。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "card", "title": "『代要保人簽章』屬於第19條哪類行為？", "text": "『代要保人簽章』屬於第19條哪類行為？ 第7款：代要保人或被保險人簽章，或未經同意或授權填寫有關保險契約文件。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "card", "title": "業務員不服處分，申復和覆核的期限？", "text": "業務員不服處分，申復和覆核的期限？ 申復：處分通知到達日起1個月內；覆核：收到復查結果日起3個月內。各以一次為限。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "card", "title": "第7條中，哪一款的犯罪期限是『5年』？", "text": "第7條中，哪一款的犯罪期限是『5年』？ 第3款：組織犯罪防制條例之罪。其他犯罪與債信都是3年。", "anchor": "cards"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "scen", "title": "業務員為了加快作業，代客戶在要保書上簽名。依管理規則第19條，這屬於？", "text": "業務員為了加快作業，代客戶在要保書上簽名。依管理規則第19條，這屬於？ 不構成違規 停止招攬行為處分的情形（第7款） 只需口頭警告 應註銷登錄，但不需處分 第19條第7款：代要保人或被保險人簽章，或未經其同意或授權填寫有關保險契約文件，屬於應處一年以下停止招攬行為的情形。", "anchor": "quiz"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "scen", "title": "業務員最近5年內，受停止招攬行為處分的期間累計達2年。所屬公司應？", "text": "業務員最近5年內，受停止招攬行為處分的期間累計達2年。所屬公司應？ 給予口頭勸導 撤銷其業務員登錄 再停止招攬一年 不得處分 第19條第3項：最近5年內受停止招攬行為處分期間累計達2年者，所屬公司應予撤銷其業務員登錄處分。", "anchor": "quiz"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "scen", "title": "招攬涉及人身保險的商品，業務員原則上要怎麼做？", "text": "招攬涉及人身保險的商品，業務員原則上要怎麼做？ 只要電話確認即可 親晤要保人及被保險人 只要親晤要保人 委託其他業務員代為面談 第15條第4項：業務員招攬涉及人身保險的商品，應親晤要保人及被保險人，主管機關另有規定者不在此限。", "anchor": "quiz"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "scen", "title": "甲是人身保險公司的業務員，想再登錄另一家人身保險公司。依第14條？", "text": "甲是人身保險公司的業務員，想再登錄另一家人身保險公司。依第14條？ 可以，不限家數 可以，但以一家為限 不可以，因為是同類保險業務 須經要保人同意 第14條第2項：只能登錄於另一家『非經營同類保險業務』的公司，以一家為限。同為人身保險是同類（第2條第5款），所以不行。", "anchor": "quiz"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "scen", "title": "業務員教育訓練成績不合格，一年內再補訓成績仍不合格。依第13條？", "text": "業務員教育訓練成績不合格，一年內再補訓成績仍不合格。依第13條？ 繼續登錄 所屬公司應撤銷其業務員登錄 停止招攬一年 罰款 第13條第2項：參加教育訓練成績不合格，於一年內再行補訓成績仍不合格者，也撤銷登錄。", "anchor": "quiz"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "scen", "title": "業務員登錄證的有效期間是？", "text": "業務員登錄證的有效期間是？ 1年 3年 5年 10年 第9條：業務員登錄證有效期間為5年，應於期滿前辦妥換發。", "anchor": "quiz"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "scen", "title": "業務員不服撤銷登錄處分，第一步應在處分通知到達之日起多久內，向誰申復？", "text": "業務員不服撤銷登錄處分，第一步應在處分通知到達之日起多久內，向誰申復？ 1個月內，向原處分公司 3個月內，向公會 1個月內，向主管機關 6個月內，向法院 第19-1條第1項：處分通知到達之日起1個月內，以書面具明理由向原處分公司申復，以一次為限。對結果有異議再於3個月內向公會申訴委員會申請覆核。", "anchor": "quiz"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "scen", "title": "業務員曾犯組織犯罪防制條例之罪，有罪判決確定，執行完畢後尚未逾幾年，不得登錄？", "text": "業務員曾犯組織犯罪防制條例之罪，有罪判決確定，執行完畢後尚未逾幾年，不得登錄？ 1年 3年 5年 10年 第7條第3款：組織犯罪防制條例之罪，執行完畢、緩刑期滿或赦免後尚未逾5年。偽造文書、侵占、詐欺、背信罪（第4款）才是3年。", "anchor": "quiz"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "clause", "title": "第3條 金融服務業的範圍", "text": "金融服務業的範圍 金融服務業包括銀行業、證券業、期貨業、保險業、電子支付業，以及主管機關公告的其他金融服務業。 銀、證、期、保、電支。  本法所定金融服務業，包括銀行業、證券業、期貨業、保險業、電子支付業及其他經主管機關公告之金融服務業。 前項銀行業、證券業、期貨業及保險業之範圍，依金融監督管理委員會組織法第二條第三項規定。但不包括證券交易所、證券櫃檯買賣中心、證券集中保管事業、期貨交易所及其他經主管機關公告之事業。 第一項所稱電子支付業，指電子支付機構管理條例第三條第一款之電子支付機構。", "anchor": "read/c3"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "clause", "title": "第4條 誰是金融消費者；『專業投資人』除外", "text": "誰是金融消費者；『專業投資人』除外 金融消費者是接受金融服務業提供金融商品或服務的人，但不包括專業投資機構，以及符合一定財力或專業能力的自然人或法人。金融服務業如果協助未達條件的人創造符合形式上的外觀，那個人仍是金融消費者。 原則上都是金融消費者；專業投資機構與符合財力專業條件者除外；包裝外觀不算數。 『協助創造外觀』的處罰很重：第30-1條第2項，處1,000萬元以上5,000萬元以下罰鍰。 本法所稱金融消費者，指接受金融服務業提供金融商品或服務者。但不包括下列對象： 一、專業投資機構。 二、符合一定財力或專業能力之自然人或法人。 前項專業投資機構之範圍及一定財力或專業能力之條件，由主管機關定之。 金融服務業對自然人或法人未符合前項所定之條件，而協助其創造符合形式上之外觀條件者，該自然人或法人仍為本法所稱金融消費者。", "anchor": "read/c4"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "clause", "title": "第5條 金融消費爭議", "text": "金融消費爭議 金融消費爭議是金融消費者與金融服務業之間，因金融商品或服務所生的民事爭議。   本法所稱金融消費爭議，指金融消費者與金融服務業間因商品或服務所生之民事爭議。", "anchor": "read/c5"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "clause", "title": "第7條 公平合理、誠信，契約疑義作有利於消費者的解釋", "text": "公平合理、誠信，契約疑義作有利於消費者的解釋 金融服務業與消費者訂契約，要本於公平合理、平等互惠及誠信原則。契約條款顯失公平的，該部分無效；有疑義時，要作有利於金融消費者的解釋。金融服務業提供商品或服務，要盡善良管理人的注意義務；具有信託、委託性質的，還要負忠實義務。 公平誠信；顯失公平該部分無效；疑義有利消費者；善良管理人注意＋忠實義務。 對照保險法第54條、第54-1條，兩部法律的概念相同：疑義有利被保險人（消費者）、顯失公平該部分無效。 金融服務業與金融消費者訂立提供金融商品或服務之契約，應本公平合理、平等互惠及誠信原則。 金融服務業與金融消費者訂立之契約條款顯失公平者，該部分條款無效；契約條款如有疑義時，應為有利於金融消費者之解釋。 金融服務業提供金融商品或服務，應盡善良管理人之注意義務；其提供之金融商品或服務具有信託、委託等性質者，並應依所適用之法規規定或契約約定，負忠實義務。", "anchor": "read/c7"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "clause", "title": "第8條 廣告與招攬不得有虛偽、詐欺、隱匿", "text": "廣告與招攬不得有虛偽、詐欺、隱匿 金融服務業刊登廣告、進行業務招攬或營業促銷時，不得有虛偽、詐欺、隱匿或其他足以讓人誤信的情事，要確保廣告內容真實；對消費者所負的義務，不能低於廣告內容與招攬時所提示的資料或說明。另外，金融服務業不得藉金融教育宣導，引薦個別金融商品或服務。 廣告要真；承諾不低於廣告；教育宣導不能推銷個別商品。  金融服務業刊登、播放廣告及進行業務招攬或營業促銷活動時，不得有虛偽、詐欺、隱匿或其他足致他人誤信之情事，並應確保其廣告內容之真實，其對金融消費者所負擔之義務不得低於前述廣告之內容及進行業務招攬或營業促銷活動時對金融消費者所提示之資料或說明。 前項廣告、業務招攬及營業促銷活動之方式、內容及其他應遵行事項之辦法，由主管機關定之。 金融服務業不得藉金融教育宣導，引薦個別金融商品或服務。", "anchor": "read/c8"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "clause", "title": "第9條 適合度：訂約前要充分了解消費者", "text": "適合度：訂約前要充分了解消費者 金融服務業在與消費者訂立提供金融商品或服務的契約前，應充分了解消費者的相關資料，確保商品或服務對消費者的適合度。要了解哪些資料、適合度應考量什麼，由主管機關訂定辦法。 訂約前先了解客戶，確保適合度。 這是『了解客戶（KYC）』在金融消費者保護法的依據。 金融服務業與金融消費者訂立提供金融商品或服務之契約前，應充分瞭解金融消費者之相關資料，以確保該商品或服務對金融消費者之適合度。 前項應充分瞭解之金融消費者相關資料、適合度應考量之事項及其他應遵行事項之辦法，由主管機關定之。", "anchor": "read/c9"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "clause", "title": "第10條 說明義務與風險揭露；複雜性高風險商品要錄音或錄影", "text": "說明義務與風險揭露；複雜性高風險商品要錄音或錄影 訂約前，要向消費者充分說明金融商品、服務及契約的重要內容，並充分揭露風險。涉及個人資料的蒐集、處理與利用時，要說明個人資料保護的相關權利，以及拒絕同意可能的不利益。說明及揭露要用消費者能充分了解的文字或方式，內容至少包括交易成本、可能的收益及風險。複雜性高風險商品的說明與揭露，除了以非臨櫃的自動化通路交易，或消費者不同意外，要錄音或錄影。 充分說明重要內容＋充分揭露風險；成本、收益、風險都要講；複雜高風險商品錄音錄影。 哪些屬於『複雜性高風險商品』，由主管機關依第11-2條第2項規定訂定類型。 金融服務業與金融消費者訂立提供金融商品或服務之契約前，應向金融消費者充分說明該金融商品、服務及契約之重要內容，並充分揭露其風險。 前項涉及個人資料之蒐集、處理及利用者，應向金融消費者充分說明個人資料保護之相關權利，以及拒絕同意可能之不利益；金融服務業辦理授信業務，應同時審酌借款戶、資金用途、還款來源、債權保障及授信展望等授信原則，不得僅因金融消費者拒絕授權向經營金融機構間信用資料之服務事業查詢信用資料，作為不同意授信之唯一理由。 第一項金融服務業對金融消費者進行之說明及揭露，應以金融消費者能充分瞭解之文字或其他方式為之，其內容應包括但不限交易成本、可能之收益及風險等有關金融消費者權益之重要內容；其相關應遵循事項之辦法，由主管機關定之。 金融服務業提供之金融商品屬第十一條之二第二項所定之複雜性高風險商品者，前項之說明及揭露，除以非臨櫃之自動化通路交易或金融消費者不予同意之情形外，應錄音或錄影。", "anchor": "read/c10"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "clause", "title": "第11條 違反適合度或說明義務的損害賠償與舉證", "text": "違反適合度或說明義務的損害賠償與舉證 金融服務業違反第9條、第10條，使消費者受損害，要負損害賠償責任。但金融服務業如果能證明：損害不是因為未充分了解消費者的商品或服務適合度，也不是因為未說明、說明不實、錯誤或未充分揭露風險而發生，就不用負責。 違反適合度或說明義務要賠；證明責任在金融服務業。 『由金融服務業自己證明沒有違反』就是常說的舉證責任倒置。所以平常的紀錄、錄音、簽名文件很重要。 金融服務業違反前二條規定，致金融消費者受有損害者，應負損害賠償責任。但金融服務業能證明損害之發生非因其未充分瞭解金融消費者之商品或服務適合度或非因其未說明、說明不實、錯誤或未充分揭露風險之事項所致者，不在此限。", "anchor": "read/c11"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "clause", "title": "第11-1條 業務人員酬金制度要衡平考量客戶權益", "text": "業務人員酬金制度要衡平考量客戶權益 金融服務業要訂定業務人員的酬金制度，提報董（理）事會通過。酬金制度要衡平考量客戶權益、商品或服務對金融服務業及客戶可能產生的各種風險，不能只考量業績目標的達成。制度應遵行的原則，由所屬同業公會擬訂或經主管機關指定的公會團體擬訂，報主管機關核定。 酬金制度：董事會通過；不能只看業績。  金融服務業應訂定業務人員之酬金制度，並提報董（理）事會通過。 前項酬金制度應衡平考量客戶權益、金融商品或服務對金融服務業及客戶可能產生之各項風險，不得僅考量金融商品或服務之業績目標達成情形。 前項金融服務業業務人員酬金制度應遵行之原則，由所屬同業公會擬訂或經主管機關指定之公會團體擬訂，報請主管機關核定。", "anchor": "read/c11-1"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "clause", "title": "第11-2條 初次銷售複雜性高風險商品要經董事會通過", "text": "初次銷售複雜性高風險商品要經董事會通過 金融服務業初次銷售的複雜性高風險商品，要報經董（理）事會或常務董（理）事會通過。複雜性高風險商品的類型由主管機關訂定。複雜性高風險商品及前條酬金制度，在外國金融服務業在臺分支機構，要經其在臺負責人同意。 第一次賣複雜高風險商品：董事會通過。  金融服務業初次銷售之複雜性高風險商品應報經董（理）事會或常務董（理）事會通過。 前項所定複雜性高風險商品類型，由主管機關定之。 第一項複雜性高風險商品及前條第一項之酬金制度，於外國金融服務業在臺分支機構，應經其在臺負責人同意。", "anchor": "read/c11-2"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "clause", "title": "第11-3條 懲罰性賠償", "text": "懲罰性賠償 金融服務業因違反本法規定應負損害賠償責任，對於故意所致的損害，法院可因消費者的請求，依侵害情節，酌定損害額3倍以下的懲罰性賠償；對於過失所致的損害，可酌定損害額1倍以下的懲罰性賠償。這個請求權，自請求權人知有得受賠償的原因時起2年不行使而消滅；自賠償原因發生之日起逾5年者，亦同。 故意三倍、過失一倍；時效2年、5年。  金融服務業因違反本法規定應負損害賠償責任者，對於故意所致之損害，法院得因金融消費者之請求，依侵害情節，酌定損害額三倍以下之懲罰性賠償；對於過失所致之損害，得酌定損害額一倍以下之懲罰性賠償。 前項懲罰性賠償請求權，自請求權人知有得受賠償之原因時起二年間不行使而消滅；自賠償原因發生之日起逾五年者，亦同。 故意所致的損害 損害額3倍以下 過失所致的損害 損害額1倍以下 請求權時效 知有得受賠償原因時起2年；賠償原因發生日起逾5年亦消滅", "anchor": "read/c11-3"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "clause", "title": "第13條 爭議處理流程：先申訴，再申請評議", "text": "爭議處理流程：先申訴，再申請評議 消費者就金融消費爭議事件，要先向金融服務業提出申訴。金融服務業要在收到申訴之日起30日內為適當的處理，並把結果回覆。消費者不接受處理結果，或金融服務業逾30日不處理的，消費者可以在收受處理結果或期限屆滿之日起60日內，向爭議處理機構申請評議。 先申訴；公司三十日回覆；不滿意六十日內申請評議。  為公平合理、迅速有效處理金融消費爭議，以保護金融消費者權益，應依本法設立爭議處理機構。 金融消費者就金融消費爭議事件應先向金融服務業提出申訴，金融服務業應於收受申訴之日起三十日內為適當之處理，並將處理結果回覆提出申訴之金融消費者；金融消費者不接受處理結果者或金融服務業逾上述期限不為處理者，金融消費者得於收受處理結果或期限屆滿之日起六十日內，向爭議處理機構申請評議；金融消費者向爭議處理機構提出申訴者，爭議處理機構之金融消費者服務部門應將該申訴移交金融服務業處理。 爭議處理機構除處理金融消費爭議外，並應辦理對金融服務業及金融消費者之教育宣導，使金融服務業與金融消費者均能充分瞭解正確之金融消費觀念及金融消費關係之權利與義務，以有效預防金融消費爭議發生。 爭議處理機構辦理金融消費爭議處理及前項業務，得向金融服務業收取年費及爭議處理服務費。 前項年費及服務費之收取標準及有關規定由主管機關定之。 一、申訴 消費者先向金融服務業申訴 二、處理 金融服務業收受申訴之日起30日內處理並回覆 三、申請評議 不接受處理結果或逾期不處理，收受結果或期限屆滿之日起60日內，向爭議處理機構申請", "anchor": "read/c13"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "clause", "title": "第29條 評議成立與金融服務業的接受義務", "text": "評議成立與金融服務業的接受義務 當事人要在評議書所載期限內，用書面通知爭議處理機構接受或拒絕評議決定，評議經雙方都接受才成立。金融服務業如果事前書面同意，或在商品、服務契約等文件中表明願意適用本法的爭議處理程序，對於評議決定中每一筆金額在一定額度以下的給付，一定要接受。一定額度由爭議處理機構擬訂，報主管機關核定公告。 雙方接受才成立；金融服務業對一定額度以下的評議決定要接受。  當事人應於評議書所載期限內，以書面通知爭議處理機構，表明接受或拒絕評議決定之意思。評議經當事人雙方接受而成立。 金融服務業於事前以書面同意或於其商品、服務契約或其他文件中表明願意適用本法之爭議處理程序者，對於評議委員會所作其應向金融消費者給付每一筆金額或財產價值在一定額度以下之評議決定，應予接受；評議決定超過一定額度，而金融消費者表明願意縮減該金額或財產價值至一定額度者，亦同。 前項一定額度，由爭議處理機構擬訂，報請主管機關核定後公告之。", "anchor": "read/c29"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "clause", "title": "第30條 評議書經法院核可，與確定判決同效力", "text": "評議書經法院核可，與確定判決同效力 消費者可以在評議成立之日起90日的不變期間內，申請爭議處理機構把評議書送法院核可。評議書經法院核可後，與民事確定判決有同一效力，當事人不能再就該事件起訴，也不能再依本法申訴或申請評議。 評議成立後90日內送法院核可；核可後等同確定判決。  金融消費者得於評議成立之日起九十日之不變期間內，申請爭議處理機構將評議書送請法院核可。爭議處理機構應於受理前述申請之日起五日內，將評議書及卷證送請爭議處理機構事務所所在地之管轄地方法院核可。但爭議處理機構送請法院核可前，金融服務業已依評議成立之內容完全履行者，免送請核可。 除有第三項情形外，法院對於前項之評議書應予核可。法院核可後，應將經核可之評議書併同評議事件卷證發還爭議處理機構，並將經核可之評議書以正本送達當事人及其代理人。 法院因評議書內容牴觸法令、違背公共秩序或善良風俗或有其他不能強制執行之原因而未予核可者，法院應將其理由通知爭議處理機構及當事人。 評議書依第二項規定經法院核可者，與民事確定判決有同一之效力，當事人就該事件不得再行起訴或依本法申訴、申請評議。 評議書經法院核可後，依法有無效或得撤銷之原因者，當事人得向管轄地方法院提起宣告評議無效或撤銷評議之訴。 前項情形，準用民事訴訟法第五百條至第五百零二條及第五百零六條、強制執行法第十八條第二項規定。", "anchor": "read/c30"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "clause", "title": "第30-1條 違反招攬、適合度、說明義務、酬金制度的罰鍰", "text": "違反招攬、適合度、說明義務、酬金制度的罰鍰 金融服務業有下列情形之一，處新臺幣30萬元以上1,000萬元以下罰鍰：違反廣告、業務招攬、營業促銷的方式或內容規定；違反第9條未充分了解消費者資料及確保適合度；違反第10條未充分說明或揭露風險；違反第11-1條酬金制度規定。協助不符資格的人創造專業投資人外觀的，處1,000萬元以上5,000萬元以下罰鍰。情節重大的，主管機關可以在所得利益範圍內酌量加重。 三十萬到一千萬；包裝專業投資人，一千萬到五千萬。  金融服務業有下列情形之一者，處新臺幣三十萬元以上一千萬元以下罰鍰： 一、違反第八條第二項所定辦法中有關廣告、業務招攬、營業促銷活動方式或內容之規定。 二、違反第九條第一項規定未充分瞭解金融消費者相關資料及確保金融消費者之適合度，或同條第二項所定辦法中有關適合度應考量事項之規定。 三、違反第十條第一項規定，未向金融消費者充分說明金融商品、服務、契約之重要內容或充分揭露風險，或違反同條第三項所定辦法中有關說明、揭露應以金融消費者能充分瞭解之方式或內容之規定。 四、違反第十一條之一規定，未訂定或未依主管機關核定應遵行之原則訂定酬金制度或未確實執行。 金融服務業對自然人或法人未符合第四條第二項所定之條件，而協助其創造符合形式上之外觀條件者，處新臺幣一千萬元以上五千萬元以下罰鍰。 金融服務業有前二項情形之一，且情節重大者，主管機關得於其所得利益之範圍內酌量加重，不受前二項罰鍰最高額之限制。 違反廣告招攬規定、未確保適合度、未充分說明揭露風險、酬金制度未依規定 新臺幣30萬元以上1,000萬元以下 協助不符資格者創造專業投資人的形式外觀 新臺幣1,000萬元以上5,000萬元以下 情節重大 主管機關可在所得利益範圍內酌量加重，不受最高額限制", "anchor": "read/c30-1"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "table", "title": "第9條、第10條、第11條：三條一組", "text": "第9條、第10條、第11條：三條一組 條 義務 重點 9 適合度 訂約前充分了解消費者相關資料，確保商品或服務對其適合 10 說明與揭露 充分說明重要內容、充分揭露風險；成本、收益、風險都要講；複雜高風險商品錄音錄影 11 賠償與舉證 違反9、10條致損害要賠；除非自己證明損害與未了解適合度、未說明或未揭露風險無關", "anchor": "table/t0"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "table", "title": "數字速記：金融消費者保護法", "text": "數字速記：金融消費者保護法 條 數字 什麼事 13 30日 金融服務業處理申訴並回覆的期限 13 60日 不滿意處理結果或逾期，申請評議的期限 30 90日 評議成立後，申請送法院核可的不變期間 11-3 3倍／1倍 故意損害：3倍以下；過失損害：1倍以下 11-3 2年／5年 懲罰性賠償請求權時效 30-1 30萬～1,000萬 一般違規罰鍰 30-1 1,000萬～5,000萬 協助創造專業投資人外觀", "anchor": "table/t1"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "card", "title": "金融服務業包括哪些行業？", "text": "金融服務業包括哪些行業？ 銀行業、證券業、期貨業、保險業、電子支付業及主管機關公告的其他金融服務業。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "card", "title": "哪兩類人不算金融消費者？", "text": "哪兩類人不算金融消費者？ 專業投資機構，以及符合一定財力或專業能力的自然人或法人。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "card", "title": "金融服務業與消費者的契約條款有疑義時，怎麼解釋？", "text": "金融服務業與消費者的契約條款有疑義時，怎麼解釋？ 作有利於金融消費者的解釋。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "card", "title": "金融服務業可以藉金融教育宣導引薦個別金融商品嗎？", "text": "金融服務業可以藉金融教育宣導引薦個別金融商品嗎？ 不可以。第8條第3項。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "card", "title": "第9條『適合度』要求金融服務業在訂約前做什麼？", "text": "第9條『適合度』要求金融服務業在訂約前做什麼？ 充分了解消費者的相關資料，確保商品或服務對消費者的適合度。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "card", "title": "第10條的說明內容至少要包括什麼？", "text": "第10條的說明內容至少要包括什麼？ 交易成本、可能的收益及風險等有關消費者權益的重要內容。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "card", "title": "複雜性高風險商品的說明揭露，原則上要怎麼留存？", "text": "複雜性高風險商品的說明揭露，原則上要怎麼留存？ 錄音或錄影（非臨櫃的自動化通路交易、消費者不同意者除外）。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "card", "title": "違反第9、10條致消費者受損害，誰要證明什麼？", "text": "違反第9、10條致消費者受損害，誰要證明什麼？ 金融服務業要證明損害的發生非因其未了解適合度，或未說明、說明不實、未充分揭露風險。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "card", "title": "業務人員酬金制度不能只考量什麼？", "text": "業務人員酬金制度不能只考量什麼？ 業績目標達成情形；要衡平考量客戶權益與各項風險。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "card", "title": "懲罰性賠償：故意與過失的上限？", "text": "懲罰性賠償：故意與過失的上限？ 故意：損害額3倍以下；過失：1倍以下。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "card", "title": "金融服務業收到申訴後，幾日內要處理並回覆？", "text": "金融服務業收到申訴後，幾日內要處理並回覆？ 30日內。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "card", "title": "不接受處理結果，申請評議的期限？", "text": "不接受處理結果，申請評議的期限？ 收受處理結果或期限屆滿之日起60日內，向爭議處理機構申請。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "card", "title": "評議成立後多久內可申請送法院核可？", "text": "評議成立後多久內可申請送法院核可？ 90日的不變期間。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "card", "title": "一般違反廣告、適合度、說明義務的罰鍰範圍？", "text": "一般違反廣告、適合度、說明義務的罰鍰範圍？ 新臺幣30萬元以上1,000萬元以下。", "anchor": "cards"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "scen", "title": "保險公司在客戶投保前，沒有了解客戶的財務狀況與需求，就推薦高風險商品。主要違反金融消費者保護法哪一條？", "text": "保險公司在客戶投保前，沒有了解客戶的財務狀況與需求，就推薦高風險商品。主要違反金融消費者保護法哪一條？ 第9條（適合度） 第13條（申訴） 第29條（評議成立） 第30條（法院核可） 第9條：訂約前要充分了解消費者相關資料，確保商品對消費者的適合度。", "anchor": "quiz"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "scen", "title": "客戶主張保險公司未充分說明風險而受損失。依第11條，誰要證明損害與未說明無關？", "text": "客戶主張保險公司未充分說明風險而受損失。依第11條，誰要證明損害與未說明無關？ 客戶 金融服務業 法院 主管機關 第11條但書：金融服務業能證明損害的發生非因其未說明、說明不實、錯誤或未充分揭露風險者，才免責。舉證責任在金融服務業。", "anchor": "quiz"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "scen", "title": "客戶向保險公司申訴，公司逾30日都不處理。客戶下一步？", "text": "客戶向保險公司申訴，公司逾30日都不處理。客戶下一步？ 只能等待 自期限屆滿之日起60日內向爭議處理機構申請評議 直接申請法院核可 向業務員索賠 第13條第2項：金融服務業逾期不處理者，消費者可於期限屆滿之日起60日內向爭議處理機構申請評議。", "anchor": "quiz"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "scen", "title": "金融服務業因故意違反本法造成損害，法院可酌定懲罰性賠償最高為損害額的？", "text": "金融服務業因故意違反本法造成損害，法院可酌定懲罰性賠償最高為損害額的？ 1倍 2倍 3倍 5倍 第11-3條：故意：損害額3倍以下；過失：1倍以下。", "anchor": "quiz"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "scen", "title": "評議成立後，消費者要申請爭議處理機構把評議書送法院核可，期限是？", "text": "評議成立後，消費者要申請爭議處理機構把評議書送法院核可，期限是？ 30日 60日 90日 1年 第30條第1項：評議成立之日起90日的不變期間。", "anchor": "quiz"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "scen", "title": "依第10條，下列哪一項不是說明內容必須包括的？", "text": "依第10條，下列哪一項不是說明內容必須包括的？ 交易成本 可能的收益 風險 業務員的酬金金額 第10條第3項：說明及揭露內容包括交易成本、可能收益及風險等有關消費者權益的重要內容。酬金制度是第11-1條，由金融服務業內部制定，不是向消費者說明的必備項目。", "anchor": "quiz"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "scen", "title": "金融服務業協助未符合資格的客戶，創造符合專業投資人的形式外觀。該客戶仍是？", "text": "金融服務業協助未符合資格的客戶，創造符合專業投資人的形式外觀。該客戶仍是？ 專業投資人 金融消費者 無需保護 由業務員決定 第4條第3項：仍為本法所稱金融消費者。金融服務業還會被處1,000萬元以上5,000萬元以下罰鍰（第30-1條第2項）。", "anchor": "quiz"}, {"file": "ch06.html", "chTitle": "第6章 金融消費者保護法", "type": "scen", "title": "金融服務業違反第10條，未充分說明並揭露風險。罰鍰範圍？", "text": "金融服務業違反第10條，未充分說明並揭露風險。罰鍰範圍？ 新臺幣1萬至10萬 新臺幣30萬至1,000萬 新臺幣1,000萬至5,000萬 不處罰鍰 第30-1條第1項第3款：違反第10條第1項，處30萬元以上1,000萬元以下罰鍰。", "anchor": "quiz"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "clause", "title": "第2條 用詞定義", "text": "用詞定義 個人資料包括姓名、出生年月日、身分證統一編號、護照號碼、特徵、指紋、婚姻、家庭、教育、職業、病歷、醫療、基因、性生活、健康檢查、犯罪前科、聯絡方式、財務情況、社會活動，以及其他可以直接或間接識別個人的資料。蒐集是以任何方式取得個人資料；處理是為建立或利用個人資料檔案所做的記錄、輸入、儲存、編輯、更正、複製、檢索、刪除、輸出、連結或內部傳送；利用是把蒐集的個人資料做處理以外的使用。當事人是個人資料的本人。 蒐集＝取得；處理＝記錄到傳送；利用＝處理以外的使用。 病歷、醫療、基因、性生活、健康檢查、犯罪前科這六類，是第6條特別限制的敏感資料。 本法用詞，定義如下： 一、個人資料：指自然人之姓名、出生年月日、國民身分證統一編號、護照號碼、特徵、指紋、婚姻、家庭、教育、職業、病歷、醫療、基因、性生活、健康檢查、犯罪前科、聯絡方式、財務情況、社會活動及其他得以直接或間接方式識別該個人之資料。 二、個人資料檔案：指依系統建立而得以自動化機器或其他非自動化方式檢索、整理之個人資料之集合。 三、蒐集：指以任何方式取得個人資料。 四、處理：指為建立或利用個人資料檔案所為資料之記錄、輸入、儲存、編輯、更正、複製、檢索、刪除、輸出、連結或內部傳送。 五、利用：指將蒐集之個人資料為處理以外之使用。 六、國際傳輸：指將個人資料作跨國（境）之處理或利用。 七、公務機關：指依法行使公權力之中央或地方機關或行政法人。 八、非公務機關：指前款以外之自然人、法人或其他團體。 九、當事人：指個人資料之本人。", "anchor": "read/c2"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "clause", "title": "第5條 蒐集、處理、利用的基本原則", "text": "蒐集、處理、利用的基本原則 蒐集、處理或利用個人資料，要尊重當事人的權益，依誠實及信用方法為之，不能逾越特定目的的必要範圍，並且要與蒐集的目的有正當合理的關聯。 誠實信用、不逾特定目的、有正當合理關聯。  個人資料之蒐集、處理或利用，應尊重當事人之權益，依誠實及信用方法為之，不得逾越特定目的之必要範圍，並應與蒐集之目的具有正當合理之關聯。", "anchor": "read/c5"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "clause", "title": "第6條 六類敏感資料：原則禁止，例外允許", "text": "六類敏感資料：原則禁止，例外允許 有關病歷、醫療、基因、性生活、健康檢查及犯罪前科的個人資料，原則上不得蒐集、處理或利用。但有下列情形之一的不在此限：法律明文規定；公務機關執行法定職務或非公務機關履行法定義務必要範圍內，且有適當安全維護措施；當事人自行公開或其他已合法公開；公務機關或學術研究機構基於醫療、衛生或犯罪預防目的，為統計或學術研究，且資料無從識別特定當事人；協助公務機關執行法定職務或非公務機關履行法定義務必要範圍內，且有適當安全維護措施；經當事人書面同意（但逾越特定目的必要範圍，或其他法律另有限制不得僅依書面同意者，不在此限）。依這些例外蒐集時，準用第8條、第9條的告知規定；書面同意準用第7條第1、2、4項，並以書面為之。 六類敏感資料：病歷、醫療、基因、性生活、健康檢查、犯罪前科；原則禁止；書面同意是例外之一。 保險業務最常用的是『經當事人書面同意』。保險法第177-1條還有保險業專屬的規定（見下）。 有關病歷、醫療、基因、性生活、健康檢查及犯罪前科之個人資料，不得蒐集、處理或利用。但有下列情形之一者，不在此限： 一、法律明文規定。 二、公務機關執行法定職務或非公務機關履行法定義務必要範圍內，且事前或事後有適當安全維護措施。 三、當事人自行公開或其他已合法公開之個人資料。 四、公務機關或學術研究機構基於醫療、衛生或犯罪預防之目的，為統計或學術研究而有必要，且資料經過提供者處理後或經蒐集者依其揭露方式無從識別特定之當事人。 五、為協助公務機關執行法定職務或非公務機關履行法定義務必要範圍內，且事前或事後有適當安全維護措施。 六、經當事人書面同意。但逾越特定目的之必要範圍或其他法律另有限制不得僅依當事人書面同意蒐集、處理或利用，或其同意違反其意願者，不在此限。 依前項規定蒐集、處理或利用個人資料，準用第八條、第九條規定；其中前項第六款之書面同意，準用第七條第一項、第二項及第四項規定，並以書面為之。", "anchor": "read/c6"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "clause", "title": "第7條 什麼叫『同意』", "text": "什麼叫『同意』 第15條第2款、第19條第1項第5款所稱的『同意』，是當事人經蒐集者告知本法所定應告知事項後，所做的允許的意思表示。第16條第7款、第20條第1項第6款所稱的『同意』（特定目的外利用），是當事人經蒐集者明確告知特定目的外的其他利用目的、範圍及同意與否對其權益的影響後，『單獨』所做的意思表示。蒐集者明確告知第8條第1項各款事項時，當事人如沒有表示拒絕，並已提供其個人資料，推定當事人已依第15條第2款、第19條第1項第5款表示同意。蒐集者對『經當事人同意』這件事要負舉證責任。 先告知才算同意；目的外利用要『單獨』同意；同意的舉證責任在蒐集者。  第十五條第二款及第十九條第一項第五款所稱同意，指當事人經蒐集者告知本法所定應告知事項後，所為允許之意思表示。 第十六條第七款、第二十條第一項第六款所稱同意，指當事人經蒐集者明確告知特定目的外之其他利用目的、範圍及同意與否對其權益之影響後，單獨所為之意思表示。 公務機關或非公務機關明確告知當事人第八條第一項各款應告知事項時，當事人如未表示拒絕，並已提供其個人資料者，推定當事人已依第十五條第二款、第十九條第一項第五款之規定表示同意。 蒐集者就本法所稱經當事人同意之事實，應負舉證責任。 一般同意（蒐集、處理） 經蒐集者告知法定事項後，當事人所為允許的意思表示；已告知且沒表示拒絕並已提供資料，推定同意 特定目的外利用的同意 經明確告知其他利用目的、範圍及同意與否對權益的影響後，單獨所為之意思表示 舉證責任 蒐集者就『經當事人同意』的事實負舉證責任", "anchor": "read/c7"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "clause", "title": "第8條 向當事人蒐集個資時的告知義務", "text": "向當事人蒐集個資時的告知義務 公務機關或非公務機關向當事人蒐集個人資料時，要明確告知六項事項：機關名稱；蒐集的目的；個人資料的類別；個人資料利用的期間、地區、對象及方式；當事人依第3條可行使的權利及方式；當事人可以自由選擇提供資料時，不提供將對其權益的影響。有六種情形可以免為告知，例如法律規定得免告知、告知會妨害公共利益、當事人明知應告知內容、蒐集非基於營利目的且對當事人顯無不利影響等。 名稱、目的、類別、期間地區對象方式、權利及方式、不提供的影響。  公務機關或非公務機關依第十五條或第十九條規定向當事人蒐集個人資料時，應明確告知當事人下列事項： 一、公務機關或非公務機關名稱。 二、蒐集之目的。 三、個人資料之類別。 四、個人資料利用之期間、地區、對象及方式。 五、當事人依第三條規定得行使之權利及方式。 六、當事人得自由選擇提供個人資料時，不提供將對其權益之影響。 有下列情形之一者，得免為前項之告知： 一、依法律規定得免告知。 二、個人資料之蒐集係公務機關執行法定職務或非公務機關履行法定義務所必要。 三、告知將妨害公務機關執行法定職務。 四、告知將妨害公共利益。 五、當事人明知應告知之內容。 六、個人資料之蒐集非基於營利之目的，且對當事人顯無不利之影響。 一 公務機關或非公務機關名稱 二 蒐集的目的 三 個人資料的類別 四 個人資料利用的期間、地區、對象及方式 五 當事人依第3條得行使的權利及方式 六 當事人可自由選擇提供資料時，不提供將對其權益的影響", "anchor": "read/c8"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "clause", "title": "第9條 不是向當事人本人蒐集的個資：也要告知", "text": "不是向當事人本人蒐集的個資：也要告知 蒐集的個人資料不是由當事人提供的，要在處理或利用前，向當事人告知個人資料來源，以及第8條第1項第1至5款的事項。有免告知的情形，例如當事人自行公開、不能向當事人告知、為公共利益做統計或學術研究且無從識別等。這個告知，可以在首次對當事人利用時一併做。 非本人提供：處理或利用前，要告知來源＋第8條前五款；可在首次利用時一併告知。 第8條是『向當事人蒐集』，要告知六項；第9條是『非由當事人提供』，要告知來源及前五項（沒有第六項）。 公務機關或非公務機關依第十五條或第十九條規定蒐集非由當事人提供之個人資料，應於處理或利用前，向當事人告知個人資料來源及前條第一項第一款至第五款所列事項。 有下列情形之一者，得免為前項之告知： 一、有前條第二項所列各款情形之一。 二、當事人自行公開或其他已合法公開之個人資料。 三、不能向當事人或其法定代理人為告知。 四、基於公共利益為統計或學術研究之目的而有必要，且該資料須經提供者處理後或蒐集者依其揭露方式，無從識別特定當事人者為限。 五、大眾傳播業者基於新聞報導之公益目的而蒐集個人資料。 第一項之告知，得於首次對當事人為利用時併同為之。", "anchor": "read/c9"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "clause", "title": "第19條 非公務機關蒐集、處理的合法依據", "text": "非公務機關蒐集、處理的合法依據 非公務機關蒐集或處理個人資料（第6條第1項的敏感資料除外），要有特定目的，並符合下列情形之一：法律明文規定；與當事人有契約或類似契約的關係，且已採取適當的安全措施；當事人自行公開或其他已合法公開；學術研究機構基於公共利益做統計或學術研究，且無從識別；經當事人同意；為增進公共利益所必要；個人資料取自一般可得的來源（但當事人對該資料的禁止處理利用有更值得保護的重大利益者除外）；對當事人權益無侵害。 法律、契約、公開、學術、同意、公益、可得來源、無侵害。 保險契約的履行，常見依據是第2款（契約關係）與第5款（同意）。但敏感資料要回到第6條。 非公務機關對個人資料之蒐集或處理，除第六條第一項所規定資料外，應有特定目的，並符合下列情形之一者： 一、法律明文規定。 二、與當事人有契約或類似契約之關係，且已採取適當之安全措施。 三、當事人自行公開或其他已合法公開之個人資料。 四、學術研究機構基於公共利益為統計或學術研究而有必要，且資料經過提供者處理後或經蒐集者依其揭露方式無從識別特定之當事人。 五、經當事人同意。 六、為增進公共利益所必要。 七、個人資料取自於一般可得之來源。但當事人對該資料之禁止處理或利用，顯有更值得保護之重大利益者，不在此限。 八、對當事人權益無侵害。 蒐集或處理者知悉或經當事人通知依前項第七款但書規定禁止對該資料之處理或利用時，應主動或依當事人之請求，刪除、停止處理或利用該個人資料。 一 法律明文規定 二 與當事人有契約或類似契約關係，且已採取適當安全措施 三 當事人自行公開或其他已合法公開 四 學術研究機構基於公共利益做統計或學術研究，且無從識別 五 經當事人同意 六 為增進公共利益所必要 七 取自一般可得之來源（當事人禁止處理利用有更值得保護的重大利益者除外） 八 對當事人權益無侵害", "anchor": "read/c19"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "clause", "title": "第20條 非公務機關的利用與行銷", "text": "非公務機關的利用與行銷 非公務機關對個人資料的利用，原則上要在蒐集的特定目的必要範圍內為之。有七種情形可以為特定目的外的利用：法律明文規定；為增進公共利益所必要；為免除當事人生命、身體、自由或財產上的危險；為防止他人權益的重大危害；公務機關或學術研究機構基於公共利益做統計或學術研究且無從識別；經當事人同意；有利於當事人權益。利用個人資料行銷時，當事人表示拒絕，要立即停止利用；首次行銷時，要提供當事人表示拒絕的方式，並支付所需費用。 原則：不超過蒐集目的；行銷：拒絕就停；首次行銷要提供拒絕方式、費用由行銷者出。 這是業務員寄行銷訊息、打電話推廣的法律依據，當事人拒絕就必須停止。 非公務機關對個人資料之利用，除第六條第一項所規定資料外，應於蒐集之特定目的必要範圍內為之。但有下列情形之一者，得為特定目的外之利用： 一、法律明文規定。 二、為增進公共利益所必要。 三、為免除當事人之生命、身體、自由或財產上之危險。 四、為防止他人權益之重大危害。 五、公務機關或學術研究機構基於公共利益為統計或學術研究而有必要，且資料經過提供者處理後或經蒐集者依其揭露方式無從識別特定之當事人。 六、經當事人同意。 七、有利於當事人權益。 非公務機關依前項規定利用個人資料行銷者，當事人表示拒絕接受行銷時，應即停止利用其個人資料行銷。 非公務機關於首次行銷時，應提供當事人表示拒絕接受行銷之方式，並支付所需費用。", "anchor": "read/c20"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "clause", "title": "第29條 非公務機關違反個資法的損害賠償", "text": "非公務機關違反個資法的損害賠償 非公務機關違反本法規定，使個人資料遭不法蒐集、處理、利用或其他侵害當事人權利的，要負損害賠償責任。但能證明自己無故意或過失的，不在此限。 違反要賠；能證明無故意過失才免責。 舉證責任在非公務機關，和金融消費者保護法第11條的結構相同。 非公務機關違反本法規定，致個人資料遭不法蒐集、處理、利用或其他侵害當事人權利者，負損害賠償責任。但能證明其無故意或過失者，不在此限。 依前項規定請求賠償者，適用前條第二項至第六項規定。", "anchor": "read/c29"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "clause", "title": "第30條 損害賠償請求權的時效", "text": "損害賠償請求權的時效 損害賠償請求權，自請求權人知有損害及賠償義務人時起，因2年間不行使而消滅；自損害發生時起，逾5年者，也一樣。 知道起算2年；發生起算5年。  損害賠償請求權，自請求權人知有損害及賠償義務人時起，因二年間不行使而消滅；自損害發生時起，逾五年者，亦同。", "anchor": "read/c30"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "clause", "title": "保險法第177-1條 保險業蒐集病歷、醫療、健康檢查資料：書面同意", "text": "保險業蒐集病歷、醫療、健康檢查資料：書面同意 依保險法經營或執行業務的保險業、保險代理人、經紀人、公證人；協助保險契約義務確定或履行而受保險業委託的法人；辦理爭議處理、車禍受害人補償業務而經主管機關許可設立的保險事務財團法人，在經本人書面同意後，可以蒐集、處理或利用病歷、醫療、健康檢查的個人資料。書面同意的方式、第1款業務範圍等，由主管機關訂定辦法管理。保險業為執行核保或理賠作業需要，處理、利用依法所蒐集保險契約受益人的姓名、出生年月日、身分證統一編號及聯絡方式，可以免為個資法第9條第1項的告知。 病歷、醫療、健康檢查資料：保險業要本人書面同意；受益人基本資料用於核保理賠可免第9條告知。 這是保險法對個資法第6條的『特別規定』版本。第1項只有三類主體與三類資料：病歷、醫療、健康檢查。 符合下列各款規定之一者，於經本人書面同意，得蒐集、處理或利用病歷、醫療、健康檢查之個人資料： 一、依本法經營或執行業務之保險業、保險代理人、經紀人、公證人。 二、協助保險契約義務之確定或履行而受保險業委託之法人。 三、辦理爭議處理、車禍受害人補償業務而經主管機關許可設立之保險事務財團法人。 前項書面同意方式、第一款業務範圍及其他應遵行事項，由主管機關訂定辦法管理之。 保險業為執行核保或理賠作業需要，處理、利用依法所蒐集保險契約受益人之姓名、出生年月日、國民身分證統一編號及聯絡方式，得免為個人資料保護法第九條第一項之告知。 中華民國一百年六月十四日修正之本條文施行前，第一項各款之人已依法蒐集之病歷、醫療、健康檢查之個人資料，於修正施行後，得繼續處理及為符合蒐集之特定目的必要範圍內利用。", "anchor": "read/c保177-1"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "table", "title": "第8條與第9條：告知義務對照", "text": "第8條與第9條：告知義務對照 項目 第8條 第9條 適用情形 向當事人本人蒐集個資 蒐集的個資不是由當事人提供 告知時點 蒐集時 處理或利用前（可在首次對當事人利用時一併） 告知內容 六項（含不提供的影響） 個資來源＋第8條第1項第1至5款 免告知 六種情形 含不能告知、當事人自行公開等", "anchor": "table/t0"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "table", "title": "第6條六類敏感資料與第6條例外", "text": "第6條六類敏感資料與第6條例外 敏感資料（原則禁止） 例外之一 保險業的特別規定 病歷、醫療、基因、性生活、健康檢查、犯罪前科 經當事人書面同意（準用第7條第1、2、4項，以書面為之） 保險法第177-1條：病歷、醫療、健康檢查，經本人書面同意可蒐集、處理、利用", "anchor": "table/t1"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "table", "title": "數字速記：個資法", "text": "數字速記：個資法 條 數字 什麼事 8 6項 向當事人蒐集個資應明確告知的事項 6 6類 敏感資料：病歷、醫療、基因、性生活、健康檢查、犯罪前科 30 2年／5年 損害賠償請求權時效：知有損害及賠償義務人時起2年；損害發生時起逾5年", "anchor": "table/t2"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "card", "title": "個資法的『蒐集』是什麼意思？", "text": "個資法的『蒐集』是什麼意思？ 以任何方式取得個人資料。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "card", "title": "個資法的『利用』是什麼意思？", "text": "個資法的『利用』是什麼意思？ 把蒐集的個人資料做處理以外的使用。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "card", "title": "蒐集、處理、利用個資的基本原則？", "text": "蒐集、處理、利用個資的基本原則？ 尊重當事人權益、誠實及信用方法、不逾特定目的必要範圍、與目的有正當合理關聯。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "card", "title": "第6條限制的六類敏感資料？", "text": "第6條限制的六類敏感資料？ 病歷、醫療、基因、性生活、健康檢查、犯罪前科。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "card", "title": "敏感資料原則上可不可以蒐集？有哪個例外和保險業務最相關？", "text": "敏感資料原則上可不可以蒐集？有哪個例外和保險業務最相關？ 原則不可以；例外之一是經當事人書面同意。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "card", "title": "目的外利用的『同意』，有什麼特別要件？", "text": "目的外利用的『同意』，有什麼特別要件？ 要明確告知其他利用目的、範圍及同意與否對權益的影響後，『單獨』所為之意思表示。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "card", "title": "『經當事人同意』的舉證責任在誰？", "text": "『經當事人同意』的舉證責任在誰？ 蒐集者。第7條第4項。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "card", "title": "向當事人蒐集個資，要告知哪六項？", "text": "向當事人蒐集個資，要告知哪六項？ 名稱、蒐集目的、個資類別、利用期間地區對象方式、當事人權利及行使方式、不提供的影響。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "card", "title": "個資不是當事人提供的，要告知什麼？", "text": "個資不是當事人提供的，要告知什麼？ 個資來源，以及第8條第1項第1至5款事項；可在首次利用時一併告知。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "card", "title": "非公務機關蒐集或處理個資，第2款的合法依據是？", "text": "非公務機關蒐集或處理個資，第2款的合法依據是？ 與當事人有契約或類似契約的關係，且已採取適當的安全措施。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "card", "title": "當事人表示拒絕接受行銷，非公務機關要怎麼做？", "text": "當事人表示拒絕接受行銷，非公務機關要怎麼做？ 要立即停止利用其個人資料行銷。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "card", "title": "非公務機關違反個資法致當事人受害，什麼情況可免賠償責任？", "text": "非公務機關違反個資法致當事人受害，什麼情況可免賠償責任？ 能證明其無故意或過失。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "card", "title": "個資法損害賠償請求權的時效？", "text": "個資法損害賠償請求權的時效？ 知有損害及賠償義務人時起2年；自損害發生時起逾5年亦消滅。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "card", "title": "保險業蒐集病歷、醫療、健康檢查資料，需要什麼？", "text": "保險業蒐集病歷、醫療、健康檢查資料，需要什麼？ 本人書面同意。", "anchor": "cards"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "scen", "title": "下列何者屬於個資法第6條原則上不得蒐集的資料？", "text": "下列何者屬於個資法第6條原則上不得蒐集的資料？ 聯絡電話 職業 健康檢查資料 出生年月日 第6條列的六類：病歷、醫療、基因、性生活、健康檢查、犯罪前科。聯絡電話、職業、出生年月日屬第2條的一般個人資料，不是第6條的敏感資料。", "anchor": "quiz"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "scen", "title": "保險公司要蒐集被保險人的病歷作為核保依據。最符合保險法第177-1條的做法是？", "text": "保險公司要蒐集被保險人的病歷作為核保依據。最符合保險法第177-1條的做法是？ 不需同意，直接向醫院調閱 經本人書面同意後蒐集 由業務員口頭徵得同意即可 向其家屬取得同意 保險法第177-1條第1項：經本人書面同意，得蒐集、處理或利用病歷、醫療、健康檢查的個人資料。", "anchor": "quiz"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "scen", "title": "向當事人蒐集個資時，下列哪一項不在第8條第1項要明確告知的六項裡面？", "text": "向當事人蒐集個資時，下列哪一項不在第8條第1項要明確告知的六項裡面？ 蒐集的目的 個人資料的類別 當事人不提供個資對其權益的影響 資料處理人員的薪資 第8條第1項六款：名稱、目的、類別、利用期間地區對象方式、權利及行使方式、不提供的影響。薪資不在內。", "anchor": "quiz"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "scen", "title": "保險公司從第三方取得客戶資料。依第9條，應於何時告知當事人資料來源等事項？", "text": "保險公司從第三方取得客戶資料。依第9條，應於何時告知當事人資料來源等事項？ 蒐集後三個月內 處理或利用前（可在首次利用時一併） 客戶要求時 不需告知 第9條第1項：處理或利用前告知；第3項：可於首次對當事人利用時併同為之。", "anchor": "quiz"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "scen", "title": "客戶明確表示不再接受行銷訊息。業務員所屬公司依第20條第2項應？", "text": "客戶明確表示不再接受行銷訊息。業務員所屬公司依第20條第2項應？ 可繼續行銷一年 立即停止利用其個人資料行銷 改由業務員私下聯絡 徵詢主管同意 第20條第2項：當事人表示拒絕接受行銷時，應即停止利用其個人資料行銷。", "anchor": "quiz"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "scen", "title": "個資法第7條對『經當事人同意』的舉證責任規定在？", "text": "個資法第7條對『經當事人同意』的舉證責任規定在？ 當事人 蒐集者 法院 主管機關 第7條第4項：蒐集者就本法所稱經當事人同意的事實，應負舉證責任。", "anchor": "quiz"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "scen", "title": "個資法損害賠償請求權，從損害發生時起，超過幾年亦消滅？", "text": "個資法損害賠償請求權，從損害發生時起，超過幾年亦消滅？ 2年 3年 5年 10年 第30條：知有損害及賠償義務人時起2年；自損害發生時起逾5年者亦同。", "anchor": "quiz"}, {"file": "ch07.html", "chTitle": "第7章 個人資料保護法（保險業務最常用的條文）", "type": "scen", "title": "非公務機關違反個資法致當事人受損害，哪種情況可免賠償？", "text": "非公務機關違反個資法致當事人受損害，哪種情況可免賠償？ 當事人沒有請求 能證明無故意或過失 已道歉 金額很小 第29條：能證明其無故意或過失者，不在此限。", "anchor": "quiz"}, {"file": "ch08.html", "chTitle": "第8章 洗錢防制法（保險業務要記得的條文）", "type": "clause", "title": "第2條 什麼叫洗錢", "text": "什麼叫洗錢 洗錢有四種行為：隱匿特定犯罪所得或掩飾其來源；妨礙或危害國家對特定犯罪所得的調查、發現、保全、沒收或追徵；收受、持有或使用他人的特定犯罪所得；使用自己的特定犯罪所得與他人進行交易。 隱匿掩飾、妨礙追查、收受持用他人所得、用自己所得去交易。  本法所稱洗錢，指下列行為： 一、隱匿特定犯罪所得或掩飾其來源。 二、妨礙或危害國家對於特定犯罪所得之調查、發現、保全、沒收或追徵。 三、收受、持有或使用他人之特定犯罪所得。 四、使用自己之特定犯罪所得與他人進行交易。 一 隱匿特定犯罪所得或掩飾其來源 二 妨礙或危害國家對特定犯罪所得的調查、發現、保全、沒收或追徵 三 收受、持有或使用他人的特定犯罪所得 四 使用自己的特定犯罪所得與他人進行交易", "anchor": "read/c2"}, {"file": "ch08.html", "chTitle": "第8章 洗錢防制法（保險業務要記得的條文）", "type": "clause", "title": "第5條 金融機構的範圍：保險公司在內", "text": "金融機構的範圍：保險公司在內 本法所稱金融機構包括銀行、信託投資公司、信用合作社、農漁會信用部、全國農業金庫、辦理簡易人壽保險的郵政機構、票券金融公司、信用卡公司、保險公司、證券商等，以及其他經目的事業主管機關指定的金融機構。辦理融資性租賃、提供虛擬資產服務的事業或人員，也適用金融機構的規定。另有『指定之非金融事業或人員』，例如銀樓業、地政士及不動產經紀業、律師、公證人、會計師等。 第10款：保險公司是金融機構。 不動產經紀業屬『指定之非金融事業或人員』（第5條第3項第2款）。 本法所稱金融機構，包括下列機構： 一、銀行。 二、信託投資公司。 三、信用合作社。 四、農會信用部。 五、漁會信用部。 六、全國農業金庫。 七、辦理儲金匯兌、簡易人壽保險業務之郵政機構。 八、票券金融公司。 九、信用卡公司。 十、保險公司。 十一、證券商。 十二、證券投資信託事業。 十三、證券金融事業。 十四、證券投資顧問事業。 十五、證券集中保管事業。 十六、期貨商。 十七、信託業。 十八、其他經目的事業主管機關指定之金融機構。 辦理融資性租賃、提供虛擬資產服務之事業或人員，適用本法關於金融機構之規定。 本法所稱指定之非金融事業或人員，指從事下列交易之事業或人員： 一、銀樓業。 二、地政士及不動產經紀業從事與不動產買賣交易有關之行為。 三、律師、公證人、會計師為客戶準備或進行下列交易時： （一）買賣不動產。 （二）管理客戶金錢、證券或其他資產。 （三）管理銀行、儲蓄或證券帳戶。 （四）有關提供公司設立、營運或管理之資金籌劃。 （五）法人或法律協議之設立、營運或管理以及買賣事業體。 四、信託及公司服務提供業為客戶準備或進行下列交易時： （一）關於法人之籌備或設立事項。 （二）擔任或安排他人擔任公司董事或秘書、合夥之合夥人或在其他法人組織之類似職位。 （三）提供公司、合夥、信託、其他法人或協議註冊之辦公室、營業地址、居住所、通訊或管理地址。 （四）擔任或安排他人擔任信託或其他類似契約性質之受託人或其他相同角色。 （五）擔任或安排他人擔任實質持股股東。 五、提供第三方支付服務之事業或人員。 六、其他業務特性或交易型態易為洗錢犯罪利用之事業或從業人員。 第二項辦理融資性租賃、提供虛擬資產服務之事業或人員之範圍、第三項第六款指定之非金融事業或人員，其適用之交易型態，及得不適用第十二條第一項申報規定之前項各款事業或人員，由法務部會同中央目的事業主管機關報請行政院指定。 第一項至第三項之金融機構、事業或人員所從事之交易，必要時，得由法務部會同中央目的事業主管機關指定其達一定金額者，應使用現金以外之支付工具。 第一項至第三項之金融機構、事業或人員違反前項規定者，由中央目的事業主管機關處交易金額二倍以下罰鍰。 前六項之中央目的事業主管機關認定有疑義者，由行政院指定之。 第四項、第五項及前項之指定，其事務涉司法院者，由行政院會同司法院指定之。", "anchor": "read/c5"}, {"file": "ch08.html", "chTitle": "第8章 洗錢防制法（保險業務要記得的條文）", "type": "clause", "title": "第7條 洗錢防制內部控制與稽核制度", "text": "洗錢防制內部控制與稽核制度 金融機構及指定之非金融事業或人員，要依洗錢與資恐風險及業務規模，建立洗錢防制內部控制與稽核制度，包括：防制洗錢及打擊資恐的作業及控制程序；定期舉辦或參加防制洗錢的在職訓練；指派專責人員負責協調監督；備置並定期更新防制洗錢及打擊資恐風險評估報告；稽核程序；其他經主管機關指定的事項。未建立制度，由主管機關限期改善，屆期未改善的，金融機構處新臺幣50萬元以上1,000萬元以下罰鍰，並得按次處罰。 作業程序、在職訓練、專責人員、風險評估報告、稽核程序。  金融機構及指定之非金融事業或人員應依洗錢與資恐風險及業務規模，建立洗錢防制內部控制與稽核制度；其內容應包括下列事項： 一、防制洗錢及打擊資恐之作業及控制程序。 二、定期舉辦或參加防制洗錢之在職訓練。 三、指派專責人員負責協調監督第一款事項之執行。 四、備置並定期更新防制洗錢及打擊資恐風險評估報告。 五、稽核程序。 六、其他經中央目的事業主管機關指定之事項。 前項制度之執行，中央目的事業主管機關應定期查核，並得委託其他機關（構）、法人或團體辦理。 第一項制度之實施內容、作業程序、執行措施，前項查核之方式、受委託之資格條件及其他應遵行事項之辦法，由中央目的事業主管機關會商法務部及相關機關定之；於訂定前應徵詢相關公會之意見。 違反第一項規定未建立制度，或前項辦法中有關制度之實施內容、作業程序、執行措施之規定者，由中央目的事業主管機關限期令其改善，屆期未改善者，處金融機構新臺幣五十萬元以上一千萬元以下罰鍰、處指定之非金融事業或人員新臺幣五萬元以上五百萬元以下罰鍰，並得按次處罰。 金融機構及指定之非金融事業或人員規避、拒絕或妨礙現地或非現地查核者，由中央目的事業主管機關處金融機構新臺幣五十萬元以上五百萬元以下罰鍰、處指定之非金融事業或人員新臺幣五萬元以上二百五十萬元以下罰鍰，並得按次處罰。", "anchor": "read/c7"}, {"file": "ch08.html", "chTitle": "第8章 洗錢防制法（保險業務要記得的條文）", "type": "clause", "title": "第8條 確認客戶身分與紀錄保存5年", "text": "確認客戶身分與紀錄保存5年 金融機構要進行確認客戶身分的程序，並留存所得資料；這個程序要以風險為基礎，並包括實質受益人的審查。確認客戶身分所得資料，要自業務關係終止時起至少保存5年；臨時性交易自臨時性交易終止時起至少保存5年；法律另有較長保存期間者從其規定。對現任或曾任國內外政府或國際組織重要政治性職務的客戶或受益人，與其家庭成員及有密切關係的人，要以風險為基礎，執行加強客戶審查。違反規定，金融機構處新臺幣50萬元以上1,000萬元以下罰鍰，並得按次處罰。 風險為基礎＋實質受益人；資料至少保存5年；政治性職務人士要加強審查。  金融機構及指定之非金融事業或人員應進行確認客戶身分程序，並留存其確認客戶身分程序所得資料；其確認客戶身分程序應以風險為基礎，並應包括實質受益人之審查。 前項確認客戶身分程序所得資料，應自業務關係終止時起至少保存五年；臨時性交易者，應自臨時性交易終止時起至少保存五年。但法律另有較長保存期間規定者，從其規定。 金融機構及指定之非金融事業或人員對現任或曾任國內外政府或國際組織重要政治性職務之客戶或受益人與其家庭成員及有密切關係之人，應以風險為基礎，執行加強客戶審查程序。 第一項確認客戶身分範圍、留存確認資料之範圍、程序、方式及前項加強客戶審查之範圍、程序、方式之辦法，由中央目的事業主管機關會商法務部及相關機關定之；於訂定前應徵詢相關公會之意見。前項重要政治性職務之人與其家庭成員及有密切關係之人之範圍，由法務部定之。 違反第一項至第三項規定或前項所定辦法中有關確認客戶身分、留存確認資料、加強客戶審查之範圍、程序、方式之規定者，由中央目的事業主管機關處金融機構新臺幣五十萬元以上一千萬元以下罰鍰、處指定之非金融事業或人員新臺幣五萬元以上五百萬元以下罰鍰，並得按次處罰。", "anchor": "read/c8"}, {"file": "ch08.html", "chTitle": "第8章 洗錢防制法（保險業務要記得的條文）", "type": "clause", "title": "第10條 交易紀錄保存5年", "text": "交易紀錄保存5年 金融機構因執行業務而辦理國內外交易，要留存必要的交易紀錄，自交易完成時起至少保存5年；法律另有較長保存期間者從其規定。違反規定，金融機構處新臺幣50萬元以上1,000萬元以下罰鍰，並得按次處罰。 交易紀錄：交易完成後至少保存5年。 第8條的保存起算點是『業務關係終止時』（身分資料）；第10條的起算點是『交易完成時』（交易紀錄）。 金融機構及指定之非金融事業或人員因執行業務而辦理國內外交易，應留存必要交易紀錄。 前項必要交易紀錄之保存，自交易完成時起，應至少保存五年。但法律另有較長保存期間規定者，從其規定。 第一項留存必要交易紀錄之適用交易範圍、程序、方式之辦法，由中央目的事業主管機關會商法務部及相關機關定之；於訂定前應徵詢相關公會之意見。 違反第一項、第二項規定或前項所定辦法中有關留存必要交易紀錄之範圍、程序、方式之規定者，由中央目的事業主管機關處金融機構新臺幣五十萬元以上一千萬元以下罰鍰、處指定之非金融事業或人員新臺幣五萬元以上五百萬元以下罰鍰，並得按次處罰。", "anchor": "read/c10"}, {"file": "ch08.html", "chTitle": "第8章 洗錢防制法（保險業務要記得的條文）", "type": "clause", "title": "第12條 達一定金額的通貨交易要申報", "text": "達一定金額的通貨交易要申報 金融機構對於達一定金額的通貨交易，除本法另有規定外，要向法務部調查局申報。依規定申報的，免除其業務上應保守秘密的義務；負責人、董事、經理人及職員，亦同。一定金額與申報細節由主管機關會商法務部訂辦法。違反規定，金融機構處新臺幣50萬元以上1,000萬元以下罰鍰，並得按次處罰。 大額通貨交易→向調查局申報；申報免保密義務。 一定金額在辦法，不在本法。考試或實務上要用數字時，請以現行辦法為準（本頁未收錄）。 金融機構及指定之非金融事業或人員對於達一定金額之通貨交易，除本法另有規定外，應向法務部調查局申報。 金融機構及指定之非金融事業或人員依前項規定為申報者，免除其業務上應保守秘密之義務。該機構或事業之負責人、董事、經理人及職員，亦同。 第一項一定金額、通貨交易之範圍、種類、申報之範圍、方式、程序及其他應遵行事項之辦法，由中央目的事業主管機關會商法務部及相關機關定之；於訂定前應徵詢相關公會之意見。 違反第一項規定或前項所定辦法中有關申報之範圍、方式、程序之規定者，由中央目的事業主管機關處金融機構新臺幣五十萬元以上一千萬元以下罰鍰、處指定之非金融事業或人員新臺幣五萬元以上五百萬元以下罰鍰，並得按次處罰。", "anchor": "read/c12"}, {"file": "ch08.html", "chTitle": "第8章 洗錢防制法（保險業務要記得的條文）", "type": "clause", "title": "第13條 疑似洗錢交易要申報", "text": "疑似洗錢交易要申報 金融機構對疑似犯第19條、第20條之罪的交易，要向法務部調查局申報；交易未完成的，也要申報。依規定申報的，免除業務上應保守秘密的義務；負責人、董事、經理人及職員，亦同。違反規定，金融機構處新臺幣50萬元以上1,000萬元以下罰鍰，並得按次處罰。 疑似洗錢（含未完成交易）→申報調查局；申報免保密義務。 『達一定金額的通貨交易』（第12條）看金額；『疑似洗錢交易』（第13條）看有無疑似犯罪，交易沒完成也要報。 金融機構及指定之非金融事業或人員對疑似犯第十九條、第二十條之罪之交易，應向法務部調查局申報；其交易未完成者，亦同。 金融機構及指定之非金融事業或人員依前項規定為申報者，免除其業務上應保守秘密之義務。該機構或事業之負責人、董事、經理人及職員，亦同。 第一項之申報範圍、方式、程序及其他應遵行事項之辦法，由中央目的事業主管機關會商法務部及相關機關定之；於訂定前應徵詢相關公會之意見。 前項、第七條第三項、第八條第四項、第十條第三項及前條第三項之辦法，其事務涉司法院者，由司法院會商行政院定之。 違反第一項規定或第三項所定辦法中有關申報之範圍、方式、程序之規定者，由中央目的事業主管機關處金融機構新臺幣五十萬元以上一千萬元以下罰鍰、處指定之非金融事業或人員新臺幣五萬元以上五百萬元以下罰鍰，並得按次處罰。", "anchor": "read/c13"}, {"file": "ch08.html", "chTitle": "第8章 洗錢防制法（保險業務要記得的條文）", "type": "clause", "title": "第19條 洗錢罪的刑責", "text": "洗錢罪的刑責 有第2條各款的洗錢行為，處3年以上10年以下有期徒刑，併科新臺幣1億元以下罰金。洗錢的財物或財產上利益未達新臺幣1億元的，處6月以上5年以下有期徒刑，併科新臺幣5,000萬元以下罰金。未遂犯也處罰。 一億以上：三到十年；未達一億：六月到五年；未遂罰。  有第二條各款所列洗錢行為者，處三年以上十年以下有期徒刑，併科新臺幣一億元以下罰金。其洗錢之財物或財產上利益未達新臺幣一億元者，處六月以上五年以下有期徒刑，併科新臺幣五千萬元以下罰金。 前項之未遂犯罰之。 新臺幣1億元以上 3年以上10年以下有期徒刑，併科1億元以下罰金 未達新臺幣1億元 6月以上5年以下有期徒刑，併科5,000萬元以下罰金 未遂 也處罰", "anchor": "read/c19"}, {"file": "ch08.html", "chTitle": "第8章 洗錢防制法（保險業務要記得的條文）", "type": "clause", "title": "第22條 不得把自己或他人的帳戶交付給別人使用", "text": "不得把自己或他人的帳戶交付給別人使用 任何人不得把自己或他人向金融機構申請開立的帳戶，交付、提供給他人使用；但符合一般商業、金融交易習慣，或基於親友間信賴關係或其他正當理由的，不在此限。違反的，由警察機關裁處告誡；期約或收受對價、交付的帳戶合計3個以上、或經裁處後5年內再犯的，處3年以下有期徒刑、拘役或科或併科新臺幣100萬元以下罰金。違反時，金融機構要對其已開立或欲開立的帳戶，在一定期間內暫停或限制功能，或逕予關閉。 不得交付帳戶；收對價、3個帳戶以上、5年內再犯：刑責。 收取客戶帳戶、請客戶借帳戶收款，都要小心觸及這條的精神。 任何人不得將自己或他人向金融機構申請開立之帳戶、向提供虛擬資產服務或第三方支付服務之事業或人員申請之帳號交付、提供予他人使用。但符合一般商業、金融交易習慣，或基於親友間信賴關係或其他正當理由者，不在此限。 違反前項規定者，由直轄市、縣（市）政府警察機關裁處告誡。經裁處告誡後逾五年再違反前項規定者，亦同。 違反第一項規定而有下列情形之一者，處三年以下有期徒刑、拘役或科或併科新臺幣一百萬元以下罰金： 一、期約或收受對價而犯之。 二、交付、提供之帳戶或帳號合計三個以上。 三、經直轄市、縣（市）政府警察機關依前項或第四項規定裁處後，五年以內再犯。 前項第一款或第二款情形，應依第二項規定，由該管機關併予裁處之。 違反第一項規定者，金融機構、提供虛擬資產服務及第三方支付服務之事業或人員，應對其已開立之帳戶、帳號，或欲開立之新帳戶、帳號，於一定期間內，暫停或限制該帳戶、帳號之全部或部分功能，或逕予關閉。 前項帳戶、帳號之認定基準，暫停、限制功能或逕予關閉之期間、範圍、程序、方式、作業程序之辦法，由法務部會同中央目的事業主管機關定之。 警政主管機關應會同社會福利主管機關，建立個案通報機制，於依第二項規定為告誡處分時，倘知悉有社會救助需要之個人或家庭，應通報直轄市、縣（市）社會福利主管機關，協助其獲得社會救助法所定社會救助。", "anchor": "read/c22"}, {"file": "ch08.html", "chTitle": "第8章 洗錢防制法（保險業務要記得的條文）", "type": "table", "title": "第8條與第10條：保存5年的起算點", "text": "第8條與第10條：保存5年的起算點 條 保存什麼 至少保存5年，自何時起算 8 確認客戶身分所得資料（業務關係） 業務關係終止時 8 確認客戶身分所得資料（臨時性交易） 臨時性交易終止時 10 必要交易紀錄 交易完成時", "anchor": "table/t0"}, {"file": "ch08.html", "chTitle": "第8章 洗錢防制法（保險業務要記得的條文）", "type": "table", "title": "第12條與第13條：兩種申報", "text": "第12條與第13條：兩種申報 項目 第12條 第13條 申報什麼 達一定金額的通貨交易 疑似犯第19、20條之罪的交易（交易未完成亦同） 向誰申報 法務部調查局 法務部調查局 金額或細節 由辦法訂定（本頁未收錄） 由辦法訂定（本頁未收錄） 保密義務 依規定申報者免除 依規定申報者免除", "anchor": "table/t1"}, {"file": "ch08.html", "chTitle": "第8章 洗錢防制法（保險業務要記得的條文）", "type": "table", "title": "數字速記：洗錢防制法", "text": "數字速記：洗錢防制法 條 數字 什麼事 8、10 至少5年 身分資料自業務關係（或臨時交易）終止時；交易紀錄自交易完成時 7、8、10、12、13 50萬～1,000萬 金融機構違反義務的罰鍰，並得按次處罰 19 1億元 洗錢財物或利益達1億元以上與未達1億元的刑度分界 19 3～10年／6月～5年 兩種刑度 22 3個帳戶 交付、提供帳戶合計3個以上，進入刑責", "anchor": "table/t2"}, {"file": "ch08.html", "chTitle": "第8章 洗錢防制法（保險業務要記得的條文）", "type": "card", "title": "洗錢的四種行為？", "text": "洗錢的四種行為？ 隱匿或掩飾來源；妨礙追查與沒收；收受、持有或使用他人特定犯罪所得；使用自己的特定犯罪所得與他人交易。", "anchor": "cards"}, {"file": "ch08.html", "chTitle": "第8章 洗錢防制法（保險業務要記得的條文）", "type": "card", "title": "保險公司是不是洗錢防制法的金融機構？", "text": "保險公司是不是洗錢防制法的金融機構？ 是。第5條第1項第10款。", "anchor": "cards"}, {"file": "ch08.html", "chTitle": "第8章 洗錢防制法（保險業務要記得的條文）", "type": "card", "title": "洗錢防制內部控制制度要包括哪些？", "text": "洗錢防制內部控制制度要包括哪些？ 作業及控制程序、在職訓練、專責人員、風險評估報告、稽核程序、其他主管機關指定事項。", "anchor": "cards"}, {"file": "ch08.html", "chTitle": "第8章 洗錢防制法（保險業務要記得的條文）", "type": "card", "title": "確認客戶身分資料至少保存幾年？從何時起算？", "text": "確認客戶身分資料至少保存幾年？從何時起算？ 至少5年；自業務關係終止時（臨時性交易為終止時）起算。", "anchor": "cards"}, {"file": "ch08.html", "chTitle": "第8章 洗錢防制法（保險業務要記得的條文）", "type": "card", "title": "確認客戶身分要包含什麼審查？", "text": "確認客戶身分要包含什麼審查？ 實質受益人的審查，並以風險為基礎。", "anchor": "cards"}, {"file": "ch08.html", "chTitle": "第8章 洗錢防制法（保險業務要記得的條文）", "type": "card", "title": "對現任或曾任重要政治性職務的人，要做什麼？", "text": "對現任或曾任重要政治性職務的人，要做什麼？ 以風險為基礎，執行加強客戶審查程序。", "anchor": "cards"}, {"file": "ch08.html", "chTitle": "第8章 洗錢防制法（保險業務要記得的條文）", "type": "card", "title": "交易紀錄至少保存幾年？從何時起算？", "text": "交易紀錄至少保存幾年？從何時起算？ 至少5年；自交易完成時起算。", "anchor": "cards"}, {"file": "ch08.html", "chTitle": "第8章 洗錢防制法（保險業務要記得的條文）", "type": "card", "title": "達一定金額的通貨交易要向誰申報？", "text": "達一定金額的通貨交易要向誰申報？ 法務部調查局。一定金額由辦法訂定。", "anchor": "cards"}, {"file": "ch08.html", "chTitle": "第8章 洗錢防制法（保險業務要記得的條文）", "type": "card", "title": "疑似洗錢交易，交易未完成時要不要申報？", "text": "疑似洗錢交易，交易未完成時要不要申報？ 要。第13條第1項後段。", "anchor": "cards"}, {"file": "ch08.html", "chTitle": "第8章 洗錢防制法（保險業務要記得的條文）", "type": "card", "title": "洗錢財物達新臺幣1億元以上的刑度？", "text": "洗錢財物達新臺幣1億元以上的刑度？ 3年以上10年以下有期徒刑，併科1億元以下罰金。", "anchor": "cards"}, {"file": "ch08.html", "chTitle": "第8章 洗錢防制法（保險業務要記得的條文）", "type": "card", "title": "洗錢財物未達新臺幣1億元的刑度？", "text": "洗錢財物未達新臺幣1億元的刑度？ 6月以上5年以下有期徒刑，併科5,000萬元以下罰金。", "anchor": "cards"}, {"file": "ch08.html", "chTitle": "第8章 洗錢防制法（保險業務要記得的條文）", "type": "card", "title": "交付帳戶給他人使用，達什麼情況會進入刑責？", "text": "交付帳戶給他人使用，達什麼情況會進入刑責？ 期約或收受對價；帳戶合計3個以上；或經警察機關裁處後5年內再犯。", "anchor": "cards"}, {"file": "ch08.html", "chTitle": "第8章 洗錢防制法（保險業務要記得的條文）", "type": "card", "title": "金融機構違反第7、8、10、12、13條義務，罰鍰範圍？", "text": "金融機構違反第7、8、10、12、13條義務，罰鍰範圍？ 新臺幣50萬元以上1,000萬元以下，並得按次處罰。", "anchor": "cards"}, {"file": "ch08.html", "chTitle": "第8章 洗錢防制法（保險業務要記得的條文）", "type": "scen", "title": "保險公司與客戶的業務關係於2026年1月終止。依洗錢防制法第8條，確認客戶身分所得資料至少要保存到？", "text": "保險公司與客戶的業務關係於2026年1月終止。依洗錢防制法第8條，確認客戶身分所得資料至少要保存到？ 2026年1月就可銷毀 2027年1月 2031年1月 2036年1月 第8條第2項：自業務關係終止時起至少保存5年。2026年1月起算5年到2031年1月。法律另有較長保存期間的，從其規定。", "anchor": "quiz"}, {"file": "ch08.html", "chTitle": "第8章 洗錢防制法（保險業務要記得的條文）", "type": "scen", "title": "洗錢防制法第10條，交易紀錄至少保存多久，從何時起算？", "text": "洗錢防制法第10條，交易紀錄至少保存多久，從何時起算？ 3年，自交易完成時 5年，自交易完成時 5年，自業務關係終止時 10年，自交易完成時 第10條第2項：自交易完成時起，至少保存5年。自業務關係終止時起算的是第8條的確認客戶身分資料。", "anchor": "quiz"}, {"file": "ch08.html", "chTitle": "第8章 洗錢防制法（保險業務要記得的條文）", "type": "scen", "title": "金融機構發現某筆交易疑似洗錢，但客戶最後沒完成交易。是否仍要申報？", "text": "金融機構發現某筆交易疑似洗錢，但客戶最後沒完成交易。是否仍要申報？ 不需申報 要申報，交易未完成者亦同 只要通知客戶 只要內部記錄 第13條第1項：對疑似犯第19、20條之罪的交易，應向法務部調查局申報；交易未完成者，亦同。", "anchor": "quiz"}, {"file": "ch08.html", "chTitle": "第8章 洗錢防制法（保險業務要記得的條文）", "type": "scen", "title": "洗錢的財物達新臺幣1億元以上，依第19條的刑度？", "text": "洗錢的財物達新臺幣1億元以上，依第19條的刑度？ 6月以上5年以下，併科5,000萬元以下罰金 3年以上10年以下，併科1億元以下罰金 1年以下 僅處罰金 第19條第1項前段：3年以上10年以下有期徒刑，併科新臺幣1億元以下罰金。選項A是未達1億元的刑度。", "anchor": "quiz"}, {"file": "ch08.html", "chTitle": "第8章 洗錢防制法（保險業務要記得的條文）", "type": "scen", "title": "依洗錢防制法第5條，下列何者屬於金融機構？", "text": "依洗錢防制法第5條，下列何者屬於金融機構？ 保險公司 餐廳 便利商店 旅行社 第5條第1項第10款：保險公司是金融機構。", "anchor": "quiz"}, {"file": "ch08.html", "chTitle": "第8章 洗錢防制法（保險業務要記得的條文）", "type": "scen", "title": "甲把自己的銀行帳戶交給陌生人使用並收取報酬。依第22條？", "text": "甲把自己的銀行帳戶交給陌生人使用並收取報酬。依第22條？ 不處罰 可能涉及刑責（期約或收受對價） 只要口頭警告 只罰款不涉刑責 第22條第3項第1款：期約或收受對價而違反者，處3年以下有期徒刑、拘役或科或併科新臺幣100萬元以下罰金。", "anchor": "quiz"}, {"file": "ch08.html", "chTitle": "第8章 洗錢防制法（保險業務要記得的條文）", "type": "scen", "title": "洗錢防制法第12條的『一定金額』規定在哪裡？", "text": "洗錢防制法第12條的『一定金額』規定在哪裡？ 洗錢防制法第12條條文內 主管機關依授權訂定的辦法 刑法 保險法 第12條第3項：一定金額、通貨交易的範圍、申報方式等由中央目的事業主管機關會商法務部等訂辦法。數字要查現行辦法。", "anchor": "quiz"}], "cards": [{"no": "01", "key": "rs01:1", "ref": "3", "front": "要保人要同時符合哪三件事？", "back": "對保險標的有保險利益；向保險人申請訂立保險契約；負有交付保險費的義務。", "tag": "第1章"}, {"no": "01", "key": "rs01:2", "ref": "2", "front": "保險人在契約成立時有什麼權利、承保事故發生時有什麼義務？", "back": "權利：請求保險費；義務：依承保責任負賠償義務。", "tag": "第1章"}, {"no": "01", "key": "rs01:3", "ref": "5", "front": "受益人可以是要保人或被保險人本人嗎？", "back": "可以。第5條：要保人或被保險人均得為受益人。", "tag": "第1章"}, {"no": "01", "key": "rs01:4", "ref": "13", "front": "人身保險包括哪四種？", "back": "人壽保險、健康保險、傷害保險、年金保險。", "tag": "第1章"}, {"no": "01", "key": "rs01:5", "ref": "16", "front": "第16條：要保人對哪四種人的生命或身體有保險利益？", "back": "本人或其家屬；生活費或教育費所仰給之人；債務人；為本人管理財產或利益之人。", "tag": "第1章"}, {"no": "01", "key": "rs01:6", "ref": "16", "front": "我借錢給朋友，我是要保人，我對朋友的生命有保險利益嗎？", "back": "有。對方是我的債務人，屬第16條第3款。", "tag": "第1章"}, {"no": "01", "key": "rs01:7", "ref": "17", "front": "要保人對保險標的物沒有保險利益，契約會怎樣？", "back": "失其效力（失效）。第17條。", "tag": "第1章"}, {"no": "01", "key": "rs01:8", "ref": "8", "front": "保險經紀人是站在誰的利益洽訂保險契約？", "back": "被保險人的利益，並收取佣金或報酬。", "tag": "第1章"}, {"no": "01", "key": "rs01:9", "ref": "16-1", "front": "父母或監護人為被保險人時，保險金可以怎麼約定以保障未成年人？", "back": "要保人、被保險人、受益人可事前共同約定，保險金出險後匯入指定信託帳戶，要保人並得放棄第111條的處分權。", "tag": "第1章"}, {"no": "02", "key": "rs02:1", "ref": "21", "front": "第一期保險費應在什麼時候交付？", "back": "契約生效前交付（簽約時保險費還不能確定的例外）。第21條。", "tag": "第2章"}, {"no": "02", "key": "rs02:2", "ref": "54", "front": "保險契約的條文有疑義時，怎麼解釋？", "back": "原則上作有利於被保險人的解釋。第54條第2項。", "tag": "第2章"}, {"no": "02", "key": "rs02:3", "ref": "54-1", "front": "契約條款免除保險人依法應負的義務，且顯失公平，會怎樣？", "back": "該部分的約定無效（不是整份契約無效）。第54-1條第1款。", "tag": "第2章"}, {"no": "02", "key": "rs02:4", "ref": "55", "front": "契約應記載哪八項？", "back": "當事人姓名住所、標的物、事故種類、責任開始日時及期間、保險金額、保險費、無效及失權原因、訂約年月日。", "tag": "第2章"}, {"no": "02", "key": "rs02:5", "ref": "56", "front": "變更契約的通知，保險人多久不拒絕就視為承諾？", "back": "接到通知後10日內不拒絕，視為承諾（人身保險另有規定的從其規定）。", "tag": "第2章"}, {"no": "02", "key": "rs02:6", "ref": "64", "front": "要保人對書面詢問隱匿或不實說明，保險人可以怎樣？", "back": "足以變更或減少保險人對危險的估計時，保險人得解除契約，危險發生後亦同。", "tag": "第2章"}, {"no": "02", "key": "rs02:7", "ref": "64", "front": "保險人解除權的兩個期限？", "back": "知有解除原因後經過1個月不行使而消滅；契約訂立後經過2年，亦不得解除。", "tag": "第2章"}, {"no": "02", "key": "rs02:8", "ref": "65", "front": "保險契約所生權利的消滅時效？", "back": "自得為請求之日起，2年不行使而消滅。第65條。", "tag": "第2章"}, {"no": "02", "key": "rs02:9", "ref": "22", "front": "為他人利益訂立契約時，保險人對要保人的抗辯，能不能對抗受益人？", "back": "可以。第22條第3項。", "tag": "第2章"}, {"no": "03", "key": "rs03:1", "ref": "105", "front": "第三人訂立死亡保險，需要被保險人做什麼，否則契約怎樣？", "back": "要有被保險人書面同意並約定保險金額，否則契約無效。", "tag": "第3章"}, {"no": "03", "key": "rs03:2", "ref": "105", "front": "被保險人事後撤銷第105條的同意，效果是什麼？", "back": "視為要保人終止保險契約。撤銷要書面通知保險人及要保人。", "tag": "第3章"}, {"no": "03", "key": "rs03:3", "ref": "107", "front": "以未滿15歲的未成年人為被保險人，死亡給付何時生效？", "back": "除喪葬費用外，其餘死亡給付約定於被保險人滿15歲時才生效。", "tag": "第3章"}, {"no": "03", "key": "rs03:4", "ref": "107-1", "front": "以受監護宣告尚未撤銷者為被保險人，死亡給付怎樣？", "back": "除喪葬費用外，其餘死亡給付部分無效。", "tag": "第3章"}, {"no": "03", "key": "rs03:5", "ref": "109", "front": "契約載有『被保險人故意自殺，保險人仍應給付』，這個條款何時生效？", "back": "訂約2年後才生效；復效的契約從復效之日起算2年。", "tag": "第3章"}, {"no": "03", "key": "rs03:6", "ref": "109", "front": "被保險人故意自殺，保險人要不要還保單價值準備金？", "back": "要。不給付保險金，但要把保單價值準備金返還應得之人。", "tag": "第3章"}, {"no": "03", "key": "rs03:7", "ref": "112", "front": "有指定受益人，死亡保險金是不是被保險人遺產？", "back": "不是。第112條。", "tag": "第3章"}, {"no": "03", "key": "rs03:8", "ref": "113", "front": "死亡保險沒指定受益人，保險金怎麼辦？", "back": "作為被保險人的遺產。第113條。", "tag": "第3章"}, {"no": "03", "key": "rs03:9", "ref": "116", "front": "保險費到期未交，催告到達後滿幾日不交付，契約效力停止？", "back": "30日。", "tag": "第3章"}, {"no": "03", "key": "rs03:10", "ref": "116", "front": "停效後幾個月內清償，翌日上午零時恢復效力？", "back": "停效之日起6個月內，清償保險費、約定利息及其他費用。", "tag": "第3章"}, {"no": "03", "key": "rs03:11", "ref": "116", "front": "停效滿6個月後申請復效，保險人要求可保證明的期限和視為同意的期限？", "back": "申請日起5日內可要求可保證明；沒要求或收到證明15日內不拒絕，視為同意復效。", "tag": "第3章"}, {"no": "03", "key": "rs03:12", "ref": "116", "front": "契約約定的復效申請期限，最少是多久？", "back": "自停效日起不得低於2年，且不得遲於保險期間屆滿日。", "tag": "第3章"}, {"no": "03", "key": "rs03:13", "ref": "117", "front": "保險人能不能用訴訟請求交付保險費？", "back": "不能。人壽保險的保險人不得以訴訟請求交付保險費。", "tag": "第3章"}, {"no": "03", "key": "rs03:14", "ref": "119", "front": "要保人終止契約的解約金：付足幾年、多久內給付、金額下限？", "back": "付足1年以上；接到通知後1個月內償付；不少於應得保單價值準備金的四分之三。", "tag": "第3章"}, {"no": "03", "key": "rs03:15", "ref": "120", "front": "保單質借需要保險費付足多久？保險人多久內貸給？", "back": "付足1年以上；接到借款通知後1個月以內。", "tag": "第3章"}, {"no": "03", "key": "rs03:16", "ref": "121", "front": "受益人故意致被保險人於死，會怎樣？", "back": "喪失受益權；沒有受益人可領時，保險金額作為被保險人遺產。", "tag": "第3章"}, {"no": "03", "key": "rs03:17", "ref": "122", "front": "被保險人年齡不實且真實年齡已超過保險年齡限度，契約怎樣？", "back": "契約無效，保險人退還所繳保險費。", "tag": "第3章"}, {"no": "03", "key": "rs03:18", "ref": "123-1", "front": "債務人要保人的解約金債權，什麼範圍內不得扣押？", "back": "不超過最近一年公告每人每月最低生活費1.2倍計算之6個月金額中最高標準者；另外主管機關公告的基本保障保單也不得扣押。", "tag": "第3章"}, {"no": "03", "key": "rs03:19", "ref": "123-2", "front": "債務人保單被扣押時，誰可以變更為新要保人？通知期限？", "back": "有保險利益者、要保人指定的受益人、要保人或被保險人的配偶父母子女；需書面同意並支付解約金額度；事由發生3個月內通知。", "tag": "第3章"}, {"no": "03", "key": "rs03:20", "ref": "124", "front": "誰對被保險人的保單價值準備金有優先受償權？", "back": "人壽保險的要保人、被保險人、受益人。", "tag": "第3章"}, {"no": "04", "key": "rs04:1", "ref": "125", "front": "健康保險人在哪些情況負給付責任？", "back": "被保險人疾病、分娩，以及所導致的失能或死亡。", "tag": "第4章"}, {"no": "04", "key": "rs04:2", "ref": "126", "front": "訂約前的健康檢查費用由誰負擔？", "back": "保險人。第126條。", "tag": "第4章"}, {"no": "04", "key": "rs04:3", "ref": "127", "front": "訂約時被保險人已在疾病或妊娠中，對那項疾病或分娩，保險人要賠嗎？", "back": "不賠。第127條。", "tag": "第4章"}, {"no": "04", "key": "rs04:4", "ref": "131", "front": "意外傷害的定義？", "back": "非由疾病引起的外來突發事故所致者。", "tag": "第4章"}, {"no": "04", "key": "rs04:5", "ref": "133", "front": "傷害保險不賠哪兩種情形？", "back": "被保險人故意自殺；因犯罪行為所致傷害、失能或死亡。", "tag": "第4章"}, {"no": "04", "key": "rs04:6", "ref": "134", "front": "受益人故意傷害被保險人但未遂，被保險人可以做什麼？", "back": "撤銷他的受益權利。已傷害者則無請求保險金額的權利。", "tag": "第4章"}, {"no": "04", "key": "rs04:7", "ref": "135-1", "front": "年金保險人的給付責任是什麼？", "back": "被保險人生存期間或特定期間內，依契約一次或分期給付一定金額。", "tag": "第4章"}, {"no": "04", "key": "rs04:8", "ref": "135-3", "front": "年金保險中，被保險人生存期間的受益人是誰？", "back": "被保險人本人。", "tag": "第4章"}, {"no": "04", "key": "rs04:9", "ref": "135-4", "front": "年金給付期間，要保人可以終止契約或質借嗎？", "back": "不可以。第135-4條但書。", "tag": "第4章"}, {"no": "04", "key": "rs04:10", "ref": "130", "front": "健康保險準用人壽保險的哪些條文？", "back": "102至105、115、116、122、123、124。", "tag": "第4章"}, {"no": "04", "key": "rs04:11", "ref": "135", "front": "傷害保險有沒有準用第107條（未滿15歲）？", "back": "有。第135條準用第107條與第107-1條。", "tag": "第4章"}, {"no": "04", "key": "rs04:12", "ref": "129-1", "front": "債務人要保人的健康保險解約金債權，能不能被扣押？", "back": "不能。第129-1條（民國114年新增）。", "tag": "第4章"}, {"no": "05", "key": "rs05:1", "ref": "規3", "front": "沒登錄、沒領登錄證，能不能替所屬公司招攬保險？", "back": "不能。", "tag": "第5章"}, {"no": "05", "key": "rs05:2", "ref": "規5", "front": "取得業務員資格的學歷條件？", "back": "成年，高中（職）以上學校畢業或同等學歷，並符合測驗合格等條件之一。", "tag": "第5章"}, {"no": "05", "key": "rs05:3", "ref": "規6", "front": "招攬保險時業務員要先做什麼？", "back": "出示登錄證並告知授權範圍（主管機關另有規定者除外）。", "tag": "第5章"}, {"no": "05", "key": "rs05:4", "ref": "規9", "front": "登錄證有效期間？", "back": "5年，期滿前要辦換發，未辦妥前不得招攬。", "tag": "第5章"}, {"no": "05", "key": "rs05:5", "ref": "規13", "front": "業務員不參加教育訓練，會怎樣？", "back": "所屬公司要撤銷其業務員登錄。", "tag": "第5章"}, {"no": "05", "key": "rs05:6", "ref": "規14", "front": "人身保險業務員可不可以另外登錄另一家人身保險公司？", "back": "不可以。可另外登錄的只限『非經營同類保險業務』的公司，且以一家為限。", "tag": "第5章"}, {"no": "05", "key": "rs05:7", "ref": "規15", "front": "招攬人身保險商品，要親晤誰？", "back": "要保人及被保險人（主管機關另有規定者除外）。", "tag": "第5章"}, {"no": "05", "key": "rs05:8", "ref": "規15", "front": "業務員在要保書上要做什麼？", "back": "親自簽名並記載登錄字號。", "tag": "第5章"}, {"no": "05", "key": "rs05:9", "ref": "規16", "front": "文宣、建議書的內容要符合什麼？", "back": "與保險業報主管機關審查通過的保單條款、費率、要保書相符，且經所屬公司核可，並符合資訊揭露規範。", "tag": "第5章"}, {"no": "05", "key": "rs05:10", "ref": "規19", "front": "第19條的處分是什麼？", "back": "依情節輕重，一年以下停止招攬行為；有犯罪嫌疑的要移送偵辦。", "tag": "第5章"}, {"no": "05", "key": "rs05:11", "ref": "規19", "front": "最近5年內停止招攬期間累計達多久，要撤銷登錄？", "back": "累計達2年，所屬公司應撤銷其業務員登錄。", "tag": "第5章"}, {"no": "05", "key": "rs05:12", "ref": "規19", "front": "『代要保人簽章』屬於第19條哪類行為？", "back": "第7款：代要保人或被保險人簽章，或未經同意或授權填寫有關保險契約文件。", "tag": "第5章"}, {"no": "05", "key": "rs05:13", "ref": "規19-1", "front": "業務員不服處分，申復和覆核的期限？", "back": "申復：處分通知到達日起1個月內；覆核：收到復查結果日起3個月內。各以一次為限。", "tag": "第5章"}, {"no": "05", "key": "rs05:14", "ref": "規7", "front": "第7條中，哪一款的犯罪期限是『5年』？", "back": "第3款：組織犯罪防制條例之罪。其他犯罪與債信都是3年。", "tag": "第5章"}, {"no": "06", "key": "rs06:1", "ref": "3", "front": "金融服務業包括哪些行業？", "back": "銀行業、證券業、期貨業、保險業、電子支付業及主管機關公告的其他金融服務業。", "tag": "第6章"}, {"no": "06", "key": "rs06:2", "ref": "4", "front": "哪兩類人不算金融消費者？", "back": "專業投資機構，以及符合一定財力或專業能力的自然人或法人。", "tag": "第6章"}, {"no": "06", "key": "rs06:3", "ref": "7", "front": "金融服務業與消費者的契約條款有疑義時，怎麼解釋？", "back": "作有利於金融消費者的解釋。", "tag": "第6章"}, {"no": "06", "key": "rs06:4", "ref": "8", "front": "金融服務業可以藉金融教育宣導引薦個別金融商品嗎？", "back": "不可以。第8條第3項。", "tag": "第6章"}, {"no": "06", "key": "rs06:5", "ref": "9", "front": "第9條『適合度』要求金融服務業在訂約前做什麼？", "back": "充分了解消費者的相關資料，確保商品或服務對消費者的適合度。", "tag": "第6章"}, {"no": "06", "key": "rs06:6", "ref": "10", "front": "第10條的說明內容至少要包括什麼？", "back": "交易成本、可能的收益及風險等有關消費者權益的重要內容。", "tag": "第6章"}, {"no": "06", "key": "rs06:7", "ref": "10", "front": "複雜性高風險商品的說明揭露，原則上要怎麼留存？", "back": "錄音或錄影（非臨櫃的自動化通路交易、消費者不同意者除外）。", "tag": "第6章"}, {"no": "06", "key": "rs06:8", "ref": "11", "front": "違反第9、10條致消費者受損害，誰要證明什麼？", "back": "金融服務業要證明損害的發生非因其未了解適合度，或未說明、說明不實、未充分揭露風險。", "tag": "第6章"}, {"no": "06", "key": "rs06:9", "ref": "11-1", "front": "業務人員酬金制度不能只考量什麼？", "back": "業績目標達成情形；要衡平考量客戶權益與各項風險。", "tag": "第6章"}, {"no": "06", "key": "rs06:10", "ref": "11-3", "front": "懲罰性賠償：故意與過失的上限？", "back": "故意：損害額3倍以下；過失：1倍以下。", "tag": "第6章"}, {"no": "06", "key": "rs06:11", "ref": "13", "front": "金融服務業收到申訴後，幾日內要處理並回覆？", "back": "30日內。", "tag": "第6章"}, {"no": "06", "key": "rs06:12", "ref": "13", "front": "不接受處理結果，申請評議的期限？", "back": "收受處理結果或期限屆滿之日起60日內，向爭議處理機構申請。", "tag": "第6章"}, {"no": "06", "key": "rs06:13", "ref": "30", "front": "評議成立後多久內可申請送法院核可？", "back": "90日的不變期間。", "tag": "第6章"}, {"no": "06", "key": "rs06:14", "ref": "30-1", "front": "一般違反廣告、適合度、說明義務的罰鍰範圍？", "back": "新臺幣30萬元以上1,000萬元以下。", "tag": "第6章"}, {"no": "07", "key": "rs07:1", "ref": "2", "front": "個資法的『蒐集』是什麼意思？", "back": "以任何方式取得個人資料。", "tag": "第7章"}, {"no": "07", "key": "rs07:2", "ref": "2", "front": "個資法的『利用』是什麼意思？", "back": "把蒐集的個人資料做處理以外的使用。", "tag": "第7章"}, {"no": "07", "key": "rs07:3", "ref": "5", "front": "蒐集、處理、利用個資的基本原則？", "back": "尊重當事人權益、誠實及信用方法、不逾特定目的必要範圍、與目的有正當合理關聯。", "tag": "第7章"}, {"no": "07", "key": "rs07:4", "ref": "6", "front": "第6條限制的六類敏感資料？", "back": "病歷、醫療、基因、性生活、健康檢查、犯罪前科。", "tag": "第7章"}, {"no": "07", "key": "rs07:5", "ref": "6", "front": "敏感資料原則上可不可以蒐集？有哪個例外和保險業務最相關？", "back": "原則不可以；例外之一是經當事人書面同意。", "tag": "第7章"}, {"no": "07", "key": "rs07:6", "ref": "7", "front": "目的外利用的『同意』，有什麼特別要件？", "back": "要明確告知其他利用目的、範圍及同意與否對權益的影響後，『單獨』所為之意思表示。", "tag": "第7章"}, {"no": "07", "key": "rs07:7", "ref": "7", "front": "『經當事人同意』的舉證責任在誰？", "back": "蒐集者。第7條第4項。", "tag": "第7章"}, {"no": "07", "key": "rs07:8", "ref": "8", "front": "向當事人蒐集個資，要告知哪六項？", "back": "名稱、蒐集目的、個資類別、利用期間地區對象方式、當事人權利及行使方式、不提供的影響。", "tag": "第7章"}, {"no": "07", "key": "rs07:9", "ref": "9", "front": "個資不是當事人提供的，要告知什麼？", "back": "個資來源，以及第8條第1項第1至5款事項；可在首次利用時一併告知。", "tag": "第7章"}, {"no": "07", "key": "rs07:10", "ref": "19", "front": "非公務機關蒐集或處理個資，第2款的合法依據是？", "back": "與當事人有契約或類似契約的關係，且已採取適當的安全措施。", "tag": "第7章"}, {"no": "07", "key": "rs07:11", "ref": "20", "front": "當事人表示拒絕接受行銷，非公務機關要怎麼做？", "back": "要立即停止利用其個人資料行銷。", "tag": "第7章"}, {"no": "07", "key": "rs07:12", "ref": "29", "front": "非公務機關違反個資法致當事人受害，什麼情況可免賠償責任？", "back": "能證明其無故意或過失。", "tag": "第7章"}, {"no": "07", "key": "rs07:13", "ref": "30", "front": "個資法損害賠償請求權的時效？", "back": "知有損害及賠償義務人時起2年；自損害發生時起逾5年亦消滅。", "tag": "第7章"}, {"no": "07", "key": "rs07:14", "ref": "保177-1", "front": "保險業蒐集病歷、醫療、健康檢查資料，需要什麼？", "back": "本人書面同意。", "tag": "第7章"}, {"no": "08", "key": "rs08:1", "ref": "2", "front": "洗錢的四種行為？", "back": "隱匿或掩飾來源；妨礙追查與沒收；收受、持有或使用他人特定犯罪所得；使用自己的特定犯罪所得與他人交易。", "tag": "第8章"}, {"no": "08", "key": "rs08:2", "ref": "5", "front": "保險公司是不是洗錢防制法的金融機構？", "back": "是。第5條第1項第10款。", "tag": "第8章"}, {"no": "08", "key": "rs08:3", "ref": "7", "front": "洗錢防制內部控制制度要包括哪些？", "back": "作業及控制程序、在職訓練、專責人員、風險評估報告、稽核程序、其他主管機關指定事項。", "tag": "第8章"}, {"no": "08", "key": "rs08:4", "ref": "8", "front": "確認客戶身分資料至少保存幾年？從何時起算？", "back": "至少5年；自業務關係終止時（臨時性交易為終止時）起算。", "tag": "第8章"}, {"no": "08", "key": "rs08:5", "ref": "8", "front": "確認客戶身分要包含什麼審查？", "back": "實質受益人的審查，並以風險為基礎。", "tag": "第8章"}, {"no": "08", "key": "rs08:6", "ref": "8", "front": "對現任或曾任重要政治性職務的人，要做什麼？", "back": "以風險為基礎，執行加強客戶審查程序。", "tag": "第8章"}, {"no": "08", "key": "rs08:7", "ref": "10", "front": "交易紀錄至少保存幾年？從何時起算？", "back": "至少5年；自交易完成時起算。", "tag": "第8章"}, {"no": "08", "key": "rs08:8", "ref": "12", "front": "達一定金額的通貨交易要向誰申報？", "back": "法務部調查局。一定金額由辦法訂定。", "tag": "第8章"}, {"no": "08", "key": "rs08:9", "ref": "13", "front": "疑似洗錢交易，交易未完成時要不要申報？", "back": "要。第13條第1項後段。", "tag": "第8章"}, {"no": "08", "key": "rs08:10", "ref": "19", "front": "洗錢財物達新臺幣1億元以上的刑度？", "back": "3年以上10年以下有期徒刑，併科1億元以下罰金。", "tag": "第8章"}, {"no": "08", "key": "rs08:11", "ref": "19", "front": "洗錢財物未達新臺幣1億元的刑度？", "back": "6月以上5年以下有期徒刑，併科5,000萬元以下罰金。", "tag": "第8章"}, {"no": "08", "key": "rs08:12", "ref": "22", "front": "交付帳戶給他人使用，達什麼情況會進入刑責？", "back": "期約或收受對價；帳戶合計3個以上；或經警察機關裁處後5年內再犯。", "tag": "第8章"}, {"no": "08", "key": "rs08:13", "ref": "7", "front": "金融機構違反第7、8、10、12、13條義務，罰鍰範圍？", "back": "新臺幣50萬元以上1,000萬元以下，並得按次處罰。", "tag": "第8章"}], "scen": [{"no": "01", "ref": "16", "q": "甲把自己的公司委託乙經營。依保險法第16條，下列何者正確？", "opts": ["甲對乙有保險利益", "乙對甲有保險利益", "兩人互有保險利益", "兩人互無保險利益"], "ans": 0, "why": "第16條第4款：要保人對『為本人管理財產或利益之人』有保險利益。甲是要保人，乙替甲管理公司，所以是甲對乙有。條文方向是要保人對被保人，不是雙向。", "tag": "第1章"}, {"no": "01", "ref": "16", "q": "老陳每月提供生活費給阿明。若阿明是要保人，依第16條？", "opts": ["阿明對老陳有保險利益", "老陳對阿明有保險利益", "兩人互有保險利益", "兩人互無保險利益"], "ans": 0, "why": "第16條第2款：生活費所仰給之人。阿明的生活費靠老陳供給，阿明（要保人）對老陳有保險利益。反過來老陳是提供者，不在第2款內。", "tag": "第1章"}, {"no": "01", "ref": "16", "q": "張三是要保人，下列何者的生命或身體，張三沒有被第16條列為有保險利益？", "opts": ["張三本人", "欠張三錢的王老五", "借錢給張三的李四", "張三的配偶"], "ans": 2, "why": "李四是借錢給張三的債權人，張三是李四的債務人，反過來。第16條第3款列的是要保人的『債務人』（欠要保人錢的人），不是要保人的債權人。", "tag": "第1章"}, {"no": "01", "ref": "17", "q": "要保人對保險標的物沒有保險利益時，保險法第17條規定契約怎麼樣？", "opts": ["失其效力", "自始無效", "得撤銷", "效力不受影響"], "ans": 0, "why": "第17條用語是『失其效力』。『無效』是另外的條文用語（例如第105條）。", "tag": "第1章"}, {"no": "01", "ref": "3", "q": "依第3條，下列哪一項不是要保人的要件？", "opts": ["對保險標的有保險利益", "向保險人申請訂立契約", "負有交付保險費義務", "於保險事故發生時遭受損害"], "ans": 3, "why": "『保險事故發生時遭受損害、享有賠償請求權』是被保險人的定義（第4條），不是要保人的要件。", "tag": "第1章"}, {"no": "01", "ref": "8", "q": "依保險法，『基於被保險人之利益，洽訂保險契約並收取佣金或報酬』的人是？", "opts": ["保險代理人", "保險經紀人", "保險業務員", "保險公證人"], "ans": 1, "why": "第9條：保險經紀人基於被保險人之利益洽訂契約，收取佣金或報酬。代理人是向保險人收取費用並代理經營業務（第8條）。", "tag": "第1章"}, {"no": "02", "ref": "64", "q": "甲投保時，對保險公司書面詢問的疾病故意隱匿。契約訂立滿3年後才出險，保險公司發現隱匿。依第64條，保險人可不可以解除契約？", "opts": ["可以，因為是故意隱匿", "不可以，因為契約訂立後已超過2年", "可以，只要在知道後1個月內行使", "不可以，因為已經出險"], "ans": 1, "why": "第64條第3項：契約訂立後經過2年，即有可以解除的原因，亦不得解除契約。超過2年就不能解除，條文沒有區分故意或過失。選項3雖然提到1個月，但2年的限制是另一道關卡，兩道期限都要符合。", "tag": "第2章"}, {"no": "02", "ref": "64", "q": "保險人發現要保人告知不實，已經超過1個月才主張解除。依第64條？", "opts": ["仍可解除，因為還沒滿2年", "不得解除，因為自知有解除原因後經過1個月不行使而消滅", "只能解除一部分", "由要保人決定"], "ans": 1, "why": "第64條第3項：解除權自保險人知有解除原因後，經過1個月不行使而消滅。1個月和2年是兩個獨立的期限。", "tag": "第2章"}, {"no": "02", "ref": "54-1", "q": "某保險契約條款規定：被保險人不得依保險法主張某項法定權利，且依訂約時情形顯失公平。該條款的效力？", "opts": ["整份契約無效", "該部分約定無效", "有效，因為雙方簽名同意", "效力未定"], "ans": 1, "why": "第54-1條第2款：使要保人、受益人或被保險人拋棄或限制其依本法所享的權利，且顯失公平者，『該部分』的約定無效，不是整份契約。", "tag": "第2章"}, {"no": "02", "ref": "54", "q": "保險契約條款文字有兩種合理解釋，法律上的原則是？", "opts": ["作有利於保險人的解釋", "作有利於被保險人的解釋", "契約無效", "由法院抽籤"], "ans": 1, "why": "第54條第2項：有疑義時，以作有利於被保險人之解釋為原則。", "tag": "第2章"}, {"no": "02", "ref": "56", "q": "要保人通知保險人要變更保險契約的內容，保險人接到通知後10日內不為拒絕。依第56條？", "opts": ["視為拒絕", "視為承諾", "契約失效", "須再經被保險人同意"], "ans": 1, "why": "第56條：接到通知後10日內不為拒絕者，視為承諾。但人身保險另有特別規定的，從其規定。", "tag": "第2章"}, {"no": "02", "ref": "65", "q": "依第65條，由保險契約所生的權利，原則上自得為請求之日起幾年不行使而消滅？", "opts": ["1年", "2年", "5年", "10年"], "ans": 1, "why": "第65條：2年。", "tag": "第2章"}, {"no": "03", "ref": "105", "q": "太太以先生為被保險人投保死亡保險，沒有取得先生的書面同意，也沒有約定保險金額。依第105條，契約效力？", "opts": ["有效，因為太太對先生有保險利益", "無效", "效力停止", "得解除"], "ans": 1, "why": "第105條：由第三人訂立的死亡保險契約，未經被保險人書面同意，並約定保險金額，契約無效。有保險利益（第16條）還不夠，這是另一道關卡。", "tag": "第3章"}, {"no": "03", "ref": "105", "q": "先生曾書面同意太太以他為被保險人投保死亡險，之後書面通知保險人和太太撤銷同意。效果？", "opts": ["同意撤銷無效", "視為要保人終止保險契約", "契約解除", "契約失效"], "ans": 1, "why": "第105條第2、3項：同意可隨時撤銷，撤銷方式是書面通知保險人及要保人；被保險人行使撤銷權，視為要保人終止保險契約。", "tag": "第3章"}, {"no": "03", "ref": "107", "q": "父母為6歲小孩投保人壽保險，死亡保險金額很高。依第107條，小孩在7歲時死亡？", "opts": ["全部死亡給付都要給", "除喪葬費用外，其餘死亡給付約定尚未生效", "契約全部無效", "只退保費"], "ans": 1, "why": "第107條：除了喪葬費用的給付外，其餘死亡給付的約定，於被保險人滿15歲時始生效力。7歲死亡時尚未滿15歲，只有喪葬費用部分能給付，且不得超過遺產稅喪葬費扣除額的一半。", "tag": "第3章"}, {"no": "03", "ref": "109", "q": "保險契約載有『被保險人故意自殺，保險人仍應給付保險金』。被保險人訂約滿1年自殺。依第109條？", "opts": ["保險人仍須給付，因為契約有約定", "不須給付，因為該條款要訂約2年後才生效", "契約無效", "只給付一半"], "ans": 1, "why": "第109條第2項：自殺仍給付的條款，於訂約2年後始生效力。滿1年自殺尚未生效，保險人不給付保險金，但要返還保單價值準備金。", "tag": "第3章"}, {"no": "03", "ref": "116", "q": "要保人未繳保費，催告到達後經過30日仍未繳，契約效力？", "opts": ["自始無效", "停止效力（停效）", "保險人須立即終止", "不受影響"], "ans": 1, "why": "第116條第1項：經催告到達後屆30日仍不交付時，保險契約的效力停止。", "tag": "第3章"}, {"no": "03", "ref": "116", "q": "契約停效後第4個月，要保人清償保險費、約定利息及其他費用。契約何時恢復效力？", "opts": ["保險人同意後", "清償的翌日上午零時", "一個月後", "提供可保證明後"], "ans": 1, "why": "第116條第3項：停效日起6個月內清償，翌日上午零時起開始恢復效力，不需可保證明。", "tag": "第3章"}, {"no": "03", "ref": "119", "q": "保費已付足1年以上，要保人終止保險契約。依第119條，解約金不得少於？", "opts": ["保單價值準備金的二分之一", "保單價值準備金的四分之三", "已繳保險費全額", "保險金額的百分之一"], "ans": 1, "why": "第119條：金額不得少於要保人應得保單價值準備金的四分之三；保險人要在接到通知後1個月內償付。", "tag": "第3章"}, {"no": "03", "ref": "113", "q": "死亡保險契約未指定受益人，被保險人死亡。保險金額？", "opts": ["給要保人", "作為被保險人的遺產", "歸保險人所有", "解交國庫"], "ans": 1, "why": "第113條：死亡保險契約未指定受益人者，其保險金額作為被保險人的遺產。", "tag": "第3章"}, {"no": "03", "ref": "122", "q": "被保險人投保時謊報年齡，真實年齡已超過保險人所定的保險年齡限度。依第122條？", "opts": ["契約有效，補繳保費", "契約無效，保險人退還所繳保險費", "按比例減少保險金額", "保險人得解除契約"], "ans": 1, "why": "第122條第1項：真實年齡已超過保險年齡限度，契約無效，保險人退還所繳保險費。按比例減額、補繳是『少繳保費但年齡仍在限度內』的處理。", "tag": "第3章"}, {"no": "03", "ref": "121", "q": "受益人甲故意傷害被保險人，被保險人未死亡。甲的受益權？", "opts": ["不受影響", "喪失受益權", "減半", "由保險人決定"], "ans": 1, "why": "第121條第1項：受益人故意致被保險人於死，或雖未致死者，喪失其受益權。", "tag": "第3章"}, {"no": "04", "ref": "131", "q": "下列何者最符合保險法第131條的『意外傷害』？", "opts": ["因長期高血壓引起的中風", "非由疾病引起的外來突發事故所致的傷害", "因老化造成的關節退化", "因慢性病惡化而死亡"], "ans": 1, "why": "第131條第2項：意外傷害指非由疾病引起的外來突發事故所致者。其他選項都是疾病或內在因素。", "tag": "第4章"}, {"no": "04", "ref": "127", "q": "甲投保健康保險時，已知自己有某項疾病。投保後該疾病住院。依第127條？", "opts": ["保險人須給付", "保險人對該項疾病不負給付責任", "契約自始無效", "保險人應退費並解除契約"], "ans": 1, "why": "第127條：契約訂立時被保險人已在疾病或妊娠情況中者，保險人對該疾病或分娩不負給付責任。", "tag": "第4章"}, {"no": "04", "ref": "133", "q": "傷害保險的被保險人因犯罪行為受傷。依第133條？", "opts": ["保險人仍須給付", "保險人不負給付責任", "保險人應返還保單價值準備金", "減半給付"], "ans": 1, "why": "第133條：因犯罪行為所致傷害、失能或死亡，保險人不負給付責任。傷害保險這條沒有返還準備金的規定。", "tag": "第4章"}, {"no": "04", "ref": "134", "q": "傷害保險的受益人故意傷害被保險人，但未遂。被保險人可以？", "opts": ["不能做任何事", "撤銷其受益權利", "終止保險契約", "要求保險人加倍賠償"], "ans": 1, "why": "第134條第2項：受益人故意傷害被保險人未遂時，被保險人得撤銷其受益權利。", "tag": "第4章"}, {"no": "04", "ref": "135-4", "q": "年金保險在年金給付期間，要保人可以怎樣？", "opts": ["隨時終止契約", "不能終止契約，也不能質借", "可以質借但不能終止", "可以終止但不能質借"], "ans": 1, "why": "第135-4條但書：於年金給付期間，要保人不得終止契約或以保險契約為質向保險人借款。", "tag": "第4章"}, {"no": "04", "ref": "130", "q": "下列哪一條人壽保險的規定，依保險法第130條，不在健康保險的準用範圍內？", "opts": ["第115條（利害關係人代繳保費）", "第116條（催告、停效、復效）", "第119條（解約金）", "第122條（年齡不實）"], "ans": 2, "why": "第130條準用102至105、115、116、122、123、124。第119條解約金不在內。", "tag": "第4章"}, {"no": "04", "ref": "135", "q": "依第135條，傷害保險準用人壽保險的哪一組規定？", "opts": ["第107條與第107-1條（未成年人、受監護宣告者）", "第117條至第121條", "第122條（年齡不實）", "以上皆是"], "ans": 0, "why": "第135條準用102至105、107、107-1、110至116、123、124及125條第2項。第117條以後的減額、解約金、質借，以及第122條年齡不實，都不在內。", "tag": "第4章"}, {"no": "05", "ref": "規19", "q": "業務員為了加快作業，代客戶在要保書上簽名。依管理規則第19條，這屬於？", "opts": ["不構成違規", "停止招攬行為處分的情形（第7款）", "只需口頭警告", "應註銷登錄，但不需處分"], "ans": 1, "why": "第19條第7款：代要保人或被保險人簽章，或未經其同意或授權填寫有關保險契約文件，屬於應處一年以下停止招攬行為的情形。", "tag": "第5章"}, {"no": "05", "ref": "規19", "q": "業務員最近5年內，受停止招攬行為處分的期間累計達2年。所屬公司應？", "opts": ["給予口頭勸導", "撤銷其業務員登錄", "再停止招攬一年", "不得處分"], "ans": 1, "why": "第19條第3項：最近5年內受停止招攬行為處分期間累計達2年者，所屬公司應予撤銷其業務員登錄處分。", "tag": "第5章"}, {"no": "05", "ref": "規15", "q": "招攬涉及人身保險的商品，業務員原則上要怎麼做？", "opts": ["只要電話確認即可", "親晤要保人及被保險人", "只要親晤要保人", "委託其他業務員代為面談"], "ans": 1, "why": "第15條第4項：業務員招攬涉及人身保險的商品，應親晤要保人及被保險人，主管機關另有規定者不在此限。", "tag": "第5章"}, {"no": "05", "ref": "規14", "q": "甲是人身保險公司的業務員，想再登錄另一家人身保險公司。依第14條？", "opts": ["可以，不限家數", "可以，但以一家為限", "不可以，因為是同類保險業務", "須經要保人同意"], "ans": 2, "why": "第14條第2項：只能登錄於另一家『非經營同類保險業務』的公司，以一家為限。同為人身保險是同類（第2條第5款），所以不行。", "tag": "第5章"}, {"no": "05", "ref": "規13", "q": "業務員教育訓練成績不合格，一年內再補訓成績仍不合格。依第13條？", "opts": ["繼續登錄", "所屬公司應撤銷其業務員登錄", "停止招攬一年", "罰款"], "ans": 1, "why": "第13條第2項：參加教育訓練成績不合格，於一年內再行補訓成績仍不合格者，也撤銷登錄。", "tag": "第5章"}, {"no": "05", "ref": "規9", "q": "業務員登錄證的有效期間是？", "opts": ["1年", "3年", "5年", "10年"], "ans": 2, "why": "第9條：業務員登錄證有效期間為5年，應於期滿前辦妥換發。", "tag": "第5章"}, {"no": "05", "ref": "規19-1", "q": "業務員不服撤銷登錄處分，第一步應在處分通知到達之日起多久內，向誰申復？", "opts": ["1個月內，向原處分公司", "3個月內，向公會", "1個月內，向主管機關", "6個月內，向法院"], "ans": 0, "why": "第19-1條第1項：處分通知到達之日起1個月內，以書面具明理由向原處分公司申復，以一次為限。對結果有異議再於3個月內向公會申訴委員會申請覆核。", "tag": "第5章"}, {"no": "05", "ref": "規7", "q": "業務員曾犯組織犯罪防制條例之罪，有罪判決確定，執行完畢後尚未逾幾年，不得登錄？", "opts": ["1年", "3年", "5年", "10年"], "ans": 2, "why": "第7條第3款：組織犯罪防制條例之罪，執行完畢、緩刑期滿或赦免後尚未逾5年。偽造文書、侵占、詐欺、背信罪（第4款）才是3年。", "tag": "第5章"}, {"no": "06", "ref": "9", "q": "保險公司在客戶投保前，沒有了解客戶的財務狀況與需求，就推薦高風險商品。主要違反金融消費者保護法哪一條？", "opts": ["第9條（適合度）", "第13條（申訴）", "第29條（評議成立）", "第30條（法院核可）"], "ans": 0, "why": "第9條：訂約前要充分了解消費者相關資料，確保商品對消費者的適合度。", "tag": "第6章"}, {"no": "06", "ref": "11", "q": "客戶主張保險公司未充分說明風險而受損失。依第11條，誰要證明損害與未說明無關？", "opts": ["客戶", "金融服務業", "法院", "主管機關"], "ans": 1, "why": "第11條但書：金融服務業能證明損害的發生非因其未說明、說明不實、錯誤或未充分揭露風險者，才免責。舉證責任在金融服務業。", "tag": "第6章"}, {"no": "06", "ref": "13", "q": "客戶向保險公司申訴，公司逾30日都不處理。客戶下一步？", "opts": ["只能等待", "自期限屆滿之日起60日內向爭議處理機構申請評議", "直接申請法院核可", "向業務員索賠"], "ans": 1, "why": "第13條第2項：金融服務業逾期不處理者，消費者可於期限屆滿之日起60日內向爭議處理機構申請評議。", "tag": "第6章"}, {"no": "06", "ref": "11-3", "q": "金融服務業因故意違反本法造成損害，法院可酌定懲罰性賠償最高為損害額的？", "opts": ["1倍", "2倍", "3倍", "5倍"], "ans": 2, "why": "第11-3條：故意：損害額3倍以下；過失：1倍以下。", "tag": "第6章"}, {"no": "06", "ref": "30", "q": "評議成立後，消費者要申請爭議處理機構把評議書送法院核可，期限是？", "opts": ["30日", "60日", "90日", "1年"], "ans": 2, "why": "第30條第1項：評議成立之日起90日的不變期間。", "tag": "第6章"}, {"no": "06", "ref": "10", "q": "依第10條，下列哪一項不是說明內容必須包括的？", "opts": ["交易成本", "可能的收益", "風險", "業務員的酬金金額"], "ans": 3, "why": "第10條第3項：說明及揭露內容包括交易成本、可能收益及風險等有關消費者權益的重要內容。酬金制度是第11-1條，由金融服務業內部制定，不是向消費者說明的必備項目。", "tag": "第6章"}, {"no": "06", "ref": "4", "q": "金融服務業協助未符合資格的客戶，創造符合專業投資人的形式外觀。該客戶仍是？", "opts": ["專業投資人", "金融消費者", "無需保護", "由業務員決定"], "ans": 1, "why": "第4條第3項：仍為本法所稱金融消費者。金融服務業還會被處1,000萬元以上5,000萬元以下罰鍰（第30-1條第2項）。", "tag": "第6章"}, {"no": "06", "ref": "30-1", "q": "金融服務業違反第10條，未充分說明並揭露風險。罰鍰範圍？", "opts": ["新臺幣1萬至10萬", "新臺幣30萬至1,000萬", "新臺幣1,000萬至5,000萬", "不處罰鍰"], "ans": 1, "why": "第30-1條第1項第3款：違反第10條第1項，處30萬元以上1,000萬元以下罰鍰。", "tag": "第6章"}, {"no": "07", "ref": "6", "q": "下列何者屬於個資法第6條原則上不得蒐集的資料？", "opts": ["聯絡電話", "職業", "健康檢查資料", "出生年月日"], "ans": 2, "why": "第6條列的六類：病歷、醫療、基因、性生活、健康檢查、犯罪前科。聯絡電話、職業、出生年月日屬第2條的一般個人資料，不是第6條的敏感資料。", "tag": "第7章"}, {"no": "07", "ref": "保177-1", "q": "保險公司要蒐集被保險人的病歷作為核保依據。最符合保險法第177-1條的做法是？", "opts": ["不需同意，直接向醫院調閱", "經本人書面同意後蒐集", "由業務員口頭徵得同意即可", "向其家屬取得同意"], "ans": 1, "why": "保險法第177-1條第1項：經本人書面同意，得蒐集、處理或利用病歷、醫療、健康檢查的個人資料。", "tag": "第7章"}, {"no": "07", "ref": "8", "q": "向當事人蒐集個資時，下列哪一項不在第8條第1項要明確告知的六項裡面？", "opts": ["蒐集的目的", "個人資料的類別", "當事人不提供個資對其權益的影響", "資料處理人員的薪資"], "ans": 3, "why": "第8條第1項六款：名稱、目的、類別、利用期間地區對象方式、權利及行使方式、不提供的影響。薪資不在內。", "tag": "第7章"}, {"no": "07", "ref": "9", "q": "保險公司從第三方取得客戶資料。依第9條，應於何時告知當事人資料來源等事項？", "opts": ["蒐集後三個月內", "處理或利用前（可在首次利用時一併）", "客戶要求時", "不需告知"], "ans": 1, "why": "第9條第1項：處理或利用前告知；第3項：可於首次對當事人利用時併同為之。", "tag": "第7章"}, {"no": "07", "ref": "20", "q": "客戶明確表示不再接受行銷訊息。業務員所屬公司依第20條第2項應？", "opts": ["可繼續行銷一年", "立即停止利用其個人資料行銷", "改由業務員私下聯絡", "徵詢主管同意"], "ans": 1, "why": "第20條第2項：當事人表示拒絕接受行銷時，應即停止利用其個人資料行銷。", "tag": "第7章"}, {"no": "07", "ref": "7", "q": "個資法第7條對『經當事人同意』的舉證責任規定在？", "opts": ["當事人", "蒐集者", "法院", "主管機關"], "ans": 1, "why": "第7條第4項：蒐集者就本法所稱經當事人同意的事實，應負舉證責任。", "tag": "第7章"}, {"no": "07", "ref": "30", "q": "個資法損害賠償請求權，從損害發生時起，超過幾年亦消滅？", "opts": ["2年", "3年", "5年", "10年"], "ans": 2, "why": "第30條：知有損害及賠償義務人時起2年；自損害發生時起逾5年者亦同。", "tag": "第7章"}, {"no": "07", "ref": "29", "q": "非公務機關違反個資法致當事人受損害，哪種情況可免賠償？", "opts": ["當事人沒有請求", "能證明無故意或過失", "已道歉", "金額很小"], "ans": 1, "why": "第29條：能證明其無故意或過失者，不在此限。", "tag": "第7章"}, {"no": "08", "ref": "8", "q": "保險公司與客戶的業務關係於2026年1月終止。依洗錢防制法第8條，確認客戶身分所得資料至少要保存到？", "opts": ["2026年1月就可銷毀", "2027年1月", "2031年1月", "2036年1月"], "ans": 2, "why": "第8條第2項：自業務關係終止時起至少保存5年。2026年1月起算5年到2031年1月。法律另有較長保存期間的，從其規定。", "tag": "第8章"}, {"no": "08", "ref": "10", "q": "洗錢防制法第10條，交易紀錄至少保存多久，從何時起算？", "opts": ["3年，自交易完成時", "5年，自交易完成時", "5年，自業務關係終止時", "10年，自交易完成時"], "ans": 1, "why": "第10條第2項：自交易完成時起，至少保存5年。自業務關係終止時起算的是第8條的確認客戶身分資料。", "tag": "第8章"}, {"no": "08", "ref": "13", "q": "金融機構發現某筆交易疑似洗錢，但客戶最後沒完成交易。是否仍要申報？", "opts": ["不需申報", "要申報，交易未完成者亦同", "只要通知客戶", "只要內部記錄"], "ans": 1, "why": "第13條第1項：對疑似犯第19、20條之罪的交易，應向法務部調查局申報；交易未完成者，亦同。", "tag": "第8章"}, {"no": "08", "ref": "19", "q": "洗錢的財物達新臺幣1億元以上，依第19條的刑度？", "opts": ["6月以上5年以下，併科5,000萬元以下罰金", "3年以上10年以下，併科1億元以下罰金", "1年以下", "僅處罰金"], "ans": 1, "why": "第19條第1項前段：3年以上10年以下有期徒刑，併科新臺幣1億元以下罰金。選項A是未達1億元的刑度。", "tag": "第8章"}, {"no": "08", "ref": "5", "q": "依洗錢防制法第5條，下列何者屬於金融機構？", "opts": ["保險公司", "餐廳", "便利商店", "旅行社"], "ans": 0, "why": "第5條第1項第10款：保險公司是金融機構。", "tag": "第8章"}, {"no": "08", "ref": "22", "q": "甲把自己的銀行帳戶交給陌生人使用並收取報酬。依第22條？", "opts": ["不處罰", "可能涉及刑責（期約或收受對價）", "只要口頭警告", "只罰款不涉刑責"], "ans": 1, "why": "第22條第3項第1款：期約或收受對價而違反者，處3年以下有期徒刑、拘役或科或併科新臺幣100萬元以下罰金。", "tag": "第8章"}, {"no": "08", "ref": "12", "q": "洗錢防制法第12條的『一定金額』規定在哪裡？", "opts": ["洗錢防制法第12條條文內", "主管機關依授權訂定的辦法", "刑法", "保險法"], "ans": 1, "why": "第12條第3項：一定金額、通貨交易的範圍、申報方式等由中央目的事業主管機關會商法務部等訂辦法。數字要查現行辦法。", "tag": "第8章"}]}</script>
<script>const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>{t=String(t||'');const ss=t.split(/(?<=。)/).map(x=>x.trim()).filter(Boolean);if(t.length<=90||ss.length<2&&t.indexOf('；')<0)return '<p>'+esc(t)+'</p>';
  const li=s=>{s=s.replace(/。$/,'');const m=s.match(/^([^：；]{1,40})：(.+)$/);if(m&&m[2].split('；').length>=3)return '<li><b>'+esc(m[1])+'</b><ul>'+m[2].split('；').map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></li>';
    const parts=s.split('；');if(parts.length>=3)return '<li>'+parts.map(x=>esc(x)).join('<br>')+'</li>';return '<li>'+esc(s)+'</li>'};
  return '<ul class="pl">'+ss.map(li).join('')+'</ul>'};
const factsT=f=>f?'<div class="tw"><table class="ft"><thead><tr>'+f.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+f.rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'';
const lab=x=>/^[保規]\d+(-\d+)?$/.test(x)?({'保':'保險法','規':'管理規則'}[x[0]])+'第'+x.slice(1)+'條':/^[一二三四五六七八九十]+(之[一二三四五六七八九十]+)?$/.test(x)?'第'+x+'點':/^[0-9]+(-[0-9]+)?$/.test(x)?'第'+x+'條':x;
const mem={};
const store={get(k){try{const v=localStorage.getItem(k);return v===null?mem[k]:v}catch(e){return mem[k]}},set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const BOXKEY='twlife_boxes_v2';
let boxes={};try{boxes=JSON.parse(store.get(BOXKEY)||'{}')}catch(e){boxes={}}
const saveBoxes=()=>store.set(BOXKEY,JSON.stringify(boxes));
function Flash(root,getCards){
  let queue=[],cur=null,flipped=false;
  function build(){const cs=getCards();queue=shuffle(cs.filter(c=>(boxes[c.key]||0)<1)).sort((a,b)=>(boxes[a.key]||0)-(boxes[b.key]||0));flipped=false}
  function render(){
    const cs=getCards(),n=cs.length,done=cs.filter(c=>(boxes[c.key]||0)>=1).length;
    let h='<div class="stat">已熟練 '+done+' / '+n+' 張（答對 1 次視為熟練，進度存在這個瀏覽器）</div><div class="bar"><i style="width:'+(n?done/n*100:0)+'%"></i></div>';
    if(!n){root.innerHTML=h+'<div class="card"><p>沒有可用的閃卡。</p></div>';return}
    if(!queue.length){root.innerHTML=h+'<div class="card"><h3>全部熟練了</h3><p>可以去做情境題，或重設後再來一輪。</p></div><div class="row"><button class="btn" data-a="reset">重設進度</button></div>';return}
    cur=queue[0];
    h+='<div class="card fc" tabindex="0" role="button" data-a="flip"><small>'+(cur.tag?esc(cur.tag)+'｜':'')+esc(lab(cur.ref))+'｜剩 '+queue.length+' 張</small><div class="q">'+esc(cur.front)+'</div>'+(flipped?'<div class="a"><span class="lab fact">答案</span>'+esc(cur.back)+'</div>':'<small>點一下翻面</small>')+'</div>';
    if(flipped)h+='<div class="row"><button class="btn bad" data-a="no">還不熟</button><button class="btn ok" data-a="yes">會了</button></div>';
    h+='<div class="row"><button class="btn" data-a="reset">重設進度</button></div>';
    root.innerHTML=h;
  }
  root.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
    if(a==='flip'){flipped=!flipped;render()}
    else if(a==='reset'){if(confirm('確定要清除這些閃卡的進度？')){getCards().forEach(c=>delete boxes[c.key]);saveBoxes();build();render()}}
    else if(cur&&(a==='yes'||a==='no')){const ok=a==='yes';boxes[cur.key]=ok?Math.min(1,(boxes[cur.key]||0)+1):0;saveBoxes();queue.shift();if(!ok||boxes[cur.key]<1)queue.splice(queue.length?Math.max(1,Math.min(queue.length,ok?6:3)):0,0,cur);flipped=false;render()}});
  root.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.fc')){e.preventDefault();flipped=!flipped;render()}});
  return {refresh(){build();render()}};
}
function Quiz(root,getItems,perRound){
  let items=[],score=0,answered=0,done=false;
  function draw(){
    const perms=items.map(s=>shuffle(s.opts.map((_,k)=>k)));
    root.innerHTML='<div class="stat" id="sc"></div>'+items.map((s,i)=>'<div class="card" data-i="'+i+'"><b>'+(i+1)+'. </b><span class="lab my">'+(s.tag?esc(s.tag)+' ':'')+esc(lab(s.ref))+'</span>'+esc(s.q)+perms[i].map((k,pos)=>'<button class="opt" data-o="'+k+'">'+String.fromCharCode(65+pos)+'. '+esc(s.opts[k])+'</button>').join('')+'<div class="why"></div></div>').join('')+'<div id="qend"></div>';
    score=0;answered=0;upd();
  }
  function upd(){const el=$('#sc',root);if(el)el.textContent='已作答 '+answered+' / '+items.length+'，答對 '+score+' 題';
    if(perRound&&answered===items.length&&items.length){$('#qend',root).innerHTML='<div class="card"><h3>這一組：'+score+' / '+items.length+'</h3></div><div class="row"><button class="btn pri" data-a="again">再來一組</button></div>'}}
  function again(){const all=getItems();items=perRound?shuffle(all).slice(0,perRound):all;draw()}
  root.addEventListener('click',e=>{
    const ag=e.target.closest('[data-a="again"]');if(ag){again();window.scrollTo(0,root.offsetTop-60);return}
    const b=e.target.closest('.opt');if(!b)return;const box=b.closest('.card');if(box.dataset.done)return;
    const s=items[+box.dataset.i],j=+b.dataset.o;box.dataset.done=1;answered++;if(j===s.ans)score++;
    let right='';$$('.opt',box).forEach((x,pos)=>{const k=+x.dataset.o;if(k===s.ans){x.classList.add('right');right=String.fromCharCode(65+pos)}else if(k===j)x.classList.add('wrong')});
    const w=$('.why',box);w.style.display='block';w.innerHTML=(j===s.ans?'答對了。':'答錯了，正解是 '+right+'。')+esc(s.why);upd()});
  return {refresh:again};
}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent); // {chapters:[{no,file,chapter,title,summary,topics,counts,updates,laws}], idx:[...], cards:[...], scen:[...]}
// 章節
$('#grid').innerHTML=D.chapters.map(c=>'<a class="ch" href="'+c.file+'"><h3>'+esc(c.chapter)+'｜'+esc(c.title)+'</h3><p>'+esc(c.summary)+'</p><div>'+c.topics.map(t=>'<span class="chip">'+esc(t)+'</span>').join('')+'</div><p class="stat">'+c.counts+'</p></a>').join('');
const ups=D.chapters.flatMap(c=>(c.updates||[]).map(u=>Object.assign({ch:c},u))).sort((a,b)=>b.date.localeCompare(a.date));
$('#upd').innerHTML=ups.length?'<h2>近期修正（備考與實務要注意）</h2>'+ups.map(u=>'<div class="banner"><b>'+esc(u.date)+'　'+esc(u.ch.title)+'</b><br>'+esc(u.what)+'　<a href="'+u.ch.file+'">看這一章</a></div>').join(''):'';
const seen={};$('#laws').innerHTML=D.chapters.flatMap(c=>c.laws.map(l=>({l,c}))).map(({l,c})=>'<tr><td><a href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.name)+'</a></td><td>'+esc(l.amended)+(l.note?'<br><small>'+esc(l.note)+'</small>':'')+'</td><td><a href="'+c.file+'">'+esc(c.chapter)+'</a></td></tr>').join('');
// 搜尋
const q=$('#q'),res=$('#res'),main=$('#main');
const TN={clause:'條文',table:'對照表',card:'閃卡',scen:'情境題'};
function hi(s,terms){let o=esc(s);terms.forEach(t=>{if(!t)return;const re=new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');o=o.replace(re,m=>'<mark>'+m+'</mark>')});return o}
function snip(text,terms){const low=text.toLowerCase();let p=-1;for(const t of terms){const i=low.indexOf(t);if(i>=0){p=i;break}}if(p<0)return text.slice(0,70);const a=Math.max(0,p-25);return (a>0?'…':'')+text.slice(a,a+90)+(a+90<text.length?'…':'')}
function search(){
  const raw=q.value.trim().toLowerCase();
  if(!raw){res.innerHTML='';main.style.display='';return}
  main.style.display='none';
  const terms=raw.split(/\s+/).filter(Boolean);
  const hits=[];
  for(const e of D.idx){const t=e.text.toLowerCase();if(terms.every(x=>t.includes(x))){let s=0;const ti=e.title.toLowerCase();terms.forEach(x=>{if(ti.includes(x))s+=3});s+=({clause:6,table:4,card:2,scen:1})[e.type];hits.push([s,e])}}
  hits.sort((a,b)=>b[0]-a[0]);
  const top=hits.slice(0,60);
  res.innerHTML='<div class="stat">找到 '+hits.length+' 筆'+(hits.length>60?'（顯示前 60 筆）':'')+'</div>'+(top.length?top.map(([s,e])=>'<a class="res" href="'+e.file+'#'+e.anchor+'"><small>'+esc(e.chTitle)+'｜'+TN[e.type]+'</small><br><b>'+hi(e.title,terms)+'</b><br>'+hi(snip(e.text,terms),terms)+'</a>').join(''):'<div class="card">沒有找到。換個關鍵字，或用較短的詞（例如「抵繳」、「五十萬」、「A-」）。</div>');
}
let tm;q.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(search,120)});
// 總複習
let sel=new Set(D.chapters.map(c=>c.no));
$('#filter').innerHTML='<button data-no="all" class="on">全部</button>'+D.chapters.map(c=>'<button data-no="'+c.no+'" class="on">第'+parseInt(c.no)+'章</button>').join('');
$('#filter').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const no=b.dataset.no;
  if(no==='all'){const allOn=sel.size===D.chapters.length;sel=allOn?new Set():new Set(D.chapters.map(c=>c.no))}
  else{sel.has(no)?sel.delete(no):sel.add(no)}
  $$('#filter button').forEach(x=>x.classList.toggle('on',x.dataset.no==='all'?sel.size===D.chapters.length:sel.has(x.dataset.no)));
  fl.refresh();qz.refresh()});
const fl=Flash($('#r-cards'),()=>D.cards.filter(c=>sel.has(c.no)));fl.refresh();
const qz=Quiz($('#r-quiz'),()=>D.scen.filter(c=>sel.has(c.no)),10);qz.refresh();
$('#rnav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$$('#rnav button').forEach(x=>x.setAttribute('aria-selected',x===b));$('#r-cards').classList.toggle('on',b.dataset.t==='cards');$('#r-quiz').classList.toggle('on',b.dataset.t==='quiz')});
</script></body></html>
