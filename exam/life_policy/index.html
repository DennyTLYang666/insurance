人申請訂立保險契約；負有交付保險費的義務。 有利益、去申請、要繳錢。 要保人的核心義務是繳保險費，但不是只有要保人能繳，人壽保險第115條規定利害關係人都可代繳（第三章）。 本法所稱要保人，指對保險標的具有保險利益，向保險人申請訂立保險契約，並負有交付保險費義務之人。", "anchor": "read/c3"}, {"file": "ch01.html", "chTitle": "第1章 保險關係人與保險利益", "type": "clause", "title": "第4條 被保險人", "text": "被保險人 被保險人是保險事故發生時遭受損害、享有賠償請求權的人。要保人也可以同時是被保險人。 出事的那個人。 考題常拆成三個角色：繳費的人、被保的人、領錢的人。三個可以是同一人，也可以是三個不同的人。 本法所稱被保險人，指於保險事故發生時，遭受損害，享有賠償請求權之人；要保人亦得為被保險人。", "anchor": "read/c4"}, {"file": "ch01.html", "chTitle": "第1章 保險關係人與保險利益", "type": "clause", "title": "第5條 受益人", "text": "受益人 受益人是被保險人或要保人約定享有賠償請求權的人。要保人或被保險人本人都可以當受益人。 約定領錢的人。 受益人怎麼指定、能不能轉讓、什麼時候喪失，在人壽保險第110至114條、第121條（第三章）。 本法所稱受益人，指被保險人或要保人約定享有賠償請求權之人，要保人或被保險人均得為受益人。", "anchor": "read/c5"}, {"file": "ch01.html", "chTitle": "第1章 保險關係人與保險利益", "type": "clause", "title": "第8條 保險代理人、經紀人、業務員的分別", "text": "保險代理人、經紀人、業務員的分別 代理人是依代理契約或授權書、向保險人收取費用並代理經營業務的人；經紀人是站在被保險人利益、洽訂契約而收取佣金或報酬的人；業務員是替保險業、經紀人公司、代理人公司或兼營的銀行從事保險招攬的人。 代理人站保險公司；經紀人站客戶；業務員負責招攬。 業務員的登錄、教育訓練、懲處規定在第五章（保險業務員管理規則）。 本法所稱保險代理人，指根據代理契約或授權書，向保險人收取費用，並代理經營業務之人。 本法所稱保險業務員，指為保險業、保險經紀人公司、保險代理人公司或兼營保險代理人或保險經紀人業務之銀行，從事保險招攬之人。 本法所稱保險經紀人，指基於被保險人之利益，洽訂保險契約或提供相關服務，而收取佣金或報酬之人。 保險代理人 依代理契約或授權書，向保險人收取費用，並代理經營業務 保險人 保險經紀人 基於被保險人之利益，洽訂保險契約或提供相關服務，收取佣金或報酬 被保險人 保險業務員 為保險業、經紀人公司、代理人公司或兼營銀行，從事保險招攬之人 所屬公司", "anchor": "read/c8"}, {"file": "ch01.html", "chTitle": "第1章 保險關係人與保險利益", "type": "clause", "title": "第13條 保險的分類", "text": "保險的分類 保險分財產保險和人身保險兩大類。人身保險包括人壽保險、健康保險、傷害保險、年金保險四種；財產保險包括火災、海上、陸空、責任、保證保險和主管機關核准的其他保險。 人身四種：壽、健、傷、年。 人身保險四種分別在保險法第101條（人壽）、第125條（健康）、第131條（傷害）、第135-1條（年金）開始。 保險分為財產保險及人身保險。 財產保險，包括火災保險、海上保險、陸空保險、責任保險、保證保險及經主管機關核准之其他保險。 人身保險，包括人壽保險、健康保險、傷害保險及年金保險。", "anchor": "read/c13"}, {"file": "ch01.html", "chTitle": "第1章 保險關係人與保險利益", "type": "clause", "title": "第16條 保險利益：要保人對哪些人的生命或身體有保險利益", "text": "保險利益：要保人對哪些人的生命或身體有保險利益 要保人對這四種人的生命或身體有保險利益：本人或其家屬；生活費或教育費所仰給之人；債務人；為本人管理財產或利益之人。 本人家屬、供我生活、欠我錢的、替我管事。 方向最容易反。以『我是要保人』為起點往外看：條文列的是我對誰有利益。借錢給我的人（債權人）不在第16條四款內。 要保人對於左列各人之生命或身體，有保險利益。 一、本人或其家屬。 二、生活費或教育費所仰給之人。 三、債務人。 四、為本人管理財產或利益之人。 一 本人或其家屬 替自己、配偶、子女投保 二 生活費或教育費所仰給之人 我的生活費、學費靠誰供給，我對這個人有利益 三 債務人 對方欠我錢，我對他有利益；反過來他對我（債權人）不在這四款內 四 為本人管理財產或利益之人 我把公司交給對方經營，我對他有利益", "anchor": "read/c16"}, {"file": "ch01.html", "chTitle": "第1章 保險關係人與保險利益", "type": "clause", "title": "第16-1條 未成年人等為被保險人：保險金可約定匯入信託帳戶", "text": "未成年人等為被保險人：保險金可約定匯入信託帳戶 未成年人或依民法第14條第1項可受監護宣告者的父、母或監護人，依第138-2條第2項規定為被保險人時，要保人、被保險人、受益人可以在事故發生前共同約定：保險金出險後匯入指定信託帳戶；要保人也可放棄第111條的處分權。 保險金進信託，要保人放棄處分權。 本頁沒有收錄第138-2條，這條要連同它一起讀才完整。 未成年人或依民法第十四條第一項得受監護宣告者之父、母或監護人，依本法第一百三十八條之二第二項規定為被保險人時，保險契約之要保人、被保險人及受益人得於保險事故發生前，共同約定保險金於保險事故發生後應匯入指定信託帳戶，要保人並得放棄第一百十一條保險利益之處分權。", "anchor": "read/c16-1"}, {"file": "ch01.html", "chTitle": "第1章 保險關係人與保險利益", "type": "clause", "title": "第17條 欠缺保險利益：契約失效", "text": "欠缺保險利益：契約失效 要保人或被保險人對保險標的物沒有保險利益時，保險契約失去效力。 沒有保險利益，契約失效。 用語要分清：第17條是『失其效力』（失效）；第105條第三人訂死亡保險未經被保險人書面同意是『其契約無效』。兩者是不同關卡，考題會看你有沒有看清楚用語。 要保人或被保險人，對於保險標的物無保險利益者，保險契約失其效力。", "anchor": "read/c17"}, {"file": "ch01.html", "chTitle": "第1章 保險關係人與保險利益", "type": "clause", "title": "第18條 被保險人死亡或標的物移轉", "text": "被保險人死亡或標的物移轉 被保險人死亡或保險標的物所有權移轉時，保險契約除了另有訂定外，仍為繼承人或受讓人的利益而存在。  條文用語（標的物所有權移轉）偏財產保險。人身保險的受益人與遺產歸屬，看第112、113條（第三章）。 被保險人死亡或保險標的物所有權移轉時，保險契約除另有訂定外，仍為繼承人或受讓人之利益而存在。", "anchor": "read/c18"}, {"file": "ch01.html", "chTitle": "第1章 保險關係人與保險利益", "type": "table", "title": "四個核心角色：一句話對照", "text": "四個核心角色：一句話對照 角色 條 核心 權利或義務 保險人 2 經營保險事業的組織 請求保險費（權利）；負賠償義務 要保人 3 有保險利益、申請訂約的人 負交付保險費義務 被保險人 4 事故發生時遭受損害、享有賠償請求權的人 要保人亦得為被保險人 受益人 5 被保險人或要保人約定享有賠償請求權的人 要保人、被保險人均得為受益人", "anchor": "table/t0"}, {"file": "ch01.html", "chTitle": "第1章 保險關係人與保險利益", "type": "table", "title": "第16條保險利益：判斷練習（以『我是要保人』為起點）", "text": "第16條保險利益：判斷練習（以『我是要保人』為起點） 情況 第16條有沒有列 對應款 我替自己投保 有 一、本人 我替配偶、子女投保 有 一、家屬 我的生活費靠姪子供給，我投保他的生命 有 二、生活費或教育費所仰給之人 朋友欠我錢，我投保朋友的生命 有 三、債務人 我欠朋友錢，我投保朋友的生命 四款都沒列 （債權人不在條文內） 我把公司交給經理人經營，我投保經理人的生命 有 四、為本人管理財產或利益之人", "anchor": "table/t1"}, {"file": "ch01.html", "chTitle": "第1章 保險關係人與保險利益", "type": "card", "title": "要保人要同時符合哪三件事？", "text": "要保人要同時符合哪三件事？ 對保險標的有保險利益；向保險人申請訂立保險契約；負有交付保險費的義務。", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 保險關係人與保險利益", "type": "card", "title": "保險人在契約成立時有什麼權利、承保事故發生時有什麼義務？", "text": "保險人在契約成立時有什麼權利、承保事故發生時有什麼義務？ 權利：請求保險費；義務：依承保責任負賠償義務。", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 保險關係人與保險利益", "type": "card", "title": "受益人可以是要保人或被保險人本人嗎？", "text": "受益人可以是要保人或被保險人本人嗎？ 可以。第5條：要保人或被保險人均得為受益人。", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 保險關係人與保險利益", "type": "card", "title": "人身保險包括哪四種？", "text": "人身保險包括哪四種？ 人壽保險、健康保險、傷害保險、年金保險。", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 保險關係人與保險利益", "type": "card", "title": "第16條：要保人對哪四種人的生命或身體有保險利益？", "text": "第16條：要保人對哪四種人的生命或身體有保險利益？ 本人或其家屬；生活費或教育費所仰給之人；債務人；為本人管理財產或利益之人。", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 保險關係人與保險利益", "type": "card", "title": "我借錢給朋友，我是要保人，我對朋友的生命有保險利益嗎？", "text": "我借錢給朋友，我是要保人，我對朋友的生命有保險利益嗎？ 有。對方是我的債務人，屬第16條第3款。", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 保險關係人與保險利益", "type": "card", "title": "要保人對保險標的物沒有保險利益，契約會怎樣？", "text": "要保人對保險標的物沒有保險利益，契約會怎樣？ 失其效力（失效）。第17條。", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 保險關係人與保險利益", "type": "card", "title": "保險經紀人是站在誰的利益洽訂保險契約？", "text": "保險經紀人是站在誰的利益洽訂保險契約？ 被保險人的利益，並收取佣金或報酬。", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 保險關係人與保險利益", "type": "card", "title": "父母或監護人為被保險人時，保險金可以怎麼約定以保障未成年人？", "text": "父母或監護人為被保險人時，保險金可以怎麼約定以保障未成年人？ 要保人、被保險人、受益人可事前共同約定，保險金出險後匯入指定信託帳戶，要保人並得放棄第111條的處分權。", "anchor": "cards"}, {"file": "ch01.html", "chTitle": "第1章 保險關係人與保險利益", "type": "scen", "title": "甲把自己的公司委託乙經營。依保險法第16條，下列何者正確？", "text": "甲把自己的公司委託乙經營。依保險法第16條，下列何者正確？ 甲對乙有保險利益 乙對甲有保險利益 兩人互有保險利益 兩人互無保險利益 第16條第4款：要保人對『為本人管理財產或利益之人』有保險利益。甲是要保人，乙替甲管理公司，所以是甲對乙有。條文方向是要保人對被保人，不是雙向。", "anchor": "quiz"}, {"file": "ch01.html", "chTitle": "第1章 保險關係人與保險利益", "type": "scen", "title": "老陳每月提供生活費給阿明。若阿明是要保人，依第16條？", "text": "老陳每月提供生活費給阿明。若阿明是要保人，依第16條？ 阿明對老陳有保險利益 老陳對阿明有保險利益 兩人互有保險利益 兩人互無保險利益 第16條第2款：生活費所仰給之人。阿明的生活費靠老陳供給，阿明（要保人）對老陳有保險利益。反過來老陳是提供者，不在第2款內。", "anchor": "quiz"}, {"file": "ch01.html", "chTitle": "第1章 保險關係人與保險利益", "type": "scen", "title": "張三是要保人，下列何者的生命或身體，張三沒有被第16條列為有保險利益？", "text": "張三是要保人，下列何者的生命或身體，張三沒有被第16條列為有保險利益？ 張三本人 欠張三錢的王老五 借錢給張三的李四 張三的配偶 李四是借錢給張三的債權人，張三是李四的債務人，反過來。第16條第3款列的是要保人的『債務人』（欠要保人錢的人），不是要保人的債權人。", "anchor": "quiz"}, {"file": "ch01.html", "chTitle": "第1章 保險關係人與保險利益", "type": "scen", "title": "要保人對保險標的物沒有保險利益時，保險法第17條規定契約怎麼樣？", "text": "要保人對保險標的物沒有保險利益時，保險法第17條規定契約怎麼樣？ 失其效力 自始無效 得撤銷 效力不受影響 第17條用語是『失其效力』。『無效』是另外的條文用語（例如第105條）。", "anchor": "quiz"}, {"file": "ch01.html", "chTitle": "第1章 保險關係人與保險利益", "type": "scen", "title": "依第3條，下列哪一項不是要保人的要件？", "text": "依第3條，下列哪一項不是要保人的要件？ 對保險標的有保險利益 向保險人申請訂立契約 負有交付保險費義務 於保險事故發生時遭受損害 『保險事故發生時遭受損害、享有賠償請求權』是被保險人的定義（第4條），不是要保人的要件。", "anchor": "quiz"}, {"file": "ch01.html", "chTitle": "第1章 保險關係人與保險利益", "type": "scen", "title": "依保險法，『基於被保險人之利益，洽訂保險契約並收取佣金或報酬』的人是？", "text": "依保險法，『基於被保險人之利益，洽訂保險契約並收取佣金或報酬』的人是？ 保險代理人 保險經紀人 保險業務員 保險公證人 第9條：保險經紀人基於被保險人之利益洽訂契約，收取佣金或報酬。代理人是向保險人收取費用並代理經營業務（第8條）。", "anchor": "quiz"}, {"file": "ch02.html", "chTitle": "第2章 保險契約：成立、告知義務與時效", "type": "clause", "title": "第21條 保險費的交付方式與第一期保險費", "text": "保險費的交付方式與第一期保險費 保險費分一次交付和分期交付兩種。契約規定一次交付，或分期交付的第一期保險費，應在契約生效前交付；但簽約時保險費還不能確定的，不在此限。 第一期保險費先繳，契約才生效。 這是『契約生效前』的規定；繳費之後到期沒繳會怎樣（催告、停效），是人壽保險第116條（第三章）。 保險費分一次交付，及分期交付兩種。保險契約規定一次交付，或分期交付之第一期保險費，應於契約生效前交付之；但保險契約簽訂時，保險費未能確定者，不在此限。", "anchor": "read/c21"}, {"file": "ch02.html", "chTitle": "第2章 保險契約：成立、告知義務與時效", "type": "clause", "title": "第22條 誰交保險費；為他人利益訂的契約，抗辯也能對抗受益人", "text": "誰交保險費；為他人利益訂的契約，抗辯也能對抗受益人 保險費由要保人依契約規定交付。信託業依信託契約有交付義務時，由信託業代為交付，保險人依保險契約應給付的保險金額屬於該信託契約的信託財產。要保人為他人利益訂立契約時，保險人對要保人能提出的抗辯，也可以拿來對抗受益人。 保費要保人繳；信託業可代繳；對要保人的抗辯，受益人也要承受。 考點在最後一句：受益人不是『乾淨』的第三人，保險人對要保人的抗辯（例如沒繳保費、告知不實）一樣可以對抗受益人。 保險費應由要保人依契約規定交付。信託業依信託契約有交付保險費義務者，保險費應由信託業代為交付之。 前項信託契約，保險人依保險契約應給付之保險金額，屬該信託契約之信託財產。 要保人為他人利益訂立之保險契約，保險人對於要保人所得為之抗辯，亦得以之對抗受益人。", "anchor": "read/c22"}, {"file": "ch02.html", "chTitle": "第2章 保險契約：成立、告知義務與時效", "type": "clause", "title": "第43條 契約的書面形式", "text": "契約的書面形式 保險契約要以保險單或暫保單來做成。 保險單或暫保單。  保險契約，應以保險單或暫保單為之。", "anchor": "read/c43"}, {"file": "ch02.html", "chTitle": "第2章 保險契約：成立、告知義務與時效", "type": "clause", "title": "第44條 保險人同意後簽訂；利害關係人可請求契約謄本", "text": "保險人同意後簽訂；利害關係人可請求契約謄本 保險契約由保險人在同意要保人的聲請後簽訂。利害關係人都可以向保險人請求保險契約的謄本。 保險人同意才簽；利害關係人可要謄本。  保險契約，由保險人於同意要保人聲請後簽訂。 利害關係人，均得向保險人請求保險契約之謄本。", "anchor": "read/c44"}, {"file": "ch02.html", "chTitle": "第2章 保險契約：成立、告知義務與時效", "type": "clause", "title": "第52條 為他人利益訂立契約，該他人未確定時", "text": "為他人利益訂立契約，該他人未確定時 為他人利益訂立的保險契約，訂約時那個『他人』還沒確定的，由要保人或保險契約上可確定的受益人享受利益。  重點是『訂約時尚未確定』；已確定的受益人，看人壽保險第110至113條。 為他人利益訂立之保險契約，於訂約時，該他人未確定者，由要保人或保險契約所載可得確定之受益人，享受其利益。", "anchor": "read/c52"}, {"file": "ch02.html", "chTitle": "第2章 保險契約：成立、告知義務與時效", "type": "clause", "title": "第54條 強制規定不能用契約改；解釋有疑義時作有利於被保險人的解釋", "text": "強制規定不能用契約改；解釋有疑義時作有利於被保險人的解釋 保險法的強制規定不能用契約變更，但變更後有利於被保險人的不在此限。保險契約的解釋要探求當事人的真意，不能死板抓住用字；如果有疑義，原則上作有利於被保險人的解釋。 強制規定不能改，改得更有利可以；有疑義，偏向被保險人。 第54-1條的『顯失公平』無效，和這條的『強制規定』是兩個不同的把關，題目會分開問。 本法之強制規定，不得以契約變更之。但有利於被保險人者，不在此限。 保險契約之解釋，應探求契約當事人之真意，不得拘泥於所用之文字；如有疑義時，以作有利於被保險人之解釋為原則。", "anchor": "read/c54"}, {"file": "ch02.html", "chTitle": "第2章 保險契約：成立、告知義務與時效", "type": "clause", "title": "第54-1條 顯失公平的契約約定無效", "text": "顯失公平的契約約定無效 保險契約中有下列四種情形之一，依訂約時情形顯失公平者，該部分約定無效。 減保險人、限客戶權利、加客戶義務、其他重大不利。 只有『顯失公平』的那一部分無效，不是整份契約無效。 保險契約中有左列情事之一，依訂約時情形顯失公平者，該部分之約定無效： 一、免除或減輕保險人依本法應負之義務者。 二、使要保人、受益人或被保險人拋棄或限制其依本法所享之權利者。 三、加重要保人或被保險人之義務者。 四、其他於要保人、受益人或被保險人有重大不利益者。 一 免除或減輕保險人依本法應負的義務 二 使要保人、受益人或被保險人拋棄或限制其依本法所享的權利 三 加重要保人或被保險人的義務 四 其他對要保人、受益人或被保險人有重大不利益", "anchor": "read/c54-1"}, {"file": "ch02.html", "chTitle": "第2章 保險契約：成立、告知義務與時效", "type": "clause", "title": "第55條 保險契約應記載的八項事項", "text": "保險契約應記載的八項事項 保險契約除本法另有規定外，應記載八項：當事人的姓名及住所；保險標的物；保險事故的種類；保險責任開始的日時及保險期間；保險金額；保險費；無效及失權的原因；訂約的年月日。 人、標的、事故、期間、金額、費、無效失權、日期。 人壽保險第108條、健康保險第129條、傷害保險第132條、年金保險第135-2條都是『除記載第55條規定事項外，並應載明』，再加各自的特別事項。 保險契約，除本法另有規定外，應記載左列各款事項： 一、當事人之姓名及住所。 二、保險之標的物。 三、保險事故之種類。 四、保險責任開始之日時及保險期間。 五、保險金額。 六、保險費。 七、無效及失權之原因。 八、訂約之年月日。", "anchor": "read/c55"}, {"file": "ch02.html", "chTitle": "第2章 保險契約：成立、告知義務與時效", "type": "clause", "title": "第56條 變更契約或恢復效力：10日不拒絕視為承諾", "text": "變更契約或恢復效力：10日不拒絕視為承諾 變更保險契約，或恢復停止效力的保險契約時，保險人接到通知後10日內不拒絕，視為承諾。但本法對人身保險有特別規定的，從其規定。 十日不拒絕，視為同意；人身保險另有規定從其規定。 人壽保險的復效有自己的規定（第116條：6個月內清償；6個月後可保證明、5日、15日），不是用這條的10日。 變更保險契約或恢復停止效力之保險契約時，保險人於接到通知後十日內不為拒絕者，視為承諾。但本法就人身保險有特別規定者，從其規定。", "anchor": "read/c56"}, {"file": "ch02.html", "chTitle": "第2章 保險契約：成立、告知義務與時效", "type": "clause", "title": "第64條 訂約時要保人的據實說明義務與解除權", "text": "訂約時要保人的據實說明義務與解除權 訂立契約時，要保人對保險人的書面詢問，應據實說明。如果隱匿、遺漏或作不實說明，足以變更或減少保險人對危險的估計，保險人可以解除契約，危險發生後亦同。但要保人能證明危險的發生不是基於他的說明或未說明的事實時，不在此限。保險人的解除權有兩個期限限制。 知道一個月、訂約兩年。 據實說明的對象是保險人的『書面詢問』。實務上被問到的事項才有說明義務，這是出題常見的判斷點。 訂立契約時，要保人對於保險人之書面詢問，應據實說明。 要保人有為隱匿或遺漏不為說明，或為不實之說明，足以變更或減少保險人對於危險之估計者，保險人得解除契約；其危險發生後亦同。但要保人證明危險之發生未基於其說明或未說明之事實時，不在此限。 前項解除契約權，自保險人知有解除之原因後，經過一個月不行使而消滅；或契約訂立後經過二年，即有可以解除之原因，亦不得解除契約。 保險人知有解除原因後，不行使 經過1個月 契約訂立後，即有可以解除的原因 經過2年，亦不得解除契約", "anchor": "read/c64"}, {"file": "ch02.html", "chTitle": "第2章 保險契約：成立、告知義務與時效", "type": "clause", "title": "第65條 保險契約權利的消滅時效", "text": "保險契約權利的消滅時效 由保險契約所生的權利，從得為請求之日起，2年不行使就消滅。但有三種情形，起算日不同：要保人或被保險人對危險的說明有隱匿、遺漏或不實的，從保險人知情之日起算；危險發生後，利害關係人能證明非因疏忽而不知情的，從知情之日起算；要保人或被保險人對保險人的請求是由於第三人的請求而生的，從受請求之日起算。 時效兩年；特殊情形看『知情日』或『受請求日』。 時效是2年，和第64條的『1個月、2年』不要混：第64條講的是保險人的解除權，第65條講的是契約所生權利的消滅時效。 由保險契約所生之權利，自得為請求之日起，經過二年不行使而消滅。有左列各款情形之一者，其期限之起算，依各該款之規定： 一、要保人或被保險人對於危險之說明，有隱匿、遺漏或不實者，自保險人知情之日起算。 二、危險發生後，利害關係人能證明其非因疏忽而不知情者，自其知情之日起算。 三、要保人或被保險人對於保險人之請求，係由於第三人之請求而生者，自要保人或被保險人受請求之日起算。", "anchor": "read/c65"}, {"file": "ch02.html", "chTitle": "第2章 保險契約：成立、告知義務與時效", "type": "table", "title": "數字速記：第56、64、65條", "text": "數字速記：第56、64、65條 條 數字 什麼事 56 10日 變更契約或恢復效力：保險人接到通知後10日內不拒絕，視為承諾（人身保險另有規定的從其規定） 64 1個月 保險人知有解除原因後，1個月不行使，解除權消滅 64 2年 契約訂立後經過2年，即有可以解除的原因，亦不得解除契約 65 2年 契約所生權利，自得為請求之日起2年不行使而消滅", "anchor": "table/t0"}, {"file": "ch02.html", "chTitle": "第2章 保險契約：成立、告知義務與時效", "type": "table", "title": "第55條：契約應記載事項八款", "text": "第55條：契約應記載事項八款 款 事項 一 當事人的姓名及住所 二 保險的標的物 三 保險事故的種類 四 保險責任開始的日時及保險期間 五 保險金額 六 保險費 七 無效及失權的原因 八 訂約的年月日", "anchor": "table/t1"}, {"file": "ch02.html", "chTitle": "第2章 保險契約：成立、告知義務與時效", "type": "card", "title": "第一期保險費應在什麼時候交付？", "text": "第一期保險費應在什麼時候交付？ 契約生效前交付（簽約時保險費還不能確定的例外）。第21條。", "anchor": "cards"}, {"file": "ch02.html", "chTitle": "第2章 保險契約：成立、告知義務與時效", "type": "card", "title": "保險契約的條文有疑義時，怎麼解釋？", "text": "保險契約的條文有疑義時，怎麼解釋？ 原則上作有利於被保險人的解釋。第54條第2項。", "anchor": "cards"}, {"file": "ch02.html", "chTitle": "第2章 保險契約：成立、告知義務與時效", "type": "card", "title": "契約條款免除保險人依法應負的義務，且顯失公平，會怎樣？", "text": "契約條款免除保險人依法應負的義務，且顯失公平，會怎樣？ 該部分的約定無效（不是整份契約無效）。第54-1條第1款。", "anchor": "cards"}, {"file": "ch02.html", "chTitle": "第2章 保險契約：成立、告知義務與時效", "type": "card", "title": "契約應記載哪八項？", "text": "契約應記載哪八項？ 當事人姓名住所、標的物、事故種類、責任開始日時及期間、保險金額、保險費、無效及失權原因、訂約年月日。", "anchor": "cards"}, {"file": "ch02.html", "chTitle": "第2章 保險契約：成立、告知義務與時效", "type": "card", "title": "變更契約的通知，保險人多久不拒絕就視為承諾？", "text": "變更契約的通知，保險人多久不拒絕就視為承諾？ 接到通知後10日內不拒絕，視為承諾（人身保險另有規定的從其規定）。", "anchor": "cards"}, {"file": "ch02.html", "chTitle": "第2章 保險契約：成立、告知義務與時效", "type": "card", "title": "要保人對書面詢問隱匿或不實說明，保險人可以怎樣？", "text": "要保人對書面詢問隱匿或不實說明，保險人可以怎樣？ 足以變更或減少保險人對危險的估計時，保險人得解除契約，危險發生後亦同。", "anchor": "cards"}, {"file": "ch02.html", "chTitle": "第2章 保險契約：成立、告知義務與時效", "type": "card", "title": "保險人解除權的兩個期限？", "text": "保險人解除權的兩個期限？ 知有解除原因後經過1個月不行使而消滅；契約訂立後經過2年，亦不得解除。", "anchor": "cards"}, {"file": "ch02.html", "chTitle": "第2章 保險契約：成立、告知義務與時效", "type": "card", "title": "保險契約所生權利的消滅時效？", "text": "保險契約所生權利的消滅時效？ 自得為請求之日起，2年不行使而消滅。第65條。", "anchor": "cards"}, {"file": "ch02.html", "chTitle": "第2章 保險契約：成立、告知義務與時效", "type": "card", "title": "為他人利益訂立契約時，保險人對要保人的抗辯，能不能對抗受益人？", "text": "為他人利益訂立契約時，保險人對要保人的抗辯，能不能對抗受益人？ 可以。第22條第3項。", "anchor": "cards"}, {"file": "ch02.html", "chTitle": "第2章 保險契約：成立、告知義務與時效", "type": "scen", "title": "甲投保時，對保險公司書面詢問的疾病故意隱匿。契約訂立滿3年後才出險，保險公司發現隱匿。依第64條，保險人可不可以解除契約？", "text": "甲投保時，對保險公司書面詢問的疾病故意隱匿。契約訂立滿3年後才出險，保險公司發現隱匿。依第64條，保險人可不可以解除契約？ 可以，因為是故意隱匿 不可以，因為契約訂立後已超過2年 可以，只要在知道後1個月內行使 不可以，因為已經出險 第64條第3項：契約訂立後經過2年，即有可以解除的原因，亦不得解除契約。超過2年就不能解除，條文沒有區分故意或過失。選項3雖然提到1個月，但2年的限制是另一道關卡，兩道期限都要符合。", "anchor": "quiz"}, {"file": "ch02.html", "chTitle": "第2章 保險契約：成立、告知義務與時效", "type": "scen", "title": "保險人發現要保人告知不實，已經超過1個月才主張解除。依第64條？", "text": "保險人發現要保人告知不實，已經超過1個月才主張解除。依第64條？ 仍可解除，因為還沒滿2年 不得解除，因為自知有解除原因後經過1個月不行使而消滅 只能解除一部分 由要保人決定 第64條第3項：解除權自保險人知有解除原因後，經過1個月不行使而消滅。1個月和2年是兩個獨立的期限。", "anchor": "quiz"}, {"file": "ch02.html", "chTitle": "第2章 保險契約：成立、告知義務與時效", "type": "scen", "title": "某保險契約條款規定：被保險人不得依保險法主張某項法定權利，且依訂約時情形顯失公平。該條款的效力？", "text": "某保險契約條款規定：被保險人不得依保險法主張某項法定權利，且依訂約時情形顯失公平。該條款的效力？ 整份契約無效 該部分約定無效 有效，因為雙方簽名同意 效力未定 第54-1條第2款：使要保人、受益人或被保險人拋棄或限制其依本法所享的權利，且顯失公平者，『該部分』的約定無效，不是整份契約。", "anchor": "quiz"}, {"file": "ch02.html", "chTitle": "第2章 保險契約：成立、告知義務與時效", "type": "scen", "title": "保險契約條款文字有兩種合理解釋，法律上的原則是？", "text": "保險契約條款文字有兩種合理解釋，法律上的原則是？ 作有利於保險人的解釋 作有利於被保險人的解釋 契約無效 由法院抽籤 第54條第2項：有疑義時，以作有利於被保險人之解釋為原則。", "anchor": "quiz"}, {"file": "ch02.html", "chTitle": "第2章 保險契約：成立、告知義務與時效", "type": "scen", "title": "要保人通知保險人要變更保險契約的內容，保險人接到通知後10日內不為拒絕。依第56條？", "text": "要保人通知保險人要變更保險契約的內容，保險人接到通知後10日內不為拒絕。依第56條？ 視為拒絕 視為承諾 契約失效 須再經被保險人同意 第56條：接到通知後10日內不為拒絕者，視為承諾。但人身保險另有特別規定的，從其規定。", "anchor": "quiz"}, {"file": "ch02.html", "chTitle": "第2章 保險契約：成立、告知義務與時效", "type": "scen", "title": "依第65條，由保險契約所生的權利，原則上自得為請求之日起幾年不行使而消滅？", "text": "依第65條，由保險契約所生的權利，原則上自得為請求之日起幾年不行使而消滅？ 1年 2年 5年 10年 第65條：2年。", "anchor": "quiz"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "clause", "title": "第101條 人壽保險人的給付責任", "text": "人壽保險人的給付責任 被保險人在契約規定的年限內死亡，或契約年限屆滿仍生存時，保險人都要依約給付保險金額。 年限內死亡賠；屆滿生存也賠。  人壽保險人於被保險人在契約規定年限內死亡，或屆契約規定年限而仍生存時，依照契約負給付保險金額之責。", "anchor": "read/c101"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "clause", "title": "第102條 保險金額依契約所定", "text": "保險金額依契約所定 人壽保險的保險金額，照保險契約約定。   人壽保險之保險金額，依保險契約之所定。", "anchor": "read/c102"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "clause", "title": "第103條 人壽保險人不得代位", "text": "人壽保險人不得代位 人壽保險的保險人，不能代位行使要保人或受益人因保險事故對第三人的請求權。 壽險沒有代位。 對照『損害填補、代位』是財產保險的原則；人壽保險是以人的生命為標的，這條是明文排除代位。 人壽保險之保險人，不得代位行使要保人或受益人因保險事故所生對於第三人之請求權。", "anchor": "read/c103"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "clause", "title": "第104條 本人或第三人都可訂立", "text": "本人或第三人都可訂立 人壽保險契約可以由本人訂立，也可以由第三人訂立。   人壽保險契約，得由本人或第三人訂立之。", "anchor": "read/c104"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "clause", "title": "第105條 第三人訂死亡保險：被保險人的書面同意", "text": "第三人訂死亡保險：被保險人的書面同意 由第三人訂立的死亡保險契約，沒有經被保險人書面同意並約定保險金額，契約無效。被保險人給的同意可以隨時撤銷，撤銷要用書面通知保險人和要保人。被保險人行使撤銷權，視為要保人終止保險契約。 第三人訂死亡險：要書面同意＋約定金額，否則無效；可隨時撤銷，等於終止。 『無效』（第105條）和第17條的『失效』用語不同。第16條有保險利益還不夠，第105條還要被保險人書面同意。 由第三人訂立之死亡保險契約，未經被保險人書面同意，並約定保險金額，其契約無效。 被保險人依前項所為之同意，得隨時撤銷之。其撤銷之方式應以書面通知保險人及要保人。 被保險人依前項規定行使其撤銷權者，視為要保人終止保險契約。", "anchor": "read/c105"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "clause", "title": "第106條 第三人訂立契約：權利移轉或出質要被保險人書面承認", "text": "第三人訂立契約：權利移轉或出質要被保險人書面承認 由第三人訂立的人壽保險契約，權利要移轉或出質，沒有經被保險人書面承認，不生效力。   由第三人訂立之人壽保險契約，其權利之移轉或出質，非經被保險人以書面承認者，不生效力。", "anchor": "read/c106"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "clause", "title": "第107條 未滿15歲未成年人為被保險人", "text": "未滿15歲未成年人為被保險人 以未滿15歲的未成年人為被保險人訂立的人壽保險契約，除了喪葬費用的給付外，其餘死亡給付的約定，到被保險人滿15歲時才生效。喪葬費用的保險金額，不能超過遺產及贈與稅法第17條遺產稅喪葬費扣除額的一半。其他法律另有規定的，從其規定。 未滿十五，死亡給付要等滿十五；喪葬費例外，且不超過喪葬費扣除額一半。 喪葬費扣除額的金額由遺產及贈與稅法第17條決定，會調整；考試前先查最新數字。 以未滿十五歲之未成年人為被保險人訂立之人壽保險契約，除喪葬費用之給付外，其餘死亡給付之約定於被保險人滿十五歲時始生效力。 前項喪葬費用之保險金額，不得超過遺產及贈與稅法第十七條有關遺產稅喪葬費扣除額之一半。 前二項於其他法律另有規定者，從其規定。", "anchor": "read/c107"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "clause", "title": "第107-1條 受監護宣告者為被保險人", "text": "受監護宣告者為被保險人 訂立人壽保險契約時，以受監護宣告尚未撤銷的人為被保險人，除了喪葬費用的給付外，其餘死亡給付部分無效。喪葬費用的保險金額，一樣不能超過遺產稅喪葬費扣除額的一半。 受監護宣告：死亡給付無效，喪葬費例外。 和第107條對照：未滿15歲是『滿15歲才生效』；受監護宣告是『該部分無效』。 訂立人壽保險契約時，以受監護宣告尚未撤銷者為被保險人，除喪葬費用之給付外，其餘死亡給付部分無效。 前項喪葬費用之保險金額，不得超過遺產及贈與稅法第十七條有關遺產稅喪葬費扣除額之一半。 前二項規定於其他法律另有規定者，從其規定。", "anchor": "read/c107-1"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "clause", "title": "第108條 人壽保險契約的特別記載事項", "text": "人壽保險契約的特別記載事項 人壽保險契約除了第55條規定的八項，還要載明四項：被保險人的姓名、性別、年齡及住所；受益人的姓名及與被保險人的關係，或確定受益人的方法；請求保險金額的保險事故及時期；依第118條有減少保險金額的條件時，其條件。 被保人資料、受益人、事故及時期、減額條件。  人壽保險契約，除記載第五十五條規定事項外，並應載明左列事項： 一、被保險人之姓名、性別、年齡及住所。 二、受益人姓名及與被保險人之關係或確定受益人之方法。 三、請求保險金額之保險事故及時期。 四、依第一百十八條之規定，有減少保險金額之條件者，其條件。", "anchor": "read/c108"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "clause", "title": "第109條 自殺與犯罪處死、拒捕、越獄致死", "text": "自殺與犯罪處死、拒捕、越獄致死 被保險人故意自殺，保險人不負給付保險金額的責任，但要把保單價值準備金返還給應得之人。契約如果載有『被保險人故意自殺，保險人仍應給付』的條款，這個條款要到訂約2年後才生效；恢復效力的契約，2年從恢復效力之日起算。被保險人因犯罪處死、拒捕或越獄致死，保險人不負給付責任，但保險費付足2年以上的，要把保單價值準備金返還給應得之人。 自殺：賠不賠看約定，約定要等兩年；犯罪處死：付足兩年才退準備金。 復效後自殺條款的2年是『重新』從復效日算起，這是常見陷阱。 被保險人故意自殺者，保險人不負給付保險金額之責任。但應將保險之保單價值準備金返還於應得之人。 保險契約載有被保險人故意自殺，保險人仍應給付保險金額之條款者，其條款於訂約二年後始生效力。恢復停止效力之保險契約，其二年期限應自恢復停止效力之日起算。 被保險人因犯罪處死或拒捕或越獄致死者，保險人不負給付保險金額之責任。但保險費已付足二年以上者，保險人應將其保單價值準備金返還於應得之人。 故意自殺 不給付 返還保單價值準備金 契約載有仍給付條款者，訂約2年後該條款才生效；復效的從復效日起算 犯罪處死、拒捕、越獄致死 不給付 保險費付足2年以上，才返還準備金 付足2年以上", "anchor": "read/c109"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "clause", "title": "第110條 指定受益人", "text": "指定受益人 要保人可以通知保險人，將保險金額的全部或一部分，給付給他指定的受益人一人或數人。指定的受益人，要在請求保險金額時還活著才有資格。 可指定一人或數人；請求時要活著。  要保人得通知保險人，以保險金額之全部或一部，給付其所指定之受益人一人或數人。 前項指定之受益人，以於請求保險金額時生存者為限。", "anchor": "read/c110"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "clause", "title": "第111條 指定受益人後，要保人的處分權", "text": "指定受益人後，要保人的處分權 受益人經指定後，要保人對那份保險利益，除非聲明放棄處分權，仍然可以用契約或遺囑處分。要保人行使處分權，沒有通知保險人就不能對抗保險人。 指定後仍可處分，除非放棄；沒通知，不能對抗保險人。 第16-1條就是讓要保人『放棄第111條處分權』的情形。 受益人經指定後，要保人對其保險利益，除聲明放棄處分權者外，仍得以契約或遺囑處分之。 要保人行使前項處分權，非經通知，不得對抗保險人。", "anchor": "read/c111"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "clause", "title": "第112條 指定受益人的死亡保險金不是遺產", "text": "指定受益人的死亡保險金不是遺產 保險金額約定在被保險人死亡時給付給他指定的受益人，這筆金額不能當作被保險人的遺產。 有指定受益人，不是遺產。 遺產稅怎麼課，是遺產及贈與稅法與所得基本稅額條例的規定，不是本條；本頁沒有收錄。 保險金額約定於被保險人死亡時給付於其所指定之受益人者，其金額不得作為被保險人之遺產。", "anchor": "read/c112"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "clause", "title": "第113條 沒指定受益人的死亡保險金是遺產", "text": "沒指定受益人的死亡保險金是遺產 死亡保險契約沒有指定受益人時，保險金額作為被保險人的遺產。 沒指定受益人，變遺產。  死亡保險契約未指定受益人者，其保險金額作為被保險人之遺產。", "anchor": "read/c113"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "clause", "title": "第114條 受益人轉讓利益的限制", "text": "受益人轉讓利益的限制 受益人沒有經要保人同意，或保險契約沒有載明允許轉讓時，不能把他的利益轉讓給別人。 轉讓受益利益：要保人同意或契約允許。  受益人非經要保人之同意，或保險契約載明允許轉讓者，不得將其利益轉讓他人。", "anchor": "read/c114"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "clause", "title": "第115條 利害關係人可代繳保險費", "text": "利害關係人可代繳保險費 利害關係人都可以代要保人交付保險費。 利害關係人可代繳。  利害關係人，均得代要保人交付保險費。", "anchor": "read/c115"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "clause", "title": "第116條 保險費到期未交：催告、停效、復效、終止", "text": "保險費到期未交：催告、停效、復效、終止 保險費到期沒繳，除契約另有訂定外，經催告到達後滿30日仍不交付，保險契約的效力停止。催告要送達要保人或負有交付義務人的最後住所或居所，並應把催告通知被保險人。停效的契約，停效日起6個月內清償保險費、約定利息和其他費用，翌日上午零時起恢復效力。6個月後才申請復效的，保險人可以在申請日起5日內要求提供可保證明，除非被保險人危險程度有重大變更已達拒絕承保，否則不能拒絕復效。保險人沒在5日內要求，或收到可保證明後15日內不拒絕，視為同意復效。申請復效的期限，契約約定自停效日起不得低於2年，也不得遲於保險期間屆滿日。這個期限屆滿後，保險人有終止契約的權利。終止時保險費已付足2年以上而有保單價值準備金的，要返還保單價值準備金。契約約定由保險人墊繳保險費的，墊繳本息超過保單價值準備金時，停效與復效準用上述規定。 30日停效，6個月內補繳翌日零時復效；之後5日要證明、15日視同意；期限最少2年。 此條最近一次修正是民國111年11月30日，舊教材可能寫的是修正前的版本。數字太多，建議直接背上面的階段表。 人壽保險之保險費到期未交付者，除契約另有訂定外，經催告到達後屆三十日仍不交付時，保險契約之效力停止。 催告應送達於要保人，或負有交付保險費義務之人之最後住所或居所，保險費經催告後，應依與保險人約定之交付方法交付之；保險人並應將前開催告通知被保險人以確保其權益。對被保險人之通知，依最後留存於保險人之聯絡資料，以書面、電子郵件、簡訊或其他約定方式擇一發出通知者，視為已完成。 第一項停止效力之保險契約，於停止效力之日起六個月內清償保險費、保險契約約定之利息及其他費用後，翌日上午零時起，開始恢復其效力。要保人於停止效力之日起六個月後申請恢復效力者，保險人得於要保人申請恢復效力之日起五日內要求要保人提供被保險人之可保證明，除被保險人之危險程度有重大變更已達拒絕承保外，保險人不得拒絕其恢復效力。 保險人未於前項規定期限內要求要保人提供可保證明或於收到前項可保證明後十五日內不為拒絕者，視為同意恢復效力。 保險契約所定申請恢復效力之期限，自停止效力之日起不得低於二年，並不得遲於保險期間之屆滿日。 保險人於前項所規定之期限屆滿後，有終止契約之權。 保險契約終止時，保險費已付足二年以上，如有保單價值準備金者，保險人應返還其保單價值準備金。 保險契約約定由保險人墊繳保險費者，於墊繳之本息超過保單價值準備金時，其停止效力及恢復效力之申請準用第一項至第六項規定。 到期未繳 催告到達後滿30日仍不交付，契約效力停止（停效） 停效後6個月內 清償保險費、約定利息及其他費用，翌日上午零時起恢復效力 停效滿6個月後申請復效 保險人可在申請日起5日內要求可保證明；沒要求或收到證明15日內不拒絕，視為同意；除非危險程度有重大變更已達拒絕承保，否則不得拒絕 復效申請期限 自停效日起不得低於2年，不得遲於保險期間屆滿日 期限屆滿後 保險人有終止契約的權利 終止時保費付足2年以上 如有保單價值準備金，要返還", "anchor": "read/c116"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "clause", "title": "第117條 不得訴訟請求保費；付足2年以上不交付的處理", "text": "不得訴訟請求保費；付足2年以上不交付的處理 人壽保險的保險人不能用訴訟請求交付保險費。終身為期、不附生存條件的死亡保險契約，或契約訂定若干年後給付保險金額或年金的，如果保險費已付足2年以上，之後不交付，在第116條第5項規定的期限屆滿後，保險人只能減少保險金額或年金。 保費不能打官司討；付足兩年以上不繳，只能減額。 第135-4條說年金保險準用，傷害保險則是第135條準用第110至116條，不含第117條；健康保險第130條準用第115、116條。三種保險準用範圍不同，題目可以拿來設陷阱。 保險人對於保險費，不得以訴訟請求交付。 以被保險人終身為期，不附生存條件之死亡保險契約，或契約訂定於若干年後給付保險金額或年金者，如保險費已付足二年以上而有不交付時，於前條第五項所定之期限屆滿後，保險人僅得減少保險金額或年金。", "anchor": "read/c117"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "clause", "title": "第118條 減少保險金額或年金", "text": "減少保險金額或年金 保險人依第117條或應要保人請求，可以減少保險金額或年金，條件及可減少的數額要載明在保險契約。減少時，以訂原約時的條件、訂立同類保險契約為計算標準；減少後的金額，不得少於原契約終止時已有的保單價值準備金減去營業費用，用來作為一次交付保險費所能得到的金額。營業費用以原保險金額的百分之一為限。保險金額中因為保險費全數一次交付而訂定的部分，不受其他部分分期保險費不交付的影響。 減額繳清；營業費用不超過原保險金額1%。  保險人依前條規定，或因要保人請求，得減少保險金額或年金。其條件及可減少之數額，應載明於保險契約。 減少保險金額或年金，應以訂原約時之條件，訂立同類保險契約為計算標準。其減少後之金額，不得少於原契約終止時已有之保單價值準備金，減去營業費用，而以之作為保險費一次交付所能得之金額。 營業費用以原保險金額百分之一為限。 保險金額之一部，係因其保險費全數一次交付而訂定者，不因其他部分之分期交付保險費之不交付而受影響。", "anchor": "read/c118"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "clause", "title": "第119條 要保人終止契約與解約金", "text": "要保人終止契約與解約金 要保人終止契約，而保險費已付足1年以上的，保險人應該在接到通知後1個月內償付解約金，金額不得少於要保人應得保單價值準備金的四分之三。解約金的條件及金額要載明在保險契約。 付足一年、一個月內給付、不少於準備金的四分之三。 1年、1個月、3/4 三個數字一起背。 要保人終止保險契約，而保險費已付足一年以上者，保險人應於接到通知後一個月內償付解約金；其金額不得少於要保人應得保單價值準備金之四分之三。 償付解約金之條件及金額，應載明於保險契約。", "anchor": "read/c119"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "clause", "title": "第120條 保單質借", "text": "保單質借 保險費付足1年以上的，要保人可以用保險契約為質向保險人借款。保險人接到借款通知後，可以在1個月以內貸給可得質借的金額。借款本息超過保單價值準備金之日前30日，保險人要用書面通知要保人返還；要保人沒在超過日之前返還，契約效力從超過日起停止。保險人沒有依規定通知的，等到書面通知之日起30日內要保人沒還，效力從該30日的次日起停止。停效後申請復效，準用第116條第3至6項。 付足一年才能質借；超過準備金前30日要通知。  保險費付足一年以上者，要保人得以保險契約為質，向保險人借款。 保險人於接到要保人之借款通知後，得於一個月以內之期間，貸給可得質借之金額。 以保險契約為質之借款，保險人應於借款本息超過保單價值準備金之日之三十日前，以書面通知要保人返還借款本息，要保人未於該超過之日前返還者，保險契約之效力自借款本息超過保單價值準備金之日停止。 保險人未依前項規定為通知時，於保險人以書面通知要保人返還借款本息之日起三十日內要保人未返還者，保險契約之效力自該三十日之次日起停止。 前二項停止效力之保險契約，其恢復效力之申請準用第一百十六條第三項至第六項規定。", "anchor": "read/c120"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "clause", "title": "第121條 故意致被保險人於死：受益人與要保人", "text": "故意致被保險人於死：受益人與要保人 受益人故意致被保險人死亡，或雖然沒致死，喪失受益權。如果因為這樣沒有受益人可以領保險金額，保險金額作為被保險人的遺產。要保人故意致被保險人於死的，保險人不負給付責任；保險費付足2年以上的，保險人要把保單價值準備金給付給應得之人，沒有應得之人就解交國庫。 受益人故意：喪失受益權，錢變遺產；要保人故意：不賠，付足兩年退準備金。  受益人故意致被保險人於死或雖未致死者，喪失其受益權。 前項情形，如因該受益人喪失受益權，而致無受益人受領保險金額時，其保險金額作為被保險人遺產。 要保人故意致被保險人於死者，保險人不負給付保險金額之責。保險費付足二年以上者，保險人應將其保單價值準備金給付與應得之人，無應得之人時，應解交國庫。 受益人（致死或未致死） 喪失受益權；沒有其他受益人時，保險金額作為被保險人遺產 要保人（致死） 保險人不給付保險金；保費付足2年以上，給付保單價值準備金給應得之人，無人則解交國庫", "anchor": "read/c121"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "clause", "title": "第122條 被保險人年齡不實", "text": "被保險人年齡不實 被保險人年齡不實，而真實年齡已超過保險人所定的保險年齡限度，契約無效，保險人退還所繳保險費。年齡不實使所付保險費比應付數額少時，要保人可以補繳短繳的保險費，或按所付保險費與真實年齡的比例減少保險金額；但保險事故發生後，且年齡不實的錯誤不可歸責於保險人時，要保人不能要求補繳短繳的保險費。所付保險費比應付數額多時，保險人要退還溢繳的保險費。 超限無效退保費；少繳補繳或減額；多繳退還。  被保險人年齡不實，而其真實年齡已超過保險人所定保險年齡限度者，其契約無效，保險人應退還所繳保險費。 因被保險人年齡不實，致所付之保險費少於應付數額者，要保人得補繳短繳之保險費或按照所付之保險費與被保險人之真實年齡比例減少保險金額。但保險事故發生後，且年齡不實之錯誤不可歸責於保險人者，要保人不得要求補繳短繳之保險費。 因被保險人年齡不實，致所付之保險費多於應付數額者，保險人應退還溢繳之保險費。 真實年齡已超過保險年齡限度 契約無效，退還所繳保險費 少繳保費 補繳短繳的保險費，或按比例減少保險金額；事故發生後且錯誤不可歸責於保險人，不得要求補繳 多繳保費 保險人退還溢繳的保險費", "anchor": "read/c122"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "clause", "title": "第123條 保險人或要保人破產；投資型保險的投資資產", "text": "保險人或要保人破產；投資型保險的投資資產 保險人破產時，受益人對保險人得請求的保險金額債權，以保單價值準備金按訂約時的保險費率比例計算。要保人破產時，契約有受益人的，仍為受益人的利益而存在。投資型保險契約的投資資產，只有該投資型保險的受益人才能主張，也不能請求扣押或行使其他權利。   保險人破產時，受益人對於保險人得請求之保險金額之債權，以其保單價值準備金按訂約時之保險費率比例計算之。要保人破產時，保險契約訂有受益人者，仍為受益人之利益而存在。 投資型保險契約之投資資產，非各該投資型保險之受益人不得主張，亦不得請求扣押或行使其他權利。", "anchor": "read/c123"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "clause", "title": "第123-1條 債務人的解約金債權限額內不得扣押", "text": "債務人的解約金債權限額內不得扣押 要保人是債務人的人壽保險契約，各有效契約的解約金債權金額，沒有超過『最近一年衛福部或直轄市政府公告每人每月最低生活費1.2倍計算之6個月金額中最高標準』的，不得作為扣押或強制執行的標的。主管機關為推動提升基本保險保障政策而公告的人壽保險契約，其解約金債權也不得扣押或強制執行。 最低生活費1.2倍×6個月以內的解約金，不能被扣押。 民國114年6月18日新增。限額每年會隨公告變，本頁不寫死金額。 要保人為債務人之人壽保險契約，各有效契約之解約金債權金額未逾最近一年衛生福利部或直轄市政府所公告每人每月最低生活費一點二倍計算之六個月金額中最高標準者，不得作為扣押或強制執行之標的。 主管機關為推動提升基本保險保障政策，公告之人壽保險契約，其解約金債權不得作為扣押或強制執行之標的。", "anchor": "read/c123-1"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "clause", "title": "第123-2條 債務人保單的新要保人變更", "text": "債務人保單的新要保人變更 保險事故發生前，要保人是債務人的人壽保險契約，解約金債權被扣押、要保人受破產宣告，或依消費者債務清理條例裁定開始清算或更生程序時，對被保險人有保險利益的人、要保人具名指定的受益人，或要保人或被保險人的配偶、父母或子女，取得要保人及被保險人書面同意，並向執行機關或執行命令所指定的人支付以契約終止後預計可獲保險人償付的解約金額度，可以書面通知保險人變更為新要保人。通知要在事由發生之日起3個月內為之，書面通知送達保險人之日起生變更要保人的效力。 扣押或破產時，家人或指定受益人可付解約金額度變更為新要保人；3個月內通知。 民國114年6月18日新增。細節多，先記『誰、條件、3個月』三件事。 保險事故發生前，要保人為債務人之人壽保險契約之解約金債權經扣押、要保人受破產宣告或經依消費者債務清理條例裁定開始清算或更生程序時，下列各款之人，取得要保人及被保險人書面同意，並向執行機關或執行命令所指定之人支付以保險契約終止後預計可獲保險人償付之解約金額度者，得以書面通知保險人變更為新要保人： 一、對被保險人有保險利益者。 二、要保人具名指定之受益人。 三、要保人或被保險人之配偶、父母或子女。 前項通知保險人變更為新要保人，應於該項所定事由發生之日起三個月內為之；並於書面通知送達保險人之日起生變更要保人之效力。 本法中華民國一百十四年六月三日修正之條文施行前，有第一項所定事由，於修正施行後，保險事故發生前，該項所定各款之人得於修正施行之日起三個月內，適用第一項及前項後段規定。 什麼情況可啟動 解約金債權被扣押；要保人受破產宣告；依消費者債務清理條例裁定開始清算或更生 誰可變更為新要保人 對被保險人有保險利益者；要保人具名指定的受益人；要保人或被保險人的配偶、父母或子女 條件 取得要保人及被保險人書面同意，並向執行機關或執行命令所指定的人支付預計可獲償付的解約金額度 期限 事由發生之日起3個月內書面通知保險人，送達之日生效", "anchor": "read/c123-2"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "clause", "title": "第124條 優先受償權", "text": "優先受償權 人壽保險的要保人、被保險人、受益人，對被保險人的保單價值準備金有優先受償權。 準備金，優先受償。  人壽保險之要保人、被保險人、受益人，對於被保險人之保單價值準備金，有優先受償之權。", "anchor": "read/c124"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "table", "title": "無效、失效、停效、解除、終止：條文用語對照", "text": "無效、失效、停效、解除、終止：條文用語對照 用語 條 情形 無效 105 第三人訂死亡保險，沒有被保險人書面同意並約定保險金額 無效（該部分） 107-1 受監護宣告尚未撤銷者為被保險人：除喪葬費外，其餘死亡給付部分 無效 122 被保險人年齡不實且真實年齡已超過保險年齡限度 生效時點延後 107 未滿15歲：除喪葬費外，其餘死亡給付約定至滿15歲才生效 失效 17 要保人或被保險人對保險標的物無保險利益 停效（效力停止） 116 到期未繳，催告到達後滿30日仍不交付 停效（效力停止） 120 質借的借款本息超過保單價值準備金 解除 64 要保人對書面詢問告知不實，保險人行使解除權（第二章） 終止 116 復效申請期限屆滿後，保險人有終止契約之權 終止 119 要保人終止契約，保險費付足1年以上，償付解約金", "anchor": "table/t0"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "table", "title": "數字速記：保險費付足年數與期限", "text": "數字速記：保險費付足年數與期限 條 數字 內容 109 2年 自殺仍給付條款訂約2年後生效；犯罪處死等保費付足2年以上才返還準備金 116 30日 催告到達後滿30日仍不交付，效力停止 116 6個月 停效日起6個月內清償，翌日上午零時恢復效力 116 5日、15日 6個月後申請復效：5日內可要求可保證明；收到後15日內不拒絕視為同意 116 2年 申請復效期限不得低於2年；終止時付足2年以上返還準備金 117 2年 付足2年以上不交付：只能減少保險金額或年金 118 1% 營業費用以原保險金額百分之一為限 119 1年、1個月、3/4 付足1年以上；1個月內償付；不少於準備金的四分之三 120 1年、1個月、30日 付足1年以上可質借；1個月內貸給；超過準備金前30日通知 121 2年 要保人故意致被保險人於死：付足2年以上返還準備金 123-2 3個月 新要保人變更的通知期限", "anchor": "table/t1"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "table", "title": "受益人與遺產：保險金怎麼流向", "text": "受益人與遺產：保險金怎麼流向 情形 條 結果 有指定受益人 112 保險金額不作為被保險人遺產 沒指定受益人 113 保險金額作為被保險人遺產 受益人故意致被保險人於死（或未遂） 121 喪失受益權；沒有受益人可領時，作為被保險人遺產 受益人轉讓利益 114 要保人同意或契約載明允許轉讓", "anchor": "table/t2"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "card", "title": "第三人訂立死亡保險，需要被保險人做什麼，否則契約怎樣？", "text": "第三人訂立死亡保險，需要被保險人做什麼，否則契約怎樣？ 要有被保險人書面同意並約定保險金額，否則契約無效。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "card", "title": "被保險人事後撤銷第105條的同意，效果是什麼？", "text": "被保險人事後撤銷第105條的同意，效果是什麼？ 視為要保人終止保險契約。撤銷要書面通知保險人及要保人。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "card", "title": "以未滿15歲的未成年人為被保險人，死亡給付何時生效？", "text": "以未滿15歲的未成年人為被保險人，死亡給付何時生效？ 除喪葬費用外，其餘死亡給付約定於被保險人滿15歲時才生效。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "card", "title": "以受監護宣告尚未撤銷者為被保險人，死亡給付怎樣？", "text": "以受監護宣告尚未撤銷者為被保險人，死亡給付怎樣？ 除喪葬費用外，其餘死亡給付部分無效。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "card", "title": "契約載有『被保險人故意自殺，保險人仍應給付』，這個條款何時生效？", "text": "契約載有『被保險人故意自殺，保險人仍應給付』，這個條款何時生效？ 訂約2年後才生效；復效的契約從復效之日起算2年。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "card", "title": "被保險人故意自殺，保險人要不要還保單價值準備金？", "text": "被保險人故意自殺，保險人要不要還保單價值準備金？ 要。不給付保險金，但要把保單價值準備金返還應得之人。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "card", "title": "有指定受益人，死亡保險金是不是被保險人遺產？", "text": "有指定受益人，死亡保險金是不是被保險人遺產？ 不是。第112條。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "card", "title": "死亡保險沒指定受益人，保險金怎麼辦？", "text": "死亡保險沒指定受益人，保險金怎麼辦？ 作為被保險人的遺產。第113條。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "card", "title": "保險費到期未交，催告到達後滿幾日不交付，契約效力停止？", "text": "保險費到期未交，催告到達後滿幾日不交付，契約效力停止？ 30日。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "card", "title": "停效後幾個月內清償，翌日上午零時恢復效力？", "text": "停效後幾個月內清償，翌日上午零時恢復效力？ 停效之日起6個月內，清償保險費、約定利息及其他費用。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "card", "title": "停效滿6個月後申請復效，保險人要求可保證明的期限和視為同意的期限？", "text": "停效滿6個月後申請復效，保險人要求可保證明的期限和視為同意的期限？ 申請日起5日內可要求可保證明；沒要求或收到證明15日內不拒絕，視為同意復效。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "card", "title": "契約約定的復效申請期限，最少是多久？", "text": "契約約定的復效申請期限，最少是多久？ 自停效日起不得低於2年，且不得遲於保險期間屆滿日。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "card", "title": "保險人能不能用訴訟請求交付保險費？", "text": "保險人能不能用訴訟請求交付保險費？ 不能。人壽保險的保險人不得以訴訟請求交付保險費。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "card", "title": "要保人終止契約的解約金：付足幾年、多久內給付、金額下限？", "text": "要保人終止契約的解約金：付足幾年、多久內給付、金額下限？ 付足1年以上；接到通知後1個月內償付；不少於應得保單價值準備金的四分之三。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "card", "title": "保單質借需要保險費付足多久？保險人多久內貸給？", "text": "保單質借需要保險費付足多久？保險人多久內貸給？ 付足1年以上；接到借款通知後1個月以內。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "card", "title": "受益人故意致被保險人於死，會怎樣？", "text": "受益人故意致被保險人於死，會怎樣？ 喪失受益權；沒有受益人可領時，保險金額作為被保險人遺產。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "card", "title": "被保險人年齡不實且真實年齡已超過保險年齡限度，契約怎樣？", "text": "被保險人年齡不實且真實年齡已超過保險年齡限度，契約怎樣？ 契約無效，保險人退還所繳保險費。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "card", "title": "債務人要保人的解約金債權，什麼範圍內不得扣押？", "text": "債務人要保人的解約金債權，什麼範圍內不得扣押？ 不超過最近一年公告每人每月最低生活費1.2倍計算之6個月金額中最高標準者；另外主管機關公告的基本保障保單也不得扣押。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "card", "title": "債務人保單被扣押時，誰可以變更為新要保人？通知期限？", "text": "債務人保單被扣押時，誰可以變更為新要保人？通知期限？ 有保險利益者、要保人指定的受益人、要保人或被保險人的配偶父母子女；需書面同意並支付解約金額度；事由發生3個月內通知。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "card", "title": "誰對被保險人的保單價值準備金有優先受償權？", "text": "誰對被保險人的保單價值準備金有優先受償權？ 人壽保險的要保人、被保險人、受益人。", "anchor": "cards"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "scen", "title": "太太以先生為被保險人投保死亡保險，沒有取得先生的書面同意，也沒有約定保險金額。依第105條，契約效力？", "text": "太太以先生為被保險人投保死亡保險，沒有取得先生的書面同意，也沒有約定保險金額。依第105條，契約效力？ 有效，因為太太對先生有保險利益 無效 效力停止 得解除 第105條：由第三人訂立的死亡保險契約，未經被保險人書面同意，並約定保險金額，契約無效。有保險利益（第16條）還不夠，這是另一道關卡。", "anchor": "quiz"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "scen", "title": "先生曾書面同意太太以他為被保險人投保死亡險，之後書面通知保險人和太太撤銷同意。效果？", "text": "先生曾書面同意太太以他為被保險人投保死亡險，之後書面通知保險人和太太撤銷同意。效果？ 同意撤銷無效 視為要保人終止保險契約 契約解除 契約失效 第105條第2、3項：同意可隨時撤銷，撤銷方式是書面通知保險人及要保人；被保險人行使撤銷權，視為要保人終止保險契約。", "anchor": "quiz"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "scen", "title": "父母為6歲小孩投保人壽保險，死亡保險金額很高。依第107條，小孩在7歲時死亡？", "text": "父母為6歲小孩投保人壽保險，死亡保險金額很高。依第107條，小孩在7歲時死亡？ 全部死亡給付都要給 除喪葬費用外，其餘死亡給付約定尚未生效 契約全部無效 只退保費 第107條：除了喪葬費用的給付外，其餘死亡給付的約定，於被保險人滿15歲時始生效力。7歲死亡時尚未滿15歲，只有喪葬費用部分能給付，且不得超過遺產稅喪葬費扣除額的一半。", "anchor": "quiz"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "scen", "title": "保險契約載有『被保險人故意自殺，保險人仍應給付保險金』。被保險人訂約滿1年自殺。依第109條？", "text": "保險契約載有『被保險人故意自殺，保險人仍應給付保險金』。被保險人訂約滿1年自殺。依第109條？ 保險人仍須給付，因為契約有約定 不須給付，因為該條款要訂約2年後才生效 契約無效 只給付一半 第109條第2項：自殺仍給付的條款，於訂約2年後始生效力。滿1年自殺尚未生效，保險人不給付保險金，但要返還保單價值準備金。", "anchor": "quiz"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "scen", "title": "要保人未繳保費，催告到達後經過30日仍未繳，契約效力？", "text": "要保人未繳保費，催告到達後經過30日仍未繳，契約效力？ 自始無效 停止效力（停效） 保險人須立即終止 不受影響 第116條第1項：經催告到達後屆30日仍不交付時，保險契約的效力停止。", "anchor": "quiz"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "scen", "title": "契約停效後第4個月，要保人清償保險費、約定利息及其他費用。契約何時恢復效力？", "text": "契約停效後第4個月，要保人清償保險費、約定利息及其他費用。契約何時恢復效力？ 保險人同意後 清償的翌日上午零時 一個月後 提供可保證明後 第116條第3項：停效日起6個月內清償，翌日上午零時起開始恢復效力，不需可保證明。", "anchor": "quiz"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "scen", "title": "保費已付足1年以上，要保人終止保險契約。依第119條，解約金不得少於？", "text": "保費已付足1年以上，要保人終止保險契約。依第119條，解約金不得少於？ 保單價值準備金的二分之一 保單價值準備金的四分之三 已繳保險費全額 保險金額的百分之一 第119條：金額不得少於要保人應得保單價值準備金的四分之三；保險人要在接到通知後1個月內償付。", "anchor": "quiz"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "scen", "title": "死亡保險契約未指定受益人，被保險人死亡。保險金額？", "text": "死亡保險契約未指定受益人，被保險人死亡。保險金額？ 給要保人 作為被保險人的遺產 歸保險人所有 解交國庫 第113條：死亡保險契約未指定受益人者，其保險金額作為被保險人的遺產。", "anchor": "quiz"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "scen", "title": "被保險人投保時謊報年齡，真實年齡已超過保險人所定的保險年齡限度。依第122條？", "text": "被保險人投保時謊報年齡，真實年齡已超過保險人所定的保險年齡限度。依第122條？ 契約有效，補繳保費 契約無效，保險人退還所繳保險費 按比例減少保險金額 保險人得解除契約 第122條第1項：真實年齡已超過保險年齡限度，契約無效，保險人退還所繳保險費。按比例減額、補繳是『少繳保費但年齡仍在限度內』的處理。", "anchor": "quiz"}, {"file": "ch03.html", "chTitle": "第3章 人壽保險（保險法第101至124條）", "type": "scen", "title": "受益人甲故意傷害被保險人，被保險人未死亡。甲的受益權？", "text": "受益人甲故意傷害被保險人，被保險人未死亡。甲的受益權？ 不受影響 喪失受益權 減半 由保險人決定 第121條第1項：受益人故意致被保險人於死，或雖未致死者，喪失其受益權。", "anchor": "quiz"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "clause", "title": "第125條 健康保險的給付責任", "text": "健康保險的給付責任 健康保險人在被保險人因疾病、分娩，以及所導致的失能或死亡時，負給付保險金額的責任。所稱失能的內容，依各保險契約的約定。 疾病、分娩；導致的失能、死亡。  健康保險人於被保險人疾病、分娩及其所致失能或死亡時，負給付保險金額之責。 前項所稱失能之內容，依各保險契約之約定。", "anchor": "read/c125"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "clause", "title": "第126條 訂約前的健康檢查", "text": "訂約前的健康檢查 保險人在訂立契約前，可以對被保險人做健康檢查，檢查費用由保險人負擔。 體檢費，保險人出。  保險人於訂立保險契約前，對於被保險人得施以健康檢查。 前項檢查費用，由保險人負擔。", "anchor": "read/c126"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "clause", "title": "第127條 訂約時已在疾病或妊娠中", "text": "訂約時已在疾病或妊娠中 契約訂立時，被保險人已經在疾病或妊娠的情況中，保險人對那項疾病或分娩，不負給付保險金額的責任。 訂約前就有的病、已懷孕的分娩，不賠。  保險契約訂立時，被保險人已在疾病或妊娠情況中者，保險人對是項疾病或分娩，不負給付保險金額之責任。", "anchor": "read/c127"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "clause", "title": "第128條 故意自殺或墮胎", "text": "故意自殺或墮胎 被保險人故意自殺或墮胎所致的疾病、失能、流產或死亡，保險人不負給付責任。 自殺、墮胎：不賠。  被保險人故意自殺或墮胎所致疾病、失能、流產或死亡，保險人不負給付保險金額之責。", "anchor": "read/c128"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "clause", "title": "第129條 被保險人與要保人不同人時的記載", "text": "被保險人與要保人不同人時的記載 被保險人和要保人不是同一人時，契約除了第55條的事項，還要載明：被保險人的姓名、年齡及住所；被保險人與要保人的關係。   被保險人不與要保人為同一人時，保險契約除載明第五十五條規定事項外，並應載明左列各款事項： 一、被保險人之姓名、年齡及住所。 二、被保險人與要保人之關係。", "anchor": "read/c129"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "clause", "title": "第129-1條 債務人的健康保險解約金不得扣押", "text": "債務人的健康保險解約金不得扣押 要保人是債務人的健康保險契約，其解約金債權不得作為扣押或強制執行的標的。 健康險解約金：不能扣押。 民國114年6月18日新增。和人壽保險第123-1條不同：人壽保險有限額與公告條件，健康保險這條沒有限額。 要保人為債務人之健康保險契約之解約金債權，不得作為扣押或強制執行之標的。", "anchor": "read/c129-1"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "clause", "title": "第130條 健康保險準用的人壽保險條文", "text": "健康保險準用的人壽保險條文 第102條至第105條、第115條、第116條、第122條、第123條、第124條，於健康保險準用。 健康險準用：102-105、115、116、122-124。 沒有準用第106條、第107條、第109條到第114條、第117條至第121條。例如健康保險不能用第119條解約金四分之三。 第一百零二條至第一百零五條、第一百十五條、第一百十六條、第一百二十二條、第一百二十三條及第一百二十四條，於健康保險準用之。", "anchor": "read/c130"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "clause", "title": "第131條 傷害保險的給付責任與『意外傷害』的定義", "text": "傷害保險的給付責任與『意外傷害』的定義 傷害保險人在被保險人遭受意外傷害，以及所導致的失能或死亡時，負給付保險金額的責任。意外傷害指非由疾病引起的外來突發事故所致者。 意外傷害＝非疾病＋外來＋突發。 意外傷害的三個要素：非由疾病引起、外來、突發。題目會用『疾病引起』『內在』『長期累積』來設陷阱。 傷害保險人於被保險人遭受意外傷害及其所致失能或死亡時，負給付保險金額之責。 前項意外傷害，指非由疾病引起之外來突發事故所致者。", "anchor": "read/c131"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "clause", "title": "第132條 傷害保險契約的特別記載事項", "text": "傷害保險契約的特別記載事項 傷害保險契約除了第55條的事項，還要載明：被保險人的姓名、年齡、住所及與要保人的關係；受益人的姓名及與被保險人的關係，或確定受益人的方法；請求保險金額的事故及時期。   傷害保險契約，除記載第五十五條規定事項外，並應載明左列事項： 一、被保險人之姓名、年齡、住所及與要保人之關係。 二、受益人之姓名及與被保險人之關係或確定受益人之方法。 三、請求保險金額之事故及時期。", "anchor": "read/c132"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "clause", "title": "第132-1條 債務人的傷害保險解約金不得扣押", "text": "債務人的傷害保險解約金不得扣押 要保人是債務人的傷害保險契約，其解約金債權不得作為扣押或強制執行的標的。  民國114年6月18日新增，與第129-1條同樣的結構。 要保人為債務人之傷害保險契約之解約金債權，不得作為扣押或強制執行之標的。", "anchor": "read/c132-1"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "clause", "title": "第133條 自殺或犯罪行為", "text": "自殺或犯罪行為 被保險人故意自殺，或因犯罪行為所致的傷害、失能或死亡，保險人不負給付責任。 傷害險：自殺、犯罪行為，不賠。 和人壽保險第109條對照：傷害保險這條沒有『返還保單價值準備金』的規定，也沒有『2年』的字樣。 被保險人故意自殺，或因犯罪行為，所致傷害、失能或死亡，保險人不負給付保險金額之責任。", "anchor": "read/c133"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "clause", "title": "第134條 受益人故意傷害被保險人", "text": "受益人故意傷害被保險人 受益人故意傷害被保險人的，沒有請求保險金額的權利。如果受益人故意傷害被保險人但未遂，被保險人可以撤銷他的受益權利。 故意傷害：無請求權；未遂：被保險人可撤銷。 對照第121條：人壽保險是受益人故意致被保險人於死『或雖未致死』就喪失受益權；傷害保險是已傷害則無請求權、未遂則由被保險人決定是否撤銷。 受益人故意傷害被保險人者，無請求保險金額之權。 受益人故意傷害被保險人未遂時，被保險人得撤銷其受益權利。", "anchor": "read/c134"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "clause", "title": "第135條 傷害保險準用的人壽保險條文", "text": "傷害保險準用的人壽保險條文 第102條至第105條、第107條、第107-1條、第110條至第116條、第123條、第124條，及第125條第2項，於傷害保險準用。 傷害險準用：102-105、107、107-1、110-116、123、124、125II。 傷害保險準用第107條與第107-1條（未成年人、受監護宣告者）；沒有準用第117條以後的減額、解約金、質借規定（第118至121條）。 第一百零二條至第一百零五條、第一百零七條、第一百零七條之一、第一百十條至第一百十六條、第一百二十三條、第一百二十四條及第一百二十五條第二項，於傷害保險準用之。", "anchor": "read/c135"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "clause", "title": "第135-1條 年金保險的給付責任", "text": "年金保險的給付責任 年金保險人在被保險人生存期間或特定期間內，依契約負一次或分期給付一定金額的責任。 生存期間或特定期間，一次或分期給付。  年金保險人於被保險人生存期間或特定期間內，依照契約負一次或分期給付一定金額之責。", "anchor": "read/c135-1"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "clause", "title": "第135-2條 年金保險契約的特別記載事項", "text": "年金保險契約的特別記載事項 年金保險契約除了第55條的事項，還要載明五項：被保險人的姓名、性別、年齡及住所；年金金額或確定年金金額的方法；受益人的姓名及與被保險人的關係；請求年金的期間、日期及給付方法；依第118條有減少年金的條件時，其條件。 被保人、年金金額、受益人、期間日期方法、減額條件。  年金保險契約，除記載第五十五條規定事項外，並應載明左列事項： 一、被保險人之姓名、性別、年齡及住所。 二、年金金額或確定年金金額之方法。 三、受益人之姓名及與被保險人之關係。 四、請求年金之期間、日期及給付方法。 五、依第一百十八條規定，有減少年金之條件者，其條件。", "anchor": "read/c135-2"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "clause", "title": "第135-3條 年金保險的受益人", "text": "年金保險的受益人 被保險人生存期間，受益人就是被保險人本人。契約如果載有被保險人死亡後仍給付年金，這個受益人準用第110條至第113條。 生存期間受益人＝被保險人本人。  受益人於被保險人生存期間為被保險人本人。 保險契約載有於被保險人死亡後給付年金者，其受益人準用第一百十條至第一百十三條規定。", "anchor": "read/c135-3"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "clause", "title": "第135-4條 年金保險準用的人壽保險條文", "text": "年金保險準用的人壽保險條文 第103條、第104條、第106條、第114條至第124條，於年金保險準用。但在年金給付期間，要保人不能終止契約，也不能用保險契約為質向保險人借款。 年金險準用：103、104、106、114-124；給付期間不能終止、不能質借。 年金保險有準用第117條至第121條（減額、解約金、質借等），這是三種保險中準用最多的；但給付期間不得終止或質借。 第一百零三條、第一百零四條、第一百零六條、第一百十四條至第一百二十四條規定，於年金保險準用之。但於年金給付期間，要保人不得終止契約或以保險契約為質，向保險人借款。", "anchor": "read/c135-4"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "table", "title": "準用對照表：哪些人壽保險條文可用在健康、傷害、年金保險", "text": "準用對照表：哪些人壽保險條文可用在健康、傷害、年金保險 人壽保險條文 健康保險（130） 傷害保險（135） 年金保險（135-4） 102 保險金額依契約 準用 準用 未列 103 不得代位 準用 準用 準用 104 本人或第三人訂立 準用 準用 準用 105 第三人訂死亡險須書面同意 準用 準用 未列 106 權利移轉或出質須書面承認 未列 未列 準用 107、107-1 未成年人、受監護宣告者 未列 準用 未列 110～113 受益人相關 未列 準用 135-3 另行準用110～113 114 受益人轉讓利益 未列 準用 準用 115 利害關係人代繳保費 準用 準用 準用 116 催告、停效、復效 準用 準用 準用 117～121 減額、解約金、質借等 未列 未列 準用（給付期間不得終止或質借） 122 年齡不實 準用 未列 準用 123 保險人破產等 準用 準用 準用 124 優先受償 準用 準用 準用", "anchor": "table/t0"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "table", "title": "不賠的情形：三種保險對照", "text": "不賠的情形：三種保險對照 保險 條 不賠情形 健康保險 127 訂約時已在疾病或妊娠中，對該疾病或分娩不賠 健康保險 128 故意自殺或墮胎所致疾病、失能、流產或死亡 傷害保險 133 故意自殺，或因犯罪行為所致傷害、失能或死亡 傷害保險 134 受益人故意傷害被保險人：該受益人無請求權 人壽保險 109 故意自殺（返還準備金；自殺仍給付條款訂約2年後生效）；犯罪處死、拒捕、越獄致死", "anchor": "table/t1"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "card", "title": "健康保險人在哪些情況負給付責任？", "text": "健康保險人在哪些情況負給付責任？ 被保險人疾病、分娩，以及所導致的失能或死亡。", "anchor": "cards"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "card", "title": "訂約前的健康檢查費用由誰負擔？", "text": "訂約前的健康檢查費用由誰負擔？ 保險人。第126條。", "anchor": "cards"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "card", "title": "訂約時被保險人已在疾病或妊娠中，對那項疾病或分娩，保險人要賠嗎？", "text": "訂約時被保險人已在疾病或妊娠中，對那項疾病或分娩，保險人要賠嗎？ 不賠。第127條。", "anchor": "cards"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "card", "title": "意外傷害的定義？", "text": "意外傷害的定義？ 非由疾病引起的外來突發事故所致者。", "anchor": "cards"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "card", "title": "傷害保險不賠哪兩種情形？", "text": "傷害保險不賠哪兩種情形？ 被保險人故意自殺；因犯罪行為所致傷害、失能或死亡。", "anchor": "cards"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "card", "title": "受益人故意傷害被保險人但未遂，被保險人可以做什麼？", "text": "受益人故意傷害被保險人但未遂，被保險人可以做什麼？ 撤銷他的受益權利。已傷害者則無請求保險金額的權利。", "anchor": "cards"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "card", "title": "年金保險人的給付責任是什麼？", "text": "年金保險人的給付責任是什麼？ 被保險人生存期間或特定期間內，依契約一次或分期給付一定金額。", "anchor": "cards"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "card", "title": "年金保險中，被保險人生存期間的受益人是誰？", "text": "年金保險中，被保險人生存期間的受益人是誰？ 被保險人本人。", "anchor": "cards"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "card", "title": "年金給付期間，要保人可以終止契約或質借嗎？", "text": "年金給付期間，要保人可以終止契約或質借嗎？ 不可以。第135-4條但書。", "anchor": "cards"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "card", "title": "健康保險準用人壽保險的哪些條文？", "text": "健康保險準用人壽保險的哪些條文？ 102至105、115、116、122、123、124。", "anchor": "cards"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "card", "title": "傷害保險有沒有準用第107條（未滿15歲）？", "text": "傷害保險有沒有準用第107條（未滿15歲）？ 有。第135條準用第107條與第107-1條。", "anchor": "cards"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "card", "title": "債務人要保人的健康保險解約金債權，能不能被扣押？", "text": "債務人要保人的健康保險解約金債權，能不能被扣押？ 不能。第129-1條（民國114年新增）。", "anchor": "cards"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "scen", "title": "下列何者最符合保險法第131條的『意外傷害』？", "text": "下列何者最符合保險法第131條的『意外傷害』？ 因長期高血壓引起的中風 非由疾病引起的外來突發事故所致的傷害 因老化造成的關節退化 因慢性病惡化而死亡 第131條第2項：意外傷害指非由疾病引起的外來突發事故所致者。其他選項都是疾病或內在因素。", "anchor": "quiz"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "scen", "title": "甲投保健康保險時，已知自己有某項疾病。投保後該疾病住院。依第127條？", "text": "甲投保健康保險時，已知自己有某項疾病。投保後該疾病住院。依第127條？ 保險人須給付 保險人對該項疾病不負給付責任 契約自始無效 保險人應退費並解除契約 第127條：契約訂立時被保險人已在疾病或妊娠情況中者，保險人對該疾病或分娩不負給付責任。", "anchor": "quiz"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "scen", "title": "傷害保險的被保險人因犯罪行為受傷。依第133條？", "text": "傷害保險的被保險人因犯罪行為受傷。依第133條？ 保險人仍須給付 保險人不負給付責任 保險人應返還保單價值準備金 減半給付 第133條：因犯罪行為所致傷害、失能或死亡，保險人不負給付責任。傷害保險這條沒有返還準備金的規定。", "anchor": "quiz"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "scen", "title": "傷害保險的受益人故意傷害被保險人，但未遂。被保險人可以？", "text": "傷害保險的受益人故意傷害被保險人，但未遂。被保險人可以？ 不能做任何事 撤銷其受益權利 終止保險契約 要求保險人加倍賠償 第134條第2項：受益人故意傷害被保險人未遂時，被保險人得撤銷其受益權利。", "anchor": "quiz"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "scen", "title": "年金保險在年金給付期間，要保人可以怎樣？", "text": "年金保險在年金給付期間，要保人可以怎樣？ 隨時終止契約 不能終止契約，也不能質借 可以質借但不能終止 可以終止但不能質借 第135-4條但書：於年金給付期間，要保人不得終止契約或以保險契約為質向保險人借款。", "anchor": "quiz"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "scen", "title": "下列哪一條人壽保險的規定，依保險法第130條，不在健康保險的準用範圍內？", "text": "下列哪一條人壽保險的規定，依保險法第130條，不在健康保險的準用範圍內？ 第115條（利害關係人代繳保費） 第116條（催告、停效、復效） 第119條（解約金） 第122條（年齡不實） 第130條準用102至105、115、116、122、123、124。第119條解約金不在內。", "anchor": "quiz"}, {"file": "ch04.html", "chTitle": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）", "type": "scen", "title": "依第135條，傷害保險準用人壽保險的哪一組規定？", "text": "依第135條，傷害保險準用人壽保險的哪一組規定？ 第107條與第107-1條（未成年人、受監護宣告者） 第117條至第121條 第122條（年齡不實） 以上皆是 第135條準用102至105、107、107-1、110至116、123、124及125條第2項。第117條以後的減額、解約金、質借，以及第122條年齡不實，都不在內。", "anchor": "quiz"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "clause", "title": "保險法第177條 授權訂定業務員管理規則", "text": "授權訂定業務員管理規則 保險業務員的資格取得、登錄、撤銷或廢止登錄、教育訓練、懲處及其他應遵行事項的管理規則，由主管機關訂定。 管理規則的母法依據：保險法第177條。  保險業務員之資格取得、登錄、撤銷或廢止登錄、教育訓練、懲處及其他應遵行事項之管理規則，由主管機關定之。", "anchor": "read/c保177"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "clause", "title": "管理規則第3條 沒登錄、沒領登錄證，不能替所屬公司招攬", "text": "沒登錄、沒領登錄證，不能替所屬公司招攬 業務員沒有依規則登錄、領到登錄證，不能替所屬公司招攬保險。業務員與所屬公司簽的勞務契約，依民法及相關法令辦理。 先登錄、領證，才能招攬。  業務員非依本規則辦理登錄，領得登錄證，不得為其所屬公司招攬保險。 業務員與所屬公司簽訂之勞務契約，依民法及相關法令規定辦理。", "anchor": "read/c規3"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "clause", "title": "管理規則第5條 取得業務員資格的條件", "text": "取得業務員資格的條件 要成年，具有高中（職）以上學校畢業或同等學歷，並且符合下列條件之一：參加各有關公會舉辦的業務員資格測驗合格；或曾依本規則登錄且沒有被撤銷登錄處分。資格測驗要依各有關公會的測驗要點報名。 成年＋高中職以上＋測驗合格（或曾登錄且未被撤銷）。 曾因第11-1條、第13條、第19條第3項被撤銷登錄的人，要重新參加資格測驗合格才能再登錄（第6條）。 保險業務員資格之取得，應成年，具有高中（職）以上學校畢業或同等學歷，並應符合下列條件之一： 一、參加各有關公會舉辦之業務員資格測驗合格。 二、曾依本規則辦理登錄且未受第十一條之一、第十三條或第十九條第三項撤銷登錄處分者。 參加前項第一款資格測驗者，應依各有關公會所訂之業務員資格測驗要點規定報名。 各有關公會得考量保險市場發展情形，於報經主管機關核准後，舉辦單一保險種類之業務員資格測驗。 前二項業務員資格測驗要點由各有關公會訂定報主管機關備查。 中華民國九十九年十二月三十一日前已依本規則辦理登錄且未受第十一條之一、第十三條或第十九條第三項撤銷登錄處分者，不受第一項有關學歷之限制。", "anchor": "read/c規5"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "clause", "title": "管理規則第6條 登錄程序；招攬時要出示登錄證、告知授權範圍", "text": "登錄程序；招攬時要出示登錄證、告知授權範圍 具備資格的人填登錄申請書，由所屬公司向各有關公會辦理登錄。公會審查合格後通知所屬公司製發登錄證，所屬公司每月15日前，把上月製發登錄證的情形報各有關公會彙總。業務員招攬保險時，要出示登錄證並告知授權範圍；主管機關另有規定的不在此限。 公司代為登錄；招攬時出示登錄證、說明授權範圍。  具備前條第一項資格者，得填妥登錄申請書，由所屬公司為其向各有關公會辦理登錄。 各有關公會應將審查合格之業務員通知其所屬公司，以憑製發登錄證，所屬公司並應於每月十五日前，將上月製發登錄證情形報各有關公會彙總。 登錄申請書、登錄程序及登錄證之格式與應記載事項，由各有關公會定之。 已領有保險代理人、保險經紀人執業證照者，得向主管機關繳銷執業證照後，檢附繳銷執業證照證明，由其所屬公司為其辦理登錄。 曾受第十一條之一、第十三條或第十九條第三項撤銷業務員登錄處分者，應重新參加前條第一項第一款所定資格測驗合格，始得辦理登錄。 業務員於招攬保險時，應出示登錄證，並告知授權範圍。但主管機關另有規定者，不在此限。", "anchor": "read/c規6"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "clause", "title": "管理規則第7條 不予登錄或應註銷登錄的情形", "text": "不予登錄或應註銷登錄的情形 有下列情形之一，應不予登錄；已登錄者所屬公司要通知公會註銷登錄。 組織犯罪5年；偽造侵占詐欺背信、違反金融法令各3年；債信了結後3年。 『5年』只有第三款（組織犯罪防制條例）；其他犯罪與債信都是3年。 申請登錄之業務員有下列情事之一，應不予登錄；已登錄者，所屬公司應通知各有關公會註銷登錄： 一、無行為能力、限制行為能力或受輔助宣告尚未撤銷者。 二、申請登錄之文件有虛偽之記載者。 三、曾犯組織犯罪防制條例規定之罪，經有罪判決確定，尚未執行完畢，或執行完畢、緩刑期滿或赦免後尚未逾五年者。 四、曾犯偽造文書、侵占、詐欺、背信罪，經宣告有期徒刑以上之刑確定，尚未執行完畢，或執行完畢、緩刑期滿或赦免後尚未逾三年者。 五、違反保險法、銀行法、金融控股公司法、信託業法、票券金融管理法、金融資產證券化條例、不動產證券化條例、證券交易法、期貨交易法、證券投資信託及顧問法、管理外匯條例、信用合作社法、洗錢防制法或其他金融管理法律，受刑之宣告確定，尚未執行完畢，或執行完畢、緩刑期滿或赦免後尚未逾三年者。 六、受破產之宣告，尚未復權者。 七、有重大喪失債信情事尚未了結或了結後尚未逾三年者。 八、依第十九條規定在受經營同類保險業務之保險業、保險代理人公司、保險經紀人公司或銀行停止招攬行為期限內者。 九、已登錄為其他經營同類保險業務之保險業、保險代理人公司、保險經紀人公司或銀行之業務員未予註銷，而重複登錄者。 十、已領得保險代理人或保險經紀人執業證照，或充任其他保險代理人公司、保險經紀人公司或保險公證人公司之負責人者。 十一、最近三年有事實證明從事或涉及其他不誠信或不正當之活動，顯示其不適合擔任業務員者。 一 無行為能力、限制行為能力或受輔助宣告尚未撤銷 二 申請登錄文件有虛偽記載 三 曾犯組織犯罪防制條例之罪，有罪判決確定，尚未執行完畢，或執行完畢、緩刑期滿或赦免後尚未逾5年 四 曾犯偽造文書、侵占、詐欺、背信罪，宣告有期徒刑以上之刑確定，尚未執行完畢，或執行完畢、緩刑期滿或赦免後尚未逾3年 五 違反保險法、銀行法、洗錢防制法等金融管理法律，受刑之宣告確定，尚未執行完畢，或執行完畢、緩刑期滿或赦免後尚未逾3年 六 受破產宣告，尚未復權 七 有重大喪失債信情事尚未了結，或了結後尚未逾3年 八 依第19條規定，在受經營同類保險業務之公司停止招攬行為期限內 九 已登錄為其他經營同類保險業務之公司的業務員未註銷，而重複登錄 十 已領得保險代理人或保險經紀人執業證照，或擔任其他代理人、經紀人、公證人公司負責人 十一 最近3年有事實證明從事或涉及其他不誠信或不正當活動，顯示不適合擔任業務員", "anchor": "read/c規7"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "clause", "title": "管理規則第9條 登錄證有效期間", "text": "登錄證有效期間 業務員登錄證的有效期間是5年，要在期滿前辦好換發登錄證手續；沒辦好前不能招攬保險。 登錄證五年，期滿前換證。  業務員登錄證有效期間為五年，應於期滿前辦妥換發登錄證手續，未辦妥前不得為保險之招攬。 業務員換證作業規範，由各有關公會訂定報主管機關備查。", "anchor": "read/c規9"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "clause", "title": "管理規則第12條 每年參加教育訓練", "text": "每年參加教育訓練 業務員登錄後，每年都要參加所屬公司辦理的教育訓練。各有關公會要訂定教育訓練要點報主管機關備查，並依業務員招攬的保險種類訂定課程。 每年教育訓練。  業務員應自登錄後每年參加所屬公司辦理之教育訓練。 各有關公會應訂定教育訓練要點，並報主管機關備查後通知所屬會員公司辦理。 前項教育訓練要點應依業務員招攬保險種類訂定相關課程。", "anchor": "read/c規12"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "clause", "title": "管理規則第13條 不參加或成績不合格的後果", "text": "不參加或成績不合格的後果 業務員不參加教育訓練的，所屬公司要撤銷其業務員登錄。參加教育訓練成績不合格，一年內再補訓成績仍不合格的，也一樣。 不參加：撤銷；不合格補訓一年內再不合格：撤銷。  業務員不參加教育訓練者，所屬公司應撤銷其業務員登錄。 參加教育訓練成績不合格，於一年內再行補訓成績仍不合格者，亦同。", "anchor": "read/c規13"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "clause", "title": "管理規則第14條 專屬招攬與例外的雙登錄", "text": "專屬招攬與例外的雙登錄 業務員登錄後，應專為所屬公司招攬保險。保險業、保險代理人公司的業務員取得相關資格，可以登錄於另一家『非經營同類保險業務』的保險業或代理人公司，並以一家為限。經紀人公司的業務員，同樣可登錄於另一家非經營同類保險業務的經紀人公司，以一家為限。轉任他公司時要重新登錄。 原則專屬一家；例外：另一家要是『非同類』，且以一家為限。 同類＝同為財產保險或同為人身保險（第2條第5款）。所以同一個人身保險業務員不能再登錄另一家人身保險公司。 業務員經登錄後，應專為其所屬公司從事保險之招攬。 保險業、保險代理人公司之業務員，取得相關資格，得登錄於另一家非經營同類保險業務之保險業或保險代理人公司，並以一家為限。 保險經紀人公司之業務員取得相關資格，得登錄於另一家非經營同類保險業務之保險經紀人公司，並以一家為限。 業務員轉任他公司時，應依第六條規定重新登錄；異動後再任原所屬公司之業務員者，亦同。", "anchor": "read/c規14"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "clause", "title": "管理規則第15條 招攬行為的界線與所屬公司的連帶責任", "text": "招攬行為的界線與所屬公司的連帶責任 業務員經授權從事的招攬行為，視為所屬公司授權範圍內的行為，公司要嚴加管理，並就招攬行為造成的損害依法負連帶責任。招攬行為指：解釋保險商品內容與保單條款；說明填寫要保書的注意事項；轉送要保文件及保險單；其他經公司授權的招攬行為。從事這些行為，要取得要保人及被保險人親簽的投保相關文件；招攬人身保險商品，要親晤要保人及被保險人；業務員要在所招攬的要保書上親自簽名並記載登錄字號（主管機關另有規定者除外）。 書面授權、親簽、人身險要親晤、要保書業務員簽名加登錄字號。  業務員經授權從事保險招攬之行為，視為該所屬公司授權範圍之行為，所屬公司對其登錄之業務員應嚴加管理並就其業務員招攬行為所生之損害依法負連帶責任。業務員同時登錄為財產保險及人身保險業務員者，其分別登錄之所屬公司應依法負連帶責任。 前項授權，應以書面為之，並載明於其登錄證上。 第一項所稱保險招攬之行為，係指業務員從事下列之行為： 一、解釋保險商品內容及保單條款。 二、說明填寫要保書注意事項。 三、轉送要保文件及保險單。 四、其他經所屬公司授權從事保險招攬之行為。 業務員從事前項所稱保險招攬之行為，應取得要保人及被保險人親簽之投保相關文件；業務員招攬涉及人身保險之商品者，應親晤要保人及被保險人。但主管機關另有規定者不在此限。 業務員應於所招攬之要保書上親自簽名並記載其登錄字號。但主管機關另有規定者不在此限。 授權 要以書面為之，並載明於登錄證上 親簽 取得要保人及被保險人親簽的投保相關文件 親晤 招攬涉及人身保險的商品，要親晤要保人及被保險人（主管機關另有規定者除外） 要保書 業務員要在要保書上親自簽名並記載登錄字號 責任 所屬公司就招攬行為所生損害負連帶責任", "anchor": "read/c規15"}, {"file": "ch05.html", "chTitle": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）", "type": "clause", "title": "管理規則第16條 文宣、廣告、建議書的要求", "text": "文宣、廣告、建議書的要求 招攬用的文宣、廣告、簡介、商品說明書、建議書等文書，
