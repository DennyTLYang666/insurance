<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>第六章 金融消費者保護法</title><style>:root{--bg:#f7f6f2;--card:#fff;--ink:#222;--sub:#666;--line:#e3e0d8;--brand:#1f5f8b;--brand2:#e8f1f7;--ok:#2e7d32;--okbg:#e8f5e9;--bad:#b3261e;--badbg:#fdecea;--warn:#8a5a00;--warnbg:#fff4de}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
a{color:var(--brand)}
header{background:var(--brand);color:#fff;padding:12px 16px 14px}

.wrap{max-width:900px;margin:0 auto;padding:0 12px 60px}
.banner{background:var(--warnbg);color:var(--warn);border:1px solid #f0d9a8;border-radius:8px;padding:10px 12px;margin:12px 0;font-size:14px}
.banner b{margin-right:4px}
nav{position:sticky;top:0;background:var(--bg);z-index:5;display:flex;gap:6px;padding:10px 0;overflow-x:auto;border-bottom:1px solid var(--line)}

nav button[aria-selected="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
section{display:none;padding-top:14px}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 12px}
.card h3{margin:0 0 6px;font-size:17px}
.no{display:inline-block;background:var(--brand);color:#fff;border-radius:6px;padding:0 8px;margin-right:8px;font-size:14px}
.lab{display:inline-block;font-size:12px;border-radius:4px;padding:0 6px;margin-right:6px;vertical-align:1px}
.lab.fact{background:#e3f2e5;color:#1b5e20}.lab.my{background:#e8eaf6;color:#283593}.lab.hint{background:var(--warnbg);color:var(--warn)}
.mn{background:var(--brand2);border-radius:8px;padding:8px 10px;margin:8px 0}
details{margin:8px 0}details summary{cursor:pointer;color:var(--brand);font-size:15px}
.off{border-left:3px solid var(--brand);padding:2px 0 2px 10px;margin:8px 0;font-size:15px;color:#333}.off p{margin:4px 0}
table{border-collapse:collapse;width:100%;font-size:15px;background:#fff}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}th{background:var(--brand2)}
.tw{overflow-x:auto;margin-bottom:16px}
.fc{min-height:210px;display:flex;flex-direction:column;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.fc .q{font-size:19px;font-weight:600}.fc .a{font-size:16px;text-align:left;margin-top:8px}.fc small{color:var(--sub)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.btn{border:1px solid var(--brand);background:#fff;color:var(--brand);border-radius:8px;padding:9px 16px;font-size:16px;cursor:pointer}
.btn.pri{background:var(--brand);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0}.bar>i{display:block;height:100%;background:var(--ok)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;margin:6px 0;font-size:16px;cursor:pointer}
.opt.right{background:var(--okbg);border-color:var(--ok)}.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.why{display:none;background:var(--brand2);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:15px}
.stat{color:var(--sub);font-size:14px}
footer{color:var(--sub);font-size:13px;margin-top:24px}
.pager{display:flex;justify-content:space-between;gap:8px;margin-top:18px}.pager a{flex:1;text-align:center;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px;text-decoration:none;font-size:14px}
.hl{animation:hl 1.6s ease-out}@keyframes hl{0%{box-shadow:0 0 0 4px #ffd54f}100%{box-shadow:0 0 0 0 transparent}}
mark{background:#fff0a8;padding:0 1px}
.search{display:flex;gap:8px;margin:14px 0 6px}.search input{flex:1;font-size:17px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.res{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0;display:block;text-decoration:none;color:var(--ink)}
.res small{color:var(--sub)}.res b{color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.ch{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-decoration:none;color:var(--ink);display:block}
.ch:hover{border-color:var(--brand)}.ch h3{margin:0 0 4px;font-size:16px;color:var(--brand)}.ch p{margin:4px 0;font-size:14px}
.chip{display:inline-block;background:var(--brand2);color:#134;border-radius:999px;padding:0 9px;margin:2px 3px 2px 0;font-size:12.5px}
.filter{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.filter button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer}.filter button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
h2{font-size:18px;margin:24px 0 8px}

.pw{margin:6px 0}.pw p{margin:4px 0}.pl{margin:6px 0 6px 0;padding-left:20px}.pl li{margin:5px 0;line-height:1.7}.pl ul{margin:4px 0;padding-left:18px;list-style:disc}.pl ul li{margin:2px 0}.pl>li>b{color:#283593}
table.ft{font-size:14px;table-layout:fixed}table.ft td:first-child,table.ft th:first-child{font-weight:600;width:34%;word-break:break-all}table.ft td,table.ft th{word-break:break-word;padding:6px 7px}table.ft th{width:auto}
</style></head>

<script id="data" type="application/json">{"chapter": "第六章", "title": "金融消費者保護法", "laws": [{"pcode": "G0380226", "name": "金融消費者保護法", "amended": "民國112年12月6日", "url": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0380226", "source": "法務部全國法規資料庫", "retrieved": "2026-11-03", "mirrorDate": "20231206"}], "alerts": [{"t": "業務員最該記得的三件事", "d": "第9條『適合度』（先了解客戶）、第10條『說明與揭露風險』（充分說明重要內容）、第11條『賠償責任與舉證責任倒置』（保險公司要自己證明沒有違反）。三條是一組。"}, {"t": "風險（罰錢）", "d": "違反廣告招攬規定、適合度、說明揭露義務、酬金制度，處新臺幣30萬元以上1,000萬元以下罰鍰（第30-1條）。故意違規造成損害，法院可酌定損害額3倍以下的懲罰性賠償（第11-3條）。"}, {"t": "版本", "d": "本法最近一次修正為民國112年12月6日（第3、11-1、19條），民國113年2月1日施行。"}], "clauses": [{"no": "3", "title": "金融服務業的範圍", "plain": "金融服務業包括銀行業、證券業、期貨業、保險業、電子支付業，以及主管機關公告的其他金融服務業。", "mnemonic": "銀、證、期、保、電支。", "official": ["本法所定金融服務業，包括銀行業、證券業、期貨業、保險業、電子支付業及其他經主管機關公告之金融服務業。", "前項銀行業、證券業、期貨業及保險業之範圍，依金融監督管理委員會組織法第二條第三項規定。但不包括證券交易所、證券櫃檯買賣中心、證券集中保管事業、期貨交易所及其他經主管機關公告之事業。", "第一項所稱電子支付業，指電子支付機構管理條例第三條第一款之電子支付機構。"], "has_official": true}, {"no": "4", "title": "誰是金融消費者；『專業投資人』除外", "plain": "金融消費者是接受金融服務業提供金融商品或服務的人，但不包括專業投資機構，以及符合一定財力或專業能力的自然人或法人。金融服務業如果協助未達條件的人創造符合形式上的外觀，那個人仍是金融消費者。", "mnemonic": "原則上都是金融消費者；專業投資機構與符合財力專業條件者除外；包裝外觀不算數。", "tip": "『協助創造外觀』的處罰很重：第30-1條第2項，處1,000萬元以上5,000萬元以下罰鍰。", "official": ["本法所稱金融消費者，指接受金融服務業提供金融商品或服務者。但不包括下列對象：", "一、專業投資機構。", "二、符合一定財力或專業能力之自然人或法人。", "前項專業投資機構之範圍及一定財力或專業能力之條件，由主管機關定之。", "金融服務業對自然人或法人未符合前項所定之條件，而協助其創造符合形式上之外觀條件者，該自然人或法人仍為本法所稱金融消費者。"], "has_official": true}, {"no": "5", "title": "金融消費爭議", "plain": "金融消費爭議是金融消費者與金融服務業之間，因金融商品或服務所生的民事爭議。", "official": ["本法所稱金融消費爭議，指金融消費者與金融服務業間因商品或服務所生之民事爭議。"], "has_official": true}, {"no": "7", "title": "公平合理、誠信，契約疑義作有利於消費者的解釋", "plain": "金融服務業與消費者訂契約，要本於公平合理、平等互惠及誠信原則。契約條款顯失公平的，該部分無效；有疑義時，要作有利於金融消費者的解釋。金融服務業提供商品或服務，要盡善良管理人的注意義務；具有信託、委託性質的，還要負忠實義務。", "mnemonic": "公平誠信；顯失公平該部分無效；疑義有利消費者；善良管理人注意＋忠實義務。", "tip": "對照保險法第54條、第54-1條，兩部法律的概念相同：疑義有利被保險人（消費者）、顯失公平該部分無效。", "official": ["金融服務業與金融消費者訂立提供金融商品或服務之契約，應本公平合理、平等互惠及誠信原則。", "金融服務業與金融消費者訂立之契約條款顯失公平者，該部分條款無效；契約條款如有疑義時，應為有利於金融消費者之解釋。", "金融服務業提供金融商品或服務，應盡善良管理人之注意義務；其提供之金融商品或服務具有信託、委託等性質者，並應依所適用之法規規定或契約約定，負忠實義務。"], "has_official": true}, {"no": "8", "title": "廣告與招攬不得有虛偽、詐欺、隱匿", "plain": "金融服務業刊登廣告、進行業務招攬或營業促銷時，不得有虛偽、詐欺、隱匿或其他足以讓人誤信的情事，要確保廣告內容真實；對消費者所負的義務，不能低於廣告內容與招攬時所提示的資料或說明。另外，金融服務業不得藉金融教育宣導，引薦個別金融商品或服務。", "mnemonic": "廣告要真；承諾不低於廣告；教育宣導不能推銷個別商品。", "official": ["金融服務業刊登、播放廣告及進行業務招攬或營業促銷活動時，不得有虛偽、詐欺、隱匿或其他足致他人誤信之情事，並應確保其廣告內容之真實，其對金融消費者所負擔之義務不得低於前述廣告之內容及進行業務招攬或營業促銷活動時對金融消費者所提示之資料或說明。", "前項廣告、業務招攬及營業促銷活動之方式、內容及其他應遵行事項之辦法，由主管機關定之。", "金融服務業不得藉金融教育宣導，引薦個別金融商品或服務。"], "has_official": true}, {"no": "9", "title": "適合度：訂約前要充分了解消費者", "plain": "金融服務業在與消費者訂立提供金融商品或服務的契約前，應充分了解消費者的相關資料，確保商品或服務對消費者的適合度。要了解哪些資料、適合度應考量什麼，由主管機關訂定辦法。", "mnemonic": "訂約前先了解客戶，確保適合度。", "tip": "這是『了解客戶（KYC）』在金融消費者保護法的依據。", "official": ["金融服務業與金融消費者訂立提供金融商品或服務之契約前，應充分瞭解金融消費者之相關資料，以確保該商品或服務對金融消費者之適合度。", "前項應充分瞭解之金融消費者相關資料、適合度應考量之事項及其他應遵行事項之辦法，由主管機關定之。"], "has_official": true}, {"no": "10", "title": "說明義務與風險揭露；複雜性高風險商品要錄音或錄影", "plain": "訂約前，要向消費者充分說明金融商品、服務及契約的重要內容，並充分揭露風險。涉及個人資料的蒐集、處理與利用時，要說明個人資料保護的相關權利，以及拒絕同意可能的不利益。說明及揭露要用消費者能充分了解的文字或方式，內容至少包括交易成本、可能的收益及風險。複雜性高風險商品的說明與揭露，除了以非臨櫃的自動化通路交易，或消費者不同意外，要錄音或錄影。", "mnemonic": "充分說明重要內容＋充分揭露風險；成本、收益、風險都要講；複雜高風險商品錄音錄影。", "tip": "哪些屬於『複雜性高風險商品』，由主管機關依第11-2條第2項規定訂定類型。", "official": ["金融服務業與金融消費者訂立提供金融商品或服務之契約前，應向金融消費者充分說明該金融商品、服務及契約之重要內容，並充分揭露其風險。", "前項涉及個人資料之蒐集、處理及利用者，應向金融消費者充分說明個人資料保護之相關權利，以及拒絕同意可能之不利益；金融服務業辦理授信業務，應同時審酌借款戶、資金用途、還款來源、債權保障及授信展望等授信原則，不得僅因金融消費者拒絕授權向經營金融機構間信用資料之服務事業查詢信用資料，作為不同意授信之唯一理由。", "第一項金融服務業對金融消費者進行之說明及揭露，應以金融消費者能充分瞭解之文字或其他方式為之，其內容應包括但不限交易成本、可能之收益及風險等有關金融消費者權益之重要內容；其相關應遵循事項之辦法，由主管機關定之。", "金融服務業提供之金融商品屬第十一條之二第二項所定之複雜性高風險商品者，前項之說明及揭露，除以非臨櫃之自動化通路交易或金融消費者不予同意之情形外，應錄音或錄影。"], "has_official": true}, {"no": "11", "title": "違反適合度或說明義務的損害賠償與舉證", "plain": "金融服務業違反第9條、第10條，使消費者受損害，要負損害賠償責任。但金融服務業如果能證明：損害不是因為未充分了解消費者的商品或服務適合度，也不是因為未說明、說明不實、錯誤或未充分揭露風險而發生，就不用負責。", "mnemonic": "違反適合度或說明義務要賠；證明責任在金融服務業。", "tip": "『由金融服務業自己證明沒有違反』就是常說的舉證責任倒置。所以平常的紀錄、錄音、簽名文件很重要。", "official": ["金融服務業違反前二條規定，致金融消費者受有損害者，應負損害賠償責任。但金融服務業能證明損害之發生非因其未充分瞭解金融消費者之商品或服務適合度或非因其未說明、說明不實、錯誤或未充分揭露風險之事項所致者，不在此限。"], "has_official": true}, {"no": "11-1", "title": "業務人員酬金制度要衡平考量客戶權益", "plain": "金融服務業要訂定業務人員的酬金制度，提報董（理）事會通過。酬金制度要衡平考量客戶權益、商品或服務對金融服務業及客戶可能產生的各種風險，不能只考量業績目標的達成。制度應遵行的原則，由所屬同業公會擬訂或經主管機關指定的公會團體擬訂，報主管機關核定。", "mnemonic": "酬金制度：董事會通過；不能只看業績。", "official": ["金融服務業應訂定業務人員之酬金制度，並提報董（理）事會通過。", "前項酬金制度應衡平考量客戶權益、金融商品或服務對金融服務業及客戶可能產生之各項風險，不得僅考量金融商品或服務之業績目標達成情形。", "前項金融服務業業務人員酬金制度應遵行之原則，由所屬同業公會擬訂或經主管機關指定之公會團體擬訂，報請主管機關核定。"], "has_official": true}, {"no": "11-2", "title": "初次銷售複雜性高風險商品要經董事會通過", "plain": "金融服務業初次銷售的複雜性高風險商品，要報經董（理）事會或常務董（理）事會通過。複雜性高風險商品的類型由主管機關訂定。複雜性高風險商品及前條酬金制度，在外國金融服務業在臺分支機構，要經其在臺負責人同意。", "mnemonic": "第一次賣複雜高風險商品：董事會通過。", "official": ["金融服務業初次銷售之複雜性高風險商品應報經董（理）事會或常務董（理）事會通過。", "前項所定複雜性高風險商品類型，由主管機關定之。", "第一項複雜性高風險商品及前條第一項之酬金制度，於外國金融服務業在臺分支機構，應經其在臺負責人同意。"], "has_official": true}, {"no": "11-3", "title": "懲罰性賠償", "plain": "金融服務業因違反本法規定應負損害賠償責任，對於故意所致的損害，法院可因消費者的請求，依侵害情節，酌定損害額3倍以下的懲罰性賠償；對於過失所致的損害，可酌定損害額1倍以下的懲罰性賠償。這個請求權，自請求權人知有得受賠償的原因時起2年不行使而消滅；自賠償原因發生之日起逾5年者，亦同。", "facts": {"head": ["情形", "懲罰性賠償上限"], "rows": [["故意所致的損害", "損害額3倍以下"], ["過失所致的損害", "損害額1倍以下"], ["請求權時效", "知有得受賠償原因時起2年；賠償原因發生日起逾5年亦消滅"]]}, "mnemonic": "故意三倍、過失一倍；時效2年、5年。", "official": ["金融服務業因違反本法規定應負損害賠償責任者，對於故意所致之損害，法院得因金融消費者之請求，依侵害情節，酌定損害額三倍以下之懲罰性賠償；對於過失所致之損害，得酌定損害額一倍以下之懲罰性賠償。", "前項懲罰性賠償請求權，自請求權人知有得受賠償之原因時起二年間不行使而消滅；自賠償原因發生之日起逾五年者，亦同。"], "has_official": true}, {"no": "13", "title": "爭議處理流程：先申訴，再申請評議", "plain": "消費者就金融消費爭議事件，要先向金融服務業提出申訴。金融服務業要在收到申訴之日起30日內為適當的處理，並把結果回覆。消費者不接受處理結果，或金融服務業逾30日不處理的，消費者可以在收受處理結果或期限屆滿之日起60日內，向爭議處理機構申請評議。", "facts": {"head": ["步驟", "誰、多久"], "rows": [["一、申訴", "消費者先向金融服務業申訴"], ["二、處理", "金融服務業收受申訴之日起30日內處理並回覆"], ["三、申請評議", "不接受處理結果或逾期不處理，收受結果或期限屆滿之日起60日內，向爭議處理機構申請"]]}, "mnemonic": "先申訴；公司三十日回覆；不滿意六十日內申請評議。", "official": ["為公平合理、迅速有效處理金融消費爭議，以保護金融消費者權益，應依本法設立爭議處理機構。", "金融消費者就金融消費爭議事件應先向金融服務業提出申訴，金融服務業應於收受申訴之日起三十日內為適當之處理，並將處理結果回覆提出申訴之金融消費者；金融消費者不接受處理結果者或金融服務業逾上述期限不為處理者，金融消費者得於收受處理結果或期限屆滿之日起六十日內，向爭議處理機構申請評議；金融消費者向爭議處理機構提出申訴者，爭議處理機構之金融消費者服務部門應將該申訴移交金融服務業處理。", "爭議處理機構除處理金融消費爭議外，並應辦理對金融服務業及金融消費者之教育宣導，使金融服務業與金融消費者均能充分瞭解正確之金融消費觀念及金融消費關係之權利與義務，以有效預防金融消費爭議發生。", "爭議處理機構辦理金融消費爭議處理及前項業務，得向金融服務業收取年費及爭議處理服務費。", "前項年費及服務費之收取標準及有關規定由主管機關定之。"], "has_official": true}, {"no": "29", "title": "評議成立與金融服務業的接受義務", "plain": "當事人要在評議書所載期限內，用書面通知爭議處理機構接受或拒絕評議決定，評議經雙方都接受才成立。金融服務業如果事前書面同意，或在商品、服務契約等文件中表明願意適用本法的爭議處理程序，對於評議決定中每一筆金額在一定額度以下的給付，一定要接受。一定額度由爭議處理機構擬訂，報主管機關核定公告。", "mnemonic": "雙方接受才成立；金融服務業對一定額度以下的評議決定要接受。", "official": ["當事人應於評議書所載期限內，以書面通知爭議處理機構，表明接受或拒絕評議決定之意思。評議經當事人雙方接受而成立。", "金融服務業於事前以書面同意或於其商品、服務契約或其他文件中表明願意適用本法之爭議處理程序者，對於評議委員會所作其應向金融消費者給付每一筆金額或財產價值在一定額度以下之評議決定，應予接受；評議決定超過一定額度，而金融消費者表明願意縮減該金額或財產價值至一定額度者，亦同。", "前項一定額度，由爭議處理機構擬訂，報請主管機關核定後公告之。"], "has_official": true}, {"no": "30", "title": "評議書經法院核可，與確定判決同效力", "plain": "消費者可以在評議成立之日起90日的不變期間內，申請爭議處理機構把評議書送法院核可。評議書經法院核可後，與民事確定判決有同一效力，當事人不能再就該事件起訴，也不能再依本法申訴或申請評議。", "mnemonic": "評議成立後90日內送法院核可；核可後等同確定判決。", "official": ["金融消費者得於評議成立之日起九十日之不變期間內，申請爭議處理機構將評議書送請法院核可。爭議處理機構應於受理前述申請之日起五日內，將評議書及卷證送請爭議處理機構事務所所在地之管轄地方法院核可。但爭議處理機構送請法院核可前，金融服務業已依評議成立之內容完全履行者，免送請核可。", "除有第三項情形外，法院對於前項之評議書應予核可。法院核可後，應將經核可之評議書併同評議事件卷證發還爭議處理機構，並將經核可之評議書以正本送達當事人及其代理人。", "法院因評議書內容牴觸法令、違背公共秩序或善良風俗或有其他不能強制執行之原因而未予核可者，法院應將其理由通知爭議處理機構及當事人。", "評議書依第二項規定經法院核可者，與民事確定判決有同一之效力，當事人就該事件不得再行起訴或依本法申訴、申請評議。", "評議書經法院核可後，依法有無效或得撤銷之原因者，當事人得向管轄地方法院提起宣告評議無效或撤銷評議之訴。", "前項情形，準用民事訴訟法第五百條至第五百零二條及第五百零六條、強制執行法第十八條第二項規定。"], "has_official": true}, {"no": "30-1", "title": "違反招攬、適合度、說明義務、酬金制度的罰鍰", "plain": "金融服務業有下列情形之一，處新臺幣30萬元以上1,000萬元以下罰鍰：違反廣告、業務招攬、營業促銷的方式或內容規定；違反第9條未充分了解消費者資料及確保適合度；違反第10條未充分說明或揭露風險；違反第11-1條酬金制度規定。協助不符資格的人創造專業投資人外觀的，處1,000萬元以上5,000萬元以下罰鍰。情節重大的，主管機關可以在所得利益範圍內酌量加重。", "facts": {"head": ["情形", "罰鍰"], "rows": [["違反廣告招攬規定、未確保適合度、未充分說明揭露風險、酬金制度未依規定", "新臺幣30萬元以上1,000萬元以下"], ["協助不符資格者創造專業投資人的形式外觀", "新臺幣1,000萬元以上5,000萬元以下"], ["情節重大", "主管機關可在所得利益範圍內酌量加重，不受最高額限制"]]}, "mnemonic": "三十萬到一千萬；包裝專業投資人，一千萬到五千萬。", "official": ["金融服務業有下列情形之一者，處新臺幣三十萬元以上一千萬元以下罰鍰：", "一、違反第八條第二項所定辦法中有關廣告、業務招攬、營業促銷活動方式或內容之規定。", "二、違反第九條第一項規定未充分瞭解金融消費者相關資料及確保金融消費者之適合度，或同條第二項所定辦法中有關適合度應考量事項之規定。", "三、違反第十條第一項規定，未向金融消費者充分說明金融商品、服務、契約之重要內容或充分揭露風險，或違反同條第三項所定辦法中有關說明、揭露應以金融消費者能充分瞭解之方式或內容之規定。", "四、違反第十一條之一規定，未訂定或未依主管機關核定應遵行之原則訂定酬金制度或未確實執行。", "金融服務業對自然人或法人未符合第四條第二項所定之條件，而協助其創造符合形式上之外觀條件者，處新臺幣一千萬元以上五千萬元以下罰鍰。", "金融服務業有前二項情形之一，且情節重大者，主管機關得於其所得利益之範圍內酌量加重，不受前二項罰鍰最高額之限制。"], "has_official": true}], "tables": [{"title": "第9條、第10條、第11條：三條一組", "head": ["條", "義務", "重點"], "rows": [["9", "適合度", "訂約前充分了解消費者相關資料，確保商品或服務對其適合"], ["10", "說明與揭露", "充分說明重要內容、充分揭露風險；成本、收益、風險都要講；複雜高風險商品錄音錄影"], ["11", "賠償與舉證", "違反9、10條致損害要賠；除非自己證明損害與未了解適合度、未說明或未揭露風險無關"]]}, {"title": "數字速記：金融消費者保護法", "head": ["條", "數字", "什麼事"], "rows": [["13", "30日", "金融服務業處理申訴並回覆的期限"], ["13", "60日", "不滿意處理結果或逾期，申請評議的期限"], ["30", "90日", "評議成立後，申請送法院核可的不變期間"], ["11-3", "3倍／1倍", "故意損害：3倍以下；過失損害：1倍以下"], ["11-3", "2年／5年", "懲罰性賠償請求權時效"], ["30-1", "30萬～1,000萬", "一般違規罰鍰"], ["30-1", "1,000萬～5,000萬", "協助創造專業投資人外觀"]]}], "cards": [{"id": 1, "ref": "3", "front": "金融服務業包括哪些行業？", "back": "銀行業、證券業、期貨業、保險業、電子支付業及主管機關公告的其他金融服務業。"}, {"id": 2, "ref": "4", "front": "哪兩類人不算金融消費者？", "back": "專業投資機構，以及符合一定財力或專業能力的自然人或法人。"}, {"id": 3, "ref": "7", "front": "金融服務業與消費者的契約條款有疑義時，怎麼解釋？", "back": "作有利於金融消費者的解釋。"}, {"id": 4, "ref": "8", "front": "金融服務業可以藉金融教育宣導引薦個別金融商品嗎？", "back": "不可以。第8條第3項。"}, {"id": 5, "ref": "9", "front": "第9條『適合度』要求金融服務業在訂約前做什麼？", "back": "充分了解消費者的相關資料，確保商品或服務對消費者的適合度。"}, {"id": 6, "ref": "10", "front": "第10條的說明內容至少要包括什麼？", "back": "交易成本、可能的收益及風險等有關消費者權益的重要內容。"}, {"id": 7, "ref": "10", "front": "複雜性高風險商品的說明揭露，原則上要怎麼留存？", "back": "錄音或錄影（非臨櫃的自動化通路交易、消費者不同意者除外）。"}, {"id": 8, "ref": "11", "front": "違反第9、10條致消費者受損害，誰要證明什麼？", "back": "金融服務業要證明損害的發生非因其未了解適合度，或未說明、說明不實、未充分揭露風險。"}, {"id": 9, "ref": "11-1", "front": "業務人員酬金制度不能只考量什麼？", "back": "業績目標達成情形；要衡平考量客戶權益與各項風險。"}, {"id": 10, "ref": "11-3", "front": "懲罰性賠償：故意與過失的上限？", "back": "故意：損害額3倍以下；過失：1倍以下。"}, {"id": 11, "ref": "13", "front": "金融服務業收到申訴後，幾日內要處理並回覆？", "back": "30日內。"}, {"id": 12, "ref": "13", "front": "不接受處理結果，申請評議的期限？", "back": "收受處理結果或期限屆滿之日起60日內，向爭議處理機構申請。"}, {"id": 13, "ref": "30", "front": "評議成立後多久內可申請送法院核可？", "back": "90日的不變期間。"}, {"id": 14, "ref": "30-1", "front": "一般違反廣告、適合度、說明義務的罰鍰範圍？", "back": "新臺幣30萬元以上1,000萬元以下。"}], "scenarios": [{"ref": "9", "q": "保險公司在客戶投保前，沒有了解客戶的財務狀況與需求，就推薦高風險商品。主要違反金融消費者保護法哪一條？", "opts": ["第9條（適合度）", "第13條（申訴）", "第29條（評議成立）", "第30條（法院核可）"], "ans": 0, "why": "第9條：訂約前要充分了解消費者相關資料，確保商品對消費者的適合度。"}, {"ref": "11", "q": "客戶主張保險公司未充分說明風險而受損失。依第11條，誰要證明損害與未說明無關？", "opts": ["客戶", "金融服務業", "法院", "主管機關"], "ans": 1, "why": "第11條但書：金融服務業能證明損害的發生非因其未說明、說明不實、錯誤或未充分揭露風險者，才免責。舉證責任在金融服務業。"}, {"ref": "13", "q": "客戶向保險公司申訴，公司逾30日都不處理。客戶下一步？", "opts": ["只能等待", "自期限屆滿之日起60日內向爭議處理機構申請評議", "直接申請法院核可", "向業務員索賠"], "ans": 1, "why": "第13條第2項：金融服務業逾期不處理者，消費者可於期限屆滿之日起60日內向爭議處理機構申請評議。"}, {"ref": "11-3", "q": "金融服務業因故意違反本法造成損害，法院可酌定懲罰性賠償最高為損害額的？", "opts": ["1倍", "2倍", "3倍", "5倍"], "ans": 2, "why": "第11-3條：故意：損害額3倍以下；過失：1倍以下。"}, {"ref": "30", "q": "評議成立後，消費者要申請爭議處理機構把評議書送法院核可，期限是？", "opts": ["30日", "60日", "90日", "1年"], "ans": 2, "why": "第30條第1項：評議成立之日起90日的不變期間。"}, {"ref": "10", "q": "依第10條，下列哪一項不是說明內容必須包括的？", "opts": ["交易成本", "可能的收益", "風險", "業務員的酬金金額"], "ans": 3, "why": "第10條第3項：說明及揭露內容包括交易成本、可能收益及風險等有關消費者權益的重要內容。酬金制度是第11-1條，由金融服務業內部制定，不是向消費者說明的必備項目。"}, {"ref": "4", "q": "金融服務業協助未符合資格的客戶，創造符合專業投資人的形式外觀。該客戶仍是？", "opts": ["專業投資人", "金融消費者", "無需保護", "由業務員決定"], "ans": 1, "why": "第4條第3項：仍為本法所稱金融消費者。金融服務業還會被處1,000萬元以上5,000萬元以下罰鍰（第30-1條第2項）。"}, {"ref": "30-1", "q": "金融服務業違反第10條，未充分說明並揭露風險。罰鍰範圍？", "opts": ["新臺幣1萬至10萬", "新臺幣30萬至1,000萬", "新臺幣1,000萬至5,000萬", "不處罰鍰"], "ans": 1, "why": "第30-1條第1項第3款：違反第10條第1項，處30萬元以上1,000萬元以下罰鍰。"}], "chNo": "06", "summary": "金融消費者保護法中和業務員最相關的：適合度、說明與揭露風險、舉證責任倒置、懲罰性賠償、申訴與評議流程，以及罰鍰。", "scope": "收錄金融消費者保護法第3、4、5、7、8、9、10、11、11-1、11-2、11-3、13、29、30、30-1條。", "nav": {"prev": {"file": "ch05.html", "label": "第5章 保險業務員：登錄、招攬行為與懲處（保險業務員管理規則）"}, "next": {"file": "ch07.html", "label": "第7章 個人資料保護法（保險業務最常用的條文）"}}}</script>
<script>const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>{t=String(t||'');const ss=t.split(/(?<=。)/).map(x=>x.trim()).filter(Boolean);if(t.length<=90||ss.length<2&&t.indexOf('；')<0)return '<p>'+esc(t)+'</p>';
  const li=s=>{s=s.replace(/。$/,'');const m=s.match(/^([^：；]{1,40})：(.+)$/);if(m&&m[2].split('；').length>=3)return '<li><b>'+esc(m[1])+'</b><ul>'+m[2].split('；').map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></li>';
    const parts=s.split('；');if(parts.length>=3)return '<li>'+parts.map(x=>esc(x)).join('<br>')+'</li>';return '<li>'+esc(s)+'</li>'};
  return '<ul class="pl">'+ss.map(li).join('')+'</ul>'};
const factsT=f=>f?'<div class="tw"><table class="ft"><thead><tr>'+f.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+f.rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'';
const lab=x=>/^[保規]\d+(-\d+)?$/.test(x)?({'保':'保險法','規':'管理規則'}[x[0]])+'第'+x.slice(1)+'條':/^[一二三四五六七八九十]+(之[一二三四五六七八九十]+)?$/.test(x)?'第'+x+'點':/^[0-9]+(-[0-9]+)?$/.test(x)?'第'+x+'條':x;
const mem={};
const store={get(k){try{const v=localStorage.getItem(k);return v===null?mem[k]:v}catch(e){return mem[k]}},set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const BOXKEY='twlife_boxes_v2';
let boxes={};try{boxes=JSON.parse(store.get(BOXKEY)||'{}')}catch(e){boxes={}}
const saveBoxes=()=>store.set(BOXKEY,JSON.stringify(boxes));
function Flash(root,getCards){
  let queue=[],cur=null,flipped=false;
  function build(){const cs=getCards();queue=shuffle(cs.filter(c=>(boxes[c.key]||0)<1)).sort((a,b)=>(boxes[a.key]||0)-(boxes[b.key]||0));flipped=false}
  function render(){
    const cs=getCards(),n=cs.length,done=cs.filter(c=>(boxes[c.key]||0)>=1).length;
    let h='<div class="stat">已熟練 '+done+' / '+n+' 張（答對 1 次視為熟練，進度存在這個瀏覽器）</div><div class="bar"><i style="width:'+(n?done/n*100:0)+'%"></i></div>';
    if(!n){root.innerHTML=h+'<div class="card"><p>沒有可用的閃卡。</p></div>';return}
    if(!queue.length){root.innerHTML=h+'<div class="card"><h3>全部熟練了</h3><p>可以去做情境題，或重設後再來一輪。</p></div><div class="row"><button class="btn" data-a="reset">重設進度</button></div>';return}
    cur=queue[0];
    h+='<div class="card fc" tabindex="0" role="button" data-a="flip"><small>'+(cur.tag?esc(cur.tag)+'｜':'')+esc(lab(cur.ref))+'｜剩 '+queue.length+' 張</small><div class="q">'+esc(cur.front)+'</div>'+(flipped?'<div class="a"><span class="lab fact">答案</span>'+esc(cur.back)+'</div>':'<small>點一下翻面</small>')+'</div>';
    if(flipped)h+='<div class="row"><button class="btn bad" data-a="no">還不熟</button><button class="btn ok" data-a="yes">會了</button></div>';
    h+='<div class="row"><button class="btn" data-a="reset">重設進度</button></div>';
    root.innerHTML=h;
  }
  root.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
    if(a==='flip'){flipped=!flipped;render()}
    else if(a==='reset'){if(confirm('確定要清除這些閃卡的進度？')){getCards().forEach(c=>delete boxes[c.key]);saveBoxes();build();render()}}
    else if(cur&&(a==='yes'||a==='no')){const ok=a==='yes';boxes[cur.key]=ok?Math.min(1,(boxes[cur.key]||0)+1):0;saveBoxes();queue.shift();if(!ok||boxes[cur.key]<1)queue.splice(queue.length?Math.max(1,Math.min(queue.length,ok?6:3)):0,0,cur);flipped=false;render()}});
  root.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.fc')){e.preventDefault();flipped=!flipped;render()}});
  return {refresh(){build();render()}};
}
function Quiz(root,getItems,perRound){
  let items=[],score=0,answered=0,done=false;
  function draw(){
    const perms=items.map(s=>shuffle(s.opts.map((_,k)=>k)));
    root.innerHTML='<div class="stat" id="sc"></div>'+items.map((s,i)=>'<div class="card" data-i="'+i+'"><b>'+(i+1)+'. </b><span class="lab my">'+(s.tag?esc(s.tag)+' ':'')+esc(lab(s.ref))+'</span>'+esc(s.q)+perms[i].map((k,pos)=>'<button class="opt" data-o="'+k+'">'+String.fromCharCode(65+pos)+'. '+esc(s.opts[k])+'</button>').join('')+'<div class="why"></div></div>').join('')+'<div id="qend"></div>';
    score=0;answered=0;upd();
  }
  function upd(){const el=$('#sc',root);if(el)el.textContent='已作答 '+answered+' / '+items.length+'，答對 '+score+' 題';
    if(perRound&&answered===items.length&&items.length){$('#qend',root).innerHTML='<div class="card"><h3>這一組：'+score+' / '+items.length+'</h3></div><div class="row"><button class="btn pri" data-a="again">再來一組</button></div>'}}
  function again(){const all=getItems();items=perRound?shuffle(all).slice(0,perRound):all;draw()}
  root.addEventListener('click',e=>{
    const ag=e.target.closest('[data-a="again"]');if(ag){again();window.scrollTo(0,root.offsetTop-60);return}
    const b=e.target.closest('.opt');if(!b)return;const box=b.closest('.card');if(box.dataset.done)return;
    const s=items[+box.dataset.i],j=+b.dataset.o;box.dataset.done=1;answered++;if(j===s.ans)score++;
    let right='';$$('.opt',box).forEach((x,pos)=>{const k=+x.dataset.o;if(k===s.ans){x.classList.add('right');right=String.fromCharCode(65+pos)}else if(k===j)x.classList.add('wrong')});
    const w=$('.why',box);w.style.display='block';w.innerHTML=(j===s.ans?'答對了。':'答錯了，正解是 '+right+'。')+esc(s.why);upd()});
  return {refresh:again};
}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const LAWS=D.laws;
$('#h1').textContent=D.chapter+'｜'+D.title;
$('#intro').textContent=D.summary||'';
document.title=D.chapter+' '+D.title;
$('#foot').innerHTML='官方來源：'+LAWS.map(L=>esc(L.name)+'（'+esc(L.amended)+(L.kind==='press'?'發布':'修正')+'）'+(L.note?'｜'+esc(L.note)+'｜':'')+'<a href="'+esc(L.url)+'" target="_blank" rel="noopener">'+esc(L.url)+'</a>').join('<br>')+(D.scope?'<br>'+esc(D.scope):'')+'<br>條文原文取自全國法規資料庫；「白話」「口訣」「情境題」為編寫者整理，不是法條。法規可能再修正，請以官方最新公告為準；本內容不是法律意見。';
const TABS=[['read','條文速讀'],['table','對照表'],['cards','閃卡'],['quiz','情境題']];
const nav=$('#nav');
TABS.forEach(([id,name])=>{const b=document.createElement('button');b.textContent=name;b.setAttribute('role','tab');b.dataset.id=id;b.onclick=()=>show(id);nav.appendChild(b)});
let curTab='read';
function show(id,anchor){curTab=id;TABS.forEach(([t])=>$('#s-'+t).classList.toggle('on',t===id));$$('button',nav).forEach(b=>b.setAttribute('aria-selected',b.dataset.id===id));
  history.replaceState(null,'','#'+id+(anchor?'/'+anchor:''));
  if(anchor){const el=document.getElementById(anchor);if(el){const d=el.querySelector('details');el.scrollIntoView({block:'start'});el.classList.add('hl')}}else window.scrollTo(0,0)}
$('#s-read').innerHTML=(D.alerts||[]).map(a=>'<div class="banner"><b>'+esc(a.t)+'</b>'+esc(a.d)+'</div>').join('')+D.clauses.map(c=>{
  const off=c.official.map(p=>'<p>'+esc(p)+'</p>').join('');
  return '<div class="card" id="c'+esc(c.no)+'"><h3><span class="no">'+esc(lab(c.no))+'</span>'+esc(c.title)+'</h3>'
   +'<div class="pw"><span class="lab my">白話</span>'+fmt(c.plain)+'</div>'+factsT(c.facts)
   +(c.mnemonic?'<div class="mn"><span class="lab my">口訣</span>'+esc(c.mnemonic)+'</div>':'')
   +(c.tip?'<p><span class="lab hint">提醒</span>'+esc(c.tip)+'</p>':'')
   +(c.official.length?'<details><summary>展開官方條文原文</summary><div class="off"><span class="lab fact">原文</span>'+off+'</div></details>':'')+'</div>'}).join('');
$('#s-table').innerHTML=D.tables.map((t,i)=>'<h3 id="t'+i+'">'+esc(t.title)+'</h3><div class="tw"><table><thead><tr>'+t.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+t.rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>').join('');
const cardsAll=D.cards.map(c=>({key:'ch'+D.chNo+':'+c.id,ref:c.ref,front:c.front,back:c.back}));
const fl=Flash($('#s-cards'),()=>cardsAll);fl.refresh();
const qz=Quiz($('#s-quiz'),()=>D.scenarios,0);qz.refresh();
// 上下章
const N=D.nav||{};
function setLink(el,o,dir){if(o){el.href=o.file;el.textContent=dir==='p'?'← '+o.label:o.label+' →'}else{el.style.visibility='hidden'}}
setLink($('#prev'),N.prev,'p');setLink($('#next'),N.next,'n');
// 左右滑動：換分頁，到頭就換章
function step(d){const i=TABS.findIndex(t=>t[0]===curTab)+d;
  if(i<0){if(N.prev)location.href=N.prev.file+'#read';return}
  if(i>=TABS.length){if(N.next)location.href=N.next.file+'#read';return}
  show(TABS[i][0])}
let sx=0,sy=0,skip=false;
document.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;const el=e.target&&e.target.nodeType===1?e.target:(e.target&&e.target.parentElement);skip=!!(el&&el.closest('.tw,nav,input,.off'))},{passive:true});
document.addEventListener('touchend',e=>{if(skip)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>70&&Math.abs(dy)<45){step(dx<0?1:-1)}},{passive:true});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1)});
// 深層連結
function route(){const h=(location.hash||'#read').slice(1).split('/');show(TABS.some(t=>t[0]===h[0])?h[0]:'read',h[1]?decodeURIComponent(h[1]):null)}
window.addEventListener('hashchange',route);route();
</script></body></html>
