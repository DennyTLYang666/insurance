<script id="data" type="application/json">{"chapter": "第三章", "title": "人壽保險（保險法第101至124條）", "laws": [{"pcode": "G0390002", "name": "保險法", "amended": "民國114年6月18日", "url": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=G0390002", "source": "法務部全國法規資料庫", "retrieved": "2026-11-03", "mirrorDate": "20250618"}], "alerts": [{"t": "近期修正（事實，取自官網沿革）", "d": "第116條民國111年11月30日修正；第123-1、123-2條是民國114年6月18日新增的（解約金債權不得扣押、債務人保單的新要保人變更）。舊教材可能沒有這兩條，以本頁官方原文為準。"}, {"t": "全章最容易混的五個詞", "d": "無效（第105、107、107-1、122條）、失效（第17條）、停效（第116、120條）、解除（第64條）、終止（第116、119條）。下面有一張對照表。"}, {"t": "金額會變的地方", "d": "第107條的喪葬費用上限，連結到遺產及贈與稅法第17條的喪葬費扣除額，金額會調整，本頁不寫死數字。"}], "clauses": [{"no": "101", "title": "人壽保險人的給付責任", "plain": "被保險人在契約規定的年限內死亡，或契約年限屆滿仍生存時，保險人都要依約給付保險金額。", "mnemonic": "年限內死亡賠；屆滿生存也賠。", "official": ["人壽保險人於被保險人在契約規定年限內死亡，或屆契約規定年限而仍生存時，依照契約負給付保險金額之責。"], "has_official": true}, {"no": "102", "title": "保險金額依契約所定", "plain": "人壽保險的保險金額，照保險契約約定。", "official": ["人壽保險之保險金額，依保險契約之所定。"], "has_official": true}, {"no": "103", "title": "人壽保險人不得代位", "plain": "人壽保險的保險人，不能代位行使要保人或受益人因保險事故對第三人的請求權。", "mnemonic": "壽險沒有代位。", "tip": "對照『損害填補、代位』是財產保險的原則；人壽保險是以人的生命為標的，這條是明文排除代位。", "official": ["人壽保險之保險人，不得代位行使要保人或受益人因保險事故所生對於第三人之請求權。"], "has_official": true}, {"no": "104", "title": "本人或第三人都可訂立", "plain": "人壽保險契約可以由本人訂立，也可以由第三人訂立。", "official": ["人壽保險契約，得由本人或第三人訂立之。"], "has_official": true}, {"no": "105", "title": "第三人訂死亡保險：被保險人的書面同意", "plain": "由第三人訂立的死亡保險契約，沒有經被保險人書面同意並約定保險金額，契約無效。被保險人給的同意可以隨時撤銷，撤銷要用書面通知保險人和要保人。被保險人行使撤銷權，視為要保人終止保險契約。", "mnemonic": "第三人訂死亡險：要書面同意＋約定金額，否則無效；可隨時撤銷，等於終止。", "tip": "『無效』（第105條）和第17條的『失效』用語不同。第16條有保險利益還不夠，第105條還要被保險人書面同意。", "official": ["由第三人訂立之死亡保險契約，未經被保險人書面同意，並約定保險金額，其契約無效。", "被保險人依前項所為之同意，得隨時撤銷之。其撤銷之方式應以書面通知保險人及要保人。", "被保險人依前項規定行使其撤銷權者，視為要保人終止保險契約。"], "has_official": true}, {"no": "106", "title": "第三人訂立契約：權利移轉或出質要被保險人書面承認", "plain": "由第三人訂立的人壽保險契約，權利要移轉或出質，沒有經被保險人書面承認，不生效力。", "official": ["由第三人訂立之人壽保險契約，其權利之移轉或出質，非經被保險人以書面承認者，不生效力。"], "has_official": true}, {"no": "107", "title": "未滿15歲未成年人為被保險人", "plain": "以未滿15歲的未成年人為被保險人訂立的人壽保險契約，除了喪葬費用的給付外，其餘死亡給付的約定，到被保險人滿15歲時才生效。喪葬費用的保險金額，不能超過遺產及贈與稅法第17條遺產稅喪葬費扣除額的一半。其他法律另有規定的，從其規定。", "mnemonic": "未滿十五，死亡給付要等滿十五；喪葬費例外，且不超過喪葬費扣除額一半。", "tip": "喪葬費扣除額的金額由遺產及贈與稅法第17條決定，會調整；考試前先查最新數字。", "official": ["以未滿十五歲之未成年人為被保險人訂立之人壽保險契約，除喪葬費用之給付外，其餘死亡給付之約定於被保險人滿十五歲時始生效力。", "前項喪葬費用之保險金額，不得超過遺產及贈與稅法第十七條有關遺產稅喪葬費扣除額之一半。", "前二項於其他法律另有規定者，從其規定。"], "has_official": true}, {"no": "107-1", "title": "受監護宣告者為被保險人", "plain": "訂立人壽保險契約時，以受監護宣告尚未撤銷的人為被保險人，除了喪葬費用的給付外，其餘死亡給付部分無效。喪葬費用的保險金額，一樣不能超過遺產稅喪葬費扣除額的一半。", "mnemonic": "受監護宣告：死亡給付無效，喪葬費例外。", "tip": "和第107條對照：未滿15歲是『滿15歲才生效』；受監護宣告是『該部分無效』。", "official": ["訂立人壽保險契約時，以受監護宣告尚未撤銷者為被保險人，除喪葬費用之給付外，其餘死亡給付部分無效。", "前項喪葬費用之保險金額，不得超過遺產及贈與稅法第十七條有關遺產稅喪葬費扣除額之一半。", "前二項規定於其他法律另有規定者，從其規定。"], "has_official": true}, {"no": "108", "title": "人壽保險契約的特別記載事項", "plain": "人壽保險契約除了第55條規定的八項，還要載明四項：被保險人的姓名、性別、年齡及住所；受益人的姓名及與被保險人的關係，或確定受益人的方法；請求保險金額的保險事故及時期；依第118條有減少保險金額的條件時，其條件。", "mnemonic": "被保人資料、受益人、事故及時期、減額條件。", "official": ["人壽保險契約，除記載第五十五條規定事項外，並應載明左列事項：", "一、被保險人之姓名、性別、年齡及住所。", "二、受益人姓名及與被保險人之關係或確定受益人之方法。", "三、請求保險金額之保險事故及時期。", "四、依第一百十八條之規定，有減少保險金額之條件者，其條件。"], "has_official": true}, {"no": "109", "title": "自殺與犯罪處死、拒捕、越獄致死", "plain": "被保險人故意自殺，保險人不負給付保險金額的責任，但要把保單價值準備金返還給應得之人。契約如果載有『被保險人故意自殺，保險人仍應給付』的條款，這個條款要到訂約2年後才生效；恢復效力的契約，2年從恢復效力之日起算。被保險人因犯罪處死、拒捕或越獄致死，保險人不負給付責任，但保險費付足2年以上的，要把保單價值準備金返還給應得之人。", "facts": {"head": ["情形", "保險金", "準備金", "2年的意思"], "rows": [["故意自殺", "不給付", "返還保單價值準備金", "契約載有仍給付條款者，訂約2年後該條款才生效；復效的從復效日起算"], ["犯罪處死、拒捕、越獄致死", "不給付", "保險費付足2年以上，才返還準備金", "付足2年以上"]]}, "mnemonic": "自殺：賠不賠看約定，約定要等兩年；犯罪處死：付足兩年才退準備金。", "tip": "復效後自殺條款的2年是『重新』從復效日算起，這是常見陷阱。", "official": ["被保險人故意自殺者，保險人不負給付保險金額之責任。但應將保險之保單價值準備金返還於應得之人。", "保險契約載有被保險人故意自殺，保險人仍應給付保險金額之條款者，其條款於訂約二年後始生效力。恢復停止效力之保險契約，其二年期限應自恢復停止效力之日起算。", "被保險人因犯罪處死或拒捕或越獄致死者，保險人不負給付保險金額之責任。但保險費已付足二年以上者，保險人應將其保單價值準備金返還於應得之人。"], "has_official": true}, {"no": "110", "title": "指定受益人", "plain": "要保人可以通知保險人，將保險金額的全部或一部分，給付給他指定的受益人一人或數人。指定的受益人，要在請求保險金額時還活著才有資格。", "mnemonic": "可指定一人或數人；請求時要活著。", "official": ["要保人得通知保險人，以保險金額之全部或一部，給付其所指定之受益人一人或數人。", "前項指定之受益人，以於請求保險金額時生存者為限。"], "has_official": true}, {"no": "111", "title": "指定受益人後，要保人的處分權", "plain": "受益人經指定後，要保人對那份保險利益，除非聲明放棄處分權，仍然可以用契約或遺囑處分。要保人行使處分權，沒有通知保險人就不能對抗保險人。", "mnemonic": "指定後仍可處分，除非放棄；沒通知，不能對抗保險人。", "tip": "第16-1條就是讓要保人『放棄第111條處分權』的情形。", "official": ["受益人經指定後，要保人對其保險利益，除聲明放棄處分權者外，仍得以契約或遺囑處分之。", "要保人行使前項處分權，非經通知，不得對抗保險人。"], "has_official": true}, {"no": "112", "title": "指定受益人的死亡保險金不是遺產", "plain": "保險金額約定在被保險人死亡時給付給他指定的受益人，這筆金額不能當作被保險人的遺產。", "mnemonic": "有指定受益人，不是遺產。", "tip": "遺產稅怎麼課，是遺產及贈與稅法與所得基本稅額條例的規定，不是本條；本頁沒有收錄。", "official": ["保險金額約定於被保險人死亡時給付於其所指定之受益人者，其金額不得作為被保險人之遺產。"], "has_official": true}, {"no": "113", "title": "沒指定受益人的死亡保險金是遺產", "plain": "死亡保險契約沒有指定受益人時，保險金額作為被保險人的遺產。", "mnemonic": "沒指定受益人，變遺產。", "official": ["死亡保險契約未指定受益人者，其保險金額作為被保險人之遺產。"], "has_official": true}, {"no": "114", "title": "受益人轉讓利益的限制", "plain": "受益人沒有經要保人同意，或保險契約沒有載明允許轉讓時，不能把他的利益轉讓給別人。", "mnemonic": "轉讓受益利益：要保人同意或契約允許。", "official": ["受益人非經要保人之同意，或保險契約載明允許轉讓者，不得將其利益轉讓他人。"], "has_official": true}, {"no": "115", "title": "利害關係人可代繳保險費", "plain": "利害關係人都可以代要保人交付保險費。", "mnemonic": "利害關係人可代繳。", "official": ["利害關係人，均得代要保人交付保險費。"], "has_official": true}, {"no": "116", "title": "保險費到期未交：催告、停效、復效、終止", "plain": "保險費到期沒繳，除契約另有訂定外，經催告到達後滿30日仍不交付，保險契約的效力停止。催告要送達要保人或負有交付義務人的最後住所或居所，並應把催告通知被保險人。停效的契約，停效日起6個月內清償保險費、約定利息和其他費用，翌日上午零時起恢復效力。6個月後才申請復效的，保險人可以在申請日起5日內要求提供可保證明，除非被保險人危險程度有重大變更已達拒絕承保，否則不能拒絕復效。保險人沒在5日內要求，或收到可保證明後15日內不拒絕，視為同意復效。申請復效的期限，契約約定自停效日起不得低於2年，也不得遲於保險期間屆滿日。這個期限屆滿後，保險人有終止契約的權利。終止時保險費已付足2年以上而有保單價值準備金的，要返還保單價值準備金。契約約定由保險人墊繳保險費的，墊繳本息超過保單價值準備金時，停效與復效準用上述規定。", "facts": {"head": ["階段", "規定"], "rows": [["到期未繳", "催告到達後滿30日仍不交付，契約效力停止（停效）"], ["停效後6個月內", "清償保險費、約定利息及其他費用，翌日上午零時起恢復效力"], ["停效滿6個月後申請復效", "保險人可在申請日起5日內要求可保證明；沒要求或收到證明15日內不拒絕，視為同意；除非危險程度有重大變更已達拒絕承保，否則不得拒絕"], ["復效申請期限", "自停效日起不得低於2年，不得遲於保險期間屆滿日"], ["期限屆滿後", "保險人有終止契約的權利"], ["終止時保費付足2年以上", "如有保單價值準備金，要返還"]]}, "mnemonic": "30日停效，6個月內補繳翌日零時復效；之後5日要證明、15日視同意；期限最少2年。", "tip": "此條最近一次修正是民國111年11月30日，舊教材可能寫的是修正前的版本。數字太多，建議直接背上面的階段表。", "official": ["人壽保險之保險費到期未交付者，除契約另有訂定外，經催告到達後屆三十日仍不交付時，保險契約之效力停止。", "催告應送達於要保人，或負有交付保險費義務之人之最後住所或居所，保險費經催告後，應依與保險人約定之交付方法交付之；保險人並應將前開催告通知被保險人以確保其權益。對被保險人之通知，依最後留存於保險人之聯絡資料，以書面、電子郵件、簡訊或其他約定方式擇一發出通知者，視為已完成。", "第一項停止效力之保險契約，於停止效力之日起六個月內清償保險費、保險契約約定之利息及其他費用後，翌日上午零時起，開始恢復其效力。要保人於停止效力之日起六個月後申請恢復效力者，保險人得於要保人申請恢復效力之日起五日內要求要保人提供被保險人之可保證明，除被保險人之危險程度有重大變更已達拒絕承保外，保險人不得拒絕其恢復效力。", "保險人未於前項規定期限內要求要保人提供可保證明或於收到前項可保證明後十五日內不為拒絕者，視為同意恢復效力。", "保險契約所定申請恢復效力之期限，自停止效力之日起不得低於二年，並不得遲於保險期間之屆滿日。", "保險人於前項所規定之期限屆滿後，有終止契約之權。", "保險契約終止時，保險費已付足二年以上，如有保單價值準備金者，保險人應返還其保單價值準備金。", "保險契約約定由保險人墊繳保險費者，於墊繳之本息超過保單價值準備金時，其停止效力及恢復效力之申請準用第一項至第六項規定。"], "has_official": true}, {"no": "117", "title": "不得訴訟請求保費；付足2年以上不交付的處理", "plain": "人壽保險的保險人不能用訴訟請求交付保險費。終身為期、不附生存條件的死亡保險契約，或契約訂定若干年後給付保險金額或年金的，如果保險費已付足2年以上，之後不交付，在第116條第5項規定的期限屆滿後，保險人只能減少保險金額或年金。", "mnemonic": "保費不能打官司討；付足兩年以上不繳，只能減額。", "tip": "第135-4條說年金保險準用，傷害保險則是第135條準用第110至116條，不含第117條；健康保險第130條準用第115、116條。三種保險準用範圍不同，題目可以拿來設陷阱。", "official": ["保險人對於保險費，不得以訴訟請求交付。", "以被保險人終身為期，不附生存條件之死亡保險契約，或契約訂定於若干年後給付保險金額或年金者，如保險費已付足二年以上而有不交付時，於前條第五項所定之期限屆滿後，保險人僅得減少保險金額或年金。"], "has_official": true}, {"no": "118", "title": "減少保險金額或年金", "plain": "保險人依第117條或應要保人請求，可以減少保險金額或年金，條件及可減少的數額要載明在保險契約。減少時，以訂原約時的條件、訂立同類保險契約為計算標準；減少後的金額，不得少於原契約終止時已有的保單價值準備金減去營業費用，用來作為一次交付保險費所能得到的金額。營業費用以原保險金額的百分之一為限。保險金額中因為保險費全數一次交付而訂定的部分，不受其他部分分期保險費不交付的影響。", "mnemonic": "減額繳清；營業費用不超過原保險金額1%。", "official": ["保險人依前條規定，或因要保人請求，得減少保險金額或年金。其條件及可減少之數額，應載明於保險契約。", "減少保險金額或年金，應以訂原約時之條件，訂立同類保險契約為計算標準。其減少後之金額，不得少於原契約終止時已有之保單價值準備金，減去營業費用，而以之作為保險費一次交付所能得之金額。", "營業費用以原保險金額百分之一為限。", "保險金額之一部，係因其保險費全數一次交付而訂定者，不因其他部分之分期交付保險費之不交付而受影響。"], "has_official": true}, {"no": "119", "title": "要保人終止契約與解約金", "plain": "要保人終止契約，而保險費已付足1年以上的，保險人應該在接到通知後1個月內償付解約金，金額不得少於要保人應得保單價值準備金的四分之三。解約金的條件及金額要載明在保險契約。", "mnemonic": "付足一年、一個月內給付、不少於準備金的四分之三。", "tip": "1年、1個月、3/4 三個數字一起背。", "official": ["要保人終止保險契約，而保險費已付足一年以上者，保險人應於接到通知後一個月內償付解約金；其金額不得少於要保人應得保單價值準備金之四分之三。", "償付解約金之條件及金額，應載明於保險契約。"], "has_official": true}, {"no": "120", "title": "保單質借", "plain": "保險費付足1年以上的，要保人可以用保險契約為質向保險人借款。保險人接到借款通知後，可以在1個月以內貸給可得質借的金額。借款本息超過保單價值準備金之日前30日，保險人要用書面通知要保人返還；要保人沒在超過日之前返還，契約效力從超過日起停止。保險人沒有依規定通知的，等到書面通知之日起30日內要保人沒還，效力從該30日的次日起停止。停效後申請復效，準用第116條第3至6項。", "mnemonic": "付足一年才能質借；超過準備金前30日要通知。", "official": ["保險費付足一年以上者，要保人得以保險契約為質，向保險人借款。", "保險人於接到要保人之借款通知後，得於一個月以內之期間，貸給可得質借之金額。", "以保險契約為質之借款，保險人應於借款本息超過保單價值準備金之日之三十日前，以書面通知要保人返還借款本息，要保人未於該超過之日前返還者，保險契約之效力自借款本息超過保單價值準備金之日停止。", "保險人未依前項規定為通知時，於保險人以書面通知要保人返還借款本息之日起三十日內要保人未返還者，保險契約之效力自該三十日之次日起停止。", "前二項停止效力之保險契約，其恢復效力之申請準用第一百十六條第三項至第六項規定。"], "has_official": true}, {"no": "121", "title": "故意致被保險人於死：受益人與要保人", "plain": "受益人故意致被保險人死亡，或雖然沒致死，喪失受益權。如果因為這樣沒有受益人可以領保險金額，保險金額作為被保險人的遺產。要保人故意致被保險人於死的，保險人不負給付責任；保險費付足2年以上的，保險人要把保單價值準備金給付給應得之人，沒有應得之人就解交國庫。", "mnemonic": "受益人故意：喪失受益權，錢變遺產；要保人故意：不賠，付足兩年退準備金。", "facts": {"head": ["誰故意", "結果"], "rows": [["受益人（致死或未致死）", "喪失受益權；沒有其他受益人時，保險金額作為被保險人遺產"], ["要保人（致死）", "保險人不給付保險金；保費付足2年以上，給付保單價值準備金給應得之人，無人則解交國庫"]]}, "official": ["受益人故意致被保險人於死或雖未致死者，喪失其受益權。", "前項情形，如因該受益人喪失受益權，而致無受益人受領保險金額時，其保險金額作為被保險人遺產。", "要保人故意致被保險人於死者，保險人不負給付保險金額之責。保險費付足二年以上者，保險人應將其保單價值準備金給付與應得之人，無應得之人時，應解交國庫。"], "has_official": true}, {"no": "122", "title": "被保險人年齡不實", "plain": "被保險人年齡不實，而真實年齡已超過保險人所定的保險年齡限度，契約無效，保險人退還所繳保險費。年齡不實使所付保險費比應付數額少時，要保人可以補繳短繳的保險費，或按所付保險費與真實年齡的比例減少保險金額；但保險事故發生後，且年齡不實的錯誤不可歸責於保險人時，要保人不能要求補繳短繳的保險費。所付保險費比應付數額多時，保險人要退還溢繳的保險費。", "facts": {"head": ["情形", "結果"], "rows": [["真實年齡已超過保險年齡限度", "契約無效，退還所繳保險費"], ["少繳保費", "補繳短繳的保險費，或按比例減少保險金額；事故發生後且錯誤不可歸責於保險人，不得要求補繳"], ["多繳保費", "保險人退還溢繳的保險費"]]}, "mnemonic": "超限無效退保費；少繳補繳或減額；多繳退還。", "official": ["被保險人年齡不實，而其真實年齡已超過保險人所定保險年齡限度者，其契約無效，保險人應退還所繳保險費。", "因被保險人年齡不實，致所付之保險費少於應付數額者，要保人得補繳短繳之保險費或按照所付之保險費與被保險人之真實年齡比例減少保險金額。但保險事故發生後，且年齡不實之錯誤不可歸責於保險人者，要保人不得要求補繳短繳之保險費。", "因被保險人年齡不實，致所付之保險費多於應付數額者，保險人應退還溢繳之保險費。"], "has_official": true}, {"no": "123", "title": "保險人或要保人破產；投資型保險的投資資產", "plain": "保險人破產時，受益人對保險人得請求的保險金額債權，以保單價值準備金按訂約時的保險費率比例計算。要保人破產時，契約有受益人的，仍為受益人的利益而存在。投資型保險契約的投資資產，只有該投資型保險的受益人才能主張，也不能請求扣押或行使其他權利。", "official": ["保險人破產時，受益人對於保險人得請求之保險金額之債權，以其保單價值準備金按訂約時之保險費率比例計算之。要保人破產時，保險契約訂有受益人者，仍為受益人之利益而存在。", "投資型保險契約之投資資產，非各該投資型保險之受益人不得主張，亦不得請求扣押或行使其他權利。"], "has_official": true}, {"no": "123-1", "title": "債務人的解約金債權限額內不得扣押", "plain": "要保人是債務人的人壽保險契約，各有效契約的解約金債權金額，沒有超過『最近一年衛福部或直轄市政府公告每人每月最低生活費1.2倍計算之6個月金額中最高標準』的，不得作為扣押或強制執行的標的。主管機關為推動提升基本保險保障政策而公告的人壽保險契約，其解約金債權也不得扣押或強制執行。", "mnemonic": "最低生活費1.2倍×6個月以內的解約金，不能被扣押。", "tip": "民國114年6月18日新增。限額每年會隨公告變，本頁不寫死金額。", "official": ["要保人為債務人之人壽保險契約，各有效契約之解約金債權金額未逾最近一年衛生福利部或直轄市政府所公告每人每月最低生活費一點二倍計算之六個月金額中最高標準者，不得作為扣押或強制執行之標的。", "主管機關為推動提升基本保險保障政策，公告之人壽保險契約，其解約金債權不得作為扣押或強制執行之標的。"], "has_official": true}, {"no": "123-2", "title": "債務人保單的新要保人變更", "plain": "保險事故發生前，要保人是債務人的人壽保險契約，解約金債權被扣押、要保人受破產宣告，或依消費者債務清理條例裁定開始清算或更生程序時，對被保險人有保險利益的人、要保人具名指定的受益人，或要保人或被保險人的配偶、父母或子女，取得要保人及被保險人書面同意，並向執行機關或執行命令所指定的人支付以契約終止後預計可獲保險人償付的解約金額度，可以書面通知保險人變更為新要保人。通知要在事由發生之日起3個月內為之，書面通知送達保險人之日起生變更要保人的效力。", "facts": {"head": ["項目", "規定"], "rows": [["什麼情況可啟動", "解約金債權被扣押；要保人受破產宣告；依消費者債務清理條例裁定開始清算或更生"], ["誰可變更為新要保人", "對被保險人有保險利益者；要保人具名指定的受益人；要保人或被保險人的配偶、父母或子女"], ["條件", "取得要保人及被保險人書面同意，並向執行機關或執行命令所指定的人支付預計可獲償付的解約金額度"], ["期限", "事由發生之日起3個月內書面通知保險人，送達之日生效"]]}, "mnemonic": "扣押或破產時，家人或指定受益人可付解約金額度變更為新要保人；3個月內通知。", "tip": "民國114年6月18日新增。細節多，先記『誰、條件、3個月』三件事。", "official": ["保險事故發生前，要保人為債務人之人壽保險契約之解約金債權經扣押、要保人受破產宣告或經依消費者債務清理條例裁定開始清算或更生程序時，下列各款之人，取得要保人及被保險人書面同意，並向執行機關或執行命令所指定之人支付以保險契約終止後預計可獲保險人償付之解約金額度者，得以書面通知保險人變更為新要保人：", "一、對被保險人有保險利益者。", "二、要保人具名指定之受益人。", "三、要保人或被保險人之配偶、父母或子女。", "前項通知保險人變更為新要保人，應於該項所定事由發生之日起三個月內為之；並於書面通知送達保險人之日起生變更要保人之效力。", "本法中華民國一百十四年六月三日修正之條文施行前，有第一項所定事由，於修正施行後，保險事故發生前，該項所定各款之人得於修正施行之日起三個月內，適用第一項及前項後段規定。"], "has_official": true}, {"no": "124", "title": "優先受償權", "plain": "人壽保險的要保人、被保險人、受益人，對被保險人的保單價值準備金有優先受償權。", "mnemonic": "準備金，優先受償。", "official": ["人壽保險之要保人、被保險人、受益人，對於被保險人之保單價值準備金，有優先受償之權。"], "has_official": true}], "tables": [{"title": "無效、失效、停效、解除、終止：條文用語對照", "head": ["用語", "條", "情形"], "rows": [["無效", "105", "第三人訂死亡保險，沒有被保險人書面同意並約定保險金額"], ["無效（該部分）", "107-1", "受監護宣告尚未撤銷者為被保險人：除喪葬費外，其餘死亡給付部分"], ["無效", "122", "被保險人年齡不實且真實年齡已超過保險年齡限度"], ["生效時點延後", "107", "未滿15歲：除喪葬費外，其餘死亡給付約定至滿15歲才生效"], ["失效", "17", "要保人或被保險人對保險標的物無保險利益"], ["停效（效力停止）", "116", "到期未繳，催告到達後滿30日仍不交付"], ["停效（效力停止）", "120", "質借的借款本息超過保單價值準備金"], ["解除", "64", "要保人對書面詢問告知不實，保險人行使解除權（第二章）"], ["終止", "116", "復效申請期限屆滿後，保險人有終止契約之權"], ["終止", "119", "要保人終止契約，保險費付足1年以上，償付解約金"]]}, {"title": "數字速記：保險費付足年數與期限", "head": ["條", "數字", "內容"], "rows": [["109", "2年", "自殺仍給付條款訂約2年後生效；犯罪處死等保費付足2年以上才返還準備金"], ["116", "30日", "催告到達後滿30日仍不交付，效力停止"], ["116", "6個月", "停效日起6個月內清償，翌日上午零時恢復效力"], ["116", "5日、15日", "6個月後申請復效：5日內可要求可保證明；收到後15日內不拒絕視為同意"], ["116", "2年", "申請復效期限不得低於2年；終止時付足2年以上返還準備金"], ["117", "2年", "付足2年以上不交付：只能減少保險金額或年金"], ["118", "1%", "營業費用以原保險金額百分之一為限"], ["119", "1年、1個月、3/4", "付足1年以上；1個月內償付；不少於準備金的四分之三"], ["120", "1年、1個月、30日", "付足1年以上可質借；1個月內貸給；超過準備金前30日通知"], ["121", "2年", "要保人故意致被保險人於死：付足2年以上返還準備金"], ["123-2", "3個月", "新要保人變更的通知期限"]]}, {"title": "受益人與遺產：保險金怎麼流向", "head": ["情形", "條", "結果"], "rows": [["有指定受益人", "112", "保險金額不作為被保險人遺產"], ["沒指定受益人", "113", "保險金額作為被保險人遺產"], ["受益人故意致被保險人於死（或未遂）", "121", "喪失受益權；沒有受益人可領時，作為被保險人遺產"], ["受益人轉讓利益", "114", "要保人同意或契約載明允許轉讓"]]}], "cards": [{"id": 1, "ref": "105", "front": "第三人訂立死亡保險，需要被保險人做什麼，否則契約怎樣？", "back": "要有被保險人書面同意並約定保險金額，否則契約無效。"}, {"id": 2, "ref": "105", "front": "被保險人事後撤銷第105條的同意，效果是什麼？", "back": "視為要保人終止保險契約。撤銷要書面通知保險人及要保人。"}, {"id": 3, "ref": "107", "front": "以未滿15歲的未成年人為被保險人，死亡給付何時生效？", "back": "除喪葬費用外，其餘死亡給付約定於被保險人滿15歲時才生效。"}, {"id": 4, "ref": "107-1", "front": "以受監護宣告尚未撤銷者為被保險人，死亡給付怎樣？", "back": "除喪葬費用外，其餘死亡給付部分無效。"}, {"id": 5, "ref": "109", "front": "契約載有『被保險人故意自殺，保險人仍應給付』，這個條款何時生效？", "back": "訂約2年後才生效；復效的契約從復效之日起算2年。"}, {"id": 6, "ref": "109", "front": "被保險人故意自殺，保險人要不要還保單價值準備金？", "back": "要。不給付保險金，但要把保單價值準備金返還應得之人。"}, {"id": 7, "ref": "112", "front": "有指定受益人，死亡保險金是不是被保險人遺產？", "back": "不是。第112條。"}, {"id": 8, "ref": "113", "front": "死亡保險沒指定受益人，保險金怎麼辦？", "back": "作為被保險人的遺產。第113條。"}, {"id": 9, "ref": "116", "front": "保險費到期未交，催告到達後滿幾日不交付，契約效力停止？", "back": "30日。"}, {"id": 10, "ref": "116", "front": "停效後幾個月內清償，翌日上午零時恢復效力？", "back": "停效之日起6個月內，清償保險費、約定利息及其他費用。"}, {"id": 11, "ref": "116", "front": "停效滿6個月後申請復效，保險人要求可保證明的期限和視為同意的期限？", "back": "申請日起5日內可要求可保證明；沒要求或收到證明15日內不拒絕，視為同意復效。"}, {"id": 12, "ref": "116", "front": "契約約定的復效申請期限，最少是多久？", "back": "自停效日起不得低於2年，且不得遲於保險期間屆滿日。"}, {"id": 13, "ref": "117", "front": "保險人能不能用訴訟請求交付保險費？", "back": "不能。人壽保險的保險人不得以訴訟請求交付保險費。"}, {"id": 14, "ref": "119", "front": "要保人終止契約的解約金：付足幾年、多久內給付、金額下限？", "back": "付足1年以上；接到通知後1個月內償付；不少於應得保單價值準備金的四分之三。"}, {"id": 15, "ref": "120", "front": "保單質借需要保險費付足多久？保險人多久內貸給？", "back": "付足1年以上；接到借款通知後1個月以內。"}, {"id": 16, "ref": "121", "front": "受益人故意致被保險人於死，會怎樣？", "back": "喪失受益權；沒有受益人可領時，保險金額作為被保險人遺產。"}, {"id": 17, "ref": "122", "front": "被保險人年齡不實且真實年齡已超過保險年齡限度，契約怎樣？", "back": "契約無效，保險人退還所繳保險費。"}, {"id": 18, "ref": "123-1", "front": "債務人要保人的解約金債權，什麼範圍內不得扣押？", "back": "不超過最近一年公告每人每月最低生活費1.2倍計算之6個月金額中最高標準者；另外主管機關公告的基本保障保單也不得扣押。"}, {"id": 19, "ref": "123-2", "front": "債務人保單被扣押時，誰可以變更為新要保人？通知期限？", "back": "有保險利益者、要保人指定的受益人、要保人或被保險人的配偶父母子女；需書面同意並支付解約金額度；事由發生3個月內通知。"}, {"id": 20, "ref": "124", "front": "誰對被保險人的保單價值準備金有優先受償權？", "back": "人壽保險的要保人、被保險人、受益人。"}], "scenarios": [{"ref": "105", "q": "太太以先生為被保險人投保死亡保險，沒有取得先生的書面同意，也沒有約定保險金額。依第105條，契約效力？", "opts": ["有效，因為太太對先生有保險利益", "無效", "效力停止", "得解除"], "ans": 1, "why": "第105條：由第三人訂立的死亡保險契約，未經被保險人書面同意，並約定保險金額，契約無效。有保險利益（第16條）還不夠，這是另一道關卡。"}, {"ref": "105", "q": "先生曾書面同意太太以他為被保險人投保死亡險，之後書面通知保險人和太太撤銷同意。效果？", "opts": ["同意撤銷無效", "視為要保人終止保險契約", "契約解除", "契約失效"], "ans": 1, "why": "第105條第2、3項：同意可隨時撤銷，撤銷方式是書面通知保險人及要保人；被保險人行使撤銷權，視為要保人終止保險契約。"}, {"ref": "107", "q": "父母為6歲小孩投保人壽保險，死亡保險金額很高。依第107條，小孩在7歲時死亡？", "opts": ["全部死亡給付都要給", "除喪葬費用外，其餘死亡給付約定尚未生效", "契約全部無效", "只退保費"], "ans": 1, "why": "第107條：除了喪葬費用的給付外，其餘死亡給付的約定，於被保險人滿15歲時始生效力。7歲死亡時尚未滿15歲，只有喪葬費用部分能給付，且不得超過遺產稅喪葬費扣除額的一半。"}, {"ref": "109", "q": "保險契約載有『被保險人故意自殺，保險人仍應給付保險金』。被保險人訂約滿1年自殺。依第109條？", "opts": ["保險人仍須給付，因為契約有約定", "不須給付，因為該條款要訂約2年後才生效", "契約無效", "只給付一半"], "ans": 1, "why": "第109條第2項：自殺仍給付的條款，於訂約2年後始生效力。滿1年自殺尚未生效，保險人不給付保險金，但要返還保單價值準備金。"}, {"ref": "116", "q": "要保人未繳保費，催告到達後經過30日仍未繳，契約效力？", "opts": ["自始無效", "停止效力（停效）", "保險人須立即終止", "不受影響"], "ans": 1, "why": "第116條第1項：經催告到達後屆30日仍不交付時，保險契約的效力停止。"}, {"ref": "116", "q": "契約停效後第4個月，要保人清償保險費、約定利息及其他費用。契約何時恢復效力？", "opts": ["保險人同意後", "清償的翌日上午零時", "一個月後", "提供可保證明後"], "ans": 1, "why": "第116條第3項：停效日起6個月內清償，翌日上午零時起開始恢復效力，不需可保證明。"}, {"ref": "119", "q": "保費已付足1年以上，要保人終止保險契約。依第119條，解約金不得少於？", "opts": ["保單價值準備金的二分之一", "保單價值準備金的四分之三", "已繳保險費全額", "保險金額的百分之一"], "ans": 1, "why": "第119條：金額不得少於要保人應得保單價值準備金的四分之三；保險人要在接到通知後1個月內償付。"}, {"ref": "113", "q": "死亡保險契約未指定受益人，被保險人死亡。保險金額？", "opts": ["給要保人", "作為被保險人的遺產", "歸保險人所有", "解交國庫"], "ans": 1, "why": "第113條：死亡保險契約未指定受益人者，其保險金額作為被保險人的遺產。"}, {"ref": "122", "q": "被保險人投保時謊報年齡，真實年齡已超過保險人所定的保險年齡限度。依第122條？", "opts": ["契約有效，補繳保費", "契約無效，保險人退還所繳保險費", "按比例減少保險金額", "保險人得解除契約"], "ans": 1, "why": "第122條第1項：真實年齡已超過保險年齡限度，契約無效，保險人退還所繳保險費。按比例減額、補繳是『少繳保費但年齡仍在限度內』的處理。"}, {"ref": "121", "q": "受益人甲故意傷害被保險人，被保險人未死亡。甲的受益權？", "opts": ["不受影響", "喪失受益權", "減半", "由保險人決定"], "ans": 1, "why": "第121條第1項：受益人故意致被保險人於死，或雖未致死者，喪失其受益權。"}], "chNo": "03", "summary": "人壽保險專章（第101至124條）：第三人訂約的同意、未成年人與受監護宣告者、自殺條款、受益人與遺產、停效與復效、解約金與質借、年齡不實，以及新增的解約金不得扣押與新要保人變更。", "scope": "收錄保險法第101至124條（含107-1、123-1、123-2）。", "nav": {"prev": {"file": "ch02.html", "label": "第2章 保險契約：成立、告知義務與時效"}, "next": {"file": "ch04.html", "label": "第4章 健康保險、傷害保險、年金保險（保險法第125至135-4條）"}}}</script>
<script>const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>{t=String(t||'');const ss=t.split(/(?<=。)/).map(x=>x.trim()).filter(Boolean);if(t.length<=90||ss.length<2&&t.indexOf('；')<0)return '<p>'+esc(t)+'</p>';
  const li=s=>{s=s.replace(/。$/,'');const m=s.match(/^([^：；]{1,40})：(.+)$/);if(m&&m[2].split('；').length>=3)return '<li><b>'+esc(m[1])+'</b><ul>'+m[2].split('；').map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></li>';
    const parts=s.split('；');if(parts.length>=3)return '<li>'+parts.map(x=>esc(x)).join('<br>')+'</li>';return '<li>'+esc(s)+'</li>'};
  return '<ul class="pl">'+ss.map(li).join('')+'</ul>'};
const factsT=f=>f?'<div class="tw"><table class="ft"><thead><tr>'+f.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+f.rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'';
const lab=x=>/^[保規]\d+(-\d+)?$/.test(x)?({'保':'保險法','規':'管理規則'}[x[0]])+'第'+x.slice(1)+'條':/^[一二三四五六七八九十]+(之[一二三四五六七八九十]+)?$/.test(x)?'第'+x+'點':/^[0-9]+(-[0-9]+)?$/.test(x)?'第'+x+'條':x;
const mem={};
const store={get(k){try{const v=localStorage.getItem(k);return v===null?mem[k]:v}catch(e){return mem[k]}},set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const BOXKEY='twlife_boxes_v2';
let boxes={};try{boxes=JSON.parse(store.get(BOXKEY)||'{}')}catch(e){boxes={}}
const saveBoxes=()=>store.set(BOXKEY,JSON.stringify(boxes));
function Flash(root,getCards){
  let queue=[],cur=null,flipped=false;
  function build(){const cs=getCards();queue=shuffle(cs.filter(c=>(boxes[c.key]||0)<1)).sort((a,b)=>(boxes[a.key]||0)-(boxes[b.key]||0));flipped=false}
  function render(){
    const cs=getCards(),n=cs.length,done=cs.filter(c=>(boxes[c.key]||0)>=1).length;
    let h='<div class="stat">已熟練 '+done+' / '+n+' 張（答對 1 次視為熟練，進度存在這個瀏覽器）</div><div class="bar"><i style="width:'+(n?done/n*100:0)+'%"></i></div>';
    if(!n){root.innerHTML=h+'<div class="card"><p>沒有可用的閃卡。</p></div>';return}
    if(!queue.length){root.innerHTML=h+'<div class="card"><h3>全部熟練了</h3><p>可以去做情境題，或重設後再來一輪。</p></div><div class="row"><button class="btn" data-a="reset">重設進度</button></div>';return}
    cur=queue[0];
    h+='<div class="card fc" tabindex="0" role="button" data-a="flip"><small>'+(cur.tag?esc(cur.tag)+'｜':'')+esc(lab(cur.ref))+'｜剩 '+queue.length+' 張</small><div class="q">'+esc(cur.front)+'</div>'+(flipped?'<div class="a"><span class="lab fact">答案</span>'+esc(cur.back)+'</div>':'<small>點一下翻面</small>')+'</div>';
    if(flipped)h+='<div class="row"><button class="btn bad" data-a="no">還不熟</button><button class="btn ok" data-a="yes">會了</button></div>';
    h+='<div class="row"><button class="btn" data-a="reset">重設進度</button></div>';
    root.innerHTML=h;
  }
  root.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
    if(a==='flip'){flipped=!flipped;render()}
    else if(a==='reset'){if(confirm('確定要清除這些閃卡的進度？')){getCards().forEach(c=>delete boxes[c.key]);saveBoxes();build();render()}}
    else if(cur&&(a==='yes'||a==='no')){const ok=a==='yes';boxes[cur.key]=ok?Math.min(1,(boxes[cur.key]||0)+1):0;saveBoxes();queue.shift();if(!ok||boxes[cur.key]<1)queue.splice(queue.length?Math.max(1,Math.min(queue.length,ok?6:3)):0,0,cur);flipped=false;render()}});
  root.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.fc')){e.preventDefault();flipped=!flipped;render()}});
  return {refresh(){build();render()}};
}
function Quiz(root,getItems,perRound){
  let items=[],score=0,answered=0,done=false;
  function draw(){
    const perms=items.map(s=>shuffle(s.opts.map((_,k)=>k)));
    root.innerHTML='<div class="stat" id="sc"></div>'+items.map((s,i)=>'<div class="card" data-i="'+i+'"><b>'+(i+1)+'. </b><span class="lab my">'+(s.tag?esc(s.tag)+' ':'')+esc(lab(s.ref))+'</span>'+esc(s.q)+perms[i].map((k,pos)=>'<button class="opt" data-o="'+k+'">'+String.fromCharCode(65+pos)+'. '+esc(s.opts[k])+'</button>').join('')+'<div class="why"></div></div>').join('')+'<div id="qend"></div>';
    score=0;answered=0;upd();
  }
  function upd(){const el=$('#sc',root);if(el)el.textContent='已作答 '+answered+' / '+items.length+'，答對 '+score+' 題';
    if(perRound&&answered===items.length&&items.length){$('#qend',root).innerHTML='<div class="card"><h3>這一組：'+score+' / '+items.length+'</h3></div><div class="row"><button class="btn pri" data-a="again">再來一組</button></div>'}}
  function again(){const all=getItems();items=perRound?shuffle(all).slice(0,perRound):all;draw()}
  root.addEventListener('click',e=>{
    const ag=e.target.closest('[data-a="again"]');if(ag){again();window.scrollTo(0,root.offsetTop-60);return}
    const b=e.target.closest('.opt');if(!b)return;const box=b.closest('.card');if(box.dataset.done)return;
    const s=items[+box.dataset.i],j=+b.dataset.o;box.dataset.done=1;answered++;if(j===s.ans)score++;
    let right='';$$('.opt',box).forEach((x,pos)=>{const k=+x.dataset.o;if(k===s.ans){x.classList.add('right');right=String.fromCharCode(65+pos)}else if(k===j)x.classList.add('wrong')});
    const w=$('.why',box);w.style.display='block';w.innerHTML=(j===s.ans?'答對了。':'答錯了，正解是 '+right+'。')+esc(s.why);upd()});
  return {refresh:again};
}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const LAWS=D.laws;
$('#h1').textContent=D.chapter+'｜'+D.title;
$('#intro').textContent=D.summary||'';
document.title=D.chapter+' '+D.title;
$('#foot').innerHTML='官方來源：'+LAWS.map(L=>esc(L.name)+'（'+esc(L.amended)+(L.kind==='press'?'發布':'修正')+'）'+(L.note?'｜'+esc(L.note)+'｜':'')+'<a href="'+esc(L.url)+'" target="_blank" rel="noopener">'+esc(L.url)+'</a>').join('<br>')+(D.scope?'<br>'+esc(D.scope):'')+'<br>條文原文取自全國法規資料庫；「白話」「口訣」「情境題」為編寫者整理，不是法條。法規可能再修正，請以官方最新公告為準；本內容不是法律意見。';
const TABS=[['read','條文速讀'],['table','對照表'],['cards','閃卡'],['quiz','情境題']];
const nav=$('#nav');
TABS.forEach(([id,name])=>{const b=document.createElement('button');b.textContent=name;b.setAttribute('role','tab');b.dataset.id=id;b.onclick=()=>show(id);nav.appendChild(b)});
let curTab='read';
function show(id,anchor){curTab=id;TABS.forEach(([t])=>$('#s-'+t).classList.toggle('on',t===id));$$('button',nav).forEach(b=>b.setAttribute('aria-selected',b.dataset.id===id));
  history.replaceState(null,'','#'+id+(anchor?'/'+anchor:''));
  if(anchor){const el=document.getElementById(anchor);if(el){const d=el.querySelector('details');el.scrollIntoView({block:'start'});el.classList.add('hl')}}else window.scrollTo(0,0)}
$('#s-read').innerHTML=(D.alerts||[]).map(a=>'<div class="banner"><b>'+esc(a.t)+'</b>'+esc(a.d)+'</div>').join('')+D.clauses.map(c=>{
  const off=c.official.map(p=>'<p>'+esc(p)+'</p>').join('');
  return '<div class="card" id="c'+esc(c.no)+'"><h3><span class="no">'+esc(lab(c.no))+'</span>'+esc(c.title)+'</h3>'
   +'<div class="pw"><span class="lab my">白話</span>'+fmt(c.plain)+'</div>'+factsT(c.facts)
   +(c.mnemonic?'<div class="mn"><span class="lab my">口訣</span>'+esc(c.mnemonic)+'</div>':'')
   +(c.tip?'<p><span class="lab hint">提醒</span>'+esc(c.tip)+'</p>':'')
   +(c.official.length?'<details><summary>展開官方條文原文</summary><div class="off"><span class="lab fact">原文</span>'+off+'</div></details>':'')+'</div>'}).join('');
$('#s-table').innerHTML=D.tables.map((t,i)=>'<h3 id="t'+i+'">'+esc(t.title)+'</h3><div class="tw"><table><thead><tr>'+t.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+t.rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>').join('');
const cardsAll=D.cards.map(c=>({key:'ch'+D.chNo+':'+c.id,ref:c.ref,front:c.front,back:c.back}));
const fl=Flash($('#s-cards'),()=>cardsAll);fl.refresh();
const qz=Quiz($('#s-quiz'),()=>D.scenarios,0);qz.refresh();
// 上下章
const N=D.nav||{};
function setLink(el,o,dir){if(o){el.href=o.file;el.textContent=dir==='p'?'← '+o.label:o.label+' →'}else{el.style.visibility='hidden'}}
setLink($('#prev'),N.prev,'p');setLink($('#next'),N.next,'n');
// 左右滑動：換分頁，到頭就換章
function step(d){const i=TABS.findIndex(t=>t[0]===curTab)+d;
  if(i<0){if(N.prev)location.href=N.prev.file+'#read';return}
  if(i>=TABS.length){if(N.next)location.href=N.next.file+'#read';return}
  show(TABS[i][0])}
let sx=0,sy=0,skip=false;
document.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;const el=e.target&&e.target.nodeType===1?e.target:(e.target&&e.target.parentElement);skip=!!(el&&el.closest('.tw,nav,input,.off,#cap'))},{passive:true});
document.addEventListener('touchend',e=>{if(skip)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>70&&Math.abs(dy)<45){step(dx<0?1:-1)}},{passive:true});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1)});
// 深層連結
function route(){const h=(location.hash||'#read').slice(1).split('/');show(TABS.some(t=>t[0]===h[0])?h[0]:'read',h[1]?decodeURIComponent(h[1]):null)}
window.addEventListener('hashchange',route);route();
</script>
<script>// 語音：導覽列多一顆「🎧 語音」鈕，按下就從頭播放；畫面上方只留最後兩行字幕（固定高度，不會推動下面的頁面）。
// 再按一次＝暫停／繼續；點字幕也一樣；字幕右側的 ✕ 關閉。播完一段自動接下一段。
// 資料來自 mp3/timing/chNN.js（window.AUDIO_TIMING），由 make_timing.py 產生；沒有這個檔就不會出現「語音」鈕。
(function(){
const T=window.AUDIO_TIMING;
if(!T||!T.segments||!T.segments.length)return;
const BASE='mp3',segs=T.segments,au=document.getElementById('au');
const cap=document.getElementById('cap'),rowA=document.getElementById('cap-a'),rowB=document.getElementById('cap-b'),top=document.getElementById('top');
const SP={F:'主持人',M:'專家'},PUNC='，、：；。！？';
let si=-1,lines=[],li=-2,started=false,raf=0,endTimer=0;

// ---- 按鈕 ----
const btn=document.createElement('button');
btn.id='au-btn';btn.type='button';btn.textContent='🎧 語音';btn.setAttribute('aria-pressed','false');btn.title='按下開始聽這一章的語音重點';
nav.appendChild(btn);
function label(){btn.textContent=!started?'🎧 語音':(au.paused?'▶ 語音':'⏸ 語音');btn.setAttribute('aria-pressed',started?'true':'false')}

// ---- 字幕斷行：依目前寬度，把每句切成一行一行 ----
const fontPx=()=>parseFloat(getComputedStyle(rowB).fontSize)||17;
const cw=(s,f)=>{let w=0;for(const c of s)w+=c.charCodeAt(0)<128?f*0.56:f;return w};
function wrap(text,lim0,lim,f){
  const parts=text.match(new RegExp('[^'+PUNC+']+['+PUNC+']*|['+PUNC+']+','g'))||[text];
  const out=[];let cur='',w=0,lim_=lim0;
  const push=()=>{if(cur){out.push(cur);cur='';w=0;lim_=lim}};
  for(const p of parts){
    const pw=cw(p,f);
    if(w+pw<=lim_){cur+=p;w+=pw;continue}
    push();
    if(pw<=lim_){cur=p;w=pw;continue}
    for(const c of p){const x=cw(c,f);if(w+x>lim_)push();cur+=c;w+=x}
  }
  push();return out;
}
function buildLines(){
  lines=[];if(si<0)return;
  const s=segs[si],f=fontPx(),avail=Math.max(120,(rowB.clientWidth||cap.clientWidth||300)-2);let prevSpk=null;
  s.cues.forEach((c,k)=>{
    const t0=c.t,t1=k+1<s.cues.length?s.cues[k+1].t:s.dur;
    const span=Math.max(0.4,t1-t0-0.7);                       // 句尾約有 0.7 秒停頓，不分給字
    const badge=c.spk!==prevSpk;prevSpk=c.spk;
    const bw=badge?SP[c.spk].length*12+18:0;                   // 說話者小標籤的寬度（12px 字＋留白）
    const ls=wrap(c.text,avail-bw,avail,f),ws=ls.map(x=>Math.max(1,cw(x,f))),tot=ws.reduce((a,b)=>a+b,0);
    let acc=0;ls.forEach((x,j)=>{lines.push({t:t0+span*acc/tot,spk:c.spk,badge:badge&&j===0,text:x});acc+=ws[j]});
  });
}
const esc2=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const rowHTML=l=>l?(l.badge?'<span class="sp '+l.spk+'">'+SP[l.spk]+'</span>':'')+esc2(l.text):'';
function paint(){
  const t=au.currentTime;let j=-1;
  for(let k=0;k<lines.length;k++){if(lines[k].t<=t+0.05)j=k;else break}
  if(j===li)return;li=j;
  rowA.innerHTML=rowHTML(lines[j-1]);rowB.innerHTML=rowHTML(lines[j]);
}
function tick(){paint();raf=au.paused?0:requestAnimationFrame(tick)}

// ---- 播放 ----
const nice=t=>String(t).replace(/_/g,' ');
function meta(){if('mediaSession' in navigator&&window.MediaMetadata&&si>=0)navigator.mediaSession.metadata=new MediaMetadata({title:nice(segs[si].title),artist:D.chapter+' '+D.title,album:'考試複習語音'})}
function pad(){document.documentElement.style.scrollPaddingTop=cap.hidden?'':(top.offsetHeight+8)+'px'}
function setSrc(i){if(si===i)return;si=i;li=-2;rowA.innerHTML=rowB.innerHTML='';au.src=encodeURI(BASE+'/'+segs[i].file);au.load();au.playbackRate=1;buildLines();meta()}
function playSeg(i){
  setSrc(i);
  const go=()=>{buildLines();au.play().catch(()=>{})};
  if(au.readyState>=1)go();else au.addEventListener('loadedmetadata',go,{once:true});
}
function start(){clearTimeout(endTimer);started=true;cap.hidden=false;pad();si=-1;playSeg(0)}
function stop(){clearTimeout(endTimer);au.pause();started=false;si=-1;lines=[];li=-2;cap.hidden=true;rowA.innerHTML=rowB.innerHTML='';pad();label()}
function toggle(){if(!started)start();else if(au.paused)au.play().catch(()=>{});else au.pause()}
btn.onclick=toggle;
cap.addEventListener('click',e=>{if(e.target.closest('#cap-x'))stop();else toggle()});
au.addEventListener('play',()=>{label();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)});
au.addEventListener('pause',label);
au.addEventListener('seeked',paint);
au.addEventListener('ended',()=>{
  if(si<segs.length-1)playSeg(si+1);
  else{started=false;label();endTimer=setTimeout(()=>{if(!started)stop()},2500)}   // 全部播完，字幕停 2.5 秒後自動收起
});
au.addEventListener('error',()=>{rowA.textContent='';rowB.textContent='找不到音檔（'+BASE+'/'+(segs[si]?segs[si].file:'')+'）'});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(si>=0){buildLines();li=-2;paint();pad()}},150)});
if('mediaSession' in navigator){[['play',()=>au.play()],['pause',()=>au.pause()],['previoustrack',()=>started&&playSeg(Math.max(0,si-1))],['nexttrack',()=>started&&si<segs.length-1&&playSeg(si+1)]].forEach(([a,f])=>{try{navigator.mediaSession.setActionHandler(a,f)}catch(e){}})}
})();
</script></body></html>
