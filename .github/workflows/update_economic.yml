name: 更新市場資料並發布

on:
  schedule:
    # 台灣時間 = UTC+8；GitHub 排程為盡力而為，可能延遲數分鐘
    - cron: "20 22 * * 1-5"   # 06:20 美股收盤後（日更，寫入歷史）
    - cron: "10 6 * * 1-5"    # 14:10 台股收盤後（日更）
    - cron: "10 8 * * 1-5"    # 16:10 歐股開盤後（日更）
    - cron: "30 1-5 * * 1-5"  # 09:30–13:30 台股盤中（快照，只發布不寫歷史）
    - cron: "30 14 * * 1-5"   # 22:30 美股盤中（快照）
  workflow_dispatch:
    inputs:
      mode:
        description: "daily＝寫入歷史並發布；snapshot＝只發布"
        type: choice
        default: daily
        options: [daily, snapshot]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: eco-update
  cancel-in-progress: false

env:
  DATA_BRANCH: economic   # 抓到的資料只推到這個分支，經你核准（合併 PR）後才進 main

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 準備資料分支（接在最新的 main 之後，rebase）
        run: |
          git config user.name "eco-bot"
          git config user.email "eco-bot@users.noreply.github.com"
          BASE="${{ github.event.repository.default_branch }}"; BASE="${BASE:-main}"
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          git fetch origin
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null 2>&1; then
            git checkout -B "$DATA_BRANCH" "origin/$DATA_BRANCH"
            if ! git rebase "origin/$BASE"; then
              # 例如 PR 用 squash 合併，舊的資料 commit 會衝突：已進 main 的資料不會丟，重新從 main 開始
              git rebase --abort || true
              echo "::warning::rebase 衝突，資料分支改為從 $BASE 重新開始（資料會在這次更新重新產生）"
              git reset --hard "origin/$BASE"
            fi
          else
            git checkout -B "$DATA_BRANCH" "origin/$BASE"
          fi
          git log --oneline -3

      - name: 找到專案資料夾（repo 根目錄或子資料夾都可以）
        run: |
          f=$(find . -path ./node_modules -prune -o -path '*/pipeline/add_event.py' -print | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$f" ]; then
            echo "::error::找不到 pipeline/ 資料夾。請確認 repo 內有 eco 的 pipeline、config、assets、index.html（和 README 同一層）。"
            find . -maxdepth 2 -not -path './.git*' | head -40
            exit 1
          fi
          dir=$(dirname "$(dirname "$f")")
          echo "ECO_DIR=$dir" >> "$GITHUB_ENV"
          echo "專案資料夾：$dir"

      - name: 決定模式
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 1-5 * * 1-5" ] || [ "${{ github.event.schedule }}" = "30 14 * * 1-5" ]; then
            echo "mode=snapshot" >> "$GITHUB_OUTPUT"
          else
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: 抓資料並產生網站資料
        id: run
        working-directory: ${{ env.ECO_DIR }}
        run: |
          set +e
          python -m pipeline.run --mode "${{ steps.mode.outputs.mode }}"
          code=$?
          echo "exit code: $code"
          # 0 = 成功；2 = 部分來源失敗（仍可推送，網頁會標示）；其他 = 全面失敗，不推送
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
          if [ "$code" -eq 2 ]; then echo "::warning::部分資料來源失敗，詳見網頁狀態列"; fi

      - name: 提交並推到資料分支
        run: |
          git add -A "$ECO_DIR/data/series" "$ECO_DIR/data/site"
          if git diff --cached --quiet; then
            echo "資料無變動"
          else
            git commit -m "data: ${{ steps.mode.outputs.mode }} $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
          fi
          remote=$(git rev-parse -q --verify "origin/$DATA_BRANCH" || echo none)
          if [ "$(git rev-parse HEAD)" != "$remote" ]; then
            git push --force-with-lease origin "$DATA_BRANCH"   # rebase 後歷史會改寫，所以要 force（有保護）
          else
            echo "分支已是最新"
          fi

      - name: 有待審的變更就開（或沿用）一個 PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ahead=$(git rev-list --count "origin/$BASE..HEAD")
          open=$(gh pr list --head "$DATA_BRANCH" --base "$BASE" --state open --json number --jq length)
          if [ "$ahead" -gt 0 ] && [ "$open" = "0" ]; then
            gh pr create --base "$BASE" --head "$DATA_BRANCH" \
              --title "economic 資料更新（待核准）" \
              --body "由 eco-bot 自動產生：市場資料與網站資料（data/series、data/site）。核准並合併後，Pages 會自動發布。" \
              || echo "::warning::無法自動開 PR：請到 Settings → Actions → General 勾選「Allow GitHub Actions to create and approve pull requests」，或手動從 $DATA_BRANCH 開 PR"
          else
            echo "ahead=$ahead，已開啟的 PR=$open"
          fi
