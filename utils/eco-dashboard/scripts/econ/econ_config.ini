; 經濟看板更新程式設定（可進版控；金鑰請放 econ_config.local.ini，不要寫在這裡）
[fred]
; api_key 請放在 econ_config.local.ini 或環境變數 FRED_API_KEY
start = 2015-01-01

[paths]
; base_dir 只用在 [prices] 的 M1 檔：[prices] 裡的相對路徑都以它為準；base_dir 本身相對於本檔所在資料夾。
; 輸出資料夾（[output] dir）與 mt5_mirror 不受影響，一律相對於本檔所在資料夾。
; 留空＝本檔所在資料夾；也可寫絕對路徑，例如 D:/temp/claude_billion/data/state_export
base_dir = ../../data/state_export/

[output]
; 輸出資料夾（相對本檔所在資料夾）。看板 econ_dashboard.html 讀同資料夾旁的 data/econ_data.js，所以保持 data
dir = data
; 選填：同步複製 CSV 到 MT5 的 Common\Files 資料夾（將來 MT5 讀取用），留空＝不複製（相對路徑同樣相對於本檔）
; 例：C:\Users\你的帳號\AppData\Roaming\MetaQuotes\Terminal\Common\Files\YAML_EA\econ
mt5_mirror =

[prices]
; 伺服器時間相對 UTC 的小時數：冬令／夏令（夏令跟美國 DST 同步，XM 類券商通常是 2／3）
; 更新程式會自我檢查這組設定對不對，結果寫在 update_report.txt
server_utc_offset_winter = 2
server_utc_offset_summer = 3
; 產品 = StateExporter 的 M1 旁表（*_M1.csv）。相對 [paths] base_dir；可用 * 萬用字元；多個用 | 分隔；重疊的時間只取一次；留空＝不用
; 例：GOLD__STATE4_default_*_M1.csv 會納入以後新匯出的檔
XAUUSD = GOLD__STATE4_default_20220101_M1.csv
; GBPUSD 沒有 M1 檔時，日收盤用 FRED 的 DEXUSUK 代替（沒有事件反應統計）
GBPUSD = GBPUSD_STATE4_default_20220101_M1.csv
