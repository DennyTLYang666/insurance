<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>經濟趨勢看板</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--line:#2a2f3a;--tx:#d7dbe3;--mut:#8a93a6;--up:#26a69a;--dn:#ef5350;--acc:#4c8dff;--warn:#e0a030}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f4f5f8;--panel:#fff;--line:#d9dde6;--tx:#1d2330;--mut:#667089}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.5 -apple-system,"Segoe UI","Microsoft JhengHei",sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;margin:0 10px 0 0}
select,button{background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:5px;padding:3px 8px;font:inherit}
button{cursor:pointer}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#status{color:var(--mut);margin-left:auto}
main{max-width:1280px;margin:0 auto;padding:10px 14px 40px}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:12px 0}
h2{font-size:14px;margin:0 0 2px}
.sub{color:var(--mut);font-size:12px;margin:0 0 8px}
.mut{color:var(--mut)}.bull{color:var(--up)}.bear{color:var(--dn)}.warn{color:var(--warn)}
table{border-collapse:collapse;width:100%}
th,td{padding:3px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:12px}
th:first-child,td:first-child{text-align:left}
td.l,th.l{text-align:left}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:var(--bg)}
.tile .n{color:var(--mut);font-size:12px}
.tile .v{font-size:17px;font-weight:700}
.chip{display:inline-block;padding:0 7px;border-radius:9px;font-size:12px;border:1px solid var(--line)}
.chip.b{background:rgba(38,166,154,.18);color:var(--up);border-color:var(--up)}
.chip.s{background:rgba(239,83,80,.18);color:var(--dn);border-color:var(--dn)}
.score{font-size:22px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:6px 8px;position:relative}
.card h3{font-size:12px;margin:0 0 3px;font-weight:600}
.card canvas{width:100%;height:150px;display:block}
.tip{height:16px;line-height:16px;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin:0 3px 2px 8px}
#nodata{padding:40px;text-align:center}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<header>
  <h1>經濟趨勢看板</h1>
  <label>產品 <select id="prod"></select></label>
  <span id="rng"><button data-r="126">6 個月</button><button data-r="252" class="on">1 年</button><button data-r="756">3 年</button><button data-r="0">全部</button></span>
  <span id="status"></span>
</header>
<main id="main">
  <div id="nodata" style="display:none"></div>
  <div id="app">
    <section id="A"><h2>A　環境燈號</h2><p class="sub" id="Asub"></p><div id="Abody"></div></section>
    <section id="B"><h2>B　宏觀走勢（疊上產品價格）</h2><p class="sub">各自縮放到同一視窗；月頻數列在「公布日」才開始算（不是所屬月份），CPI 類顯示年增率、非農顯示單月變動。滑鼠移上去看數值。</p><div class="grid" id="Bgrid"></div></section>
    <section id="C"><h2>C　公告事件與實際反應</h2><p class="sub" id="Csub"></p><div id="Cbody"></div></section>
    <section id="D"><h2>D　滾動相關</h2><p class="sub" id="Dsub"></p><div id="Dbody"></div></section>
  </div>
</main>
<script src="data/econ_data.js" onerror="window.__noData=1"></script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const ZH={DTWEXBGS:["美元指數（廣義）","美元強→黃金／英鎊多半偏弱"],DFII10:["10 年實質殖利率","持有黃金的機會成本，黃金最敏感的變數"],DGS10:["10 年美債殖利率","利率預期"],DGS2:["2 年美債殖利率","近端利率預期，對美元影響大"],
 T10YIE:["10 年預期通膨","市場定價的通膨預期"],DFF:["聯邦基金利率","政策利率"],DFEDTARU:["聯準會目標利率上限","政策利率目標"],VIXCLS:["VIX","避險情緒"],DEXUSUK:["英鎊兌美元（FRED 中午價）","GBPUSD 日級代理"],
 CPIAUCSL:["美國 CPI","通膨實況"],CPILFESL:["美國核心 CPI","通膨實況（不含食品能源）"],PCEPI:["美國 PCE 物價","Fed 偏好的通膨指標"],PAYEMS:["美國非農就業","就業強弱→降息預期"],UNRATE:["美國失業率","就業"],
 IRLTLT01GBM156N:["英國 10 年公債殖利率（月）","英國利率水準"],GBRCPIALLMINMEI:["英國 CPI","英國通膨→BoE 路徑"],US_UK_10Y_SPREAD:["美英 10 年利差（月均）","利差擴大→美元相對有利"]};
const LIGHT_IDS=["DTWEXBGS","DFII10","DGS2","T10YIE","VIXCLS"];         // 進燈號的日頻數列
const B_IDS=["DTWEXBGS","DFII10","DGS10","DGS2","T10YIE","DFF","VIXCLS","CPIAUCSL","CPILFESL","PAYEMS","UNRATE","US_UK_10Y_SPREAD"];
const MIN_ABS_CORR=0.15;
let E=null, prod="XAUUSD", RANGE=252;
const nm=id=>(ZH[id]||[id])[0];

/* ───── 資料與計算 ───── */
const dayNum=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))/864e5;
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const sd=a=>{const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)*(x-m))));};
const med=a=>{if(!a.length)return null;const b=[...a].sort((x,y)=>x-y),n=b.length;return n%2?b[(n-1)/2]:(b[n/2-1]+b[n/2])/2;};
function corr(x,y){const n=x.length;if(n<8)return null;const mx=mean(x),my=mean(y);let sxy=0,sxx=0,syy=0;for(let i=0;i<n;i++){const a=x[i]-mx,b=y[i]-my;sxy+=a*b;sxx+=a*a;syy+=b*b;}return sxx>0&&syy>0?sxy/Math.sqrt(sxx*syy):null;}
function beta(x,y){const n=x.length;if(n<8)return null;const mx=mean(x),my=mean(y);let sxy=0,sxx=0;for(let i=0;i<n;i++){sxy+=(x[i]-mx)*(y[i]-my);sxx+=(x[i]-mx)*(x[i]-mx);}return sxx>0?sxy/sxx:null;}
const S=id=>E.series[id];
const meta=id=>E.meta.find(m=>m.id===id)||{};
function aligned(sid){ // 產品與數列在共同日期上的連續變化（產品報酬 % vs 數列變化）
  const p=E.prices[prod],s=S(sid); if(!p||!s) return null;
  const sm=new Map(s.d.map((d,i)=>[d,s.v[i]])); const chg=meta(sid).chg||"diff";
  const d=[],pr=[],sr=[]; let pd=null,pc=null,sc=null;
  for(let i=0;i<p.d.length;i++){const dd=p.d[i]; if(!sm.has(dd)) continue; const sv=sm.get(dd),pv=p.c[i];
    if(pd!==null&&pc>0&&(chg!=="pct"||sc>0)){d.push(dd);pr.push(pv/pc-1);sr.push(chg==="pct"?sv/sc-1:sv-sc);}
    pd=dd;pc=pv;sc=sv;}
  return {d,pr,sr};
}
function lastN(a,n){return n>0&&a.length>n?a.slice(a.length-n):a;}
function corrN(al,n){if(!al)return null;return corr(lastN(al.pr,n),lastN(al.sr,n));}
function rolling(al,w){const o=[];if(!al)return o;for(let i=w;i<=al.pr.length;i++){o.push({d:al.d[i-1],c:corr(al.pr.slice(i-w,i),al.sr.slice(i-w,i))});}return o;}
function trend(sid){ // 以數列自己的觀察值算 20 日趨勢
  const s=S(sid); if(!s||s.v.length<30) return null; const v=s.v,n=v.length;
  const sma=(e,w)=>mean(v.slice(e-w,e)); const now=sma(n,20),prev=sma(n-5,20),last=v[n-1];
  const dir=(last>now&&now>prev)?1:(last<now&&now<prev)?-1:0;
  const chg=meta(sid).chg||"diff"; const base=v[Math.max(0,n-21)];
  const d20=chg==="pct"?(last/base-1)*100:last-base;
  return {dir,last,d20,chg,date:s.d[n-1]};
}
const fmt=(x,nd=2)=>x===null||x===undefined||isNaN(x)?"—":(+x).toFixed(nd);
const sgn=(x,nd=2)=>x===null||x===undefined||isNaN(x)?"—":(x>=0?"+":"")+(+x).toFixed(nd);
const arrow=d=>d>0?"▲":d<0?"▼":"▬";

/* ───── A 環境燈號 ───── */
function renderA(){
  const rows=[]; let score=0,cnt=0;
  for(const id of LIGHT_IDS){ const t=trend(id); if(!t) continue; const al=aligned(id); const c250=corrN(al,250), c60=corrN(al,60);
    let imp=0; if(c250!==null&&Math.abs(c250)>=MIN_ABS_CORR) imp=t.dir*Math.sign(c250);
    if(c250!==null&&Math.abs(c250)>=MIN_ABS_CORR){score+=imp;cnt++;}
    rows.push({id,t,c250,c60,imp});}
  const avg=cnt?score/cnt:0, lab=avg>=0.34?"偏多":avg<=-0.34?"偏空":"中性", cls=avg>=0.34?"bull":avg<=-0.34?"bear":"mut";
  $("#Asub").innerHTML=`對 <b>${prod}</b>：各數列 20 日趨勢（現值高於 20 日均線且均線上揚＝上行）依「近 250 日實測相關方向」映射成偏多／偏空，相關絕對值低於 ${MIN_ABS_CORR} 的不計分。規則式、非預測。`;
  let h=`<div style="margin:2px 0 10px"><span class="score ${cls}">宏觀分數 ${sgn(avg)}　${lab}</span> <span class="mut">（${cnt} 個有效數列平均，+1 全偏多／−1 全偏空）</span></div><div class="tiles">`;
  for(const r of rows){ const chip=r.imp>0?'<span class="chip b">偏多</span>':r.imp<0?'<span class="chip s">偏空</span>':'<span class="chip">中性／無關</span>';
    h+=`<div class="tile"><div class="n">${nm(r.id)} · ${r.t.date}</div><div class="v">${fmt(r.t.last,r.t.last>100?1:3)} <span class="${r.t.dir>0?"bull":r.t.dir<0?"bear":"mut"}" style="font-size:13px">${arrow(r.t.dir)}</span></div>
    <div class="mut">20 日 ${r.t.chg==="pct"?sgn(r.t.d20)+"%":sgn(r.t.d20,3)}　相關(250日) ${fmt(r.c250)}</div><div>${chip}</div></div>`;}
  h+="</div>";
  // 月頻公布值（不進分數）
  const mt=[]; for(const id of ["CPIAUCSL","CPILFESL","PAYEMS","UNRATE"]){const s=S(id); if(!s||s.v.length<14) continue; const n=s.v.length;
    let cur,prev,u;
    if(id==="PAYEMS"){cur=s.v[n-1]-s.v[n-2];prev=s.v[n-2]-s.v[n-3];u="千人（近似，初次公布版）";}
    else if(id==="UNRATE"){cur=s.v[n-1];prev=s.v[n-2];u="%";}
    else {cur=(s.v[n-1]/s.v[n-13]-1)*100;prev=(s.v[n-2]/s.v[n-14]-1)*100;u="% 年增";}
    mt.push(`<div class="tile"><div class="n">${nm(id)} · ${s.d[n-1].slice(0,7)}（公布 ${s.a[n-1]}）</div><div class="v">${fmt(cur,id==="PAYEMS"?0:2)}</div><div class="mut">前期 ${fmt(prev,id==="PAYEMS"?0:2)}　${u}</div></div>`);}
  if(mt.length) h+=`<p class="sub" style="margin-top:10px">最新公布（不進分數）</p><div class="tiles">${mt.join("")}</div>`;
  $("#Abody").innerHTML=h;
}

/* ───── B 走勢小圖 ───── */
function bSeries(id){ // 回傳 [{x:天數,y:值}] 與說明
  const s=S(id); if(!s) return null; const mt=meta(id); const pts=[]; let label="";
  if(mt.freq==="D"){for(let i=0;i<s.d.length;i++)pts.push({x:dayNum(s.d[i]),y:s.v[i],t:s.d[i]});label="日";}
  else if(id==="CPIAUCSL"||id==="CPILFESL"||id==="PCEPI"||id==="GBRCPIALLMINMEI"){for(let i=12;i<s.d.length;i++)pts.push({x:dayNum(s.a[i]),y:(s.v[i]/s.v[i-12]-1)*100,t:s.a[i],step:1});label="年增%（公布日起）";}
  else if(id==="PAYEMS"){for(let i=1;i<s.d.length;i++)pts.push({x:dayNum(s.a[i]),y:s.v[i]-s.v[i-1],t:s.a[i],step:1});label="單月變動（千人）";}
  else {for(let i=0;i<s.d.length;i++)pts.push({x:dayNum(s.a[i]),y:s.v[i],t:s.a[i],step:1});label="月頻（公布日起）";}
  return {pts,label};
}
function drawCard(cv,sid,tipEl){
  const bs=bSeries(sid), p=E.prices[prod]; if(!bs||!p) return;
  const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight; cv.width=W*dpr;cv.height=H*dpr;
  const g=cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0);
  const pl=[]; for(let i=0;i<p.d.length;i++) pl.push({x:dayNum(p.d[i]),y:p.c[i],t:p.d[i]});
  const lastX=pl.length?pl[pl.length-1].x:0, x1=lastX; let x0=RANGE>0?pl[Math.max(0,pl.length-RANGE)].x:pl[0].x;
  const a=bs.pts.filter(q=>q.x>=x0&&q.x<=x1+30), b=pl.filter(q=>q.x>=x0);
  if(a.length<2||b.length<2){g.fillStyle="#888";g.fillText("此區間沒有足夠資料",10,20);return;}
  const css=getComputedStyle(document.documentElement),cA="#4c8dff",cB="#e0a030",line=css.getPropertyValue("--line").trim(),mut=css.getPropertyValue("--mut").trim();
  const padL=6,padR=6,padT=6,padB=16; const X=x=>padL+(x-x0)/(Math.max(x1,a[a.length-1].x)-x0||1)*(W-padL-padR);
  const rngY=arr=>{let lo=Infinity,hi=-Infinity;arr.forEach(q=>{if(q.y<lo)lo=q.y;if(q.y>hi)hi=q.y;});if(hi===lo){hi=lo+1;}const m=(hi-lo)*.06;return [lo-m,hi+m];};
  const [la,ha]=rngY(a),[lb,hb]=rngY(b); const YA=y=>padT+(1-(y-la)/(ha-la))*(H-padT-padB),YB=y=>padT+(1-(y-lb)/(hb-lb))*(H-padT-padB);
  g.strokeStyle=line;g.lineWidth=1;g.strokeRect(.5,.5,W-1,H-1);
  const path=(pts,Y,col,w,step)=>{g.beginPath();g.strokeStyle=col;g.lineWidth=w;let first=true,py=0;pts.forEach(q=>{const x=X(q.x),y=Y(q.y);if(first){g.moveTo(x,y);first=false;}else{if(step)g.lineTo(x,py);g.lineTo(x,y);}py=y;});g.stroke();};
  path(b,YB,cB,1.2,false); path(a,YA,cA,1.8,!!a[0].step);
  g.fillStyle=mut;g.font="10px sans-serif";g.fillText(b[0].t,padL+2,H-4);const te=b[b.length-1].t,tw=g.measureText(te).width;g.fillText(te,W-padR-tw-2,H-4);
  cv._m={a,b,X,YA,YB,W,H,la,ha,lb,hb,x0};
  cv.onmousemove=e=>{const r=cv.getBoundingClientRect(),mx=e.clientX-r.left;const x=x0+(mx-padL)/(W-padL-padR)*((Math.max(x1,a[a.length-1].x))-x0);
    const nb=arr=>{let best=arr[0],bd=1e18;for(const q of arr){const d=Math.abs(q.x-x);if(d<bd){bd=d;best=q;}}return best;};
    const qa=nb(a),qb=nb(b); tipEl.textContent=`${qa.t}: ${fmt(qa.y,Math.abs(qa.y)>100?1:3)}　${prod} ${qb.t}: ${fmt(qb.y,2)}`;};
  cv.onmouseleave=()=>{tipEl.textContent="";};
}
function renderB(){
  const grid=$("#Bgrid"); grid.innerHTML=""; const items=[];
  for(const id of B_IDS){ if(!S(id)) continue; const bs=bSeries(id); const card=document.createElement("div"); card.className="card";
    card.innerHTML=`<h3>${nm(id)} <span class="mut">· ${bs.label}</span><span class="legend"><i style="background:#4c8dff"></i>${id==="US_UK_10Y_SPREAD"?"利差":"數列"}<i style="background:#e0a030"></i>${prod}</span></h3><div class="tip"></div><canvas></canvas>`;
    grid.appendChild(card); items.push([card.querySelector("canvas"),id,card.querySelector(".tip")]);}
  requestAnimationFrame(()=>items.forEach(([c,id,t])=>drawCard(c,id,t)));
}

/* ───── C 事件與反應 ───── */
let EV_FILTER="";
function renderC(){
  const rs=E.reactions.filter(r=>r.y===prod), hasM1=rs.length>0;
  let rows=[]; let basis="";
  if(hasM1){rows=rs.map(r=>({t:r.t,n:r.n,z:r.z,r5:r.r5,r15:r.r15,r60:r.r60})); basis="ATR";
    $("#Csub").innerHTML=`反應 ＝（公布後 N 分鐘收盤 − 公布前一分鐘收盤）÷ 公布前 M5 ATR(14)，來源：你的 M1 旁表。<b>surprise</b> 預設以「公布值 − 前值」代理（沒有市場預期值），再除以該事件歷史的穩健尺度（MAD，z）。中位數與樣本數 n 為主；n 小於 10 僅供參考。`;}
  else{ // 日級備援：事件日收盤 vs 前一日收盤，以 20 日報酬標準差標準化
    const p=E.prices[prod]; basis="日級σ";
    if(p){const idx=new Map(p.d.map((d,i)=>[d,i]));const ret=[];for(let i=1;i<p.c.length;i++)ret.push(p.c[i]/p.c[i-1]-1);
      for(const ev of E.events){const d=ev.t.slice(0,10),i=idx.get(d); if(i===undefined||i<22) continue; const sg=sd(ret.slice(i-21,i-1)); if(!sg) continue; const r=(p.c[i]/p.c[i-1]-1)/sg; rows.push({t:ev.t,n:ev.n,z:ev.z,r5:null,r15:null,r60:r});}}
    $("#Csub").innerHTML=`<span class="warn">${prod} 沒有 M1 資料，無法算公布後 5／15／60 分鐘反應</span>；改列「事件當日日報酬 ÷ 近 20 日日報酬標準差」（日級、粗略）。要精確反應請在 econ_config.ini 為此產品設定 M1 檔。`;}
  if(!rows.length){$("#Cbody").innerHTML='<p class="mut">沒有可用的事件資料。</p>';return;}
  const names=[...new Set(rows.map(r=>r.n))].sort(); 
  const ZT=0.25; let h="";
  h+=`<div class="scroll"><table><tr><th class="l">事件</th><th class="l">驚喜</th><th>n</th>${hasM1?"<th>5 分</th><th>15 分</th><th>60 分</th>":"<th>當日(σ)</th>"}<th>與驚喜同向</th></tr>`;
  for(const n of names){ for(const [lab,f] of [["高於前值（z>"+ZT+"）",r=>r.z>ZT],["低於前值（z<−"+ZT+"）",r=>r.z<-ZT]]){
      const g=rows.filter(r=>r.n===n&&f(r)); if(!g.length) continue;
      const key=hasM1?"r15":"r60"; const vals=g.map(r=>r[key]).filter(v=>v!==null); const sgnZ=lab.startsWith("高")?1:-1;
      const agree=vals.length?vals.filter(v=>Math.sign(v)===sgnZ).length/vals.length:null;
      const cell=k=>{const m=med(g.map(r=>r[k]).filter(v=>v!==null));return m===null?"<td>—</td>":`<td class="${m>0?"bull":m<0?"bear":""}">${sgn(m)}</td>`;};
      h+=`<tr><td class="l">${n}</td><td class="l">${lab}</td><td>${g.length}${g.length<10?' <span class="warn" title="樣本少">⚠</span>':""}</td>${hasM1?cell("r5")+cell("r15")+cell("r60"):cell("r60")}<td>${agree===null?"—":Math.round(agree*100)+"%"}</td></tr>`;}}
  h+=`</table></div><p class="mut" style="margin:6px 0">數字＝中位數（單位：${basis}）；綠＝價格上漲、紅＝下跌。「與驚喜同向」＝反應方向與驚喜方向同號的比例（${hasM1?"15 分":"當日"}）；遠低於 50% 代表反向關係（例如通膨高於前值、黃金反而跌），遠高於 50% 代表同向。看實測，不預設方向。</p>`;
  const opts=['<option value="">全部事件</option>'].concat(names.map(n=>`<option ${EV_FILTER===n?"selected":""}>${n}</option>`));
  const list=rows.filter(r=>!EV_FILTER||r.n===EV_FILTER).slice(-30).reverse();
  h+=`<div style="margin:8px 0 4px"><b>最近事件</b> <select id="evf">${opts.join("")}</select> <span class="mut">只列已公布；未來事件需要日曆資料（FRED 沒有預告）。</span></div><div class="scroll"><table><tr><th class="l">時間(UTC)</th><th class="l">事件</th><th>驚喜 z</th>${hasM1?"<th>5 分</th><th>15 分</th><th>60 分</th>":"<th>當日(σ)</th>"}</tr>`;
  const c=v=>v===null?"<td>—</td>":`<td class="${v>0?"bull":v<0?"bear":""}">${sgn(v)}</td>`;
  for(const r of list) h+=`<tr><td class="l">${r.t}</td><td class="l">${r.n}</td><td>${sgn(r.z)}</td>${hasM1?c(r.r5)+c(r.r15)+c(r.r60):c(r.r60)}</tr>`;
  h+="</table></div>";
  $("#Cbody").innerHTML=h; const sel=$("#evf"); if(sel) sel.onchange=()=>{EV_FILTER=sel.value;renderC();};
}

/* ───── D 滾動相關 ───── */
let D_SEL="DFII10";
function renderD(){
  const ids=["DTWEXBGS","DFII10","DGS2","DGS10","T10YIE","VIXCLS","DEXUSUK"].filter(id=>S(id)&&!(prod==="GBPUSD"&&id==="DEXUSUK"));
  $("#Dsub").innerHTML=`用「日變化」算相關（價位相關常是假象）。${prod} 日報酬 vs 數列日變化。<span class="warn">警示</span>＝近 60 日相關偏離近 250 日滾動 60 日相關均值超過 1.5 個標準差，代表老規律可能失效。beta（近 60 日）：「%／%」＝數列漲 1% 時產品平均動幾 %（美元指數、VIX 這類）；「%／點」＝殖利率等數列變動 1 個百分點時產品平均動幾 %。`;
  let h=`<div class="scroll"><table><tr><th class="l">數列</th><th>20 日</th><th>60 日</th><th>120 日</th><th>250 日</th><th>beta(60日)</th><th class="l">狀態</th></tr>`;
  const cc=v=>v===null?"<td>—</td>":`<td class="${v>.3?"bull":v<-.3?"bear":"mut"}">${sgn(v)}</td>`;
  for(const id of ids){const al=aligned(id); if(!al||al.pr.length<60) continue;
    const roll=rolling(al,60).slice(-250).map(r=>r.c).filter(v=>v!==null); const c60=corrN(al,60); let st='<span class="mut">正常</span>';
    if(roll.length>60&&c60!==null){const m=mean(roll),s=sd(roll); if(s>0&&Math.abs(c60-m)>1.5*s) st=`<span class="warn">⚠ 偏離（均值 ${sgn(m)}）</span>`;}
    const b=beta(lastN(al.sr,60),lastN(al.pr,60));
    h+=`<tr><td class="l"><a href="#" data-d="${id}" style="color:var(--acc);text-decoration:none">${nm(id)}</a></td>${cc(corrN(al,20))}${cc(c60)}${cc(corrN(al,120))}${cc(corrN(al,250))}<td>${b===null?"—":((meta(id).chg==="pct")?sgn(b,2)+" %／%":sgn(b*100,2)+" %／點")}</td><td class="l">${st}</td></tr>`;}
  h+=`</table></div><div style="margin-top:10px"><b>${nm(D_SEL)}</b> 與 ${prod} 的 60 日滾動相關 <span class="mut">（灰帶＝近 250 日均值 ±1.5σ）</span></div><div class="card" style="margin-top:4px"><div class="tip"></div><canvas id="dcv"></canvas></div>`;
  $("#Dbody").innerHTML=h; $("#Dbody").querySelectorAll("a[data-d]").forEach(a=>a.onclick=e=>{e.preventDefault();D_SEL=a.dataset.d;renderD();});
  requestAnimationFrame(drawRoll);
}
function drawRoll(){
  const cv=$("#dcv"); if(!cv) return; const al=aligned(D_SEL); if(!al) return; const roll=rolling(al,60).filter(r=>r.c!==null);
  const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight; cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext("2d");g.setTransform(dpr,0,0,dpr,0,0);
  const pts=RANGE>0?roll.slice(-RANGE):roll; if(pts.length<2){g.fillText("資料不足",10,20);return;}
  const css=getComputedStyle(document.documentElement),line=css.getPropertyValue("--line").trim(),mut=css.getPropertyValue("--mut").trim();
  const padL=30,padR=6,padT=6,padB=16; const X=i=>padL+i/(pts.length-1)*(W-padL-padR),Y=v=>padT+(1-(v+1)/2)*(H-padT-padB);
  g.strokeStyle=line;g.strokeRect(.5,.5,W-1,H-1);
  const tail=roll.slice(-250).map(r=>r.c); if(tail.length>60){const m=mean(tail),s=sd(tail);g.fillStyle="rgba(150,150,150,.18)";g.fillRect(padL,Y(Math.min(1,m+1.5*s)),W-padL-padR,Y(Math.max(-1,m-1.5*s))-Y(Math.min(1,m+1.5*s)));}
  g.strokeStyle=line;[-1,-.5,0,.5,1].forEach(v=>{g.beginPath();g.moveTo(padL,Y(v));g.lineTo(W-padR,Y(v));g.stroke();g.fillStyle=mut;g.font="10px sans-serif";g.fillText(v.toFixed(1),2,Y(v)+3);});
  g.beginPath();g.strokeStyle="#4c8dff";g.lineWidth=1.8;pts.forEach((r,i)=>{const x=X(i),y=Y(r.c);i?g.lineTo(x,y):g.moveTo(x,y);});g.stroke();
  g.fillStyle=mut;g.fillText(pts[0].d,padL+2,H-4);const te=pts[pts.length-1].d;g.fillText(te,W-padR-g.measureText(te).width-2,H-4);
  const tip=cv.parentNode.querySelector(".tip");cv.onmousemove=e=>{const r=cv.getBoundingClientRect(),i=Math.round((e.clientX-r.left-padL)/(W-padL-padR)*(pts.length-1));const q=pts[Math.max(0,Math.min(pts.length-1,i))];tip.textContent=q.d+"  相關 "+sgn(q.c);};cv.onmouseleave=()=>{tip.textContent="";};
}

/* ───── 初始化 ───── */
function renderAll(){renderA();renderB();renderC();renderD();}
function start(){
  E=window.ECON; $("#nodata").style.display="none"; $("#app").style.display="";
  const syms=Object.keys(E.prices); if(!syms.length){fail("資料裡沒有任何產品價格。請在 econ_config.ini 的 [prices] 設定 M1 檔後重新執行 update.bat。");return;}
  if(!syms.includes(prod)) prod=syms[0];
  $("#prod").innerHTML=syms.map(s=>`<option ${s===prod?"selected":""}>${s}</option>`).join("");
  const fu=(E.fred_updated||E.updated.slice(0,10)).replace(/\./g,"-"); const ageDays=(Date.now()-new Date(fu+"T00:00:00"))/864e5;
  const miss=["DTWEXBGS","DFII10","DGS10","DGS2","T10YIE","DFF","VIXCLS","CPIAUCSL","CPILFESL","PAYEMS","UNRATE"].filter(id=>!S(id));
  $("#status").innerHTML=`價格更新 ${E.updated}｜FRED 更新 ${E.fred_updated||"?"}${ageDays>3?' <span class="warn">（FRED 資料已 '+Math.floor(ageDays)+' 天沒更新，請執行 update.bat）</span>':""}${(E.stale&&E.stale.length)?' <span class="warn">｜停更：'+E.stale.join(",")+"</span>":""}${miss.length?' <span class="warn">｜缺數列：'+miss.join(",")+"（見 update_report.txt）</span>":""}`;
  renderAll();
}
function fail(msg){$("#app").style.display="none";const n=$("#nodata");n.style.display="";n.innerHTML=msg+'<p><button id="pick">選擇 econ_data.js…</button><input type="file" id="pf" accept=".js" hidden></p>';
  $("#pick").onclick=()=>$("#pf").click();$("#pf").onchange=async()=>{const f=$("#pf").files[0];if(!f)return;try{const t=await f.text();new Function(t)();start();}catch(e){fail("讀取失敗："+e);}};}
$("#prod").onchange=()=>{prod=$("#prod").value;renderAll();};
$("#rng").onclick=e=>{const b=e.target.closest("button");if(!b)return;RANGE=+b.dataset.r;document.querySelectorAll("#rng button").forEach(x=>x.classList.toggle("on",x===b));renderB();renderD();};
window.addEventListener("resize",()=>{if(E)renderB(),drawRoll();});
if(window.__noData||!window.ECON) fail("找不到 data/econ_data.js。請先雙擊 update.bat 產生資料，或用下面的按鈕選擇檔案。"); else start();
</script>
