  .chip{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .count{font-size:13px;color:var(--muted);margin:10px 2px}

  /* cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}

  .b-twd{background:var(--twd-soft);color:var(--twd)}
  .b-usd{background:var(--usd-soft);color:var(--usd)}
  .b-unk{background:var(--warn-soft);color:var(--warn)}

  .goals{display:flex;flex-wrap:wrap;gap:6px}
  .goal{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
  .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;background:var(--bg);border-radius:8px;padding:8px;text-align:center}
  .meta b{display:block;font-size:13px;color:var(--text)}
  .meta span{color:var(--muted)}
  .fit{font-size:13px}
  .fit b{color:var(--accent)}
  .watch{font-size:12px;color:var(--warn)}
  .links{display:flex;gap:6px;margin-top:auto}
  .btn{flex:1;text-align:center;font-size:12px;padding:6px 0;border:1px solid var(--line);border-radius:8px;color:var(--accent);text-decoration:none}
  .btn.off{color:var(--muted);pointer-events:none;opacity:.5}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
  .foot{font-size:11px;color:var(--muted);margin:18px 2px;line-height:1.6}
  @media (max-width:600px){ .meta{font-size:11px} .wrap{padding:10px} }
</style>

  const a=[...list];
  switch(st.sort){
    case "name": return a.sort((x,y)=>x.name.localeCompare(y.name,"zh-Hant"));
    case "ageMin": return a.sort((x,y)=>(x.ageMin??999)-(y.ageMin??999));
    case "risk": return a.sort((x,y)=>RISK[x.risk]-RISK[y.risk]);
    case "liq": return a.sort((x,y)=>LIQ[y.liq]-LIQ[x.liq]);
    default: return a;
  }
}
function card(p){
  const curCls = p.cur==="美元" ? "b-usd" : "b-twd";
  const age = p.ageMin===null ? `<span class="badge b-unk">年齡待確認</span>` : "";
  const ageTxt = p.ageMin===null ? "未標示" : `${p.ageMin}–${p.ageMax}歲`;
  const goals = p.goals.map(g=>`<span class="goal">${g}</span>`).join("");
  return `
  <article class="card">
    <div class="top"><span class="badge b-cat">${p.cat}</span><span class="badge ${curCls}">${p.cur}</span></div>
    <h2 class="name">${p.name}</h2>
    <div class="goals">${goals}</div>
    <div class="meta">
      <div><span>承保年齡</span><b>${ageTxt}</b></div>
      <div><span>風險</span><b>${p.risk}</b></div>
      <div><span>流動性</span><b>${p.liq}</b></div>
    </div>
    <div class="fit"><b>適合：</b>${p.fit}</div>
    <div class="watch">⚠ ${p.watch}</div>
    <div class="links">
      <a class="btn ${p.dm?"":"off"}" href="${p.dm||"#"}" target="_blank" rel="noopener">DM</a>
      <a class="btn" href="${p.pd}" target="_blank" rel="noopener">商品頁</a>
      ${p.tg?`<a class="btn" href="${p.tg}" target="_blank" rel="noopener">標的</a>`:""}
    </div>
  </article>`;
}
function render(){
  $("sub").textContent=`共 ${P.length} 項（保障型商品列表，第 10 頁待補） · 點選卡片按鈕可看 DM / 商品頁`;
  const list=sorted(P.filter(matches));
  $("count").textContent=`符合 ${list.length} / ${P.length} 項`;
  $("grid").innerHTML = list.length ? list.map(card).join("") : `<div class="empty">沒有符合條件的商品，試著放寬篩選</div>`;
}

document.querySelectorAll("#cur .chip").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll("#cur .chip").forEach(x=>x.setAttribute("aria-pressed","false"));
  b.setAttribute("aria-pressed","true"); st.cur=b.dataset.v; render();
}));
document.querySelectorAll("#goal .chip").forEach(b=>b.addEventListener("click",()=>{
  const on=b.getAttribute("aria-pressed")!=="true";
  b.setAttribute("aria-pressed",String(on));
  on?st.goals.add(b.dataset.v):st.goals.delete(b.dataset.v); render();
}));
$("q").addEventListener("input",e=>{st.q=e.target.value.trim();render();});
$("age").addEventListener("input",e=>{st.age=e.target.value===""?null:Number(e.target.value);render();});
$("risk").addEventListener("change",e=>{st.risk=e.target.value;render();});
$("sort").addEventListener("change",e=>{st.sort=e.target.value;render();});
render();
</script>
</body>
</html>
